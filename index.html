813","q":"<p>What adjustment is made to the calculated SPAN scanning risk to adjust for offsetting futures positions, particularly in the context of contracts close to expiry?<\/p>","o":[{"l":"A","h":"Spot month charges"},{"l":"B","h":"Variation margin"},{"l":"C","h":"Inter-commodity spread margin"},{"l":"D","h":"Short-option minimum charge"}],"a":"A","e":"<p>Spot month charges are applied in SPAN to account for the additional risks associated with contracts nearing delivery, particularly to ensure that those holding positions are prepared for delivery. This adjustment helps mitigate the speculative and delivery pressures by increasing initial margin requirements for these positions.<\/p>"},{"s":6,"n":61,"id":"1015826","q":"<p>A clearing house guarantees the trades of:<\/p>","o":[{"l":"A","h":"All clearing members"},{"l":"B","h":"General clearing members only"},{"l":"C","h":"All clearing members and their customers"},{"l":"D","h":"Clearing members' customers only"}],"a":"A","e":"<p>A clearing house only guarantees the trades of its member firms. This includes both types of clearing member - general and individual.<\/p>"},{"s":6,"n":62,"id":"1002793","q":"<p>Futures spread margin is lower than initial margin rates because:<\/p>","o":[{"l":"A","h":"The potential losses are known beforehand on a spread trade"},{"l":"B","h":"The perceived risk of a spread is lower than an outright trade"},{"l":"C","h":"Futures spreads always increase in bull markets and decrease in bear markets"},{"l":"D","h":"If a spread order cannot be executed with one trade, it may be declared void by the clearing house"}],"a":"B","e":"<p>The risk of a spread is lower than two separate open long- and short-positions. Thus, margin requirements are lower for the spread.<\/p>"},{"s":6,"n":63,"id":"1015782","q":"<p>What is the BEST definition of clearing?<\/p>","o":[{"l":"A","h":"Recording and matching trades and maintaining positions"},{"l":"B","h":"Ensure legal obligations resulting from a trade are met"},{"l":"C","h":"Continuous trading activity throughout the trading day"},{"l":"D","h":"Using derivatives that will be physically-delivered"}],"a":"A","e":"<p>This is a difficult question which is not particularly well worded. Technically speaking clearing and settlement are two separate processes. 'Ensure legal obligations resulting from a trade are met' best describes settlement and 'recording and matching trades and maintaining positions' is closer to the process of clearing, which describes what happens before settlement.<\/p>"},{"s":6,"n":64,"id":"1002810","q":"<p>Which of the following is operated by a clearing house using a default fund?<\/p>","o":[{"l":"A","h":"Initial guarantee"},{"l":"B","h":"Mutual guarantee"},{"l":"C","h":"Independent guarantee"},{"l":"D","h":"No guarantee"}],"a":"B","e":"<p>A clearing house provides mutual guarantees to its clearing members. This involves guarantees not only from the clearing house but also from its members. An independent guarantee, as operated by other clearing houses, is one which is backed by the clearing house alone.<\/p>"},{"s":6,"n":65,"id":"4211300","q":"<p>How does an inter-commodity spread benefit traders in terms of margin requirements, and what is a key factor that determines the extent of this benefit?<\/p>","o":[{"l":"A","h":". It allows traders to avoid initial margin requirements entirely due to the non-correlation of contracts."},{"l":"B","h":"It reduces margin requirements by recognizing the correlation of price movements, with the extent depending on the level of correlation between contracts."},{"l":"C","h":"It increases margin requirements due to the speculative nature of trading multiple commodities."},{"l":"D","h":"It eliminates the need for variation margins by locking in fixed prices for all contracts."}],"a":"B","e":"<p>Inter-commodity spreads benefit traders by reducing margin requirements, as exchanges recognize the lower risk associated with correlated price movements between different commodities. The extent of the margin reduction depends on how closely the price movements of the contracts are correlated, with higher correlations typically leading to greater margin offsets.<\/p>"},{"s":6,"n":66,"id":"1016986","q":"<p>In the event of a default by an exchange member, which of the following is the best description of what will happen if the clearing house offers an independent guarantee?<\/p>","o":[{"l":"A","h":"The resources of the clearing house can be used to close-out the position"},{"l":"B","h":"The resources of the clearing house and the clearing house members will be used to close-out the position"},{"l":"C","h":"The resources of the members of the clearing house only will be used"},{"l":"D","h":"The resources of only the defaulting member will be used"}],"a":"A","e":"<p>If an exchange is using an independent guarantee then after using clearing member margin, its resources will be used in the event of a default by a clearing member.<br/> ICE Clear Europe uses a mutual guarantee where both the clearing house and members' resources are used.<\/p>"},{"s":6,"n":67,"id":"1002791","q":"<p>Which of the following is NOT true of initial margin?<\/p>","o":[{"l":"A","h":"It can be varied"},{"l":"B","h":"It represents the risk perceived from writing an option position"},{"l":"C","h":"It is payable on short-futures positions only"},{"l":"D","h":"It is a deposit charged by the ICE Clear Europe on newly-opened positions"}],"a":"C","e":"<p>Initial margin is a goodwill deposit required by ICE Clear Europe from everyone who opens a position in futures, options on futures or short equity options.<\/p>"},{"s":6,"n":68,"id":"1002804","q":"<p>Which type of margin is used by a clearing house when there are sudden changes in market volatility?<\/p>","o":[{"l":"A","h":"Initial"},{"l":"B","h":"Variation"},{"l":"C","h":"Spot month"},{"l":"D","h":"Intra day"}],"a":"D","e":"<p>Intra day margin is used for emergency situations such as a sudden increase in volatility.<\/p>"},{"s":6,"n":69,"id":"1015774","q":"<p>What best describes a mutual offset system?<\/p>","o":[{"l":"A","h":"More than one exchange uses the same clearing house"},{"l":"B","h":"A trade on one exchange can be offset on another"},{"l":"C","h":"Exchanges share reporting information"},{"l":"D","h":"Exchanges guarantee each others' trades"}],"a":"B","e":"<p>A mutual offset system is operated between the CME and SGX.<\/p>"},{"s":6,"n":70,"id":"1015835","q":"<p>Which of the following is a major role provided by ICE Clear Europe?<\/p>","o":[{"l":"A","h":"They guarantee the performance of contracts"},{"l":"B","h":"They are responsible for an orderly market"},{"l":"C","h":"They guarantee the availability of the underlying asset"},{"l":"D","h":"They guarantee that no member will default"}],"a":"A","e":"<p>This is the major role of ICE Clear Europe.<\/p>"},{"s":6,"n":71,"id":"1037007","q":"<p>Who is only able to clear trades on behalf of themselves and their clients?<\/p>","o":[{"l":"A","h":"Trade members"},{"l":"B","h":"General clearing member"},{"l":"C","h":"Non clearing member"},{"l":"D","h":"Individual clearing member"}],"a":"D","e":"<p>This refers to the rights of individual clearing members. GCMs can clear on behalf of non-clearing members as well.<\/p>"},{"s":6,"n":72,"id":"1002792","q":"<p>Variation margin can be described as:<\/p>","o":[{"l":"A","h":"Realised profits and losses"},{"l":"B","h":"Realised losses only"},{"l":"C","h":"Unrealised profits and losses"},{"l":"D","h":"Unrealised losses only"}],"a":"C","e":"<p>Variation margin is the amount of money paid to, or received from, ICE Clear Europe each day after marking the position to market. Note: profits and losses are realised at the earlier of delivery or closing-out a position.<\/p>"},{"s":6,"n":73,"id":"1036866","q":"<p>Novation moves which of the following risks?<\/p>","o":[{"l":"A","h":"Counterparty risk"},{"l":"B","h":"Principal risk"},{"l":"C","h":"Settlement risk"},{"l":"D","h":"Trading risk"}],"a":"A","e":"<p>The risk that the other side of the transaction will default is reduced<br/> because it is replaced by one of the CCPs, both of which are well capitalised and have insurance<br/> policies in place lessening the risk of default. This reduces the risk of systemic collapse of the<br/> financial system.<\/p>"},{"s":6,"n":74,"id":"1002786","q":"<p>For which of the following transactions will initial margin always be paid?<\/p><p class=\"rom\"><b>I<\/b> Buying futures<\/p><p class=\"rom\"><b>II<\/b> Long-options position<\/p><p class=\"rom\"><b>III<\/b> Short-options position<\/p><p class=\"rom\"><b>IV<\/b> Selling futures<\/p>","o":[{"l":"A","h":"I and IV"},{"l":"B","h":"II and III"},{"l":"C","h":"I, III, IV"},{"l":"D","h":"I, II, III, IV"}],"a":"C","e":"<p>Margin is not paid by long equity option positions as the premium is paid in full the business day after the trade. It is paid for other derivative positions. <\/p>"},{"s":6,"n":75,"id":"1016984","q":"<p>Taking into account offsetting position, as a contract approaches delivery, which of the following types of margin is triggered?<\/p>","o":[{"l":"A","h":"Intra-day margin"},{"l":"B","h":"Spot month margin"},{"l":"C","h":"Maintenance margin"},{"l":"D","h":"Initial margin"}],"a":"B","e":"<p>The best answer and most literal answer is spot month margin, as this is a margin which is specifically payable in the delivery month.<\/p>"},{"s":6,"n":76,"id":"1002809","q":"<p>Which of the following is true regarding initial margin, as calculated by SPAN, for bear spreads?<\/p>","o":[{"l":"A","h":"It is reduced due to capped profits and losses"},{"l":"B","h":"SPAN ignores margin for spreads"},{"l":"C","h":"It is replaced by spot margining"},{"l":"D","h":"It is only required if undertaken with puts"}],"a":"A","e":"<p>All vertical spreads result in capped profits and losses, thus initial margin is reduced.<\/p>"},{"s":6,"n":77,"id":"1015833","q":"<p>Under which of the following conditions might a broker pay margin money to a customer?<\/p>","o":[{"l":"A","h":"During delivery"},{"l":"B","h":"As a consequence of calculating spreads"},{"l":"C","h":"As a result of marking-to-market"},{"l":"D","h":"When processing an intra-day margin call"}],"a":"C","e":"<p>Marking-to-market is the process by which the contract is revalued, normally on a daily basis. Variation margin is calculated following the marking-to-market process. This could result in a variation margin credit which would be paid to the broker, who in turn would pay their client.<\/p>"},{"s":6,"n":78,"id":"1002801","q":"<p>Client A buys a future through Broker A. Client B sells the future through Broker B. Which of the following best describes the flow of variation margin?<\/p>","o":[{"l":"A","h":"Client A - broker A - client B - broker B"},{"l":"B","h":"Client A - broker A - broker B - client B"},{"l":"C","h":"Client A - broker A - client B"},{"l":"D","h":"Client A - clearing house - client B"}],"a":"B","e":"<p>We are assuming here that the clients are not clearing members of the clearing house but the brokers are clearing members.<\/p><p>Whilst Client A -&gt; Broker A -&gt; Clearing House -&gt; Broker B -&gt; Client B is the best way to summarise the flow, as in any multiple choice question, you can only choose from the answers that you are given. B is the best of the four choices offered.<\/p>"},{"s":6,"n":79,"id":"1017045","q":"<p>A trader sells futures on XYZ plc shares. If he is unable to meet his commitments, which body will be responsible for making payments to compensate the counterparties?<\/p>","o":[{"l":"A","h":"The parent bank"},{"l":"B","h":"The exchange"},{"l":"C","h":"The clearing house"},{"l":"D","h":"The long"}],"a":"C","e":"<p>Assuming this is a centrally cleared contract, the central counterparty or clearing house will be responsible for guaranteeing the trade.<\/p>"},{"s":6,"n":80,"id":"1002788","q":"<p>When a client pays initial margin on a futures trade, they would consider it:<\/p>","o":[{"l":"A","h":"Non-returnable"},{"l":"B","h":"Returnable only if the position is closed-out"},{"l":"C","h":"Returnable only if there is delivery"},{"l":"D","h":"Returnable after a position is closed, provided that variation margin payments are met"}],"a":"D","e":"<p>Initial margin is a goodwill deposit held by ICE Clear Europe until the trade is closed-out or delivered. This is only true if the client has met all variation margin commitments in the mean time.<\/p>"},{"s":6,"n":81,"id":"1026834","q":"<p>On ICE Futures Europe a member who trades and clears only for their own account electronically will be referred to as:<\/p>","o":[{"l":"A","h":"Remote"},{"l":"B","h":"Individual"},{"l":"C","h":"General"},{"l":"D","h":"Self"}],"a":"B","e":"<p>ICE Futures Europe uses the term individual clearing member to describe this kind of member. The method of communication is not relevant to the question.<\/p><p>Remember, just because you are a member of an exchange it doesn't mean that you have to trade for clients. You can just be a dealer member which means that you only need to clear your own trades.<\/p>"},{"s":6,"n":82,"id":"1036708","q":"<p>Which of the following is a difference between a UK clearing house’s initial margin and variation margin?<\/p>","o":[{"l":"A","h":"Longer haircuts are used for variation margin, as initial margin is returnable"},{"l":"B","h":"Cash is only acceptable for variation margin, whereas initial margin can be in other collateral"},{"l":"C","h":"Cash is the only acceptable form for both initial margin and variation margin"},{"l":"D","h":"Variation margin has to be paid within three business days, whereas initial margin is paid on close"}],"a":"B","e":"<p>Cash is the only acceptable form of variation margin, which needs to be paid by 9am, next business day.<\/p>"},{"s":6,"n":83,"id":"1037020","q":"<p>What best describes a mutual offset system?<\/p>","o":[{"l":"A","h":"More than one exchange uses the same clearing house"},{"l":"B","h":"A trade on one exchange can be offset on another"},{"l":"C","h":"Exchanges share reporting information"},{"l":"D","h":"Exchanges guarantee each other's trades"}],"a":"B","e":"<p>A mutual offset system is operated between the CME and SGX.<\/p>"},{"s":6,"n":84,"id":"1015724","q":"<p>Which type of margin is used by an exchange when there are sudden changes in market volatility?<\/p>","o":[{"l":"A","h":"Initial"},{"l":"B","h":"Variation"},{"l":"C","h":"Spot month"},{"l":"D","h":"Intra-day"}],"a":"D","e":"<p>Intra day margin is used for emergency situations such as a sudden increase in volatility.<\/p>"},{"s":6,"n":85,"id":"1036685","q":"<p>What is the purpose of price limits on derivatives exchanges?<\/p>","o":[{"l":"A","h":"To limit volatility"},{"l":"B","h":"To limit insider trading"},{"l":"C","h":"To increase liquidity"},{"l":"D","h":"To reduce counterparty risk"}],"a":"A","e":"<p>Price limits, which are imposed on JGB futures on ICE Futures Europe and also on LME, are supposed to limit volatility.<\/p>"},{"s":6,"n":86,"id":"1037055","q":"<p>An investor buys three FTSE 100 futures at 4,250pts. On close, the price of the future has fallen to 4,210pts. If the initial margin for one contract is £3,000, what is the total margin payable, assuming a contract value of £5 per half index point?<\/p>","o":[{"l":"A","h":"£3,000"},{"l":"B","h":"£1,200"},{"l":"C","h":"£9,000"},{"l":"D","h":"£10,200"}],"a":"D","e":"<p>Initial margin = £3,000 x 3 contracts = £9,000.<br/> £5 per half index point equates to £10 per point.<br/> Variation margin = (4,250 - 4,210) x £10 x 3 contracts = £1,200.<br/> Total margin = £9,000 + £1,200 = £10,200.<\/p>"},{"s":7,"n":1,"id":"1017040","q":"<p>Who pays the invoice amount?<\/p>","o":[{"l":"A","h":"The long pays it to the exchange"},{"l":"B","h":"The seller pays it to the clearing house"},{"l":"C","h":"The seller pays it to the long"},{"l":"D","h":"The long pays it to the clearing house"}],"a":"D","e":"<p>The long pays the invoice amount to the clearing house who then passes it onto the short.<\/p>"},{"s":7,"n":2,"id":"1015712","q":"<p>If a member of a clearing house has elected for automatic exercise, how would they prevent the exercise of a particular option?<\/p>","o":[{"l":"A","h":"Cancellation order"},{"l":"B","h":"Suppression notice"},{"l":"C","h":"Stop order"},{"l":"D","h":"Stop notice"}],"a":"B","e":"<p>Automatic exercise can be prevented from occurring by filing a suppression notice with the clearing house.<\/p>"},{"s":7,"n":3,"id":"1040375","q":"<p>Once a salesman has confirmed details of a trade to a client, what happens next?<\/p>","o":[{"l":"A","h":"The trade details automatically appear in the exchange settlement system"},{"l":"B","h":"Initial margin is calculated and monitored against collateral held"},{"l":"C","h":"Variation margin is calculated"},{"l":"D","h":"Positions are closed-out against offsetting positions"}],"a":"A","e":"<p>This is a difficult question. However, the trade details will appear in the settlement system of the exchange, after which the initial margin will be calculated.<\/p>"},{"s":7,"n":4,"id":"1034194","q":"<p>A broker-dealer has been assigned an exercise notice by the OCC; the firm may assign the notice to a customer by any of the following methods, except:<\/p>","o":[{"l":"A","h":"To the customer with the largest short-position"},{"l":"B","h":"On a FIFO basis"},{"l":"C","h":"On a random basis"},{"l":"D","h":"By any method that is fair and equitable"}],"a":"A","e":"<p>The OCC chooses a broker-dealer at random to assign an exercise notice; the broker-dealer can choose a customer by any fair and equitable method with FIFO (first in, first out) or randomly being the most widely used methods. Choosing the customer with the largest short-position would not be fair and equitable.<\/p>"},{"s":7,"n":5,"id":"1036699","q":"<p>Which of the following would set the terms for automatic exercise of a specific contract?<\/p>","o":[{"l":"A","h":"Clearing member"},{"l":"B","h":"Broker"},{"l":"C","h":"Exchange"},{"l":"D","h":"Clearing house"}],"a":"C","e":"<p>The option must be ITM by a certain amount which is determined by the relevant exchange in the contract specification.<\/p>"},{"s":7,"n":6,"id":"1002799","q":"<p>In relation to a holder deciding to exercise an option, which of the following would occur first?<\/p>","o":[{"l":"A","h":"The writer receives an assignment notice from the clearing house and must then honour their obligations"},{"l":"B","h":"The broker receives an assignment notice from the clearing house and allocates it to a client who holds a position as a writer"},{"l":"C","h":"The broker completes an exercise notice and forwards it to the clearing house"},{"l":"D","h":"Upon receipt of the exercise notice the clearing house assigns it to a member firm"}],"a":"C","e":"<p>The broker completes an exercise notice and forwards it to the clearing house. Upon receipt of the exercise notice the clearing house assigns it to a member firm. The broker receives an assignment notice from the clearing house and allocates it to a client who holds a position as a writer. The writer receives an assignment notice from the clearing house and must then honour their obligations<\/p>"},{"s":7,"n":7,"id":"1002808","q":"<p>At expiry, which of the following is most likely to be exercised automatically?<\/p>","o":[{"l":"A","h":"In-the-money options"},{"l":"B","h":"In-the-money and at-the-money options"},{"l":"C","h":"European options"},{"l":"D","h":"All open-positions"}],"a":"A","e":"<p>The clearing house exercises all in-the-money options at expiry without requiring instructions (an exercise notice) from the holder.<\/p>"},{"s":7,"n":8,"id":"1002716","q":"<p>Which of the following choices are available to the writer of a traded option?<\/p><p class=\"rom\"><b>I<\/b> Exercise the option when it is in the money<\/p><p class=\"rom\"><b>II<\/b> To trade out the option by closing their position<\/p><p class=\"rom\"><b>III<\/b> Let the option lapse when they do not wish to exercise<\/p><p class=\"rom\"><b>IV<\/b> Keep the premium if the option is not exercised<\/p>","o":[{"l":"A","h":"I and III"},{"l":"B","h":"II and IV"},{"l":"C","h":"I and II"},{"l":"D","h":"III and IV"}],"a":"B","e":"<p>The writer of an option has received a premium. It is the holder who has all the choices and the writer must honour the terms of the option if the holder exercises the option.<\/p>"},{"s":7,"n":9,"id":"1034731","q":"<p>For which type of commodity is delivered quality likely to be least consistent?<\/p>","o":[{"l":"A","h":"Energy"},{"l":"B","h":"Agricultural"},{"l":"C","h":"Base metals"},{"l":"D","h":"Equities"}],"a":"B","e":"<p>Agricultural quality varies (incidentally, equities are not a commodity).<\/p>"},{"s":7,"n":10,"id":"1052123","q":"<p>On ICE Futures, when is the last notice day for the trading of the long UK government future?<\/p>","o":[{"l":"A","h":"It is 11.00 on the last trading day"},{"l":"B","h":"The end of the last trading day"},{"l":"C","h":"The last day of the delivery month"},{"l":"D","h":"The first day of the delivery month"}],"a":"B","e":"<p>The correct answer according to ICE Futures is the day after the last trading day. However, the examiner has not given us this as an option. The best answer is here is the end of the last trading day. The EDSP is calculated at 11.00 a.m. on the last trading day. The last day of the delivery month is the last delivery day. This may be a trial, as the examiner in the past has told us that they are not testing contract specifications.<\/p>"},{"s":7,"n":11,"id":"1026837","q":"<p>Who calculates the invoice amount?<\/p>","o":[{"l":"A","h":"The buyer"},{"l":"B","h":"The seller"},{"l":"C","h":"The exchange"},{"l":"D","h":"The clearing house"}],"a":"D","e":"<p>The clearing house will use the exchange delivery settlement price (EDSP) set by the exchange in order to calculate the invoice amount payable by the buyer.<\/p>"},{"s":7,"n":12,"id":"1014245","q":"<p>What is the name of the document that provides a template on which a deal ticket can be produced?<\/p>","o":[{"l":"A","h":"Term sheet"},{"l":"B","h":"Spreadsheet"},{"l":"C","h":"Deal ticket pro forma"},{"l":"D","h":"Standard dealing sheet"}],"a":"A","e":"<p>The term sheet sets-out a template on which a firm can easily and quickly fill in all the necessary information for a deal ticket.<\/p>"},{"s":7,"n":13,"id":"1017334","q":"<p>Once a notice of intention to deliver has been filed with the clearing house in respect of the long gilt future, which of the following occurs?<\/p>","o":[{"l":"A","h":"The long decides which bond should be delivered"},{"l":"B","h":"The short decides which bond to deliver during the delivery month"},{"l":"C","h":"The clearing house decides which bond should be delivered"},{"l":"D","h":"The long decides which bond to deliver on the delivery date"}],"a":"B","e":"<p>The short will decide which bond, from a list of deliverable bonds, to deliver. This can be delivered on any day during the delivery month.<\/p>"},{"s":7,"n":14,"id":"1015795","q":"<p>Which of the following is a suitable settlement method for a contract for difference?<\/p>","o":[{"l":"A","h":"Cash"},{"l":"B","h":"Tender of documents"},{"l":"C","h":"Options contract"},{"l":"D","h":"Exchange of a commodity for a futures contract"}],"a":"A","e":"<p>Contract for difference contracts are cash-settled.<\/p>"},{"s":7,"n":15,"id":"1002723","q":"<p>Which of the following best describes an American option?<\/p>","o":[{"l":"A","h":"An option exercisable at any time up to its expiry date"},{"l":"B","h":"An option on a US stock or bond"},{"l":"C","h":"An option exercised only at expiry"},{"l":"D","h":"An option traded on US exchanges"}],"a":"A","e":"<p>There is no geographical significance given to American (style) options. It simply refers to the fact that they can be exercised at any time, up to and including the expiry date. European style options, on the other hand, can be exercised on their expiry dates only.<\/p>"},{"s":7,"n":16,"id":"1037124","q":"<p>A far out-of-the-money option is likely to:<\/p>","o":[{"l":"A","h":"Be assigned at expiry"},{"l":"B","h":"Be closed out at expiry"},{"l":"C","h":"Be exercised at expiry"},{"l":"D","h":"Be abandoned at expiry"}],"a":"D","e":"<p>Out-of-the-money options are very likely going to be abandoned.<\/p>"},{"s":7,"n":17,"id":"1036860","q":"<p>Who issues an assignment notice when an option is exercised?<\/p>","o":[{"l":"A","h":"The clearing house"},{"l":"B","h":"The exchange"},{"l":"C","h":"The holder of a call/put"},{"l":"D","h":"The writer of a call/put"}],"a":"A","e":"<p>The holder of an option notifies his broker of his intention to exercise. The latter issues an exercise notice to ICE Clear Europe. Upon receipt of the exercise notice, ICE Clear Europe chooses a writer and sends an assignment notice.<\/p>"},{"s":7,"n":18,"id":"1037127","q":"<p>A future contract where physical delivery of the underlying asset is not practical or possible, is the generic description of:<\/p>","o":[{"l":"A","h":"A contract for difference"},{"l":"B","h":"An agency cross"},{"l":"C","h":"A backwardation contract"},{"l":"D","h":"A traded future"}],"a":"A","e":"<p>A Contract For Difference (CFD) is a futures contract where differences in settlement are made through cash payments with no delivery of physical goods or securities.<\/p>"},{"s":7,"n":19,"id":"1036970","q":"<p>Which of the following can initiate an assignment notice in the delivery process?<\/p>","o":[{"l":"A","h":"The writers of put options only"},{"l":"B","h":"The holders of call options only"},{"l":"C","h":"The holders of put and call options"},{"l":"D","h":"The seller of a futures contract"}],"a":"C","e":"<p>If an option holder wishes to exercise their option, an Exercise Notice is delivered to the clearing house. The clearing house then issues an Assignment Notice to a writer informing them of their obligations.<\/p>"},{"s":7,"n":20,"id":"1017041","q":"<p>Which of the following is an advantage of the automatic exercise system?<\/p>","o":[{"l":"A","h":"Reduced trading costs"},{"l":"B","h":"Reduce paperwork on expiry"},{"l":"C","h":"Reduced delivery periods"},{"l":"D","h":"Increased profits"}],"a":"B","e":"<p>An automatic exercise system will reduce paperwork because it will automatically exercise in-the-money options.<\/p>"},{"s":7,"n":21,"id":"1034732","q":"<p>A warrant on LME:<\/p>","o":[{"l":"A","h":"Gives right of possession to a specific lot of deliverable metal"},{"l":"B","h":"Is the name given to a long-hedge"},{"l":"C","h":"Is the final settlement for cash-cleared LME contracts through SWORD"},{"l":"D","h":"Is the electronic transfer of cash within SWORD for physically-delivered contracts"}],"a":"A","e":"<p>Ownership of warrants is used to prove ownership of deliverable metal.<\/p>"},{"s":7,"n":22,"id":"1034259","q":"<p>A trader enters into a contract to buy 25 tonnes of lead at $890 per tonne in three months' time on the London Metals Exchange (LME). If on the delivery the settlement price is calculated at $860 per tonne, how much will the trader pay for delivery of the contract?<\/p>","o":[{"l":"A","h":"$22,250"},{"l":"B","h":"$21,875"},{"l":"C","h":"$21,500"},{"l":"D","h":"$750"}],"a":"C","e":"<p>The trader will pay $21,500 for delivery of the contract ($860 x 25 tonnes). The $860 will be used rather than the $890 as variation margin will have covered the difference.<br/> The $860 will be referred to as EDSP (exchange delivery settlement price).<\/p>"},{"s":7,"n":23,"id":"1016984","q":"<p>Taking into account offsetting position, as a contract approaches delivery, which of the following types of margin is triggered?<\/p>","o":[{"l":"A","h":"Intra-day margin"},{"l":"B","h":"Spot month margin"},{"l":"C","h":"Maintenance margin"},{"l":"D","h":"Initial margin"}],"a":"B","e":"<p>The best answer and most literal answer is spot month margin, as this is a margin which is specifically payable in the delivery month.<\/p>"},{"s":7,"n":24,"id":"1002818","q":"<p>The correct calculation of the invoice amount for the cheapest to deliver (CTD) is as follows:<\/p>","o":[{"l":"A","h":"(EDSP x scale factor x price factor) - accrued interest"},{"l":"B","h":"(EDSP x scale factor x price factor) + accrued interest"},{"l":"C","h":"(EDSP x scale factor / CTD price factor)"},{"l":"D","h":"(Price of underlying x price factor x scale factor) + accrued interest"}],"a":"B","e":"<p>The invoice amount is what the long futures position pays when taking delivery of the 'cheapest to deliver' gilt. Note: The CTD is the gilt with the highest implied repo rate.<\/p>"},{"s":7,"n":25,"id":"1002903","q":"<p>If an investor holds a cash settled contract, how would this differ from holding a deliverable contract?<\/p>","o":[{"l":"A","h":"Cash-settled contracts always require cash as initial margin; whereas physically-settled contracts can use other collateral"},{"l":"B","h":"Cash-settled contracts generally take longer to deliver than physically-settled contracts"},{"l":"C","h":"Deliverable contracts are charged initial margin; whereas cash-settled contracts only pay variation margin"},{"l":"D","h":"Deliverable contracts settle through the physical exchange of the asset; whereas cash-settled contracts do not"}],"a":"D","e":"<p>Cash-settled contracts are also called CFDs.<\/p>"},{"s":7,"n":26,"id":"1002724","q":"<p>What position will the writer of a call on a future be in if the option is exercised?<\/p>","o":[{"l":"A","h":"Delivery of the underlying asset"},{"l":"B","h":"Long-future"},{"l":"C","h":"Short-future"},{"l":"D","h":"Short-put"}],"a":"C","e":"<p>This is not an option on an underlying asset, but an option on a future<\/p><p>Selling the right to buy a future will leave the writer of the option delivering the futures contract if the option is exercised against them.<\/p><p>If the option is exercised, then it will settle into a futures position. A bullish position in the options market (for example a long call) would settle into a bullish position in the futures market (long future), whereas a bearish position in the options market (for example a short call, as in this question) would settle into a bearish position in the futures market (short future)<\/p>"},{"s":7,"n":27,"id":"1017044","q":"<p>Which of the following is the best description of the difference between the last notice day and other days in the delivery month for the long gilt future?<\/p>","o":[{"l":"A","h":"The last notice day is the last day the contract can be traded"},{"l":"B","h":"The seller cannot specify the delivery day"},{"l":"C","h":"The exchange will specify the grade of asset to be delivered"},{"l":"D","h":"There are no differences"}],"a":"B","e":"<p>On any other delivery day a short can specify the delivery day. On the last notice day the delivery day is specified (T +1).<\/p>"},{"s":7,"n":28,"id":"1037274","q":"<p>If an option position is assigned who is responsible for selecting a writer?<\/p>","o":[{"l":"A","h":"The exchange"},{"l":"B","h":"The holder"},{"l":"C","h":"The clearing house"},{"l":"D","h":"The FCA"}],"a":"C","e":"<p>The clearing house randomly assign options to writers following exercise by holders.<\/p>"},{"s":8,"n":1,"id":"1015792","q":"<p>Which one of the following would create a synthetic equity fund in combination with a holding of a cash deposit?<\/p>","o":[{"l":"A","h":"Long-future"},{"l":"B","h":"Short-future"},{"l":"C","h":"Long-call"},{"l":"D","h":"Short-call"}],"a":"A","e":"<p>A synthetic equity fund would invest in risk-free assets such as cash or treasury bills and also a long-futures position to create the same exposure with derivatives as holding the physical assets.<\/p>"},{"s":8,"n":2,"id":"1037000","q":"<p>An investor holds a long position in the underlying and also owns a put on that underlying. How could she eliminate market risk?<\/p>","o":[{"l":"A","h":"Synthetic long call"},{"l":"B","h":"Synthetic long put"},{"l":"C","h":"Synthetic short call"},{"l":"D","h":"Synthetic short put"}],"a":"C","e":"<p>A long underlying position coupled with a long put, both on the same, creates a synthetic long call. To eliminate market risk, sell a future and a put on the underlying (offsetting your long positions). These two investments would create a synthetic short call.<\/p>"},{"s":8,"n":3,"id":"1002772","q":"<p>Which of the following trades in the same UK equity option is a spread?<\/p>","o":[{"l":"A","h":"Buy a September 390 call and buy a March 390 call"},{"l":"B","h":"Buy a November 320 call and sell a February 360 call"},{"l":"C","h":"Sell a February 300 call and sell a May 330 put"},{"l":"D","h":"Buy a September 460 put and sell a March 500 call"}],"a":"B","e":"<p>Option spreads must (1) contain either two calls or two puts, and (2) consist of a purchase of one and a sale of the other.<\/p>"},{"s":8,"n":4,"id":"1037420","q":"<p>A trader holds a straddle with strike prices set at 740. The underlying is at 765. What is the intrinsic value?<\/p>","o":[{"l":"A","h":"0"},{"l":"B","h":"25"},{"l":"C","h":"(25)"},{"l":"D","h":"50"}],"a":"B","e":"<p>There is no such thing as negative intrinsic value on a put option. The call option is in-the-money by 25p.<\/p>"},{"s":8,"n":5,"id":"1065118","q":"<p>An investor buys a 100 strike call option with an expiry date in April and simultaneously sells 120 strike call option with an expiry date in May. What has the investor created?<\/p>","o":[{"l":"A","h":"A straddle"},{"l":"B","h":"A vertical spread"},{"l":"C","h":"A horizontal spread"},{"l":"D","h":"A diagonal spread"}],"a":"D","e":"<p>Diagonal (diagonal calendar) spread, buying and selling options with different strikes and different expiry months.<\/p>"},{"s":8,"n":6,"id":"1052250","q":"<p>Which of the following spreads would be best used in anticipation of a major announcement by a commodity producer?<\/p>","o":[{"l":"A","h":"Diagonal spread"},{"l":"B","h":"Horizontal spread"},{"l":"C","h":"Bull call spread"},{"l":"D","h":"Bear put spread"}],"a":"B","e":"<p>There are two basic types of horizontal spreads. The first is based on the view that volatility will fall. The spread takes advantage of the fact that short-dated options will lose their time value faster, and therefore react quicker to a fall in volatility. <br/> The second type of horizontal or calendar spread is based on the view that volatility, particularly short-term volatility, will rise. This strategy is used most often ahead of key announcements, such as companies' earnings reports or central bank meetings, to take advantage of any dramatic short-term moves that may occur from the news.<\/p>"},{"s":8,"n":7,"id":"1026874","q":"<p>A fund manager is long a portfolio of the cheapest to deliver bond (CTD) worth £20m. The contract size is £100,000 and the price factor 1.043375. How does she hedge her position?<\/p>","o":[{"l":"A","h":"Buy 209 futures"},{"l":"B","h":"Sell 209 futures"},{"l":"C","h":"Buy 192 futures"},{"l":"D","h":"Sell 192 futures"}],"a":"B","e":"<p>As she is long the bond, she needs to do a short hedge and sell the contract.<br/> To calculate how many to sell we:<br/> Portfolio value / contract size x price factor<br/> (£20,000,000 / £100,000) x 1.043375 = sell 209 futures<\/p>"},{"s":8,"n":8,"id":"1002766","q":"<p>A client buys an American-style January 2,400 index call at 55 index points, and simultaneously buys a January 2,400 put at 75 index points. The spot price is currently 2,360. Assuming no other trades and ignoring commission, what are the breakeven points on the strategy?<\/p>","o":[{"l":"A","h":"2,345 and 2,475"},{"l":"B","h":"2,380 and 2,420"},{"l":"C","h":"2,270 and 2,530"},{"l":"D","h":"2,230 and 2,490"}],"a":"C","e":"<p>This is a long-straddle. The downside breakeven is the strike price (2,400) less the two premiums (55 + 75 = 130): i.e. 2,400 - 130 = 2,270. The upside breakeven is the strike price plus the two premiums: i.e. 2,400 + 130 = 2,530.<\/p>"},{"s":8,"n":9,"id":"1002869","q":"<p>George is uncertain over the direction of interest rates but wants to hedge against an increase in the borrowing rate on a loan he took out three months ago. Which of the following is the most suitable position to adopt (using options on interest rate futures)?<\/p>","o":[{"l":"A","h":"Buy futures"},{"l":"B","h":"Buy calls"},{"l":"C","h":"Buying puts"},{"l":"D","h":"Write calls"}],"a":"C","e":"<p>As interest rates increase, the price of interest rate futures goes down. In other words there is an inverse relationship between the interest rates and the price of interest rate futures. It therefore follows that the value of put options (they are priced like the futures) on interest rates would go up as interest rates increase and this would act as a hedge in this example.<\/p>"},{"s":8,"n":10,"id":"1016991","q":"<p>A fund manager is expecting to receive GBP 1,000,000 in a few months time and will use it to buy the 'cheapest to deliver' bond. She is concerned that interest rates will decrease during this time and wishes to use the long gilt future to hedge her position.<br/> The price factor for CTD = 1.1<br/> Contract size = 1000 x £100NV gilts (£100,000NV)<br/> Which of the following trades should she perform to hedge her position?<\/p>","o":[{"l":"A","h":"Buy 11 contracts"},{"l":"B","h":"Buy 9 contracts"},{"l":"C","h":"Sell 11 contracts"},{"l":"D","h":"Sell 9 contracts"}],"a":"A","e":"<p>If interest rates fall, the price of the long gilt future will increase. Therefore to hedge this position the fund manager should BUY the long gilt future. She will need to buy sufficient contracts to offset her total exposure.<\/p><p>Number of contracts required = Nominal value of CTD holding / Nominal value of contract x CTD price factor<\/p><p>= (£1,000,000 / £100,000) x 1.1 = 11 contracts<\/p>"},{"s":8,"n":11,"id":"1055066","q":"<p>Selling futures against the delivery of the underlying asset such as cocoa is which type of strategy?<\/p>","o":[{"l":"A","h":"Arbitrage"},{"l":"B","h":"Hedging"},{"l":"C","h":"Speculation"},{"l":"D","h":"Repo"}],"a":"B","e":"<p>Selling futures when you are taking delivery of the underlying is a way of hedging your exposure to fluctuating prices.<\/p>"},{"s":8,"n":12,"id":"1037049","q":"<p>The price of a March gilt future is 104.10. The June future is priced at 105.35. An investor expects the spread to narrow. She should:<\/p>","o":[{"l":"A","h":"Buy March and buy June"},{"l":"B","h":"Buy March and sell June"},{"l":"C","h":"Sell March and buy June"},{"l":"D","h":"Sell March and sell June"}],"a":"B","e":"<p>It is expected that:<br/> 1. March futures will increase in price relative to the June contract<br/> 2. June futures will decrease in price relative to the March contract<\/p>"},{"s":8,"n":13,"id":"1002851","q":"<p>A trader wants to hedge £14m of FTSE 100 stocks using index options. The index is currently at 5,100 points and a put option with a strike of 5,000 is available. How many contracts are required if the contract is valued at £5 per half index point?<\/p>","o":[{"l":"A","h":"275"},{"l":"B","h":"280"},{"l":"C","h":"2,750"},{"l":"D","h":"2,800"}],"a":"B","e":"<p>£14m/(5,000 x £10) = 280 contracts.<\/p><p>We use the strike price on the option in order to effect the hedge (5,000) and not the current spot price of the index (5,100)<\/p>"},{"s":8,"n":14,"id":"1052249","q":"<p>Which of the following BEST represents the benefits of a covered short call position?<\/p>","o":[{"l":"A","h":"Extra return in a stable market and some protection from a rising market"},{"l":"B","h":"Extra return in a stable market and some protection from a falling market"},{"l":"C","h":"Protection from a falling market at the expense of limited profits in a rising market"},{"l":"D","h":"Protection from a rising market at the expense of limited profits in a falling market"}],"a":"B","e":"<p>A covered short call is a trade performed by an investor in an asset. They hold the asset, but believe the return will be low, due to a static market. If the investor sells an OTM call on this, they generate extra income. If the market remains static, this creates a yield enhancement. If the market falls a little, this strategy gives a little downside protection.<\/p>"},{"s":8,"n":15,"id":"1036915","q":"<p>Which of the following would be a motivation for undertaking a covered short call?<\/p>","o":[{"l":"A","h":"Prices will rise"},{"l":"B","h":"Prices will fall"},{"l":"C","h":"Prices will remain stable"},{"l":"D","h":"Prices will become more volatile"}],"a":"C","e":"<p>A covered short call strategy normally involves a bank writing an out-of-the-money call (short call). The writing of the call is 'covered' by a holding in the underlying shares. The motivation for this trade is normally because the writer believes that the market will remain static and the price of the underlying will not move very much. The covered call will result in income even in a static market.<\/p>"},{"s":8,"n":16,"id":"1002776","q":"<p>Which of the following are option spread transactions?<\/p><p class=\"rom\"><b>I<\/b> The purchase of a March 390 call and the sale of a Dec 390 call<\/p><p class=\"rom\"><b>II<\/b> The purchase of a 390 put and the sale of a 420 put<\/p><p class=\"rom\"><b>III<\/b> The purchase of the July 2,400 call series and the sale of the October 2,600 call series<\/p><p class=\"rom\"><b>IV<\/b> The purchase of a March 360 put option and the purchase of the June 360 put option<\/p>","o":[{"l":"A","h":"I, II, III"},{"l":"B","h":"I and II"},{"l":"C","h":"III and IV"},{"l":"D","h":"II, III, IV"}],"a":"A","e":"<p>Option spreads must (1) contain either two calls or two puts, and (2) consist of a purchase of one and a sale of the other. All answers meet criteria (1), but 'the purchase of a March 360 put option and the purchase of the June 360 put option' does not fill criteria (2).<\/p>"},{"s":8,"n":17,"id":"4211285","q":"<p>Why might a pension fund be less inclined to use highly leveraged derivative positions compared to hedge funds?<\/p>","o":[{"l":"A","h":"Pension funds have a short-term investment horizon focused on speculative gains."},{"l":"B","h":"Pension funds are focused on preserving capital and ensuring stable, long-term returns for beneficiaries."},{"l":"C","h":"Pension funds typically engage in frequent trading to capitalize on market volatility."},{"l":"D","h":"Pension funds are primarily concerned with maximizing returns through aggressive trading."}],"a":"B","e":"<p>Pension funds prioritize capital preservation and stable, long-term returns to meet their obligations to beneficiaries. They tend to use derivatives conservatively, primarily for hedging purposes, unlike hedge funds that pursue aggressive, high-risk strategies for significant gains.<\/p>"},{"s":8,"n":18,"id":"4211282","q":"<p>For a corporate treasurer, what is the primary motivation for using derivatives in their financial strategy?<\/p>","o":[{"l":"A","h":"To speculate on market trends for profit maximization"},{"l":"B","h":"To generate high returns through leveraged positions"},{"l":"C","h":"To engage in arbitrage opportunities across global markets"},{"l":"D","h":"To hedge against price or currency risk associated with business activities"}],"a":"D","e":"<p>Corporate treasurers typically use derivatives to hedge against risks such as price or currency fluctuations linked to their business operations. This approach helps them manage financial risks and stabilize cash flows, rather than pursuing speculative profits.<\/p>"},{"s":8,"n":19,"id":"1067024","q":"<p>Which of the below is a description of sovereign wealth fund?<\/p>","o":[{"l":"A","h":"Pool of money derived from wealthy professionals which are set aside for investment purposes."},{"l":"B","h":"Pool of money derived from a country's reserves which are set aside for investment purposes."},{"l":"C","h":"Pool of money derived from retail clients which are set aside for investment purposes."},{"l":"D","h":"Pool of money derived from corporate treasurers which are set aside for investment purposes."}],"a":"B","e":"<p>These are pools of money derived from a country's reserves, which are set aside for investment<br/> purposes that will benefit the country's economy. The funding for a sovereign wealth fund (SWF)<br/> comes from central bank reserves that accumulate as a result of budget and trade surpluses.<\/p>"},{"s":8,"n":20,"id":"1002713","q":"<p>An investor holding equities believes share prices will rise but wants protection in case the market falls. What is the most suitable option position?<\/p>","o":[{"l":"A","h":"Purchase a call option"},{"l":"B","h":"Write a call option"},{"l":"C","h":"Purchase a put option"},{"l":"D","h":"Write a put option"}],"a":"C","e":"<p>The investor wants to hedge the risk of equities falling in value. Purchasing the option will allow him/her to sell shares at a pre-agreed price should the prices fall.<\/p>"},{"s":8,"n":21,"id":"1002719","q":"<p>How would an investor maximise return in the UK equity market if no change in the market is expected?<\/p>","o":[{"l":"A","h":"Buy calls and sell puts"},{"l":"B","h":"Buy calls and buy puts"},{"l":"C","h":"Sell calls and buy puts"},{"l":"D","h":"Sell calls and sell puts"}],"a":"D","e":"<p>If markets are expected to be stable, money could be made from selling options. All other things being equal, options lose value over their life. If you sell options, you can close out the position later at a lower premium than you sold them for, thus making a profit<\/p>"},{"s":8,"n":22,"id":"1052127","q":"<p>A UK investor is long 8 greasy wool contracts quoted on ASX at a price of 1,000 cents per kilogramme. The contract currency is AUD. The contract size is 2500kg; the tick size is 1 cent for a 1 kg movement. The GBP/AUD exchange rate is 1 GBP = 1.5206 AUD. The full contracted amount would be:<\/p>","o":[{"l":"A","h":"200,000 AUD"},{"l":"B","h":"25,000 AUD"},{"l":"C","h":"16,441 GBP"},{"l":"D","h":"131,527 GBP"}],"a":"A","e":"<p>As this question asks for the contract amount, the exchange will calculate in the currency of the contract using the EDSP of 1,000 cents or AUD10.00  as follows: AUD 10.00 x 2500 kg x 8 contracts = AUD 200,000<\/p>"},{"s":8,"n":23,"id":"1026875","q":"<p>Two put options on XYZ plc have strikes of 550 and 600. How would an investor create a bear put spread?<\/p>","o":[{"l":"A","h":"Buy the 550 strike put, buy the 600 strike put"},{"l":"B","h":"Buy the 550 strike put, sell the 600 strike put"},{"l":"C","h":"Sell the 550 strike put, sell the 600 strike put"},{"l":"D","h":"Sell the 550 strike put, buy the 600 strike put"}],"a":"D","e":"<p>A bull spread involves buying the lower strike option (either put or call).<br/> A bear spread involves selling the lower strike option (either put or call). <br/> Remember BULL BUY LOW. Therefore a bear put spread involves selling the lower strike put and buying the higher strike put.<\/p>"},{"s":8,"n":24,"id":"1017000","q":"<p>An investor who buys a call with a higher strike and sells a call with a lower strike has created which of the following positions?<\/p>","o":[{"l":"A","h":"A horizontal spread"},{"l":"B","h":"A diagonal spread"},{"l":"C","h":"A bull call spread"},{"l":"D","h":"A bear call spread"}],"a":"D","e":"<p>This is an example of a bear call spread.<\/p>"},{"s":8,"n":25,"id":"1017001","q":"<p>An investor buys a put option with a strike of 120p for a premium of 6p and sells a put option with a strike of 125p for a premium of 8p. What is her maximum loss?<\/p>","o":[{"l":"A","h":"2p"},{"l":"B","h":"3p"},{"l":"C","h":"5p"},{"l":"D","h":"11p"}],"a":"B","e":"<p>This is a bull put spread as the investor has bought the lower strike put and sold the higher strike put. This is also known as a net initial credit spread. The maximum profit is the net initial credit received: i.e. 2p (8p - 6p).<br/> The maximum loss is the difference between the strikes less the net credit, so 5p - 2p = 3p.<\/p>"},{"s":8,"n":26,"id":"1037475","q":"<p>A synthetic long call is created by going:<\/p>","o":[{"l":"A","h":"Short a future, long a put"},{"l":"B","h":"Long a future, long a put"},{"l":"C","h":"Short a future, long a call"},{"l":"D","h":"Short a future, short a put"}],"a":"B","e":"<p>Note: Option 'Short a future, long a call' would create a synthetic long put.<\/p>"},{"s":8,"n":27,"id":"1036954","q":"<p>An investor is long a 350 strike straddle. The underlying is currently trading at 372. What is the intrinsic value in the position?<\/p>","o":[{"l":"A","h":"0"},{"l":"B","h":"22"},{"l":"C","h":"372"},{"l":"D","h":"Without the premium values, it is impossible to calculate the intrinsic value"}],"a":"B","e":"<p>The 350 long straddle is made up from a long 350 call (has intrinsic value of 22) and a long 350 put (zero intrinsic value).<\/p>"},{"s":8,"n":28,"id":"1017350","q":"<p>Which of the following would constitute a speculative trade with the most directional bias?<\/p>","o":[{"l":"A","h":"An investor sells a put and simultaneously sells a call at the same strike, same expiry and on the same underlying asset"},{"l":"B","h":"An investor holds equity and buys a FTSE 100 traded put option"},{"l":"C","h":"An investor writes a naked call option without having a underlying position in the asset"},{"l":"D","h":"An investor buys a September future while selling a December future on the same asset"}],"a":"C","e":"<p>Option A is a short straddle Option B is a protective put and is a hedge Option D is a spread trade and therefore is a less risky position than C <br/> Option C is a speculative trade as writing call is a bearish speculative trade and is directional because you are betting on the asset falling in value. <br/> Although it could be argued that A and D are also speculative trades - C is the best answer here as it the most 'directional' / risky trade.<\/p>"},{"s":8,"n":29,"id":"1015934","q":"<p>Which of the following pairs of investments could an investor engage in to create a synthetic long-call?<\/p>","o":[{"l":"A","h":"Buy a put, sell a future"},{"l":"B","h":"Buy in the cash market, buy a put"},{"l":"C","h":"Sell a future, buy a put"},{"l":"D","h":"Sell in the cash market, sell a put"}],"a":"B","e":"<p>A synthetic long-call is created by being long the underlying asset and hedging the position by buying a put option.<\/p>"},{"s":8,"n":30,"id":"1002773","q":"<p>A spread trader who is long a December coffee future and short a March coffee future has established which of the following?<\/p>","o":[{"l":"A","h":"An inter-market spread"},{"l":"B","h":"An inter-commodity spread"},{"l":"C","h":"A commodity products spread"},{"l":"D","h":"An intra-market spread"}],"a":"D","e":"<p>Intra-market spreads are constructed by simultaneously buying and selling futures contracts with different delivery dates on the SAME underlying asset.<\/p>"},{"s":8,"n":31,"id":"1002815","q":"<p>Simon is short JGB futures. Which of the following is most likely true of Simon's motivation?<\/p>","o":[{"l":"A","h":"Simon believes that JGB yields will fall"},{"l":"B","h":"Simon wishes to receive JGBs on a fixed future date"},{"l":"C","h":"Simon could be hedging a short JGB position"},{"l":"D","h":"Simon believes that Japanese interest rates will rise"}],"a":"D","e":"<p>If interest rates rise then the price of the bonds and their derivatives will fall.<br/> If Simon is short, he expects the price of the JGB future to fall.<\/p><p>A short JGB future may be use if Simon expects JGB yiled to rise, wants to deliver JGBs in the future or he is hedging a long JGB position. <\/p>"},{"s":8,"n":32,"id":"1065115","q":"<p>A portfolio with a value of $5.5m has a Beta relative to the Standard and Poor's 500 of 1.05. How many S&amp;P 500 contracts, quoted at 1650 points, are required to fully hedge this position? <br/> The CME S&amp;P 500 Index contract is valued at US $250 per index point.<\/p>","o":[{"l":"A","h":"11 Contracts"},{"l":"B","h":"12 Contracts"},{"l":"C","h":"13 Contracts"},{"l":"D","h":"14 Contracts"}],"a":"D","e":"<p>$5,500,000 / (1650 x 250) x 1.05 = 14 contracts needed to hedge<\/p>"},{"s":8,"n":33,"id":"1002831","q":"<p>Which of the following best describes the formula for hedging a holding of the cheapest-to-deliver (CTD) bond using gilt futures?<\/p>","o":[{"l":"A","h":"(nominal value of CTD/face value of future) x pricing factor"},{"l":"B","h":"(nominal value of CTD/face value of future) x 1/pricing factor"},{"l":"C","h":"(face value of future/nominal value of CTD) x pricing factor"},{"l":"D","h":"(face value of future/nominal value of CTD) x 1/pricing factor"}],"a":"A","e":"<p>This is a common question.<\/p>"},{"s":8,"n":34,"id":"1026876","q":"<p>If an investor expects the Japanese interest rates to rise faster than the Euro rates which spread transaction should he undertake?<\/p>","o":[{"l":"A","h":"Buy the Japanese government bond future, sell the German government bond future"},{"l":"B","h":"Sell the Japanese government bond future, sell the German government bond future"},{"l":"C","h":"Buy the Japanese government bond future, buy the German government bond future"},{"l":"D","h":"Sell the Japanese government bond future, buy the German government bond future"}],"a":"D","e":"<p>If Japanese interest rates increase at a faster rate, the JGB future will fall in value and should be sold. To achieve a spread trade, the German government bond future should be purchased.<\/p>"},{"s":8,"n":35,"id":"1015763","q":"<p>An investor believes that the price of a share will stay at 240 between now and the expiry date. What strategy should he adopt to get the most profit available?<\/p>","o":[{"l":"A","h":"Long-put"},{"l":"B","h":"Short-call"},{"l":"C","h":"Short-straddle"},{"l":"D","h":"Long-straddle"}],"a":"C","e":"<p>The short-straddle can be used to profit from low volatility (compared to that implied by the option premiums). This is the best answer as the questions suggest that volatility will be low.<\/p>"},{"s":8,"n":36,"id":"1014252","q":"<p>Which of the following investors is most likely to take on the most risk in their derivative investments?<\/p>","o":[{"l":"A","h":"Hedge funds"},{"l":"B","h":"Corporate treasurers"},{"l":"C","h":"High net worth individuals"},{"l":"D","h":"Institutional asset managers"}],"a":"A","e":"<p>Hedge funds are most likely to use derivatives to take on more risk. Corporate treasurers would be most likely to use derivatives to reduce risk. The other two would take on some risk, but would be limited by credit risk exposure and regulatory restrictions.<\/p>"},{"s":8,"n":37,"id":"1016999","q":"<p>An investor wishing to undertake a long-strangle would do which of the following trades?<\/p>","o":[{"l":"A","h":"Buy a call and a put with the same strike and same expiry month"},{"l":"B","h":"Buy a put and a call with different strikes, but the same expiry month"},{"l":"C","h":"Sell a put and a call with the same strike and same expiry month"},{"l":"D","h":"Sell a put and a call with the same strike month, but a different expiry month"}],"a":"B","e":"<p>A long-strangle involves the purchase of a call and a put option with the different strikes but the same expiry month.<br/> A long-straddle involves the purchase of a call and put option with the same expiry month and same strike.<\/p>"},{"s":8,"n":38,"id":"1036670","q":"<p>Which of the following would be the main motivation for doing a covered short call?<\/p>","o":[{"l":"A","h":"High volatility"},{"l":"B","h":"Large price rise expected"},{"l":"C","h":"Large price fall expected"},{"l":"D","h":"Price expected to remain stable"}],"a":"D","e":"<p>A covered short call uses the premium received to enhance the return if the price is stable.<\/p>"},{"s":8,"n":39,"id":"1002769","q":"<p>An investor is of the opinion that the price of an underlying asset will stay at £2.30 in the near future. What option strategy would you recommend?<\/p>","o":[{"l":"A","h":"Buy a put option with a strike of £2.30 and buy a call option also with a strike at £2.30"},{"l":"B","h":"Write a put option with a strike of £2.30 and write a call option also with a strike at £2.30"},{"l":"C","h":"Buy a put option with a strike of £2.30"},{"l":"D","h":"Sell a put option with a strike of £2.30"}],"a":"B","e":"<p>The investor expects share price to remain at, or very close to, its current level. This means that volatility of the share is going to be low. In order for the investor to profit, you would recommend the option 'write a put option with a strike of £2.30 and a call option at £2.30', which is a short-straddle.<\/p>"},{"s":8,"n":40,"id":"1002774","q":"<p>Erica writes a 90 strike put and a 90 strike call. This strategy is known as a:<\/p>","o":[{"l":"A","h":"Long-strangle"},{"l":"B","h":"Short-strangle"},{"l":"C","h":"Short-straddle"},{"l":"D","h":"Long-straddle"}],"a":"C","e":"<p>Long-strangle - buy call and put - different strikes.<br/> Short-strangle - sell call and put - different strikes.<br/> Short-straddle - sell call and put - same strike.<br/> Long-straddle - buy call and put - same strike.<\/p>"},{"s":8,"n":41,"id":"1052132","q":"<p>A wool producer believes that the market price for wool will fall slightly, which of the following would be a suitable strategy?<\/p>","o":[{"l":"A","h":"Write calls"},{"l":"B","h":"Write puts"},{"l":"C","h":"Sell a straddle"},{"l":"D","h":"Buy a strangle"}],"a":"A","e":"<p>A wool producer will want to sell wool to its customers. The price falling a little will cause a problem, but not a significant one. By writing (and selling) calls, the producer collects premiums. These can be used to offset the slight drop in the price of wool. If the holder of call exercises their option, the wool producer will be forced to deliver their wool at the strike price. As the producer wants to deliver wool, this would not be a problem. This strategy is called a covered short call.<\/p>"},{"s":8,"n":42,"id":"1065107","q":"<p>An investor sells a 300 strike put option for a premium of 4p and simultaneously buys a 330 strike put option with a premium of 15p. What would be the investor's maximum profit?<\/p>","o":[{"l":"A","h":"4p"},{"l":"B","h":"11p"},{"l":"C","h":"15p"},{"l":"D","h":"19p"}],"a":"D","e":"<p>The investor has created a bear put spread which is a net initial debit trade. The profit/loss profile is as follows:<br/> They pay 15p and receive 4p. This net DEBIT of 11p becomes his maximum LOSS.<br/> The difference between the two strikes will equal maximum profit + maximum loss.<br/> i.e. 330 - 300 = max profit + 11<br/> max profit = 30p - 11p = 19p.<\/p>"},{"s":8,"n":43,"id":"1026864","q":"<p>An investor buys a share at 283 and a put option at 290 for a premium of 12. What is the net profit or loss if the asset trades at 260 at expiry?<\/p>","o":[{"l":"A","h":"Profit of 18"},{"l":"B","h":"Profit of 7"},{"l":"C","h":"Loss of 5"},{"l":"D","h":"Loss of 7"}],"a":"C","e":"<p>Loss on share = 283 - 260 = -23 Profit on put = 290 - 260 = +30 Cost of put = - 12<br/> Total loss = 5<\/p>"},{"s":8,"n":44,"id":"1002768","q":"<p>A synthetic long future is created by:<\/p>","o":[{"l":"A","h":"Combining a long-call and short-call"},{"l":"B","h":"Combining a short-put and a long-call"},{"l":"C","h":"Combining a long-put and short-call"},{"l":"D","h":"Combining a short-put with a short-call"}],"a":"B","e":"<p>By buying a call and selling a put (on the same underlying and with the same strike prices and delivery dates), the exposure to the price of the underlying asset is exactly the same as buying the asset itself. Hence, a 'synthetic long'. However, gearing is greater with a synthetic long, as only the premium payments need to be funded.<\/p>"},{"s":8,"n":45,"id":"1002783","q":"<p>A portfolio consists of a 2,500 strike long-call, premium paid 55, for January expiry and a 2,400 strike long put, premium paid 75, for January expiry on the same underlying asset. The spot price of the asset today is 2,445. Calculate the prices of the asset beyond which the portfolio will profit.<\/p>","o":[{"l":"A","h":"2,215 and 2,530"},{"l":"B","h":"2,270 and 2,630"},{"l":"C","h":"2,270 and 2,530"},{"l":"D","h":"2,345 and 2,400"}],"a":"B","e":"<p>The portfolio represents a long-strangle. The breakeven points are the HIGH strike price + both premiums and the LOW strike - both premiums.<\/p>"},{"s":8,"n":46,"id":"1065110","q":"<p>An investor creates a bear call spread by buying a 210 strike option for a premium of 4p and simultaneously sells a 200 strike option with a premium of 8p. What would be the investor's maximum profit?<\/p>","o":[{"l":"A","h":"2p"},{"l":"B","h":"4p"},{"l":"C","h":"6p"},{"l":"D","h":"8p"}],"a":"B","e":"<p>The investor has created a bear call spread which is a net initial credit trade. The profit/loss profile is as follows:<br/> They are paid 8p and pay 4p = 4p maximum profit<\/p>"},{"s":8,"n":47,"id":"1037040","q":"<p>A trader buys a June 94 strike T-bond put and simultaneously sells a June 90 strike T-bond put. This is known as a:<\/p>","o":[{"l":"A","h":"Bull put spread"},{"l":"B","h":"Calendar spread"},{"l":"C","h":"Bear call spread"},{"l":"D","h":"Bear put spread"}],"a":"D","e":"<p>Buying the high strike option and selling the low strike option is a bearish view.<\/p>"},{"s":8,"n":48,"id":"1026840","q":"<p>An investor writes 10 puts on a long gilt future with a strike price of £105.00 at a premium of 10p per contract. At the same time the investor also sells 10 long gilt futures at £105.25. On expiry of the options, the future is trading at £104.25. Assuming all options are exercised and all positions closed out, what profit or loss is made?<\/p>","o":[{"l":"A","h":"15p loss per contract"},{"l":"B","h":"25p loss per contract"},{"l":"C","h":"35p profit per contract"},{"l":"D","h":"90p profit per contract"}],"a":"C","e":"<p>The investor has two positions: short puts on a long gilt future and short positions in the long gilt future.<br/> As the writer of the put, the investor receives the premium of 10p per option. If the option is exercised, the investor will receive a long position in the long gilt future at £105.00. When this occurs it will close out the short positions originally opened at £105.25,<br/> Long at 105.00 and short at £105.25 gives a 25p profit. Remember, the investor also gained 10p premium on the options, taking his profit to 35p.<br/> NOTE: the contract is somewhat confusingly called the 'long gilt future' and you can be long the 'long gilt future' or short the 'long gilt future'.<\/p>"},{"s":8,"n":49,"id":"1015938","q":"<p>An investor makes a purchase of a 330 call at a premium of 4p. He simultaneously sells a 300 call at 15p. What is the investor's maximum loss?<\/p>","o":[{"l":"A","h":"4p"},{"l":"B","h":"11p"},{"l":"C","h":"15p"},{"l":"D","h":"19p"}],"a":"D","e":"<p>This is bear call spread. Remember BULL BUY LOW strike call or put - therefore as the low strike call has been sold this is a bear call spread. <br/> As the investor has received income up front this represents a net credit of 11p. The maximum loss on a net credit spread is the difference between the strikes minus the net credit - so 30p-11p = 19p<\/p>"},{"s":8,"n":50,"id":"1037128","q":"<p>A US equity fund manager wants to hedge their portfolio using the S&amp;P future. State how many futures contracts are needed to hedge the portfolio given the following:<br/> The portfolio is $75m The S&amp;P future is at 1,300 The contract is $500 an index point<\/p>","o":[{"l":"A","h":"115 contracts"},{"l":"B","h":"130 contracts"},{"l":"C","h":"75 contracts"},{"l":"D","h":"58 contracts"}],"a":"A","e":"<p>115 contracts required - you can not buy fractions of a contract so you round to the nearest whole number.<br/> Number of futures required = value of holding / value of contract Number of futures required = 75,000,000 / (1,300 x 500) = 115.38 Number of futures required = 115 (rounded to nearest contract)<\/p>"},{"s":8,"n":51,"id":"1015738","q":"<p>You have sold ten single stock futures for a UK company for 800p. You closed-out the position at 780p. What is your profit or loss, assuming a contract size of 1,000 shares?<\/p>","o":[{"l":"A","h":"£200 profit"},{"l":"B","h":"£2,000 profit"},{"l":"C","h":"£200 loss"},{"l":"D","h":"£2,000 loss"}],"a":"B","e":"<p>Profit per contract is the difference between the buying and the selling price, which is £0.20. The contract size is 1,000 for UK shares and we have 10 contracts, so 0.20 x 10 x 1,000 = £2,000 profit.<\/p>"},{"s":8,"n":52,"id":"1016997","q":"<p>Which of the following is an example of an intra-market spread?<\/p>","o":[{"l":"A","h":"Long a lead September futures contract, long a September put contract"},{"l":"B","h":"Long a lead September futures contract, short a September put contract"},{"l":"C","h":"Long a tin futures contract, short a lead futures contract"},{"l":"D","h":"Long September lead futures contract, short a December lead futures contract"}],"a":"D","e":"<p>An intra-market spread is where an investor has a position in two different months, but in the same contract. <br/> An inter-market spread is where an investor has a position in different, but related, contracts.<\/p>"},{"s":8,"n":53,"id":"1052130","q":"<p>An investor that simultaneously holds a call and sells a put with the same contract specifications. Their position could be described as a:<\/p>","o":[{"l":"A","h":"Short position"},{"l":"B","h":"Synthetic call"},{"l":"C","h":"Leveraged position"},{"l":"D","h":"Long position"}],"a":"D","e":"<p>Using synthetics holding a call and writing a put on a specific asset with the same expiry, same strike, will be the same exposure as the long future position.<\/p>"},{"s":8,"n":54,"id":"1015707","q":"<p>Which of the following investments would create a diagonal spread?<\/p>","o":[{"l":"A","h":"An investor buys a call option and simultaneously sells another call option with a different strike and different expiry"},{"l":"B","h":"An investor buys a put option and simultaneously sells another put option with a different strike and the same expiry"},{"l":"C","h":"An investor buys a call option and simultaneously sells a put option with the same strike and the same expiry"},{"l":"D","h":"An investor buys a put option and simultaneously sells a call option with the same strike and a different expiry"}],"a":"A","e":"<p>A diagonal spread trade is when either all calls or all puts are bought and sold with a different strike and different expiry month.<\/p>"},{"s":8,"n":55,"id":"1002784","q":"<p>An options portfolio contains a January short-call, strike 200, and an April long-call, strike 220, on the same underlying asset. The strategy could be best described as:<\/p>","o":[{"l":"A","h":"Vertical spread"},{"l":"B","h":"Synthetic short"},{"l":"C","h":"Long-strangle"},{"l":"D","h":"Diagonal spread"}],"a":"D","e":"<p>A diagonal spread consists of buying a call and selling a call on the same asset with different strikes and different expiry dates. It could also be constructed with put options in the same way.<\/p>"},{"s":8,"n":56,"id":"1002779","q":"<p>Which of the following is true of a synthetic index fund?<\/p>","o":[{"l":"A","h":"It contains both cash and futures"},{"l":"B","h":"It contains only futures"},{"l":"C","h":"It will sell calls and hold cash"},{"l":"D","h":"It will buy calls and borrow cash"}],"a":"A","e":"<p>A synthetic index fund is designed to track an index. It is created by purchasing futures on the index and holding the monetary value of the futures in cash (or another type of risk free asset, such as gilts).<\/p>"},{"s":8,"n":57,"id":"1037100","q":"<p>A synthetic long call is created by:<\/p>","o":[{"l":"A","h":"Short a future, long a put"},{"l":"B","h":"Long a future, long a put"},{"l":"C","h":"Short a future, long a call"},{"l":"D","h":"Short a future, short a put"}],"a":"B","e":"<p>Note: Option C would create a synthetic long put.<\/p>"},{"s":8,"n":58,"id":"1015727","q":"<p>A trader wants to hedge £14m of FTSE 100 stocks using index options. The index is currently at 5100 points and a put option with a strike of 5,000 is available. Assuming a tick value of £5 per half index point, how many contracts are required?<\/p>","o":[{"l":"A","h":"275"},{"l":"B","h":"280"},{"l":"C","h":"2,750"},{"l":"D","h":"2,800"}],"a":"B","e":"<p>£14m/(5,000 x £10) = 280 contracts.<\/p>"},{"s":8,"n":59,"id":"1002819","q":"<p>How many bond futures would be traded to hedge an anticipated holding of £50m nominal of the cheapest to deliver bond? The contract size is £250,000 and the price factor of the CTD is 1.112233, the notional coupon is 6%.<\/p>","o":[{"l":"A","h":"180"},{"l":"B","h":"200"},{"l":"C","h":"222"},{"l":"D","h":"247"}],"a":"C","e":"<p>NV of portfolio/NV contract x Price factor of bond = Number of contracts to hedge<\/p><p>(50m / 0.25m) x 1.112233 = 222<\/p>"},{"s":8,"n":60,"id":"1015751","q":"<p>An investor expects that the eurozone yield curve would rotate and flatten at the long-end.<br/> What spread trade would make sense in this situation?<\/p>","o":[{"l":"A","h":"Buy the euribor future and sell the eurodollar future"},{"l":"B","h":"Sell the euribor future and buy the bund future"},{"l":"C","h":"Sell the bund future and buy the euribor future"},{"l":"D","h":"Sell the euribor future and sell the bund future"}],"a":"B","e":"<p>Euribor futures reflect the short-term yields and the bund future reflects the long-term yields.<\/p><p>Euribor futures = 100 - eurozone interest rate.<br/> A rotation with a flattening of the long-term, assuming a normal yield curve, will mean that short-term interest rates are expected to rise in relation to long-term interest rates. If short-term interest rates rise, the price of Euribor futures will fall, so you will sell the Euribor future.<\/p>"},{"s":8,"n":61,"id":"1051969","q":"<p>An investor places orders to purchase a June future @ 93.50 and sell a September future @ 93.75. At the time of the order the spot price is 93.46. Which of the following represents the investor's initial spread?<\/p>","o":[{"l":"A","h":"4"},{"l":"B","h":"5"},{"l":"C","h":"25"},{"l":"D","h":"29"}],"a":"C","e":"<p>The spread is the difference between the prices of the futures, and, in this case, is 25 ticks.<\/p>"},{"s":8,"n":62,"id":"1037454","q":"<p>At which of the following points would the following trade breakeven?<br/> Sell 4,300 call at a premium of 70 Sell 4,200 put at a premium of 20<\/p>","o":[{"l":"A","h":"4,370 and 4,280"},{"l":"B","h":"4,110 and 4,390"},{"l":"C","h":"4,210 and 4,390"},{"l":"D","h":"4,320 and 4,380"}],"a":"B","e":"<p>The trade represents a short strangle.<br/> Downside breakeven = 4,200 - 90 = 4,110.<br/> Upside breakeven = 4,300 + 90 = 4,390<\/p>"},{"s":8,"n":63,"id":"1002770","q":"<p>Interest rates stand at 6% and the dividend yield on the FTSE 100 index is 2.5%. The March FTSE future is trading at 6,200 and the June FTSE future is trading at 6,250. You expect interest rates to fall, therefore the March/June spread will:<\/p>","o":[{"l":"A","h":"Fluctuate"},{"l":"B","h":"Narrow"},{"l":"C","h":"Widen"},{"l":"D","h":"Be unaffected by changes in interest rates"}],"a":"B","e":"<p>A reduction in interest rates will reduce the cost-of-carry, and therefore reduce the spread between the March and June contracts.<\/p>"},{"s":8,"n":64,"id":"4211284","q":"<p>Which of the following client types is most likely to use derivatives primarily for speculative purposes, seeking high returns through leveraged positions?<\/p>","o":[{"l":"A","h":"Private client investment portfolios"},{"l":"B","h":"Pension funds"},{"l":"C","h":"Hedge funds"},{"l":"D","h":"Pension funds"}],"a":"C","e":"<p>Hedge funds often use derivatives for speculative purposes, seeking high returns through leveraged positions. Their investment strategies often involve taking significant risks to achieve high potential returns, which is different from more conservative clients like pension funds or corporate treasurers who primarily use derivatives for hedging.<\/p>"},{"s":8,"n":65,"id":"1002775","q":"<p>A futures intra-market spread order is best described as:<\/p>","o":[{"l":"A","h":"An order to buy the near-dated future in one contract and sell the far-dated future for a different contract"},{"l":"B","h":"An order to buy the near-dated future and sell the far-dated future for the same contract"},{"l":"C","h":"An order to buy the near-dated future in one contract and sell the near-dated future in another contract"},{"l":"D","h":"An order to buy the far-dated future in one contract and sell the far-dated future for another contract"}],"a":"B","e":"<p>A spread order is buying one contract and selling another with both contracts having different delivery dates. An intra-market spread is buying and selling within the same contract.<\/p>"},{"s":8,"n":66,"id":"4211283","q":"<p>Why might a sovereign wealth fund (SWF) find derivatives an attractive component of their investment strategy?<\/p>","o":[{"l":"A","h":"To hedge against domestic economic downturns through diversification"},{"l":"B","h":"To meet short-term liquidity needs by using derivatives as collateral"},{"l":"C","h":"To leverage positions for speculative purposes"},{"l":"D","h":"To engage in high-frequency trading for quick profits"}],"a":"A","e":"<p>Sovereign wealth funds often use derivatives as part of a diversification strategy to hedge against risks related to their home country’s economic conditions. By investing in a variety of assets, including derivatives, SWFs aim to protect and grow the country's financial reserves against potential downturns in their domestic economy.<\/p>"},{"s":8,"n":67,"id":"1002778","q":"<p>A futures trader expects a bull market in the FTSE 100 index. The bull market is likely to lead to the spread widening. Which of the following spread trades would you normally expect the trader to do?<\/p>","o":[{"l":"A","h":"Sell the near-month and sell the far-month"},{"l":"B","h":"Buy the near-month and buy the far-month"},{"l":"C","h":"Sell the near-month and buy the far-month"},{"l":"D","h":"Buy the near-month and sell the far-month"}],"a":"C","e":"<p>If the circumstances are 'normal' as the question suggests, it means that the deferred future is trading at a higher price to the near. If the spread is expected to widen, the trader would sell the near and buy the far-dated future.<\/p>"},{"s":8,"n":68,"id":"1036792","q":"<p>Which of the following best describes the maximum profit available to the holder of a bull call spread?<\/p>","o":[{"l":"A","h":"The difference between the two strikes plus the net initial premium"},{"l":"B","h":"The difference between the two strikes minus the net initial premium"},{"l":"C","h":"The net initial premium"},{"l":"D","h":"Unlimited"}],"a":"B","e":"<p>The net initial premium is sunk whatever happens. Maximum profit is limited to the gap between the strike on the low strike call and the high strike call minus this net initial debit.<\/p>"},{"s":8,"n":69,"id":"1002864","q":"<p>Margaret buys short sterling interest rate futures at 90.00. When the contract expires, it stands at 94.00. What is Margaret's profit assuming a tick value of £12.50 per basis point?<\/p>","o":[{"l":"A","h":"£1,000"},{"l":"B","h":"£2,500"},{"l":"C","h":"£3,500"},{"l":"D","h":"£5,000"}],"a":"D","e":"<p>Tick size - 0.01.<br/> Tick value - £12.50.<br/> Contract has increased by 400 ticks.<br/> Therefore profit is £5,000.<\/p>"},{"s":8,"n":70,"id":"1017333","q":"<p>Which of the following would be an example of an intermarket interest rate spread trade?<\/p>","o":[{"l":"A","h":"Buy June STIR future, sell Sept STIR future"},{"l":"B","h":"Buy June STIR, sell June Euribor future"},{"l":"C","h":"Buy June STIR, buy June Euribor future"},{"l":"D","h":"Buy June STIR, sell Sept long gilt future"}],"a":"B","e":"<p>Intermarket spread trades are where a position is taken in two different but related contracts.<\/p>"},{"s":8,"n":71,"id":"1015706","q":"<p>An investor buys a put and simultaneously sells a put with a higher strike price. What strategy have they entered into?<\/p>","o":[{"l":"A","h":"Bull call spread"},{"l":"B","h":"Bear call spread"},{"l":"C","h":"Bull put spread"},{"l":"D","h":"Bear put spread"}],"a":"C","e":"<p>Remember BULL - BUY LOW strike call or put. Therefore the investor has entered into a BULL put spread.<\/p>"},{"s":8,"n":72,"id":"1002757","q":"<p>A position made up of a long-future and a long-put option on the same future would create a:<\/p>","o":[{"l":"A","h":"Synthetic long-call"},{"l":"B","h":"Synthetic short-put"},{"l":"C","h":"Synthetic long-future"},{"l":"D","h":"Synthetic short-call"}],"a":"A","e":"<p>Long-future + long-put = synthetic long-call.<\/p>"},{"s":8,"n":73,"id":"1002860","q":"<p>Helena wants to hedge her holding of 3,000 shares in X plc by selling individual stock futures on an exchange. What profit does she make on the futures position if she opens her position at 18.5p and closes out at 17p, assuming a contract size of 1,000 shares?<\/p>","o":[{"l":"A","h":"£35"},{"l":"B","h":"£40"},{"l":"C","h":"£45"},{"l":"D","h":"£50"}],"a":"C","e":"<p>Profit per share = 18.5 - 17 = 1.5p. Overall profit = 1.5p x 3,000 shares = £45.<\/p>"},{"s":8,"n":74,"id":"1002838","q":"<p>The FTSE March future is trading at 6,605 with a tick value of £5 per half index point. How many futures contracts should the manager of a £28.0m index tracking fund sell to create the best possible hedge?<\/p>","o":[{"l":"A","h":"847.84"},{"l":"B","h":"423.92"},{"l":"C","h":"848.00"},{"l":"D","h":"424.00"}],"a":"D","e":"<p>The FTSE 100 future is valued at £5 per 1/2 point, or £10 per point. This means that one contract will hedge £66,050 worth of the fund (if the index is trading at 6,605). The total amount needed for the full £28.0 million is £28,000,000 / £66,050 = 423.92. However, you cannot buy 0.92 of a contract, so the answer to the question is 424 contracts.<\/p>"},{"s":8,"n":75,"id":"1065108","q":"<p>Which of the following combinations would be true with regard to options positions?<\/p><p class=\"rom\"><b>I<\/b> A call is the right to buy and will be exercised if at expiry the current price is higher than the strike<\/p><p class=\"rom\"><b>II<\/b> A call is the obligation to buy and will be exercised if at expiry the current price is lower than the strike<\/p><p class=\"rom\"><b>III<\/b> A put is the right to sell and will be exercised if at expiry the current price is lower than the strike<\/p><p class=\"rom\"><b>IV<\/b> A put is the obligation to sell and will be exercised if at expiry the current price is lower than the strike<\/p>","o":[{"l":"A","h":"I and IV"},{"l":"B","h":"II and III"},{"l":"C","h":"I and III"},{"l":"D","h":"II and IV"}],"a":"C","e":"<p>A call is the right to buy and will be exercised if at expiry the current price is higher than the strike and a put is the right to sell and will be exercised if at expiry the current price is lower than the strike.<\/p>"},{"s":8,"n":76,"id":"1002856","q":"<p>What is the profit in the following example:<br/> An investor buys 12 futures contracts in a Universal Stock Future in A1B2C3 shares<br/> The current price of the asset is €12.50 and the December Future is priced at €12.75<br/> On the last trading day the share price has risen to €13.00<br/> The contract size is 100 shares.<\/p>","o":[{"l":"A","h":"€200"},{"l":"B","h":"€400"},{"l":"C","h":"€25"},{"l":"D","h":"€300"}],"a":"D","e":"<p>The profit is €300 = EDSP - the opening purchase x contract size €13.00 - €12.75 = €0.25 €0.25 x 100 shares = €25 €25 x 12 contracts = €300<\/p>"},{"s":8,"n":77,"id":"1015804","q":"<p>The best description of gearing in the context of derivatives is:<\/p>","o":[{"l":"A","h":"The range of values a derivative can trade away from its fair value where arbitrage is not profitable"},{"l":"B","h":"The level of systemic risk included in the derivatives contract price"},{"l":"C","h":"The need to calculate variation margin on a daily basis"},{"l":"D","h":"The cost of the derivative as a percentage of the return on the investment"}],"a":"D","e":"<p>Gearing looks at the initial investment as a percentage of the return. If an investor buys a share for £2 and then sells it for £2.20, she makes a 10% profit on an investm
