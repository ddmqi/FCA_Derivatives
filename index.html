er than normal risk or is very volatile"},{"l":"C","h":"If the broker is actively managing the client’s portfolio and, therefore, does not maintain a separate client account"},{"l":"D","h":"When the client plans to hold the position to or close to its maturity, to avoid any additional margin calls"}],"a":"B","e":"<p><strong>Réponse : B<\/strong> (Chapter 5, Section 6.2)<\/p><p>The maintenance requirement is the minimum amount to be collateralised in order to keep an open position. It is generally lower than the initial requirement. This allows the price to move against the margin without forcing a margin call immediately after the initial transaction. On instruments determined to be especially risky, however, the regulators, the exchange or the broker may set the maintenance requirement higher than normal or equal to the initial requirement to reduce their exposure to the risk accepted by the trader.<\/p>"},{"s":2,"n":80,"id":"Chapter 2, Section 3.2.1","q":"<p>The current exchange rate is $1.35 = £1 and the interest rates in the US and UK for the next year are 3% and 4% respectively. What is the one-year forward rate of exchange using interest rate parity?<\/p>","o":[{"l":"A","h":"$1.337 = £1"},{"l":"B","h":"$1.354 = £1"},{"l":"C","h":"$1.379 = £1"},{"l":"D","h":"$1.405 = £1"}],"a":"A","e":"<p><strong>Réponse : A<\/strong> (Chapter 2, Section 3.2.1)<\/p><p>The forward rate in one year’s time will be based on the spot rate adjusted by the relative interest rates.<\/p><p>So US$1.35 x 1.03 will be equivalent to £1 x 1.04. The one-year forward rate will be based on: F = 1.35 × ((1 + 0.041)/(1 + 0.03)) = 1.35 × (1.03 / 1.034) = 1.35 × 0.99038 ≈ 1.337<\/p>"},{"s":4,"n":81,"id":"Chapter 4, Section 4.1.1","q":"<p>A call option has a strike price of £3. If the share is currently trading at £3.30, what is the intrinsic value of this option today?<\/p>","o":[{"l":"A","h":"10p"},{"l":"B","h":"25p"},{"l":"C","h":"30p"},{"l":"D","h":"35p"}],"a":"C","e":"<p><strong>Réponse : C<\/strong> (Chapter 4, Section 4.1.1)<\/p><p>The intrinsic value is the difference between the current share price and the strike price. Therefore, the intrinsic value is 330p – 300p = 30p.<\/p>"},{"s":5,"n":82,"id":"Chapter 5, Section 2","q":"<p>If a borrower wants to hedge the risk that the floating rate on their loan will rise above a certain level, they will buy a:<\/p>","o":[{"l":"A","h":"floor"},{"l":"B","h":"collar"},{"l":"C","h":"swaption"},{"l":"D","h":"cap"}],"a":"D","e":"<p><strong>Réponse : D<\/strong> (Chapter 5, Section 2)<\/p><p>Caps are a type of option that allow the buyer to set a maximum rate on an underlying borrowing/loan.<\/p>"},{"s":1,"n":83,"id":"Chapter 1, Section 2.1","q":"<p>Which of these statements is most accurate in relation to trading in options?<\/p>","o":[{"l":"A","h":"The buyer buys the underlying from the seller of the option"},{"l":"B","h":"The seller sells the buyer the right to buy the underlying"},{"l":"C","h":"The buyer buys the right either to buy or sell the underlying"},{"l":"D","h":"The buyer buys the right to either buy or sell a single option"}],"a":"C","e":"<p><strong>Réponse : C<\/strong> (Chapter 1, Section 2.1)<\/p><p>An option buyer buys either an option to buy (call) or an option to sell (put) the underlying from or to the seller (or writer) for a premium.<\/p>"},{"s":4,"n":84,"id":"Chapter 4, Section 1.7","q":"<p>Which of the following best describes the activity of an arbitrageur?<\/p>","o":[{"l":"A","h":"Using the cash market to reduce gearing"},{"l":"B","h":"Using derivatives to minimise risk on a position"},{"l":"C","h":"Seeking to profit from mispricings between markets"},{"l":"D","h":"Mainly trading contracts on the same underlying, but different maturities"}],"a":"C","e":"<p><strong>Réponse : C<\/strong> (Chapter 4, Section 1.7)<\/p><p>Arbitrage involves spotting mispricings between any two markets, including derivative markets and profiting from the price differential.<\/p>"},{"s":6,"n":85,"id":"Chapter 6, Section 3.1","q":"<p>How does ICE Clear Europe collect margin due on positions from members?<\/p>","o":[{"l":"A","h":"By assigning collateral lodged by members"},{"l":"B","h":"By payments through a Bank of England account"},{"l":"C","h":"By requesting cash or collateral for each transaction"},{"l":"D","h":"By debiting members’ accounts via the Protected Payments System"}],"a":"D","e":"<p><strong>Réponse : D<\/strong> (Chapter 6, Section 3.1)<\/p><p>ICE Clear Europe calls on members for margin payments as necessary and these are paid through the Protected Payments System, an automatic debit from members’ bank accounts.<\/p>"},{"s":1,"n":86,"id":"Chapter 1, Section 4","q":"<p>Which of the following is normally used to settle a contract for difference?<\/p>","o":[{"l":"A","h":"Exchange of documents"},{"l":"B","h":"Exchange of financial futures"},{"l":"C","h":"Exchange of the underlying"},{"l":"D","h":"Cash"}],"a":"D","e":"<p><strong>Réponse : D<\/strong> (Chapter 1, Section 4)<\/p><p>A contract for difference can only be settled in cash.<\/p>"},{"s":8,"n":87,"id":"Chapter 8, Section 3.3","q":"<p>What action will an investor take if they are anticipating a change in the difference between a futures price and the cash price of its underlying asset?<\/p>","o":[{"l":"A","h":"Naked purchase"},{"l":"B","h":"Basis trade"},{"l":"C","h":"Intermarket spread"},{"l":"D","h":"Naked sale"}],"a":"B","e":"<p><strong>Réponse : B<\/strong> (Chapter 8, Section 3.3)<\/p><p>Basis traders profit from the fluctuating difference between a futures price and the cash price of its underlying asset – that is, the basis. They take the form of intramarket, not intermarket, spreads.<\/p>"},{"s":9,"n":88,"id":"Chapter 9, Section 3.3.2","q":"<p>What did the Commodity Futures Modernization Act 2000 permit?<\/p>","o":[{"l":"A","h":"FLEX options"},{"l":"B","h":"Single stock futures"},{"l":"C","h":"Swap futures"},{"l":"D","h":"Synthetic futures"}],"a":"B","e":"<p><strong>Réponse : B<\/strong> (Chapter 9, Section 3.3.2)<\/p><p>In the US, single stock futures were permitted under the Commodity Futures Modernization Act 2000.<\/p>"},{"s":3,"n":89,"id":"Chapter 3, Section 2","q":"<p>What is a block trade?<\/p>","o":[{"l":"A","h":"A large transaction between an exchange member and a wholesale client, negotiated away from the central order book and reported after completion"},{"l":"B","h":"A large transaction between an exchange member and a wholesale client, according to the terms of the central order book and reported after completion"},{"l":"C","h":"An off-market transaction that involves the swapping of an OTC position with a futures position"},{"l":"D","h":"An off-market transaction that involves the swapping of an OTC position with a series of futures contracts"}],"a":"A","e":"<p><strong>Réponse : A<\/strong> (Chapter 3, Section 2)<\/p><p>Block trades offer the opportunity to negotiate terms privately, providing that the order is reported into the exchange once completed. C and D relate to exchange of futures for physical (EFP) and exchange of futures for swaps (EFS) transactions.<\/p>"},{"s":1,"n":90,"id":"Chapter 1, Section 2.4","q":"<p>If you buy a 100 put for a premium of 13, what will your maximum potential profit be?<\/p>","o":[{"l":"A","h":"13"},{"l":"B","h":"87"},{"l":"C","h":"100"},{"l":"D","h":"Unlimited"}],"a":"B","e":"<p><strong>Réponse : B<\/strong> (Chapter 1, Section 2.4)<\/p><p>The maximum gain on a long put = strike price – premium (100 – 13 = 87).<\/p>"},{"s":4,"n":91,"id":"Chapter 4, Section 4.1","q":"<p>An increase in which of the following factors will cause all option premiums to increase?<\/p>","o":[{"l":"A","h":"Time to maturity"},{"l":"B","h":"Risk-free interest rate"},{"l":"C","h":"Lower strike price"},{"l":"D","h":"Price of the underlying"}],"a":"A","e":"<p><strong>Réponse : A<\/strong> (Chapter 4, Section 4.1)<\/p><p>An increase in interest rates and the price of the underlying will cause call premiums to rise, and put premiums to fall. For all options, an increase in the time to maturity means that the option has a longer life and therefore will increase its value/premium.<\/p>"},{"s":3,"n":92,"id":"Chapter 3, Section 5.1","q":"<p>Which of the following applies to segregated accounts?<\/p>","o":[{"l":"A","h":"The customer has the same protection as non-segregated customers"},{"l":"B","h":"The transaction ends up in a house account, separate from all other customers"},{"l":"C","h":"Assets are protected in the event of a default by the firm"},{"l":"D","h":"Assets are held in a single portfolio"}],"a":"C","e":"<p><strong>Réponse : C<\/strong> (Chapter 3, Section 5.1)<\/p><p>Customers whose accounts are segregated are protected from having to meet a defaulting firm’s liability. All of the customers’ accounts that are not segregated are treated as if they are the firm’s house positions. As a result, they will not be protected in the event of default by the firm.<\/p>"},{"s":1,"n":93,"id":"Chapter 1, Section 6.3","q":"<p>What is the purpose of marking to market?<\/p>","o":[{"l":"A","h":"To calculate the value of collateral"},{"l":"B","h":"To calculate any variation margin due"},{"l":"C","h":"To establish the daily settlement price"},{"l":"D","h":"To establish the spread margin requirement"}],"a":"B","e":"<p><strong>Réponse : B<\/strong> (Chapter 1, Section 6.3)<\/p><p>At the close of each trading day all positions are marked to market based on the daily settlement price.<\/p><p>The profit/loss on the day is measured and must be paid/received from the clearing house as variation margin.<\/p>"},{"s":3,"n":94,"id":"Chapter 3, Section 6","q":"<p>Which of the following is TRUE when comparing the price of an ETD with an OTC derivative?<\/p>","o":[{"l":"A","h":"The OTC price will always have a tighter bid/offer spread"},{"l":"B","h":"Both are usually the same, since both are reported to the market"},{"l":"C","h":"The ETD price spread is wider, since it includes the initial margin"},{"l":"D","h":"The ETD price is more transparent, since it is quoted via the market"}],"a":"D","e":"<p><strong>Réponse : D<\/strong> (Chapter 3, Section 6)<\/p><p>The prices of all exchange-traded contracts are highly transparent, since they are listed by the exchange and have full public dissemination. All exchange members have access to all prices quotes at any given time.<\/p>"},{"s":8,"n":95,"id":"Chapter 8, Section 4.3.1","q":"<p>A covered call is closest to which of these?<\/p>","o":[{"l":"A","h":"Synthetic short put position"},{"l":"B","h":"Synthetic short call position"},{"l":"C","h":"Synthetic long call position"},{"l":"D","h":"Synthetic long put position"}],"a":"A","e":"<p><strong>Réponse : A<\/strong> (Chapter 8, Section 4.3.1)<\/p><p>A long underlying and a short call together create the profit and loss profile of a short put. A synthetic short put is where an investor sells a call and buys a future – effectively a covered short call position.<\/p>"},{"s":8,"n":96,"id":"Chapter 8, Section 5.1","q":"<p>An investor bought 1 June 100 call for 22 and sold 1 June 120 call for 6. What market expectation did they have?<\/p>","o":[{"l":"A","h":"Neutral"},{"l":"B","h":"Volatile"},{"l":"C","h":"Moderately bullish"},{"l":"D","h":"Bearish"}],"a":"C","e":"<p><strong>Réponse : C<\/strong> (Chapter 8, Section 5.1)<\/p><p>The investor has bought the call with the lower strike price and sold the call with the higher strike price, creating a bull spread.<\/p>"},{"s":8,"n":97,"id":"Chapter 8, Section 3","q":"<p>Assume that S&amp;P 500 index futures are currently priced at $1,600 and the contract size is $250. How many index futures contracts will be required to hedge a $15 million portfolio of US equities that has a beta of 1.12?<\/p>","o":[{"l":"A","h":"15"},{"l":"B","h":"19"},{"l":"C","h":"38"},{"l":"D","h":"42"}],"a":"D","e":"<p><strong>Réponse : D<\/strong> (Chapter 8, Section 3)<\/p><p>The correct formula is (portfolio value / (futures price x contract size)) x portfolio beta. Therefore, the correct answer is ($15m / (1600 x $250)) x 1.12 = 42 contracts.<\/p>"},{"s":7,"n":98,"id":"Chapter 7, Section 1.2.1","q":"<p>If tick size is half a point for a future on the FTSE 100 index and is valued at £5, what is the profit for an investor who goes long with the index at 9260 and then settles at expiry with the index at 9300?<\/p>","o":[{"l":"A","h":"£20"},{"l":"B","h":"£200"},{"l":"C","h":"£400"},{"l":"D","h":"£4,260"}],"a":"C","e":"<p><strong>Réponse : C<\/strong> (Chapter 7, Section 1.2.1)<\/p><p>The profit is the tick value (£5) times the number of ticks moved. Because the tick size is half a point, the number of ticks moved is twice the number of points moved (40). So the equation is £5 x 40 x 2 = £400.<\/p>"},{"s":5,"n":99,"id":"Chapter 5, Section 6.7","q":"<p>Which of the following services does SWIFTNet FpML provide?<\/p>","o":[{"l":"A","h":"A payments netting system across a range of OTC contracts"},{"l":"B","h":"A real-time matching system for a range of OTC confirmations"},{"l":"C","h":"A straight-through payment system for foreign exchange (FX) and swap transactions"},{"l":"D","h":"A real-time position and credit limit monitoring system"}],"a":"D","e":"<p><strong>Réponse : D<\/strong> (Chapter 5, Section 6.7)<\/p><p>SWIFTNet FpML is a real-time confirmation and exception monitoring system for FX, money market and OTC derivative confirmations, whose main goal is to increase the efficiency of users’ straight-through processing of OTC derivative confirmations.<\/p>"},{"s":3,"n":100,"id":"Chapter 3, Section 6","q":"<p>Although the exact limit varies by exchange and product, what time period following verbal agreement must a block trade be reported?<\/p>","o":[{"l":"A","h":"30 seconds"},{"l":"B","h":"Five minutes"},{"l":"C","h":"One day"},{"l":"D","h":"By market close"}],"a":"B","e":"<p><strong>Réponse : B<\/strong> (Chapter 3, Section 6)<\/p><p>Block trades must be reported to the exchange within five minutes and an hour of verbal agreement being reached.<\/p>"},{"s":2,"n":101,"id":"Chapter 2, Section 3.2","q":"<p>If a UK exporter wants to hedge the risk associated with the euro-denominated receipts for its products, which of the following will provide an effective hedge?<\/p>","o":[{"l":"A","h":"EUR FRA"},{"l":"B","h":"GBP swaption"},{"l":"C","h":"EUR/GBP forward contract"},{"l":"D","h":"EUR/GBP swap"}],"a":"C","e":"<p><strong>Réponse : C<\/strong> (Chapter 2, Section 3.2)<\/p><p>Forward FX contracts are a good means of hedging currency risk.<\/p>"},{"s":1,"n":102,"id":"Chapter 1, Section 2.3","q":"<p>If you buy a 100 call for a premium of 13, what is your maximum potential profit?<\/p>","o":[{"l":"A","h":"13"},{"l":"B","h":"87"},{"l":"C","h":"100"},{"l":"D","h":"Unlimited"}],"a":"D","e":"<p><strong>Réponse : D<\/strong> (Chapter 1, Section 2.3)<\/p><p>Loss is limited to the premium paid, but for the buyer of a call, profit is potentially unlimited.<\/p>"},{"s":1,"n":103,"id":"Chapter 1, Section 3.1.3","q":"<p>A speculator can avoid taking delivery of an underlying asset in their long futures position by:<\/p>","o":[{"l":"A","h":"selling an option on the underlying"},{"l":"B","h":"extending the terms of the future"},{"l":"C","h":"selling an equivalent future"},{"l":"D","h":"renegotiating the contract"}],"a":"C","e":"<p><strong>Réponse : C<\/strong> (Chapter 1, Section 3.1.3)<\/p><p>A trader can remove any delivery obligations by taking an equal and opposite position before the expiry. This will crystallise any gains or losses.<\/p>"},{"s":7,"n":104,"id":"Chapter 7, Section 1.3.1","q":"<p>Which formula is generally used to calculate the invoice amount on a physically delivered contract?<\/p>","o":[{"l":"A","h":"Exchange delivery settlement price (EDSP) x scale factor x number of contracts"},{"l":"B","h":"(EDSP/scale factor) x number of contracts"},{"l":"C","h":"(Settlement price/scale factor) x number of contracts"},{"l":"D","h":"Traded price x scale factor x number of contracts"}],"a":"A","e":"<p><strong>Réponse : A<\/strong> (Chapter 7, Section 1.3.1)<\/p><p>For physically delivered contracts, the futures buyers will receive an invoice for the asset and have to pay the amount stated in the invoice. This is calculated using the formula: EDSP x scale factor x number of contracts. For bond futures, the calculation differs to include the price factor and accrued interest.<\/p>"},{"s":1,"n":105,"id":"Chapter 1, Section 5.5.1","q":"<p>The most effective way to change the interest rate and/or the currency exposure of a specific investment is to enter into:<\/p>","o":[{"l":"A","h":"an asset swap"},{"l":"B","h":"a currency swaption"},{"l":"C","h":"a collar"},{"l":"D","h":"an interest rate swap"}],"a":"A","e":"<p><strong>Réponse : A<\/strong> (Chapter 1, Section 5.5.1)<\/p><p>An asset swap is the most effective way to change the total exposure of an asset.<\/p>"},{"s":6,"n":106,"id":"Chapter 6, Section 3.2.2","q":"<p>What is the purpose of variation margining?<\/p>","o":[{"l":"A","h":"To settle profits or losses over a period"},{"l":"B","h":"To remunerate traders"},{"l":"C","h":"To act as a one-off initial deposit"},{"l":"D","h":"To take account of changing interest rates"}],"a":"A","e":"<p><strong>Réponse : A<\/strong> (Chapter 6, Section 3.2.2)<\/p><p>Variation margining helps protect against default by settling the profit or loss on a position daily.<\/p>"},{"s":9,"n":107,"id":"Chapter 9, Section 3.3.2","q":"<p>A UK, FCA-authorised firm is approached by a US resident. Which of the following is the firm allowed or required to do?<\/p>","o":[{"l":"A","h":"Trade all contracts whether UK or US"},{"l":"B","h":"Trade UK contracts if the firm does not have Commodity Futures Trading Commission (CFTC) Part 30 exemption"},{"l":"C","h":"Provide a segregated account"},{"l":"D","h":"Trade US contracts if the firm has CFTC Part 30 exemption"}],"a":"C","e":"<p><strong>Réponse : C<\/strong> (Chapter 9, Section 3.3.2)<\/p><p>The UK firm is only allowed to deal in UK contracts with CFTC Part 30 Exemption. The US resident must always be provided with a segregated account.<\/p>"},{"s":8,"n":108,"id":"Chapter 8, Section 5.1","q":"<p>How is a bear spread constructed?<\/p>","o":[{"l":"A","h":"Selling a put and buying a call with a higher strike price"},{"l":"B","h":"Buying a call and selling a call with a higher strike price"},{"l":"C","h":"Selling a put and buying a put with a higher strike price"},{"l":"D","h":"Buying a put and selling a put with a higher strike price"}],"a":"C","e":"<p><strong>Réponse : C<\/strong> (Chapter 8, Section 5.1)<\/p><p>For a bear spread you buy the high strike and sell the low strike.<\/p>"},{"s":8,"n":109,"id":"Chapter 8, Section 3","q":"<p>Which of the following might be a likely scenario for a futures hedge?<\/p>","o":[{"l":"A","h":"An investor notices that grain futures can be purchased more cheaply in London than in Chicago"},{"l":"B","h":"A company dealing in a commodity wishes to capitalise on the rising price of that commodity"},{"l":"C","h":"A company requiring a commodity wishes to protect itself against possible price rises"},{"l":"D","h":"An investor anticipates a rise in bond yields following an interest rate change"}],"a":"C","e":"<p><strong>Réponse : C<\/strong> (Chapter 8, Section 3)<\/p><p>This is the typical reason for a hedge. If the company goes long a future in the commodity it wishes to purchase, then even if the price goes up, the value of the future will go up too, offsetting the extra expenditure the company will have to make on the commodity in the spot market. This is a long hedge.<\/p>"},{"s":8,"n":110,"id":"Chapter 8, Section 5.2","q":"<p>Which of the following is a type of calendar spread?<\/p>","o":[{"l":"A","h":"Vertical spread"},{"l":"B","h":"Temporal option"},{"l":"C","h":"Directional spread"},{"l":"D","h":"Horizontal spread"}],"a":"D","e":"<p><strong>Réponse : D<\/strong> (Chapter 8, Section 5.2)<\/p><p>A horizontal spread is one type of calendar spread, involving buying and selling the same option across different expiry months.<\/p>"},{"s":3,"n":111,"id":"Chapter 3, Section 1.2","q":"<p>If a dealer wants to open a position by buying at the best available price, once a limit has been reached, what kind of order should be given?<\/p>","o":[{"l":"A","h":"Limit stop order"},{"l":"B","h":"Limit order"},{"l":"C","h":"Market if touched order"},{"l":"D","h":"Spread order"}],"a":"C","e":"<p><strong>Réponse : C<\/strong> (Chapter 3, Section 1.2)<\/p><p>A market-if-touched (MIT) order is an order to open a position that becomes a market order once the limit has been reached.<\/p>"},{"s":1,"n":112,"id":"Chapter 1, Section 2.3.3","q":"<p>What is the value of a 760 index put when the value at expiry of the underlying index is 772?<\/p>","o":[{"l":"A","h":"–12"},{"l":"B","h":"0"},{"l":"C","h":"12"},{"l":"D","h":"760"}],"a":"B","e":"<p><strong>Réponse : B<\/strong> (Chapter 1, Section 2.3.3)<\/p><p>At expiry, the put has no value, as the strike price is below the underlying price.<\/p>"},{"s":2,"n":113,"id":"Chapter 2, Section 6.5","q":"<p>When might the price of emissions contracts be expected to rise?<\/p>","o":[{"l":"A","h":"When heavy polluters restructure their operations to reduce emissions and no longer need to buy as many contracts for offset, thus creating oversupply"},{"l":"B","h":"If emissions in a specific pollutant increase"},{"l":"C","h":"As regulation tightens and pollution targets are reduced"},{"l":"D","h":"As pollution targets are reached"}],"a":"C","e":"<p><strong>Réponse : C<\/strong> (Chapter 2, Section 6.5)<\/p><p>Emissions contracts are initially bought by companies in order to offset levels of emissions that exceed set targets such as those established in the Kyoto Protocol. The contracts will become more valuable when these pollution targets are reduced, eg, as emmissions regulation becomes more strict.<\/p>"},{"s":7,"n":114,"id":"Chapter 7, Section 1.3.1","q":"<p>An investor has bought 25 Brent Crude Oil futures contracts on ICE Futures at $63.25 per barrel and later closes out when the price is $64.30 per barrel. The contract size is 1,000 barrels. What is the profit?<\/p>","o":[{"l":"A","h":"$6,250"},{"l":"B","h":"$10,050"},{"l":"C","h":"$16,075"},{"l":"D","h":"$26,250"}],"a":"D","e":"<p><strong>Réponse : D<\/strong> (Chapter 7, Section 1.3.1)<\/p><p>The investor has made a profit of $1.05 per barrel after buying at $63.25 and selling at $64.30 and each contract represents 1,000 barrels. $1.05 x 1,000 barrels x 25 contracts = $26,250.<\/p>"},{"s":1,"n":115,"id":"Chapter 1, Section 5.3.3","q":"<p>A long put option is normally considered to have the potential for:<\/p>","o":[{"l":"A","h":"unlimited profit and unlimited loss"},{"l":"B","h":"limited profit and limited loss"},{"l":"C","h":"unlimited profit and limited loss"},{"l":"D","h":"limited profit and unlimited loss"}],"a":"B","e":"<p><strong>Réponse : B<\/strong> (Chapter 1, Section 5.3.3)<\/p><p>Loss is limited to the premium paid. Profit is limited to the exercise price, less the premium (as the underlying price cannot fall below zero).<\/p>"},{"s":7,"n":116,"id":"Chapter 7, Section 1.3.1","q":"<p>Which of the following types of margin is exclusively paid by a client to the member?<\/p>","o":[{"l":"A","h":"Intra-day margin"},{"l":"B","h":"Maintenance margin"},{"l":"C","h":"Spread margin"},{"l":"D","h":"Variation margin"}],"a":"B","e":"<p><strong>Réponse : B<\/strong> (Chapter 7, Section 1.3.1)<\/p><p>Maintenance margin is an arrangement between the member firm and its client. A firm will usually require a client to deposit more than the initial margin and allows for the payment of some variation margin to avoid referring back to the client every day. Once the credit breaches a preset limit, the member will issue a margin call expecting the client to replenish the account.<\/p>"},{"s":8,"n":117,"id":"Chapter 8, Section 5.1","q":"<p>An investor sells a July 100 call and buys a July 90 call on the same underlying. What strategy is this?<\/p>","o":[{"l":"A","h":"Vertical spread"},{"l":"B","h":"Horizontal spread"},{"l":"C","h":"Diagonal spread"},{"l":"D","h":"Simple spread"}],"a":"A","e":"<p><strong>Réponse : A<\/strong> (Chapter 8, Section 5.1)<\/p><p>Vertical spreads, or price spreads, take place when an investor buys and sells options that have varying strike prices, but have the same expiry date. This investor has created a vertical, bull spread.<\/p>"},{"s":7,"n":118,"id":"Chapter 7, Section 1.4","q":"<p>Which of the following is the usual procedure when a futures contract is being physically delivered?<\/p>","o":[{"l":"A","h":"The buyer nominates the time and place of delivery"},{"l":"B","h":"The clearing house gives instructions on delivery"},{"l":"C","h":"The exchange stipulates the delivery time"},{"l":"D","h":"The seller gives notice of intention to deliver"}],"a":"D","e":"<p><strong>Réponse : D<\/strong> (Chapter 7, Section 1.4)<\/p><p>Futures sellers give notice declaring their intention to deliver the asset to the clearing house. The clearing house assigns the assets to the futures buyers and, if there is any flexibility in the contract, the seller can nominate what, where and when to deliver.<\/p>"},{"s":6,"n":119,"id":"Chapter 6, Section 1.3","q":"<p>Which of the following distinguishes ICE Clear Europe as operating a mutual guarantee system?<\/p>","o":[{"l":"A","h":"A collective default fund"},{"l":"B","h":"Financial Services Compensation Scheme (FSCS) eligibility"},{"l":"C","h":"Insurance cover"},{"l":"D","h":"Balance sheet reserves"}],"a":"A","e":"<p><strong>Réponse : A<\/strong> (Chapter 6, Section 1.3)<\/p><p>All members of ICE Clear Europe contribute to a member default fund, which is available to cover the liabilities of a defaulting member. This system is known as a mutual guarantee system.<\/p>"},{"s":3,"n":120,"id":"Chapter 3, Section 6","q":"<p>A basis trade is agreed on ICE Futures Europe at 11.00am. By what time must the trade have been reported?<\/p>","o":[{"l":"A","h":"11.03am"},{"l":"B","h":"11.05am"},{"l":"C","h":"11.15am"},{"l":"D","h":"11.30am"}],"a":"C","e":"<p><strong>Réponse : C<\/strong> (Chapter 3, Section 6)<\/p><p>On ICE Futures, basis trades are to be reported within 15 minutes of the time the trade was organised.<\/p>"},{"s":4,"n":121,"id":"Chapter 4, Section 2","q":"<p>A European put option has a strike price of 350p and the current price of the underlying instrument is 275p and the premium 65p. What is the best course of action for an investor?<\/p>","o":[{"l":"A","h":"Buy the option and sell the underlying"},{"l":"B","h":"Sell the option and buy the underlying"},{"l":"C","h":"Buy the option and buy the underlying"},{"l":"D","h":"Sell the option and sell the underlying"}],"a":"C","e":"<p><strong>Réponse : C<\/strong> (Chapter 4, Section 2)<\/p><p>Exercise price (350p) – underlying price (275p) = intrinsic value (75p). The premium is 10p under its intrinsic value. The investor takes advantage of the low premium to buy both the option and the underlying so as to be able to deliver the underlying for a risk-free profit of 10p.<\/p>"},{"s":4,"n":122,"id":"Chapter 4, Section 4.1.1","q":"<p>Which of these statements is TRUE in relation to time value?<\/p>","o":[{"l":"A","h":"Time value is based on the length of an option’s risk period"},{"l":"B","h":"Time is value measured by gamma"},{"l":"C","h":"Time value is negative for puts and positive for calls"},{"l":"D","h":"Time value can fall to zero as expirations get longer"}],"a":"A","e":"<p><strong>Réponse : A<\/strong> (Chapter 4, Section 4.1.1)<\/p><p>Time value increases in proportion to the length of time the writer is at risk from the buyer exercising.<\/p>"},{"s":2,"n":123,"id":"Chapter 2, Section 4.1","q":"<p>What classification is given to a UK government bond that an investor has held from issue five years ago and which is due to be redeemed in six years’ time?<\/p>","o":[{"l":"A","h":"Short-dated"},{"l":"B","h":"Medium-dated"},{"l":"C","h":"Long-dated"},{"l":"D","h":"Dual-dated"}],"a":"A","e":"<p><strong>Réponse : A<\/strong> (Chapter 2, Section 4.1)<\/p><p>A UK gilt with less than seven years to redemption is classified as short-dated.<\/p>"},{"s":8,"n":124,"id":"Chapter 8, Section 2.1","q":"<p>Which of the following is an example of an intramarket spread?<\/p>","o":[{"l":"A","h":"Buying 250 June calls, selling 250 September calls"},{"l":"B","h":"Selling 200 June puts, selling 220 September calls"},{"l":"C","h":"Buying 240 June calls, buying 260 September calls"},{"l":"D","h":"Buying September futures, buying November futures"}],"a":"A","e":"<p><strong>Réponse : A<\/strong> (Chapter 8, Section 2.1)<\/p><p>Spreads require buy and sell transactions on the same underlying asset. Intramarket spreads are trades based on the simultaneous buying and selling of futures with different expiry dates on the same underlying asset.<\/p>"},{"s":3,"n":125,"id":"Chapter 3, Section 6.2","q":"<p>An advantage of exchange price feeds is to:<\/p>","o":[{"l":"A","h":"allocate limit orders"},{"l":"B","h":"display clearing information"},{"l":"C","h":"match trading parties"},{"l":"D","h":"provide real-time prices"}],"a":"D","e":"<p><strong>Réponse : D<\/strong> (Chapter 3, Section 6.2)<\/p><p>Exchanges disseminate the trade reporting information through a price feed. Real-time prices and trade information are included in the feed that is available to exchange members through quote vendors.<\/p>"},{"s":1,"n":126,"id":"Chapter 1, Section 6.1","q":"<p>What are the key advantages of a FLEX facility?<\/p>","o":[{"l":"A","h":"Standardised terms with customised settlement, between wholesale counterparties"},{"l":"B","h":"Standardised terms with OTC delivery, between retail and wholesale counterparties"},{"l":"C","h":"Customised terms with standard exchange settlement, between wholesale counterparties"},{"l":"D","h":"Customised terms with standard exchange settlement, between retail or wholesale counterparties"}],"a":"C","e":"<p><strong>Réponse : C<\/strong> (Chapter 1, Section 6.1)<\/p><p>The FLEX facility combines the flexibility of the OTC market in customising a transaction, with the clearing and other advantages of exchange trading. This reduces some of the risks normally associated with OTC trading. Typically, this facility is only open to exchange members, ie, for wholesale business.<\/p>"},{"s":6,"n":127,"id":"Chapter 6, Section 3.1","q":"<p>What method is used by London SPAN to assess volatility in options positions?<\/p>","o":[{"l":"A","h":"Basis"},{"l":"B","h":"Deltas"},{"l":"C","h":"Gammas"},{"l":"D","h":"Net liquidation values"}],"a":"B","e":"<p><strong>Réponse : B<\/strong> (Chapter 6, Section 3.1)<\/p><p>Options positions will be affected by volatility, and London SPAN uses deltas to calculate the equivalent number of futures to quantify any potential offset.<\/p>"},{"s":5,"n":128,"id":"Chapter 5, Section 4.1","q":"<p>What measurement of an option is also known as the hedge ratio?<\/p>","o":[{"l":"A","h":"Beta"},{"l":"B","h":"Delta"},{"l":"C","h":"Gamma"},{"l":"D","h":"Vega"}],"a":"B","e":"<p><strong>Réponse : B<\/strong> (Chapter 5, Section 4.1)<\/p><p>Delta is the Greek measure or ratio that measures how the change in the underlying asset’s value changes the option’s value. It has a range of zero to one, positive or negative.<\/p>"},{"s":6,"n":129,"id":"Chapter 6, Section 3.2.2","q":"<p>What type of margin represents daily movements on open positions in derivatives?<\/p>","o":[{"l":"A","h":"Variation"},{"l":"B","h":"Realised"},{"l":"C","h":"Initial"},{"l":"D","h":"Spread"}],"a":"A","e":"<p><strong>Réponse : A<\/strong> (Chapter 6, Section 3.2.2)<\/p><p>Initial margin is the amount paid by both parties at the outset of a contract to the clearing house.<\/p><p>Variation margin is the amount calculated against daily price movements and paid by whomever the price is moving against.<\/p>"},{"s":8,"n":130,"id":"Chapter 8, Section 7","q":"<p>How do you create a synthetic long future?<\/p>","o":[{"l":"A","h":"Buy a call and buy a put"},{"l":"B","h":"Buy a call and sell a put"},{"l":"C","h":"Sell a call and sell a put"},{"l":"D","h":"Sell a call and buy a call"}],"a":"B","e":"<p><strong>Réponse : B<\/strong> (Chapter 8, Section 7)<\/p><p>A synthetic long future results where matching short put and long call options positions are taken on a future. An investor will buy a call and sell a put with the same strike price and expiry.<\/p>"},{"s":1,"n":131,"id":"Chapter 1, Section 2.4","q":"<p>The only credit risk associated with OTC options trading exists for a:<\/p>","o":[{"l":"A","h":"bank that has sold an in-the-money put to a client"},{"l":"B","h":"customer who has sold an at-the-money call to its broker"},{"l":"C","h":"bank that has sold an in-the-money call to another bank"},{"l":"D","h":"broker who has bought an out-of-the-money call from a client"}],"a":"D","e":"<p><strong>Réponse : D<\/strong> (Chapter 1, Section 2.4)<\/p><p>Since an option buyer usually buys the premium upfront, the only credit risk lies with any option buyer, no matter what type of option has been purchased.<\/p>"},{"s":5,"n":132,"id":"Chapter 5, Section 5.1","q":"<p>An important feature of a master agreement is that it:<\/p>","o":[{"l":"A","h":"enables banks to swap offsetting contracts to reduce their total exposure"},{"l":"B","h":"allows the netting of all amounts due between two parties upon early termination of contracts covered by the agreement to one single payment"},{"l":"C","h":"allows two parties to share information and net any outstanding contracts with a common third party"},{"l":"D","h":"provides a set and accepted framework that allows several parties to measure their risk to a specific type of contract"}],"a":"B","e":"<p><strong>Réponse : B<\/strong> (Chapter 5, Section 5.1)<\/p><p>One of the main advantages of a master agreement is the fact that is has two netting features, which helps to reduce credit risk.<\/p>"},{"s":1,"n":133,"id":"Chapter 1, Section 2.2","q":"<p>What type of option gives the holder the right to buy?<\/p>","o":[{"l":"A","h":"Put option"},{"l":"B","h":"Call option"},{"l":"C","h":"Long option"},{"l":"D","h":"Short option"}],"a":"B","e":"<p><strong>Réponse : B<\/strong> (Chapter 1, Section 2.2)<\/p><p>A call option is an option to buy an asset for a specified price at a specified date or range of dates.<\/p>"},{"s":3,"n":134,"id":"Chapter 3, Section 2","q":"<p>Which of the following is a type of wholesale trade recognised by ICE Trading Platform?<\/p>","o":[{"l":"A","h":"Basis trade"},{"l":"B","h":"Stop trade"},{"l":"C","h":"Cross trade"},{"l":"D","h":"Limit trade"}],"a":"A","e":"<p><strong>Réponse : A<\/strong> (Chapter 3, Section 2)<\/p><p>A basis trade is one of two types of wholesale trade recognised by ICE Clear Europe. It is the simultaneous exchange of a financial asset or instrument together with an appropriate offsetting number of futures contacts in a privately negotiated transaction between two parties.<\/p>"},{"s":2,"n":135,"id":"Chapter 2, Section 3.2.1","q":"<p>The interest rate parity theorem states that:<\/p>","o":[{"l":"A","h":"in FX forward rates, the higher interest rate currency commands a premium in the FX forward market"},{"l":"B","h":"in FX swaptions, the lower interest rate currency commands a lower premium payment"},{"l":"C","h":"in FX forward rates, the lower interest rate currency commands a premium in the FX forward market"},{"l":"D","h":"Forward rate agreement (FRA) rates are determined by the relative swap rates of the two currencies involved in an FX FRA"}],"a":"C","e":"<p><strong>Réponse : C<\/strong> (Chapter 2, Section 3.2.1)<\/p><p>The interest rate parity theorem is the basis for the FX forward market, to ensure that arbitrage opportunities do not exist.<\/p>"},{"s":4,"n":136,"id":"Chapter 4, Section 4.4.2","q":"<p>An option’s vega is useful in that it is a measure of:<\/p>","o":[{"l":"A","h":"the relationship between an option’s time decay and market sentiment"},{"l":"B","h":"an option’s sensitivity to changes in volatility"},{"l":"C","h":"an option’s hedge ratio and how it changes relative to price movements"},{"l":"D","h":"an option’s sensitivity to market interest rates"}],"a":"B","e":"<p><strong>Réponse : B<\/strong> (Chapter 4, Section 4.4.2)<\/p><p>Vega is the measure of how a 1% change in volatility affects an option’s value relative to changes in both expected or implied volatility and current market conditions.<\/p>"},{"s":4,"n":137,"id":"Chapter 4, Section 4.1.1","q":"<p>Which of the following best describes when a put option is out-of-the-money (OTM)?<\/p>","o":[{"l":"A","h":"When the strike price plus the premium is greater than the current market price"},{"l":"B","h":"When the strike price plus the premium is less than the current market price"},{"l":"C","h":"When the strike price minus the premium is less than the current market price"},{"l":"D","h":"When the strike price is less than the current market price"}],"a":"D","e":"<p><strong>Réponse : D<\/strong> (Chapter 4, Section 4.1.1)<\/p><p>An out-of-the-money option is where there is no intrinsic value. The intrinsic value is the difference between the strike price and the underlying asset price. If the strike price is less than the current market price, a put option is out-of-the-money.<\/p>"},{"s":4,"n":138,"id":"Chapter 4, Section 4.3","q":"<p>What is the approximate delta of a deep in-the-money short call position?<\/p>","o":[{"l":"A","h":"–0.5"},{"l":"B","h":"+0.5"},{"l":"C","h":"–1.0"},{"l":"D","h":"+1.0"}],"a":"C","e":"<p><strong>Réponse : C<\/strong> (Chapter 4, Section 4.3)<\/p><p>Delta equals the change in option premium divided by the change in price of the underlying. Therefore, delta = –1 x 1 = –1.0.<\/p>"},{"s":1,"n":139,"id":"Chapter 1, Section 6.1","q":"<p>The type of option that combines the benefits of customisation of an OTC product with the advantages of being listed on an exchange is known as:<\/p>","o":[{"l":"A","h":"an average rate option"},{"l":"B","h":"a Bermudan option"},{"l":"C","h":"a FLEX option"},{"l":"D","h":"a lookback option"}],"a":"C","e":"<p><strong>Réponse : C<\/strong> (Chapter 1, Section 6.1)<\/p><p>FLEX options are exchange-traded options that allow buyers to customise key contract terms.<\/p>"},{"s":1,"n":140,"id":"Chapter 1, Section 2.3.4","q":"<p>The writer of an option who agrees to buy the underlying at a given date and price has gone:<\/p>","o":[{"l":"A","h":"short a call option"},{"l":"B","h":"long a call option"},{"l":"C","h":"long a put option"},{"l":"D","h":"short a put option"}],"a":"D","e":"<p><strong>Réponse : D<\/strong> (Chapter 1, Section 2.3.4)<\/p><p>The writer sells (goes short) the option for the buyer to sell them the underlying at a fixed price in the future, hoping the price will rise and the buyer will abandon the option, leaving the writer with the premium.<\/p>"},{"s":4,"n":141,"id":"Chapter 4, Section 4.1.2","q":"<p>The strike price of a put option is £2.00 and the current price is £2.20. The premium when this option was purchased was 15p and it is now 12p. What is the time value of this option today?<\/p>","o":[{"l":"A","h":"3p"},{"l":"B","h":"12p"},{"l":"C","h":"20p"},{"l":"D","h":"32p"}],"a":"B","e":"<p><strong>Réponse : B<\/strong> (Chapter 4, Section 4.1.2)<\/p><p>The premium is calculated as intrinsic value plus the time value. Because the premium is 12p and the intrinsic value is nothing (because the option is out-of-the-money) the time value must be 12p.<\/p>"},{"s":8,"n":142,"id":"Chapter 8, Section 9.2","q":"<p>All of the following are true with respect to exchange traded funds (ETFs) and derivatives, except:<\/p>","o":[{"l":"A","h":"ETF shares could be the underlying asset for options contracts"},{"l":"B","h":"The investment manager of the ETF may use derivatives to replicate a long position in a physical commodity"},{"l":"C","h":"The investment manager of the ETF could utilise derivatives to replicate the leveraged short performance of a benchmark index"},{"l":"D","h":"The ETF shares could be part of a swap with retail investors, exchanging their investment for a floating rate payment."}],"a":"D","e":"<p><strong>Réponse : D<\/strong> (Chapter 8, Section 9.2)<\/p><p>Options on ETF shares have become popular and many ETFs use derivatives to generate the returns of their target asset – such as a physical commodity like crude oil, or a 3x leveraged short equity index. An ETF would not enter into a swap with its investors due to the regulations around ETFs (which must be extremely transparent and provide daily liquidity), but also because retail investors generally cannot access OTC markets.<\/p>"},{"s":4,"n":143,"id":"Chapter 4, Section 4.2, Chapter 8, Section 7","q":"<p>The trade which creates a synthetic short position by buying a put and selling a call, then buying the futures or shares in order to take advantage of mispriced options is called a:<\/p>","o":[{"l":"A","h":"conversion"},{"l":"B","h":"reversal"},{"l":"C","h":"covered call"},{"l":"D","h":"cabinet trade"}],"a":"A","e":"<p><strong>Réponse : A<\/strong> (Chapter 4, Section 4.2, Chapter 8, Section 7)<\/p><p>Using Put-Call Parity Theorem, a conversion (buy put, sell call and buy the futures or shares) would be used to create a riskless trade to take advantage of mispriced options, in the case where the put is cheap and the call is expensive.<\/p>"},{"s":2,"n":144,"id":"Chapter 2, Section 4.1","q":"<p>Which of the following describes a Eurobond?<\/p>","o":[{"l":"A","h":"A French company issuing corporate bonds in EUR to investors in the local market"},{"l":"B","h":"The UK DMO selling sterling-denominated gilts to Australian investors"},{"l":"C","h":"The Federal Government (FG) of Nigeria selling USD-denominated bonds to global investors"},{"l":"D","h":"The US Treasury selling inflation protected bonds (TIPS) to investors in Asia"}],"a":"C","e":"<p><strong>Réponse : C<\/strong> (Chapter 2, Section 4.1)<\/p><p>A Eurobond is a bond issued offshore in a currency (usually USD or EUR) other than the home currency of the issuer. All the choices are examples of bonds issued in the local currency of the issuer except for C.<\/p>"},{"s":2,"n":145,"id":"Chapter 2, Section 2","q":"<p>After 2023, all of the following will likely remain key benchmarks interest rates for OTC derivatives, except:<\/p>","o":[{"l":"A","h":"Sterling LIBOR"},{"l":"B","h":"USD SOFR"},{"l":"C","h":"SONIA (GBP)"},{"l":"D","h":"Euro Short-Term Rate (€STR)"}],"a":"A","e":"<p><strong>Réponse : A<\/strong> (Chapter 2, Section 2)<\/p><p>Following the global financial crisis, investigations into LIBOR concluded that the set of benchmark interest rates which were determined by surveying banks were open to manipulation. Subsequently, there has been a move toward alternative rates which are based on actual market activity, thereby providing a more accurate indication of financial conditions. ICE and many national financial regulators are in the process of phasing out LIBOR for use as a benchmark for both exchange-traded and OTC derivatives, and by 2023, LIBOR in various currencies will no longer be calculated.<\/p>"}]</script>
<script type="application/json" id="pdata">[{"s":2,"n":1,"id":"Syllabus 2.2.1","q":"<p>A GBP/EUR trade in the spot FX market which is transacted on a Monday will, in a normal working week, usually be settled on which day?<\/p>","o":[{"l":"A","h":"Tuesday"},{"l":"B","h":"Wednesday"},{"l":"C","h":"Thursday"},{"l":"D","h":"Friday"}],"a":"B","e":"<p><strong>Answer: B<\/strong><\/p><p>Syllabus reference: <strong>2.2.1<\/strong> (élément 2, sous-élément 2.2, learning objective 2.2.1)<\/p>"},{"s":5,"n":2,"id":"Syllabus 5.6.2","q":"<p>Which of the following describes a market in which only the bid and ask offers of designated market makers, dealers or specialists are displayed?<\/p>","o":[{"l":"A","h":"Order driven"},{"l":"B","h":"Quote driven"},{"l":"C","h":"Price driven"},{"l":"D","h":"Amount driven"}],"a":"B","e":"<p><strong>Answer: B<\/strong><\/p><p>Syllabus reference: <strong>5.6.2<\/strong> (élément 5, sous-élément 5.6, learning objective 5.6.2)<\/p>"},{"s":1,"n":3,"id":"Syllabus 1.1.8","q":"<p>An investor is taking out a Flex option on the FTSE100 index on ICE Futures Europe and would like to customise both the exercise price and the expiry date.<\/p><p>Which of these two requirements are possible (if either)?<\/p>","o":[{"l":"A","h":"Only the exercise price"},{"l":"B","h":"Only the expiry date"},{"l":"C","h":"Both"},{"l":"D","h":"Neither"}],"a":"C","e":"<p><strong>Answer: C<\/strong><\/p><p>Syllabus reference: <strong>1.1.8<\/strong> (élément 1, sous-élément 1.1, learning objective 1.1.8)<\/p>"},{"s":1,"n":4,"id":"Syllabus 1.1.9","q":"<p>An investor buys calls on a stock. What is his maximum potential loss?<\/p>","o":[{"l":"A","h":"Unlimited"},{"l":"B","h":"The premium"},{"l":"C","h":"The strike price"},{"l":"D","h":"The strike price less the premium"}],"a":"B","e":"<p><strong>Answer: B<\/strong><\/p><p>Syllabus reference: <strong>1.1.9<\/strong> (élément 1, sous-élément 1.1, learning objective 1.1.9)<\/p>"},{"s":3,"n":5,"id":"Syllabus 3.3.1","q":"<p>Which of the following is a characteristic of a Contract for Difference?<\/p>","o":[{"l":"A","h":"The invoicing amount at delivery is based on the price differential between two related commodities"},{"l":"B","h":"The intermonth spreads are margined differently from an outright position"},{"l":"C","h":"The futures seller has an option to deliver a different quality of commodity and invoicing is achieved via conversion factors"},{"l":"D","h":"The open positions at expiry do not go to delivery but are simply marked to market"}],"a":"D","e":"<p><strong>Answer: D<\/strong><\/p><p>Syllabus reference: <strong>3.3.1<\/strong> (élément 3, sous-élément 3.3, learning objective 3.3.1)<\/p>"},{"s":1,"n":6,"id":"Syllabus 1.1.2","q":"<p>Which of the following best describes a call option?<\/p>","o":[{"l":"A","h":"The right, but not the obligation, to buy an asset at a given price on or before a given date"},{"l":"B","h":"The right, but not the obligation, to sell an asset at a given price on or before a given date"},{"l":"C","h":"A traded option contract that can be bought or sold in the market at any time during its life"},{"l":"D","h":"The obligation to buy an asset at a given price on or before a given date"}],"a":"A","e":"<p><strong>Answer: A<\/strong><\/p><p>Syllabus reference: <strong>1.1.2<\/strong> (élément 1, sous-élément 1.1, learning objective 1.1.2)<\/p>"},{"s":1,"n":7,"id":"Syllabus 1.1.4","q":"<p>Despite having sufficient funds, a derivatives trader is finding it difficult to buy a particular contract in order to close out an open position.<\/p><p>This problem is an example of the realisation of what type of risk?<\/p>","o":[{"l":"A","h":"Credit risk"},{"l":"B","h":"Settlement risk"},{"l":"C","h":"Systemic risk"},{"l":"D","h":"Liquidity risk"}],"a":"D","e":"<p><strong>Answer: D<\/strong><\/p><p>Syllabus reference: <strong>1.1.4<\/strong> (élément 1, sous-élément 1.1, learning objective 1.1.4)<\/p>"},{"s":1,"n":8,"id":"Syllabus 1.1.5","q":"<p>Gearing allows speculators in the futures market to:<\/p>","o":[{"l":"A","h":"avoid physical delivery of the underlying asset"},{"l":"B","h":"reduce their counterparty exposure"},{"l":"C","h":"buy the underlying cheaper in the OTC market"},{"l":"D","h":"pay only a fraction of a contract's value upfront"}],"a":"D","e":"<p><strong>Answer: D<\/strong><\/p><p>Syllabus reference: <strong>1.1.5<\/strong> (élément 1, sous-élément 1.1, learning objective 1.1.5)<\/p>"},{"s":2,"n":9,"id":"Syllabus 2.2.3","q":"<p>Twenty points have been quoted for a particular forward FX trade. This represents the difference between:<\/p>","o":[{"l":"A","h":"The spot price and the forward outright rate"},{"l":"B","h":"The spread for the spot bid and offer prices"},{"l":"C","h":"The relative premium of forward delivery vs any discount"},{"l":"D","h":"The base currency's forward price and that of the traded currency"}],"a":"A","e":"<p><strong>Answer: A<\/strong><\/p><p>Syllabus reference: <strong>2.2.3<\/strong> (élément 2, sous-élément 2.2, learning objective 2.2.3)<\/p>"},{"s":2,"n":10,"id":"Syllabus 2.4.1","q":"<p>Which of the following is TRUE of ordinary share voting rights?<\/p>","o":[{"l":"A","h":"Shareholders may not delegate their voting rights at company annual general meetings"},{"l":"B","h":"Shareholders voting by proxy may also vote in person at extraordinary general meetings"},{"l":"C","h":"The number of votes is in direct proportion to the number of shareholders voting"},{"l":"D","h":"Voting shareholders take an active part in a company's decision making process"}],"a":"D","e":"<p><strong>Answer: D<\/strong><\/p><p>Syllabus reference: <strong>2.4.1<\/strong> (élément 2, sous-élément 2.4, learning objective 2.4.1)<\/p>"},{"s":2,"n":11,"id":"Syllabus 2.5.1","q":"<p>Which of the following commodities is classed as an agricultural commodity?<\/p>","o":[{"l":"A","h":"Cocoa"},{"l":"B","h":"Soya beans"},{"l":"C","h":"Sugar"},{"l":"D","h":"Coffee"}],"a":"B","e":"<p><strong>Answer: B<\/strong><\/p><p>Syllabus reference: <strong>2.5.1<\/strong> (élément 2, sous-élément 2.5, learning objective 2.5.1)<\/p>"},{"s":2,"n":12,"id":"Syllabus 2.9.1","q":"<p>Under which type of derivative is the settlement price based on the relevant month's HDD or CDD?<\/p>","o":[{"l":"A","h":"Livestock"},{"l":"B","h":"Cocoa"},{"l":"C","h":"Weather"},{"l":"D","h":"Emmissions"}],"a":"C","e":"<p><strong>Answer: C<\/strong><\/p><p>Syllabus reference: <strong>2.9.1<\/strong> (élément 2, sous-élément 2.9, learning objective 2.9.1)<\/p>"},{"s":2,"n":13,"id":"Syllabus 2.1.3","q":"<p>What are the most common maturities of a Certificate of Deposit?<\/p>","o":[{"l":"A","h":"1 and 2 months"},{"l":"B","h":"3 and 6 months"},{"l":"C","h":"1 and 2 years"},{"l":"D","h":"2 and 3 years"}],"a":"B","e":"<p><strong>Answer: B<\/strong><\/p><p>Syllabus reference: <strong>2.1.3<\/strong> (élément 2, sous-élément 2.1, learning objective 2.1.3)<\/p>"},{"s":2,"n":14,"id":"Syllabus 2.3.4","q":"<p>A yield curve represents the relationship between:<\/p>","o":[{"l":"A","h":"interest rates and credit risk"},{"l":"B","h":"interest rates of two currencies"},{"l":"C","h":"interest rates and bond maturities"},{"l":"D","h":"interest rates on government and non-government bonds"}],"a":"C","e":"<p><strong>Answer: C<\/strong><\/p><p>Syllabus reference: <strong>2.3.4<\/strong> (élément 2, sous-élément 2.3, learning objective 2.3.4)<\/p>"},{"s":2,"n":15,"id":"Syllabus 2.3.5","q":"<p>Which of the following statements is CORRECT in respect of the trading of corporate bonds?<\/p>","o":[{"l":"A","h":"Corporate bonds trading takes place on major exchanges only"},{"l":"B","h":"The majority of corporate bonds trading takes place in decentralised, dealer-based, over-the-counter markets; a limited amount of dealing takes place on major exchanges"},{"l":"C","h":"Corporate bonds dealing is equally split between major exchanges and decentralised, dealer-based, over the counter markets"},{"l":"D","h":"The majority of corporate bonds dealing takes place on major exchanges, with some dealing on decentralised, dealer-based, over the counter markets"}],"a":"B","e":"<p><strong>Answer: B<\/strong><\/p><p>Syllabus reference: <strong>2.3.5<\/strong> (élément 2, sous-élément 2.3, learning objective 2.3.5)<\/p>"},{"s":2,"n":16,"id":"Syllabus 2.4.2","q":"<p>ABC plc has 6.5% cumulative preference shares in issue listed on a Stock Exchange. It has paid no dividend on them for the last five years.<\/p><p>Which of the following is TRUE?<\/p>","o":[{"l":"A","h":"The exchange listing of the preference shares would be temporarily suspended"},{"l":"B","h":"In the event of the company winding up the preference shareholders would rank ahead of bond holders"},{"l":"C","h":"The preference shareholders remain entitled to all of their unpaid dividends"},{"l":"D","h":"The preference shareholders could force the company into liquidation to reclaim outstanding dividends"}],"a":"C","e":"<p><strong>Answer: C<\/strong><\/p><p>Syllabus reference: <strong>2.4.2<\/strong> (élément 2, sous-élément 2.4, learning objective 2.4.2)<\/p>"},{"s":2,"n":17,"id":"Syllabus 2.1.1","q":"<p>Which of the following statements is CORRECT in respect of UK Treasury Bills?<\/p><p>They:<\/p>","o":[{"l":"A","h":"pay no coupon and have a maturity of either 91 days or 182 days"},{"l":"B","h":"generally pay fixed coupons and have a maturity of either 28 days or 91 days"},{"l":"C","h":"generally pay fixed coupons and have a maturity of either 91 days or 182 days"},{"l":"D","h":"pay no coupon and have a maturity of either 28 days or 91 days"}],"a":"A","e":"<p><strong>Answer: A<\/strong><\/p><p>Syllabus reference: <strong>2.1.1<\/strong> (élément 2, sous-élément 2.1, learning objective 2.1.1)<\/p>"},{"s":3,"n":18,"id":"Syllabus 3.1.1","q":"<p>In London, Zinc and Tin futures contracts are traded on:<\/p>","o":[{"l":"A","h":"the LME"},{"l":"B","h":"the LSE"},{"l":"C","h":"ICE"},{"l":"D","h":"NYSE Liffe"}],"a":"A","e":"<p><strong>Answer: A<\/strong><\/p><p>Syllabus reference: <strong>3.1.1<\/strong> (élément 3, sous-élément 3.1, learning objective 3.1.1)<\/p>"},{"s":3,"n":19,"id":"Syllabus 3.3.3","q":"<p>Where a 'market order' for a derivative is made, the order will normally be executed at:<\/p>","o":[{"l":"A","h":"the stated price or better (as soon as this can be achieved)"},{"l":"B","h":"the stated price or better (or abandoned if not immediately available)"},{"l":"C","h":"the first price available"},{"l":"D","h":"the best price immediately available"}],"a":"D","e":"<p><strong>Answer: D<\/strong><\/p><p>Syllabus reference: <strong>3.3.3<\/strong> (élément 3, sous-élément 3.3, learning objective 3.3.3)<\/p>"},{"s":3,"n":20,"id":"Syllabus 3.2.3","q":"<p>One of the key potential consequences of the FLEX facilities offered by exchanges is:<\/p>","o":[{"l":"A","h":"absence of credit exposure"},{"l":"B","h":"increased trading volumes"},{"l":"C","h":"fast track novation"},{"l":"D","h":"minimal margin requirements"}],"a":"B","e":"<p><strong>Answer: B<\/strong><\/p><p>Syllabus reference: <strong>3.2.3<\/strong> (élément 3, sous-élément 3.2, learning objective 3.2.3)<\/p>"},{"s":3,"n":21,"id":"Syllabus 3.4.3","q":"<p>What is the correct definition of a 'house account'?<\/p>","o":[{"l":"A","h":"A brokerage account from which a cash balance is automatically transferred into an interest-bearing investment"},{"l":"B","h":"A separate account designated to hold client money"},{"l":"C","h":"A brokerage account into which a customer is required to pay the full amount of securities purchased"},{"l":"D","h":"An account created by a brokerage for its own use"}],"a":"D","e":"<p><strong>Answer: D<\/strong><\/p><p>Syllabus reference: <strong>3.4.3<\/strong> (élément 3, sous-élément 3.4, learning objective 3.4.3)<\/p>"},{"s":3,"n":22,"id":"Syllabus 3.1.2","q":"<p>The clearing house acts as:<\/p>","o":[{"l":"A","h":"central depository for all securities"},{"l":"B","h":"counterparty for all transactions"},{"l":"C","h":"prime broker for the exchange"},{"l":"D","h":"price giver for all stocks traded on the exchange"}],"a":"B","e":"<p><strong>Answer: B<\/strong><\/p><p>Syllabus reference: <strong>3.1.2<\/strong> (élément 3, sous-élément 3.1, learning objective 3.1.2)<\/p>"},{"s":3,"n":23,"id":"Syllabus 3.3.1","q":"<p>For cash settlement derivatives, how does the clearing house support the final cash settlement?<\/p>","o":[{"l":"A","h":"It ensures all contracts are marked to market at the end of each trading day, allowing calculation of the final day’s variation margin"},{"l":"B","h":"It returns all initial and variation margin and performs a strike vs closing price calculation to determine final settlement value"},{"l":"C","h":"It creates an irrevocable cash settlement instruction between the buyer and the seller based on the final closing price"},{"l":"D","h":"It provides both the buyer and the seller with the exchange closing prices allowing them to agree a bilateral settlement figure"}],"a":"A","e":"<p><strong>Answer: A<\/strong><\/p><p>Syllabus reference: <strong>3.3.1<\/strong> (élément 3, sous-élément 3.3, learning objective 3.3.1)<\/p>"},{"s":4,"n":24,"id":"Syllabus 4.1.2","q":"<p>What is the cost of carry?<\/p>","o":[{"l":"A","h":"The initial margin paid by the investor when buying a future"},{"l":"B","h":"The variation margin paid by the investor when holding a future"},{"l":"C","h":"The net cost of buying and holding a position until a set date"},{"l":"D","h":"The risk free rate"}],"a":"C","e":"<p><strong>Answer: C<\/strong><\/p><p>Syllabus reference: <strong>4.1.2<\/strong> (élément 4, sous-élément 4.1, learning objective 4.1.2)<\/p>"},{"s":4,"n":25,"id":"Syllabus 4.1.4","q":"<p>In futures pricing, basis is defined as the difference between:<\/p>","o":[{"l":"A","h":"cost of carry and the future price"},{"l":"B","h":"the spot price and cost of carry"},{"l":"C","h":"the cash price and the future price"},{"l":"D","h":"the future price and the option price"}],"a":"C","e":"<p><strong>Answer: C<\/strong><\/p><p>Syllabus reference: <strong>4.1.4<\/strong> (élément 4, sous-élément 4.1, learning objective 4.1.4)<\/p>"},{"s":4,"n":26,"id":"Syllabus 4.2.1","q":"<p>Which of the following BEST describes an option premium?<\/p>","o":[{"l":"A","h":"The price of an option agreed by the buyer and seller"},{"l":"B","h":"The price at which the underlying is supplied by a writer, who has been exercised against"},{"l":"C","h":"The price at which the buyer of a call option may buy, or the buyer of a put option may sell, the underlying"},{"l":"D","h":"The amount of money given to the clearing house as margin by the writer of an option"}],"a":"A","e":"<p><strong>Answer: A<\/strong><\/p><p>Syllabus reference: <strong>4.2.1<\/strong> (élément 4, sous-élément 4.2, learning objective 4.2.1)<\/p>"},{"s":4,"n":27,"id":"Syllabus 4.2.1","q":"<p>Which of the following statements concerning time value is TRUE?<\/p>","o":[{"l":"A","h":"The longer the time remaining until expiry, the smaller the time value"},{"l":"B","h":"The series in the near month always has the highest amount of time value"},{"l":"C","h":"The longer the time remaining until expiry, the higher the time value"},{"l":"D","h":"There is no difference in time value between a near month series and a far month series"}],"a":"C","e":"<p><strong>Answer: C<\/strong><\/p><p>Syllabus reference: <strong>4.2.1<\/strong> (élément 4, sous-élément 4.2, learning objective 4.2.1)<\/p>"},{"s":4,"n":28,"id":"Syllabus 4.2.2","q":"<p>The value of a put option increases if the:<\/p>","o":[{"l":"A","h":"price of the underlying asset decreases"},{"l":"B","h":"strike price decreases"},{"l":"C","h":"volatility of the underlying asset price decreases"},{"l":"D","h":"risk-free rate decreases"}],"a":"A","e":"<p><strong>Answer: A<\/strong><\/p><p>Syllabus reference: <strong>4.2.2<\/strong> (élément 4, sous-élément 4.2, learning objective 4.2.2)<\/p>"},{"s":4,"n":29,"id":"Syllabus 4.2.4","q":"<p>For which of the following types of option will gamma be at its smallest?<\/p>","o":[{"l":"A","h":"Deep out-of-the-money put options"},{"l":"B","h":"Near the money call options"},{"l":"C","h":"Near the money put options"},{"l":"D","h":"At-the-money call options"}],"a":"A","e":"<p><strong>Answer: A<\/strong><\/p><p>Syllabus reference: <strong>4.2.4<\/strong> (élément 4, sous-élément 4.2, learning objective 4.2.4)<\/p>"},{"s":3,"n":30,"id":"Syllabus 3.2.1","q":"<p>In an open outcry market, which party initiates the first stage of the order flow process?<\/p>","o":[{"l":"A","h":"The broker"},{"l":"B","h":"The counterparty"},{"l":"C","h":"The clearing house"},{"l":"D","h":"The customer"}],"a":"D","e":"<p><strong>Answer: D<\/strong><\/p><p>Syllabus reference: <strong>3.2.1<\/strong> (élément 3, sous-élément 3.2, learning objective 3.2.1)<\/p>"},{"s":3,"n":31,"id":"Syllabus 3.3.2","q":"<p>What is the advantage of dual capacity markets?<\/p>","o":[{"l":"A","h":"Clients can obtain the best possible price"},{"l":"B","h":"Brokers can offer the best bid-offer spread"},{"l":"C","h":"Brokers can offer the lowest commission rates"},{"l":"D","h":"Clients can reduce the costs of dealing"}],"a":"A","e":"<p><strong>Answer: A<\/strong><\/p><p>Syllabus reference: <strong>3.3.2<\/strong> (élément 3, sous-élément 3.3, learning objective 3.3.2)<\/p>"},{"s":4,"n":32,"id":"Syllabus 4.1.5","q":"<p>A future is trading above its fair value.<\/p><p>What type of trade would an arbitrageur undertake?<\/p>","o":[{"l":"A","h":"Short hedge"},{"l":"B","h":"Long hedge"},{"l":"C","h":"Reverse cash and carry"},{"l":"D","h":"Cash and carry"}],"a":"D","e":"<p><strong>Answer: D<\/strong><\/p><p>Syllabus reference: <strong>4.1.5<\/strong> (élément 4, sous-élément 4.1, learning objective 4.1.5)<\/p>"},{"s":3,"n":33,"id":"Syllabus 3.3.3","q":"<p>An investor gives a market if touched buy order at the price of 537p per futures.<\/p><p>Which of the following statements is TRUE if the order is executed? The order:<\/p>","o":[{"l":"A","h":"will always be filled at a higher price than 537p"},{"l":"B","h":"will always be filled at the price of 537p"},{"l":"C","h":"will always be filled at a lower price than 537p"},{"l":"D","h":"can be filled at 537p or at a higher or lower price"}],"a":"D","e":"<p><strong>Answer: D<\/strong><\/p><p>Syllabus reference: <strong>3.3.3<\/strong> (élément 3, sous-élément 3.3, learning objective 3.3.3)<\/p>"},{"s":4,"n":34,"id":"Syllabus 4.1.1","q":"<p>A future price is trading below the spot price. What is this known as?<\/p>","o":[{"l":"A","h":"Contango"},{"l":"B","h":"Biased market"},{"l":"C","h":"Short market"},{"l":"D","h":"Backwardation"}],"a":"D","e":"<p><strong>Answer: D<\/strong><\/p><p>Syllabus reference: <strong>4.1.1<\/strong> (élément 4, sous-élément 4.1, learning objective 4.1.1)<\/p>"},{"s":4,"n":35,"id":"Syllabus 4.2.5","q":"<p>XYZ bank holds the following options:<\/p><p>Short 2 calls, Delta 0.5<br>Long 1 put, Delta 0.3<br>Long 5 calls, Delta 0.2<\/p><p>What is the bank's net adjusted position?<\/p>","o":[{"l":"A","h":"-0.3"},{"l":"B","h":"+0.3"},{"l":"C","h":"-0.7"},{"l":"D","h":"+0.7"}],"a":"A","e":"<p><strong>Answer: A<\/strong><\/p><p>Syllabus reference: <strong>4.2.5<\/strong> (élément 4, sous-élément 4.2, learning objective 4.2.5)<\/p>"},{"s":4,"n":36,"id":"Syllabus 4.1.2","q":"<p>When calculating the cost of carry for a deliverable commodity's future, which of the following will be included?<\/p>","o":[{"l":"A","h":"Storage costs"},{"l":"B","h":"Floor broker's commission"},{"l":"C","h":"Market transaction costs"},{"l":"D","h":"Initial margin requirement"}],"a":"A","e":"<p><strong>Answer: A<\/strong><\/p><p>Syllabus reference: <strong>4.1.2<\/strong> (élément 4, sous-élément 4.1, learning objective 4.1.2)<\/p>"},{"s":4,"n":37,"id":"Syllabus 4.1.5","q":"<p>Which of the following is the BEST definition of arbitrage in the context of futures and options?<\/p>","o":[{"l":"A","h":"Simultaneous sale and purchase of futures or options and related cash instruments to profit from the anticipated correction of price anomalies"},{"l":"B","h":"The process by which cash and future prices converge to one price as delivery approaches"},{"l":"C","h":"The purchase or sale of future or option contracts as a temporary substitute for a transaction to be made at a later date"},{"l":"D","h":"Buying and selling of a future or option contract"}],"a":"A","e":"<p><strong>Answer: A<\/strong><\/p><p>Syllabus reference: <strong>4.1.5<\/strong> (élément 4, sous-élément 4.1, learning objective 4.1.5)<\/p>"},{"s":4,"n":38,"id":"Syllabus 4.2.6","q":"<p>Which of the following positions requires both an initial margin and a variation margin?<\/p>","o":[{"l":"A","h":"Long positions on bond options"},{"l":"B","h":"Short positions on bond options"},{"l":"C","h":"Long positions on equity index options"},{"l":"D","h":"Short positions on equity index options"}],"a":"B","e":"<p><strong>Answer: B<\/strong><\/p><p>Syllabus reference: <strong>4.2.6<\/strong> (élément 4, sous-élément 4.2, learning objective 4.2.6)<\/p>"},{"s":5,"n":39,"id":"Syllabus 5.1.6","q":"<p>Where an investor swaps a floating rate note for a fixed interest investment, this is normally described as:<\/p>","o":[{"l":"A","h":"a constant maturity swap"},{"l":"B","h":"an asset swap"},{"l":"C","h":"an accreting swap"},{"l":"D","h":"a forward start swap"}],"a":"B","e":"<p><strong>Answer: B<\/strong><\/p><p>Syllabus reference: <strong>5.1.6<\/strong> (élément 5, sous-élément 5.1, learning objective 5.1.6)<\/p>"},{"s":5,"n":40,"id":"Syllabus 5.3.1","q":"<p>XYZ Bank has requested a higher level of collateral to protect its position. This is similar to:<\/p>","o":[{"l":"A","h":"exercising an option"},{"l":"B","h":"registering a further interest"},{"l":"C","h":"applying an adjustment"},{"l":"D","h":"making a margin call"}],"a":"D","e":"<p><strong>Answer: D<\/strong><\/p><p>Syllabus reference: <strong>5.3.1<\/strong> (élément 5, sous-élément 5.3, learning objective 5.3.1)<\/p>"},{"s":5,"n":41,"id":"Syllabus 5.8.2","q":"<p>In relation to call options, if the current market price of the underlying asset increases, this will normally result in:<\/p>","o":[{"l":"A","h":"an increase in the premium"},{"l":"B","h":"a decrease in the premium"},{"l":"C","h":"an increase in the strike price"},{"l":"D","h":"a decrease in the strike price"}],"a":"A","e":"<p><strong>Answer: A<\/strong><\/p><p>Syllabus reference: <strong>5.8.2<\/strong> (élément 5, sous-élément 5.8, learning objective 5.8.2)<\/p>"},{"s":5,"n":42,"id":"Syllabus 5.7.1","q":"<p>Which of the following BEST describes the unique feature of a convertible bond? It can be:<\/p>","o":[{"l":"A","h":"redeemed early by either party"},{"l":"B","h":"converted into cash"},{"l":"C","h":"converted to equity in the issuing company"},{"l":"D","h":"converted into another grade of debt"}],"a":"C","e":"<p><strong>Answer: C<\/strong><\/p><p>Syllabus reference: <strong>5.7.1<\/strong> (élément 5, sous-élément 5.7, learning objective 5.7.1)<\/p>"},{"s":5,"n":43,"id":"Syllabus 5.8.3","q":"<p>What is normally the LATEST premium settlement date for OTC options?<\/p>","o":[{"l":"A","h":"T + 2"},{"l":"B","h":"T + 3"},{"l":"C","h":"T + 4"},{"l":"D","h":"T + 5"}],"a":"A","e":"<p><strong>Answer: A<\/strong><\/p><p>Syllabus reference: <strong>5.8.3<\/strong> (élément 5, sous-élément 5.8, learning objective 5.8.3)<\/p>"},{"s":5,"n":44,"id":"Syllabus 5.1.2","q":"<p>The date on which a vanilla interest rate swap stops accruing interest for final settlement is referred to as the:<\/p>","o":[{"l":"A","h":"settlement date"},{"l":"B","h":"termination date"},{"l":"C","h":"value date"},{"l":"D","h":"fixing date"}],"a":"B","e":"<p><strong>Answer: B<\/strong><\/p><p>Syllabus reference: <strong>5.1.2<\/strong> (élément 5, sous-élément 5.1, learning objective 5.1.2)<\/p>"},{"s":5,"n":45,"id":"Syllabus 5.2.1","q":"<p>What type of netting, if any, is covered by a typical master agreement?<\/p>","o":[{"l":"A","h":"Master agreements do not allow any type of netting"},{"l":"B","h":"Payment netting only"},{"l":"C","h":"Close-out netting only"},{"l":"D","h":"Both payment and close-out netting"}],"a":"D","e":"<p><strong>Answer: D<\/strong><\/p><p>Syllabus reference: <strong>5.2.1<\/strong> (élément 5, sous-élément 5.2, learning objective 5.2.1)<\/p>"},{"s":5,"n":46,"id":"Syllabus 5.8.1","q":"<p>Which of the following regarding the valuation (for exercise purposes) of European Options is TRUE? It is:<\/p>","o":[{"l":"A","h":"valued at a series of dates, any of which may become the exercise date"},{"l":"B","h":"valued at the Expiration Date as an average of the values throughout the exercise period"},{"l":"C","h":"valued and exercisable on any day up to the expiration date"},{"l":"D","h":"valued and exercised only on the expiration date"}],"a":"D","e":"<p><strong>Answer: D<\/strong><\/p><p>Syllabus reference: <strong>5.8.1<\/strong> (élément 5, sous-élément 5.8, learning objective 5.8.1)<\/p>"},{"s":5,"n":47,"id":"Syllabus 5.1.10","q":"<p>A key difference between flex options and standard exchange traded options is that a flex option:<\/p>","o":[{"l":"A","h":"has limited expiration dates"},{"l":"B","h":"requires physical delivery"},{"l":"C","h":"is available only on commodities"},{"l":"D","h":"has customised strike prices"}],"a":"D","e":"<p><strong>Answer: D<\/strong><\/p><p>Syllabus reference: <strong>5.1.10<\/strong> (élément 5, sous-élément 5.1, learning objective 5.1.10)<\/p>"},{"s":5,"n":48,"id":"Syllabus 5.1.8","q":"<p>An investor owns a bond with a rating of BBB. Why would he purchase a credit derivative? To:<\/p>","o":[{"l":"A","h":"protect himself should the bond be downgraded"},{"l":"B","h":"turn the bond into an AAA issue"},{"l":"C","h":"increase his exposure to the company through gearing"},{"l":"D","h":"have the right to sell the bond at a set price by a set date"}],"a":"A","e":"<p><strong>Answer: A<\/strong><\/p><p>Syllabus reference: <strong>5.1.8<\/strong> (élément 5, sous-élément 5.1, learning objective 5.1.8)<\/p>"},{"s":5,"n":49,"id":"Syllabus 5.5.2","q":"<p>The price of which of the following instruments will be MOST closely correlated to asset swap prices?<\/p>","o":[{"l":"A","h":"Credit Default Swap (CDS)"},{"l":"B","h":"Credit Linked Note (CLN)"},{"l":"C","h":"Collateralised Debt Obligation"},{"l":"D","h":"Synthetic Collateralised Debt Obligation"}],"a":"A","e":"<p><strong>Answer: A<\/strong><\/p><p>Syllabus reference: <strong>5.5.2<\/strong> (élément 5, sous-élément 5.5, learning objective 5.5.2)<\/p>"},{"s":6,"n":50,"id":"Syllabus 6.1.5","q":"<p>What sort of firm may a non-clearing member use to clear its trades via a Clearing House?<\/p>","o":[{"l":"A","h":"Only a general clearing member"},{"l":"B","h":"Only an individual clearing member"},{"l":"C","h":"Any clearing member but not a non-clearing member"},{"l":"D","h":"Any clearing member or a non-clearing member with sufficient capital"}],"a":"A","e":"<p><strong>Answer: A<\/strong><\/p><p>Syllabus reference: <strong>6.1.5<\/strong> (élément 6, sous-élément 6.1, learning objective 6.1.5)<\/p>"},{"s":6,"n":51,"id":"Syllabus 6.1.6","q":"<p>Which of the following statements is usually TRUE about prime brokerage services.<\/p><p>The prime broker:<\/p>","o":[{"l":"A","h":"provides the hedge fund with guaranteed starting capital through its capital introduction services"},{"l":"B","h":"provides risk analysis technology through its risk management advisory services"},{"l":"C","h":"raises the listed capital of the hedge fund by providing stock lending services to meet the regulatory capital requirements"},{"l":"D","h":"makes the regulatory requirements more understandable through its clearing services"}],"a":"B","e":"<p><strong>Answer: B<\/strong><\/p><p>Syllabus reference: <strong>6.1.6<\/strong> (élément 6, sous-élément 6.1, learning objective 6.1.6)<\/p>"},{"s":6,"n":52,"id":"Syllabus 6.2.2","q":"<p>What key event normally occurs during the first 90 seconds of the 'settlement range' in connection with futures contracts?<\/p>","o":[{"l":"A","h":"The spread levels are monitored"},{"l":"B","h":"The weighted average prices are determined"},{"l":"C","h":"The trading is temporarily suspended"},{"l":"D","h":"The prices are artificially lowered"}],"a":"A","e":"<p><strong>Answer: A<\/strong><\/p><p>Syllabus reference: <strong>6.2.2<\/strong> (élément 6, sous-élément 6.2, learning objective 6.2.2)<\/p>"},{"s":6,"n":53,"id":"Syllabus 6.2.3","q":"<p>What effect does spot month margining have?<\/p>","o":[{"l":"A","h":"Initiates a maintenance margin call"},{"l":"B","h":"Initiates an additional intra-day margin call"},{"l":"C","h":"Increases the initial margin"},{"l":"D","h":"Increases the variation margin"}],"a":"C","e":"<p><strong>Answer: C<\/strong><\/p><p>Syllabus reference: <strong>6.2.3<\/strong> (élément 6, sous-élément 6.2, learning objective 6.2.3)<\/p>"},{"s":6,"n":54,"id":"Syllabus 6.2.4","q":"<p>The market suddenly becomes highly volatile. Which of the following may the clearing house call in order to reduce the increased risk exposure?<\/p>","o":[{"l":"A","h":"Intra-day margin"},{"l":"B","h":"Spot month margin"},{"l":"C","h":"Initial margin"},{"l":"D","h":"Variation margin"}],"a":"A","e":"<p><strong>Answer: A<\/strong><\/p><p>Syllabus reference: <strong>6.2.4<\/strong> (élément 6, sous-élément 6.2, learning objective 6.2.4)<\/p>"},{"s":6,"n":55,"id":"Syllabus 6.4.1","q":"<p>The primary purpose of 'position limits' is to:<\/p>","o":[{"l":"A","h":"minimise the extent of counterparty risk"},{"l":"B","h":"prevent traders from manipulating the market"},{"l":"C","h":"stabilise sudden and extreme movements in price"},{"l":"D","h":"ensure that sufficient variation margins are collected"}],"a":"B","e":"<p><strong>Answer: B<\/strong><\/p><p>Syllabus reference: <strong>6.4.1<\/strong> (élément 6, sous-élément 6.4, learning objective 6.4.1)<\/p>"},{"s":6,"n":56,"id":"Syllabus 6.1.4","q":"<p>In the event of a default by a member, which of the following would be first utilised by the clearing house against the outstanding liabilities?<\/p>","o":[{"l":"A","h":"Insurance policy"},{"l":"B","h":"Default fund"},{"l":"C","h":"Default member's margin"},{"l":"D","h":"Default member's contributions to default fund"}],"a":"C","e":"<p><strong>Answer: C<\/strong><\/p><p>Syllabus reference: <strong>6.1.4<\/strong> (élément 6, sous-élément 6.1, learning objective 6.1.4)<\/p>"},{"s":6,"n":57,"id":"Syllabus 6.1.1","q":"<p>Novation removes which of the following?<\/p>","o":[{"l":"A","h":"Liquidity risk"},{"l":"B","h":"Counterparty risk"},{"l":"C","h":"Market risk"},{"l":"D","h":"Trading risk"}],"a":"B","e":"<p><strong>Answer: B<\/strong><\/p><p>Syllabus reference: <strong>6.1.1<\/strong> (élément 6, sous-élément 6.1, learning objective 6.1.1)<\/p>"},{"s":7,"n":58,"id":"Syllabus 7.1.1","q":"<p>The Exchange Delivery Settlement Price is often set on the delivery date via an auction process. Why is this?<\/p>","o":[{"l":"A","h":"In order to reduce the possibility of price manipulation"},{"l":"B","h":"As a way of taking adjustments such as accrued interest and storage into account"},{"l":"C","h":"In order to obtain the highest settlement prices"},{"l":"D","h":"As a way of taking earlier losses and profits into account"}],"a":"A","e":"<p><strong>Answer: A<\/strong><\/p><p>Syllabus reference: <strong>7.1.1<\/strong> (élément 7, sous-élément 7.1, learning objective 7.1.1)<\/p>"},{"s":7,"n":59,"id":"Syllabus 7.2.2","q":"<p>At expiry, which of the following groups of options might be exercised automatically?<\/p>","o":[{"l":"A","h":"All in-the-money options"},{"l":"B","h":"All at-the-money and in-the-money options"},{"l":"C","h":"All European options"},{"l":"D","h":"All open options"}],"a":"A","e":"<p><strong>Answer: A<\/strong><\/p><p>Syllabus reference: <strong>7.2.2<\/strong> (élément 7, sous-élément 7.2, learning objective 7.2.2)<\/p>"},{"s":7,"n":60,"id":"Syllabus 7.1.1","q":"<p>What is the final opportunity that holders of long UK government bond future positions have to close their positions and therefore avoid ultimate delivery?<\/p>","o":[{"l":"A","h":"Last notice day"},{"l":"B","h":"The day prior to assignment day"},{"l":"C","h":"Last trading day"},{"l":"D","h":"3 business days prior to the start of the delivery month"}],"a":"C","e":"<p><strong>Answer: C<\/strong><\/p><p>Syllabus reference: <strong>7.1.1<\/strong> (élément 7, sous-élément 7.1, learning objective 7.1.1)<\/p>"},{"s":7,"n":61,"id":"Syllabus 7.2.1","q":"<p>A firm received an assignment notice regarding an option from a clearing house.<\/p><p>The company should now be aware that:<\/p>","o":[{"l":"A","h":"they will receive the profits from the transaction within the standard settlement period"},{"l":"B","h":"they have to deliver the underlying assets or settle the transaction in cash"},{"l":"C","h":"their counterparty is insolvent and the clearing house appointed a liquidator"},{"l":"D","h":"they have to pay a fine for causing delays in the clearing process"}],"a":"B","e":"<p><strong>Answer: B<\/strong><\/p><p>Syllabus reference: <strong>7.2.1<\/strong> (élément 7, sous-élément 7.2, learning objective 7.2.1)<\/p>"},{"s":7,"n":62,"id":"Syllabus 7.1.2","q":"<p>What is the price determined by the exchange for the closing out of the futures position and the calculation of the final value for the cash or physical settlement?<\/p>","o":[{"l":"A","h":"Exchange Delivery Settlement Price (EDSP)"},{"l":"B","h":"Exchange of Futures for Physical Price (EFPP)"},{"l":"C","h":"Exchange Traded Price (ETP)"},{"l":"D","h":"Exchange Traded Derivative (ETD)"}],"a":"A","e":"<p><strong>Answer: A<\/strong><\/p><p>Syllabus reference: <strong>7.1.2<\/strong> (élément 7, sous-élément 7.1, learning objective 7.1.2)<\/p>"},{"s":7,"n":63,"id":"Syllabus 7.1.4","q":"<p>In the delivery of an LME copper future contract what is the warrant?<\/p>","o":[{"l":"A","h":"An invoice to the buyer, giving the exact amount that must be paid"},{"l":"B","h":"A document that gives the holder the right to take possession of the copper"},{"l":"C","h":"A document that gives the delivery details to the seller"},{"l":"D","h":"A receipt that allows the seller to receive the payment via the Protected Payments System"}],"a":"B","e":"<p><strong>Answer: B<\/strong><\/p><p>Syllabus reference: <strong>7.1.4<\/strong> (élément 7, sous-élément 7.1, learning objective 7.1.4)<\/p>"},{"s":8,"n":64,"id":"Syllabus 8.1.1","q":"<p>Which of the following would BEST be described as speculating?<\/p>","o":[{"l":"A","h":"An investor anticipates that the price of aluminium will fall and therefore sells several LME aluminium futures"},{"l":"B","h":"An investor goes long of a June 1500 lead call at a premium of 120 and, at the same time goes short the same number of June 1400 lead puts at a premium of 90"},{"l":"C","h":"A manufacturer anticipates a rise in the price of copper and buys copper futures to meet its production quota"},{"l":"D","h":"An investor who is long of tin puts anticipates a rise in the market and therefore liquidates his position"}],"a":"A","e":"<p><strong>Answer: A<\/strong><\/p><p>Syllabus reference: <strong>8.1.1<\/strong> (élément 8, sous-élément 8.1, learning objective 8.1.1)<\/p>"},{"s":8,"n":65,"id":"Syllabus 8.2.1","q":"<p>A purchase of a September long UK government bond future and a sale of a December long UK government bond future is an example of which type of spread transaction?<\/p>","o":[{"l":"A","h":"Intra market spread"},{"l":"B","h":"Inter market spread"},{"l":"C","h":"Ratio spread"},{"l":"D","h":"Bear spread"}],"a":"A","e":"<p><strong>Answer: A<\/strong><\/p><p>Syllabus reference: <strong>8.2.1<\/strong> (élément 8, sous-élément 8.2, learning objective 8.2.1)<\/p>"},{"s":8,"n":66,"id":"Syllabus 8.3.3","q":"<p>If an investor buys a put on a company's shares and simultaneously sells a put with a higher strike price on the same shares with the same expiration date, the trade the investor has entered into is called a:<\/p>","o":[{"l":"A","h":"horizontal spread"},{"l":"B","h":"bull put spread"},{"l":"C","h":"diagonal spread"},{"l":"D",
