en markets through quoted prices and trading as principal with other market participants.<\/p>"},{"s":4,"n":27,"id":"1014254","q":"<p>Where a client gets a brokerage to manage their derivative positions specifically to their needs, but retains liability for all losses, this would be called:<\/p>","o":[{"l":"A","h":"A retail scheme"},{"l":"B","h":"A pooled fund"},{"l":"C","h":"An investment"},{"l":"D","h":"An account"}],"a":"D","e":"<p>An account is where, usually, a wealthy investor holds a private account with a brokerage.<\/p>"},{"s":4,"n":28,"id":"1055516","q":"<p>Which of the below defines the purpose of swapclear?<\/p>","o":[{"l":"A","h":"Sending secure messages and confirmation"},{"l":"B","h":"Helps clients reduce capital, credit and operational costs"},{"l":"C","h":"Produce electronic confirmation which are ISDA compliant"},{"l":"D","h":"Provides clearing function"}],"a":"D","e":"<p>Swapclear is owned by LCH.Clearnet and provided clearing for the OTC market. The answers define the role of Markitwire, NEX Trioptima and Swiftnet FPML.<\/p>"},{"s":4,"n":29,"id":"1037005","q":"<p>An investor sells one JAN 100 call for a premium of 5p and one JAN 100 put for a premium of 7p. The price of the underlying asset is £1.02 and yesterday's closing price was 99p. The investor will start to make a loss on the strategy if the asset price moves beyond which prices?<\/p>","o":[{"l":"A","h":"88p and 112p"},{"l":"B","h":"90p and 114p"},{"l":"C","h":"93p and 105p"},{"l":"D","h":"95p and 107p"}],"a":"A","e":"<p>The strategy described above is a short straddle (sell a call and a put, same strike and same month). This strategy will lose money if the asset price falls below strike minus the combined premium or increases above the strike plus the combined premium i.e. when it moves beyond the breakeven points. The breakeven points are: 100 - 12p = 88p and 100 + 12p = 112p.<\/p>"},{"s":4,"n":30,"id":"1052136","q":"<p>An increase in basis would indicate:<\/p>","o":[{"l":"A","h":"The cash price is falling relative to the future's price"},{"l":"B","h":"The cash price is rising relative to the future's price"},{"l":"C","h":"In a contango market, it is widening and strengthening"},{"l":"D","h":"In a backwardation market, it is narrowing and weakening"}],"a":"B","e":"<p>When basis moves in a positive direction it is said to be 'strengthening'. In both contango and backwardation, the cash price is rising relative to the future's price<\/p>"},{"s":4,"n":31,"id":"1037004","q":"<p>In a back market, if a trader expects the spread to widen he should:<\/p>","o":[{"l":"A","h":"Buy the nearby contract and sell the deferred contract"},{"l":"B","h":"Sell the nearby contract and buy the deferred contract"},{"l":"C","h":"Buy the nearby dated contract and buy the deferred contract"},{"l":"D","h":"Sell the nearby contract and sell the deferred contract"}],"a":"A","e":"<p>In a back market, with widening spreads, the investor should buy the spread, i.e. buy the near dated contract and sell the far dated contract.<\/p>"},{"s":4,"n":32,"id":"1065105","q":"<p>Which of the following is the best description of EU MiFID in relation to derivative markets?<\/p>","o":[{"l":"A","h":"It ensures that all markets function properly and that all trades are published in a timely manner"},{"l":"B","h":"It ensures profitable trading within the EEA and that all authorised firms fall under the jurisdiction of the European Securities and Markets Authority"},{"l":"C","h":"It is the European regulation on increased transparency within OTC markets"},{"l":"D","h":"It extends the scope of the passport to include a wider range of services and outlines when home or host state rules apply"}],"a":"D","e":"<p>MiFID has been designed to support two key policy goals of the EU. These are:<br/> ...extending the scope of the passport to include a wider range of services; and<br/> ...removing a major hurdle to cross-border business, by way of the application of host state rules to incoming passported firms.<\/p>"},{"s":4,"n":33,"id":"1017034","q":"<p>A fund manager believes the FTSE 100 will increase in value and enters into a receiver total return swap, where equity returns are swapped for a floating rate. During this period of time the index falls in value.<br/> Which of the following will the fund manager have to do?<\/p>","o":[{"l":"A","h":"Make floating rate interest payments to the swap dealer and receive payments in compensation for the decrease in the index"},{"l":"B","h":"Make floating rate interest payments and payments to the swap dealer for the decrease in the value of the index"},{"l":"C","h":"Make increased interest payments to the swap dealer until the index increases in value beyond the net value point"},{"l":"D","h":"Make payments to the swap dealer based on the value of the index in return for the floating rate of interest"}],"a":"B","e":"<p>Normally the fund manager would pay a floating rate of interest to a swap dealer and in return receive the return on the index. As the index has fallen he will have to make his interest payments plus pay an amount to the swap dealer.<\/p>"},{"s":4,"n":34,"id":"1036986","q":"<p>Which of the following is true in relation to client margin requirements?<\/p>","o":[{"l":"A","h":"A firm may net client and firm margin requirements at all times"},{"l":"B","h":"A firm may never net client and firm margin requirements"},{"l":"C","h":"Margin requirements from clients may sometimes be netted-off against offsetting positions with the firm's own margin requirements"},{"l":"D","h":"Margin requirements from clients are always netted-off against offsetting positions with the firm's own margin requirements"}],"a":"C","e":"<p>If client accounts are held within a NON-SEGREGATED account, then netting off is permitted. Netting-off is not permitted is the firm operates a segregated account for the client.<\/p>"},{"s":4,"n":35,"id":"1037036","q":"<p>A and B agree the terms of a trade over the counter and then ask the central counterparty to novate the contract. What is the position if A subsequently wants to close the position before delivery?<\/p>","o":[{"l":"A","h":"A must negotiate terms with B and will suffer if B defaults"},{"l":"B","h":"A can close against any counterparty via the central counterparty with no default risk"},{"l":"C","h":"A can close the position against any counterparty but still faces default risk"},{"l":"D","h":"A can usually offset the position through the central counterparty"}],"a":"D","e":"<p>After novation, A and B no longer face each other directly. Each faces the CCP instead. If A wants to close the position, A can usually enter an opposite cleared trade through the CCP. This offsets the original position and removes A’s net exposure without relying on B’s agreement.<\/p>"},{"s":4,"n":36,"id":"1037018","q":"<p>If an investor is long 80 lead contracts and the contract price moves by 35 ticks what is the profit or loss? The tick value on the contract is $12.50.<\/p>","o":[{"l":"A","h":"£35,000"},{"l":"B","h":"$35,000"},{"l":"C","h":"£70,000"},{"l":"D","h":"$70,000"}],"a":"B","e":"<p>Profit / loss = Ticks moved x Tick value x No. of contracts<br/> = 35 x $12.50 x 80<br/> = $35,000<\/p>"},{"s":4,"n":37,"id":"1037589","q":"<p>Which of the following reasons BEST explains why a management company would monitor the delta of its portfolio?<\/p>","o":[{"l":"A","h":"To assess interest rate changes"},{"l":"B","h":"To track the price change in the underlying asset"},{"l":"C","h":"To predict the changes in implied volatility"},{"l":"D","h":"To maintain a delta neutral position"}],"a":"D","e":"<p>The best answer here is to maintain a delta neutral position.<\/p>"},{"s":4,"n":38,"id":"1016993","q":"<p>A writer of a put option is at risk of incurring a loss if which of the following occurs?<\/p>","o":[{"l":"A","h":"An increase in the price of the underlying asset"},{"l":"B","h":"A decrease in the price of the asset"},{"l":"C","h":"They will not be affected by either an increase or decrease"},{"l":"D","h":"If the price of the asset stays the same"}],"a":"B","e":"<p>The holder of a put contract will exercise the option if the price of the underlying falls.<\/p>"},{"s":4,"n":39,"id":"1055087","q":"<p>A broker principal trade is:-<\/p>","o":[{"l":"A","h":"When a broker trades for their own personal account."},{"l":"B","h":"When a broker trades for a client on an exchange."},{"l":"C","h":"When a brokerage trades on their own account."},{"l":"D","h":"When a brokerage is a member firm and is able to directly enter into an arrangement with a clearing house."}],"a":"C","e":"<p>A broker principal trade is when a brokerage trades on their own account.<\/p>"},{"s":4,"n":40,"id":"1036987","q":"<p>Which of the following best describes the purpose of the Transparency Directive?<\/p>","o":[{"l":"A","h":"It takes away the power of creating and enforcing disclosure rules from the local regulator"},{"l":"B","h":"The main focus of the directive is the obligation on exchanges to publish all trades that occur"},{"l":"C","h":"It imposes minimum disclosure requirements on companies and their shareholders"},{"l":"D","h":"It dictates the threshold through which a firm must pass in order to deal on an exchange"}],"a":"C","e":"<p>The directive imposes minimum disclosure requirements on companies and their shareholders. Although it wants to harmonise the rules throughout the EEA, if a local regulator has stricter rules, they are free to impose those.<\/p>"},{"s":4,"n":41,"id":"1065111","q":"<p>Which of the following statements is the best description of the EU Transparency Directive?<\/p>","o":[{"l":"A","h":"It stipulates that all exchanges must remain transparent and publish trade reports"},{"l":"B","h":"It establishes minimum requirements on the disclosure of major shareholdings for issuers whose securities are admitted to trading on a regulated market"},{"l":"C","h":"It stipulates that all derivative and embedded derivative share positions are disclosed to issuers in a timely manner"},{"l":"D","h":"It establishes the differences between the concepts of home and host member state regulation and cross border marketing rules"}],"a":"B","e":"<p>The Transparency Directive is designed to enhance transparency on EU capital markets by establishing minimum requirements on periodic financial reporting and on the disclosure of major shareholdings for issuers whose securities are admitted to trading on a regulated market in the EU. The directive also deals with the mechanisms through which this information is to be stored and disseminated.<\/p>"},{"s":4,"n":42,"id":"1037011","q":"<p>Which of the following statements regarding basis and basis risk is false?<\/p>","o":[{"l":"A","h":"Basis risk is the uncertainty of basis values affecting the user of the future"},{"l":"B","h":"Basis is said to weaken when it becomes more positive or less negative"},{"l":"C","h":"Basis is calculated by deducting the futures price from the cash price"},{"l":"D","h":"If a future is trading at its fair value basis equals the cost of carry"}],"a":"B","e":"<p>Basis weakens when the cash prices weaken relative to futures. Because basis is calculated at Cash - Futures, the lower relative cash price results in basis becoming either less positive or more negative.<\/p>"},{"s":4,"n":43,"id":"1036960","q":"<p>The US yield curve is currently inverted. An investor anticipates the yield curve rotating anti-clockwise and flattening. Which of the following strategies is most appropriate?<\/p>","o":[{"l":"A","h":"Go long US T-bond futures"},{"l":"B","h":"Go short US T-bond futures"},{"l":"C","h":"Sell the three month eurodollar future and buy US T-bond futures"},{"l":"D","h":"Buy the three month eurodollar future and sell US T-bond futures"}],"a":"D","e":"<p>An anti-clockwise rotation from inverted to flat would result in short term interest rates falling and long dated yields rising. Eurodollar futures (priced as 100 - implied rate) would rise as a result. US T-bond yields would rise bringing down US T-bond future prices.<\/p>"},{"s":4,"n":44,"id":"1065134","q":"<p>Which of the following would not be considered in working out an order's priority on the order book?<\/p>","o":[{"l":"A","h":"Time"},{"l":"B","h":"Date"},{"l":"C","h":"Security"},{"l":"D","h":"Price"}],"a":"C","e":"<p>Once the order has been received, the system stores the order on the central order book. Orders are matched on the basis of price and then time priority.<\/p>"},{"s":4,"n":45,"id":"1037042","q":"<p>What would ICE Clear Europe do if the short term volatility were to increase on an underlying asset of a future held by a member?<\/p>","o":[{"l":"A","h":"Allow the volatility to pass with no action taken"},{"l":"B","h":"Insist the open positions are closed out"},{"l":"C","h":"Implement inter-commodity credit"},{"l":"D","h":"Call intra day margin"}],"a":"D","e":"<p>The clearing house would call for additional intra day margin if this were to occur. This is payable immediately through the protected payments system.<\/p>"},{"s":4,"n":46,"id":"1036978","q":"<p>Which of the following is not likely to increase the price transparency of derivative contracts in an electronic screen trading facility?<\/p>","o":[{"l":"A","h":"Display of best bid and offer"},{"l":"B","h":"Updates of last traded price"},{"l":"C","h":"Details of the depth of price and volume"},{"l":"D","h":"Details of open interest"}],"a":"D","e":"<p>Open interest is an indicator of the likely liquidity of the contract rather than an indicator of price.<\/p>"},{"s":4,"n":47,"id":"1055073","q":"<p>Which of these would finalise the trade, usually for a commission?<\/p>","o":[{"l":"A","h":"Introducing Broker"},{"l":"B","h":"IDB"},{"l":"C","h":"Clearing Broker"},{"l":"D","h":"Executing Broker"}],"a":"D","e":"<p>An introducing broker effects transactions with its customers through a clearing broker and does not hold customer funds or securities. Inter-dealer brokers (IDB) acts as an intermediary between other market participants, such as brokers and/or market-makers. A clearing broker acts as clearing agent in connection with a transaction. An executing broker finalises or executes an order on behalf of a client.<\/p>"},{"s":4,"n":48,"id":"1036953","q":"<p>Which of the following prices would be an unacceptable fill for a client's buy stop limit order at 40.00?<\/p>","o":[{"l":"A","h":"39.98"},{"l":"B","h":"40.00"},{"l":"C","h":"40.02"},{"l":"D","h":"39.00"}],"a":"C","e":"<p>Limit order must be filled at their limit price or better. This order is therefore to buy at 40.00 or lower.<\/p>"},{"s":4,"n":49,"id":"1037032","q":"<p>The maximum risk from a short futures position is:<\/p>","o":[{"l":"A","h":"Unlimited"},{"l":"B","h":"Limited to the initial margin"},{"l":"C","h":"Limited to the value of the future"},{"l":"D","h":"Limited as the market will not fall below zero"}],"a":"A","e":"<p>If a future is sold at $50.00, the seller is obliged to make delivery of the underlying at $50.00. If at delivery the price of the underlying was zero, the PROFIT would be the future's price, i.e. $50.00. However, because there is no limit to how high the underlying's price can rise, the maximum loss on a short futures position is unlimited.<\/p>"},{"s":4,"n":50,"id":"1055514","q":"<p>A trader has a view in the market that the basis will be strengthening in a contango market. Which of the below best describes the basis movement and the action the trader should perform?<\/p>","o":[{"l":"A","h":"Basis will narrow, sell the basis"},{"l":"B","h":"Basis will narrow, buy the basis"},{"l":"C","h":"Basis will widen, sell the basis"},{"l":"D","h":"Basis will widen, buy the basis"}],"a":"B","e":"<p>In a contango market, if the basis is strengthening then it will narrow as the price in the cash market will be getting stronger relative to the futures market. If the basis strengthens, the trader should buy the basis which means buy the cash asset and sell the future.<\/p>"},{"s":4,"n":51,"id":"1037041","q":"<p>An investor will receive a semi-annual interest payment of how much in the following situation?<br/> The investor purchases five 6% $1,000 par value bonds. They are selling at a discount and have a yield to maturity of 8%.<\/p>","o":[{"l":"A","h":"$150"},{"l":"B","h":"$225"},{"l":"C","h":"$300"},{"l":"D","h":"$60"}],"a":"A","e":"<p>The investor will receive semi-annual payments of $150. The bond pays 6% interest based on $1,000 par value. There are 5 bonds= $5,000 par value. 6% of $5,000=$300/year in interest. Since the interest is paid semi-annually, the payment would = $150.<\/p>"},{"s":4,"n":52,"id":"1036989","q":"<p>What is the impact of an increase in interest rates on call option premiums?<\/p>","o":[{"l":"A","h":"Increase"},{"l":"B","h":"Decrease"},{"l":"C","h":"No change"},{"l":"D","h":"Not possible to say"}],"a":"A","e":"<p>The call premium will increase because the cash benefit of holding a right to shares rather than having cash tied up in the shares themselves increases.<\/p>"},{"s":4,"n":53,"id":"1036996","q":"<p>An investor sells an option on ICE Futures and clears through ICE Clear Europe. What margin would be called on the investor by the clearing house?<\/p>","o":[{"l":"A","h":"Pay the premium and initial margin by the end of the day"},{"l":"B","h":"Pay the net of the premium and initial margin by the end of the day"},{"l":"C","h":"Pay the premium and the initial margin by the next business day"},{"l":"D","h":"Pay the net of the premium and the margin by the next business day"}],"a":"D","e":"<p>Short option positions do not pay a premium, they receive one. Therefore they will pay the net of the premium they should receive and the margin they need to pay. They pay this by 9am the following business day via a protected payment system.<\/p>"},{"s":4,"n":54,"id":"1053743","q":"<p>If a client defaults on a clearing broker before a trade has been novated, what is the risk to the broker?<\/p>","o":[{"l":"A","h":"As a clearing broker the clearing house will take-on the risk"},{"l":"B","h":"The risk is transferred to the party the broker traded with"},{"l":"C","h":"The clearing broker assumes the risk less any client margin held"},{"l":"D","h":"As the default is pre-novated, there is no risk and the trade is declared null and void"}],"a":"C","e":"<p>The risk is with the broker, the fact that the trade hasn't novated doesn't have an impact.<br/> A clearing house sees' only its members and not its members' clients.<br/> The clearing broker would be holding margin/collateral which it could use to off-set the risks caused by the default.<\/p>"},{"s":4,"n":55,"id":"1036967","q":"<p>Under the Commodities Futures Modernisation Act 2000, who has the responsibility to regulate single stock futures?<\/p>","o":[{"l":"A","h":"SEC"},{"l":"B","h":"CFTC"},{"l":"C","h":"SEC and CFTC"},{"l":"D","h":"NASD"}],"a":"C","e":"<p>Under CFMA 2000 there is joint regulation of single stock futures between the Securities and Exchange Commission and the Commodity Futures Trading Commission.<\/p>"},{"s":4,"n":56,"id":"1036995","q":"<p>Which is the best definition of wide basis?<\/p>","o":[{"l":"A","h":"A market in contango"},{"l":"B","h":"Unusually high demand on the cash/underlying asset"},{"l":"C","h":"When cost of carry is negative"},{"l":"D","h":"When there is poor liquidity in the futures contract"}],"a":"B","e":"<p>If there is an unusually high demand on the cash asset then the price will rise. If the price of the underlying rises the spread will widen and therefore give a wider basis assuming a constant cost of carry as a percentage.<\/p>"},{"s":4,"n":57,"id":"1037006","q":"<p>The best description of gearing in the context of derivatives is:<\/p>","o":[{"l":"A","h":"The range of values a derivative can trade away from its fair value where arbitrage is not profitable"},{"l":"B","h":"The level of systemic risk included in the derivatives contract price"},{"l":"C","h":"The need to calculate variation margin on a daily basis"},{"l":"D","h":"The cost of the derivative as a percentage of the return on the investment"}],"a":"D","e":"<p>Gearing looks at the initial investment as a percentage of the return. If an investor buys a share for £2 and the sells it for £2.20, she makes a 10% profit on an investment of £2. However, if that investor bought a call option X£2 for 12p and exercises when the share is £2.20, she makes a 8p profit on an outlay of 12p - a 66.7% profit.<\/p>"},{"s":4,"n":58,"id":"1036963","q":"<p>Which of the following is the best description of a barrier option?<\/p>","o":[{"l":"A","h":"An option that is activated or deactivated when the underlying hits a certain barrier price"},{"l":"B","h":"An option with a predetermined payout cap at which point exercise is automatic"},{"l":"C","h":"An option with a predetermined payout floor at which point exercise is automatic"},{"l":"D","h":"An option on the difference between a floating exchange rate and predetermined payout floor"}],"a":"A","e":"<p>An option that is activated or deactivated when the underlying hits a certain barrier price.<\/p>"},{"s":4,"n":59,"id":"1016989","q":"<p>Oil is currently trading at $20 per barrel. A trader is bullish and thinks that the price of oil will rise. The market believes that in three months' time the price of oil will be $22 per barrel.<br/> Interest costs are 5.5% pa. Storage costs are 2% pa.<br/> What is the fair value of the three-month contract?<\/p>","o":[{"l":"A","h":"$22"},{"l":"B","h":"$21.50"},{"l":"C","h":"$20.38"},{"l":"D","h":"$20.13"}],"a":"C","e":"<p>Fair value = cash asset + cost-of-carry <br/> = $20 + ($20 x ((5.5% + 2%) x 3 / 12)) = $20.38<br/> The other information is irrelevant.<\/p>"},{"s":4,"n":60,"id":"1055520","q":"<p>Which of the below options is not an influencing factor on supply of Metals?<\/p>","o":[{"l":"A","h":"Availability"},{"l":"B","h":"Cost of extraction"},{"l":"C","h":"Government subsidies and tariffs"},{"l":"D","h":"Suitable Land"}],"a":"D","e":"<p>All play a part in supply of metals except suitable land. Land is a factor for agriculturals where we require suitability for growth.<\/p>"},{"s":4,"n":61,"id":"1017025","q":"<p>Which of the following exchange-traded metals is traded at the LME?<\/p>","o":[{"l":"A","h":"Manganese"},{"l":"B","h":"Chromium"},{"l":"C","h":"Cadmium"},{"l":"D","h":"Copper"}],"a":"D","e":"<p>Only copper is traded on the London Metal Exchange (LME).<\/p>"},{"s":4,"n":62,"id":"1036965","q":"<p>The current Euro/Sterling rate is 1.50 (1.50 Euro: 1 GBP). If European interest rates are 3% and UK interest rates are 4% - calculate the six-month forward rate.<\/p>","o":[{"l":"A","h":"1.50 euro: 1 GBP"},{"l":"B","h":"1.5225 euro: 1 GBP"},{"l":"C","h":"1.4926 euro: 1 GBP"},{"l":"D","h":"1.5125 euro: 1 GBP"}],"a":"C","e":"<p>Step 1. Calculate 1.50 euro @ 3% for six months = 1.5 x [1 + (0.03 x 6/12)] = 1.5225 euro <br/> Step 2: Calculate 1 GBP @ 4% for six months = £1 x [1 + (0.04 x 6/12)] = 1.02 GBP <br/> Step 3: Calculate the six-month forward rate = 1.5225 / 1.02 = 1.4926 Euro: 1 GBP<\/p>"},{"s":4,"n":63,"id":"1055068","q":"<p>A convertible bond:-<\/p>","o":[{"l":"A","h":"Converts into equity in the issuer"},{"l":"B","h":"Converts into another grade of debt"},{"l":"C","h":"Converts into an option"},{"l":"D","h":"Converts into equity in another organisation"}],"a":"A","e":"<p>Convertibility - where the bond can be converted into a certain number of equities, often seen as a low risk way of gaining exposure to an equity price increase. A convertible can be changed into shares of the issuer whereas an exchangeable can be turned into shares of a related body.<\/p>"},{"s":4,"n":64,"id":"1017026","q":"<p>A report of supply problems for North Sea gas would result in which of the following for gas futures?<\/p>","o":[{"l":"A","h":"Prices would decrease"},{"l":"B","h":"Prices would increase"},{"l":"C","h":"Prices could increase or decrease"},{"l":"D","h":"Prices will be unaffected"}],"a":"B","e":"<p>Any decrease in supply would increase commodity contract prices.<\/p>"},{"s":4,"n":65,"id":"1037043","q":"<p>Mallard Ltd pays no dividends and is currently trading at 75p. If a one year European 80 call is 10p and one year interest rates are 10%, the one year European 80 put has a theoretical value of:<\/p>","o":[{"l":"A","h":"77.3p"},{"l":"B","h":"7.73p"},{"l":"C","h":"15p"},{"l":"D","h":"150p"}],"a":"B","e":"<p>Put-call parity theory:<br/> C - P = S - K / (1+r)^t<br/> Therefore:<br/> 10p - P = 75p - 80p / 1+ 0.1<br/> 10p - P = 75p - 72.73p<br/> 10p - P = 2.27p<br/> 10p - 2.27p = 7.73p<\/p>"},{"s":4,"n":66,"id":"1036998","q":"<p>Which of the following may a firm call as collateral from a client with their permission?<\/p><p class=\"rom\"><b>I<\/b> Equity<\/p><p class=\"rom\"><b>II<\/b> Warrants<\/p><p class=\"rom\"><b>III<\/b> Debentures<\/p><p class=\"rom\"><b>IV<\/b> Cash<\/p>","o":[{"l":"A","h":"I, II, III"},{"l":"B","h":"III and IV"},{"l":"C","h":"I, III, IV"},{"l":"D","h":"I, II, III, IV"}],"a":"D","e":"<p>With the permission of the client a firm could call any of these. UK Clearing houses, however, would only accept debentures and cash.<\/p>"},{"s":4,"n":67,"id":"1036992","q":"<p>Which of the following is true in relation to segregation of assets?<\/p>","o":[{"l":"A","h":"US and UK rules require segregation of all client assets from those of the firm"},{"l":"B","h":"US and UK rules require segregation of all retail client assets from those of the firm"},{"l":"C","h":"UK rules require segregation of retail client assets from those of the firm and US rules require segregation of all client assets"},{"l":"D","h":"UK rules require segregation of all client assets from those of the firm and US rules require segregation of retail client assets"}],"a":"C","e":"<p>A UK firm dealing with a US client must treat all US money as client money and give it adequate protection.<br/> It is possible, however, for some UK clients to opt out of this protection. A retail client may never opt out.<\/p>"},{"s":4,"n":68,"id":"1053746","q":"<p>If an investor believes that markets will stagnate they would MOST LIKELY use which one of the following strategies?<\/p>","o":[{"l":"A","h":"Bear Call"},{"l":"B","h":"Bull Put"},{"l":"C","h":"Long Straddle"},{"l":"D","h":"Covered Short Put"}],"a":"D","e":"<p>A covered short put would retain the premium if prices stagnate.<br/> Bear call is bearish - prices falling<br/> Bull put is bulling - prices rising<br/> Long straddle - volatility increasing<\/p>"},{"s":4,"n":69,"id":"1036974","q":"<p>A fund manager has a holding of £10,000,000 of the cheapest to deliver gilt. The £100,000nv long gilt future contract is priced at £106.64 per £100 nominal value. How many contracts does she need to hedge a rise in interest rates if the price factor is 0.85?<\/p>","o":[{"l":"A","h":"Buy 100 contracts"},{"l":"B","h":"Sell 100 contracts"},{"l":"C","h":"Buy 85 contracts"},{"l":"D","h":"Sell 85 contracts"}],"a":"D","e":"<p>Number of contracts = (£10,000,000 / £100,000) x 0.85 = 85 contracts. The fund manager should enter into a short hedge (long cash, short future).<\/p>"},{"s":4,"n":70,"id":"1036979","q":"<p>Calculate the fair value of a 182 day S&amp;P 500 future if the cash index is trading at 7,900, the dividend yield is 2.75% and the risk free rate is 2%.<\/p>","o":[{"l":"A","h":"7,777"},{"l":"B","h":"7,780"},{"l":"C","h":"7,870"},{"l":"D","h":"8,000"}],"a":"C","e":"<p>Fair value = 7,900 + (7,900 x 0.02 x 182/360) - (7,900 x 0.0275 x 182/360) = 7,870<\/p>"},{"s":4,"n":71,"id":"1036958","q":"<p>Which of the following options is likely to have the highest gamma?<\/p>","o":[{"l":"A","h":"A six month in-the-money call"},{"l":"B","h":"A one month out-of-the-money call"},{"l":"C","h":"A six month at-the-money call"},{"l":"D","h":"A one month at-the-money call"}],"a":"D","e":"<p>Short options have a steeper in-the-money and shallower out-the-money portion to their premium curves than long dated options. A change in the value of the underlying from the strike price would therefore result in a greater change in delta.<\/p>"},{"s":4,"n":72,"id":"1065123","q":"<p>A special purpose entity (SPE) acquires a portfolio of underlying assets and then issues a debt security based on these assets. This would be called which of the following:<\/p>","o":[{"l":"A","h":"Equity linked note"},{"l":"B","h":"Synthetic collateralised debt obligations"},{"l":"C","h":"Collateralised debt obligations"},{"l":"D","h":"Credit linked note"}],"a":"C","e":"<p>Collateralised debt obligations (CDOs) are a type of structured asset-backed security (ABS) whose value and payments are derived from a portfolio of fixed-income underlying assets. A special purpose entity (SPE, more commonly referred to as a special purpose vehicle or SPV in European markets) acquires a portfolio of underlying assets.<\/p>"},{"s":4,"n":73,"id":"1037039","q":"<p>Which of the following actions would a clearing house be unable to take if a counterparty to a trade defaulted on their obligations?<\/p>","o":[{"l":"A","h":"Close out and settle open contracts belonging to the defaulting member and their original counterparty"},{"l":"B","h":"Transfer open positions to another member"},{"l":"C","h":"Hedge the risk of the defaulting member's open position by entering into new contracts on the exchange"},{"l":"D","h":"Hedge the risk of the defaulting member's open position by entering into other off-exchange transactions"}],"a":"A","e":"<p>The clearing house would close out the positions of the defaulting member but not their counterparty. Remember, the clearing house is the counterparty to every cleared trade, so would close out the trades of the defaulting member and look to transfer or hedge their exposure.<\/p>"},{"s":4,"n":74,"id":"1055519","q":"<p>Which of the below exchanges allows trading of options on equity indices?<\/p>","o":[{"l":"A","h":"DME"},{"l":"B","h":"London Metals Exchange"},{"l":"C","h":"LSE Derivatives"},{"l":"D","h":"NYMEX"}],"a":"C","e":"<p>Dubai Mercantile Exchange trades oil contracts. LME trades futures and options on metals. NYMEX trades energy and metals.<\/p>"},{"s":4,"n":75,"id":"1017040","q":"<p>Who pays the invoice amount?<\/p>","o":[{"l":"A","h":"The long pays it to the exchange"},{"l":"B","h":"The seller pays it to the clearing house"},{"l":"C","h":"The seller pays it to the long"},{"l":"D","h":"The long pays it to the clearing house"}],"a":"D","e":"<p>The long pays the invoice amount to the clearing house who then passes it onto the short.<\/p>"},{"s":4,"n":76,"id":"1037003","q":"<p>If an investor is long ten futures contracts and long ten put contracts, to offset market risk from this position, the investor should:<\/p>","o":[{"l":"A","h":"Buy 10 call options"},{"l":"B","h":"Sell 10 call options"},{"l":"C","h":"Sell 10 futures contracts"},{"l":"D","h":"Do nothing as there is no market risk"}],"a":"B","e":"<p>According to put-call parity, being long a future and long a put creates a synthetic long call. Therefore, to offset this position, the investor should sell calls.<\/p>"},{"s":4,"n":77,"id":"1036993","q":"<p>In relation to final settlement of cash settled index futures contracts which of the following best describes the obligations of longs and shorts?<\/p>","o":[{"l":"A","h":"The short is responsible for delivery of a basket of assets at the EDSP adjusted for contract size"},{"l":"B","h":"The long and the short are responsible for funding the final flow of variation margin based on the contract EDSP and the opening price"},{"l":"C","h":"The long is responsible for funding the difference between the pre-agreed strike and the EDSP adjusted for contract size"},{"l":"D","h":"The long and the short are responsible for funding the final variation margin flow being the difference between the EDSP and the previous mark-to-market price"}],"a":"D","e":"<p>Variation margin flows will have taken account of profits or losses arising up to the previous day's mark-to-market price. On the final day therefore any difference between the EDSP and the previous mark-to-market price needs to be funded (the direction of the flow will depend on whether the EDSP is higher or lower).<\/p>"},{"s":4,"n":78,"id":"1036994","q":"<p>In which of the following situations might it be possible for an arbitrager to make money?<\/p><p class=\"rom\"><b>I<\/b> A long call and a short put with the same expiry, same strike and on the same asset are trading more cheaply than the future<\/p><p class=\"rom\"><b>II<\/b> The price of a spread is below that of its constituent parts<\/p><p class=\"rom\"><b>III<\/b> The premium on an option is expected to rise in value due to an expected increase in volatility<\/p><p class=\"rom\"><b>IV<\/b> A three-month index future is trading above that of the cost of the equity that makes it up and of holding it for the three-months<\/p>","o":[{"l":"A","h":"I and II"},{"l":"B","h":"II and III"},{"l":"C","h":"I, II, IV"},{"l":"D","h":"I, III, IV"}],"a":"C","e":"<p>To perform an arbitrage trade there must be a discrepancy in the market to allow a risk free profit. Trade (III) is merely a speculative trade with all of the risks involved.<\/p>"},{"s":4,"n":79,"id":"1052120","q":"<p>Which of the clearing houses is used by the London Metal Exchange?<\/p>","o":[{"l":"A","h":"ICE Clear Europe"},{"l":"B","h":"NYSE Liffe Clearing"},{"l":"C","h":"LCH.Clearnet"},{"l":"D","h":"LME Clear"}],"a":"D","e":"<p>ICE Futures Europe uses ICE Clear Europe for clearing of trades, and Eurex Clearing acts as clearing house for Eurex. LME Clear is now used to clear LME trades.<\/p>"},{"s":4,"n":80,"id":"1036971","q":"<p>An investor is long an 97 BTP call at a 30 tick premium and short a put at the same exercise price at a 20 tick premium. What is the overall position?<\/p>","o":[{"l":"A","h":"A synthetic long future at 97.10"},{"l":"B","h":"A synthetic long call at 97.10"},{"l":"C","h":"A synthetic short future at 97.10"},{"l":"D","h":"A synthetic long future at 96.90"}],"a":"A","e":"<p>Long call + short put = synthetic long. The breakeven price will be equal to the strike price plus the difference between the two premiums, i.e. 97 + (0.3 - 0.2) = 97.10. Note that the premiums are expressed as ticks. One tick is 0.01.<\/p>"},{"s":4,"n":81,"id":"1036973","q":"<p>Which of the following is an example of a diagonal spread?<\/p>","o":[{"l":"A","h":"Buying a 100 call at a premium of 10 pence and selling a 110 call at a 2 pence premium"},{"l":"B","h":"Selling a 100 call at an 8p premium and buying a 110 call at a 2p premium"},{"l":"C","h":"Selling a June 100 call and buying a September 100 call"},{"l":"D","h":"Buying a 100 March put and selling a 110 June put"}],"a":"D","e":"<p>A = bull call spread, a type of VERTICAL spread<br/> B = bear call spread, a type of VERTICAL spread<br/> C = HORIZONTAL or CALENDAR spread<\/p>"},{"s":4,"n":82,"id":"1037037","q":"<p>Who issues an assignment notice before expiry?<\/p>","o":[{"l":"A","h":"The holder of an option"},{"l":"B","h":"ICE Clear Europe - at its discretion"},{"l":"C","h":"The exchange - at its discretion"},{"l":"D","h":"The writer of an option"}],"a":"B","e":"<p>The clearing house will send out the assignment notice to a short position of its choice.<\/p>"},{"s":4,"n":83,"id":"1037585","q":"<p>ICE Clear Europe offers a mutual guarantee that includes default protection through the use of a default fund. How are each member's contributions to this default fund calculated for their exchange traded contracts?<\/p>","o":[{"l":"A","h":"A sum equal to the total average daily value of their derivative positions over a three month period"},{"l":"B","h":"A sum equal to the total average daily value of initial margin held with ICE Clear Europe over a three month period"},{"l":"C","h":"A proportion of the member's daily average value of margin held with ICE Clear Europe over a three month period"},{"l":"D","h":"A proportion of the notional value of the default fund based on the average daily volume and value of trades conducted over a three month period"}],"a":"D","e":"<p>This is a very technical question, and not really covered in the syllabus. This question has appeared in the exam, however, so is worth discussing here.<br/> The default fund has a notional value that needs to be contributed.<br/> When calculating a member's contributions to this, the clearing house will look at the volume and value of trades conducted by a member over a three month period as a proportion of the total volume and value of trades cleared by all members. The members then contribute funds that will cover this proportion of activity.<br/> Although you will never be asked to calculate this, it is worth looking at an example:<br/> If a firm's average daily volume of contracts was 5% of the total average daily volume cleared by the clearing house, and the firm's average daily initial margin contribution was 8% of the total average daily initial margin contribution, then the clearing house would halve each (2.5% and 4% respectively) and add both to get a proportion of 6.5%.<\/p>"},{"s":4,"n":84,"id":"1037030","q":"<p>The markets for US Treasury bill futures is regulated by which body?<\/p>","o":[{"l":"A","h":"The US Treasury"},{"l":"B","h":"The Federal Reserve"},{"l":"C","h":"The Securities and Exchange Commission (SEC)"},{"l":"D","h":"The Commodities Futures Trading Commission (CFTC)"}],"a":"D","e":"<p>The CFTC controls commodity and financial derivatives markets, although the SEC does control equity derivative markets.<\/p>"},{"s":4,"n":85,"id":"1036991","q":"<p>A trader holds a straddle with strike prices set at 740. The underlying is at 765. What is the intrinsic value?<\/p>","o":[{"l":"A","h":"0"},{"l":"B","h":"25"},{"l":"C","h":"(25)"},{"l":"D","h":"50"}],"a":"B","e":"<p>There is no such thing as negative intrinsic value on a put option. The call option is in the money by 25p.<\/p>"},{"s":4,"n":86,"id":"1036977","q":"<p>Which of the following best describes delta?<\/p>","o":[{"l":"A","h":"A measure of the change in an option's premium for a change in the price of the underlying"},{"l":"B","h":"A measure of the percentage change in the underlying for a percentage change in an option's premium"},{"l":"C","h":"A measure of the rate of change of the premium for a change in the volatility of the underlying"},{"l":"D","h":"A measure of the rate of change of volatility given a change in the time to expiry"}],"a":"A","e":"<p>Option A is the best description of an option's delta.<\/p>"},{"s":4,"n":87,"id":"1036966","q":"<p>Which of the following would be best described as an arbitrage trade?<\/p>","o":[{"l":"A","h":"Selling a FTSE 100 future in anticipation that the index will rise"},{"l":"B","h":"Buying an equity 240 call option in anticipation of the equity price rising above 240"},{"l":"C","h":"Buying an equity 240 call option at a premium of 25 ticks and selling an equity 240 put option at 30 ticks"},{"l":"D","h":"Selling STIR futures to protect against a rise in interest rates payable on an outstanding loan"}],"a":"C","e":"<p>Options A and B describe SPECULATION. Option D describes HEDGING. Option C describes a possible arbitrage trade and forms the basis of put-call parity.<\/p>"},{"s":4,"n":88,"id":"1065119","q":"<p>Which one of the following is the best description of a client's executing member who does not have access to clearing facilities?<\/p>","o":[{"l":"A","h":"A non-clearing proprietary member"},{"l":"B","h":"An individual clearing broker/dealing member"},{"l":"C","h":"A full non-clearing broker member"},{"l":"D","h":"A general clearing broker/dealing member"}],"a":"C","e":"<p>As the executing member is performing a trade for a client they must be at least a broker, as they do not have access to clearing facilities they must be a non clearing member making this the best answer.<\/p>"},{"s":4,"n":89,"id":"1016986","q":"<p>In the event of a default by an exchange member, which of the following is the best description of what will happen if the clearing house offers an independent guarantee?<\/p>","o":[{"l":"A","h":"The resources of the clearing house can be used to close-out the position"},{"l":"B","h":"The resources of the clearing house and the clearing house members will be used to close-out the position"},{"l":"C","h":"The resources of the members of the clearing house only will be used"},{"l":"D","h":"The resources of only the defaulting member will be used"}],"a":"A","e":"<p>If an exchange is using an independent guarantee then after using clearing member margin, its resources will be used in the event of a default by a clearing member.<br/> ICE Clear Europe uses a mutual guarantee where both the clearing house and members' resources are used.<\/p>"},{"s":4,"n":90,"id":"1036990","q":"<p>Which of the following best describes the position of a firm that has dual capacity but a non-clearing member of a clearing house?<\/p>","o":[{"l":"A","h":"Able to execute and clear trades for the firm and clients"},{"l":"B","h":"Able to execute but not clear trades for the firm only"},{"l":"C","h":"Able to execute and clear own trades but must give up client trades to a clearing member"},{"l":"D","h":"Able to execute trades for the firm and clients but needs an arrangement with another firm for clearing"}],"a":"D","e":"<p>Dual capacity shows that the firm can act a broker and dealer. All trades executed will normally then be cleared by a General Clearing Member by agreement.<\/p>"},{"s":4,"n":91,"id":"1037012","q":"<p>Which of the following would not be disclosed to a retail client in relation to potential margin payments?<\/p>","o":[{"l":"A","h":"When margin will be required and when it is due"},{"l":"B","h":"The form of investments the clearing house accepts as margin"},{"l":"C","h":"The steps the firm will take if the client fails to pay the required margin"},{"l":"D","h":"Any other circumstances in which the firm may close out the client's position"}],"a":"B","e":"<p>A retail client must be notified BEFORE conducting a contingent liability transaction. They will be notified of what the broker accepts as margin, but not what the clearing house accepts.<\/p>"},{"s":4,"n":92,"id":"1037025","q":"<p>In an open outcry trade, if all of the following participants are involved in the trade, who initiates the process?<\/p>","o":[{"l":"A","h":"Client"},{"l":"B","h":"Clearing house"},{"l":"C","h":"Broker"},{"l":"D","h":"Counterparty"}],"a":"A","e":"<p>The client would initiate the trade by contacting their broker to place the trade with the floor dealer or equivalent.<\/p>"},{"s":4,"n":93,"id":"1037028","q":"<p>Which of the following is most likely to drive oil prices up?<\/p>","o":[{"l":"A","h":"Greater OPEC output"},{"l":"B","h":"War in the Middle East"},{"l":"C","h":"The discovery of major oil reserves in Surrey"},{"l":"D","h":"A breakthrough in renewable energy technology"}],"a":"B","e":"<p>A war would constrict supply, creating a shortage of oil and therefore higher prices.<\/p>"},{"s":4,"n":94,"id":"1036988","q":"<p>Which ONE of the following best describes spot month margining?<\/p>","o":[{"l":"A","h":"It replaces initial margin in the delivery month."},{"l":"B","h":"It is used to ensure that clients have adequate funds to make delivery"},{"l":"C","h":"It reduces the overall margin requirement"},{"l":"D","h":"It is used to net off margin across different positions"}],"a":"B","e":"<p>It also discourages speculators in the delivery month and is in addition to initial margin.<\/p>"},{"s":4,"n":95,"id":"1065078","q":"<p>Which of the following is a difference between equity warrants and equity call options?<\/p>","o":[{"l":"A","h":"Underlying instrument"},{"l":"B","h":"Only one of these gives the holder any choice"},{"l":"C","h":"Call options give the issuer to right to buy"},{"l":"D","h":"The arena and method of trading"}],"a":"D","e":"<p>Options tend to trade on exchanges. Warrants are issued by the company itself and are typically traded privately.<\/p>"},{"s":4,"n":96,"id":"1037046","q":"<p>Interest rates stand at 6% and the dividend yield on the FTSE 100 Index is 2.5%. The March FTSE future is trading at 6,200 and the June FTSE future is trading at 6,250. You expect interest rates to fall, therefore the June/September spread will:<\/p>","o":[{"l":"A","h":"Fluctuate"},{"l":"B","h":"Narrow"},{"l":"C","h":"Widen"},{"l":"D","h":"Be unaffected by changes in interest rates"}],"a":"B","e":"<p>A reduction in interest rates will reduce the cost of carry, and therefore reduce the spread between the June and September contracts.<\/p>"},{"s":4,"n":97,"id":"1036961","q":"<p>Which of the following statements best describes open interest?<\/p>","o":[{"l":"A","h":"It is the volume of lots on the bid and offer at the opening for a particular delivery month"},{"l":"B","h":"The sum of all long positions less all short positions currently open for delivery for a particular delivery month"},{"l":"C","h":"The sum of all segregated and in-house positions open for delivery for a particular delivery month"},{"l":"D","h":"The total of short positions open for delivery for a particular delivery month"}],"a":"D","e":"<p>The open interest for a given delivery month is the total of all long OR short positions open for delivery in that contract.<\/p>"},{"s":4,"n":98,"id":"1037035","q":"<p>Which of the following allows a trader to close out a loss making long position by selling contracts but with the possibility that some are sold below the stated price?<\/p>","o":[{"l":"A","h":"Market if touched"},{"l":"B","h":"Sell limit"},{"l":"C","h":"Sell stop"},{"l":"D","h":"Stop limit"}],"a":"C","e":"<p>Sell stops specify a limit price for closing out purposes but the price is not guaranteed.<\/p>"},{"s":4,"n":99,"id":"1036976","q":"<p>Which of the following best describes the advantages of gearing?<\/p>","o":[{"l":"A","h":"The possibility to generate a large return on a large investment"},{"l":"B","h":"The possibility to generate a small return on a large investment"},{"l":"C","h":"The possibility to generate a small return on a small investment"},{"l":"D","h":"The possibility to generate a large return on a small investment"}],"a":"D","e":"<p>Note that in the US, gearing is referred to as 'leverage'.<\/p>"},{"s":4,"n":100,"id":"1037045","q":"<p>A client buys an American style Jan 2,400 index call at 55p, and simultaneously buys a Jan 2,400 put at 75p. The spot price is currently 2,360. Assuming no other trades and ignoring commission what are the break even points?<\/p>","o":[{"l":"A","h":"2,345 and 2,475"},{"l":"B","h":"2,380 and 2,420"},{"l":"C","h":"2,270 and 2,530"},{"l":"D","h":"2,230 and 2,490"}],"a":"C","e":"<p>This is a long straddle. The downside breakeven is the strike price (2,400) less the two premiums (55p + 75p = 130p), i.e. 2,400 - 130 = 2,270. The upside breakeven is the strike price plus the two premiums, i.e. 2,400 + 130 = 2,530.<\/p><p><strong><br/> <\/strong><\/p>"},{"s":5,"n":1,"id":"1037140","q":"<p>An investor buys a put and simultaneously sells a put with a higher strike price. What strategy has he entered into?<\/p>","o":[{"l":"A","h":"Bull call spread"},{"l":"B","h":"Bear call spread"},{"l":"C","h":"Bull put spread"},{"l":"D","h":"Bear put spread"}],"a":"C","e":"<p>Remember BULL BUY LOW strike call or put. Therefore the investor has entered into a BULL put spread.<\/p>"},{"s":5,"n":2,"id":"1040410","q":"<p>A producer who is long a commodity and is concerned that it will fall in value should undertake which of the following?<\/p>","o":[{"l":"A","h":"Buy a commodity floor"},{"l":"B","h":"Sell a commodity floor"},{"l":"C","h":"Buy a commodity cap"},{"l":"D","h":"Sell a commodity cap"}],"a":"A","e":"<p>If the commodity falls below the strike price of the floor, the floor will be exercised creating a cash flow which will compensate the producer for the lower prices.<\/p>"},{"s":5,"n":3,"id":"1016990","q":"<p>An investor who sells the expensive contract and takes an offsetting position in the cash market is undertaking which of the following trades?<\/p>","o":[{"l":"A","h":"Selling basis"},{"l":"B","h":"Cost-of-carry"},{"l":"C","h":"Reverse cash and carry"},{"l":"D","h":"Cash/Futures arbitrage"}],"a":"D","e":"<p>The best answer would be Cash and Carry arbitrage but this is not available.<br/> Given the choice the correct answer is Cash/Futures arbitrage. Cash/Future arbitrage is a generic term that can be used to describe a Cash and Carry arbitrage OR a Reverse Cash and Carry arbitrage.<br/> Cash and carry: buy cash, sell future. Reverse cash and carry: sell cash and buy the future.<\/p>"},{"s":5,"n":4,"id":"1037111","q":"<p>Which ONE of the following is TRUE of FCA authorised funds?<\/p>","o":[{"l":"A","h":"They allow the clients to dictate to the manager an investment strategy"},{"l":"B","h":"They are high volatility funds, often referred to as hedge funds"},{"l":"C","h":"They expose the clients to direct derivative investments"},{"l":"D","h":"They are freely marketable to the UK retail market"}],"a":"D","e":"<p>Authorised funds are marketable to the UK retail market. They can provide a safer, indirect way of investing in derivatives. The disadvantage is that the investor does not have the power to dictate investment strategy.<\/p>"},{"s":5,"n":5,"id":"1050202","q":"<p>In a swap, what is the significance of the effective date?<\/p>","o":[{"l":"A","h":"It is the date on which interest payments are made"},{"l":"B","h":"It is the date on which the interest rate for the next period is calculated"},{"l":"C","h":"It is the final day of the swap"},{"l":"D","h":"It is the start date for accrual purposes"}],"a":"D","e":"<p>The effective date is the date from which interest calculations begin; it is the start of the swap. Reset dates are when interest rates are set and payment dates are when the netted interest amount is paid.<\/p>"},{"s":5,"n":6,"id":"1037145","q":"<p>The shares of a company are currently at 400p. The date is January 2021. Which of the following call options has the highest time value?<\/p>","o":[{"l":"A","h":"April 2021 and strike 380p"},{"l":"B","h":"October 2021 and strike 380p"},{"l":"C","h":"April 2021 and strike 360p"},{"l":"D","h":"October 2021 and strike 360p"}],"a":"B","e":"<p>Options with the longest remaining life (in this question, the Octobers) have the greatest time value. Of these, the option which is closest to being at the money will have greatest time value.<\/p>"},{"s":5,"n":7,"id":"1040927","q":"<p>Which statement about metal supply is false?<\/p>","o":[{"l":"A","h":"If metal prices fall, supply will in turn fall, causing prices to fall further"},{"l":"B","h":"A decline in metal prices will encourage producers to cut back on production"},{"l":"C","h":"If metal prices rise, production will also rise. The increasing production will push prices down"},{"l":"D","h":"In a rising market, producers will be encouraged to increase production to take advantage of increasing prices"}],"a":"A","e":"<p>If metal prices fall, supply will in turn fall, bringing prices to a new equilibrium though, causing them to rise.<\/p>"},{"s":5,"n":8,"id":"1037110","q":"<p>Which ONE of the following represents a reason for the introduction of the over-the-counter derivatives market?<\/p>","o":[{"l":"A","h":"Liquidity"},{"l":"B","h":"Reduced default risk"},{"l":"C","h":"Speed up trading"},{"l":"D","h":"Confidentiality"}],"a":"D","e":"<p>The others represent benefits of exchange traded derivatives.<\/p>"},{"s":5,"n":9,"id":"1040379","q":"<p>Aluminium is trading at $1,200. Interest rates are 12% pa and storage costs are $15 for three months.<br/> What contango on cash price (for 91 days) is required for it to be worthwhile for an investor to buy cash and sell forward?<\/p>","o":[{"l":"A","h":"$27"},{"l":"B","h":"$36"},{"l":"C","h":"$51"},{"l":"D","h":"$59"}],"a":"D","e":"<p>This is a strangely-worded question. The contango is the difference between cash and futures price where the futures price is higher than cash. The assumption has to be that the examiner is asking what is the cost of carry for a three month period and therefore if the contango is greater it would be profitable to buy cash and sell forward (cash and carry arbitrage).<br/> Cash price = $1,200 Interest for 91 days = $1,200 x 12% x 91/360 = $36.4 Storage = £15<br/> Cost of carry = $51.4<br/> If the cost of carry were $51.4 and the contango $59, it would be worthwhile buying cash and selling forward.<\/p>"},{"s":5,"n":10,"id":"4221974","q":"<p>The 3 month future is currently trading at £10,000, dividend yields are 3.24% p.a., interest rates are 4.00% p.a. and storage and insurance market rates are 5.25% p.a.. Under IASB accountancy standards, what will be recorded as the future's fair value?<\/p>","o":[{"l":"A","h":"£10,000"},{"l":"B","h":"£10,018.95"},{"l":"C","h":"£10,128.74"},{"l":"D","h":"£10,131.86"}],"a":"A","e":"<p>IASB’s definition of a future’s fair value is its current market price. For market participants, the IASB requires at least a daily mark to market (MTM) valuation of all futures positions. The current market price is £10,000<\/p>"},{"s":5,"n":11,"id":"1037096","q":"<p>Phil's current portfolio is short 20 calls with a delta of 0.3. The portfolio can be made delta neutral by:<\/p>","o":[{"l":"A","h":"Buying 30 futures"},{"l":"B","h":"Selling 6 futures"},{"l":"C","h":"Buying 6 futures"},{"l":"D","h":"Selling 60 futures"}],"a":"C","e":"<p>The current delta position is 20 x -0.3 = -6. We therefore need a position that has a delta of +6 in order to delta neutralise the portfolio. Buying six futures will reach this as each long position has a delta of +1.<\/p>"},{"s":5,"n":12,"id":"1053738","q":"<p>Based on the Black and Scholes model for pricing options, we can assume that an increase in volatility will result in:<\/p>","o":[{"l":"A","h":"An increase in the premium value"},{"l":"B","h":"A decrease in the premium value"},{"l":"C","h":"An increase in historic volatility"},{"l":"D","h":"A decrease in historic volatility"}],"a":"A","e":"<p>The fact that volatility has increased will cause the premium value to increase, irrespective of the pricing model used (Black and Scholes or Binomial). The greater the volatility, the greater the risk that the option will be exercised against the writer, and as such they will demand a greater reward. The pricing model just tells us how much more of a reward there will be.<\/p>"},{"s":5,"n":13,"id":"1044791","q":"<p>An investor chooses to delay the purchase of an asset and looks at the 90-day future, which is the one closest to expiry. The current market price of the asset is 150, the risk-free rate is 5.5% and the cost of storage is 2%. If the expected price of the asset in 90 days' time is 170, calculate the fair value of the near-dated future.<\/p>","o":[{"l":"A","h":"150.00"},{"l":"B","h":"152.06"},{"l":"C","h":"152.8"},{"l":"D","h":"161.25"}],"a":"C","e":"<p>The rates need to be deannualised:<br/> 5.5% x 90 / 365 = 1.36%<br/> 2% x 90 / 365 = 0.49%<br/> Overall the cost-of-carry is 1.85%<br/> FV of future = 150 x 1.0185 = 152.775 or 152.8<\/p>"},{"s":5,"n":14,"id":"1047235","q":"<p>A general clearing member suffers default by an executing broker who gave up the trade. What protection will be offered to the member to cover the defaulting position?<\/p>","o":[{"l":"A","h":"Principal to principal guarantee"},{"l":"B","h":"Margin provided by the broker"},{"l":"C","h":"Clearing house capital"},{"l":"D","h":"Default fund"}],"a":"B","e":"<p>It is up to the GCM to manage their own exposure to the default of executing brokers who give-up the trade for them to clear. Clearing houses offer protection to their direct clearing members only.<\/p>"},{"s":5,"n":15,"id":"1037147","q":"<p>What is the purpose of price limits?<\/p>","o":[{"l":"A","h":"Stop one firm, individual or connected group establishing a dominant position in a futures market"},{"l":"B","h":"To ensure prices are available to market participants and encourage transparency"},{"l":"C","h":"To establish the requirement for and size of margin payments"},{"l":"D","h":"Prevent prices moving too far or too fast during a trading session"}],"a":"D","e":"<p>Price limits prevent abuses of the market, e.g. entering into a series of transactions to increase price and then reversing them (price positioning).<\/p>"},{"s":5,"n":16,"id":"1037107","q":"<p>An equity index future with a distant delivery date will have a higher fair value than that of a <br/> near-dated one if:<\/p>","o":[{"l":"A","h":"The equity market is currently enjoying a bull run"},{"l":"B","h":"The dividend yield exceeds present interest rates"},{"l":"C","h":"The equity market is currently in a bear run"},{"l":"D","h":"The dividend yield is lower than present interest rates"}],"a":"D","e":"<p>The fair value of the future is cash + cost of carry. The costs of carry for index futures is interest rates less dividends received (dividend yield). If the dividend yield was higher than prevailing interest rates, the distant-dated future would have a LOWER fair value than the near one.<\/p>"},{"s":5,"n":17,"id":"1055225","q":"<p>Which statement would be correct if current share price is 85?<\/p><p><img src=\"data:image/gif;base64,R0lGODdh4AHwAHcAACH+GlNvZnR3YXJlOiBNaWNyb3NvZnQgT2ZmaWNlACwAAAAA4AHwAIf///97e3vm7+Zzc3OMlIw6IVJCKWOEhHspCEopGUpajObO7+YQEFrOzs737/fFYxCEnFqMnO9KGRBKSs6MlM6traWMhIxSCN5SCJwZCJzFSt5SzmPFCN6tnGPFSpxSjGPFCJwInOYI3uZajKVazqUZzmOMCN4ZjGOMCJzOzubFY0LOnJwQGRAhMcVareZSa5zFxaVa7+ZKGTFazuZKaxmEa4zv3r1aSoStnMWcY2tKCFoQEDHOnObvWjqUOlqUOhnvGTrvnDqUEFqUEBnvWhDvGRDvnBDvWmPvGWPvnGNzOlpzOhlzEFpzEBnOY2uMa86l5uaUYxBKSuZzYxBKKcUZEM4pGVrFOmtSKe/FOinv3jrvjLXvOrXFEGvFECkZEO/FznPF7xBS7xDFrRBSrRCMznOM7xAZ7xCMrRAZrRAZSmuUzrUZSinv3hDvY7XvELXv3mOE7+bFOkrFOgjFEErFEAjFzlLFzhBSzhDFjBBSjBCMzlKMzhAZzhCMjBAZjBAZSkqUzpQZSggZSs7m3u+lxeZKa+9KQmu1nOallKXvWoQpraUp76Upa5zvGYTvnIQIraUI76UIa5wpjKUpzqUpSpwIjKUIzqUISpxKa85SSqWESs5Ka2vvjObF77XvOuaUY0JKSinvY+bvEObvta1Ka0rF75RzY0JKSgiEa62ExeaMnKUZa85KKYzOnMUZa+8ZKYzFa+/F73NS73Pv3oTF7zFS7zHFKe/OnHPFrTFSrTFSKa3Fa61SrXPFKa0 on. The holder's maximum loss is crystallised at 80 showing that this is the option strike. This means that the holder of the option would have the right to buy at 80 when the market is 85 meaning the holders option would be in-the-money.<\/p>"},{"s":5,"n":18,"id":"1040400","q":"<p>The announcement of which of the following would NOT affect the spot price of crude oil?<\/p>","o":[{"l":"A","h":"Worsening weather conditions across the US"},{"l":"B","h":"The announcement by OPEC that they will be reducing the daily quota of production"},{"l":"C","h":"A shortage in the supply of tankers"},{"l":"D","h":"A tax change"}],"a":"D","e":"<p>The first three will all affect supply and demand in the very short term and therefore will affect the spot price. A tax change may affect demand but probably not immediately and not necessarily, therefore it is the best answer.<\/p>"},{"s":5,"n":19,"id":"1037068","q":"<p>If an investor holds a cash settled contract, how would this differ from holding a deliverable contract?<\/p>","o":[{"l":"A","h":"Cash settled contracts always require cash as initial margin whereas physically settled can use other collateral"},{"l":"B","h":"Cash settled contracts generally take longer to deliver than physically settled"},{"l":"C","h":"Deliverable contracts are charged initial margin whereas cash settled only pay variation margin"},{"l":"D","h":"Deliverable contracts settle through the physical exchange of the asset whereas cash settled do not"}],"a":"D","e":"<p>Cash settled contracts are also called CFDs.<\/p>"},{"s":5,"n":20,"id":"1037142","q":"<p>If a member of a clearing house has elected for automatic exercise, how would they prevent the exercise of a particular option?<\/p>","o":[{"l":"A","h":"Cancellation order"},{"l":"B","h":"Suppression order"},{"l":"C","h":"Stop order"},{"l":"D","h":"Stop notice"}],"a":"B","e":"<p>Automatic exercise can be prevented from occurring by filing a suppression notice with the clearing house.<\/p>"},{"s":5,"n":21,"id":"1057166","q":"<p>A GBP inflation swap would be based upon which inflation index?<\/p>","o":[{"l":"A","h":"RPI"},{"l":"B","h":"RPIX"},{"l":"C","h":"HICP"},{"l":"D","h":"CPI"}],"a":"A","e":"<p>A GBP inflation swap would be based upon the RPI.<br/> Within the Eurozone the Harmonised Index of Consumer Prices (HICP) is used and within the US the US Consumer Price Index (CPI).<\/p>"},{"s":5,"n":22,"id":"1037583","q":"<p>How would a hedger attempt to eliminate basis risk?<\/p>","o":[{"l":"A","h":"Hold the derivative investment to expiry"},{"l":"B","h":"Structure the hedge using OTC derivatives"},{"l":"C","h":"Structure the hedge using exchange traded derivatives"},{"l":"D","h":"Create synthetic positions using futures and options"}],"a":"A","e":"<p>The best answer here is to hold the derivative until delivery where basis will be zero.<\/p>"},{"s":5,"n":23,"id":"1037066","q":"<p>Which TWO of the following dates defines the period of an interest rate swap?<\/p><p class=\"rom\"><b>I<\/b> The reset date<\/p><p class=\"rom\"><b>II<\/b> The payment date<\/p><p class=\"rom\"><b>III<\/b> The effective date<\/p><p class=\"rom\"><b>IV<\/b> The termination date<\/p>","o":[{"l":"A","h":"I and III"},{"l":"B","h":"I and II"},{"l":"C","h":"III and IV"},{"l":"D","h":"II and IV"}],"a":"C","e":"<p>The effective date is the date from which interest payments start to accrue; it is the beginning of the swap. The termination date is the day on which the final interest payment is to be made and is the end of the swap. Reset dates are dates throughout the life of the swap on which the new interest rate is set for the next period. Payment dates are the dates throughout the swap when payment is made by one party to another.<\/p>"},{"s":5,"n":24,"id":"1040384","q":"<p>Which of the following is the best description of a basis swap?<\/p>","o":[{"l":"A","h":"It is where both legs are fixed"},{"l":"B","h":"It is where both legs are floating"},{"l":"C","h":"It is where one leg is fixed and one is floating"},{"l":"D","h":"It is a swap involving commodities"}],"a":"B","e":"<p>A basis swap is a type of interest rate swap. In a basis swap both legs are based on floating interest rate calculations, for example an exchange of 3mth LIBOR for 3mth Fed Funds.<\/p>"},{"s":5,"n":25,"id":"1037083","q":"<p>The role of counterparty to the buyer of an exchange futures contract is taken over from the seller by:<\/p>","o":[{"l":"A","h":"A consortium of member firms"},{"l":"B","h":"The clearing member through which the contract was sold"},{"l":"C","h":"ICE Clear Europe"},{"l":"D","h":"Euronext Derivatives"}],"a":"C","e":"<p>All ICE Futures Europe trades are settled via ICE Clear Europe acting as central counterparty. As central counterparty, ICE Clear Europe is the buyer against every short trade and the seller against every long trade.<\/p>"},{"s":5,"n":26,"id":"1040392","q":"<p>Gamma is:<\/p>","o":[{"l":"A","h":"Negative for calls and puts"},{"l":"B","h":"Positive for calls and puts"},{"l":"C","h":"Negative for calls and positive for puts"},{"l":"D","h":"Positive for calls and negative for puts"}],"a":"B","e":"<p>We have to assume here that the examiner believes we are long an option. In which case long option positions have positive gamma.<\/p>"},{"s":5,"n":27,"id":"1037058","q":"<p><\/p><p>A UK company is to receive £10m in two months' time. It intends to place the funds on deposit for a three month period.<\/p><p>To hedge against the risk of rates falling, the company treasurer buys 20 short term interest rate futures on ICE Futures at 89.55. When the cash is received two months later, she sells 20 short sterling contracts at 90.10.<\/p><p>Calculate profit or loss on the future, assuming a tick value of £12.50 per basis point.<\/p>","o":[{"l":"A","h":"£3,750 loss"},{"l":"B","h":"£17,500 loss"},{"l":"C","h":"£13,750 gain"},{"l":"D","h":"£15,340 loss"}],"a":"C","e":"<p>Gain on futures position = 55 ticks x £12.5 x 20 contracts = £13,750.<\/p>"},{"s":5,"n":28,"id":"1037092","q":"<p>Jim buys a call option with a strike of 100 and a premium of 8p. At the same time he sells the underlying for 103p. Which of the following strategies has been constructed?<\/p>","o":[{"l":"A","h":"Synthetic long put with a maximum profit of 95p"},{"l":"B","h":"Synthetic long call with a maximum profit of 95p"},{"l":"C","h":"Synthetic short put with a maximum profit of 95p"},{"l":"D","h":"Synthetic short call with a maximum profit of 95p"}],"a":"A","e":"<p>Buying a call and selling the underlying creates a synthetic long put. The 'premium' paid for this put is 5p (103 - 8 - 100 = (5)). Therefore the breakeven price and maximum profit for this position is strike less premium which equals 100 - 5 = 95.<\/p>"},{"s":5,"n":29,"id":"1037116","q":"<p>A retail investor buys one future on ICE Futures Europe and clears through ICE Clear Europe. Which of the following is true of her margin payments?<\/p>","o":[{"l":"A","h":"They will be at least equal to those called on her broker"},{"l":"B","h":"The position will be offset against the market participant's positions within the same portfolio to reduce her margin"},{"l":"C","h":"Her position will be margined independently of any other position she holds"},{"l":"D","h":"They will not be called until the she either takes delivery or closes out the position"}],"a":"A","e":"<p>A broker must call at least the same margin from their retail clients as the clearing house calls from them.<\/p>"},{"s":5,"n":30,"id":"1065116","q":"<p>A derivative portfolio has a low gamma, this indicates:<\/p>","o":[{"l":"A","h":"The asset manager will less likely be required to actively manage their dynamic hedges to remain delta neutral"},{"l":"B","h":"The asset manager will definitely be required to actively manage their dynamic hedges to remain delta neutral"},{"l":"C","h":"The asset manager will need to be extra vigilant with their dynamic hedges as their positions are close to expiry"},{"l":"D","h":"The asset manager has created a net long options portfolio"}],"a":"A","e":"<p>Gamma is the measure of how delta changes (the rate of change of delta) with respect to movements in the price of the underlying. It is small when the option is either deep in-the-money, or far out-of the-money. It is at its greatest when the option is at-the-money, especially when the option is close to expiry. Traders will monitor the impact of gamma on the premiums of options. Short-dated ATM options are more volatile than longer-dated ones, and these differences may present an opportunity for trading profits. Asset managers also use gamma in their dynamic hedging strategies. As indicated, a portfolio can be delta neutral. The delta would have to be monitored and perhaps rebalanced because of the impact of gamma on the portfolio delta.<\/p>"},{"s":5,"n":31,"id":"1065128","q":"<p>If a one-year interest rate swap is brought together with a five-year interest rate swap, this would in effect create which of the following:<\/p>","o":[{"l":"A","h":"Arrears swap"},{"l":"B","h":"Deferred start swap"},{"l":"C","h":"Rollercoaster swap"},{"l":"D","h":"Inflation swap"}],"a":"B","e":"<p>A forward start swap is one that is agreed today, but the exchange of funds takes place at a future date. It is often priced as two partially offsetting swaps – both starting today, but one ending on the deferred start date of the forward swap. For example, a one-year swap and a five-year swap could partially offset to create a four-year swap, starting in a year's time. Forward start swaps are also known as 'deferred start swaps' or 'delayed start swaps'.<\/p>"},{"s":5,"n":32,"id":"1037093","q":"<p>Which of the following is true?<\/p>","o":[{"l":"A","h":"When the underlying falls in value call premiums fall and put premiums rise"},{"l":"B","h":"When the underlying rises in value call premiums fall and put premiums rise"},{"l":"C","h":"When the underlying falls in value call premiums fall and put premiums fall"},{"l":"D","h":"When the underlying falls in value call premiums rise and put premiums rise"}],"a":"A","e":"<p>When the underlying falls in value, call options have LESS intrinsic value but put options have MORE intrinsic value.<\/p>"},{"s":5,"n":33,"id":"1037085","q":"<p>What synthetic position is created if an investor sells a long gilt 97.00 call for a premium of 30 basis points and buys a long gilt 97.00 put for a premium of 20 basis points?<\/p>","o":[{"l":"A","h":"Synthetic long future at 96.90"},{"l":"B","h":"Synthetic long future at 97.10"},{"l":"C","h":"Synthetic short future at 97.10"},{"l":"D","h":"Synthetic short future at 96.90"}],"a":"C","e":"<p>Short call, long put = synthetic short position. <br/> For the price we can use put-call parity. Put call parity states:<br/> C - P + K = S<br/> 0.30 - 0.20 + 97 = 97.10<br/> Admittedly this is the short position. However, for the short position:<br/> P - C - K = S<br/> 0.20 - 0.30 - 97.00 = -97.10 (or short at 97.10)<\/p>"},{"s":5,"n":34,"id":"1065085","q":"<p>As the delta of an option increases it should be expected that:<\/p>","o":[{"l":"A","h":"The holder's variation margin increases"},{"l":"B","h":"The holder's variation margin decreases"},{"l":"C","h":"The seller's variation margin increases"},{"l":"D","h":"The seller's variation margin decreases"}],"a":"C","e":"<p>Only limited margin is payable by the buyers of options. As delta increases, however, the option moves further into the money, which is bad news for the seller.<\/p>"},{"s":5,"n":35,"id":"1044785","q":"<p>Which of the following is the BEST definition of a futures contract?<br/> To enter into an agreement to deliver or take delivery of:<\/p>","o":[{"l":"A","h":"A specified quality and quantity of a specified asset on a fixed future date at a price agreed today"},{"l":"B","h":"A specified quantity of an asset on or before a fixed future date at a price agreed today"},{"l":"C","h":"A specified quality and quantity of a specified asset on a non determined date at a price agreed today"},{"l":"D","h":"A specified quality and quantity of a specified asset at the prevailing market price on the delivery date"}],"a":"A","e":"<p>To deliver or take delivery of a specified quality and quantity of a specified asset on a fixed future date at a price agreed today is the standard definition of a future's contract.<\/p>"},{"s":5,"n":36,"id":"1017002","q":"<p>An investor buys a 100 strike put with a January expiry and sells a 120 strike put with an April expiry. This is an example of which type of trade?<\/p>","o":[{"l":"A","h":"A horizontal spread"},{"l":"B","h":"A bull put spread"},{"l":"C","h":"A bull call spread"},{"l":"D","h":"A diagonal spread"}],"a":"D","e":"<p>This is an example of a diagonal spread (buy and sell either all calls or all puts with different strikes and different expiries).<\/p>"},{"s":5,"n":37,"id":"1037099","q":"<p>All of the following are determined by the exchange in relation to contract specifications on options except:<\/p>","o":[{"l":"A","h":"Expiry date"},{"l":"B","h":"Strike price"},{"l":"C","h":"Size of contract"},{"l":"D","h":"Premium"}],"a":"D","e":"<p>The premium is determined by the market.<\/p>"},{"s":5,"n":38,"id":"1037139","q":"<p>Time value is greatest for which of the following options if the underlying asset is prices at 115 in April 2005?<\/p>","o":[{"l":"A","h":"May 2005 140 call"},{"l":"B","h":"May 2005 160 call"},{"l":"C","h":"August 2005 160 call"},{"l":"D","h":"November 2005 160 call"}],"a":"D","e":"<p>This is a difficult question. Time value is greatest for ATM options - however none of these options are that close to the strike price. Therefore the option with the greatest time value will be the one with the longest time until expiry.<\/p>"},{"s":5,"n":39,"id":"1038836","q":"<p>Which of the following BEST represents how trading is conducted on the London Metals Exchange (LME)?<\/p>","o":[{"l":"A","h":"Electronic trading is available only"},{"l":"B","h":"Open outcry trading is available only"},{"l":"C","h":"Quote driven trading is available only"},{"l":"D","h":"Open outcry and electronic trading are both available"}],"a":"D","e":"<p>The LME offers electronic trading on its SELECT order book platform. It also offers a 24-hour inter-office market, which is quote driven. A large quantity of the trades, however, are executed in the open outcry market. <br/> The open outcry market is conducted in two sessions. Each session has two rings, during which metals are individually traded in five minute periods, and ends with a kerb, during which all metals are traded simultaneously. <br/> These six periods (four rings and two kerbs) form the open outcry trading day.<\/p>"},{"s":5,"n":40,"id":"1040408","q":"<p>Who has the right to buy back undated government bonds?<\/p>","o":[{"l":"A","h":"They cannot be redeemed"},{"l":"B","h":"Institutional investors"},{"l":"C","h":"HM Government"},{"l":"D","h":"Gilt-edged market makers"}],"a":"C","e":"<p>Undated bonds would be repurchased by the Debt Management Office (DMO), which is part of Her Majesty's government.<\/p>"},{"s":5,"n":41,"id":"1037087","q":"<p>The fund manager of MegaFund has a holding of the cheapest-to-deliver gilt with a market value of £115m and nominal value of £120m. Which of the following is the most appropriate hedge if the price factor of the cheapest-to-deliver is 1.145625 and the face value of a long gilt future is £100,000?<\/p>","o":[{"l":"A","h":"Sell 1,375 long gilt futures"},{"l":"B","h":"Buy 1,375 long gilt futures"},{"l":"C","h":"Sell 1,200 long gilt futures"},{"l":"D","h":"Buy 1,200 long gilt futures"}],"a":"A","e":"<p>Number of contracts required = (NV of CTD/£100,000) x price factor.<br/> Therefore, number of contracts required = (£120,000,000/£100,000) x 1.145625 = 1,375 contracts (rounded to the nearest contract).<\/p>"},{"s":5,"n":42,"id":"1037102","q":"<p>Which of the following is a feature of Euronext Derivatives' Optiq?<\/p>","o":[{"l":"A","h":"Quote-driven"},{"l":"B","h":"Price dissemination service"},{"l":"C","h":"Order-driven"},{"l":"D","h":"Market making system"}],"a":"C","e":"<p>Universal Trading Platform is an electronic order book for trades conducted on Euronext Derivatives.<\/p>"},{"s":5,"n":43,"id":"1040399","q":"<p>If an investor holds an underlying position in an asset and an opposing futures position, they are exposed to which of the following?<\/p>","o":[{"l":"A","h":"Credit risk"},{"l":"B","h":"Market risk"},{"l":"C","h":"Basis risk"},{"l":"D","h":"There is no risk as they are hedged"}],"a":"C","e":"<p>The investor is most likely to be exposed to basis risk. Basis is the cash price minus the futures price. Basis risk is the risk that this relationship changes.<\/p>"},{"s":5,"n":44,"id":"1017036","q":"<p>Which of the following best describes a commodity swap?<\/p>","o":[{"l":"A","h":"A swap based on the price of two underlying commodities"},{"l":"B","h":"A swap where one party pays fixed interest in exchange for an amount that reflects the price of the agreed commodity"},{"l":"C","h":"A swap where a commodity is exchanged for a financial instrument"},{"l":"D","h":"A commodities future which is physically settled"}],"a":"B","e":"<p>'A swap where one party pays fixed interest in exchange for an amount that reflects the price of the agreed commodity' is the best description of a commodity swap, as it an exchange of a fixed price for a commodity index price, which reflects the price of the commodity. This question has recently been amended.<\/p>"},{"s":5,"n":45,"id":"1037078","q":"<p>An investor buys a bond with a BBB- credit rating. Why would they take out a credit default swap on the bond?<\/p>","o":[{"l":"A","h":"To increase the credit rating of the bond to AAA"},{"l":"B","h":"To sell the bond on at a profit"},{"l":"C","h":"To protect the investor from a credit event"},{"l":"D","h":"To swap the bonds income with the income of another asset"}],"a":"C","e":"<p>An investor would buy a credit default swap to protect himself from a credit event. If the bond did not suffer a credit event they would lose the premium that they paid for the swap.<\/p>"},{"s":5,"n":46,"id":"1037114","q":"<p>Which of the following would an investor choose if they expect a sharp rise in the market?<\/p>","o":[{"l":"A","h":"In-the-money call"},{"l":"B","h":"Out-of-the-money call"},{"l":"C","h":"In-the-money put"},{"l":"D","h":"At-the-money put"}],"a":"B","e":"<p>The gearing (expected return) is greatest in a rising market for out-of-the-money call options.<\/p>"},{"s":5,"n":47,"id":"1037134","q":"<p>Which of the following documents would need to be provided to a US investor in the event that a UK firm carries out a derivative transaction on their behalf?<\/p>","o":[{"l":"A","h":"CFTC Part 30 exemption declaration"},{"l":"B","h":"Risk warning to be acknowledged by the investor"},{"l":"C","h":"Reconciliation of assets every month"},{"l":"D","h":"Declaration of sophisticated investor status"}],"a":"B","e":"<p>Although the firm would need to be CFTC Part 30 exempt, if it were dealing directly with the US client, and would need to perform reconciliations as oftent as necessary, only the risk warning would be sent out to the US investor.<\/p>"},{"s":5,"n":48,"id":"1065084","q":"<p>A 3 month call option and a 3 month put option on the same stock have the same premium and the same strike price of $30. The current stock price is $31 and interest rates are 10% pa. An arbitrageur should:<\/p>","o":[{"l":"A","h":"Buy the call, sell the put and sell the stock"},{"l":"B","h":"Buy the call, sell the put and buy the stock"},{"l":"C","h":"Buy the put, sell the call and buy the stock"},{"l":"D","h":"Buy the put, sell the call and sell the stock"}],"a":"A","e":"<p>Using put call parity the stock should be equal to C - P + K / (1 + rt) This gives: 0 + 30 / 1.025 = 29.27 The stock is therefore expensive so the investor should sell the stock and buy the synthetic, which means buying the call and selling the put.<\/p>"},{"s":5,"n":49,"id":"1037148","q":"<p>Which of the following is true of equity traded options?<\/p>","o":[{"l":"A","h":"Options are claims on the assets of a company"},{"l":"B","h":"The value of an option at expiry could never be zero"},{"l":"C","h":"All options that are written are exercised"},{"l":"D","h":"A call option's exercise price can be above the share price"}],"a":"D","e":"<p>A call option can have a strike price above or below the cash price, this would make the option OTM and ITM respectively.<\/p>"},{"s":5,"n":50,"id":"1037070","q":"<p>An order to buy 25 long gilt contracts at £103.00, or lower, if the market was currently at £103.10 would be called:<\/p>","o":[{"l":"A","h":"A market-if-touched"},{"l":"B","h":"A stop order"},{"l":"C","h":"A limit order"},{"l":"D","h":"A contingent order"}],"a":"C","e":"<p>The order is to buy below the current market level, at £103.00 or better, i.e. a limit order. This cannot be a stop order as it would have to be to buy ABOVE the current market level, i.e. to limit the loss on your current short position. Market-if-touched orders work on the principle that if a given level is reached, a market order (i.e. 'at best') is activated.<\/p>"},{"s":5,"n":51,"id":"1052261","q":"<p>Which of the following increase cost-of-carry?<\/p>","o":[{"l":"A","h":"Interest rates decrease and the underlying increases in price"},{"l":"B","h":"Interest rates increase and the underlying increases in price"},{"l":"C","h":"Interest rates increase and the underlying decreases in price"},{"l":"D","h":"Interest rates decrease and the underlying decreases in price"}],"a":"B","e":"<p>Interest rates affect the cost-of-carry and represent the foregone interest if the asset was bought today. If interest rates rise, the cost-of-carry will rise. In relation to this, if the asset price rises, the cost of the foregone interest will also rise (as more money is spent).<\/p>"},{"s":5,"n":52,"id":"1017010","q":"<p>In which of the following instances would a trading member of an exchange give-up a trade to its clearing member?
