<\/p>","o":[{"l":"A","h":"If the member was trading on its own account"},{"l":"B","h":"If the member was a local"},{"l":"C","h":"If the member was a non-clearing member of the clearing house"},{"l":"D","h":"If the member was an individual clearing member"}],"a":"C","e":"<p>A firm will 'give-up' or allocate a trade to a clearing firm to clear on its behalf if it is a non-clearing member.<br/> If the firm was an individual clearing member, it would clear its own trades; and if it was a local, it is unlikely to be a clearing member - therefore 'if the member was a non-clearing member of the clearing house' is the best answer.<\/p>"},{"s":5,"n":53,"id":"1037053","q":"<p>Which of the following need not be disclosed to a retail client before executing a trade in a contingent liability transaction in relation to margin payments?<\/p>","o":[{"l":"A","h":"The circumstances in which margin is paid"},{"l":"B","h":"The form in which margin may be paid in"},{"l":"C","h":"Particulars of the steps the firm will take if the client fails to pay required margin and any other circumstances in which the firm may close out the client's position without prior disclosure"},{"l":"D","h":"A statement that initial margin is a requirement from the relevant clearing house"}],"a":"D","e":"<p>The FCA sets out very strict margin rules.<\/p>"},{"s":5,"n":54,"id":"1037059","q":"<p>A warrant on LME:<\/p>","o":[{"l":"A","h":"Gives right of possession to a specific lot of deliverable metal"},{"l":"B","h":"Is the name given to a long hedge"},{"l":"C","h":"Is the final settlement for cash-cleared LME contracts through SWORD"},{"l":"D","h":"Is the electronic transfer of cash within SWORD for physically delivered contracts"}],"a":"A","e":"<p>Ownership of warrants is used to prove ownership of deliverable metal.<\/p>"},{"s":5,"n":55,"id":"1040385","q":"<p>Which is the best description of an average strike option?<\/p>","o":[{"l":"A","h":"The strike price is set at commencement of the option to be the average of two rates"},{"l":"B","h":"The strike price is set at the expiration date to be the average of two prices"},{"l":"C","h":"The strike price is set at the expiration date to be the average rate of the underlying over the life of the option"},{"l":"D","h":"The strike price is set at expiration date based on the average of three prices at the end of the period"}],"a":"C","e":"<p>This is the best description of an average strike option, where the investor would look over the life of the option to assess the strike.<\/p>"},{"s":5,"n":56,"id":"1037152","q":"<p>Who benefits most from the passing of time?<\/p>","o":[{"l":"A","h":"Option writers"},{"l":"B","h":"Options holders"},{"l":"C","h":"Futures sellers"},{"l":"D","h":"Futures buyers"}],"a":"A","e":"<p>The passing of time erodes an option's time value and therefore decreases its premium. Therefore (all other factors remaining equal), a writer can sell an option today and buy it back later at a cheaper price, thus making a profit when closing the position out. The erosion of time value therefore benefits WRITERS of options.<\/p>"},{"s":5,"n":57,"id":"1040393","q":"<p>Understanding layering is important in relation to:<\/p>","o":[{"l":"A","h":"Financial crime"},{"l":"B","h":"Market risk"},{"l":"C","h":"Credit risk"},{"l":"D","h":"Operational risk"}],"a":"A","e":"<p>Layering is one of the three stages of money laundering - therefore financial crime is the best answer here.<br/> A strange question and very possibly a trial question.<\/p>"},{"s":5,"n":58,"id":"1040383","q":"<p>Which ONE of the following is TRUE?<\/p>","o":[{"l":"A","h":"The last trading day comes before the first notice day"},{"l":"B","h":"The first notice days and last notice day can be the same day"},{"l":"C","h":"The last notice day and last trading day are always the same day"},{"l":"D","h":"The delivery day always follows the last notice day"}],"a":"B","e":"<p>The first and last notice day can be different days, it will be the same day when there is only one notice day for the contract.<br/> For some contracts, like bonds futures, it is possible that delivery can occur on more than one day. Therefore the delivery day does not always have to follow the last notice day but could be any day in the delivery month.<\/p>"},{"s":5,"n":59,"id":"1037136","q":"<p>For what reason would you exercise a receiver option?<\/p>","o":[{"l":"A","h":"Because interest rates have risen so the option is in-the-money"},{"l":"B","h":"Because interest rates have risen so the option is out-of-the-money"},{"l":"C","h":"Because interest rates have dropped so the option is in-the-money"},{"l":"D","h":"Because interest rates have dropped so the option is out-of-the-money"}],"a":"C","e":"<p>A receiver of a swaption has the right to receive a fixed amount in return for paying floating. If interest rates drop them the option will become more in the money and it should be exercised on expiry.<\/p>"},{"s":5,"n":60,"id":"1037056","q":"<p>Which of the following is true regarding margining positions for equity options?<\/p>","o":[{"l":"A","h":"The initial margin decreases the closer the contract approaches expiry because of the spot month margin payments"},{"l":"B","h":"A vertical bear put spread is unlikely to be margined"},{"l":"C","h":"Intermonth spreads will not be margined as the gain on one contract offsets the loss on another"},{"l":"D","h":"Spot month charges will not be charged if the underlying is highly illiquid"}],"a":"B","e":"<p>The maximum loss on a vertical bear put spread is premium paid - premium received (the net initial debit). The maximum loss has therefore been paid up front and the position will not be margined.<\/p>"},{"s":5,"n":61,"id":"1017046","q":"<p>An investor buys a cash bond at 100. He writes a 104 strike call option for a premium of 1. The bond is trading at 106 at expiry. What is his percentage return?<\/p>","o":[{"l":"A","h":"4%"},{"l":"B","h":"5%"},{"l":"C","h":"6%"},{"l":"D","h":"7%"}],"a":"B","e":"<p>The overall cost of the trade is 99 (100 paid for the bond and 1 received when selling the call).<br/> At the end the option is exercised and the investor receives 104 for the bond (the strike price).<br/> Return = (104 - 99) / 99 = 5.05%<\/p>"},{"s":5,"n":62,"id":"1052264","q":"<p>All of the following could lead to an assignment notice being issued on an option, EXCEPT:<\/p>","o":[{"l":"A","h":"An option investor wishing to take a position in the underlying shares"},{"l":"B","h":"An option holder wishing to receive future dividends on the share"},{"l":"C","h":"An option investor wishing to deliver shares"},{"l":"D","h":"An option writer wishing to mitigate risk exposure"}],"a":"D","e":"<p>An option writer has no ability to exercise an option, so could not instigate the issuance of an assignment notice.<\/p>"},{"s":5,"n":63,"id":"1037126","q":"<p>Which of the following is associated with Net Liquidation Value (NLV)?<\/p>","o":[{"l":"A","h":"LME Aluminium warrants"},{"l":"B","h":"Brent Crude Delivery Range"},{"l":"C","h":"London Span margin"},{"l":"D","h":"ICE UCP system"}],"a":"C","e":"<p>Overall margin requirements for each member is calculated by London SPAN used by LCH.Clearnet and ICE Clear Europe. The net liquidation value is the possible close out cost of a defaulting member's position. The clearing house will use the initial margin to cover the cost of closing out the positions.<\/p>"},{"s":5,"n":64,"id":"1040402","q":"<p>Broker X and Broker Y trade a futures contract between themselves. They are both non-clearing members of the exchange. The contract is registered with ICE Clear. A few days later broker X defaults on his margin payments. Who is responsible for any losses?<\/p>","o":[{"l":"A","h":"The exchange"},{"l":"B","h":"The clearing house"},{"l":"C","h":"Broker X's bank"},{"l":"D","h":"The clearing member that cleared the trade"}],"a":"D","e":"<p>As Brokers X and Y are non-clearing members the trade would have to have been cleared by a clearing member. The clearing member would be responsible for any losses incurred in relation to margin.<\/p>"},{"s":5,"n":65,"id":"1040397","q":"<p>If a client has used up their credit-line with a broker, they can trade in which of the following circumstances?<\/p>","o":[{"l":"A","h":"At the start of the next month"},{"l":"B","h":"If they supply more collateral to the broker"},{"l":"C","h":"If the broker reduces the credit-line of other clients"},{"l":"D","h":"They cannot trade in any circumstances"}],"a":"B","e":"<p>If the investor supplies more collateral the credit line effectively becomes extended and trading can commence.<\/p>"},{"s":5,"n":66,"id":"1037095","q":"<p>Which of the following is true of a credit derivative?<\/p>","o":[{"l":"A","h":"It provides an investor with insurance that they can sell an equity at a pre-agreed price"},{"l":"B","h":"It provides an investor with insurance that they can buy a bond at a pre-agreed price"},{"l":"C","h":"It protects an investor against a bond receiving a credit downgrade"},{"l":"D","h":"It protects an investor from price rises in the bond market"}],"a":"C","e":"<p>Note: a credit default derivative would also protect an investor against a bond from defaulting on an interest payment.<\/p>"},{"s":5,"n":67,"id":"1053750","q":"<p>The relationship of the clearing house to a clearing member would be described as:<\/p>","o":[{"l":"A","h":"Always agent to principal"},{"l":"B","h":"Principal to off-exchange transactions of a clearing member"},{"l":"C","h":"Agent to non-clearing member give ups"},{"l":"D","h":"Always principal to principal"}],"a":"D","e":"<p>Through novation the clearing house becomes the buyer to the seller and seller to the buyer; therefore becoming principal to both sides.<\/p>"},{"s":5,"n":68,"id":"1040373","q":"<p>If an investor wishes to hedge against small price movements they should ensure their position has:<\/p>","o":[{"l":"A","h":"Vega = 1"},{"l":"B","h":"Delta = 1"},{"l":"C","h":"Vega = 0"},{"l":"D","h":"Delta = 0"}],"a":"D","e":"<p>A delta-neutral position or one where the delta is 0 will be hedged against small price movements. Delta hedges do not work effectively for large price movements.<\/p>"},{"s":5,"n":69,"id":"1037091","q":"<p>Which of the following are taken into account before deciding to carry out a cash and carry arbitrage trade?<\/p><p class=\"rom\"><b>I<\/b> Time to expiry<\/p><p class=\"rom\"><b>II<\/b> The price of the future<\/p><p class=\"rom\"><b>III<\/b> Interest rates<\/p><p class=\"rom\"><b>IV<\/b> The spot price<\/p>","o":[{"l":"A","h":"I, II and IV"},{"l":"B","h":"II, III and IV"},{"l":"C","h":"I, II, III and IV"},{"l":"D","h":"I, III and IV"}],"a":"C","e":"<p>All would be taken into account as the time to expiry and interest rates form part of the costs of carry contained within the price of a future.<\/p>"},{"s":5,"n":70,"id":"1037125","q":"<p>Calculate the fair value of the following futures contract:<\/p><ul> <li><p>60 days to expiry<\/p><\/li> <li><p>Cash price of the asset is £400<\/p><\/li> <li><p>Short-term interest rate is 2.5% per annum<\/p><\/li> <li><p>Estimated storage costs are 0.75% per annum<\/p><\/li> <\/ul>","o":[{"l":"A","h":"£401.56"},{"l":"B","h":"£402.13"},{"l":"C","h":"£403.02"},{"l":"D","h":"£401.28"}],"a":"B","e":"<p>Fair value= Cash price of the contract + Interest + Storage costs Interest = £400 x 2.5% x (60/365) = 1.64 Storage = £400 x .75% x (60/365) = .49 FV = £400 + 1.64 + .49 FV = 402.13<\/p>"},{"s":5,"n":71,"id":"1055515","q":"<p>Which of the following will cause an increase in price of emission rights?<\/p>","o":[{"l":"A","h":"The announcement in the fall in the oil reserves of a company"},{"l":"B","h":"Invention of a new greener power station"},{"l":"C","h":"Pollution targets are reduced based on regulations"},{"l":"D","h":"A reduction in demand for oil"}],"a":"C","e":"<p>If the overall pollution targets are reduced, that means companies will have smaller limit on the amount of pollutants that can be emitted reducing the number of credits that can be bought and sold. This will cause an increase in the price. All other answers will cause a decrease in the price.<\/p>"},{"s":5,"n":72,"id":"1040390","q":"<p>How is the payment calculated on a non-deliverable forward?<\/p>","o":[{"l":"A","h":"The rate at the start of the contract is compared with the spot rate at the end of the contract"},{"l":"B","h":"The forward rate agreed for the contract is compared to the spot rate at the end of the contract"},{"l":"C","h":"The forward rate at the end of the contract is compared with the spot rate at the end of the contract"},{"l":"D","h":"The spot rate at the end of the contract is compared with the US dollar rate at the end of the contract"}],"a":"B","e":"<p>A non-deliverable forward (NDF) is an outright, cash settled forward contract on a non-convertible or thinly traded foreign currency. The contract is settled in a prime currency such as dollars or euros based on the difference between the contracted NDF price or rate and the prevailing spot price or rate on an agreed notional amount.<br/> Therefore we would settle this like a contract for difference (CFD), by looking at the agreed price of the contract and comparing it with the spot price (or EDSP).<\/p>"},{"s":5,"n":73,"id":"1037082","q":"<p>What actions is a non-clearing dealer member of an exchange permitted to do?<\/p>","o":[{"l":"A","h":"Trade and clear for themselves and their clients"},{"l":"B","h":"Trade and clear for themselves only"},{"l":"C","h":"Trade for themselves and their clients"},{"l":"D","h":"Trade for themselves only"}],"a":"D","e":"<p>A dealer is permitted to deal in principal only - brokers can act as agent for their clients.<\/p>"},{"s":5,"n":74,"id":"1044812","q":"<p>Which of the following is a positive feature of over-the-counter products over exchange-traded products?<\/p>","o":[{"l":"A","h":"Standardised products make them fungible"},{"l":"B","h":"Flexibility allows for more accurate hedging"},{"l":"C","h":"Trade reporting enhances price transparency"},{"l":"D","h":"Liquidity is optimised through centralised market places"}],"a":"B","e":"<p>All the others are features of exchange-traded products.<\/p>"},{"s":5,"n":75,"id":"1065106","q":"<p>A fund manager who has a £10m nominal position in the cheapest to deliver long UK Government bonds is concerned about market movements and wishes to hedge. <br/> How many future contracts would be required if the nominal size of the contract is £100,000 and the cheapest to deliver bond has a price factor of 1.0896476?<\/p>","o":[{"l":"A","h":"Buy 109 contracts"},{"l":"B","h":"Sell 109 contracts"},{"l":"C","h":"Buy 1090 contracts"},{"l":"D","h":"Sell 1090 contracts"}],"a":"B","e":"<p>As the fund manager has a long position to hedge they would need to sell contracts.<br/> (£10,000,000 / £100,000) x 1.0896476 = 108.96476 rounded to 109 contracts.<\/p>"},{"s":5,"n":76,"id":"1037143","q":"<p>Which ONE of the following applies to a writer of an option on a future?<\/p>","o":[{"l":"A","h":"Receives a residual credit based on the net liquidation value (NLV) of the option"},{"l":"B","h":"Receives the full premium less any initial margin"},{"l":"C","h":"Receives premium on day of trade"},{"l":"D","h":"Receives full premium on expiry"}],"a":"D","e":"<p>An option on a future has the premium paid on expiry.<\/p>"},{"s":5,"n":77,"id":"1037097","q":"<p>Put the following in the order of resources the ICE Clear Europe will use in the event of a clearing member defaulting:<\/p><p class=\"rom\"><b>I<\/b> Margin<\/p><p class=\"rom\"><b>II<\/b> £200m Lloyds insurance<\/p><p class=\"rom\"><b>III<\/b> Other members' contributions into the default fund<\/p><p class=\"rom\"><b>IV<\/b> Clearing member's contribution into the Members' Default Fund<\/p>","o":[{"l":"A","h":"I, II, III, IV"},{"l":"B","h":"II, I, III, IV"},{"l":"C","h":"l, IV, III, Il"},{"l":"D","h":"IV, III, II, I"}],"a":"C","e":"<p>The insurance fund is not used until the clearing house has used the defaulting member's margin payments, followed by cash calls on other clearing members, followed by the member's default fund.<\/p>"},{"s":5,"n":78,"id":"1037064","q":"<p>If interest rates rise, what is the likely effect on equity option premiums?<\/p>","o":[{"l":"A","h":"Call prices rise and put prices remain unchanged"},{"l":"B","h":"Call prices rise and put prices fall"},{"l":"C","h":"Put prices rise and call prices remain unchanged"},{"l":"D","h":"Put prices rise and call prices fall"}],"a":"B","e":"<p>If interest rates rise investors will gain exposure to share prices through buying call options rather than buying the underlying share. As a result, the demand for call options increases and premiums rise. The opposite is true for puts.<\/p>"},{"s":5,"n":79,"id":"1037071","q":"<p>Why would an investor buy a receiver swaption?<\/p><p class=\"rom\"><b>I<\/b> To hedge against a rise in interest rates<\/p><p class=\"rom\"><b>II<\/b> To make a quick profit if interest rates rise<\/p><p class=\"rom\"><b>III<\/b> To hedge against a fall in interest rates<\/p><p class=\"rom\"><b>IV<\/b> To make a quick profit if interest rates fall<\/p>","o":[{"l":"A","h":"I and IV"},{"l":"B","h":"II and III"},{"l":"C","h":"III and IV"},{"l":"D","h":"II and IV"}],"a":"C","e":"<p>The buyer of a receiver swaption has the right to receive a fixed rate of interest and pay a variable rate. The position would be used to hedge against or profit from a fall in interest rates.<\/p>"},{"s":5,"n":80,"id":"1037067","q":"<p>Helena wants to hedge her holding of 3,000 shares in X plc by selling single stock futures on an exchange. What profit does she make on the futures position if she opens her position at 18.5 and closes out at 17 pence?<\/p>","o":[{"l":"A","h":"£35"},{"l":"B","h":"£40"},{"l":"C","h":"£45"},{"l":"D","h":"£50"}],"a":"C","e":"<p>Profit per share = 18.5 - 17 = 1.5p. Overall profit = 1.5p x 3,000 shares = £45<\/p>"},{"s":5,"n":81,"id":"1072253","q":"<p>In relation to SPAN:<\/p>","o":[{"l":"A","h":"Positions are allowed to be offset within a portfolio"},{"l":"B","h":"Inter-month charges are subtracted from scanning risk"},{"l":"C","h":"Each position is individually assessed for risk"},{"l":"D","h":"Inter-commodity credits are added to scanning risk"}],"a":"A","e":"<p>SPAN groups all derivatives contracts by assets and calculates the risk of each portfolio and so the contracts can be netted off. Inter-month charges are added to scanning risk and inter-commodity credits are subtracted.<\/p>"},{"s":5,"n":82,"id":"1037149","q":"<p>Kate wishes to carry out a basis trade on the gilt future she has just sold. She therefore must:<\/p>","o":[{"l":"A","h":"Sell gilts on the LSE"},{"l":"B","h":"Buy gilts on the LSE"},{"l":"C","h":"Buy gilt call options on ICE Futures Europe"},{"l":"D","h":"Buy T-bonds"}],"a":"B","e":"<p>A basis trade is a trade between the cash price and the futures price. If an investor believes that basis will narrow, then they should buy cash and sell futures (as is the case in the question). If you think basis will widen then you would sell cash and buy futures.<\/p>"},{"s":5,"n":83,"id":"1037054","q":"<p>At which of the following points would the following trade breakeven?<\/p><ul> <li><p>Sell 4,300 call at a premium of 70 #<\/p><\/li> <li><p>Sell 4,200 put at a premium of 20<\/p><\/li> <\/ul>","o":[{"l":"A","h":"4,370 and 4,280"},{"l":"B","h":"4,110 and 4,390"},{"l":"C","h":"4,210 and 4,390"},{"l":"D","h":"4,320 and 4,380"}],"a":"B","e":"<p>The trade represents a short strangle. Downside breakeven = 4,200 - 90 = 4,110. Upside breakeven = 4,300 + 90 = 4,390<\/p>"},{"s":5,"n":84,"id":"1065082","q":"<p>Since 1984 the CME has had a close relationship with which of the following?<\/p>","o":[{"l":"A","h":"NYSE"},{"l":"B","h":"TSE"},{"l":"C","h":"SGX"},{"l":"D","h":"CBOT"}],"a":"C","e":"<p>This is the mutual offset agreement between the two exchanges.<\/p>"},{"s":5,"n":85,"id":"1037130","q":"<p>Which of the following describes arbitrage relating to the principle of put-call parity?<\/p>","o":[{"l":"A","h":"Exploiting a mispricing between the cash value of an asset together with the cost of carry and the trading value of an option"},{"l":"B","h":"A combination of an underlying asset and positions in options"},{"l":"C","h":"A combination of positions in the underlying asset and futures"},{"l":"D","h":"Exploiting a mispricing between the cash value of an asset together with the cost of carry and the trading value of a future"}],"a":"B","e":"<p>Put/call parity = combining a long call with a short put (or alternatively a long put with a short call) should give the same approximate result as going long (or short) the underlying asset.<\/p>"},{"s":5,"n":86,"id":"1040395","q":"<p>Other than following the initial trade, when else can novation occur?<\/p>","o":[{"l":"A","h":"Every day as part of the variation margin system"},{"l":"B","h":"When a clearing member takes on the open position of another member"},{"l":"C","h":"At delivery"},{"l":"D","h":"It cannot occur more than once"}],"a":"B","e":"<p>Novation is a process that enables the legal transfer from one participant of an existing contract to another. Therefore if a clearing member takes on the position of another member the contract will be reregistered and so novation we have occurred.<br/> A tough question.<\/p>"},{"s":5,"n":87,"id":"1065127","q":"<p>Which of the following would create a synthetic short call position?<\/p>","o":[{"l":"A","h":"Long future, long put"},{"l":"B","h":"Long future, short put"},{"l":"C","h":"Short future, short put"},{"l":"D","h":"Short future, long put"}],"a":"C","e":"<p>Synthetic short call = sell a future and sell a put. (Effectively a short call position.)<\/p>"},{"s":5,"n":88,"id":"1040387","q":"<p>Which of the following is the best description of an American style payer swaption?<\/p>","o":[{"l":"A","h":"The buyer has the obligation to enter into a swap from the commencement date to the expiry date and pay a fixed rate of interest"},{"l":"B","h":"The buyer has the obligation to enter into a swap from the commencement date to the expiry date and pay a floating rate of interest"},{"l":"C","h":"The buyer has the right to enter into a swap from the commencement date to the expiry date and pay a floating rate of interest"},{"l":"D","h":"The buyer has the right to enter into a swap from the commencement date to the expiry date and pay a fixed rate of interest"}],"a":"D","e":"<p>An American style payer option can be entered into at any time from the commencement date to the expiry date.<br/> The payer (or holder) would pay fixed and receive a floating rate of interest.<\/p>"},{"s":5,"n":89,"id":"1037103","q":"<p>Which of the following best describes what happens on settlement day?<\/p>","o":[{"l":"A","h":"The buyer, after giving appropriate notice, makes delivery of the underlying"},{"l":"B","h":"The seller, after giving appropriate notice, makes delivery of the underlying"},{"l":"C","h":"The seller, without giving appropriate notice, makes delivery of the underlying"},{"l":"D","h":"The buyer, without giving appropriate notice, makes delivery of the underlying"}],"a":"B","e":"<p>The seller must give notice according to the contract specifications to the clearing house which then chooses a long position to deliver to.<\/p>"},{"s":5,"n":90,"id":"1040391","q":"<p>Which of the following measures the sensitivity of delta to a change in the value of the underlying?<\/p>","o":[{"l":"A","h":"Theta"},{"l":"B","h":"Delta"},{"l":"C","h":"Gamma"},{"l":"D","h":"Vega"}],"a":"C","e":"<p>This is a description of gamma which is the rate of change or sensitivity of delta.<\/p>"},{"s":5,"n":91,"id":"1052265","q":"<p>Which benchmark interest rate is quoted in more than one currency?<\/p>","o":[{"l":"A","h":"LIBOR"},{"l":"B","h":"Fed funds"},{"l":"C","h":"Prime"},{"l":"D","h":"EURIBOR"}],"a":"A","e":"<p>Every day at 11.00am in London, ICE Benchmark Administration Ltd publishes LIBOR (the London interbank offered rate), An average of the rates offered by a contributing panel of banks for each major currency for varying periods of time. LIBOR is currently quoted for five major currencies.<\/p>"},{"s":5,"n":92,"id":"1037120","q":"<p>Spot month margin is:<\/p>","o":[{"l":"A","h":"Final margin payable in the delivery month"},{"l":"B","h":"Balance of margin charged at the end of each month"},{"l":"C","h":"Additional margin to minimise any volatility near expiry date"},{"l":"D","h":"Refund of margin in the delivery month"}],"a":"C","e":"<p>Volatility may increase as a contract nears its expiry date. The clearing house tries to minimise speculative and delivery pressures by increasing initial margin. This additional initial margin amount is known as spot month margin.<\/p>"},{"s":5,"n":93,"id":"1037112","q":"<p>Which of the following best describes liquidity?<\/p>","o":[{"l":"A","h":"The facility with which a product can be traded"},{"l":"B","h":"An upward sloping yield curve"},{"l":"C","h":"The difficulty of closing certain positions"},{"l":"D","h":"More buyers than sellers in a given market"}],"a":"A","e":"<p>Liquidity describes the ease (or 'facility') with which a product can be traded. Note that B is a reference to liquidity PREFERENCE.<\/p>"},{"s":5,"n":94,"id":"1037119","q":"<p>If an investor expected the spread in a backwardation market between futures traded on the same underlying asset to narrow, what action would they likely take?<\/p>","o":[{"l":"A","h":"Buy a future"},{"l":"B","h":"Sell a future"},{"l":"C","h":"Buy the spread"},{"l":"D","h":"Sell the spread"}],"a":"D","e":"<p>A narrowing spread in a backwardation market. An investor would be best suited to sell the spread.<\/p>"},{"s":5,"n":95,"id":"1065121","q":"<p>Which of the following regulatory requirements would allow a US client to place trades on a US exchange via a non-US firm?<\/p>","o":[{"l":"A","h":"CFTC Part 30"},{"l":"B","h":"ESMA authorisation"},{"l":"C","h":"CFTC Part 30 exemption"},{"l":"D","h":"US authorisation"}],"a":"D","e":"<p>Every firm or individual that conducts business with the public on any US futures exchange is required to be registered with the CF TC and be a member of the NFA.<\/p>"},{"s":5,"n":96,"id":"1037089","q":"<p>Which of the following is true with regard to crude basis?<\/p>","o":[{"l":"A","h":"It is always negative"},{"l":"B","h":"It is always positive"},{"l":"C","h":"It is linear"},{"l":"D","h":"It is non-linear"}],"a":"D","e":"<p>Basis, sometimes called 'crude basis' is the relationship between the cash price and the futures price. It is usually negative (contango) but may be positive (backwardation). Since the price of a future is not a direct function of price of the underlying, the relationship is non-linear.<\/p>"},{"s":5,"n":97,"id":"1053733","q":"<p>A country introduces a 5% export tariff on cocoa in order to ensure domestic supply. The likely impact would be:<\/p>","o":[{"l":"A","h":"Global cash prices and global futures prices would both rise"},{"l":"B","h":"Global cash prices and global futures prices would both fall"},{"l":"C","h":"Global cash prices would rise and global futures prices would fall"},{"l":"D","h":"Global cash prices would fall and global futures prices would rise"}],"a":"A","e":"<p>An export tariff will restrict supply both in the short term, forcing cash prices up as well as into the long term impact future prices.<br/> Also, as the future price is calculated as cash price + cost of carry, any increase in the cash price will have an immediate impact on future prices.<\/p>"},{"s":5,"n":98,"id":"1072250","q":"<p>An investor buys a 270p put for a premium of 30p and sells a 300p put for a premium of 40p. What is the maximum loss in this position?<\/p>","o":[{"l":"A","h":"10p"},{"l":"B","h":"20p"},{"l":"C","h":"30p"},{"l":"D","h":"40p"}],"a":"B","e":"<p>The investor has created a bull put spread which is a net initial credit trade. They pay 30 and receive 40p so the net credit is 10p which is the maximum profit. <br/> The difference between the two strikes will equal maximum profit + maximum loss: 300 - 270 = 10p + maximum loss So maximum loss = 30p - 10p = 20p<\/p>"},{"s":5,"n":99,"id":"1040376","q":"<p>An investor buys a put at 320p and pays a premium of 18p on ABC Ltd. ABC Ltd was trading at 305p. Two days later, ABC Ltd enters administration and eventually liquidation. The shares ultimately settle at a nil value. What is the investors profit or loss?<\/p>","o":[{"l":"A","h":"Loss of 18p"},{"l":"B","h":"Loss of 302p"},{"l":"C","h":"Profit of 18p"},{"l":"D","h":"Profit of 302p"}],"a":"D","e":"<p>As the investor bought a put they would have made a profit.<br/> The profit on the put is the strike - premium as the share was worthless.<br/> So 320 -18p = 302p<\/p>"},{"s":5,"n":100,"id":"1037084","q":"<p>What are the daily movements paid on a futures position on an exchange called?<\/p>","o":[{"l":"A","h":"Initial margin"},{"l":"B","h":"Intrinsic value"},{"l":"C","h":"Variation margin"},{"l":"D","h":"Time value"}],"a":"C","e":"<p>Initial margin - an initial security deposit with an exchange.<br/> Variation margin - additional deposits on a DAILY basis as the value of the position moves.<\/p>"}]</script>
<script type="application/json" id="bdata">[{"s":1,"n":1,"id":"Chapter 1, Section 4","q":"<p>One of the differences between a contract for difference and a spread bet is that a:<\/p>","o":[{"l":"A","h":"spread bet does not have a specific maturity"},{"l":"B","h":"contract for difference has a single price differential, while a spread bet has at least four"},{"l":"C","h":"contract for difference is legally defined as gambling"},{"l":"D","h":"contract for difference does not have a specific maturity"}],"a":"D","e":"<p><strong>Réponse : D<\/strong> (Chapter 1, Section 4)<\/p><p>Contracts for difference do not have a fixed maturity.<\/p>"},{"s":2,"n":2,"id":"Chapter 2, Section 6.2","q":"<p>A speculator is anticipating an increase in lead prices and purchases 30 contracts for delivery in three months’ time at $2,350 per tonne. The contract size is 25 tonnes. At expiry, the position is closed out when the price has risen to $2375 per tonne. What is the profit?<\/p>","o":[{"l":"A","h":"$6,250"},{"l":"B","h":"$7,500"},{"l":"C","h":"$12,500"},{"l":"D","h":"$18,750"}],"a":"D","e":"<p><strong>Réponse : D<\/strong> (Chapter 2, Section 6.2)<\/p><p>The speculator has made a profit of $25 per tonne after buying at $2,350 and selling at $2,375. The total profit = $25 x 25 tonnes x 30 contracts = $18,750.<\/p>"},{"s":6,"n":3,"id":"Chapter 6, Section 1.3","q":"<p>How are members’ contributions to the member default fund determined?<\/p>","o":[{"l":"A","h":"According to the volume of clearing activity"},{"l":"B","h":"As an annual flat fee"},{"l":"C","h":"As a percentage of the firm’s fees"},{"l":"D","h":"According to the status of the firm"}],"a":"A","e":"<p><strong>Réponse : A<\/strong> (Chapter 6, Section 1.3)<\/p><p>Every clearing member contributes in cash to the member default fund according to the volume of its clearing activities.<\/p>"},{"s":1,"n":4,"id":"Chapter 1, Introduction","q":"<p>A shipping company is concerned that rising fuel prices will push up its costs and reduce profits. What should the company consider doing?<\/p>","o":[{"l":"A","h":"Sell an oil futures call"},{"l":"B","h":"Sell oil futures"},{"l":"C","h":"Go long oil futures"},{"l":"D","h":"Buy an oil futures put"}],"a":"C","e":"<p><strong>Réponse : C<\/strong> (Chapter 1, Introduction)<\/p><p>This is a hedge: rising oil prices mean rising fuel prices. The company should therefore go long oil futures, locking into the cheaper oil price.<\/p>"},{"s":7,"n":5,"id":"Chapter 7, Section 2.5","q":"<p>The automatic exercise by Intercontinental Exchange (ICE) Clear Europe of ICE Futures options is prevented by filing:<\/p>","o":[{"l":"A","h":"an assignment notice"},{"l":"B","h":"a give-up notice"},{"l":"C","h":"a registration notice"},{"l":"D","h":"a suppression notice"}],"a":"D","e":"<p><strong>Réponse : D<\/strong> (Chapter 7, Section 2.5)<\/p><p>If an ICE Futures option is not to be automatically exercised by ICE Clear Europe, a suppression notice must be filed.<\/p>"},{"s":9,"n":6,"id":"Chapter 9, Section 2.4","q":"<p>Under the Financial Conduct Authority’s (FCA’s) Conduct of Business (COBS) rules, a firm’s customers are defined as those clients:<\/p>","o":[{"l":"A","h":"that are considered to be retail clients only"},{"l":"B","h":"that are considered to have a limited understanding of the markets"},{"l":"C","h":"that are considered to be retail and professional clients, but not eligible counterparties"},{"l":"D","h":"with assets of less than £1 million, no matter what their understanding of the market"}],"a":"C","e":"<p><strong>Réponse : C<\/strong> (Chapter 9, Section 2.4)<\/p><p>The FCA’s COBS rules define a client as someone to whom a firm provides, intends to provide, or has provided a service in the course of carrying on a regulated activity; and, in the case of MiFID or equivalent third country business, anything which is an ancillary service. For COBS, this does not include eligible counterparties, although for the Client Assets Sourcebook (CASS) it means all clients.<\/p>"},{"s":1,"n":7,"id":"Chapter 1, Section 2.1","q":"<p>Which of the following best describes the contract size for a futures contract?<\/p>","o":[{"l":"A","h":"A variable quantity of the underlying negotiated with the futures exchange"},{"l":"B","h":"A standardised quantity of the underlying set by the futures exchange"},{"l":"C","h":"A standardised quantity of the underlying set by the buyer"},{"l":"D","h":"The price of an agreed quantity of the underlying set as standard by the futures exchange"}],"a":"B","e":"<p><strong>Réponse : B<\/strong> (Chapter 1, Section 2.1)<\/p><p>The futures exchange sets contract terms at specific quantities of the underlying, so investors can buy multiples of that amount but not fractions – investors cannot buy part of a contract.<\/p>"},{"s":4,"n":8,"id":"Chapter 4, Section 4.1.1","q":"<p>A call option has a strike price of £4. If the share is currently trading at £3.85, what is the intrinsic value of this option today?<\/p>","o":[{"l":"A","h":"–15p"},{"l":"B","h":"Nil"},{"l":"C","h":"5p"},{"l":"D","h":"20p"}],"a":"B","e":"<p><strong>Réponse : B<\/strong> (Chapter 4, Section 4.1.1)<\/p><p>The intrinsic value is the difference between the current share price and the strike price, but only if that is a positive figure. The intrinsic value is zero.<\/p>"},{"s":2,"n":9,"id":"Chapter 2, Section 5.2.1","q":"<p>Which of the following is a distinctive feature of cumulative preference shares?<\/p>","o":[{"l":"A","h":"Dividends are paid before other preference shares"},{"l":"B","h":"Unpaid dividends from previous years must be paid before any dividends on ordinary shares"},{"l":"C","h":"Dividends are accumulated and paid once every two years"},{"l":"D","h":"Dividends received are equal to the cumulative dividends paid on other types of preference shares"}],"a":"B","e":"<p><strong>Réponse : B<\/strong> (Chapter 2, Section 5.2.1)<\/p><p>A cumulative preference shareholder will not only be paid this year’s dividend before any ordinary shareholders’ dividends, but also any unpaid dividends from previous years.<\/p>"},{"s":1,"n":10,"id":"Chapter 1, Section 5.4","q":"<p>The type of swap that allows an investor to exchange the returns on an equity-based investment for the return on another equity-based investment is known as:<\/p>","o":[{"l":"A","h":"a mark to market swap"},{"l":"B","h":"an equity swaption"},{"l":"C","h":"a commodity/equity swap"},{"l":"D","h":"a volatility swap"}],"a":"D","e":"<p><strong>Réponse : D<\/strong> (Chapter 1, Section 5.4)<\/p><p>Volatility or equity swaps are the most popular method of switching the returns on equity or equity index-based investments.<\/p>"},{"s":1,"n":11,"id":"Chapter 1, Section 2","q":"<p>An investor has purchased a cocoa futures option on ICE that can be exercised at any time.<\/p><p>What kind of option do they have?<\/p>","o":[{"l":"A","h":"American"},{"l":"B","h":"Asian"},{"l":"C","h":"European"},{"l":"D","h":"Exotic"}],"a":"A","e":"<p><strong>Réponse : A<\/strong> (Chapter 1, Section 2)<\/p><p>An American option may be exercised at any time. Cocoa futures options on ICE are American-style.<\/p>"},{"s":8,"n":12,"id":"Chapter 8, Section 6.2","q":"<p>If you sell a straddle, what are you seeking to profit from?<\/p>","o":[{"l":"A","h":"Time value"},{"l":"B","h":"Decreasing volatility"},{"l":"C","h":"Increasing volatility"},{"l":"D","h":"A rise in the price of the underlying"}],"a":"B","e":"<p><strong>Réponse : B<\/strong> (Chapter 8, Section 6.2)<\/p><p>Straddles are volatility trades, and an investor selling a straddle will profit if the underlying price is stable.<\/p>"},{"s":5,"n":13,"id":"Chapter 5, Section 5.2","q":"<p>One of the reasons why a bank might apply a haircut to the collateral that a client has deposited with them is:<\/p>","o":[{"l":"A","h":"regulatory requirements that apply to certain types of derivative contracts"},{"l":"B","h":"exchange-based regulations that apply to all clearing members"},{"l":"C","h":"protection from movements in the market"},{"l":"D","h":"provision for the client to exercise any options"}],"a":"C","e":"<p><strong>Réponse : C<\/strong> (Chapter 5, Section 5.2)<\/p><p>A haircut is applied to any type of collateral, to ensure that the broker/bank is fully covered as the value of the collateral changes. Therefore the more volatile the collateral, the larger the haircut.<\/p>"},{"s":4,"n":14,"id":"Chapter 4, Section 3.7.2","q":"<p>If a futures contract is trading below its fair value, what strategy will an arbitrageur use?<\/p>","o":[{"l":"A","h":"Spread"},{"l":"B","h":"Cash and carry arbitrage"},{"l":"C","h":"Reverse cash and carry arbitrage"},{"l":"D","h":"Reversal"}],"a":"C","e":"<p><strong>Réponse : C<\/strong> (Chapter 4, Section 3.7.2)<\/p><p>He will buy the future as it is relatively cheap and sell the cash asset – a reverse cash and carry arbitrage.<\/p>"},{"s":6,"n":15,"id":"Chapter 6, Section 1.3","q":"<p>A member default fund is funded by:<\/p>","o":[{"l":"A","h":"bank guarantees"},{"l":"B","h":"cash contributions"},{"l":"C","h":"margin deposits"},{"l":"D","h":"collateral deposits"}],"a":"B","e":"<p><strong>Réponse : B<\/strong> (Chapter 6, Section 1.3)<\/p><p>Every clearing member contributes in cash to the member default fund according to the volume of their clearing activities.<\/p>"},{"s":8,"n":16,"id":"Chapter 8, Section 4","q":"<p>Which of these options will best hedge a short underlying position?<\/p>","o":[{"l":"A","h":"A short future"},{"l":"B","h":"A long, deep-in-the-money put"},{"l":"C","h":"Two long at-the-money puts"},{"l":"D","h":"Two long at-the-money calls"}],"a":"D","e":"<p><strong>Réponse : D<\/strong> (Chapter 8, Section 4)<\/p><p>A short underlying position has a delta of –1, so can be hedged by two long at-the-money (ATM) calls (+0.5 x 2 = +1).<\/p>"},{"s":5,"n":17,"id":"Chapter 5, Section 5, Chapter 9, Section 3.2 and Chapter 6, Section 1","q":"<p>Which of the following best describes the roles of ISDA and EMIR in relation to OTC derivatives markets?<\/p>","o":[{"l":"A","h":"ISDA – requiring OTC options to be cleared centrally on exchanges EMIR – to standardise all documentation for European OTC derivatives contracts"},{"l":"B","h":"ISDA – all OTC derivatives contracts must be regularly marked-to-market EMIR – all OTC derivatives trades must be backed by sufficient capital from the two counterparties"},{"l":"C","h":"ISDA – sets out a list of which types of OTC derivatives contracts can be traded EMIR – creates a framework for firms in each country to report their trades to their respective domestic central bank"},{"l":"D","h":"ISDA – to standardise the terms and documentation used in OTC derivatives trades EMIR – requiring OTC derivatives trades to be reported and cleared centrally via a trade repository and central counterparty (CCP), respectively"}],"a":"D","e":"<p><strong>Réponse : D<\/strong> (Chapter 5, Section 5, Chapter 9, Section 3.2 and Chapter 6, Section 1)<\/p><p>The International Swaps and Derivatives Association (ISDA)’s key role was introducing standardised documentation to support OTC product trading. The European Market Infrastructure Regulation (EMIR) attempts to improve transparency and market stability and therefore introduced requirements for reporting OTC derivatives trades to data repositories for wide distribution and requiring OTC trades to be centrally cleared to reduce counterparty risk.<\/p>"},{"s":3,"n":18,"id":"Chapter 3, Section 2.2","q":"<p>An investor is long a coffee future at £17 a tonne and ideally wants to make a profit of at least £10 and limit any loss to £7. What instructions should be given to the dealer?<\/p>","o":[{"l":"A","h":"Sell at limit £27, buy at £10 stop"},{"l":"B","h":"Sell at limit £10, sell at £7 stop"},{"l":"C","h":"Sell at limit £10, buy at £7 stop"},{"l":"D","h":"Sell at limit £27, sell at £10 stop"}],"a":"D","e":"<p><strong>Réponse : D<\/strong> (Chapter 3, Section 2.2)<\/p><p>‘Sell at £27 limit’ is an instruction to sell at no less than that figure, and ‘sell at £10 stop’ indicates that the investor wants to sell as soon as the price goes to or drops below £10.<\/p>"},{"s":2,"n":19,"id":"Chapter 2, Section 2.5","q":"<p>When do UK Treasury bills typically mature?<\/p>","o":[{"l":"A","h":"15 days"},{"l":"B","h":"31 days"},{"l":"C","h":"91 days"},{"l":"D","h":"121 days"}],"a":"C","e":"<p><strong>Réponse : C<\/strong> (Chapter 2, Section 2.5)<\/p><p>UK Treasury bills are issued by the Debt Management Office (DMO) and have a maturity of 91 days.<\/p>"},{"s":2,"n":20,"id":"Chapter 2, Section 6.1","q":"<p>Who has the choice of where to deliver soft commodity products?<\/p>","o":[{"l":"A","h":"The buyer"},{"l":"B","h":"The clearing house"},{"l":"C","h":"The exchange"},{"l":"D","h":"The seller"}],"a":"D","e":"<p><strong>Réponse : D<\/strong> (Chapter 2, Section 6.1)<\/p><p>For soft commodity products, the sellers choose where to deliver based on the exchange’s specified delivery points.<\/p>"},{"s":1,"n":21,"id":"Chapter 1, Section 2.2","q":"<p>What type of option gives the holder the right to sell?<\/p>","o":[{"l":"A","h":"Put option"},{"l":"B","h":"Call option"},{"l":"C","h":"Long option"},{"l":"D","h":"Short option"}],"a":"A","e":"<p><strong>Réponse : A<\/strong> (Chapter 1, Section 2.2)<\/p><p>A put option is an option to sell an asset for a specified price at a specified date or range of dates.<\/p>"},{"s":4,"n":22,"id":"Chapter 4, Section 4.1","q":"<p>Which of the following is the option premium?<\/p>","o":[{"l":"A","h":"Strike price minus time value"},{"l":"B","h":"Intrinsic value plus strike price"},{"l":"C","h":"Time value plus strike price"},{"l":"D","h":"Intrinsic value plus time value"}],"a":"D","e":"<p><strong>Réponse : D<\/strong> (Chapter 4, Section 4.1)<\/p><p>The price paid for an option is made up of two parts, how much in-the-money the option is (intrinsic value) and expectation that it will move more into-the-money before expiry (time value).<\/p>"},{"s":6,"n":23,"id":"Chapter 6, Section 4","q":"<p>Which of the following would be accepted as collateral by a broker to take against a written GlaxoSmithKline put option?<\/p>","o":[{"l":"A","h":"GlaxoSmithKline shares"},{"l":"B","h":"Undated bonds"},{"l":"C","h":"Certificate of deposit"},{"l":"D","h":"Swiss bonds"}],"a":"C","e":"<p><strong>Réponse : C<\/strong> (Chapter 6, Section 4)<\/p><p>The writer of a GlaxoSmithKline put option has an obligation to take delivery of the shares and therefore needs cash to pay for those shares. If the put is exercised, it will be because the value of GSK shares is falling. Neither undated bonds nor Swiss bonds are acceptable.<\/p>"},{"s":8,"n":24,"id":"Chapter 8, Section 6.1","q":"<p>What action will an investor take if they expect volatility to rise?<\/p>","o":[{"l":"A","h":"Sell a call and buy a call on the same underlying"},{"l":"B","h":"Sell a put and buy a put on the same underlying"},{"l":"C","h":"Sell a call and sell a put on the same underlying"},{"l":"D","h":"Buy a call and buy a put on the same underlying"}],"a":"D","e":"<p><strong>Réponse : D<\/strong> (Chapter 8, Section 6.1)<\/p><p>Calls and puts are bought in combination if volatility is expected to rise, creating a long straddle or long strangle.<\/p>"},{"s":7,"n":25,"id":"Chapter 7, Section 2.6","q":"<p>Which of the following option positions is MOST likely to be exercised before its expiry date?<\/p>","o":[{"l":"A","h":"Long-dated, deep-in-the-money, European-style"},{"l":"B","h":"Long-dated, out-of-the-money, American-style"},{"l":"C","h":"Short-dated, deep-in-the-money, American-style"},{"l":"D","h":"Short-dated, out-of-the-money European-style"}],"a":"C","e":"<p><strong>Réponse : C<\/strong> (Chapter 7, Section 2.6)<\/p><p>American-style options can be exercised before their expiry date. It is feasible to exercise early when the following three criteria are met: i) American-style; ii) deep-in-the-money – having intrinsic value; and iii) close to expiry or short-dated, with very little time value left.<\/p>"},{"s":3,"n":26,"id":"Chapter 3, Section 4.2","q":"<p>What function does a pit observer have in relation to cross trades in an open outcry market?<\/p>","o":[{"l":"A","h":"To allocate the position to the relevant account"},{"l":"B","h":"To confirm time of execution"},{"l":"C","h":"To input trades into the trade reporting system"},{"l":"D","h":"To verify and sign off trades"}],"a":"D","e":"<p><strong>Réponse : D<\/strong> (Chapter 3, Section 4.2)<\/p><p>Cross trades in an open outcry market must be verified and signed off by pit observers when the order is executed.<\/p>"},{"s":9,"n":27,"id":"Chapter 9, Section 2.4","q":"<p>What sum should a client’s portfolio exceed before they can be treated as an elective professional client?<\/p>","o":[{"l":"A","h":"€250,000"},{"l":"B","h":"€200,000"},{"l":"C","h":"€400,000"},{"l":"D","h":"€500,000"}],"a":"D","e":"<p><strong>Réponse : D<\/strong> (Chapter 9, Section 2.4)<\/p><p>A retail client may only be treated as an elective professional client if the size of their portfolio exceeds €500,000.<\/p>"},{"s":4,"n":28,"id":"Chapter 4, Section 3.7.3","q":"<p>If the price of a future rises out of the arbitrage channel, what will arbitrageurs do?<\/p>","o":[{"l":"A","h":"Sell the underlying and buy the future"},{"l":"B","h":"Sell the future and buy the underlying"},{"l":"C","h":"Buy the underlying and sell it at a profit"},{"l":"D","h":"Buy the underlying and buy the future"}],"a":"B","e":"<p><strong>Réponse : B<\/strong> (Chapter 4, Section 3.7.3)<\/p><p>Arbitrage works by buying whichever thing is cheaper and selling the other to generate a risk-free profit.<\/p>"},{"s":6,"n":29,"id":"Chapter 6, Section 3.2.1","q":"<p>What are the Theoretical Intermarket Margining System (TIMS) and Standard Portfolio Analysis of Risk (SPAN) used to calculate?<\/p>","o":[{"l":"A","h":"Daily settlement prices"},{"l":"B","h":"Initial margins"},{"l":"C","h":"Maintenance margin"},{"l":"D","h":"Value of collateral"}],"a":"B","e":"<p><strong>Réponse : B<\/strong> (Chapter 6, Section 3.2.1)<\/p><p>They are both scenario-based risk programs used for calculating initial margins.<\/p>"},{"s":1,"n":30,"id":"Chapter 1, Section 2.2","q":"<p>Who pays the premium on an option?<\/p>","o":[{"l":"A","h":"The holder of a put"},{"l":"B","h":"The writer of a put"},{"l":"C","h":"The writer of a call"},{"l":"D","h":"The seller of a put"}],"a":"A","e":"<p><strong>Réponse : A<\/strong> (Chapter 1, Section 2.2)<\/p><p>The buyer (holder) of any kind of option must pay the premium to the writer (seller) of the option.<\/p>"},{"s":2,"n":31,"id":"Chapter 2, Section 4.1","q":"<p>Which of the following government bonds has an annual coupon?<\/p>","o":[{"l":"A","h":"Buoni del Tesoro Poliennali (BTPs)"},{"l":"B","h":"Japanese Government Bonds (JGBs)"},{"l":"C","h":"Obligations Assimilables du Trésor (OATs)"},{"l":"D","h":"Treasury bonds"}],"a":"C","e":"<p><strong>Réponse : C<\/strong> (Chapter 2, Section 4.1)<\/p><p>OATs and Bunds have annual coupons whereas BTPs, JGBs and T-bonds have semi-annual coupons.<\/p>"},{"s":4,"n":32,"id":"Chapter 4, Section 3.4","q":"<p>Which of the following is an example of backwardation?<\/p>","o":[{"l":"A","h":"Futures price at fair value, slightly higher than the cash value of the underlying"},{"l":"B","h":"Futures price below fair value, but above cash value"},{"l":"C","h":"Futures price below cash value"},{"l":"D","h":"Futures price has risen out of the arbitrage channel"}],"a":"C","e":"<p><strong>Réponse : C<\/strong> (Chapter 4, Section 3.4)<\/p><p>The market is said to be in backwardation when the futures prices are lower than the cash prices. If futures prices are higher than cash prices the market is said to be in contango.<\/p>"},{"s":4,"n":33,"id":"Chapter 4, Section 3.7.3","q":"<p>Which of the following statements most accurately defines the arbitrage channel?<\/p>","o":[{"l":"A","h":"The range of prices within which transaction costs outweigh any potential arbitrage profits"},{"l":"B","h":"The range of prices within which arbitrage can be carried out profitably"},{"l":"C","h":"The range of prices within which the derivative is trading at less than its fair value"},{"l":"D","h":"The range of prices within which the derivative is trading at more than its fair value"}],"a":"A","e":"<p><strong>Réponse : A<\/strong> (Chapter 4, Section 3.7.3)<\/p><p>The futures price can move away from its fair value without there being any arbitrage activity, as long as the movement is less than the trading costs that will be incurred. This creates an arbitrage channel – a range of prices within which there will be no possibility for arbitrage owing to transaction costs outweighing any potential benefits.<\/p>"},{"s":8,"n":34,"id":"Chapter 8, Section 3.1","q":"<p>How many bond futures must be traded to hedge an anticipated holding of €50 million nominal of the cheapest to deliver (CTD) bond assuming the contract size is €250,000, the price factor of the CTD is 1.112233 and the notional coupon is 6%?<\/p>","o":[{"l":"A","h":"180"},{"l":"B","h":"200"},{"l":"C","h":"222"},{"l":"D","h":"247"}],"a":"C","e":"<p><strong>Réponse : C<\/strong> (Chapter 8, Section 3.1)<\/p><p>To calculate the number of contracts needed the price factor is multiplied by the nominal value of the CTD portfolio divided by the nominal value of the contract. Therefore, in this case, 1.112233 x (€50m/ €250,000) = 222.<\/p>"},{"s":9,"n":35,"id":"Chapter 9, Section 3.3.1","q":"<p>Which organisation regulates options on stock indices in the US?<\/p>","o":[{"l":"A","h":"Chicago Board Options Exchange"},{"l":"B","h":"Commodity Futures Trading Commission"},{"l":"C","h":"National Futures Association"},{"l":"D","h":"Securities and Exchange Commission"}],"a":"D","e":"<p><strong>Réponse : D<\/strong> (Chapter 9, Section 3.3.1)<\/p><p>The Securities and Exchange Commission (SEC) regulates most US option products and option exchanges but does not regulate futures products or exchanges. The CFTC regulates options not covered by the SEC.<\/p>"},{"s":9,"n":36,"id":"Chapter 9, Section 2.1","q":"<p>What is a key element of principles-based regulation?<\/p>","o":[{"l":"A","h":"Well-defined rules that all regulated firms can easily apply"},{"l":"B","h":"Well-defined rules that all firms can tailor according to the scope of their business"},{"l":"C","h":"Broad-based guidelines that are applied by each regulated firm according to the scope and nature of their business"},{"l":"D","h":"Broad-based guidelines that each EU member state translates into its own well-defined rules"}],"a":"C","e":"<p><strong>Réponse : C<\/strong> (Chapter 9, Section 2.1)<\/p><p>While each member state is permitted to implement MiFID according to parameters that are agreed between the EU and each home state, the approach of having broad-based guidelines must be preserved.<\/p>"},{"s":1,"n":37,"id":"Chapter 1, Section 5.3.4","q":"<p>If you sell a 240 put option for 17, what is your maximum profit?<\/p>","o":[{"l":"A","h":"17"},{"l":"B","h":"233"},{"l":"C","h":"240"},{"l":"D","h":"Unlimited"}],"a":"A","e":"<p><strong>Réponse : A<\/strong> (Chapter 1, Section 5.3.4)<\/p><p>The maximum profit for the writer of a put option is the premium.<\/p>"},{"s":1,"n":38,"id":"Chapter 1, Section 2.2","q":"<p>What is a European-style option?<\/p>","o":[{"l":"A","h":"An option traded only in the European markets"},{"l":"B","h":"An option which can be executed at any time"},{"l":"C","h":"An option which can only be exercised at expiry"},{"l":"D","h":"An option on a European share"}],"a":"C","e":"<p><strong>Réponse : C<\/strong> (Chapter 1, Section 2.2)<\/p><p>European-style options are traded all over the world and may only be exercised at expiry, in contrast to American-style options which may be exercised at any time.<\/p>"},{"s":3,"n":39,"id":"Chapter 3, Section 1.2","q":"<p>To liquidate a long position when the price falls below the prevailing market price requires which of the following orders?<\/p>","o":[{"l":"A","h":"Sell stop"},{"l":"B","h":"Buy stop"},{"l":"C","h":"Sell limit"},{"l":"D","h":"Buy limit"}],"a":"A","e":"<p><strong>Réponse : A<\/strong> (Chapter 3, Section 1.2)<\/p><p>The stop will not necessarily be executed at the stop level – it will become a market order when the price falls to the stop level. A sell limit order could sit on the order book and remain unsatisfied.<\/p>"},{"s":3,"n":40,"id":"Chapter 3, Section 5.2","q":"<p>A member firm executes, confirms and matches a trade, which it pre-registers to allocate the trade to another member firm. What is the term for this action?<\/p>","o":[{"l":"A","h":"Assign to"},{"l":"B","h":"Call-up"},{"l":"C","h":"Give-in"},{"l":"D","h":"Give-up"}],"a":"D","e":"<p><strong>Réponse : D<\/strong> (Chapter 3, Section 5.2)<\/p><p>Give-ups are the sending of a trade to another member of the exchange. The member to whom the trade is given-up is said to be performing a ‘give-in’.<\/p>"},{"s":1,"n":41,"id":"Chapter 1, Section 6.1","q":"<p>Which of the following is TRUE of exchange of futures for physicals (EFP) trades?<\/p>","o":[{"l":"A","h":"Counterparty credit risk increases when an EFP replaces an existing over-the-counter (OTC) trade"},{"l":"B","h":"EFP transactions can be negotiated and registered on a round-the-clock basis"},{"l":"C","h":"OTC and futures positions can be swapped even if they differ substantially in value"},{"l":"D","h":"Margin and credit limits can be reduced by netting OTC and futures positions"}],"a":"D","e":"<p><strong>Réponse : D<\/strong> (Chapter 1, Section 6.1)<\/p><p>Margin and credit limits can be reduced by netting out OTC and futures positions; similarly, counterparty credit risk decreases as a result of an EFP trade. They can be negotiated on a 24-hour basis but must be registered during explicit times set down by the exchange. OTC and futures positions can be swapped only if they are substantially similar in value and/or quantity.<\/p>"},{"s":6,"n":42,"id":"Chapter 6, Section 1.2","q":"<p>By which method does a clearing house become the counterparty to every trade?<\/p>","o":[{"l":"A","h":"Assignment"},{"l":"B","h":"Novation"},{"l":"C","h":"Offsetting"},{"l":"D","h":"Registration"}],"a":"B","e":"<p><strong>Réponse : B<\/strong> (Chapter 6, Section 1.2)<\/p><p>Novation is the legal process whereby the clearing house becomes the counterparty to all trades.<\/p>"},{"s":8,"n":43,"id":"Chapter 8, Section 10","q":"<p>Which of the following are typically the most conservative users of derivative products?<\/p>","o":[{"l":"A","h":"Hedge funds"},{"l":"B","h":"Pension funds"},{"l":"C","h":"Corporate treasurers"},{"l":"D","h":"High net worth individuals"}],"a":"C","e":"<p><strong>Réponse : C<\/strong> (Chapter 8, Section 10)<\/p><p>Hedge funds and high net worth individuals (HNWIs) tend to have a greater appetite for risk than pension funds, which may also be constrained in their investment activities either through legislation or the client mandate. Corporate treasurers are the most risk-averse and will typically use derivatives to hedge price or currency risk associated with normal business activities.<\/p>"},{"s":6,"n":44,"id":"Chapter 6, Section 3.2.1","q":"<p>Which of the following types of margin covers the risk of default during the delivery process?<\/p>","o":[{"l":"A","h":"Intra-day margin"},{"l":"B","h":"Maintenance margin"},{"l":"C","h":"Spot month margin"},{"l":"D","h":"Variation margin"}],"a":"C","e":"<p><strong>Réponse : C<\/strong> (Chapter 6, Section 3.2.1)<\/p><p>A clearing house will try to minimise the speculative and delivery pressures by increasing the initial margin for those contracts where final settlement is by physical delivery. This is known as a spot month margin. This ensures that those position-holders contemplating taking the contract to delivery have either the underlying asset to deliver or have allocated sufficient funds to effect settlement.<\/p>"},{"s":5,"n":45,"id":"Chapter 5, Section 5.2","q":"<p>The benefit of a mark to market swap is:<\/p>","o":[{"l":"A","h":"its regular payments reduce any market risk from the underlying asset"},{"l":"B","h":"after each settlement date, any credit risk that has built up is removed"},{"l":"C","h":"it allows the value of the underlying principal to fluctuate after every settlement date"},{"l":"D","h":"the regular principal repayments fit its use as a hedge for bonds"}],"a":"B","e":"<p><strong>Réponse : B<\/strong> (Chapter 5, Section 5.2)<\/p><p>The payment of any changes in market value removes any credit risk between the two swap counterparties on a regular basis.<\/p>"},{"s":3,"n":46,"id":"Chapter 3, Section 1.2","q":"<p>Which category of member is restricted to trading only for third parties?<\/p>","o":[{"l":"A","h":"Brokers"},{"l":"B","h":"Broker-dealers"},{"l":"C","h":"Dealers"},{"l":"D","h":"General clearing member"}],"a":"A","e":"<p><strong>Réponse : A<\/strong> (Chapter 3, Section 1.2)<\/p><p>Brokers may only trade for third parties. Dealers may trade for their own account and trade for other members. Broker-dealers are entitled to trade for both third parties and their own account. General clearing members are able to clear for their own principal trades, on behalf of their clients and on behalf of other non-clearing members.<\/p>"},{"s":1,"n":47,"id":"Chapter 1, Section 6.4.1","q":"<p>Which is TRUE of price-takers?<\/p>","o":[{"l":"A","h":"They are buyers of financial securities only"},{"l":"B","h":"They always have to pay away the market spread"},{"l":"C","h":"They determine and deal on their own price"},{"l":"D","h":"They always get to deal on their own price"}],"a":"B","e":"<p><strong>Réponse : B<\/strong> (Chapter 1, Section 6.4.1)<\/p><p>A price-taker is a market participant who either requests the price, or deals through an intermediary on another participant’s price. Thus, they do not set the price themselves. Many market participants including market makers may find themselves as price-takers in some circumstances, and price-makers or price-givers in others.<\/p>"},{"s":2,"n":48,"id":"Chapter 2, Section 4.2","q":"<p>How is a yield curve described when short-term rates are the same as long-term rates?<\/p>","o":[{"l":"A","h":"Concave"},{"l":"B","h":"Flat"},{"l":"C","h":"Inverted"},{"l":"D","h":"Normal"}],"a":"B","e":"<p><strong>Réponse : B<\/strong> (Chapter 2, Section 4.2)<\/p><p>If short-term interest rates are the same as long-term rates, the yield curve is said to be flat.<\/p>"},{"s":4,"n":49,"id":"Chapter 4, Section 4.1.5","q":"<p>If volatility rises, what will this do to options prices?<\/p>","o":[{"l":"A","h":"Call and put premiums will rise"},{"l":"B","h":"Call and put premiums will fall"},{"l":"C","h":"Call premiums will rise, put premiums will fall"},{"l":"D","h":"Call premiums will fall, put premiums will rise"}],"a":"A","e":"<p><strong>Réponse : A<\/strong> (Chapter 4, Section 4.1.5)<\/p><p>The more volatile the price of an asset, the greater the uncertainty so the higher the time value and hence the premium. Premiums rise to compensate the writer for this additional risk.<\/p>"},{"s":1,"n":50,"id":"Chapter 1, Section 2.2","q":"<p>An option that can be exercised by its holder at any time up to its expiration date is known as:<\/p>","o":[{"l":"A","h":"American"},{"l":"B","h":"Asian"},{"l":"C","h":"Bermudan"},{"l":"D","h":"European"}],"a":"A","e":"<p><strong>Réponse : A<\/strong> (Chapter 1, Section 2.2)<\/p><p>There are three popular exercise styles for options. The American-style allows its owner to exercise it at any time, up to its expiration date.<\/p>"},{"s":8,"n":51,"id":"Chapter 8, Section 6.3","q":"<p>If an investor buys a call with a higher strike and a put with a lower strike on an oil future, what is this strategy called?<\/p>","o":[{"l":"A","h":"Short straddle"},{"l":"B","h":"Long strangle"},{"l":"C","h":"Bear spread"},{"l":"D","h":"Bull spread"}],"a":"B","e":"<p><strong>Réponse : B<\/strong> (Chapter 8, Section 6.3)<\/p><p>Strangles are constructed using calls and puts with different exercise prices. Here, the options are bought, so it is a long strangle.<\/p>"},{"s":8,"n":52,"id":"Chapter 8, Section 3","q":"<p>Which of the following is involved in a long hedge?<\/p>","o":[{"l":"A","h":"A stop order"},{"l":"B","h":"Selling short"},{"l":"C","h":"Buying futures"},{"l":"D","h":"An intra-market spread"}],"a":"C","e":"<p><strong>Réponse : C<\/strong> (Chapter 8, Section 3)<\/p><p>‘Long’ means ‘buy’ in derivatives jargon. Hedgers will offset risk by taking an opposite position in the futures market.<\/p>"},{"s":9,"n":53,"id":"Chapter 9, Section 3.3.2","q":"<p>Which of the following is the main regulator of futures exchanges in the US?<\/p>","o":[{"l":"A","h":"Commodity Futures Trading Commission"},{"l":"B","h":"National Futures Association"},{"l":"C","h":"Securities and Exchange Commission"},{"l":"D","h":"Treasury and Exchange Department"}],"a":"A","e":"<p><strong>Réponse : A<\/strong> (Chapter 9, Section 3.3.2)<\/p><p>Although a major regulator of US securities markets, the SEC has a limited role in the regulation of derivatives markets. The CFTC regulates all on-exchange derivatives transactions that are not covered by the SEC. It regulates all futures products and exchanges (including the Philadelphia Stock Exchange (PHLX)) and all of the options not covered by the SEC (including currency options on the Chicago Mercantile Exchange (CME)).<\/p>"},{"s":5,"n":54,"id":"Chapter 5, Section 3.2","q":"<p>A collateralised bond obligation (CBO) is considered investment grade and a portfolio of junk bonds is not, because the CBO:<\/p>","o":[{"l":"A","h":"offers an extremely attractive yield"},{"l":"B","h":"has a Moody’s rating of BBB or higher"},{"l":"C","h":"includes a pool of several types of credit-quality bonds"},{"l":"D","h":"includes a pool of bonds with different maturities"}],"a":"C","e":"<p><strong>Réponse : C<\/strong> (Chapter 5, Section 3.2)<\/p><p>A collateralised bond obligation (CBO) is a derivative security that creates an investment-grade bond from a pool of junk bonds (high risk). These junk bonds are typically not investment grade, but because a CBO includes a pool of several types of credit quality bonds together, they offer enough diversification to be considered investment grade.<\/p>"},{"s":2,"n":55,"id":"Chapter 2, Section 3","q":"<p>A Japanese investor expects to receive USD income from their portfolio of US government bond investments in three months’ time. How might they hedge currency risk relating to this income?<\/p>","o":[{"l":"A","h":"Buy yen spot value"},{"l":"B","h":"Sell a yen call/USD put option with a three-month expiration"},{"l":"C","h":"Buy yen versus the USD forward, with a three-month maturity"},{"l":"D","h":"Sell the US Treasury bonds"}],"a":"C","e":"<p><strong>Réponse : C<\/strong> (Chapter 2, Section 3)<\/p><p>If USD were to weaken against JPY over the three months, the amount of yen that the investor would receive would fall. Therefore, it would make sense to fix the exchange rate as soon as possible, to hedge any exchange rate risk. This is best done using a three-month forward contract.<\/p>"},{"s":1,"n":56,"id":"Chapter 1, Section 1.3","q":"<p>If you buy an option, what is the effect, if any, of gearing for a given price change in the underlying asset?<\/p>","o":[{"l":"A","h":"A similar proportionate change in the option value"},{"l":"B","h":"A greater proportionate change in the option value"},{"l":"C","h":"A smaller proportionate change in the option value"},{"l":"D","h":"None"}],"a":"B","e":"<p><strong>Réponse : B<\/strong> (Chapter 1, Section 1.3)<\/p><p>The option value, or premium, is much smaller than the price of the underlying so a change in the value of the underlying will tend to produce a much greater proportionate change in the value of the option.<\/p>"},{"s":3,"n":57,"id":"Chapter 3, Section 1.2","q":"<p>Which order type on ICE Futures Europe is to be executed at the best price available?<\/p>","o":[{"l":"A","h":"Basis order"},{"l":"B","h":"Market on open order"},{"l":"C","h":"Market order"},{"l":"D","h":"Normal limit order"}],"a":"C","e":"<p><strong>Réponse : C<\/strong> (Chapter 3, Section 1.2)<\/p><p>Market orders are to be executed at the best price available. Normal limit orders are to be executed at the stated price or better.<\/p>"},{"s":4,"n":58,"id":"Chapter 4, Section 4.3","q":"<p>An investor is short a future and buys a put. To achieve delta neutrality, what should the investor do?<\/p>","o":[{"l":"A","h":"Buy calls"},{"l":"B","h":"Sell calls"},{"l":"C","h":"Buy puts"},{"l":"D","h":"Sell futures"}],"a":"A","e":"<p><strong>Réponse : A<\/strong> (Chapter 4, Section 4.3)<\/p><p>Short future and buy put are negative delta positions. Therefore, a positive delta trade is required, so buy calls is the right choice.<\/p>"},{"s":5,"n":59,"id":"Chapter 5, Section 4.1","q":"<p>According to the two most widely used option pricing models, an option’s value will fall when the underlying asset’s:<\/p>","o":[{"l":"A","h":"volatility rises faster than market volatility"},{"l":"B","h":"price moves below the call’s strike price"},{"l":"C","h":"price moves below the put’s strike price"},{"l":"D","h":"price moves above the call’s strike price"}],"a":"B","e":"<p><strong>Réponse : B<\/strong> (Chapter 5, Section 4.1)<\/p><p>According to any option pricing model, a call’s price will fall as the price of its underlying asset falls below its strike price, thus making it further out-of-the-money.<\/p>"},{"s":6,"n":60,"id":"Chapter 6, Section 3.2.2","q":"<p>What price is used to mark to market all positions?<\/p>","o":[{"l":"A","h":"Opening traded price"},{"l":"B","h":"Daily settlement price"},{"l":"C","h":"Mid-market traded price"},{"l":"D","h":"Weighted average traded price"}],"a":"B","e":"<p><strong>Réponse : B<\/strong> (Chapter 6, Section 3.2.2)<\/p><p>At the close of each trading day, all positions are marked to market based on the daily settlement price.<\/p><p>The daily settlement price can be referred to as the closing price as it is established at the end of the trading day. Other markets have different methods for calculating the daily settlement price.<\/p>"},{"s":6,"n":61,"id":"Chapter 6, Section 3.2.1","q":"<p>Which of the following applies to broker margins?<\/p>","o":[{"l":"A","h":"They can be greater than those of the corresponding clearing house"},{"l":"B","h":"They are 15% of the underlying contract value"},{"l":"C","h":"They are based on SPAN"},{"l":"D","h":"They must be equal to the margin determined by the clearing house"}],"a":"A","e":"<p><strong>Réponse : A<\/strong> (Chapter 6, Section 3.2.1)<\/p><p>Broker margin must be at least equal to the margin required by the clearing house. As long as they meet this requirement, all other aspects are determined by the broker.<\/p>"},{"s":9,"n":62,"id":"Chapter 9, Section 1.2","q":"<p>What is the main purpose of the Capital Requirements Directive (CRD) introduced as part of the Markets in Financial Instruments Directive (MiFID)?<\/p>","o":[{"l":"A","h":"To ensure orderly markets and improve client protection"},{"l":"B","h":"To make it easier for firms wishing to take advantage of passporting opportunities"},{"l":"C","h":"To implement tougher sanctions against firms"},{"l":"D","h":"To improve trading liquidity across the EU"}],"a":"A","e":"<p><strong>Réponse : A<\/strong> (Chapter 9, Section 1.2)<\/p><p>The main purpose of the Capital Requirements Directive (CRD) is to set out regulatory requirements for capital that a firm must hold. This ensures orderly markets and improves client protection.<\/p>"},{"s":2,"n":63,"id":"Chapter 2, Section 4.1.7","q":"<p>What is a gilt strip?<\/p>","o":[{"l":"A","h":"The tax element of a coupon payment"},{"l":"B","h":"The separation of the interest payments and the principal amount"},{"l":"C","h":"The best bid-offer spread shown on a gilt dealing screen"},{"l":"D","h":"A tap issue of gilts by the Debt Management Office (DMO)"}],"a":"B","e":"<p><strong>Réponse : B<\/strong> (Chapter 2, Section 4.1.7)<\/p><p>Stripping a gilt involves trading the interest (each individual coupon) and the principal (the nominal value) separately.<\/p>"},{"s":4,"n":64,"id":"Chapter 4, Section 3.6","q":"<p>Which of these describes a situation in which the futures price is lower than the cash price of the underlying?<\/p>","o":[{"l":"A","h":"Positive basis"},{"l":"B","h":"Carrying"},{"l":"C","h":"Negative basis"},{"l":"D","h":"In contango"}],"a":"A","e":"<p><strong>Réponse : A<\/strong> (Chapter 4, Section 3.6)<\/p><p>Positive basis describes a situation in which the futures price is in backwardation, ie, below the cash price. Basis is calculated by subtracting the futures price from the cash price, resulting in a negative basis if the market is carrying/in contango.<\/p>"},{"s":1,"n":65,"id":"Chapter 1, Section 2.3.1","q":"<p>An investor buys a January £5 call option at 25p. At the expiry, the stock is at £4.75. How much will the investor lose per share?<\/p>","o":[{"l":"A","h":"25p"},{"l":"B","h":"50p"},{"l":"C","h":"£4.75"},{"l":"D","h":"£5.00"}],"a":"A","e":"<p><strong>Réponse : A<\/strong> (Chapter 1, Section 2.3.1)<\/p><p>Rather than exercise the option, the investor abandons it and loses his premium: 25p.<\/p>"},{"s":4,"n":66,"id":"Chapter 4, Section 4.5","q":"<p>If an investor goes long a call on three S&amp;P 500 index futures where the premium is $1,500, what additional margin needs to be paid (if any)?<\/p>","o":[{"l":"A","h":"$1,500"},{"l":"B","h":"$3,500"},{"l":"C","h":"$4,500"},{"l":"D","h":"Nothing"}],"a":"D","e":"<p><strong>Réponse : D<\/strong> (Chapter 4, Section 4.5)<\/p><p>There is no initial margin payment on the purchase of an option because the counterparty’s risk is covered by the premium.<\/p>"},{"s":1,"n":67,"id":"Chapter 1, Section 6.1","q":"<p>Flexible exchange (FLEX) options are hybrid products in what way?<\/p>","o":[{"l":"A","h":"OTC-traded, but with standardised contract specifications"},{"l":"B","h":"Exchange-traded, but with choice of two exercise styles"},{"l":"C","h":"Exchange-traded, but with freely negotiable terms"},{"l":"D","h":"Options that can freely trade either on- or off-exchange"}],"a":"C","e":"<p><strong>Réponse : C<\/strong> (Chapter 1, Section 6.1)<\/p><p>FLEX options are exchange traded, but the key parameters such as exercise price, expiry date and exercise style are customised. Compared with OTC options, they have lower credit risk due to the exchange’s use of a central clearing house.<\/p>"},{"s":6,"n":68,"id":"Chapter 6, Section 4.2","q":"<p>Where permitted, what does a credit line cover?<\/p>","o":[{"l":"A","h":"Margin requirements of members’ clients"},{"l":"B","h":"Tax liabilities when in default"},{"l":"C","h":"Purchase of the underlying asset on exercise"},{"l":"D","h":"Settlement payments of members"}],"a":"A","e":"<p><strong>Réponse : A<\/strong> (Chapter 6, Section 4.2)<\/p><p>Some exchanges allow their members to extend credit to their clients to cover margin requirements.<\/p><p>These credit lines are subject to regulatory rules.<\/p>"},{"s":3,"n":69,"id":"Chapter 3, Section 2","q":"<p>A dealer buys £10 million nominal of gilts, and sells gilt futures to the same value. What type of trade have they just executed?<\/p>","o":[{"l":"A","h":"A FLEX trade"},{"l":"B","h":"A basis trade"},{"l":"C","h":"An exchange for physical"},{"l":"D","h":"A block trade"}],"a":"B","e":"<p><strong>Réponse : B<\/strong> (Chapter 3, Section 2)<\/p><p>A basis trade is the simultaneous exchange of a financial asset or instrument (eg, a government bond or a basket of shares), together with an appropriate offsetting number of futures contracts, in a privately negotiated transaction between two parties. Similarly to block trades, the exchange allows the futures part of the basis trade to be executed outside the central order book.<\/p>"},{"s":2,"n":70,"id":"Chapter 2, Section 2.5","q":"<p>Certificates of deposit are issued:<\/p>","o":[{"l":"A","h":"at deep discount to their face value"},{"l":"B","h":"with maturities typically between six and 12 months"},{"l":"C","h":"at a slightly lower rate of interest compared with Treasury Bills"},{"l":"D","h":"with the possibility of withdrawal prior to maturity, but usually at a cost"}],"a":"D","e":"<p><strong>Réponse : D<\/strong> (Chapter 2, Section 2.5)<\/p><p>CDs are issued at face value at maturities usually between three and six months, and they pay a slightly higher rate of interest over government-issued T-bills to compensate for the additional risk. Because CDs are a form of time deposit, withdrawals are subject to a penalty.<\/p>"},{"s":2,"n":71,"id":"Chapter 2, Section 4.1","q":"<p>Which of the following government bonds is settled on a T+1 basis?<\/p>","o":[{"l":"A","h":"BTP"},{"l":"B","h":"Bund"},{"l":"C","h":"OAT"},{"l":"D","h":"Treasury bonds"}],"a":"D","e":"<p><strong>Réponse : D<\/strong> (Chapter 2, Section 4.1)<\/p><p>US T-bonds are settled on a T+1 basis. OATs, Bunds, JGBs and BTPs are settled on a T+2 or T+3 basis.<\/p>"},{"s":2,"n":72,"id":"Chapter 2, Section 6.1","q":"<p>A sugar refiner bought 15 white sugar futures contracts on ICE Futures Europe at $275 per tonne. The contract size was 50 tonnes. The position was later closed out when the price was $270 per tonne. What was the loss?<\/p>","o":[{"l":"A","h":"$750"},{"l":"B","h":"$1,875"},{"l":"C","h":"$3,750"},{"l":"D","h":"$4,125"}],"a":"C","e":"<p><strong>Réponse : C<\/strong> (Chapter 2, Section 6.1)<\/p><p>There is a loss of $5 per tonne after buying at $275 and selling at $270. Each contract represents 50 tonnes. Therefore $5 x 50 tonnes x 15 contracts = $3,750.<\/p>"},{"s":6,"n":73,"id":"Chapter 6, Section 4.1","q":"<p>Which of the following is accepted by ICE Clear Europe as collateral?<\/p>","o":[{"l":"A","h":"Australian dollars in cash"},{"l":"B","h":"Equities that are traded on the Alternative Investment Market (AIM)"},{"l":"C","h":"Japanese bonds"},{"l":"D","h":"US dollar certificates of deposit"}],"a":"D","e":"<p><strong>Réponse : D<\/strong> (Chapter 6, Section 4.1)<\/p><p>Certificates of deposit (CDs) denominated in sterling or US dollars are acceptable. Cash must be in one of eight approved currencies.<\/p>"},{"s":6,"n":74,"id":"Chapter 6, Section 3.2.3","q":"<p>ICE Clear Europe calculates the amount of initial margin required to cover all contracts for each member by using the:<\/p>","o":[{"l":"A","h":"difference between the settlement price and variation margin"},{"l":"B","h":"gross value of all positions"},{"l":"C","h":"marked to market value of net positions"},{"l":"D","h":"net liquidation values"}],"a":"D","e":"<p><strong>Réponse : D<\/strong> (Chapter 6, Section 3.2.3)<\/p><p>Because initial margin requirements are based on the net positions held by the member firm and there may be a variety of positions held, the calculation of the amount due is based on the NLVs of the constituent parts of the portfolio.<\/p>"},{"s":5,"n":75,"id":"Chapter 5, Section 7.1","q":"<p>MarkitWire is an:<\/p>","o":[{"l":"A","h":"industry-backed straight-through processing system for OTC derivatives"},{"l":"B","h":"exchange-based derivatives clearing and margin system"},{"l":"C","h":"industry-backed straight-through netting and payments system for OTC derivatives"},{"l":"D","h":"exchange-based derivative netting and payments system"}],"a":"A","e":"<p><strong>Réponse : A<\/strong> (Chapter 5, Section 7.1)<\/p><p>MarkitWire is an industry-backed straight-through processing (STP) system for OTC derivatives, which enables the affirmation of direct transactions and brokered deals between counterparties.<\/p>"},{"s":4,"n":76,"id":"Chapter 4, Section 3.7.3","q":"<p>What use, if any, will arbitrageurs make of a future when it is in the arbitrage channel?<\/p>","o":[{"l":"A","h":"Sell it to capitalise on its low value in relation to the underlying"},{"l":"B","h":"Buy it to capitalise on its low value in relation to the underlying"},{"l":"C","h":"Buy it to capitalise on its high value in relation to the underlying"},{"l":"D","h":"None"}],"a":"D","e":"<p><strong>Réponse : D<\/strong> (Chapter 4, Section 3.7.3)<\/p><p>When a future is in the arbitrage channel it is either at its fair value, or transaction costs cancel out any gains that can be made from engaging in arbitrage.<\/p>"},{"s":7,"n":77,"id":"Chapter 7, Section 2.4","q":"<p>What term describes a trader closing out a position for a nominal amount to crystallise a loss?<\/p>","o":[{"l":"A","h":"Abandonment"},{"l":"B","h":"Assignment"},{"l":"C","h":"Cabinet trade"},{"l":"D","h":"Basis trade"}],"a":"C","e":"<p><strong>Réponse : C<\/strong> (Chapter 7, Section 2.4)<\/p><p>A trader may need to crystallise a loss for tax or accounting purposes and instead of abandoning the option will close out the position for a nominal amount. This is known as a cabinet trade.<\/p>"},{"s":8,"n":78,"id":"Chapter 8, Section 3.3","q":"<p>When is a change in basis profitable for the short hedger (short the future, long the underlying)?<\/p>","o":[{"l":"A","h":"Cash prices go down while futures remain steady"},{"l":"B","h":"Cash prices move from a premium over to a discount under futures"},{"l":"C","h":"Futures and cash move in unison"},{"l":"D","h":"Future prices go down while cash prices remain unchanged"}],"a":"D","e":"<p><strong>Réponse : D<\/strong> (Chapter 8, Section 3.3)<\/p><p>Basis is the difference between the cash and futures prices. The short hedger has sold the future and holds the physical asset. Therefore he will benefit if he can close out his position by buying back the future at a lower price while still getting the same cash price for the underlying physical asset.<\/p>"},{"s":5,"n":79,"id":"Chapter 5, Section 6.2","q":"<p>Under which of the following circumstances will the FCA or an exchange set a maintenance margin higher than a position’s initial margin?<\/p>","o":[{"l":"A","h":"When the broker is dealing with an offshore client, to ensure that they have sufficient funds to meet any margin calls"},{"l":"B","h":"When the contract is considered to have a high
