ised (in cases where the option is only slightly in the money or when costly physical delivery would be required, for example), a suppression notice must be filed with the clearing house.<\/p>"},{"s":1,"n":96,"id":"1036676","q":"<p>Which of the following options would be described as being the most geared?<\/p>","o":[{"l":"A","h":"In-the-money options"},{"l":"B","h":"At-the-money options"},{"l":"C","h":"Options with the highest delta"},{"l":"D","h":"Deeply out-of-the money options"}],"a":"D","e":"<p>OTM options will be the cheapest to buy and hence the most geared since a very small initial outlay (the premium) allows the investor to control a much greater value asset.<\/p>"},{"s":1,"n":97,"id":"1036749","q":"<p>The client asset rules insist that a firm reconcile a client's assets on a regular basis. For what reason is this reconciliation required?<\/p>","o":[{"l":"A","h":"To keep clients informed as to the value of their assets"},{"l":"B","h":"To ensure that the firm can meet any calls on these assets"},{"l":"C","h":"To provide the competent authority with records of the assets"},{"l":"D","h":"To facilitate in the valuation of the firm's assets"}],"a":"B","e":"<p>A firm must regularly reconcile the assets in order to ensure they have the correct assets should the client call for their return, or ask the firm to use them in any way.<br/> The assets would not need to be the exact assets deposited by the client, but would need to be equivalent.<\/p>"},{"s":1,"n":98,"id":"1036706","q":"<p>What is the motivation for conducting a horizontal spread with call options?<\/p>","o":[{"l":"A","h":"To profit from time decay"},{"l":"B","h":"Expect an increase in volatility"},{"l":"C","h":"Believe the market will rise"},{"l":"D","h":"To hedge against an existing position"}],"a":"A","e":"<p>Selling a near dated option and buying a far dated option and then subsequently reversing these trades should result in profit.<\/p>"},{"s":1,"n":99,"id":"1036722","q":"<p>Three-month sterling futures are quoted at 93.00. The 92.50 call is quoted at 0.61. This represents:<\/p>","o":[{"l":"A","h":"0.61 time value"},{"l":"B","h":"0.61 intrinsic value"},{"l":"C","h":"0.50 time value and 0.11 intrinsic value"},{"l":"D","h":"0.11 time value and 0.50 intrinsic value"}],"a":"D","e":"<p>The call is 'in-the-money' by 0.50 (93.00 - 92.50). Therefore: <br/> 1. Intrinsic value is 0.50. <br/> 2. The balance of the premium (11p) represents time value.<\/p>"},{"s":1,"n":100,"id":"1036710","q":"<p>Which of the following best describes the purpose of price limits?<\/p>","o":[{"l":"A","h":"Ensure good liquidity across major contracts"},{"l":"B","h":"Prevent a build up of dominant positions which lead to potential abusive squeezes"},{"l":"C","h":"Ensure that longs and shorts are able to honour commitments to make or take delivery of a physical asset"},{"l":"D","h":"Prevent the market moving too far too fast during a trading session"}],"a":"D","e":""},{"s":2,"n":1,"id":"1036815","q":"<p>In a standardised option contract which of the following is not fixed in advance?<\/p>","o":[{"l":"A","h":"Expiry"},{"l":"B","h":"Strike"},{"l":"C","h":"Premium"},{"l":"D","h":"Security"}],"a":"C","e":"<p>In a standardised options contract, it is the premium that is not fixed in advance.<\/p>"},{"s":2,"n":2,"id":"1051971","q":"<p>When a special purpose entity (SPE) issues a security backed by cash flows from a basket of loans that have been purchased, it would be called a:<\/p>","o":[{"l":"A","h":"Credit default swap"},{"l":"B","h":"Collateralised loan obligation"},{"l":"C","h":"Total return swap"},{"l":"D","h":"Debenture"}],"a":"B","e":"<p>A CLO is a form of asset-backed security secured on a basket of loans.<\/p>"},{"s":2,"n":3,"id":"1053754","q":"<p>Which one of the following is a description of a user commodity swap?<\/p>","o":[{"l":"A","h":"The exchange of a price based on one commodity for a price based another commodity"},{"l":"B","h":"The exchange of specified quantity of a commodity for a negotiated price"},{"l":"C","h":"The exchange of a price based on a commodity for an agreed financing cost"},{"l":"D","h":"The exchange of fixed cost for a price based on a commodity"}],"a":"D","e":"<p>A commodity user will wish to fix the price that they pay for a commodity, whilst a swap will involve the exchange of cash flows not principle.<br/> Paying a fixed cost will lock in the price paid as required by a user, whereas paying away a price linked to a commodity in return for receiving a fixed amount would suit a producer.<\/p>"},{"s":2,"n":4,"id":"1079789","q":"<p>Which of the following meets the description associated with a binary option?<\/p>","o":[{"l":"A","h":"It can be exercised on one of two possible dates"},{"l":"B","h":"Holder can choose if it is exercised as a call or a put"},{"l":"C","h":"It can be structured as knock in or knock out options"},{"l":"D","h":"It pays a fixed amount or nothing at all"}],"a":"D","e":"<p>A binary option (also known as a digital option) pays a fixed amount, or nothing at all, depending on the price of the underlying instrument at maturity.<\/p>"},{"s":2,"n":5,"id":"1036767","q":"<p>Which of the following is most likely to be assigned?<\/p>","o":[{"l":"A","h":"An in-the-money put close to expiry"},{"l":"B","h":"An out-the-money call with six months remaining before expiry"},{"l":"C","h":"A call option past its expiry date"},{"l":"D","h":"An out-the-money put option at expiry"}],"a":"A","e":"<p>Assignment is the process where a writer is matched with an exercising holder. An in-the-money put could be exercised when it has very little life remaining because the interest earned on the intrinsic value may be larger than the time value it has.<\/p>"},{"s":2,"n":6,"id":"1017029","q":"<p>An investor goes long on 10 Mentha oil futures at 550Rs. The contract size is 360kgs and the oil is deliverable in 180kgs drums which cost 20Rs to rent. <br/> The investor closes out the position when the contract is trading at 575Rs. What is the profit or loss the investor makes?<\/p>","o":[{"l":"A","h":"90,000 Rs loss"},{"l":"B","h":"90,000 Rs profit"},{"l":"C","h":"54,000 loss"},{"l":"D","h":"81,000 profit"}],"a":"B","e":"<p>The profit is calculated as: <br/> Selling less buying price x no of kgs per contract x number of contracts<br/> 575 - 550 x 360kgs x 10 = 90,000 Rs profit<\/p>"},{"s":2,"n":7,"id":"1036804","q":"<p>A 'give up' occurs when:<\/p>","o":[{"l":"A","h":"The investor of a deeply out-of-the-money option abandons the option"},{"l":"B","h":"The investor of a call option sells a call option at a higher strike to give up the potential for profit beyond a certain level on a mildly bullish position"},{"l":"C","h":"A non-clearing member of the exchange allocates a trade to a general clearing member in order for the trade to be novated through ICE Clear Europe"},{"l":"D","h":"The writer of a call option buys a call option at a higher strike to limit downside above a certain underlying price"}],"a":"C","e":"<p>A Give Up is when a trade is allocated to a clearing member because the trader is a non-Clearing member.<\/p>"},{"s":2,"n":8,"id":"1036840","q":"<p>The correct calculation of the invoice amount for the cheapest to deliver (CTD) is as follows:<\/p>","o":[{"l":"A","h":"(EDSP x scale factor x price factor) - accrued interest"},{"l":"B","h":"(EDSP x scale factor x price factor) + accrued interest"},{"l":"C","h":"(EDSP x scale factor / CTD price factor)"},{"l":"D","h":"(Price of underlying x price factor x scale factor) + accrued interest"}],"a":"B","e":"<p>The invoice amount is what the long futures position pays when taking delivery of the 'cheapest to deliver' gilt. Note: The CTD is the gilt with the highest implied repo rate.<\/p>"},{"s":2,"n":9,"id":"1036782","q":"<p>All of the following may be used as collateral for margin purposes except:<\/p>","o":[{"l":"A","h":"German bunds"},{"l":"B","h":"Sterling denominated gilts"},{"l":"C","h":"Gilts denominated in euro"},{"l":"D","h":"US Treasury bonds"}],"a":"C","e":"<p>Only gilts denominated in £s are acceptable to UK Clearing houses.<\/p>"},{"s":2,"n":10,"id":"1036799","q":"<p>If the long end of the euro curve is expected to flatten what would a trader do?<\/p>","o":[{"l":"A","h":"Sell euribor futures and buy bund futures"},{"l":"B","h":"Buy euribor futures and sell bund futures"},{"l":"C","h":"Buy euribor futures and buy bund futures"},{"l":"D","h":"Sell euribor futures and sell bund futures"}],"a":"A","e":"<p>The expectation is that short term euro interest rates (like euribor) are expected to rise and longer term rates are expected to fall.<\/p>"},{"s":2,"n":11,"id":"1036791","q":"<p>Which type of margin increases as a contract approaches the end of the delivery month?<\/p>","o":[{"l":"A","h":"Maintenance"},{"l":"B","h":"Variation"},{"l":"C","h":"Spot month"},{"l":"D","h":"Buffer"}],"a":"C","e":"<p>This extra margin is designed to ensure that longs and shorts eventually honour their delivery and payment obligations.<\/p>"},{"s":2,"n":12,"id":"1055065","q":"<p>One of the main purposes of regulators is to reduce:-<\/p>","o":[{"l":"A","h":"Operational risk"},{"l":"B","h":"Systemic risk"},{"l":"C","h":"Currency risk"},{"l":"D","h":"Capital risk"}],"a":"B","e":"<p>The main purpose and aims of regulation, in all markets globally, are:-<br/> To maintain and promote the fairness, efficiency, competitiveness, transparency and orderliness of the securities and futures industry.<br/> To promote understanding by the public of the operation and functioning of the securities and futures industry.<br/> To provide protection for members of the public investing in or holding financial products.<br/> To minimise crime and misconduct in the securities and futures industry.<br/> To reduce systemic risks in the securities and futures industry.<br/> To assist in maintaining the market's financial stability by taking appropriate steps in relation to the securities and futures industry.<\/p>"},{"s":2,"n":13,"id":"1036821","q":"<p>Which of the following would cause a reduction in supply?<\/p>","o":[{"l":"A","h":"If the price of a commodity rises above the marginal cost of mining it"},{"l":"B","h":"If the price of a commodity falls to below the marginal cost of mining it"},{"l":"C","h":"If the price of a commodity rises"},{"l":"D","h":"If the price of a substitute commodity rises too high"}],"a":"B","e":"<p>If the price of a commodity falls to below the marginal cost of mining it.<\/p>"},{"s":2,"n":14,"id":"1015825","q":"<p>What adjustment is made to the calculated SPAN scanning risk to adjust for offsetting futures positions?<\/p>","o":[{"l":"A","h":"Spot month changes"},{"l":"B","h":"Variation margin"},{"l":"C","h":"Inter-commodity spread margin"},{"l":"D","h":"Short option minimum charge"}],"a":"C","e":"<p>When calculating scanning risk an adjustment is made to take account of inter-commodity spreads: e.g. long-gilt future, short-bund future. Because these two positions offset each others' risk, at least to a certain extent, the adjustment is subtracted from scanning risk. Note that inter-commodity spread margin is also called inter-commodity credit.<\/p>"},{"s":2,"n":15,"id":"1036812","q":"<p>To secure exemption under CFTC Part 30, FCA members must do all of the following except:<\/p>","o":[{"l":"A","h":"Join the NFA arbitration scheme"},{"l":"B","h":"Pay funds, the amount calculated in accordance with the size and business of the firm, into an escrow account at the NFA to cover any potential legal liabilities"},{"l":"C","h":"Provide the CFTC via the FCA with any relevant client records"},{"l":"D","h":"Send and receive back from clients the generic CFTC risk disclosures"}],"a":"B","e":"<p>CFTC Part 30 is explained in full in the Chapter Regulatory Requirements.<\/p>"},{"s":2,"n":16,"id":"1036823","q":"<p>A market participant goes long ten natural gas futures on the ICE at 18.70 pence per therm. He closes his total position out at 19.65 pence per therm. What overall profit has he made, assuming a tick size of 0.01p and a tick value of £15?<\/p>","o":[{"l":"A","h":"£9,500"},{"l":"B","h":"£14,250"},{"l":"C","h":"£40,000"},{"l":"D","h":"£47,500"}],"a":"B","e":"<p>If the tick size is 0.01p the contract moves 0.95p from 18.70 pence to 19.65 pence. If the tick value is £15, the overall profit that has been made is therefore equal to: 95 ticks x £15 x 10 contracts = £14,250.<\/p>"},{"s":2,"n":17,"id":"1036765","q":"<p>An interest rate future is currently showing a March/September spread of +25 ticks. If a trader sells the spread, which two of the following are true?<\/p><p class=\"rom\"><b>I<\/b> She sells the March future and buys September<\/p><p class=\"rom\"><b>II<\/b> She buys the March future and sells September<\/p><p class=\"rom\"><b>III<\/b> She expects the yield curve to steepen<\/p><p class=\"rom\"><b>IV<\/b> She expects the yield curve to become flatter<\/p>","o":[{"l":"A","h":"I and III"},{"l":"B","h":"I and IV"},{"l":"C","h":"II and III"},{"l":"D","h":"II and IV"}],"a":"B","e":"<p>The name of the spread trade always comes from the transaction on the near leg. The spread of +25 ticks mean that the far dated future is lower than the near (Basis (spread) = Near - Far) which means the March implied rate is lower than the September implied rate - an upward sloping yield curve. The trader is selling the higher priced future (March) expecting the spread to narrow (i.e. short term prices to drop and therefore yields to increase) and the yield curve to become flatter.<\/p>"},{"s":2,"n":18,"id":"1036760","q":"<p>An exchange will monitor a member's open interest:<\/p>","o":[{"l":"A","h":"Every few days"},{"l":"B","h":"Daily, to ensure that they may meet their delivery obligations"},{"l":"C","h":"Weekly, whenever big positions are maturing"},{"l":"D","h":"At the end of each delivery or expiry month"}],"a":"B","e":"<p>A clearing house will check the clearer's open positions (open interest) every day with respect to variation margin and initial margin.<\/p>"},{"s":2,"n":19,"id":"1036832","q":"<p>A Brent future has a contract size of 1,000 barrels. If the tick size is $0.01 what is the tick value?<\/p>","o":[{"l":"A","h":"$.01"},{"l":"B","h":"$1,000"},{"l":"C","h":"$100"},{"l":"D","h":"$10"}],"a":"D","e":"<p>Tick value = tick size x contract size. These are the real contract specifications for the Brent future.<\/p>"},{"s":2,"n":20,"id":"1036816","q":"<p>A put option where the exercise price is lower than the underlying's current value is said to be:<\/p>","o":[{"l":"A","h":"On-the-money"},{"l":"B","h":"At-the-money"},{"l":"C","h":"In-the-money"},{"l":"D","h":"Out-of-the-money"}],"a":"D","e":"<p>Put options move into the money when the price of the underlying falls below the exercise price.<\/p>"},{"s":2,"n":21,"id":"1036850","q":"<p>What is the main source of information for an exchange price feed?<\/p>","o":[{"l":"A","h":"Exchange trading systems"},{"l":"B","h":"Clearing house reports"},{"l":"C","h":"Universal Clearing Platform"},{"l":"D","h":"Member firm reports"}],"a":"A","e":"<p>Most exchanges have electronic trading systems which relay price information to the quote vendors.<\/p>"},{"s":2,"n":22,"id":"1036806","q":"<p>What should be included in the calculation of an index future's fair value?<\/p><p class=\"rom\"><b>I<\/b> Interest payments<\/p><p class=\"rom\"><b>II<\/b> Margin payments<\/p><p class=\"rom\"><b>III<\/b> Market sentiment<\/p><p class=\"rom\"><b>IV<\/b> Brokers fees<\/p>","o":[{"l":"A","h":"I only"},{"l":"B","h":"I and II"},{"l":"C","h":"I and III"},{"l":"D","h":"All of the above"}],"a":"A","e":"<p>The index future fair value will equal the cash price plus the cost of carry. The cost of the carry will be a factor of the market yield and interest payments.<\/p>"},{"s":2,"n":23,"id":"1036783","q":"<p>All of the following are used to determine the priority by which orders on Euronext Derivatives' order-driven system are executed except:<\/p>","o":[{"l":"A","h":"Price"},{"l":"B","h":"Order type"},{"l":"C","h":"Time of order"},{"l":"D","h":"Underlying"}],"a":"D","e":"<p>The underlying product is not relevant for order priority purposes.<\/p>"},{"s":2,"n":24,"id":"1036775","q":"<p>Which of the following regulates US stock indices?<\/p>","o":[{"l":"A","h":"NYSE"},{"l":"B","h":"SEC"},{"l":"C","h":"CFTC"},{"l":"D","h":"NFA"}],"a":"B","e":"<p>This is covered by the securities regulator in the US - SEC<\/p>"},{"s":2,"n":25,"id":"1036764","q":"<p>Certain exchanges allow exchange for physicals (EFP) on some of their contracts. Which of the following would NOT be a use for EFPs?<\/p>","o":[{"l":"A","h":"To swap one futures position for another futures position"},{"l":"B","h":"To swap a position in the cash for a position in the future"},{"l":"C","h":"To establish opposite positions in the cash and futures market"},{"l":"D","h":"To avoid standardised delivery but keep standardised risk management"}],"a":"A","e":"<p>In an exchange for physical transaction there must always be a physical component. Participants benefit from the risk management of the CCP while also benefiting from the flexibility of OTC trading.<\/p>"},{"s":2,"n":26,"id":"1036780","q":"<p>Paul buys a bond for £100 which subsequently rises to £105. He then sells a call option for a premium of £1 and a strike price of £105 as he does not think the price will rise any further. If the bond's price actually rises to £107 what percentage return does Paul make?<\/p>","o":[{"l":"A","h":"4%"},{"l":"B","h":"5%"},{"l":"C","h":"6%"},{"l":"D","h":"7%"}],"a":"C","e":"<p>If the bond trades at £107 the call option will be exercised against the writer (Paul).<br/> Profit on bond delivered through option = £105 - £100 = £5<br/> Premium received = £1<br/> Return = £6 / £99 = 0.0606 or 6.06%<br/> Note: the £99 is the net investment: the price of the bond minus the premium received.<\/p>"},{"s":2,"n":27,"id":"1036809","q":"<p>An investor is long five September short sterling and ten December short sterling and wants reduced margin payments. Will this be allowed?<\/p>","o":[{"l":"A","h":"Yes, as the risk is offset"},{"l":"B","h":"No margin will be required for this position"},{"l":"C","h":"No reduction will be allowed"},{"l":"D","h":"An individual margin will be payable over the individual positions."}],"a":"C","e":"<p>No reduction will be allowed since both the September and December positions are long. Therefore, the additional trade does not represent a reduction in risk.<br/> Short sterling is the nickname for the short-term interest rate futures contract.<\/p>"},{"s":2,"n":28,"id":"1053739","q":"<p>A put option with a strike of 525p is trading at 16p, whilst the underlying is trading at 550p. If the benchmark rate is 5% and the option expires in 3 months what would be the price of the call option?<\/p>","o":[{"l":"A","h":"41p"},{"l":"B","h":"66.00p"},{"l":"C","h":"17.19p"},{"l":"D","h":"47.36p"}],"a":"D","e":"<p>Put/Call parity where C - P = S - K / (1+r)^t as options on an asset not a future.<br/> Therefore:<br/> C - 16 = 550p - 525/[(1+ 0.05) ^ 0.25]<br/> C - 16 = 550p - 518.64p = 31.36p<br/> C = 31.36p + 16p = 47.36p<\/p>"},{"s":2,"n":29,"id":"1036827","q":"<p>Which of the following are true?<\/p><p class=\"rom\"><b>I<\/b> If short-term interest rates are less than the return on an underlying asset, a future will be at a discount to the cash price<\/p><p class=\"rom\"><b>II<\/b> All hedges will suffer if basis weakens<\/p><p class=\"rom\"><b>III<\/b> If you sell an intramarket spread you will benefit if cost of carry increases<\/p><p class=\"rom\"><b>IV<\/b> In a contango market cost of longer dated futures would be expected to be at a premium to short dated<\/p>","o":[{"l":"A","h":"I only"},{"l":"B","h":"I, III and IV"},{"l":"C","h":"I and II"},{"l":"D","h":"I, II, III and IV"}],"a":"B","e":"<p>Only a long hedge will benefit from basis weakening. If we assume the cash price remains constant, the long future in the hedge will be closed out by selling a future at a higher price if basis has weakened.<\/p>"},{"s":2,"n":30,"id":"1036779","q":"<p>Which of the following best describes an arbitrage trade?<\/p>","o":[{"l":"A","h":"Holding a FTSE 100 position and simultaneously buying FTSE 100 puts and selling FTSE 100 calls"},{"l":"B","h":"Buying a call in the belief the underlying will rise"},{"l":"C","h":"Buying a put in the belief prices of the underlying will fall"},{"l":"D","h":"Buying futures in a biotech company"}],"a":"A","e":"<p>Options B, C and D are all examples of speculative trades. Technically, If the synthetic position created by the options were mispriced then there would be an arbitrage opportunity. Option A is the best answer given the choices as it is conversion trade if certain perimeters are met.<\/p>"},{"s":2,"n":31,"id":"1036800","q":"<p>A trader buys four single stock futures when the price is euro 0.26 and later closes the position by selling when the price is euro 0.62. What is the profit or loss, assuming 100 shares per contract?<\/p>","o":[{"l":"A","h":"Euro 14,400 profit"},{"l":"B","h":"Euro 144 profit"},{"l":"C","h":"Euro 144 loss"},{"l":"D","h":"Euro 14,400 loss"}],"a":"B","e":"<p>62 - 26 = 36c x 100 shares x 4 contracts = 14,400c = euro 144 profit<\/p>"},{"s":2,"n":32,"id":"1053737","q":"<p>A UK firm has been trading commodity derivatives with the same client for over two years, but the activities have only come within the scope of commodity regulations in the last three months. Why might this be?<\/p>","o":[{"l":"A","h":"The firm has achieved a CFTC Part 30 Exemption"},{"l":"B","h":"The client has started trading for investment purposes"},{"l":"C","h":"The client has been reclassified as a market professional"},{"l":"D","h":"The client has started trading US based derivatives"}],"a":"B","e":"<p>The assumption is that if the client has started trading derivatives for investment purposes, then previously the trading activities related to hedging activities.<br/> Derivatives used for hedging purposes are outside the scope of MiFID, whereas derivatives used for investment purposes would be covered.<\/p>"},{"s":2,"n":33,"id":"1036753","q":"<p>A speculator seeks to go long at a level in the market below the prevailing level. Which of the following orders should she give her broker?<\/p>","o":[{"l":"A","h":"A buy MIT"},{"l":"B","h":"A buy stop"},{"l":"C","h":"A sell MIT"},{"l":"D","h":"A sell stop"}],"a":"A","e":"<p>Stop orders are orders used to close an existing position. MIT (market if touched) orders are orders that can be used to enter the market. The speculator here is only interested in opening a position if the market retraces down from its current level, an order to buy below the current level is required; a buy MIT.<\/p>"},{"s":2,"n":34,"id":"1036763","q":"<p>In addition to initial margin being charged on open positions, a clearing organisation also charges spot month margin. Which of the following best describes spot month margin?<\/p>","o":[{"l":"A","h":"A top-up to initial margin in the event of large intra-day movements in the price of the underlying"},{"l":"B","h":"A one off deposit made by the clearing member as insurance that delivery obligations are fulfilled"},{"l":"C","h":"It is an additional rate of margin to cover the risk of default during the delivery process"},{"l":"D","h":"It is margin that may be called by the clearing organisation from its members in anticipation of major events"}],"a":"C","e":"<p>Spot month margin is taken to cover the clearing organisation between the last trading day of the contract and its ultimate delivery.<\/p>"},{"s":2,"n":35,"id":"1036755","q":"<p>Which of the following is the correct definition of an FRA?<\/p>","o":[{"l":"A","h":"A forward contract that determines the rate of exchange between two currencies at some point in the future"},{"l":"B","h":"A forward contract that determines an interest rate to be paid or received on an obligation beginning at a start date sometime in the future"},{"l":"C","h":"A floating rate agreement providing for a variable rate of interest on a loan"},{"l":"D","h":"A fixed rate agreement providing for a fixed rate of interest on a loan"}],"a":"B","e":"<p>This is the correct definition of a Forward Rate Agreement.<\/p>"},{"s":2,"n":36,"id":"1036837","q":"<p>Which of the following is true of exchange traded options?<\/p>","o":[{"l":"A","h":"Options are claims on the assets of a company"},{"l":"B","h":"The value of an option at expiry could never be zero"},{"l":"C","h":"All options that are written are exercised"},{"l":"D","h":"A call option's exercise price can be above the share price"}],"a":"D","e":"<p>A call option can have a strike price above or below the cash price, this would make the option OTM and ITM respectively.<\/p>"},{"s":2,"n":37,"id":"1036796","q":"<p>If an option position is assigned who is responsible for selecting a writer?<\/p>","o":[{"l":"A","h":"The exchange"},{"l":"B","h":"The holder"},{"l":"C","h":"The clearing house"},{"l":"D","h":"The FCA"}],"a":"C","e":"<p>The clearing house randomly assign options to writers following exercise by holders.<\/p>"},{"s":2,"n":38,"id":"1036830","q":"<p>Which of the following is not true with regard to futures?<\/p>","o":[{"l":"A","h":"The choices for the seller of a future are to hold to delivery or close out their position"},{"l":"B","h":"One participant's profit in a futures market must come from another participant's loss"},{"l":"C","h":"A short futures position is closed out by selling a future"},{"l":"D","h":"A person who is holding the underlying asset would use a short hedge to reduce risk of a fall in prices"}],"a":"C","e":"<p>A short futures position is closed out by buying a future.<\/p>"},{"s":2,"n":39,"id":"1036789","q":"<p>A trader is long a June call option with a strike of 4,000 and short a September call option with a strike of 4,000. This is best described as a:<\/p>","o":[{"l":"A","h":"Vertical spread"},{"l":"B","h":"Diagonal spread"},{"l":"C","h":"Basis trade"},{"l":"D","h":"Horizontal spread"}],"a":"D","e":"<p>Horizontal spreads feature options with the same strike but different maturities.<\/p>"},{"s":2,"n":40,"id":"1036787","q":"<p>Which of the following is a benefit of OTC derivatives markets?<\/p>","o":[{"l":"A","h":"Improved liquidity"},{"l":"B","h":"Higher volumes of trading"},{"l":"C","h":"Opportunity to construct better hedges"},{"l":"D","h":"Decreased counterparty risk"}],"a":"C","e":"<p>Because OTC derivatives are bespoke, they can be used to more accurately hedge specific risks. A, B and D are advantages of exchange-traded derivatives.<\/p>"},{"s":2,"n":41,"id":"1036846","q":"<p>Which TWO of the following dates define the period of an interest rate swap?<\/p><p class=\"rom\"><b>I<\/b> The reset date<\/p><p class=\"rom\"><b>II<\/b> The payment date<\/p><p class=\"rom\"><b>III<\/b> The effective date<\/p><p class=\"rom\"><b>IV<\/b> The termination date<\/p>","o":[{"l":"A","h":"I and III"},{"l":"B","h":"I and II"},{"l":"C","h":"III and IV"},{"l":"D","h":"II and IV"}],"a":"C","e":"<p>The effective date is the date from which interest payments start to accrue; it is the beginning of the swap. The termination date is the day on which the final interest payment is to be made and is the end of the swap. Reset dates are dates throughout the life of the swap on which the new interest rate is set for the next period, payment dates are the dates throughout the swap when payment is made by one party to another.<\/p>"},{"s":2,"n":42,"id":"1036781","q":"<p>Recent inflation data released in the UK has shown inflation has risen above the Monetary Policy Committe's upper limit. Which of the following would you expect to happen to the prices of gilts and other fixed income instruments (including Treasury bills)?<\/p>","o":[{"l":"A","h":"Increase, Increase"},{"l":"B","h":"Increase, Decrease"},{"l":"C","h":"Decrease, Decrease"},{"l":"D","h":"Decrease, Increase"}],"a":"C","e":"<p>The MPC has a target of 2% with a 1% tolerance. Moving above the upper limit would suggest greater than 3%. There will therefore be an expectation that interest rates will increase to control inflation and therefore bond prices will decrease.<\/p>"},{"s":2,"n":43,"id":"1036810","q":"<p>What happens to the premium on an at-the-money put option if the price of the underlying rises?<\/p>","o":[{"l":"A","h":"No change"},{"l":"B","h":"Increase"},{"l":"C","h":"Decrease"},{"l":"D","h":"It depends on whether the premium is settled up front or on exercise"}],"a":"C","e":"<p>As the price of the underlying rises, the right to sell at a fixed price becomes less attractive, i.e. the option goes even more out-of-the money and premiums fall.<\/p>"},{"s":2,"n":44,"id":"1036849","q":"<p>Which is true of a contango market?<\/p>","o":[{"l":"A","h":"Nearby prices at a premium to forward prices"},{"l":"B","h":"Nearby prices at a discount to forward prices"},{"l":"C","h":"Nearby and forward prices are equal"},{"l":"D","h":"Bid prices are higher than ask prices"}],"a":"B","e":"<p>In a contango market near dated contracts have a lower cost of carry so a lower price than far dated contracts. Don't be put off by the unusual terminology here - nearby and forward.<\/p>"},{"s":2,"n":45,"id":"1036771","q":"<p>The invoice amount paid by the long upon delivery of a bond future would NOT be affected by which of the following?<\/p>","o":[{"l":"A","h":"The EDSP of the future on the chosen delivery date"},{"l":"B","h":"The price factor of the deliverable bond"},{"l":"C","h":"The size of the specific issue"},{"l":"D","h":"The accrued interest"}],"a":"C","e":"<p>The invoice amount for a delivered bond future is calculated as:<br/> (EDSP x Price factor x Scaling factor x No. of contracts) + Accrued interest<br/> The size of the deliverable bonds issue will not influence the invoice amount.<\/p>"},{"s":2,"n":46,"id":"1055518","q":"<p>German Bunds are currently offering a yield of 2.2% whilst Greek bonds are offering yields which are at a 2053 basis points premium to the German bunds. Calculate the yields being offered by the Greek bonds.<\/p>","o":[{"l":"A","h":"22.73%"},{"l":"B","h":"18.33%"},{"l":"C","h":"20.53%"},{"l":"D","h":"22.5%"}],"a":"A","e":"<p>Government spreads are useful to compare the risk levels between two government bonds. In this example, Greek bonds are offering higher yields as they are deemed more risky than the German bonds. 100 basis points = 1% so 2053 basis points = 20.53%, which is the premium to the German yields. So final answer = 20.53% + 2.2% = 22.73%.<\/p>"},{"s":2,"n":47,"id":"1053747","q":"<p>An investor who anticipates a change in basis would use which one of the following spreads?<\/p>","o":[{"l":"A","h":"Horizontal"},{"l":"B","h":"Diagonal"},{"l":"C","h":"Vertical Bull"},{"l":"D","h":"Vertical Bear"}],"a":"A","e":"<p>Horizontal is the best answer, although it would normally be associated with capturing a change in volatility, which could impact basis.<br/> Vertical &amp; diagonal spreads are directional in nature, i.e. profit from falling or rising markets.<\/p>"},{"s":2,"n":48,"id":"1017011","q":"<p>Which of the following would allow a non-US firm to trade on behalf of a US client on the London markets without having to register with the US authorities?<\/p>","o":[{"l":"A","h":"CFTC part 30 exemption"},{"l":"B","h":"NASD"},{"l":"C","h":"Sec 144A"},{"l":"D","h":"Sec 15-A"}],"a":"A","e":"<p>A part 30 exemption would allow this.<br/> Sec144A and Sec15-A are rules regarding securities investment and NASD stands for National Association of Securities Dealers.<\/p>"},{"s":2,"n":49,"id":"1053744","q":"<p>An investor enters into the following trade. They buy a put with a strike of $700 with a premium of $16 and sell a put with a strike of $760 with a premium of $38<br/> What is the maximum loss the investor could face?<\/p>","o":[{"l":"A","h":"$38"},{"l":"B","h":"$22"},{"l":"C","h":"$16"},{"l":"D","h":"$54"}],"a":"A","e":"<p>The investor has created a Bull-Put Spread<br/> Maximum Loss = Difference in Strikes - Net Premium = (760-700) - (38-16) = 60-22 = $38<br/> The maximum reward is the Net Premium Received.<\/p>"},{"s":2,"n":50,"id":"1036843","q":"<p>Which two of the following would receive the underlying upon exercise of the option?<\/p><p class=\"rom\"><b>I<\/b> Long call<\/p><p class=\"rom\"><b>II<\/b> Short put<\/p><p class=\"rom\"><b>III<\/b> Long put<\/p><p class=\"rom\"><b>IV<\/b> Short call<\/p>","o":[{"l":"A","h":"I and II"},{"l":"B","h":"I and III"},{"l":"C","h":"III and IV"},{"l":"D","h":"II and IV"}],"a":"A","e":"<p>If you buy the right to buy (long call) or sell the right to sell (short put), you may take delivery of the underlying.<\/p>"},{"s":2,"n":51,"id":"1072240","q":"<p>Which of the following is a characteristic of a block trade?<\/p>","o":[{"l":"A","h":"Exchange will not provide a quotation of price"},{"l":"B","h":"Exchange will not provide a quotation of size"},{"l":"C","h":"The counterparty is able to choose a reasonable price"},{"l":"D","h":"Transactions can be completed without delay and with certainty of price and execution"}],"a":"D","e":"<p>A block trade is a large transaction made between an exchange member and a wholesale client. The exchange specifies the size of the transaction that is required before it becomes a block trade. Block trades are allowed to be negotiated away from the central order book as long as they are reported into the exchange once they are agreed.<\/p>"},{"s":2,"n":52,"id":"1036786","q":"<p>Which of the following statements is TRUE?<\/p>","o":[{"l":"A","h":"Gamma is greatest for a deeply out-of-the-money put option close to expiry"},{"l":"B","h":"Gamma is greatest for an at-the-money put option that is far dated"},{"l":"C","h":"Gamma is greatest for a deeply in-the-money put option close to expiry"},{"l":"D","h":"Gamma is greatest for an at-the-money put option close to expiry"}],"a":"D","e":"<p>Gamma, which measures the rate of change of the delta, is greatest for options (put and call) that are at- or near-money and close to expiry.<\/p>"},{"s":2,"n":53,"id":"1036826","q":"<p>An investor believes that there will be a sharp move in an asset, either up or down, and wants to take advantage of this volatility. What is the most appropriate strategy to adopt?<\/p>","o":[{"l":"A","h":"Sell two calls, out-the-money"},{"l":"B","h":"Sell a call/sell a put, both out-the-money"},{"l":"C","h":"Buy two puts, both in-the-money"},{"l":"D","h":"Buy a call/buy a put, both at-the-money"}],"a":"D","e":"<p>The most appropriate strategy would be to buy a call and a put, at-the-money. This is also known as a straddle. If the market moves strongly in either direction, the holder of this strategy can make money as long as the profit exceeds the initial premium outlay.<\/p>"},{"s":2,"n":54,"id":"1036805","q":"<p>An investor buys 300 BP 430p call options at 15p. What will be the premium paid assuming each contract represents 1,000 shares?<\/p>","o":[{"l":"A","h":"£45"},{"l":"B","h":"£4,500"},{"l":"C","h":"£45,000"},{"l":"D","h":"£64,500"}],"a":"C","e":"<p>Total premium paid = Premium x contract size x No. of contracts<br/> = 15p x 1,000 x 300 = £45,000<\/p>"},{"s":2,"n":55,"id":"1036813","q":"<p>Which of the following statements regarding tick value is incorrect?<\/p>","o":[{"l":"A","h":"It may be calculated by multiplying contract size by tick size"},{"l":"B","h":"The profit or loss on a single futures contract as the result of a one tick movement"},{"l":"C","h":"It is a value specified by the exchange that the contract trades on"},{"l":"D","h":"It is the unit used to express ICE Future Europe's options on futures strike prices"}],"a":"D","e":"<p>ICE Future Europe's Long Gilt Future has a contract size of £100,000 nominal and a tick size of £0.01 per £100 nominal. The tick value is therefore £10 per tick per contract. D refers to the tick size.<\/p>"},{"s":2,"n":56,"id":"1065076","q":"<p>The primary purpose for the issuance of UK government bonds is to finance what?<\/p>","o":[{"l":"A","h":"PSCD"},{"l":"B","h":"Excess spending"},{"l":"C","h":"CGO"},{"l":"D","h":"DMO"}],"a":"B","e":"<p>The official term for annual excess government spending is the Public Sector Net Cash Requirement (PSNCR).<\/p>"},{"s":2,"n":57,"id":"1036852","q":"<p>Which of the following would not ensure that a derivative's position was closed out if the market hit a particular level?<\/p>","o":[{"l":"A","h":"Stop loss"},{"l":"B","h":"Market"},{"l":"C","h":"Stop"},{"l":"D","h":"MIT"}],"a":"B","e":"<p>A market order is an at best order and will only close out a position if the investor gives the broker instructions to do so. The others can all be used to close out a position automatically if the market hits a particular level. MIT orders are generally used to open positions.<\/p>"},{"s":2,"n":58,"id":"1036794","q":"<p>Which of the following creates a synthetic short futures position?<\/p>","o":[{"l":"A","h":"Holding a call option and writing a put option"},{"l":"B","h":"Holding a put option and writing a call option"},{"l":"C","h":"Holding the underlying and writing a call option"},{"l":"D","h":"Selling the underlying and holding a put option"}],"a":"B","e":"<p>Assuming the two options have the same strike the asset will be delivered at the strike price whatever the market does. This is synthetically like being short a future.<\/p>"},{"s":2,"n":59,"id":"1036819","q":"<p>For which of the following transactions will margin always be paid?<\/p><p class=\"rom\"><b>I<\/b> Buying futures<\/p><p class=\"rom\"><b>II<\/b> Long options position<\/p><p class=\"rom\"><b>III<\/b> Short options position<\/p><p class=\"rom\"><b>IV<\/b> Selling futures<\/p>","o":[{"l":"A","h":"I and IV"},{"l":"B","h":"II and III"},{"l":"C","h":"I, III, IV"},{"l":"D","h":"I, II, III, IV"}],"a":"C","e":"<p>Margin is not paid by long equity option positions as the premium is paid in full the business day after the trade.<\/p>"},{"s":2,"n":60,"id":"1036807","q":"<p>What is shown on electronic/screen based trading systems?<\/p>","o":[{"l":"A","h":"Current bid/offer"},{"l":"B","h":"Best bid/offer"},{"l":"C","h":"Details of the days trades"},{"l":"D","h":"Best three bid/offer prices"}],"a":"B","e":"<p>The assumption is that the question is referring to a Level I screen, which shows the best bid and offer currently available.<\/p>"},{"s":2,"n":61,"id":"1015778","q":"<p>How does a clearing house determine the level of a member's contribution to the member default fund?<\/p>","o":[{"l":"A","h":"According to the financial weight of the member"},{"l":"B","h":"According to the volume of trades and initial margin requirements of the member"},{"l":"C","h":"According to the credit rating of the member"},{"l":"D","h":"According to the financial record of the member"}],"a":"B","e":"<p>The actual calculation is very detailed and complex but the level of business of the member is a key determinant of the required contribution to the default fund.<\/p>"},{"s":2,"n":62,"id":"1053734","q":"<p>There is a severe frost in Brazil. The likely impact on coffee would be:<\/p>","o":[{"l":"A","h":"Prices will increase"},{"l":"B","h":"Prices will decrease"},{"l":"C","h":"Prices will be unaffected"},{"l":"D","h":"Prices will either increase or decrease"}],"a":"A","e":"<p>Brazil is an exporter of coffee. Therefore a severe (hard) frost will impact on the crop, reducing the amount produced. If supply is reduced, but demand remains the same, then prices will increase.<\/p>"},{"s":2,"n":63,"id":"1036756","q":"<p>Which of the following situations provides an opportunity for arbitrage to occur? <br/> The following information is relevant: Cash asset trading at £500. Financing, insurance and storage costs at £50 per month.<\/p><p class=\"rom\"><b>I<\/b> Three-month future at £660<\/p><p class=\"rom\"><b>II<\/b> Five-month future at £700<\/p><p class=\"rom\"><b>III<\/b> Six-month future at £800<\/p><p class=\"rom\"><b>IV<\/b> Nine-month future at £950<\/p>","o":[{"l":"A","h":"I and II"},{"l":"B","h":"I and III"},{"l":"C","h":"III and IV"},{"l":"D","h":"II and III"}],"a":"A","e":"<p>FV of 3m = 500 + (3 x £50) = £650. FV of 5m = 500 + (5 x £50) = £750. FV of 6m = 500 + (6 x £50) = £800. FV of 9m = (500 x 9 x £50) = £950. An arbitrage opportunity therefore exists in I and II.<\/p>"},{"s":2,"n":64,"id":"1036785","q":"<p>A small bank owns a brokerage house that is a clearing member of an exchange. If the brokerage house defaults on  futures, who is immediately responsible?<\/p>","o":[{"l":"A","h":"The clearing house"},{"l":"B","h":"The bank"},{"l":"C","h":"The broker"},{"l":"D","h":"Other members of the clearing house"}],"a":"A","e":"<p>The clearing house is the counterparty, and is immediately responsible. The clearing house will later deal with the defaulter and go to other members, if necessary. Remember, the general hierarchy is that the clearing house will recover default amounts from the clearing member first, and then go to other clearing members and then use its own funds.<\/p>"},{"s":2,"n":65,"id":"1036838","q":"<p>Futures spread margin is lower than initial margin rates because:<\/p>","o":[{"l":"A","h":"The potential losses are known beforehand on a spread trade"},{"l":"B","h":"The perceived risk of a spread is lower than a normal trade"},{"l":"C","h":"Futures spreads always increase in bull markets and decrease in bear markets"},{"l":"D","h":"If a spread order cannot be executed with one trade it may be declared void by the clearing house"}],"a":"B","e":"<p>The risk of a spread is lower than two separate open long and open short positions. Thus, margin requirements are lower for the spread.<\/p>"},{"s":2,"n":66,"id":"1065135","q":"<p>Which of the following would explain the change in an option's premium as a result of increasing interest rates and assuming all other things remain constant?<\/p>","o":[{"l":"A","h":"It will increase the value of calls and increase the value of puts"},{"l":"B","h":"It will increase the value of calls and decrease the value of puts"},{"l":"C","h":"It will decrease the value of calls and decrease the value of puts"},{"l":"D","h":"It will decrease the value of calls and increase the value of puts"}],"a":"B","e":"<p>An increase in interest rates will increase the value of calls and decrease the value of puts, while a drop in interest rates will have the opposite effect. The longer the time to expiration, the higher an option's rho. At-the-money and in-the-money options have relatively higher rho.<\/p>"},{"s":2,"n":67,"id":"1036790","q":"<p>Which of the following best describes gearing in the context of futures?<\/p>","o":[{"l":"A","h":"The proportion of funding which is debt rather than equity"},{"l":"B","h":"The uncertain outcome associated with buying and selling futures"},{"l":"C","h":"The ability to make large profits or losses from relatively small initial margin requirements"},{"l":"D","h":"The variability of returns from a futures position"}],"a":"C","e":"<p>Note that A describes gearing from an accounting, rather than derivatives, perspective.<\/p>"},{"s":2,"n":68,"id":"1052126","q":"<p>If a call has a strike of 120, is trading at 20, and the underlying is currently at 110, what would be the price of the put?<\/p>","o":[{"l":"A","h":"10"},{"l":"B","h":"20"},{"l":"C","h":"30"},{"l":"D","h":"40"}],"a":"C","e":"<p>Using put-call-parity of call - put = spot - strike = C - P = S - X<br/> Rearrange to get: <br/> P = C - S + X = 20 - 110 + 120 = 30.<\/p>"},{"s":2,"n":69,"id":"1036834","q":"<p>Which of the following is true concerning US T-bonds?<\/p><p class=\"rom\"><b>I<\/b> They settle T+1<\/p><p class=\"rom\"><b>II<\/b> They settle T+2<\/p><p class=\"rom\"><b>III<\/b> They are not issued with a zero coupon<\/p><p class=\"rom\"><b>IV<\/b> They are issued with a zero coupon<\/p>","o":[{"l":"A","h":"I and II"},{"l":"B","h":"I and III"},{"l":"C","h":"II and III"},{"l":"D","h":"II and IV"}],"a":"B","e":"<p>They settle T+1. They are not issued as zero coupon bonds although they may subsequently be stripped into zero coupon bonds.<\/p>"},{"s":2,"n":70,"id":"1036836","q":"<p>George is uncertain over the direction of interest rates but wants to hedge against an increase in the borrowing rate on a loan he took out three months ago. Which of the following is the most suitable position to adopt (using options on interest rate futures)?<\/p>","o":[{"l":"A","h":"Buy futures"},{"l":"B","h":"Buy calls"},{"l":"C","h":"Buying puts"},{"l":"D","h":"Write calls"}],"a":"C","e":"<p>As interest rates increase, the price of interest rate futures goes down. In other words there is an inverse relationship between the interest rates and the price of interest rate futures. It therefore follows that the value of put options (they are priced like the futures) on interest rates would go up as interest rates increase and this would act as a hedge in this example.<\/p>"},{"s":2,"n":71,"id":"1036754","q":"<p>Which of the following best describes a swaption?<\/p>","o":[{"l":"A","h":"An OTC option on a swap where the buyer has the right, but not the obligation, to swap one interest rate for another"},{"l":"B","h":"An exchange-traded option on a swap where the buyer has the right, but not the obligation, to swap one interest rate for another"},{"l":"C","h":"An OTC option on a swap where the buyer has the right and the obligation to swap one interest rate for another"},{"l":"D","h":"An OTC option on a swap where the buyer has the obligation to swap one interest rate for another"}],"a":"A","e":"<p>A swaption is simply an option on a swap contract. They are over-the-counter products rather than exchange-traded.<\/p>"},{"s":2,"n":72,"id":"1036772","q":"<p>A fund manager has a portfolio of FTSE 100 equities worth £10m when the FTSE 100 is at 5,200. The tick value on the option contract is £5 per half index point. How many 5,250 puts would the fund manager need to buy to hedge?<\/p>","o":[{"l":"A","h":"190"},{"l":"B","h":"192"},{"l":"C","h":"1,904"},{"l":"D","h":"1,924"}],"a":"A","e":"<p>The number of options required to hedge is calculate using:<br/> Value of portfolio / (put strike x Value per point of option)<br/> In this case:<br/> £10m / (5,250 x £10) = 190.5 or 190 contracts<\/p>"},{"s":2,"n":73,"id":"1065136","q":"<p>An investor is looking to close out their long position should prices fall below a specified price, but also wish to restrict the price at which they are content to sell but are happy to accept a better price. As their broker, which of the following order types would be entered into the exchange to achieve their aims?<\/p>","o":[{"l":"A","h":"Stop order"},{"l":"B","h":"Limit order"},{"l":"C","h":"Stop limit order"},{"l":"D","h":"Fill order"}],"a":"C","e":"<p>This is designed to limit trading losses. A stop is primarily used to close out a position if the price moves against the trader. The stop is triggered when the market trades at the stipulated price. However, there is no guarantee that the order will be filled at the stop price. In volatile markets it might not be possible to obtain that price, so it can be filled at any price once it is triggered. By adding a limit price this order stipulates two prices within which the stop order operates. Once the stop price is reached, a stop limit order becomes a limit order that will be executed at a specified price (or better).<\/p>"},{"s":2,"n":74,"id":"1016996","q":"<p>An underlying asset is trading at $31<br/> Interest rates are 10% p/a<br/> The three-month call and put options with strike prices of $30 are trading at $3 and $1.<br/> What trade should an arbitrageur undertake?<\/p>","o":[{"l":"A","h":"Sell the underlying, buy a call and sell a put with the same strike and same underlying asset"},{"l":"B","h":"Buy the underlying, sell a put and buy a call with the same strike and the same underlying asset"},{"l":"C","h":"Buy the underlying, buy a put and sell a call with the same strike and same underlying asset"},{"l":"D","h":"Sell the underlying and buy a put and sell a call with the same strike and same underlying asset"}],"a":"C","e":"<p>Using put-call parity the fair value of the underlying can be calculated as follows: C - P = S - K / (1 + r)^t , rearrange to C - P + K /(1 + r)^t = S<\/p><p>$3 - $1 + $30 / 1.1^0.25 = $31.29<\/p><p>Therefore the fair value of the underlying is $31.29, whereas it is trading at $31. So an arbitrageur would buy the underlying and sell the synthetic future (long put and short call).<\/p>"},{"s":2,"n":75,"id":"1055088","q":"<p>The holder of a preference share would not:<\/p>","o":[{"l":"A","h":"Usually receive a fixed dividend."},{"l":"B","h":"Have priority over ordinary shares in the event of liquidation"},{"l":"C","h":"Have pre-emption rights"},{"l":"D","h":"Have both cumulative and participating rights."}],"a":"C","e":"<p>Preference shares do not have pre-emption rights all the others are true.<\/p>"},{"s":2,"n":76,"id":"1072193","q":"<p>Which term is used to indicate the price used when a position is closed out, the price used at delivery or to settle a position in cash upon expiry of the contract?<\/p>","o":[{"l":"A","h":"ESP (Exchange Settlement Price)"},{"l":"B","h":"EDSP (Exchange Delivery Settlement Price)"},{"l":"C","h":"EFPP (Exchange For Physical Price)"},{"l":"D","h":"EP (Estimated Price)"}],"a":"B","e":"<p>This is the price used to calculate profit or loss when a position is closed out or used as the invoice price when futures contracts reach their expiry.<\/p>"},{"s":2,"n":77,"id":"1036761","q":"<p>On ICE Futures Europe what is meant by allocation?<\/p>","o":[{"l":"A","h":"It is the process of attributing times to executed trades"},{"l":"B","h":"It is the facility by which the trade is automatically transferred to the allocated broker's back office system"},{"l":"C","h":"The recording, and paying of, commission to the broker at the end of each month"},{"l":"D","h":"It is the facility by which a trade is given up to a designated global clearer"}],"a":"D","e":"<p>A give up, or allocation is the process by which a global clearer processes trades. Global clearing is the channelling of the settlement of all derivatives trade by a client through a single counterparty (the global clearer).<\/p>"},{"s":2,"n":78,"id":"1036770","q":"<p>Which of the following is an advantage of pooled funds?<\/p>","o":[{"l":"A","h":"Dilution levy"},{"l":"B","h":"No charges"},{"l":"C","h":"Geographical diversification"},{"l":"D","h":"Investor has direct control over their investment"}],"a":"C","e":"<p>Pooled funds are small collective schemes. An advantage is that the small investor may achieve diversification reasonably cheaply. Dilution levy is charge to an investor when they redeem many units or shares.<\/p>"},{"s":2,"n":79,"id":"1055076","q":"<p>Which of these is true for London?<\/p>","o":[{"l":"A","h":"There is a central exchange for trading foreign currency."},{"l":"B","h":"Derivative trades are subject to the Dodd-Frank Act."},{"l":"C","h":"Cleared derivative trades are subject to standard portfolio analysis of risk."},{"l":"D","h":"US firms must get a CFTC 30 exemption to trade."}],"a":"C","e":"<p>SPAN is used to calculate margin on cleared derivatives trades. There is no central exchange for FOREX in the UK. The Dodd-Frank Act and CFTC 30 both apply in relation to the US.<\/p>"},{"s":2,"n":80,"id":"1036768","q":"<p>Which of the following option strategies is NOT a spread?<\/p>","o":[{"l":"A","h":"Buy 100 March call and sell 120 March call"},{"l":"B","h":"Buy 100 March put and sell 100 June put"},{"l":"C","h":"Buy 100 March call and sell June 120 call"},{"l":"D","h":"Sell June 100 call and buy June 100 put"}],"a":"D","e":"<p>Selling a call and buying a put with the same strike is a synthetic short position.<\/p>"},{"s":2,"n":81,"id":"1036829","q":"<p>On which of the following systems do Euronext's commodity products, such as white sugar, trade?<\/p>","o":[{"l":"A","h":"Select"},{"l":"B","h":"Optiq"},{"l":"C","h":"FLEX"},{"l":"D","h":"SETS"}],"a":"B","e":"<p>Select is used by the London Metals Exchange<\/p><p>SETS is an automated share dealing system used on the LSE.<\/p><p>FLEX is a facility that allows exchange traded option to have more flexibility in terms.<\/p>"},{"s":2,"n":82,"id":"1036817","q":"<p>It is the 10th February and a client wants to deal in traded options. If the client feels the price of a share will not move away from its current level of £1.20 which of the following trades would you recommend?<\/p>","o":[{"l":"A","h":"Buy March £1.20 calls"},{"l":"B","h":"Buy a March £1.20 straddle"},{"l":"C","h":"Buy a March £1.20 put"},{"l":"D","h":"Sell a March £1.20 straddle"}],"a":"D","e":"<p>A and C are speculative trades; they require the share to move in order to make a profit. As the client believes the stock price will stay the same, he should be advised to sell the March straddle (as this is a stability trade). Note: Buying a straddle is a volatility trade.<\/p>"},{"s":2,"n":83,"id":"1036851","q":"<p>The maximum movement in price between the end of one settlement day and the next would be known as:<\/p>","o":[{"l":"A","h":"The spread"},{"l":"B","h":"The intraday range"},{"l":"C","h":"The premium"},{"l":"D","h":"Basis"}],"a":"B","e":"<p>A common sense answer.<\/p>"},{"s":2,"n":84,"id":"1036833","q":"<p>How often is variation margin applied on ICE?<\/p>","o":[{"l":"A","h":"Daily"},{"l":"B","h":"Hourly"},{"l":"C","h":"Weekly"},{"l":"D","h":"At the end of each trade"}],"a":"A","e":"<p>Variation margin is always applied daily for losses and normally daily for gains. On the LME it is applied at the end of the contract for gains.<\/p>"},{"s":2,"n":85,"id":"1036784","q":"<p>Which of the following is a bull put spread?<\/p>","o":[{"l":"A","h":"Long a Sept 110 put and short a June 100 put"},{"l":"B","h":"Long a Sept 110 put and short a Sept 130 put"},{"l":"C","h":"Short a Sept 110 call and long a Sept 120 put"},{"l":"D","h":"Long a Sept 130 put and short a Sept 110 put"}],"a":"B","e":"<p>A is a diagonal spread, and D is a bear put spread. A bull put spread involves longing a put with lower strike and shorting a put with higher strike, both of the same expiry.<\/p>"},{"s":2,"n":86,"id":"1036847","q":"<p>Richmond is a fully invested investor who believes that the UK equity market is likely to fall in value. Richmond is considering a derivative strategy that would capitalise on this event but is concerned of incurring a large unexpected loss. He would, however, consider losing his initial stake as the price of the risk he is prepared to take on. Which of the following is the most suitable strategy?<\/p>","o":[{"l":"A","h":"Selling a FTSE 100 future"},{"l":"B","h":"Buying a FTSE 100 future"},{"l":"C","h":"Buying a call option on the FTSE 100 index"},{"l":"D","h":"Buying a put option on the FTSE 100 index"}],"a":"D","e":"<p>Buying/selling futures is not suitable as potentially large losses can be incurred. Buying a call option is suitable if it is believed the market will rise. Option D is the most suitable as the strategy will make money in a falling market. If the market rises, however, Richmond will only lose his initial stake - the put option premium.<\/p>"},{"s":2,"n":87,"id":"1036822","q":"<p>Copper is traded on which of the following exchanges?<\/p>","o":[{"l":"A","h":"LME"},{"l":"B","h":"ICE Futures Europe"},{"l":"C","h":"Euronext Derivatives"},{"l":"D","h":"LSE Derivatives"}],"a":"A","e":"<p>The contract size for LME's copper contract is for 25 tonnes. Note that copper is also traded on COMEX.<br/> ICE is known for trading energy contracts, financials and agriculturals. Euronext derivatives trades financial and soft agriculturals and LSE Derivatives trades financials.<\/p>"},{"s":2,"n":88,"id":"1057003","q":"<p>Which event will have a greater impact on the forward BID/OFFER spread between GBP/EUR?<\/p>","o":[{"l":"A","h":"An increase in GDP of 2%"},{"l":"B","h":"A decrease in the UK trade deficit of 1%"},{"l":"C","h":"An increase in the UK interest rates of 0.5%"},{"l":"D","h":"A decrease in the budget surplus of 0.5%"}],"a":"C","e":"<p>The percentage movements are irrelevant to this question. The question is highlighting that the forwards spreads are determined through interest rate parity, so interest rates would impact this spread.<\/p>"},{"s":2,"n":89,"id":"1036845","q":"<p>Which of the following are true regarding convertible bonds issued by a corporation?<\/p>","o":[{"l":"A","h":"They are a high-risk method of gaining exposure to the company's share price"},{"l":"B","h":"They are bonds that carry the right to convert into a longer dated bond"},{"l":"C","h":"Investors will receive a yield premium for the risk of conversion"},{"l":"D","h":"They are a low-risk method of gaining exposure to the company's share price"}],"a":"D","e":"<p>Convertible bonds represent a low risk way of gaining exposure to the share price because if the share price falls the holder will still have the bond.<\/p>"},{"s":2,"n":90,"id":"1036777","q":"<p>Which of the following deliverables is the cheapest-to-deliver?<\/p><ul> <li><p>8% Treasury with an implied repo rate of 6.7%.<\/p><\/li> <li><p>8.5% Treasury with an implied repo rate of 6.3%.<\/p><\/li> <li><p>6% Exchequer with an implied repo rate of 6.9%.<\/p><\/li> <li><p>6.5% Treasury with an implied repo rate of 6.4%.<\/p><\/li> <\/ul>","o":[{"l":"A","h":"6.5% Treasury"},{"l":"B","h":"8.5% Treasury"},{"l":"C","h":"6% Exchequer"},{"l":"D","h":"8% Treasury"}],"a":"C","e":"<p>The cheapest-to-deliver is the gilt with the HIGHEST implied repo rate.<\/p>"},{"s":2,"n":91,"id":"1065077","q":"<p>Which of the following best describes a bond where individual cash flows can be traded separately?<\/p>","o":[{"l":"A","h":"Zero coupon"},{"l":"B","h":"Convertible"},{"l":"C","h":"Callable"},{"l":"D","h":"Strippable"}],"a":"D","e":"<p>For example a 10 year Gilt could be stripped into 21 individual cash flows and each cash flow sold as a separate instrument (i.e. zero coupon bonds).<\/p>"},{"s":2,"n":92,"id":"1079786","q":"<p>An investor would like to purchase an option which gives them the right to buy or sell another option. Which would be a suitable choice?<\/p>","o":[{"l":"A","h":"A bermudan option"},{"l":"B","h":"A compound option"},{"l":"C","h":"A chooser option"},{"l":"D","h":"A binary option"}],"a":"B","e":"<p>A bermudan option is an option (call or put) where early exercise is restricted to certain dates during its life.<br/> A chooser option allows the holder to decide whether the option is a call or a put at a pre-determined time during it's life.<br/> A binary option (also known as a digital option) pays a fixed amount, or nothing at all, depending<br/> on the price of the underlying instrument at maturity.<\/p>"},{"s":2,"n":93,"id":"1036825","q":"<p>Which of the following are true of the London FX market?<\/p><p class=\"rom\"><b>I<\/b> Spot rates are quoted as bid-offer spreads<\/p><p class=\"rom\"><b>II<\/b> Trading takes place in one central location in London<\/p><p class=\"rom\"><b>III<\/b> Spot contract settlement is T+2<\/p><p class=\"rom\"><b>IV<\/b> Trading of FX derivatives in London is OTC<\/p>","o":[{"l":"A","h":"I, II, III and IV"},{"l":"B","h":"I, II and III"},{"l":"C","h":"I, III and IV"},{"l":"D","h":"I and II"}],"a":"C","e":"<p>Forward contracts for foreign exchange traded in London are OTC contracts.<\/p>"},{"s":2,"n":94,"id":"1055229","q":"<p>Which statement would be correct if current share price is 85?<\/p><p><img src=\"data:image/gif;base64,R0lGODdh4AHwAHcAACH+GlNvZnR3YXJlOiBNaWNyb3NvZnQgT2ZmaWNlACwAAAAA4AHwAIf///97e3tzc3O1tb0xIVJSQnMhCEqEhHulraVajOa9Y0KEY0K9YxCEYxBKGVrOzt5KGRDOzs4InOYI3uZajKVazqUZzmOECN4ZjGOECJwZSpzm1t4ZCFq9zqXFlKWEnFoQGRDF7+ZKSpyMlOZarebvnJRa7+ZKGTG9nHNazua9nFJKKZy972O93jG9nDG976VKa5yM76VKCJyMzqWEhKWUre9CKcUhKcVSa2PvlObv3pQZShAQIVoQEDHv3u/va97va1rvKd7vKVrva5zvaxnvKZzvKRnvnLXvrVrvrRnvSt7vSlrvCN7vCFrvSpzvShnvCJzvCBnvjFrvjBnmtd5KShAxEFoZSs6UY2ulzuaEa87v3mu9OmtKKe+9Oinv3rXv3imEOmuEOim9EGu9ECmEEGuEECkZSjFS7xBSrRAZ7xAZrRApSmOMznOM7xCMrRCMraUZaxDv3kq9Okq9Ogjv3giEOkqEOgi9EEq9EAiEEEqEEAhSzh
