"h":"bear put spread"}],"a":"B","e":"<p><strong>Answer: B<\/strong><\/p><p>Syllabus reference: <strong>8.3.3<\/strong> (élément 8, sous-élément 8.3, learning objective 8.3.3)<\/p>"},{"s":8,"n":67,"id":"Syllabus 8.3.4","q":"<p>If you simultaneously sell a call with a strike of 260p and sell a put with a strike of 240p on the stock of XYZ plc with the same expiration month, what is the resulting position usually called?<\/p>","o":[{"l":"A","h":"Long straddle"},{"l":"B","h":"Long strangle"},{"l":"C","h":"Short straddle"},{"l":"D","h":"Short strangle"}],"a":"D","e":"<p><strong>Answer: D<\/strong><\/p><p>Syllabus reference: <strong>8.3.4<\/strong> (élément 8, sous-élément 8.3, learning objective 8.3.4)<\/p>"},{"s":8,"n":68,"id":"Syllabus 8.4.4","q":"<p>An equity portfolio's beta, which was calculated for hedging purposes, will normally be:<\/p>","o":[{"l":"A","h":"the mean of the highest and lowest betas of the individual shares"},{"l":"B","h":"the weighted average of the individual betas of all the shares"},{"l":"C","h":"the highest beta of all the individual shares"},{"l":"D","h":"the lowest beta of all the individual shares"}],"a":"B","e":"<p><strong>Answer: B<\/strong><\/p><p>Syllabus reference: <strong>8.4.4<\/strong> (élément 8, sous-élément 8.4, learning objective 8.4.4)<\/p>"},{"s":8,"n":69,"id":"Syllabus 8.4.5","q":"<p>When taking a short position in a futures contract combined with an equal long position in the cash market, an investor is exposed to which type of risk?<\/p>","o":[{"l":"A","h":"Mismatch"},{"l":"B","h":"Interest rate"},{"l":"C","h":"Basis"},{"l":"D","h":"Credit"}],"a":"C","e":"<p><strong>Answer: C<\/strong><\/p><p>Syllabus reference: <strong>8.4.5<\/strong> (élément 8, sous-élément 8.4, learning objective 8.4.5)<\/p>"},{"s":8,"n":70,"id":"Syllabus 8.4.6","q":"<p>In order to create a delta neutral portfolio, a long underlying position can be hedged by a short:<\/p>","o":[{"l":"A","h":"at-the-money call"},{"l":"B","h":"at-the-money put"},{"l":"C","h":"deep-in-the-money call"},{"l":"D","h":"deep-in-the-money put"}],"a":"C","e":"<p><strong>Answer: C<\/strong><\/p><p>Syllabus reference: <strong>8.4.6<\/strong> (élément 8, sous-élément 8.4, learning objective 8.4.6)<\/p>"},{"s":8,"n":71,"id":"Syllabus 8.5.1","q":"<p>Which of the following is an advantage of using an OTC derivative over an exchange traded one?<\/p>","o":[{"l":"A","h":"Reduced credit risk"},{"l":"B","h":"Flexible maturity dates"},{"l":"C","h":"Increased market liquidity"},{"l":"D","h":"Standardised contract sizes"}],"a":"B","e":"<p><strong>Answer: B<\/strong><\/p><p>Syllabus reference: <strong>8.5.1<\/strong> (élément 8, sous-élément 8.5, learning objective 8.5.1)<\/p>"},{"s":8,"n":72,"id":"Syllabus 8.3.5","q":"<p>You have created a bull call spread through a purchase of a call with strike 80 for 6p and a sale of a call with strike 90 for 2p (both options have the same expiry date).<\/p><p>What is the maximum loss you would incur in this position?<\/p>","o":[{"l":"A","h":"2p"},{"l":"B","h":"4p"},{"l":"C","h":"6p"},{"l":"D","h":"10p"}],"a":"B","e":"<p><strong>Answer: B<\/strong><\/p><p>Syllabus reference: <strong>8.3.5<\/strong> (élément 8, sous-élément 8.3, learning objective 8.3.5)<\/p>"},{"s":8,"n":73,"id":"Syllabus 8.4.1","q":"<p>A fund manager decides that his UK fund is overweight in equities and underweight in Government Bonds. He decides to redress the balance by using futures.<\/p><p>Which of the following courses of action would be the MOST appropriate for him to take?<\/p>","o":[{"l":"A","h":"Buy long UK government bond futures and buy FTSE 100 index futures"},{"l":"B","h":"Buy long UK government bond futures and sell FTSE 100 index futures"},{"l":"C","h":"Sell long UK government bond futures and sell FTSE 100 index futures"},{"l":"D","h":"Sell long UK government bond futures and buy FTSE 100 index futures"}],"a":"B","e":"<p><strong>Answer: B<\/strong><\/p><p>Syllabus reference: <strong>8.4.1<\/strong> (élément 8, sous-élément 8.4, learning objective 8.4.1)<\/p>"},{"s":8,"n":74,"id":"Syllabus 8.4.2","q":"<p>A bond fund manager holds GBP 33,000,000 nominal of the cheapest to deliver (CTD) bond. The price factor of the CTD is 0.83 and the contract size of the future is 100,000. He fears that interest rates will rise.<\/p><p>What should he do in order to hedge his position?<\/p>","o":[{"l":"A","h":"Sell 274 long UK government bond future contracts"},{"l":"B","h":"Sell 330 long UK government bond future contracts"},{"l":"C","h":"Sell 398 long UK government bond future contracts"},{"l":"D","h":"Buy 330 long UK government bond future contracts"}],"a":"A","e":"<p><strong>Answer: A<\/strong><\/p><p>Syllabus reference: <strong>8.4.2<\/strong> (élément 8, sous-élément 8.4, learning objective 8.4.2)<\/p>"},{"s":8,"n":75,"id":"Syllabus 8.6.2","q":"<p>An investor writes a 1500 put on the January robusta coffee futures for a premium of 10, which are trading at 1520. Shortly after, two major coffee producers announce record harvests and the futures price drops to 1400.<\/p><p>Assuming that the options are exercised just after the news, the investor will:<\/p>","o":[{"l":"A","h":"suffer a loss of 110 per contract"},{"l":"B","h":"suffer a loss of 90 per contract"},{"l":"C","h":"make a profit of 100 per contract"},{"l":"D","h":"make a profit of 90 per contract"}],"a":"B","e":"<p><strong>Answer: B<\/strong><\/p><p>Syllabus reference: <strong>8.6.2<\/strong> (élément 8, sous-élément 8.6, learning objective 8.6.2)<\/p>"},{"s":8,"n":76,"id":"Syllabus 8.3.1","q":"<p>A futures trader is operating a buy / write strategy. This means that a long underlying position is combined with a:<\/p>","o":[{"l":"A","h":"short put position"},{"l":"B","h":"long put position"},{"l":"C","h":"short call position"},{"l":"D","h":"long call position"}],"a":"C","e":"<p><strong>Answer: C<\/strong><\/p><p>Syllabus reference: <strong>8.3.1<\/strong> (élément 8, sous-élément 8.3, learning objective 8.3.1)<\/p>"},{"s":9,"n":77,"id":"Syllabus 9.2.2","q":"<p>Principles-based regulation means:<\/p>","o":[{"l":"A","h":"detailed rule books which must be followed"},{"l":"B","h":"broad based standards to which firms must adhere"},{"l":"C","h":"broad based standards to which firms adhere on a voluntary basis"},{"l":"D","h":"detailed rule books to which firms adhere on a voluntary basis"}],"a":"B","e":"<p><strong>Answer: B<\/strong><\/p><p>Syllabus reference: <strong>9.2.2<\/strong> (élément 9, sous-élément 9.2, learning objective 9.2.2)<\/p>"},{"s":9,"n":78,"id":"Syllabus 9.3.4","q":"<p>Under Commodity Futures Trading Commission Part 30, what types of derivative transactions by US customers are allowed?<\/p>","o":[{"l":"A","h":"Futures and options transactions on US exchanges only for all US customers"},{"l":"B","h":"Futures and options transactions on non-US exchanges for all US customers"},{"l":"C","h":"Futures and options transactions on all exchanges for all US customers"},{"l":"D","h":"Only futures and options transactions for commercial purposes"}],"a":"B","e":"<p><strong>Answer: B<\/strong><\/p><p>Syllabus reference: <strong>9.3.4<\/strong> (élément 9, sous-élément 9.3, learning objective 9.3.4)<\/p>"},{"s":9,"n":79,"id":"Syllabus 9.3.4","q":"<p>Which of the following is prohibited under Commodity Futures trading Commission (CFTC) part 30? A regulated:<\/p>","o":[{"l":"A","h":"US firm taking an order for an ICE Futures Gas Oil options trade from a resident in the US without a CFTC Part 30 exemption"},{"l":"B","h":"UK firm taking an order for an ICE Futures Gas Oil options trade from a resident in the US with a CFTC Part 30 exemption"},{"l":"C","h":"UK firm soliciting for orders from a resident in the US with the CFTC Part 30 exemption"},{"l":"D","h":"UK firm taking an order for an ICE Futures Gas Oil options trade from a resident in the US without a CFTC Part 30 exemption"}],"a":"D","e":"<p><strong>Answer: D<\/strong><\/p><p>Syllabus reference: <strong>9.3.4<\/strong> (élément 9, sous-élément 9.3, learning objective 9.3.4)<\/p>"},{"s":9,"n":80,"id":"Syllabus 9.3.3","q":"<p>A firm conducts business with the public on a US futures exchange.<\/p><p>What requirement must they meet with regard to the Commodity Futures Trading Commission (CFTC) and the National Futures Association (NFA)?<\/p>","o":[{"l":"A","h":"Registered with the NFA and a member of the CFTC"},{"l":"B","h":"Registered with the NFA and registered with the CFTC"},{"l":"C","h":"Registered with the CFTC and a member of the NFA"},{"l":"D","h":"A member of the NFA and a member of the CFTC"}],"a":"C","e":"<p><strong>Answer: C<\/strong><\/p><p>Syllabus reference: <strong>9.3.3<\/strong> (élément 9, sous-élément 9.3, learning objective 9.3.3)<\/p>"},{"s":9,"n":81,"id":"Syllabus 9.3.2","q":"<p>Which of the following regulates the securities industry in the USA?<\/p>","o":[{"l":"A","h":"NASD"},{"l":"B","h":"SEC"},{"l":"C","h":"NYSE"},{"l":"D","h":"Federal Reserve"}],"a":"B","e":"<p><strong>Answer: B<\/strong><\/p><p>Syllabus reference: <strong>9.3.2<\/strong> (élément 9, sous-élément 9.3, learning objective 9.3.2)<\/p>"},{"s":9,"n":82,"id":"Syllabus 9.2.2","q":"<p>The CEO of a trading firm has expressed a preference for principles-based regulation compared to rules-based regulation, because it offers what recognised advantage?<\/p>","o":[{"l":"A","h":"Lower financial penalties for breaches"},{"l":"B","h":"Greater flexibility in its application"},{"l":"C","h":"Increased alignment with the US market"},{"l":"D","h":"Clearer interpretation of requirements"}],"a":"B","e":"<p><strong>Answer: B<\/strong><\/p><p>Syllabus reference: <strong>9.2.2<\/strong> (élément 9, sous-élément 9.2, learning objective 9.2.2)<\/p>"},{"s":9,"n":83,"id":"Syllabus 9.3.1","q":"<p>CASS 7 within the FCA's Client Asset Sourcebook applies to a MiFID investment firm when:<\/p>","o":[{"l":"A","h":"It holds client money in the course of its MiFID business"},{"l":"B","h":"The custody rules apply to holding financial instruments of a client in the course of MiFID business"},{"l":"C","h":"It carries out its insurance related business"},{"l":"D","h":"It is safeguarding and administering investments in the course of non-MiFID business"}],"a":"A","e":"<p><strong>Answer: A<\/strong><\/p><p>Syllabus reference: <strong>9.3.1<\/strong> (élément 9, sous-élément 9.3, learning objective 9.3.1)<\/p>"},{"s":1,"n":84,"id":"Syllabus 1.1.6","q":"<p>The market liquidity measure that gives the total number of contracts that are not offset by opposite contracts or are not closed for delivery is known as:<\/p>","o":[{"l":"A","h":"gearing"},{"l":"B","h":"leverage"},{"l":"C","h":"open interest"},{"l":"D","h":"trading volume"}],"a":"C","e":"<p><strong>Answer: C<\/strong><\/p><p>Syllabus reference: <strong>1.1.6<\/strong> (élément 1, sous-élément 1.1, learning objective 1.1.6)<\/p>"},{"s":2,"n":85,"id":"Syllabus 2.2.4","q":"<p>If the spot EUR/USD rate is 1.1625, the USD and Euro 6-month LIBOR rates are 0.6% and 0.3% respectively and the period between the trade date and the forward delivery date is 186 days, what is the theoretical six-month forward rate?<\/p>","o":[{"l":"A","h":"1.1628"},{"l":"B","h":"1.1634"},{"l":"C","h":"1.1637"},{"l":"D","h":"1.1643"}],"a":"D","e":"<p><strong>Answer: D<\/strong><\/p><p>Syllabus reference: <strong>2.2.4<\/strong> (élément 2, sous-élément 2.2, learning objective 2.2.4)<\/p>"},{"s":2,"n":86,"id":"Syllabus 2.3.1","q":"<p>Treasury Bonds are issued by the Government in order to:<\/p>","o":[{"l":"A","h":"fund its spending"},{"l":"B","h":"fix the minimum lending rate"},{"l":"C","h":"control inter-bank deposits"},{"l":"D","h":"fix repo rates"}],"a":"A","e":"<p><strong>Answer: A<\/strong><\/p><p>Syllabus reference: <strong>2.3.1<\/strong> (élément 2, sous-élément 2.3, learning objective 2.3.1)<\/p>"},{"s":3,"n":87,"id":"Syllabus 3.1.3","q":"<p>A key characteristic of an OTC market is the absence of:<\/p>","o":[{"l":"A","h":"quoted prices"},{"l":"B","h":"brokers"},{"l":"C","h":"regulations"},{"l":"D","h":"market makers"}],"a":"B","e":"<p><strong>Answer: B<\/strong><\/p><p>Syllabus reference: <strong>3.1.3<\/strong> (élément 3, sous-élément 3.1, learning objective 3.1.3)<\/p>"},{"s":3,"n":88,"id":"Syllabus 3.2.1","q":"<p>When matching orders on an electronic trading platform, which of the following order factors will take the highest priority?<\/p>","o":[{"l":"A","h":"Time"},{"l":"B","h":"Price"},{"l":"C","h":"Size"},{"l":"D","h":"Preferred counterparty"}],"a":"B","e":"<p><strong>Answer: B<\/strong><\/p><p>Syllabus reference: <strong>3.2.1<\/strong> (élément 3, sous-élément 3.2, learning objective 3.2.1)<\/p>"},{"s":3,"n":89,"id":"Syllabus 3.4.1","q":"<p>A key purpose of DME Direct in relation to the Dubai Mercantile Exchange is to:<\/p>","o":[{"l":"A","h":"ensure trades are matched"},{"l":"B","h":"provide open outcry facilities"},{"l":"C","h":"maintain a depository service"},{"l":"D","h":"facilitate arbitrage opportunities"}],"a":"A","e":"<p><strong>Answer: A<\/strong><\/p><p>Syllabus reference: <strong>3.4.1<\/strong> (élément 3, sous-élément 3.4, learning objective 3.4.1)<\/p>"},{"s":3,"n":90,"id":"Syllabus 3.5.1","q":"<p>Basis trades executed on the ICE Futures market must be reported to the exchange within what MAXIMUM timeframe?<\/p>","o":[{"l":"A","h":"10 minutes"},{"l":"B","h":"15 minutes"},{"l":"C","h":"20 minutes"},{"l":"D","h":"30 minutes"}],"a":"B","e":"<p><strong>Answer: B<\/strong><\/p><p>Syllabus reference: <strong>3.5.1<\/strong> (élément 3, sous-élément 3.5, learning objective 3.5.1)<\/p>"},{"s":4,"n":91,"id":"Syllabus 4.2.3","q":"<p>An investor owns 10 futures contracts.<\/p><p>He then buys 10 put options.<\/p><p>According to PUT/CALL PARITY, which of the following strategies (at the same option strike price) should he implement to minimise his market risk?<\/p>","o":[{"l":"A","h":"Sell 10 puts"},{"l":"B","h":"Buy 10 calls"},{"l":"C","h":"Sell 10 calls"},{"l":"D","h":"Sell 10 futures and sell 10 calls"}],"a":"C","e":"<p><strong>Answer: C<\/strong><\/p><p>Syllabus reference: <strong>4.2.3<\/strong> (élément 4, sous-élément 4.2, learning objective 4.2.3)<\/p>"},{"s":5,"n":92,"id":"Syllabus 5.1.7","q":"<p>A client purchased a number of zero coupon inflation products.<\/p><p>This was intended as a hedge against the impact of what possible event?<\/p>","o":[{"l":"A","h":"A fall in equity market volatility"},{"l":"B","h":"Increased volatility in equity markets"},{"l":"C","h":"Central bank tightening its monetary policy"},{"l":"D","h":"Central bank easing its monetary policy"}],"a":"C","e":"<p><strong>Answer: C<\/strong><\/p><p>Syllabus reference: <strong>5.1.7<\/strong> (élément 5, sous-élément 5.1, learning objective 5.1.7)<\/p>"},{"s":5,"n":93,"id":"Syllabus 5.1.11","q":"<p>A trader holds a contract for difference which they wish to maintain.<\/p><p>What key factor dictates whether they will be allowed to roll it over at the end of a trading day? The:<\/p>","o":[{"l":"A","h":"size of the interest charge"},{"l":"B","h":"level of margin in the account"},{"l":"C","h":"existence of a stop-loss facility"},{"l":"D","h":"proximity to its maturity date"}],"a":"B","e":"<p><strong>Answer: B<\/strong><\/p><p>Syllabus reference: <strong>5.1.11<\/strong> (élément 5, sous-élément 5.1, learning objective 5.1.11)<\/p>"},{"s":6,"n":94,"id":"Syllabus 6.2.1","q":"<p>One of the key differences between initial and variation margin payments is:<\/p>","o":[{"l":"A","h":"the level of 'haircut' or discount on the securities is higher for variation margins"},{"l":"B","h":"late payment of variation margin will result in the liquidation of a position, while it will not for a late initial margin payment"},{"l":"C","h":"only cash is accepted for variation margin payments"},{"l":"D","h":"initial margin must be paid on demand, while variation margin allows more time"}],"a":"C","e":"<p><strong>Answer: C<\/strong><\/p><p>Syllabus reference: <strong>6.2.1<\/strong> (élément 6, sous-élément 6.2, learning objective 6.2.1)<\/p>"},{"s":6,"n":95,"id":"Syllabus 6.2.6","q":"<p>A call for intra-day margin is typically made if:<\/p>","o":[{"l":"A","h":"a position is closed out very early"},{"l":"B","h":"market volatility suddenly increases"},{"l":"C","h":"a forward reaches its delivery date"},{"l":"D","h":"the SPAN risk scenarios change"}],"a":"B","e":"<p><strong>Answer: B<\/strong><\/p><p>Syllabus reference: <strong>6.2.6<\/strong> (élément 6, sous-élément 6.2, learning objective 6.2.6)<\/p>"},{"s":7,"n":96,"id":"Syllabus 7.3.2","q":"<p>A key reason why trade documentation should be agreed directly between the operations areas of the two parties is in order to reduce the risk of:<\/p>","o":[{"l":"A","h":"exceeding product limits"},{"l":"B","h":"counterparty failure"},{"l":"C","h":"settlement failure"},{"l":"D","h":"unauthorised dealing"}],"a":"D","e":"<p><strong>Answer: D<\/strong><\/p><p>Syllabus reference: <strong>7.3.2<\/strong> (élément 7, sous-élément 7.3, learning objective 7.3.2)<\/p>"},{"s":8,"n":97,"id":"Syllabus 8.3.2","q":"<p>A synthetic long position in the underlying can be achieved by which one of the following?<\/p>","o":[{"l":"A","h":"Sell a call and buy a put, with same strike price and expiry"},{"l":"B","h":"Buy a call and sell a put, with same strike price and expiry"},{"l":"C","h":"Buy a future and buy a put"},{"l":"D","h":"Buy a future and sell a call"}],"a":"B","e":"<p><strong>Answer: B<\/strong><\/p><p>Syllabus reference: <strong>8.3.2<\/strong> (élément 8, sous-élément 8.3, learning objective 8.3.2)<\/p>"},{"s":8,"n":98,"id":"Syllabus 8.3.6","q":"<p>Selling a short-term put and simultaneously buying a longer-term put with a different strike price on the same underlying security is an example of which type of spread transaction?<\/p>","o":[{"l":"A","h":"Diagonal spread"},{"l":"B","h":"Horizontal spread"},{"l":"C","h":"Bull put spread"},{"l":"D","h":"Straddle"}],"a":"A","e":"<p><strong>Answer: A<\/strong><\/p><p>Syllabus reference: <strong>8.3.6<\/strong> (élément 8, sous-élément 8.3, learning objective 8.3.6)<\/p>"},{"s":8,"n":99,"id":"Syllabus 8.6.3","q":"<p>A derivatives dealer is carrying out a trade for a client requiring short term exposure to an emerging market.<\/p><p>Which of the following types of client is this MOST likely to be?<\/p>","o":[{"l":"A","h":"Hedge fund"},{"l":"B","h":"Corporate treasurer"},{"l":"C","h":"Sovereign wealth fund"},{"l":"D","h":"High net worth individual"}],"a":"A","e":"<p><strong>Answer: A<\/strong><\/p><p>Syllabus reference: <strong>8.6.3<\/strong> (élément 8, sous-élément 8.6, learning objective 8.6.3)<\/p>"},{"s":1,"n":100,"id":"Syllabus 1.1.7","q":"<p>How has the use of margin payments for over-the-counter transactions changed over recent years?<\/p>","o":[{"l":"A","h":"They are being applied in less markets"},{"l":"B","h":"They are being applied to smaller participants"},{"l":"C","h":"Initial margins are being replaced by higher variation margins"},{"l":"D","h":"Variation margins are being replaced by higher initial margins"}],"a":"B","e":"<p><strong>Answer: B<\/strong><\/p><p>Syllabus reference: <strong>1.1.7<\/strong> (élément 1, sous-élément 1.1, learning objective 1.1.7)<\/p>"}]</script>
<script>
(function(){

const PAGE_KEY = 'cisi-deriv-page';

const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- state ---------- */
function blank(){ return {v:1, updatedAt:0, current:null, last:null, history:[], prefs:{n:20, order:'random', sections:[]}, mock:{current:null, last:null, history:[]}, book:{current:null, last:null, history:[], prefs:{n:20, order:'random', sections:[]}}, paper:{current:null, last:null, history:[], prefs:{n:100, order:'doc', sections:[]}}}; }
function loadLocal(){ try{ const r = localStorage.getItem(KEY); if(r){ const s = JSON.parse(r); if(s && s.v===1) return Object.assign(blank(), s); } }catch(e){} return null; }
let S = loadLocal() || blank();
let view = 'home', reviewing = false, navFilter = 'all', lastAnimPos = -1;
let page = 'quiz'; try{ const sp=localStorage.getItem(PAGE_KEY); if(sp==='mock'||sp==='book'||sp==='paper') page=sp; if(location.hash==='#sample') page='paper'; if(location.hash==='#mocks') page='mock'; if(location.hash==='#livre') page='book'; }catch(e){}
if(!S.mock) S.mock = {current:null,last:null,history:[]};
if(!S.book) S.book = blank().book;

const M = () => page==='mock' ? S.mock : page==='book' ? S.book : page==='paper' ? S.paper : S;
const bank = a => (a && a.kind==='mock') ? MQ : (a && a.kind==='book') ? BQ : (a && a.kind==='paper') ? PQ : QS;

function save(){

  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  queueRemote();
}

/* ---------- cloud sync (per-user private doc) ---------- */
let remoteRef = null, remoteTimer = null;
function setSync(on){ const el=$('#sync'); el.classList.toggle('on',!!on); el.lastElementChild.textContent = on ? 'Synchronisé' : 'Local'; el.title = on ? 'Progression sauvegardée sur ton compte (tous appareils)' : 'Progression sauvegardée dans ce navigateur'; }
function queueRemote(){
  if(!remoteRef) return;
  clearTimeout(remoteTimer);
  remoteTimer = setTimeout(pushRemote, 1200);
}
function pushRemote(){
  if(!remoteRef) return;
  clearTimeout(remoteTimer);
  remoteRef.set(JSON.parse(JSON.stringify(S))).then(()=>setSync(true)).catch(err=>{
    if(err && err.code==='invalid_argument'){ remoteRef=null; setSync(false); }
  });
}
function mergeTrack(out, l, r){
  const byId = new Map();
  [...((l&&l.history)||[]), ...((r&&r.history)||[])].forEach(h=>{ if(h && h.id) byId.set(h.id,h); });
  out.history = [...byId.values()].sort((a,b)=>b.date-a.date).slice(0,150);
  if(out.current && out.history.some(h=>h.id===out.current.id)) out.current = null; // finished elsewhere
}
function mergeStates(local, remote){
  const newer = (remote.updatedAt||0) > (local.updatedAt||0) ? remote : local;
  const out = Object.assign(blank(), JSON.parse(JSON.stringify(newer)));
  out.mock = Object.assign({current:null,last:null,history:[]}, out.mock||{});
  mergeTrack(out, local, remote);
  mergeTrack(out.mock, local.mock, remote.mock);
  out.book = Object.assign(blank().book, out.book||{});
  mergeTrack(out.book, local.book, remote.book);
  out.paper = Object.assign(blank().paper, out.paper||{});
  mergeTrack(out.paper, local.paper, remote.paper);
  out.updatedAt = Math.max(local.updatedAt||0, remote.updatedAt||0);
  return out;
}
async function initRemote(){
  try{
    if(!window.claude || typeof window.claude.use!=='function') return;
    const [db,user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if(!db || !user) return;
    const uid = await user.id();
    if(!uid) return;
    const ref = db.doc('data/users/'+uid+'/state');
    const snap = await ref.get();
    remoteRef = ref;
    if(snap.exists){
      const r = snap.data();
      if(r && r.v===1){
        const prevCur = M().current && M().current.id;
        S = mergeStates(S, JSON.parse(JSON.stringify(r)));
        try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
        if(view==='quiz' && !reviewing && (!M().current || M().current.id!==prevCur)) view='home';
        render();
      }
    }
    pushRemote();
  }catch(e){ remoteRef=null; setSync(false); }
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden' && remoteTimer) pushRemote(); });

/* ---------- helpers ---------- */
function stats(a){
  if(!a) return {n:0,answered:0,correct:0,pct:null};
  let answered=0, correct=0;
  for(let p=0;p<a.qids.length;p++){ const c=a.ans[p]; if(c!=='-'){ answered++; if(c===bank(a)[a.qids[p]].a) correct++; } }
  return {n:a.qids.length, answered, correct, pct: answered? Math.round(correct/answered*100) : null};
}
function poolFor(B, sections){ const set=new Set(sections); const out=[]; B.forEach((q,i)=>{ if(!set.size || set.has(q.s)) out.push(i); }); return out; }
const CHAPTERS={1:'Introduction to Derivatives',2:'Underlying Markets',3:'Market Structure',4:'Principles of Pricing and Valuation',5:'OTC Derivatives',6:'Principles of Clearing and Margin',7:'Delivery and Settlement',8:'Trading, Hedging and Investment Strategies',9:'Regulatory Requirements'};
const EXAMQ={1:17,2:16,3:9,4:11,5:7,6:14,7:6,8:14,9:6};
const EXAM_MAX=Math.max(...Object.values(EXAMQ));
const chName = s => CHAPTERS[s] || ('Chapitre '+s);
function sectionLabel(secs, C){ C=C||cfg(); const pre = C.kind==='book' ? 'Livre · ' : C.kind==='paper' ? 'Sample paper · ' : '';
  const U = C.kind==='paper' ? ['Tous les éléments','Élément ','Éléments '] : ['Tous les chapitres','Ch. ','Chapitres '];
  if(!secs || !secs.length || secs.length===C.secs.length) return pre+U[0];
  if(secs.length===1) return pre+U[1]+secs[0]+(C.kind!=='quiz'?'':' · '+chName(secs[0]));
  return pre+U[2]+secs.slice().sort((a,b)=>a-b).join(', '); }
function cfg(){
  if(page==='paper') return { kind:'paper', T:S.paper, B:PQ, secs:PSECS, chName,
    eyebrow:'CISI · Derivatives sample paper', h1:'Sample <em>paper</em>',
    p:`Les ${PQ.length} questions du sample paper officiel (Version 25). Le vrai examen se fait en 2 heures et la note de passage est de 70 %. Le corrigé donne la bonne réponse et la référence du syllabus, sans explication.`,
    pending:'Envoie-moi le sample paper Derivatives et cette page se remplit, avec le seuil Pass / Fail à 70 %.' };
  if(page==='book') return { kind:'book', T:S.book, B:BQ, secs:BSECS, chName,
    eyebrow:'Livre CISI · Derivatives Level 3', h1:'QCM du <em>livre</em>',
    p:`Les ${BQ.length} questions des pages « Multiple Choice Questions » à la fin du manuel CISI Derivatives (Edition 21). Après chaque réponse : la référence du manuel et l'explication officielle.`,
    pending:'Envoie-moi les questions du livre CISI et cette page se remplit, avec le filtre par chapitre et le corrigé.' };
  return { kind:'quiz', T:S, B:QS, secs:SECTIONS, chName,
    eyebrow:'Révision · Derivatives', h1:'Questions de <em>cours</em>',
    p:`${QS.length} questions de cours réparties sur ${SECTIONS.length} chapitres. Le nombre de questions à l'examen est indiqué pour chaque chapitre, pour t'aider à prioriser.`,
    pending:'Envoie-moi les questions de cours et cette page se remplit : choix du nombre de questions, filtre par chapitre, correction et explications.' };
}
function fmtDate(t){ const d=new Date(t); return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'})+' · '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }
function fmtDur(ms){ const m=Math.round(ms/60000); if(m<1) return '< 1 min'; if(m<60) return m+' min'; return Math.floor(m/60)+' h '+String(m%60).padStart(2,'0'); }
function pillCls(p){ return p==null?'m': p>=80?'g': p>=60?'m':'r'; }
function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
function optOrder(a,p,q){ const pm = a && a.perm && a.perm[p]; return pm ? pm.split('') : q.o.map(o=>o.l); }
function dispL(a,p,q,orig){ const i=optOrder(a,p,q).indexOf(orig); return i<0 ? orig : 'ABCD'[i]; }
function att(){ return reviewing ? M().last : M().current; }

/* ---------- modal ---------- */
function confirmBox(title, text, okLabel, onOk, danger){
  const root=$('#modalRoot');
  root.innerHTML = `<div class="modal-bg" role="dialog" aria-modal="true"><div class="modal card"><h3>${esc(title)}</h3><p>${esc(text)}</p><div class="acts"><button class="btn ghost" id="mNo">Annuler</button><button class="btn ${danger?'danger':'primary'}" id="mYes">${esc(okLabel)}</button></div></div></div>`;
  const close=()=>{ root.innerHTML=''; };
  $('#mNo').onclick=close; root.firstChild.onclick=e=>{ if(e.target===root.firstChild) close(); };
  $('#mYes').onclick=()=>{ close(); onOk(); };
  $('#mYes').focus();
}

  const g=$('#gauge');
  const a = view==='quiz' ? att() : (view==='results' ? M().last : null);
  document.querySelectorAll('.tab').forEach(b=>{ if(b.dataset.page===page) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  $('#homeBtn').hidden = view==='home';
  if(!a){ g.hidden=true; measureHeader(); return; }
  g.hidden=false;
  const st=stats(a);
  $('#gPct').innerHTML = st.pct==null ? '–<small>%</small>' : st.pct+'<small>%</small>';
  const f=$('#gFill'); const w = st.pct||0; f.style.width = w+'%'; f.style.setProperty('--bgw', w>0 ? (100/w*100)+'%' : '100%');
  $('#pFill').style.width = (st.n? st.answered/st.n*100 : 0)+'%';
  $('#gProg').textContent = `${st.answered} / ${st.n} répondues`;
  $('#gCounts').innerHTML = `<span class="g"><b class="g">${st.correct}</b> justes</span><br><span class="r"><b class="r">${st.answered-st.correct}</b> fausses</span>`;
  measureHeader();
}

  if(view==='quiz' && !att()) view='home';

    ${rows.map((k,i)=>`<div class="prog-row"><span class="rk">#${i+1}</span><span class="nm">${esc(CHAPTERS[k])}<small>Chapitre ${k}</small></span><span class="bar"><i style="width:${EXAMQ[k]/EXAM_MAX*100}%"></i></span><span class="q">${EXAMQ[k]} Q<small>${Math.round(EXAMQ[k]/tot*100)} %</small></span></div>`).join('')}

}

function startQuiz(){
  const C=cfg(), T=C.T; const P=T.prefs; let pool=poolFor(C.B, P.sections);
  if(P.order==='random') pool=shuffle(pool.slice()).slice(0,P.n); else pool=pool.slice(0,P.n);
  T.current={ id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), startedAt: Date.now(), qids: pool, ans: '-'.repeat(pool.length), pos:0, kind: C.kind!=='quiz'?C.kind:undefined, label: sectionLabel(P.sections, C)+(P.order==='random'?' · aléatoire':' · ordre du fichier') };
  reviewing=false; navFilter='all'; view='quiz'; save(); render(); window.scrollTo(0,0);
}

function finish(){
  const T=M(); const a=T.current; if(!a) return;
  const st=stats(a);
  T.history.unshift({ id:a.id, date:Date.now(), total:st.n, answered:st.answered, correct:st.correct, pct:st.pct, dur:Date.now()-a.startedAt, label:a.label, mock:a.mock||null });
  T.history = T.history.slice(0,150);
  T.last = Object.assign({}, a, {finishedAt: Date.now()});
  T.current=null; reviewing=false; view='results'; save(); render(); window.scrollTo(0,0);
}

function renderQuiz(){

  const unanswered = n-st.answered;
  app.innerHTML = `
  <div class="quiz">
    <article class="card qcard" id="qcard">
      <div class="qmeta">
        <span class="qnum">Question ${p+1}<small> / ${n}</small></span>

        ${reviewing?'<span class="review-banner">Mode revue</span>':''}
      </div>
      <div class="stem">${q.q}</div>
      <div class="opts">
        ${optOrder(a,p,q).map((ol,i)=>q.o.find(o=>o.l===ol)).map((o,i)=>{ let cls='', ico=''; const DL='ABCD'[i];
          if(done){ if(o.l===q.a){cls='ok';ico='✓';} else if(o.l===chosen){cls='ko';ico='✕';} else cls='dim'; }
          return `<button class="opt ${cls} ${cls==='ko'&&lastAnimPos===p?'anim':''}" data-l="${o.l}" ${done||reviewing?'disabled':''}><span class="L">${DL}</span><span class="T">${o.h}${a.perm && (done||reviewing) && optOrder(a,p,q).join('')!=='ABCD' ? `<span class="orig">${o.l} dans le fichier</span>` : ''}</span><span class="ico">${ico}</span></button>`; }).join('')}
      </div>
      ${done ? `<div class="expl">
        <div class="verdict ${chosen===q.a?'g':'r'}">${chosen===q.a?'✓ Bonne réponse':'✕ Mauvaise réponse — tu as choisi '+dispL(a,p,q,chosen)}</div>
        ${(a.kind==='book'||a.kind==='paper') ? `<h4>Corrigé</h4><div class="expl-body book">${q.e}</div>` : `<p class="ans-line">The correct answer is: <strong>${dispL(a,p,q,q.a)}</strong> - ${esc(plain(correctOpt.h))}</p>
        <h4>Explanation</h4>
        <div class="expl-body">${q.e && q.e.trim() ? q.e : '<p class="none">Aucune explication dans le fichier source pour cette question.</p>'}</div>`}
      </div>` : (reviewing && (a.kind==='book'||a.kind==='paper') ? `<div class="expl"><p class="ans-line">Non répondue.</p><h4>Corrigé</h4><div class="expl-body book">${q.e}</div></div>` : reviewing ? `<div class="expl"><p class="ans-line">Non répondue. The correct answer is: <strong>${dispL(a,p,q,q.a)}</strong> - ${esc(plain(correctOpt.h))}</p><h4>Explanation</h4><div class="expl-body">${q.e && q.e.trim()?q.e:'<p class="none">Aucune explication dans le fichier source pour cette question.</p>'}</div></div>`:'')}
      <div class="qfoot">
        <button class="btn" id="prevBtn" ${p===0?'disabled':''}>← Précédente</button>
        <button class="btn ${done&&p<n-1?'primary':''}" id="nextBtn" ${p===n-1?'disabled':''}>Suivante →</button>
        <span class="sp"></span>
        ${!reviewing && done && p===n-1 && unanswered===0 ? '<button class="btn primary" id="finishBtn2">Voir mon résultat</button>' : ''}
        <span class="kbd">Raccourcis : A–D ou 1–4 · ← →</span>
      </div>
    </article>
    <aside class="card navp" aria-label="Navigation des questions">
      <div class="navp-head"><h3>Questions</h3><span class="mono" style="font-size:12px;color:var(--muted)">${st.answered}/${n}</span></div>
      <div class="legend"><span class="g"><i></i>Juste</span><span class="r"><i></i>Fausse</span><span><i></i>Non répondue</span></div>
      <div class="chips">
        <button class="chip" data-nf="all" aria-pressed="${navFilter==='all'}">Toutes</button>
        <button class="chip" data-nf="wrong" aria-pressed="${navFilter==='wrong'}">Fausses<span class="n">${st.answered-st.correct}</span></button>
        <button class="chip" data-nf="todo" aria-pressed="${navFilter==='todo'}">À faire<span class="n">${unanswered}</span></button>
      </div>
      <div class="grid" id="grid">${cells || '<div class="empty-filter">Rien ici.</div>'}</div>
      ${reviewing ? '<button class="btn finish" id="backRes">Retour au résultat</button>' : `<button class="btn ${unanswered===0?'primary':''} finish" id="finishBtn">${unanswered===0?'Voir mon résultat':(a.kind==='mock'?'Terminer le mock':'Terminer le quiz')}</button>`}
    </aside>
  </div>`;
  lastAnimPos=-1;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(b.dataset.l));
  $('#prevBtn').onclick=()=>go(p-1);
  $('#nextBtn').onclick=()=>go(p+1);
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go, true));
  app.querySelectorAll('[data-nf]').forEach(b=>b.onclick=()=>{ navFilter=b.dataset.nf; renderQuiz(); });
  const fb=()=>{ if(unanswered>0) confirmBox('Terminer maintenant ?',`Il reste ${unanswered} question${unanswered>1?'s':''} sans réponse. Ton score sera calculé sur les ${st.answered} répondues et enregistré.`,'Terminer et enregistrer',finish); else finish(); };
  if($('#finishBtn')) $('#finishBtn').onclick=fb;
  if($('#finishBtn2')) $('#finishBtn2').onclick=fb;
  if($('#backRes')) $('#backRes').onclick=()=>{ reviewing=false; view='results'; render(); window.scrollTo(0,0); };
  const curCell=app.querySelector('.cell.cur'); const grid=$('#grid');
  if(curCell && grid.scrollHeight>grid.clientHeight){ const top=curCell.offsetTop-grid.offsetTop; if(top<grid.scrollTop || top>grid.scrollTop+grid.clientHeight-40) grid.scrollTop=top-grid.clientHeight/2; }
}

function choose(l){
  const a=M().current; if(!a || reviewing) return;
  const p=a.pos; if(a.ans[p]!=='-') return;
  a.ans = a.ans.slice(0,p)+l+a.ans.slice(p+1);
  if(l!==bank(a)[a.qids[p]].a) lastAnimPos=p;
  save(); renderQuiz(); renderGauge();
  const ex=app.querySelector('.expl'); if(ex){ const r=ex.getBoundingClientRect(); if(r.top>window.innerHeight-80) ex.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth', block:'nearest'}); }
}
function go(i, fromGrid){
  const a=att(); if(!a) return; i=Math.max(0,Math.min(a.qids.length-1,i)); if(i===a.pos) return;
  a.pos=i; if(!reviewing) save(); renderQuiz();
  const qc=$('#qcard'); const r=qc.getBoundingClientRect(); const hh=$('#hdr').offsetHeight;
  if(r.top<hh || fromGrid && r.top>window.innerHeight*0.5) qc.scrollIntoView({block:'start'});
}

function renderResults(){
  const T=M(); const a=T.last; const st=stats(a); const h=T.history.find(x=>x.id===a.id);
  const pct=st.pct||0; const C=2*Math.PI*64;
  const col = st.pct==null?'var(--muted)': pct>=80?'var(--good)': pct>=60?'var(--accent)':'var(--bad)';
  const msg = st.pct==null ? 'Aucune question répondue.' : pct>=80 ? 'Très solide. Continue comme ça.' : pct>=60 ? 'Pas mal, il reste quelques points à revoir.' : 'Repasse sur tes erreurs avant de relancer.';
  app.innerHTML = `
  <section class="card results">
    <div class="res-top">
      <div class="ring"><svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="64" fill="none" stroke="var(--surface-2)" stroke-width="12"/><circle cx="75" cy="75" r="64" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}"/></svg><div class="v">${st.pct==null?'–':pct+'%'}</div></div>
      <div style="flex:1 1 240px;min-width:0"><span class="eyebrow">Résultat · ${esc(a.label)}</span><h2>${st.correct} bonne${st.correct>1?'s':''} réponse${st.correct>1?'s':''} sur ${st.answered}</h2><p>${msg}</p>${a.kind==='paper' && st.pct!=null ? `<p style="margin-top:6px;font-weight:700;color:${pct>=70?'var(--good)':'var(--bad)'}">${pct>=70?'Pass':'Fail'} · seuil du sample paper : 70 %</p>` : ''}<p class="saved" style="margin-top:8px">✓ Score enregistré dans ton historique</p></div>
    </div>
    <div class="res-stats">
      <div><b>${st.n}</b><span>Questions</span></div>
      <div><b>${st.answered}</b><span>Répondues</span></div>
      <div><b style="color:var(--good)">${st.correct}</b><span>Justes</span></div>
      <div><b style="color:var(--bad)">${st.answered-st.correct}</b><span>Fausses</span></div>
      <div><b>${h?fmtDur(h.dur):'–'}</b><span>Durée</span></div>
    </div>
    <div class="res-acts">
      <button class="btn primary" id="revWrong" ${st.answered-st.correct===0?'disabled':''}>Revoir mes erreurs</button>
      <button class="btn" id="revAll">Revoir toute la tentative</button>
      <button class="btn ghost" id="newQ">${a.kind==='mock'?'Retour aux mocks':'Nouveau quiz'}</button>
    </div>
  </section>`;
  const rev=(f)=>{ reviewing=true; navFilter=f; view='quiz';
    if(f==='wrong'){ const i=a.qids.findIndex((qi,k)=>a.ans[k]!=='-' && a.ans[k]!==bank(a)[qi].a); if(i>=0) a.pos=i; } else a.pos=0;
    render(); window.scrollTo(0,0); };
  $('#revWrong').onclick=()=>rev('wrong');
  $('#revAll').onclick=()=>rev('all');
  $('#newQ').onclick=()=>{ view='home'; render(); window.scrollTo(0,0); };
}

/* ---------- global ---------- */
$('#brand').onclick=$('#homeBtn').onclick=()=>{ reviewing=false; view='home'; render(); window.scrollTo(0,0); };
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{ setPage(b.dataset.page); });
function setPage(p){ page=p; try{ localStorage.setItem(PAGE_KEY,p); }catch(e){} reviewing=false; navFilter='all'; view='home'; render(); window.scrollTo(0,0); }

/* ---------- mock exams ---------- */
function mockStats(k){
  const hs=S.mock.history.filter(h=>h.mock===k);
  return { n:hs.length, best: hs.length? Math.max(...hs.map(h=>h.pct||0)) : null, last: hs.length? hs[0].pct : null };
}
function mockPrefs(){ if(!S.mock.prefs) S.mock.prefs={shuffleQ:true, shuffleA:true}; return S.mock.prefs; }
function startMock(k){
  const qids=[]; MQ.forEach((q,i)=>{ if(q.s===k) qids.push(i); });
  qids.sort((x,y)=>MQ[x].n-MQ[y].n);
  const MP=mockPrefs();
  if(MP.shuffleQ) shuffle(qids);
  const perm = MP.shuffleA ? qids.map(qi=>{ const ls=MQ[qi].o.map(o=>o.l); return MQ[qi].o.some(o=>/of the above/i.test(o.h)) ? ls.join('') : shuffle(ls).join(''); }) : null;
  const tags=[MP.shuffleQ?'questions mélangées':'', MP.shuffleA?'réponses mélangées':''].filter(Boolean).join(', ');
  S.mock.current={ id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), kind:'mock', mock:k, startedAt: Date.now(), qids, perm, ans:'-'.repeat(qids.length), pos:0, label:'Mock exam '+k+(tags?' · '+tags:'') };
  reviewing=false; navFilter='all'; view='quiz'; save(); render(); window.scrollTo(0,0);
}
function renderMockHome(){
  reviewing=false;
  const cur=S.mock.current, cs=stats(cur);
  const hist=S.mock.history;
  const avg = hist.length ? Math.round(hist.reduce((s,h)=>s+(h.pct||0),0)/hist.length) : null;
  const best = hist.length ? Math.max(...hist.map(h=>h.pct||0)) : null;
  app.innerHTML = `
  <section class="hero">
    <span class="eyebrow">Examens blancs · Securities</span>
    <h1>Practice <em>mock exams</em></h1>
    <p>${MOCKS.length} examens de ${MQ.filter(q=>q.s===MOCKS[0]).length} questions, avec correction et explication après chaque réponse. Tu peux mélanger l'ordre des questions et des réponses pour ne pas les apprendre par cœur. Un seul mock à la fois : termine celui en cours avant d'en commencer un autre.</p>
  </section>
  ${cur ? `<div class="card resume">
    <div class="txt"><span class="eyebrow">Mock en cours</span>
      <h3>${esc(cur.label)} · ${cs.answered} / ${cs.n} répondues${cs.pct!=null?` · ${cs.pct}% de bonnes réponses`:''}</h3>
      <p>Commencé le ${fmtDate(cur.startedAt)} · reprise à la question ${cur.pos+1}</p></div>
    <div class="acts"><button class="btn primary" id="resumeBtn">Reprendre</button><button class="btn ghost" id="finishCur">Terminer et enregistrer</button></div>
  </div>`:''}
  <div class="card mock-opts">
    <div><span class="eyebrow">Options de l'examen</span><p class="hint">S'appliquent au prochain mock que tu lances${cur?' (le mock en cours garde son ordre)':''}.</p></div>
    <div class="seg">
      <button class="chip" id="shQ" aria-pressed="${mockPrefs().shuffleQ}">Mélanger les questions</button>
      <button class="chip" id="shA" aria-pressed="${mockPrefs().shuffleA}">Mélanger les réponses A–D</button>
    </div>
  </div>
  <div class="mocks">
    ${MOCKS.map(k=>{ const ms=mockStats(k); const live=cur && cur.mock===k; const locked=cur && !live;
      const n=MQ.filter(q=>q.s===k).length;
      return `<article class="card mock ${live?'live':''}">
        <div class="mock-t"><span class="mock-n">${String(k).padStart(2,'0')}</span>
          ${live?`<span class="status live">En cours</span>`: ms.n?`<span class="status done">Fait ×${ms.n}</span>`:`<span class="status new">Jamais fait</span>`}</div>
        <div><h3>Mock exam ${k}</h3><span class="sub">${n} questions</span></div>
        ${live?`<div class="mini" aria-label="Progression"><i style="width:${cs.answered/cs.n*100}%"></i></div>`:''}
        <dl><div><dt>Record</dt><dd>${ms.best==null?'–':ms.best+'%'}</dd></div><div><dt>Dernier</dt><dd>${ms.last==null?'–':ms.last+'%'}</dd></div><div><dt>Essais</dt><dd>${ms.n}</dd></div></dl>
        <button class="btn ${live||!cur?'primary':''}" data-mock="${k}" ${locked?'disabled':''}>${live?'Reprendre':(ms.n?'Refaire':'Commencer')}</button>
        ${locked?`<p class="lock">Termine le Mock ${cur.mock} d'abord</p>`:''}
      </article>`; }).join('')}
  </div>
  <section class="card hist">
    <span class="eyebrow">Historique</span>
    <h2>Tes scores aux mocks</h2>
    ${hist.length ? `
    <div class="hist-stats"><div><b>${hist.length}</b><span>Mocks faits</span></div><div><b>${avg}%</b><span>Moyenne</span></div><div><b>${best}%</b><span>Meilleur</span></div></div>
    <div class="table-scroll"><table><thead><tr><th>Mock</th><th>Date</th><th>Répondues</th><th>Justes</th><th>Durée</th><th>Score</th></tr></thead><tbody>
    ${hist.map(h=>`<tr><td>Mock ${h.mock}</td><td>${fmtDate(h.date)}</td><td>${h.answered} / ${h.total}</td><td>${h.correct}</td><td>${fmtDur(h.dur)}</td><td class="sc"><span class="pill ${pillCls(h.pct)}">${h.pct==null?'–':h.pct+'%'}</span></td></tr>`).join('')}
    </tbody></table></div>` : `<div class="hist-empty">Aucun mock terminé pour l'instant. Ton score s'enregistre ici à la fin de chaque mock.</div>`}
  </section>`;
  $('#shQ').onclick=()=>{ mockPrefs().shuffleQ=!mockPrefs().shuffleQ; save(); renderMockHome(); };
  $('#shA').onclick=()=>{ mockPrefs().shuffleA=!mockPrefs().shuffleA; save(); renderMockHome(); };
  app.querySelectorAll('[data-mock]').forEach(b=>b.onclick=()=>{ const k=+b.dataset.mock;
    if(cur && cur.mock===k){ view='quiz'; navFilter='all'; render(); window.scrollTo(0,0); }
    else if(!cur) startMock(k); });
  if(cur){ $('#resumeBtn').onclick=()=>{ view='quiz'; reviewing=false; navFilter='all'; render(); window.scrollTo(0,0); };
    $('#finishCur').onclick=()=>confirmBox('Terminer le mock ?',`Ton score sera enregistré sur les ${cs.answered} questions répondues.`,'Terminer',finish); }
}
document.addEventListener('keydown',e=>{
  if(view!=='quiz' || $('#modalRoot').firstChild) return;
  if(e.target.matches('input,textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  const k=e.key.toUpperCase(); const map={'1':'A','2':'B','3':'C','4':'D'};
  const a=att(); if(!a) return;
  const toOrig = L => { const q=bank(a)[a.qids[a.pos]]; return optOrder(a,a.pos,q)['ABCD'.indexOf(L)]; };
  if('ABCD'.includes(k) && k.length===1){ choose(toOrig(k)); }
  else if(map[k]) choose(toOrig(map[k]));
  else if(e.key==='ArrowRight'){ go(a.pos+1); }
  else if(e.key==='ArrowLeft'){ go(a.pos-1); }
});

render();
initRemote();
})();
</script>

</body>
</html>
