oss of the writer of a put option. The writer's maximum gain is crystallised at 80 showing that this is the option strike. This means that the holder of the option would have the right to sell at 80 when the market is 85 meaning the holders option is out-of-the-money.<\/p>"},{"s":2,"n":95,"id":"1055511","q":"<p>Which of the below is subject to variation margin on a daily basis on future style options?<\/p>","o":[{"l":"A","h":"Holder"},{"l":"B","h":"Writer"},{"l":"C","h":"Both holder and writer"},{"l":"D","h":"Neither"}],"a":"C","e":"<p>Future style options is where premium is not paid up front and therefore both the holder and the writer are entering a contingent liability transaction and therefore both will require to pay/receive variation margin based on their unrealised losses/profits.<\/p>"},{"s":2,"n":96,"id":"1036778","q":"<p>What is the motivation behind the following trade?<\/p><ul> <li><p>Long September 150 BigCo plc call at a 16p premium<\/p><\/li> <li><p>Short December 150 BigCo plc call at a 19p premium<\/p><\/li> <\/ul>","o":[{"l":"A","h":"Exploiting an expected change in the relative difference between the two options' time values"},{"l":"B","h":"Exploiting an expected change in the relative difference between the two options' interest rates"},{"l":"C","h":"Exploiting an expected change in the relative difference between the two options' intrinsic values"},{"l":"D","h":"Exploiting an expected change in the relative difference between the two options' delta"}],"a":"A","e":"<p>The trade described is a HORIZONTAL SPREAD which exploits the differences in time value or volatility of the two options.<\/p>"},{"s":2,"n":97,"id":"1036759","q":"<p>If the sterling versus euro spot rate is currently £1 = € 1.50, sterling interest rates are 6% p/a and euro interest rates are 5% p/a, what would the six months forward sterling - euro rate be?<\/p>","o":[{"l":"A","h":"£1 = €1.4858"},{"l":"B","h":"£1 = €1.5143"},{"l":"C","h":"£1 = €1.4927"},{"l":"D","h":"£1 = €1.5073"}],"a":"C","e":"<p>The forward exchange rate is calculated as follows:<br/> £1 in six months' time would, at 6% p.a., grow to £1.03 €1.50 (the equivalent in €s of £1 at today's spot) would, at 5% p/a, grow to €1.5375.<br/> The forward exchange rate is the ratio between the two inflated rates in six months' time i.e. 1.5375 / 1.0300 = 1.4927<\/p>"},{"s":2,"n":98,"id":"1017037","q":"<p>Which of the following is TRUE regarding where a confirmation sits in the architecture of the ISDA documentation?<\/p>","o":[{"l":"A","h":"The confirmation is subordinate to the definitions and terms stipulated in the master agreement"},{"l":"B","h":"The specific terms of the confirmation override the details of the master agreement"},{"l":"C","h":"The confirmation is not affected by the credit support annex"},{"l":"D","h":"The confirmation is more detailed than the master agreement"}],"a":"B","e":"<p>If there is a conflict between something contained in the confirmation and the master agreement, the confirmation takes precedence for that deal.<\/p>"},{"s":2,"n":99,"id":"1036798","q":"<p>Against whom would a claim be raised in the event of a default pre-novation?<\/p>","o":[{"l":"A","h":"The exchange"},{"l":"B","h":"The clearing organisation"},{"l":"C","h":"The regulator"},{"l":"D","h":"The counterparty broker to the trade"}],"a":"D","e":"<p>Until the contract has been novated there is no central counter party guarantee.<\/p>"},{"s":2,"n":100,"id":"1036814","q":"<p>Which of the following is an unacceptable form of collateral for initial margin of a FTSE 100 contract for differences?<\/p>","o":[{"l":"A","h":"FTSE 100 equities"},{"l":"B","h":"A dollar denominated T-bond"},{"l":"C","h":"A sterling denominated gilt-edged security"},{"l":"D","h":"A euro denominated bund"}],"a":"A","e":"<p>Please note that this question is asking for an incorrect statement.<br/> Government bonds are permitted providing they are denominated in the currency of the issuing government. A euro denominated gilt would therefore NOT be acceptable. Equities can no longer be held as collateral with UK clearing houses.<\/p>"},{"s":3,"n":1,"id":"1015836","q":"<p>Which ONE of the following applies to a writer of an option on a future?<\/p>","o":[{"l":"A","h":"Receives a residual credit based on the net liquidation value (NLV) of the option"},{"l":"B","h":"Receives the full premium less any initial margin"},{"l":"C","h":"Receives premium on day of trade"},{"l":"D","h":"Receives full premium on the earlier of exercise or expiry"}],"a":"D","e":"<p>An option on a future has the premium paid on exercise or expiry, whichever is sooner.<\/p>"},{"s":3,"n":2,"id":"1036913","q":"<p>What is the purpose of position limits?<\/p>","o":[{"l":"A","h":"To prevent the contract moving up or down by too much too quickly"},{"l":"B","h":"To protect the investor from counterparty default risk"},{"l":"C","h":"To allow the investor to monitor their open derivative positions"},{"l":"D","h":"To prevent the investor from becoming over exposed to the underlying cash asset"}],"a":"D","e":"<p>Position limits are not used on UK exchanges, but stop investors taking dominant positions, or becoming over exposed in the underlying cash market.<br/> Choice A defines a price limit. Choice B is a description of clearing.<\/p>"},{"s":3,"n":3,"id":"1015933","q":"<p>When an investor holds a call option on a particular asset, which of the following best describes the contract created?<\/p>","o":[{"l":"A","h":"The writer has the right to sell the asset to the holder"},{"l":"B","h":"The holder is obliged to purchase the asset from the writer"},{"l":"C","h":"The writer is obliged to purchase the asset from the holder"},{"l":"D","h":"The holder has the right to buy the asset from the writer"}],"a":"D","e":"<p>A call option gives the holder, not the writer, the right to buy a specified asset at a specified price.<\/p>"},{"s":3,"n":4,"id":"1036932","q":"<p>In which of the following ways do the rules between the UK and the US differ in relation to client asset/money accounts?<\/p>","o":[{"l":"A","h":"UK rules on client money obliges segregation of all client money from the firm's money whereas the US allows all client money to be held in a non-segregated account"},{"l":"B","h":"UK rules on client money allows segregation or non-segregation whereas all US client's money must be held in a segregated account"},{"l":"C","h":"Both the UK and US rules allow client's money to be held in segregated or non-segregated accounts"},{"l":"D","h":"Neither the UK and US rules allow client's money to be held in segregated or non-segregated accounts"}],"a":"B","e":"<p>In the US, client's money MUST be segregated from the firm's. In the UK, segregation is only OBLIGED to retail clients as professional clients may opt-out of the client money rules.<\/p>"},{"s":3,"n":5,"id":"1072252","q":"<p>Which organisation would provide an independent guarantee?<\/p>","o":[{"l":"A","h":"The exchange"},{"l":"B","h":"The clearing house"},{"l":"C","h":"The exchange member"},{"l":"D","h":"The clearing member"}],"a":"B","e":"<p>A clearing house may operate on either a mutual guarantee or an independent guarantee. With an independent guarantee, if the members margins are not sufficient to close out their position upon default, the clearing house will then have to use their own funds.<\/p>"},{"s":3,"n":6,"id":"1036868","q":"<p>Why are spread margin rates at ICE Clear Europe lower than initial margin rates?<\/p>","o":[{"l":"A","h":"Spreads are less commonly traded"},{"l":"B","h":"Spreads have less perceived risk"},{"l":"C","h":"The constituent positions in a spread are ignored in the calculation of initial margin"},{"l":"D","h":"Spread traders have better liquidity"}],"a":"B","e":"<p>The risk of a spread is less than the risk of two separate open futures positions.<\/p>"},{"s":3,"n":7,"id":"1072254","q":"<p>Which of the following describes spread margin?<\/p>","o":[{"l":"A","h":"A further margin for an increased level of volatility"},{"l":"B","h":"A reduced rate of margin for offsetting position"},{"l":"C","h":"A returnable margin upon opening a contingent liability position"},{"l":"D","h":"A daily margin based on the movement of the contract"}],"a":"B","e":"<p>Other answers define intra-day margin, initial margin and variation margins respectively.<\/p>"},{"s":3,"n":8,"id":"1051979","q":"<p>One of the main purposes of regulators is to reduce which of the following?<\/p>","o":[{"l":"A","h":"Systemic risk"},{"l":"B","h":"Counterparty risk"},{"l":"C","h":"Inflation risk"},{"l":"D","h":"Business risk"}],"a":"A","e":"<p>Although always a stated purpose of regulators, reducing systemic risk is implicit.<br/> The main purpose and aims of regulation, in all markets globally, are: . To maintain and promote confidence in the industry; . To promote understanding by the public: . To provide protection for the public; . To minimise crime and misconduct; and . To assist in maintaining the market's financial stability.<br/> As part of a regulator's goal to implement its objectives, it will look at the extent to which any risk is specific to a firm or systemic.<\/p>"},{"s":3,"n":9,"id":"1016988","q":"<p>An investor who has a long-position in an asset would hedge their position by:<\/p>","o":[{"l":"A","h":"Buying the cash asset"},{"l":"B","h":"Selling the cash asset and buying it back at a later date"},{"l":"C","h":"Selling a futures contract"},{"l":"D","h":"Buying a futures contract"}],"a":"C","e":"<p>The best answer here is for the investor to sell a futures contract to hedge their position.<\/p>"},{"s":3,"n":10,"id":"1015944","q":"<p>What is the name of the system that calculates margin payments of options and futures portfolios?<\/p>","o":[{"l":"A","h":"ICE Clear margining"},{"l":"B","h":"Clearing processing system"},{"l":"C","h":"Theoretical inter-market clearing system"},{"l":"D","h":"Standard portfolio analysis of risk"}],"a":"D","e":"<p>SPAN is the only system given that calculates margin payments. Other systems include TIMS (Theoretical inter-market margining system) and STANS.<\/p>"},{"s":3,"n":11,"id":"1036906","q":"<p>What will be the impact of an increase in interest rates on cost of carry?<\/p>","o":[{"l":"A","h":"No change"},{"l":"B","h":"Decrease"},{"l":"C","h":"Not able to say"},{"l":"D","h":"Increase"}],"a":"D","e":"<p>An increase in interest rates always increases the marginal benefit of being in a futures position relative to the underlying.<\/p>"},{"s":3,"n":12,"id":"1036930","q":"<p>Consider the following details: the cash price for oil is $23 per barrel and the risk free rate of interest is 5%. What is the fair value of the 90 day future if storage costs are 3% of the spot price and the expected price of oil in 90 days time is $27 per barrel? Assume a 360 day year.<\/p>","o":[{"l":"A","h":"$24.61"},{"l":"B","h":"$22.40"},{"l":"C","h":"$23.46"},{"l":"D","h":"$25.41"}],"a":"C","e":"<p>Fair value = cash + costs of carry = $23 + (£23 x 0.05 x 90/360) + ($23 x 0.03 x 90/360) = $23.46.<\/p>"},{"s":3,"n":13,"id":"1036861","q":"<p>Which of the following risks may a bank take on deliberately?<\/p>","o":[{"l":"A","h":"Market and credit"},{"l":"B","h":"Market only"},{"l":"C","h":"Credit only"},{"l":"D","h":"Market, credit and operational"}],"a":"A","e":"<p>Market risk is the risk of price movements. A bank may take on this risk hoping for a favourable price move. Credit risk is the risk of default. A bank may take on credit risk in return for payment ( a credit default swap). Operational risk is the risk of loss arising from inadequate systems and controls. No bank wants operational risk.<\/p>"},{"s":3,"n":14,"id":"1036884","q":"<p>If you wish to sell £ to buy $ which of the following is the best price?<\/p>","o":[{"l":"A","h":"1.4950"},{"l":"B","h":"1.4720"},{"l":"C","h":"1.4810"},{"l":"D","h":"1.4605"}],"a":"A","e":"<p>Assuming the quote is American style, $1.4950 gets you the most $ per £ so is the best quote.<\/p>"},{"s":3,"n":15,"id":"1036870","q":"<p>Which of the following factors leads to the spread on forward foreign exchange quotes being wider than on spot quotes?<\/p>","o":[{"l":"A","h":"Larger exchanges"},{"l":"B","h":"Volatility"},{"l":"C","h":"Time"},{"l":"D","h":"Liquidity"}],"a":"C","e":"<p>Forward bid-ask spreads are wider than spot bid-ask spreads because of the time factor.<\/p>"},{"s":3,"n":16,"id":"1069790","q":"<p>Which option pricing model uses the 'volatility smile' as its pricing basis?<\/p>","o":[{"l":"A","h":"Black-Scholes"},{"l":"B","h":"Binomial"},{"l":"C","h":"SABR"},{"l":"D","h":"Bermudan"}],"a":"C","e":"<p>Volatility smile states that the implied volatility is greater for options with strike prices that are well in the money and very much out of the money. This is the pricing basis for SABR model which in contract to Black-Scholes model that uses a fixed level of implied volatility.<\/p>"},{"s":3,"n":17,"id":"1052128","q":"<p>A warrant traded on the LME:<\/p>","o":[{"l":"A","h":"Gives the holder the right to choose whether to take physical settlement or cash settlement"},{"l":"B","h":"Gives the holder the right to increase their exposure to the physical asset"},{"l":"C","h":"Allows the short to choose delivery location"},{"l":"D","h":"Confers legal ownership of the asset"}],"a":"D","e":"<p>LME warrants are used to prove ownership of deliverable assets at these warehouses. Each warrant entitles the holder to take possession of the specified asset from a specific warehouse.<br/> This system is used by the LME, which, in association with LCH.Clearnet, has also introduced an electronic transfer system, SWORD, for the electronic recording of the transfer of warrants. Warrants can be held in SWORD at an approved depository and clearing centre (Bank One in London).<\/p>"},{"s":3,"n":18,"id":"1055080","q":"<p>If you expected the FTSE index to fall in price and Ydawn shares to rise, which of these are you most likely to do?<\/p>","o":[{"l":"A","h":"Go long the FTSE and a buy a put on Ydawn"},{"l":"B","h":"Go short on the FTSE and buy a call on Ydawn"},{"l":"C","h":"Buy a put on the FTSE and go short Ydawn"},{"l":"D","h":"Buy a call on the FTSE and Long on Ydawn"}],"a":"B","e":"<p>You could benefit from a fall in the FSTE by going short or buying a put. Equally you could gain from a rise in Ydawn by going long or buying a call.<\/p>"},{"s":3,"n":19,"id":"1016987","q":"<p>An investor who hedges his position in the cash market by taking an equal and opposite position in the futures market is most exposed to:<\/p>","o":[{"l":"A","h":"Increase in the price of the asset"},{"l":"B","h":"Movements in the price of the future's asset"},{"l":"C","h":"Movements in the difference between the price of the cash asset and future's price"},{"l":"D","h":"Decrease in the price of the cash asset"}],"a":"C","e":"<p>As the investor is hedged he is not exposed to movements in the value of the underlying or futures contracts as these positions offset each other. However, if the investor closes-out the position (called lifting the hedge early), then he is exposed to basis risk. Basis risk is the risk that the relationship between the cash and futures price has changed.<\/p>"},{"s":3,"n":20,"id":"1036859","q":"<p>Which of the following trades on exchange primarily as a principal?<\/p>","o":[{"l":"A","h":"Broker acting as an agent"},{"l":"B","h":"Private investor"},{"l":"C","h":"Broker acting for client"},{"l":"D","h":"Market maker"}],"a":"D","e":"<p>Market makers and private investors both trade as principals, however only the market maker will be dealing directly on exchange.<\/p>"},{"s":3,"n":21,"id":"1017024","q":"<p>A cumulative preference share has a 6.5% coupon and the dividends have not been paid in the last five years.<br/> Which of the following best describes the rights of the preference shareholders?<\/p>","o":[{"l":"A","h":"The preference shareholders do not have any rights in respect of the dividends not paid to them"},{"l":"B","h":"The dividends for the last five years are still payable to the preference shareholders"},{"l":"C","h":"The preference shareholders may receive a dividend after the ordinary shareholders"},{"l":"D","h":"The preference shareholders can force the company into liquidation"}],"a":"B","e":"<p>If a preference share is a cumulative preference share any dividends not paid are rolled over to the next year.<br/> Accumulated dividends on preference shares must be paid before ordinary dividends<\/p>"},{"s":3,"n":22,"id":"1017000","q":"<p>An investor who buys a call with a higher strike and sells a call with a lower strike has created which of the following positions?<\/p>","o":[{"l":"A","h":"A horizontal spread"},{"l":"B","h":"A diagonal spread"},{"l":"C","h":"A bull call spread"},{"l":"D","h":"A bear call spread"}],"a":"D","e":"<p>This is an example of a bear call spread.<\/p>"},{"s":3,"n":23,"id":"1036899","q":"<p>How does ICE Futures adjust for exchange rate fluctuations, if the EDSP and contract price of a universal stock future are in different currencies?<\/p>","o":[{"l":"A","h":"By converting the EDSP to the contract currency at the spot exchange rate at close"},{"l":"B","h":"The SPAN system will convert, using a time-weighted average for the life of the futures contract"},{"l":"C","h":"The invoice amount will be payable in both currencies"},{"l":"D","h":"The EDSP and contract currency are never different"}],"a":"D","e":"<p>The EDSP and contract currency are NEVER different for universal stock futures.<\/p>"},{"s":3,"n":24,"id":"1015801","q":"<p>An investor is long ten futures contracts and long ten put contracts. To offset market risk from this position, the investor should:<\/p>","o":[{"l":"A","h":"Buy ten call options"},{"l":"B","h":"Sell ten call options"},{"l":"C","h":"Sell ten futures contracts"},{"l":"D","h":"Do nothing as there is no market risk"}],"a":"B","e":"<p>According to put-call parity, being long a future and long a put creates a synthetic long-call. Therefore, to offset this position, the investor should sell calls.<\/p>"},{"s":3,"n":25,"id":"1053752","q":"<p>The EDSP will be calculated on:<\/p>","o":[{"l":"A","h":"Last trading day"},{"l":"B","h":"Last notice day"},{"l":"C","h":"First trading day"},{"l":"D","h":"First notice day"}],"a":"A","e":"<p>The EDSP is calculated on the last trading day.<\/p>"},{"s":3,"n":26,"id":"1036939","q":"<p>Which ONE of the following is not a major exchange traded metal derivative in the UK?<\/p>","o":[{"l":"A","h":"Lead"},{"l":"B","h":"Nickel"},{"l":"C","h":"Platinum"},{"l":"D","h":"Zinc"}],"a":"C","e":"<p>LME is mainly known for trading base metals and only more recently started trading precious metals. Platinum is a precious metal.<\/p>"},{"s":3,"n":27,"id":"4051919","q":"<p>Which of the following best indicates the focus of the Financial Conduct Authority?<\/p>","o":[{"l":"A","h":"Client money, conduct and reducing market abuse"},{"l":"B","h":"Conduct, competition and reducing market abuse"},{"l":"C","h":"Conduct, competition and consumer protection"},{"l":"D","h":"Reducing market abuse, consumer protection and client money"}],"a":"B","e":"<p>This is how the FCA focus is described in the CISI Derivatives manual:<\/p><p>The FCA focuses on:<\/p><p>Conduct – for the market to thrive, firms must behave ethically, stick to the rules and meet regulatory standards<\/p><p>Competition – it encourages healthy competition between firms to keep the market buoyant and help the economy grow<\/p><p>Reducing market abuse – firms need to have procedures to help them identify and stop market abuse practices, such as insider dealing and share price manipulation.<\/p>"},{"s":3,"n":28,"id":"1017038","q":"<p>A bank asking a client for more collateral in respect of their open-positions is equivalent to:<\/p>","o":[{"l":"A","h":"A margin call"},{"l":"B","h":"Payment of variation margin"},{"l":"C","h":"Net liquidation value"},{"l":"D","h":"Maintenance margin"}],"a":"A","e":"<p>This is equivalent to a firm making a margin call.<\/p>"},{"s":3,"n":29,"id":"1015790","q":"<p>Which of the following would be a motivation for undertaking a covered short call?<\/p>","o":[{"l":"A","h":"Prices will rise"},{"l":"B","h":"Prices will fall"},{"l":"C","h":"Prices will remain stable"},{"l":"D","h":"Prices will become more volatile"}],"a":"C","e":"<p>A covered short call strategy normally involves a bank writing an out-of-the-money call (short-call). The writing of the call is 'covered' by a holding in the underlying shares. The motivation for this trade is normally because the writer believes that the market will remain static and that the price of the underlying will not move very much The covered call will result in income even in a static market.<\/p>"},{"s":3,"n":30,"id":"1036871","q":"<p>An investor has a two-month floating rate loan and wants to hedge interest rate exposure without entering into any further contractual obligations. Which of the following is the most suitable hedge?<\/p>","o":[{"l":"A","h":"Interest rate guarantee"},{"l":"B","h":"Interest rate swap"},{"l":"C","h":"Interest rate future"},{"l":"D","h":"Interest rate option"}],"a":"D","e":"<p>The option represents a right, not an obligation.<\/p>"},{"s":3,"n":31,"id":"1036853","q":"<p>A fund manager has a portfolio of FTSE 100 equities worth £8m when the FTSE 100 is at 5,200. How many 5,250 puts would the fund manager need to buy to hedge, assuming each index point is worth £10?<\/p>","o":[{"l":"A","h":"92"},{"l":"B","h":"220"},{"l":"C","h":"152"},{"l":"D","h":"107"}],"a":"C","e":"<p>[£8m/(5,250 x £10)] = 152.380952 (152) contracts.<\/p>"},{"s":3,"n":32,"id":"1036934","q":"<p>Which of the following exchanges are most likely to have arbitrage trades occurring between the two?<\/p>","o":[{"l":"A","h":"ICE and LME"},{"l":"B","h":"ICE and LSE Derivatives"},{"l":"C","h":"ICE and NYMEX"},{"l":"D","h":"OneChicago and NYMEX"}],"a":"C","e":"<p>Both these exchanges have Brent crude oil contracts. However, note that the contracts are slightly different from each other.<\/p>"},{"s":3,"n":33,"id":"1052269","q":"<p>Which of the following best describes the difference between maintenance margin calls and daily variation margin calls?<\/p>","o":[{"l":"A","h":"Variation margin calls are used in the UK only and maintenance margin calls are used in the US only"},{"l":"B","h":"Variation margin calls are used by clearing houses and maintenance margin calls are used by brokers"},{"l":"C","h":"Variation margin calls are triggered at a pre-determined value, maintenance margin calls are not"},{"l":"D","h":"There is no difference between the two processes as maintenance margin calls from the client are daily"}],"a":"B","e":"<p>There is a difference between the two processes. Maintenance margin calls are triggered at a pre-determined value (the maintenance level). Daily variation margin calls use market to market prices to assess how much the client will pay/receive. The processes are not restricted to the geographical regions suggested. However, maintenance margin is more typically used in the UK by brokers.<\/p>"},{"s":3,"n":34,"id":"1036857","q":"<p>Interbank deposit rates are used to determine which of the following?<\/p>","o":[{"l":"A","h":"Repo rate"},{"l":"B","h":"Interbank borrowing rates"},{"l":"C","h":"Fed funds rate"},{"l":"D","h":"Forward rates"}],"a":"B","e":"<p>Deposit rates (e.g. LIBID) and lending rates (e.g. LIBOR) are always closely linked. The interest rate paid in repo agreements is an important benchmark in the money markets, and so is influential on interbank rates (NOT the reverse as suggested by A).<\/p>"},{"s":3,"n":35,"id":"1036920","q":"<p>Which of the following is untrue of the London FX market?<\/p>","o":[{"l":"A","h":"Spot rates are quoted as bid-offer spreads"},{"l":"B","h":"Trading takes place in one central location in London"},{"l":"C","h":"Spot contract settlement is T+2"},{"l":"D","h":"Trading of FX derivatives in London is OTC"}],"a":"B","e":"<p>Forward contracts for foreign exchange traded in London are OTC contracts.<\/p>"},{"s":3,"n":36,"id":"1036891","q":"<p>The reason behind UK-based Recognised Investment Exchanges recording the time of trades conducted on-exchange is:<\/p>","o":[{"l":"A","h":"The FCA require all RIEs to maintain an audit trail of on-exchange transactions"},{"l":"B","h":"In the event of a price dispute between two members"},{"l":"C","h":"In order to satisfy the Clearing House that trades are conducted through the appropriate clearing system"},{"l":"D","h":"RIEs do not record the time of trades conducted on-exchange"}],"a":"A","e":"<p>The FCA require all RIEs to maintain an audit trail of transactions conducted on-exchange.<\/p>"},{"s":3,"n":37,"id":"1015802","q":"<p>In a contango market, if a trader expects the spread to widen he should:<\/p>","o":[{"l":"A","h":"Buy nearby contract and sell the deferred contract"},{"l":"B","h":"Sell the nearby contract and buy the deferred contract"},{"l":"C","h":"Buy the nearby contract and buy the deferred contract"},{"l":"D","h":"Sell the nearby contract and sell the deferred contract"}],"a":"B","e":"<p>In a contango market, with widening spreads, the investor should sell the spread: i.e. sell the near-dated contract and buy the far-dated contract.<\/p>"},{"s":3,"n":38,"id":"1036921","q":"<p>Which of the following best describes the purpose of the FCA's push towards Treating Customers Fairly (TCF)?<\/p>","o":[{"l":"A","h":"An agenda that led to the creation of MiFID and has been replaced by the rules in this directive"},{"l":"B","h":"An agenda that helps consumers achieve a fair deal in the retail market"},{"l":"C","h":"A set of principles set down for all FCA regulated firms to follow"},{"l":"D","h":"A set of principles providing guidance to firms conducting eligible counterparty business"}],"a":"B","e":"<p>TCF does consist of principles, but the principles only apply to firms conducting retail business.<br/> Choice 'B' is the best of the descriptions given.<\/p>"},{"s":3,"n":39,"id":"1036919","q":"<p>A clearing house is likely to reduce the level of initial margin if the following occurs:<\/p>","o":[{"l":"A","h":"The contract volatility increases"},{"l":"B","h":"The risk-free rate of interest increases"},{"l":"C","h":"The risk-free rate of interest decreases"},{"l":"D","h":"The contract volatility decreases"}],"a":"D","e":"<p>Additional initial margin can be called for increased levels of volatility - therefore a fall in volatility may also reduce the initial margin requirement.<\/p>"},{"s":3,"n":40,"id":"1017022","q":"<p>Which of the following factors has the greatest effect on determining the coupon rate on a corporate bond?<\/p>","o":[{"l":"A","h":"Price/Earnings ratio of the company"},{"l":"B","h":"Revenue of the company"},{"l":"C","h":"Industry the company operates in"},{"l":"D","h":"Credit rating of the company"}],"a":"D","e":"<p>The credit rating of a company will have the greatest affect on the coupon paid on a corporate bond. The higher the credit rating, the lower the coupon.<\/p>"},{"s":3,"n":41,"id":"1036951","q":"<p>Put the following actions in order from first to last relating to a holder deciding to exercise an option:<\/p><p class=\"rom\"><b>I<\/b> The writer receives an assignment notice from the clearing house and must then honour their obligations<\/p><p class=\"rom\"><b>II<\/b> The broker receives an assignment notice from the clearing house and allocates it to a client who holds a position as a writer<\/p><p class=\"rom\"><b>III<\/b> The broker completes an exercise notice and forwards it to the clearing house<\/p><p class=\"rom\"><b>IV<\/b> Upon receipt of the exercise notice the clearing house assigns it to a member firm<\/p>","o":[{"l":"A","h":"III, IV, II, I"},{"l":"B","h":"II, III, IV, I"},{"l":"C","h":"I, II, III, IV"},{"l":"D","h":"IV, I, III, II"}],"a":"A","e":"<p>The holder informs their broker that they wish to deliver, which begins the whole process of exercising an option.<\/p>"},{"s":3,"n":42,"id":"1036943","q":"<p>Which of the following is the change of the premium of an option with respect to changes in the underlying?<\/p>","o":[{"l":"A","h":"Theta"},{"l":"B","h":"Delta"},{"l":"C","h":"Gamma"},{"l":"D","h":"Vega"}],"a":"B","e":"<p>Delta is a measure of the sensitivity of the premium of an option to changes in the price of the underlying.<\/p>"},{"s":3,"n":43,"id":"1036945","q":"<p>A floor dealer working on an open outcry exchange carries out trades on behalf of another brokerage house. Once the trade is done, the floor broker passes the trade back to the originating firm. This is called:<\/p>","o":[{"l":"A","h":"An assignment"},{"l":"B","h":"A give-up"},{"l":"C","h":"Dual brokerage"},{"l":"D","h":"Cross trading"}],"a":"B","e":"<p>Note: 'giving-up' trades is also called 'allocating'. Small brokerage houses that do not have floor brokers themselves often employ floor brokers to execute their business. Once the trade is completed, the floor broker gives up the trade to the originating firm.<\/p>"},{"s":3,"n":44,"id":"1036882","q":"<p>Which of the following is the SEC not responsible for?<\/p>","o":[{"l":"A","h":"Stock options"},{"l":"B","h":"Stock index options"},{"l":"C","h":"Currency transactions on exchange"},{"l":"D","h":"NYMEX"}],"a":"D","e":"<p>NYMEX and CME are the responsibility of the CFTC.<\/p>"},{"s":3,"n":45,"id":"1016982","q":"<p>When does the clearing house become counterparty to a trade?<\/p>","o":[{"l":"A","h":"When the trade is struck"},{"l":"B","h":"When the trade is reported"},{"l":"C","h":"When the trade is settled"},{"l":"D","h":"When the trade is registered"}],"a":"D","e":"<p>The clearing house becomes a central counterparty to the trade when the trade has been registered: i.e. after it has passed through the trade registration system and clearing processing system.<\/p>"},{"s":3,"n":46,"id":"1016999","q":"<p>An investor wishing to undertake a long-strangle would do which of the following trades?<\/p>","o":[{"l":"A","h":"Buy a call and a put with the same strike and same expiry month"},{"l":"B","h":"Buy a put and a call with different strikes, but the same expiry month"},{"l":"C","h":"Sell a put and a call with the same strike and same expiry month"},{"l":"D","h":"Sell a put and a call with the same strike month, but a different expiry month"}],"a":"B","e":"<p>A long-strangle involves the purchase of a call and a put option with the different strikes but the same expiry month.<br/> A long-straddle involves the purchase of a call and put option with the same expiry month and same strike.<\/p>"},{"s":3,"n":47,"id":"1036940","q":"<p>If the 250 call is 15p, the stock is at 200p, short-term interest rates are 8% and there are 250 days until expiry, what is the price of the European style put?<\/p>","o":[{"l":"A","h":"15.00p"},{"l":"B","h":"50.16p"},{"l":"C","h":"51.16p"},{"l":"D","h":"52.16p"}],"a":"D","e":"<p>Using put-call parity:<br/> 15p - P = 200p - 250p / (1 + 0.08)^ (250 / 365)<br/> 15p - P = 200p - 237.16<br/> 15p - P = - 37.16<br/> P = 52.16<\/p>"},{"s":3,"n":48,"id":"1036928","q":"<p>A market participant goes long 20 contracts of the ICE's Brent Crude at $110 and closes out when the price has risen to $120. What is the overall profit on the position?<\/p><ul> <li><p>The contract size is for 1000 barrels.<\/p><\/li> <li><p>The tick size is 1 cent/barrel<\/p><\/li> <li><p>The tick value is $10.<\/p><\/li> <\/ul>","o":[{"l":"A","h":"$50,000"},{"l":"B","h":"$100,000"},{"l":"C","h":"$150,000"},{"l":"D","h":"$200,000"}],"a":"D","e":"<p>The contract size is for 1000 barrels. The tick size is 1 cent/barrel and the tick value is $10. The overall profit on the position is therefore equal to: 1,000 ticks x $10 x 20 contracts = $200,000.<\/p>"},{"s":3,"n":49,"id":"1036869","q":"<p>Which of the following events is covered by a credit default swap?<\/p>","o":[{"l":"A","h":"Unsecured loan"},{"l":"B","h":"Bankruptcy of the firm that issued the bond"},{"l":"C","h":"Improved liquidity"},{"l":"D","h":"Interest rate guarantee"}],"a":"B","e":"<p>An investor holding a bond might take up a credit derivative to provide compensation following a credit event.<\/p>"},{"s":3,"n":50,"id":"1036916","q":"<p>Which one of the following would create a synthetic equity fund in combination with a holding of a cash deposit?<\/p>","o":[{"l":"A","h":"Long future"},{"l":"B","h":"Short future"},{"l":"C","h":"Long call"},{"l":"D","h":"Short call"}],"a":"A","e":"<p>A synthetic equity fund would invest in risk-free assets such as cash or Treasury bills and also a long futures position to create the same exposure with derivatives as holding the physical assets.<\/p>"},{"s":3,"n":51,"id":"1036929","q":"<p>In order to satisfy good delivery in relation to LME contracts, the physical asset must be issued from:<\/p>","o":[{"l":"A","h":"Any warehouse"},{"l":"B","h":"LME approved warehouses"},{"l":"C","h":"LCH.Clearnet approved warehouses"},{"l":"D","h":"Any shipping port"}],"a":"B","e":"<p>Delivery must be made from LME APPROVED warehouses.<\/p>"},{"s":3,"n":52,"id":"1036914","q":"<p>Which of the following is the best definition of the closing range?<\/p>","o":[{"l":"A","h":"The weighted average of the traded prices during the closing period"},{"l":"B","h":"The average of the traded prices during the closing period"},{"l":"C","h":"The settlement price"},{"l":"D","h":"The highest and lowest price during the closing period"}],"a":"D","e":"<p>The closing range is the highest and lowest prices, or bids and offers, recorded during the period designated as the official close by the exchange.<br/> The settlement price is normally determined using an average of the contract values in a set period of time prior to delivery.<\/p>"},{"s":3,"n":53,"id":"1036854","q":"<p>Price transparency means:<\/p>","o":[{"l":"A","h":"Prices are available from quote vendors as well as via trading screens"},{"l":"B","h":"The ability to estimate the fair value of a future and calculate value basis"},{"l":"C","h":"Preventing prices from moving too far or too fast"},{"l":"D","h":"The availability of the price information to market participants"}],"a":"D","e":"<p>This question is simply testing the definition of price transparency.<\/p>"},{"s":3,"n":54,"id":"1036925","q":"<p>Which of the following are uses of futures?<\/p><p class=\"rom\"><b>I<\/b> Arbitrage<\/p><p class=\"rom\"><b>II<\/b> Speculation<\/p><p class=\"rom\"><b>III<\/b> Hedging<\/p><p class=\"rom\"><b>IV<\/b> Cash and carry<\/p>","o":[{"l":"A","h":"I and IV"},{"l":"B","h":"I and III"},{"l":"C","h":"I and II"},{"l":"D","h":"I, II, III, IV"}],"a":"D","e":"<p>Cash and carry is a way of using futures to take advantage of arbitrage opportunities.<\/p>"},{"s":3,"n":55,"id":"1036876","q":"<p>What are the main differences between an interest rate swap and a currency swap?<\/p><p class=\"rom\"><b>I<\/b> The principal amounts of an interest rate swap are transferred between the counterparties but not transferred between counterparties of a currency swap<\/p><p class=\"rom\"><b>II<\/b> The principal amounts of a currency swap are transferred between the counterparties but not transferred between counterparties of an interest rate swap<\/p><p class=\"rom\"><b>III<\/b> The periodic payments of an interest rate swap are made gross but in a currency swap are paid net<\/p><p class=\"rom\"><b>IV<\/b> The periodic payments of a currency swap are made gross but in an interest rate swap are paid net<\/p>","o":[{"l":"A","h":"I and III"},{"l":"B","h":"I and IV"},{"l":"C","h":"II and III"},{"l":"D","h":"II and IV"}],"a":"D","e":"<p>The principal amount of an IRS is notional and not actually transferred between the counterparties to the swap. IRSs also make payments net, i.e. payments between the counterparties are netted out.<\/p>"},{"s":3,"n":56,"id":"1036888","q":"<p>Which of the following is the best definition of a cross-trade?<\/p>","o":[{"l":"A","h":"A broker takes both sides of the deal"},{"l":"B","h":"A broker deals with a market maker"},{"l":"C","h":"A broker has a short underlying position and goes long on the future"},{"l":"D","h":"A non-member arranges for delivery to an unusual destination"}],"a":"A","e":"<p>A cross trade is where a broker will be acting as agent for two clients. The broker will therefore have to buy and sell.<\/p>"},{"s":3,"n":57,"id":"1036941","q":"<p>Which of the following would you normally expect to be negative from the long's point of view?<\/p>","o":[{"l":"A","h":"Intrinsic value"},{"l":"B","h":"Time value"},{"l":"C","h":"Call option deltas"},{"l":"D","h":"Put option deltas"}],"a":"D","e":"<p>Intrinsic and time value in an option's premium can only go down as far as zero (they can never be negative). Call option deltas are positive as the premium moves in the same direction as the underlying asset. Put options, on the other hand, increase in value when the underlying falls. The delta is therefore negative.<\/p>"},{"s":3,"n":58,"id":"1036918","q":"<p>If the interest rate is less than the dividend yield on a FTSE 100 index future:<\/p>","o":[{"l":"A","h":"The cash price will be lower than the futures price"},{"l":"B","h":"The futures price will be less than the cash price"},{"l":"C","h":"The cash price and the futures price will be the same"},{"l":"D","h":"It will not make any difference"}],"a":"B","e":"<p>If the interest rate is less than the dividend yield, the fair value of the future will be less than the cash price because of a negative cost of carry. This is also known as backwardation.<\/p>"},{"s":3,"n":59,"id":"1052135","q":"<p>Which of the following would best describe a credit line?<\/p>","o":[{"l":"A","h":"It is an average of the investor's daily trades with the member firm"},{"l":"B","h":"It is a pre-established amount of credit extended to the investor by the member firm and that the investor can draw against as needed."},{"l":"C","h":"It is the assessment of how much credit exposure a member firm is prepared to be exposed to in relation to a counterparty"},{"l":"D","h":"It is the number of trades that an investor is allowed to do in any asset to prevent building up dominance in that market."}],"a":"B","e":"<p>Exposure to a counterparty is called a credit limit, dominant positions are position limits.<\/p>"},{"s":3,"n":60,"id":"1036893","q":"<p>A company has issued a fixed coupon bond and now expects interest rates to fall. Which of the following swaps is the most suitable?<\/p>","o":[{"l":"A","h":"Enter a receiver swap"},{"l":"B","h":"Enter a payer swap"},{"l":"C","h":"Basis swap"},{"l":"D","h":"Fixed for fixed"}],"a":"A","e":"<p>If the company believes that interest rates will go down then it will want to swap a fixed rate loan for a floating rate loan.<\/p>"},{"s":3,"n":61,"id":"1036897","q":"<p>An investor holds an OTM put option. The value of the underlying rises by 20%. What would you expect to happen to the value of the option?<\/p>","o":[{"l":"A","h":"Increase"},{"l":"B","h":"Decrease"},{"l":"C","h":"Remain the same"},{"l":"D","h":"Unable to say"}],"a":"B","e":"<p>A long put is a bearish trade. As the value of the underlying increases the option will move further out-of-the money and its premium will fall.<\/p>"},{"s":3,"n":62,"id":"1036887","q":"<p>In an open outcry market what is the market price?<\/p>","o":[{"l":"A","h":"Last trade"},{"l":"B","h":"Current bid/offer quotes"},{"l":"C","h":"Average of the last ten minutes of trading"},{"l":"D","h":"No market price is reported"}],"a":"B","e":"<p>Current bid/offer quotes represent prices at which trading is possible and are therefore the market price.<\/p>"},{"s":3,"n":63,"id":"1017039","q":"<p>Which of the following is the best description of a closing contract on the LME?<\/p>","o":[{"l":"A","h":"Closing-out of a position to realise a profit on a contract on the settlement date"},{"l":"B","h":"A contract which allows delivery before the settlement date"},{"l":"C","h":"A contract which allows delivery after the settlement date"},{"l":"D","h":"Closing-out of a position to realise a profit on a contract on the trade date"}],"a":"A","e":"<p>A closing contract, as the name suggests, is a contract that closes-out a position. However, profits are not realised, on the LME, until the settlement date (prompt date).<\/p>"},{"s":3,"n":64,"id":"1017014","q":"<p>Why would a fund manager holding a BBB-rated corporate bond invest in a credit derivative?<\/p>","o":[{"l":"A","h":"To protect himself against a downgrade of a bond"},{"l":"B","h":"To turn the bond from BBB rated to AAA rated"},{"l":"C","h":"To utilise spare cash reserves"},{"l":"D","h":"To gain further exposure to the corporate bond market"}],"a":"A","e":"<p>A credit derivative is used to provide protection against credit events such as a default on a bond. Even though a downgrade is not a credit event, a downgrade would mean that the credit derivative becomes more valuable and therefore provides a hedge against the downgrade of the bond.<\/p>"},{"s":3,"n":65,"id":"1036926","q":"<p>The significance of the arbitrage channel is:<\/p>","o":[{"l":"A","h":"That futures' prices are supposed to trade within this range"},{"l":"B","h":"That transaction costs outweigh the profit from an arbitrage transaction within this range"},{"l":"C","h":"That the futures price and the price of the underlying are outside this range"},{"l":"D","h":"That arbitrage will only take place within this range"}],"a":"B","e":"<p>The arbitrage channel is a range of values around the fair value of a future for which arbitrage is possible, but not economically viable. Arbitrage can only take place profitably if the futures price is trading outside the arbitrage channel.<\/p>"},{"s":3,"n":66,"id":"1015707","q":"<p>Which of the following investments would create a diagonal spread?<\/p>","o":[{"l":"A","h":"An investor buys a call option and simultaneously sells another call option with a different strike and different expiry"},{"l":"B","h":"An investor buys a put option and simultaneously sells another put option with a different strike and the same expiry"},{"l":"C","h":"An investor buys a call option and simultaneously sells a put option with the same strike and the same expiry"},{"l":"D","h":"An investor buys a put option and simultaneously sells a call option with the same strike and a different expiry"}],"a":"A","e":"<p>A diagonal spread trade is when either all calls or all puts are bought and sold with a different strike and different expiry month.<\/p>"},{"s":3,"n":67,"id":"1036867","q":"<p>Which of the following statements about clearing members of an exchange is false?<\/p>","o":[{"l":"A","h":"General clearing members may clear trades for themselves"},{"l":"B","h":"Individual clearing members may clear trades for themselves and clients"},{"l":"C","h":"General clearing members may use non-clearing members to clear trades on their behalf"},{"l":"D","h":"General clearing members may clear trades for clients"}],"a":"C","e":"<p>Non-clearing members cannot clear any trades.<\/p>"},{"s":3,"n":68,"id":"1036896","q":"<p>Which of the following creates a synthetic long call?<\/p>","o":[{"l":"A","h":"Long the underlying, long a put"},{"l":"B","h":"Short the underlying, long a put"},{"l":"C","h":"Long the underlying, short a put"},{"l":"D","h":"Long the underlying, long a call"}],"a":"A","e":"<p>A synthetic long call position is created by going long the underlying and long a put option.<\/p>"},{"s":3,"n":69,"id":"1036874","q":"<p>Which of the following is a feature of a hedge fund?<\/p>","o":[{"l":"A","h":"Passive investment strategies"},{"l":"B","h":"Limited gearing"},{"l":"C","h":"Good access for less sophisticated investors"},{"l":"D","h":"High performance fees"}],"a":"D","e":"<p>Hedge funds adopt aggressive investment strategies to outperform the market. They usually attract high performance fees.<\/p>"},{"s":3,"n":70,"id":"1016985","q":"<p>Which of the following types of margin would allow future margin payments to be deducted from initial margin?<\/p>","o":[{"l":"A","h":"Intra-day margin"},{"l":"B","h":"Maintenance margin"},{"l":"C","h":"Variation margin"},{"l":"D","h":"Net margin"}],"a":"B","e":"<p>This is a description of a maintenance margin system where variation margin payments are netted-off against initial margin.<\/p>"},{"s":3,"n":71,"id":"1036883","q":"<p>A steepening yield curve means that:<\/p>","o":[{"l":"A","h":"Long term rates are rising faster than short term rates"},{"l":"B","h":"Short term rates are rising faster than long term rates"},{"l":"C","h":"Long term prices are rising faster than short term prices"},{"l":"D","h":"Investors will get lower returns on longer term deposits"}],"a":"A","e":"<p>Longer term rates are rising faster than short term rates.<\/p>"},{"s":3,"n":72,"id":"1017013","q":"<p>A client provides initial margin to their broker of £10,000 and the customer agreement has a margin call level of £8,000. Variation margin payments reduce the balance down to £7,750. Which of the following is TRUE?<\/p>","o":[{"l":"A","h":"The client will be required to make a payment of £250"},{"l":"B","h":"The client will be required to make a payment of £2,250"},{"l":"C","h":"The client will be required to make a payment of 10% of the initial margin"},{"l":"D","h":"The client will be required to close-out the position"}],"a":"B","e":"<p>If a margin call is triggered, the client is required to make a payment to restore the margin to the original initial margin level.<\/p>"},{"s":3,"n":73,"id":"1079788","q":"<p>Which of the following describes a down and in form of a barrier option?<\/p>","o":[{"l":"A","h":"A knock in option, that is activated when the asset price falls to or below the pre-determined level"},{"l":"B","h":"A knock out option, that is de-activated when the asset price falls to or below the pre-determined level"},{"l":"C","h":"A knock in option, that is activated when the asset price rises to or above the pre-determined level"},{"l":"D","h":"A knock out option, that is de-activated when the asset price rises to or above the pre-determined level"}],"a":"A","e":"<p>B describes a down and out, knock out option.<br/> C describes an up and in, knock in option.<br/> D describes an up and out, knock out option.<\/p>"},{"s":3,"n":74,"id":"1036935","q":"<p>A cereal manufacturer creates a hedge by buying wheat futures at £106 per tonne. The spot price is £100. He closes out his hedge when the future is trading at £112 and buys the wheat in the cash market for £108. The net price paid per tonne is equal to:<\/p>","o":[{"l":"A","h":"£108"},{"l":"B","h":"£112"},{"l":"C","h":"£102"},{"l":"D","h":"£106"}],"a":"C","e":"<p>Cash price paid = £108.<br/> Profit on hedge = £112 - £106 = £6<br/> Net price paid = £108 - £6 = £102.<\/p>"},{"s":3,"n":75,"id":"1036856","q":"<p>All of the following are applicable to the FCA's principle-based approach EXCEPT:<\/p>","o":[{"l":"A","h":"They centralise the responsibility of regulation on to the FCA"},{"l":"B","h":"They allow flexibility in the regulations, allowing the development of new products"},{"l":"C","h":"They allow smaller firms to access the regulations by prescribing fewer models of behaviour"},{"l":"D","h":"They promote a move away from prescriptive rules and a move towards achieving objectives"}],"a":"A","e":"<p>The FCA's principle-based approach sets down high level objectives for firms to achieve. The rationale is that it will promote innovation, allow increased accessibility to the regulations and allow firms to focus on objectives rather than prescriptive rules.<br/> The responsibility for following these regulations remains with the firm.<\/p>"},{"s":3,"n":76,"id":"1055228","q":"<p>Which statement would be correct if current share price is 95?<\/p><p><img src=\"data:image/gif;base64,R0lGODdh4AHwAHcAACH+GlNvZnR3YXJlOiBNaWNyb3NvZnQgT2ZmaWNlACwAAAAA4AHwAIf///97e3vm7+Zzc3OMjJTW3t6EhHulpZzWztYQEFo6GVJaQnuElFpSY2OMjIzFY0JKGRBKSs5CKWMZ72OMKd4ZrWOMKZyU3r1SCN6MSpzFSt4ZCJxSzmPFCN6tnGNSCJzFSpxSjGPFCJwInOYI3uYZSpxazqUZzmOMCN4ZjGOMCJwpGVIpCFJajOaMnO9areacY2sQGRDF3r1a7+ZKGTFazubm7/cxQtbOY2sZShA ey"},{"l":"C","h":"The put would be in-the-money"},{"l":"D","h":"The call would be out-of-the-money"}],"a":"B","e":"<p>This is the profit/loss of the writer of a call option. The writer's maximum gain is crystallised at 80 showing that this is the option strike. This means that the holder of the option would have the right to buy at 80 when the market is 95 meaning the call option is in-the-money.<\/p>"},{"s":3,"n":77,"id":"1072245","q":"<p>In relation to a credit spread option, which of the following would be a credit spread?<\/p>","o":[{"l":"A","h":"The difference in a yield on a particular asset and a risk free asset"},{"l":"B","h":"The difference in price on a particular asset and a risk free asset"},{"l":"C","h":"The difference between the actual spread and the agreed strike"},{"l":"D","h":"The difference in the option's premium on a particular asset and the option premium on a risk free asset"}],"a":"A","e":"<p>In a credit spread option, a credit spread is first defined as the difference between the yield on a particular asset (eg, the yield on a particular bond issued by a company) and some agreed benchmark (eg, a swap rate or government Treasury bond yield for the same maturity as the bond).<\/p>"},{"s":3,"n":78,"id":"1036917","q":"<p>The purchase of a futures contract at the same time as the sale of the underlying asset in the cash market is best described as:<\/p>","o":[{"l":"A","h":"Convertible arbitrage"},{"l":"B","h":"Conversion"},{"l":"C","h":"Basis trading"},{"l":"D","h":"Spread trading"}],"a":"C","e":"<p>This is an example of basis trading. The investor is selling basis, a trade associated with the expectation of basis weakening (the cash price weakening in relation to the future price). Spread trading involves the purchase and sale of futures contracts in different months.<\/p>"},{"s":3,"n":79,"id":"1016997","q":"<p>Which of the following is an example of an intra-market spread?<\/p>","o":[{"l":"A","h":"Long a lead September futures contract, long a September put contract"},{"l":"B","h":"Long a lead September futures contract, short a September put contract"},{"l":"C","h":"Long a tin futures contract, short a lead futures contract"},{"l":"D","h":"Long September lead futures contract, short a December lead futures contract"}],"a":"D","e":"<p>An intra-market spread is where an investor has a position in two different months, but in the same contract. <br/> An inter-market spread is where an investor has a position in different, but related, contracts.<\/p>"},{"s":3,"n":80,"id":"1036923","q":"<p>In what state would the market be if there was adequate supply and storage?<\/p>","o":[{"l":"A","h":"Contango"},{"l":"B","h":"Backwardation"},{"l":"C","h":"Flat yield curve"},{"l":"D","h":"Inverted yield curve"}],"a":"A","e":"<p>Adequate supply and adequate storage all point to normal market conditions. Normally markets are in contango.<\/p>"},{"s":3,"n":81,"id":"1036881","q":"<p>Which of the following is necessary in order for a UK broker to arrange a deal in derivatives for a US client on a US exchange?<\/p>","o":[{"l":"A","h":"Register with the FCA"},{"l":"B","h":"Seek Part 30 exemption"},{"l":"C","h":"Register with the CFTC"},{"l":"D","h":"No special requirements"}],"a":"C","e":"<p>Registration with the CFTC is necessary. Only a UK firm dealing on a non-US exchange could seek Part 30 exemption.<\/p>"},{"s":3,"n":82,"id":"1055085","q":"<p>If forward rates are due to flatten the yield curves would become more:-<\/p>","o":[{"l":"A","h":"Normal"},{"l":"B","h":"Upward"},{"l":"C","h":"Inverted"},{"l":"D","h":"Horizontal"}],"a":"D","e":"<p>A flattening of the yield curve would make it more horizontal.<\/p>"},{"s":3,"n":83,"id":"1036947","q":"<p>What spread trade would make sense in the following situation?<br/> An investor expects that the Eurozone yield curve would rotate and flatten at the long end.<\/p>","o":[{"l":"A","h":"Buy the euribor future and sell the eurodollar future"},{"l":"B","h":"Sell the euribor future and Buy the bund future"},{"l":"C","h":"Sell the bund future and buy the euribor future"},{"l":"D","h":"Sell the euribor future and sell the bund future"}],"a":"B","e":"<p>Euribor futures= 100 - eurozone interest rate<br/> A rotation with a flattening of the long term, assuming a normal yield curve, will mean that short-term interest rates are expected to rise in relation to long-term interest rates. If short-term interest rates rise, the price of euribor futures will fall - so you will sell the euribor future.<\/p>"},{"s":3,"n":84,"id":"1016984","q":"<p>Taking into account offsetting position, as a contract approaches delivery, which of the following types of margin is triggered?<\/p>","o":[{"l":"A","h":"Intra-day margin"},{"l":"B","h":"Spot month margin"},{"l":"C","h":"Maintenance margin"},{"l":"D","h":"Initial margin"}],"a":"B","e":"<p>The best answer and most literal answer is spot month margin, as this is a margin which is specifically payable in the delivery month.<\/p>"},{"s":3,"n":85,"id":"1036894","q":"<p>Calculate the net delta of the following portfolio:<br/> Long 15 futures and long 8 calls with a delta of 0.65 each.<\/p>","o":[{"l":"A","h":"+20.2"},{"l":"B","h":"+15"},{"l":"C","h":"-20.2"},{"l":"D","h":"-15"}],"a":"A","e":"<p>Net (cumulative delta) = (15 x +1) + (8 x +0.65) = + 20.2<\/p>"},{"s":3,"n":86,"id":"1036909","q":"<p>A market in backwardation is best described as:<\/p>","o":[{"l":"A","h":"The futures price is trading above the cash price"},{"l":"B","h":"The futures price is not trading at its fair value"},{"l":"C","h":"A possibility exists to agree to buy the asset for delivery at a future date at a lower price than the asset is currently trading in the cash market"},{"l":"D","h":"The price of the underlying asset is trading below the price of the synthetic position leading to a risk-free profit opportunity by trading the reversal"}],"a":"C","e":"<p>Backwardation occurs when the asset yield exceeds the cost of carry.<\/p>"},{"s":3,"n":87,"id":"1017033","q":"<p>Which of the following is the best description of a swaption?<\/p>","o":[{"l":"A","h":"The holder has the right to enter into an option"},{"l":"B","h":"The holder can exercise the option and enter into a swap"},{"l":"C","h":"The holder has the obligation to enter into a swap agreement"},{"l":"D","h":"The writer has the obligation to enter into an option"}],"a":"B","e":"<p>A swaption is an arrangement where the buyer of the swaption pays an upfront sum for the right to enter into a swap agreement by a pre-agreed date in the future.<\/p>"},{"s":3,"n":88,"id":"1036873","q":"<p>The popularity of OTC derivatives trading has increased because of:<\/p>","o":[{"l":"A","h":"Liquidity in the OTC market"},{"l":"B","h":"Protection afforded by stringent regulation"},{"l":"C","h":"Diversity due to flexibility over contract specifications"},{"l":"D","h":"Strict margin requirements guaranteeing against default"}],"a":"C","e":"<p>OTC markets are not liquid, with bespoke contracts being designed to the specifications of market participants. There is less stringent regulation and generally no requirement for margin.<\/p>"},{"s":3,"n":89,"id":"1036933","q":"<p>Assuming the spot rate for oil is $150 and the costs of carry have been calculated as $10 per month. Which of the following futures prices represent a potential arbitrage opportunity?<\/p><p class=\"rom\"><b>I<\/b> Three-month future trading at $170<\/p><p class=\"rom\"><b>II<\/b> Four-month future trading at $190<\/p><p class=\"rom\"><b>III<\/b> Five-month future trading at $200<\/p><p class=\"rom\"><b>IV<\/b> Six-month future trading at $210<\/p>","o":[{"l":"A","h":"I only"},{"l":"B","h":"I and II"},{"l":"C","h":"I, II and III"},{"l":"D","h":"I, II, III and IV"}],"a":"A","e":"<p>A: Fair value = Cash + 3 months carry = $150 + $30 = $180 B: Fair value = Cash + 4 months carry = $150 + $40 = $190. C: Fair value = Cash + 5 months carry = $150 + $50 = $200. C: Fair value = Cash + 6 months carry = $150 + $60 = $210.<br/> All futures, except A, are trading at their fair value. Only A has a potential arbitrage opportunity.<\/p>"},{"s":3,"n":90,"id":"1075069","q":"<p>What type of clearing house member can clear for themselves and their clients only?<\/p>","o":[{"l":"A","h":"Individual"},{"l":"B","h":"Self"},{"l":"C","h":"General"},{"l":"D","h":"Non clearing"}],"a":"A","e":"<p>An individual member can clear for their own account and their clients. A general clearing member can also clear for non-clearing members.<\/p>"},{"s":3,"n":91,"id":"1036936","q":"<p>You are a ring dealing member of the London Metals Exchange and have quoted one of your clients a price over the telephone. What response should you provide if the client requests a 'second opinion'?<\/p>","o":[{"l":"A","h":"Inform the client he may contact Exchange officials to confirm quoted prices"},{"l":"B","h":"Inform the client that real-time prices from the floor are available from quote vendors"},{"l":"C","h":"Inform the client that he has the right to inspect FCA records of real-time prices"},{"l":"D","h":"There is no possibility of a second opinion"}],"a":"B","e":"<p>Quote vendors, such as Reuters and Bloomberg, provide real-time prices.<\/p>"},{"s":3,"n":92,"id":"1055084","q":"<p>The rules set out in CFTC Part 30 prohibit:-<\/p>","o":[{"l":"A","h":"Dealing for a US investor outside of the US with an exemption."},{"l":"B","h":"Dealing for a US investor outside of the US without an exemption."},{"l":"C","h":"Dealing for a US investor in the US without an exemption."},{"l":"D","h":"Dealing for UK investors in the US without an exemption."}],"a":"B","e":"<p>CFTC Part 30 specifies that it is illegal to trade with US customers on a US exchange without the relevant authorisation from the NFA, unless the trade is conducted via an NFA firm. Non-US firms are prohibited from dealing with US customers on any non-US exchange, unless they trade via a US-registered firm or have been granted exemption. Firms are prohibited from trading non-US products for US customers, unless the products have been approved by the CFTC. Part 30 Exemption Non-US firms can seek exemption from Part 30, but only in respect of derivatives trades on non-US exchanges.<\/p>"},{"s":3,"n":93,"id":"1055071","q":"<p>You would exercise a puttable bond when:-<\/p>","o":[{"l":"A","h":"Interest rates rise"},{"l":"B","h":"Interest rates fall"},{"l":"C","h":"The FTSE 100 index rises"},{"l":"D","h":"The FTSE 100 index falls"}],"a":"A","e":"<p>A put provision entitles the holder of the bond to demand early repayment. This could be used if the bond's price is reduced by rising interest rates.<\/p>"},{"s":3,"n":94,"id":"4068016","q":"<p>Two clearing members are counterparties to the same trade on exchange. Their trade is novated by a central counterparty(CCP). What relationship now exists between the two clearing members?<\/p>","o":[{"l":"A","h":"Flows of variation margin will now pass daily from the buying member to the the selling member until the delivery date"},{"l":"B","h":"Each counterparty will now hold an independent contract with the CCP until delivery or they close-out"},{"l":"C","h":"The CCP manages the risk of the two parties but delivery will occur away from the CCP guarantee"},{"l":"D","h":"The CCP has converted the exchange-traded contract into an OTC contract allowing physical delivery to occur"}],"a":"B","e":"<p>Novation is where the CCP become buyer to every seller and seller to every buyer by creating independent contracts with each party to a trade.<\/p><p>Note: With exchange-traded contracts the CCP holds the contracts independent until the end of the contract, even if they proceed to delivery. In the OTC market, the CCP will allow delivery to occur between original counterparties.<\/p>"},{"s":3,"n":95,"id":"1036924","q":"<p>How would you describe the risk associated with buying a futures contract?<\/p>","o":[{"l":"A","h":"Unlimited"},{"l":"B","h":"Limited to initial margin"},{"l":"C","h":"Limited to the value of the underlying"},{"l":"D","h":"Limited to the futures price"}],"a":"D","e":"<p>When entering into a futures contract, the potential downside, although large, is limited to the futures price. You could take delivery of an underlying asset worth nothing, and still be contractually bound to pay the futures price.<\/p>"},{"s":3,"n":96,"id":"1036898","q":"<p>Which of the following BEST describes the motivation for gearing?<\/p>","o":[{"l":"A","h":"Higher risk for higher return"},{"l":"B","h":"Lower risk for similar return"},{"l":"C","h":"Higher risk for lower return"},{"l":"D","h":"Lower risk for higher return"}],"a":"A","e":"<p>Gearing or leverage is the ability to generate higher percentage returns based on initial outlay. This can work both ways and could also result in greater relative losses.<\/p>"},{"s":3,"n":97,"id":"1036890","q":"<p>If an equity option's delta increases which of the following is true?<\/p>","o":[{"l":"A","h":"Margin required of writer of option increases"},{"l":"B","h":"Margin required of holder of option increases"},{"l":"C","h":"Margin required of writer of option decreases"},{"l":"D","h":"Margin required of holder of option decreases"}],"a":"A","e":"<p>The margin required of the writer increases as there is more likelihood of a large loss. Holders of equity options have no margin requirement.<\/p>"},{"s":3,"n":98,"id":"1036949","q":"<p>Which of the following features of an exchange traded option is negotiable?<\/p>","o":[{"l":"A","h":"Premium"},{"l":"B","h":"Exercise price"},{"l":"C","h":"Expiry"},{"l":"D","h":"Underlying instrument"}],"a":"A","e":"<p>The exercise price, expiry date and underlying instrument of an exchange-traded option are standardised by the exchange and will not change during the life of the contract. The premium or price of an option will change moment by moment and can be negotiated between the buyer and the seller of the option when an option is bought or sold.<\/p>"},{"s":3,"n":99,"id":"1036865","q":"<p>For what reason would you exercise a receiver swaption?<\/p>","o":[{"l":"A","h":"Because interest rates have dropped so the option is in-the-money"},{"l":"B","h":"Because interest rates have dropped so the option is out-of-the-money"},{"l":"C","h":"Because interest rates have risen so the option is in-the-money"},{"l":"D","h":"Because interest rates have risen so the option is out-of-the-money"}],"a":"A","e":"<p>A receiver of a swaption has the right to receive a fixed amount in return for paying floating. If interest rates drop then the option will become more in-the-money and it should be exercised on expiry.<\/p>"},{"s":3,"n":100,"id":"1015832","q":"<p>Which of the following is NOT a possible consequence of inadequate monitoring of an open derivatives position?<\/p>","o":[{"l":"A","h":"New cash positions may be established"},{"l":"B","h":"Unexpected cash calls to meet variation margin"},{"l":"C","h":"Unexpected cash calls to meet initial margin"},{"l":"D","h":"Position closed-out by another counterparty"}],"a":"D","e":"<p>If a position is not monitored, the investor will not be aware if the positions are about to reach delivery. This could lead to a position in the cash market, or unexpected calls to meet margin.<\/p>"},{"s":4,"n":1,"id":"1037044","q":"<p>If interest rates exceed dividend receipts, one would expect FTSE 100 futures prices to be:<\/p>","o":[{"l":"A","h":"Higher than the current FTSE 100 index"},{"l":"B","h":"Lower than the current FTSE 100 index"},{"l":"C","h":"The same as the FTSE 100 index"},{"l":"D","h":"It is impossible to say whether it would be higher or lower."}],"a":"A","e":"<p>The fair value of the future equals cash price plus costs of carry (financing costs less dividends). If interest rates are higher than dividends, then costs of carry are positive, and the fair value of the future will be higher than the cash value. This situation is called a contango market.<\/p>"},{"s":4,"n":2,"id":"1036975","q":"<p>What happens to an ATM option if the volatility of the underlying increases?<\/p>","o":[{"l":"A","h":"Premiums for call options increase"},{"l":"B","h":"Premiums for put options increase"},{"l":"C","h":"Premiums for call and put options increase"},{"l":"D","h":"There is no change to the premiums for call options"}],"a":"C","e":"<p>An increase in the volatility of the underlying will increase the time value of the option and consequently the premiums of calls and puts will increase.<\/p>"},{"s":4,"n":3,"id":"1037010","q":"<p>An investor sells a euribor call option. Which of the following would a UK Clearing house accept as collateral to meet margin requirements?<\/p>","o":[{"l":"A","h":"Tangible assets"},{"l":"B","h":"US T-bonds"},{"l":"C","h":"Euro denominated gilts"},{"l":"D","h":"FTSE 100 equities"}],"a":"B","e":"<p>UK Clearing houses will accept government bonds issued in the government's own currency. They do not allow equities or tangible assets.<\/p>"},{"s":4,"n":4,"id":"1037038","q":"<p>If a portfolio has a low cumulative gamma a fund manager will need to adjust her portfolio only slightly to remain:<\/p>","o":[{"l":"A","h":"Theta neutral"},{"l":"B","h":"Vega neutral"},{"l":"C","h":"Rho neutral"},{"l":"D","h":"Delta neutral"}],"a":"D","e":"<p>Delta hedging attempts to keep a portfolio delta neutral, so a broker needs to know how sensitive the portfolio is. For this he will use gamma. The lower the gamma, the less sensitive.<\/p>"},{"s":4,"n":5,"id":"1036956","q":"<p>Which of the following would provide a hedge against sterling interest rate exposure?<\/p><p class=\"rom\"><b>I<\/b> Interest rate caps<\/p><p class=\"rom\"><b>II<\/b> Forward rate agreements<\/p><p class=\"rom\"><b>III<\/b> Interest rate floors<\/p><p class=\"rom\"><b>IV<\/b> Short sterling interest rate futures<\/p>","o":[{"l":"A","h":"I and II"},{"l":"B","h":"I, III and IV"},{"l":"C","h":"IV only"},{"l":"D","h":"I, II, III and IV"}],"a":"D","e":"<p>Interest rate caps and floors provide partial cover against interest rate rises and falls respectively. Forward rate agreements are over-the-counter interest rate futures.<\/p>"},{"s":4,"n":6,"id":"1037009","q":"<p>A broker enters an order to sell three futures at a price of 18.50 MIT GTC on Euronext's Optiq before the market opens. Which of the following would not happen to that order?<\/p>","o":[{"l":"A","h":"Would be filled if the market opened at 18.61"},{"l":"B","h":"Would be filled if the market opened at 18.50"},{"l":"C","h":"Could possibly be filled at 18.40"},{"l":"D","h":"If, by the close that day the range had been 18.36 to 18.49 the order would be cancelled automatically"}],"a":"D","e":"<p>The order is Market if Touched, Good Till Cancelled. Selling MIT orders are placed above the market and are executed at the next price after the trigger price (in this case 18.50) has been traded. The market opening at 18.61 would mean that 18.50 had assumed to be traded and would be filled. Likewise, if the market opens at 18.50 the order would become live. It is possible for the order to be filled at 18.40 if, after having traded 18.50 the next available price is at 18.40. Good till cancelled orders are cancelled on the clients say so, not automatically at the end of that day.<\/p>"},{"s":4,"n":7,"id":"1052263","q":"<p>Where do coal futures trade?<\/p>","o":[{"l":"A","h":"ICE"},{"l":"B","h":"MEFF"},{"l":"C","h":"Euronext Derivatives"},{"l":"D","h":"SAFEX"}],"a":"A","e":"<p>Along with other energy contracts, coal trades on ICE. MEFF trades financial contracts, Euronext Derivatives trades financials and commodities and SAFEX trades agriculturals, financials and gold contracts.<\/p>"},{"s":4,"n":8,"id":"1036969","q":"<p>A trader simultaneously buys the June long gilt future and sells the September long gilt future. This is an example of:<\/p>","o":[{"l":"A","h":"Intramarket spread"},{"l":"B","h":"Intermarket spread"},{"l":"C","h":"Synthetic call spread"},{"l":"D","h":"Synthetic put margin"}],"a":"A","e":"<p>Intramarket spreads are futures positions in which one delivery month is bought and another delivery month is sold within the SAME product.<\/p>"},{"s":4,"n":9,"id":"1065079","q":"<p>Soybean contracts can be traded on which of the following markets?<\/p>","o":[{"l":"A","h":"CME group"},{"l":"B","h":"LSE Derivatives"},{"l":"C","h":"Tokyo"},{"l":"D","h":"Shanghai"}],"a":"A","e":"<p>Soybean and other agricultural products are traded on the Chicago Board of Trade (CBOT) which is part of the CME group.<br/> Tokyo Stock Exchange trades financial derivatives. Shanghai Futures Exchange trades metals, rubber and oil. LSE Derivatives mainly also trades financial contracts.<\/p>"},{"s":4,"n":10,"id":"1017017","q":"<p>Which of the following is TRUE concerning an Asian option?<\/p>","o":[{"l":"A","h":"The strike is compared to an average price"},{"l":"B","h":"The option can be cancelled at any time by the writer"},{"l":"C","h":"The holder of the option can change the delivery date"},{"l":"D","h":"They are always physically settled"}],"a":"A","e":"<p>Asian options calculate the pay-off by comparing the strike price to an average price over a certain period of time.<br/> Asian options trade on the LME as traded average price option (TAPOs).<\/p>"},{"s":4,"n":11,"id":"1037021","q":"<p>Which two of the following are true of the impact of liquidity on transaction costs (i.e. the spread between bid and offer prices) and elasticity of prices (in comparison to volume)?<\/p>","o":[{"l":"A","h":"Greater liquidity = lower transaction costs, higher elasticity"},{"l":"B","h":"Greater liquidity = lower transaction costs, lower elasticity"},{"l":"C","h":"Greater liquidity = higher transaction costs, higher elasticity"},{"l":"D","h":"Greater liquidity = higher transaction costs, lower elasticity"}],"a":"B","e":"<p>The terminology used here is unusual but B is the best answer as more volume would lead to a lower bid-offer spread and therefore make the contract less volatile and therefore less elastic (i.e. prices would move less).<\/p>"},{"s":4,"n":12,"id":"1036997","q":"<p>Which of the following best describes the net liquidation value used by a clearing house?<\/p>","o":[{"l":"A","h":"It is used for the calculation of margin"},{"l":"B","h":"It eliminates the need to pay variation margin"},{"l":"C","h":"It eliminates the need to pay initial margin"},{"l":"D","h":"It is added to the initial margin to compensate for increased liquidity in the market"}],"a":"A","e":"<p>Net liquidation value is the marked to market value of an investor's positions netted off in span. If the NLV falls, then more margin will be paid. If the NLV rises, then margin will be received.<\/p>"},{"s":4,"n":13,"id":"1036985","q":"<p>Why do exchanges require member firms to fulfil their obligations regarding transaction reports, for instance, the requirement of the members of ICE Futures Europe to report trades into the UCP?<\/p>","o":[{"l":"A","h":"To ensure price transparency in the market place"},{"l":"B","h":"To ensure counterparties know who to pay for settlement purposes"},{"l":"C","h":"To ensure a fair and orderly market"},{"l":"D","h":"To ensure market abuse does not occur between member firms"}],"a":"B","e":"<p>Transaction reporting systems compare details of the buy and sell sides of a trade and allow settlement staff to direct the trade to the appropriate counterparty.<\/p>"},{"s":4,"n":14,"id":"1036964","q":"<p>Why would a market participant buy a 'payer swaption'? It is because she believes:<\/p>","o":[{"l":"A","h":"Interest rates will rise"},{"l":"B","h":"Interest rates will fall"},{"l":"C","h":"Interest rates will stay the same"},{"l":"D","h":"The yield curve will remain flat"}],"a":"A","e":"<p>The payer on a swap(tion) is the person who agrees to pay a fixed rate of interest (and therefore receive floating). The opinion of the payer is that interest rates are likely to INCREASE. Remember, the RECEIVER of a swap(tion) is the other side of the trade and therefore expects interest rates to decrease.<\/p>"},{"s":4,"n":15,"id":"1055078","q":"<p>What is a credit line?<\/p>","o":[{"l":"A","h":"The order of priority of a claim on assets in liquidation."},{"l":"B","h":"The chain of reliance between a number of firms where the credit for a purchase of an asset from one firm is reliant on the sale of an asset to another."},{"l":"C","h":"Credit that is granted by member firms to their clients."},{"l":"D","h":"A list of firms based on the credit ratings with AAA at the top."}],"a":"C","e":"<p>A credit line is the credit extended by a member firm to clients to cover margin payments.<\/p>"},{"s":4,"n":16,"id":"1065126","q":"<p>Which of the following would be true in relation to time decay over the life of an option?<\/p>","o":[{"l":"A","h":"The closer to expiry the rate of decay will decrease"},{"l":"B","h":"At expiry, time decay will be zero"},{"l":"C","h":"Time decay accelerates at the start of the contract"},{"l":"D","h":"It is possible for the rate to become negative"}],"a":"B","e":"<p>If an option with one year to expiry must have more time value than one with one week to expiry, it stands to reason that the time value in an option gradually 'leaks away' as expiry approaches (traders usually talk about the erosion of time value, or 'time decay'). As expiry approaches, there is generally less uncertainty about whether a particular option will be worth exercising. The rate at which the time value erodes over the life of the option is not linear - the erosion speeds up as expiry approaches.<\/p>"},{"s":4,"n":17,"id":"1037588","q":"<p>What is the main reason for an exchange declaring in the contract specifications the mechanism through which it will calculate EDSP?<\/p>","o":[{"l":"A","h":"To allow the investor to know the EDSP before opening a position"},{"l":"B","h":"To ensure that the future's closing price is not affected by the cash price"},{"l":"C","h":"To allow the investors to hedge against default"},{"l":"D","h":"To ensure that price manipulation is avoided"}],"a":"D","e":"<p>The EDSP must be a fair representation of the underlying asset price on expiry, and to do this EDSP is disclosed to all in the contract specifications. This transparency is the best way to avoid any price manipulation of the contract up to expiry.<\/p>"},{"s":4,"n":18,"id":"1072242","q":"<p>Which of the following describes a vanilla interest rate swap?<\/p>","o":[{"l":"A","h":"An exchange of cash flows at the outset of a period to which the interest rate relates"},{"l":"B","h":"An exchange of cash flows at the end of a period to which the interest rate relates"},{"l":"C","h":"An exchange of cash flows in one currency against a cash flow in another currency"},{"l":"D","h":"An exchange of two streams of cash flows based on two different variable rates"}],"a":"B","e":"<p>The plain vanilla interest rate swap, based on an agreed notional principal sum, will specify a particular start date and run for a set period. The swap will specify particular periods at the end of which the cash flow exchanges will take place; this is known as the swap's payment date. A vanilla swap uses a fixed rate and a floating rate. A basis swap uses two variable rates.<\/p>"},{"s":4,"n":19,"id":"1036968","q":"<p>Which of the following is a usage of the gilt repo market?<\/p>","o":[{"l":"A","h":"It allows investors to separately trade the principal from the coupon elements of a gilt"},{"l":"B","h":"It provides short term liquidity to investors whose money is tied up in bonds"},{"l":"C","h":"It guarantees future delivery of the cheapest to deliver gilt-edged security"},{"l":"D","h":"It ensures default by the clearing house is covered by an appropriate amount of margin"}],"a":"B","e":"<p>A gilt repo is the sale and repurchase of gilts at a pre-agreed price, providing short-term liquidity to participants.<\/p>"},{"s":4,"n":20,"id":"1015827","q":"<p>A synthetic short-put is created by:<\/p>","o":[{"l":"A","h":"Long-future, long-call"},{"l":"B","h":"Long-asset, short-call"},{"l":"C","h":"Short-call, long-put"},{"l":"D","h":"Short-cash, long-call"}],"a":"B","e":"<p>This strategy is otherwise known as a covered short call.<\/p>"},{"s":4,"n":21,"id":"1036999","q":"<p>For which of the following contracts is there a link between CME and SGX to allow common settlement prices and investors to transfer open positions between exchanges?<\/p>","o":[{"l":"A","h":"EURIBOR"},{"l":"B","h":"Nikkei 225"},{"l":"C","h":"Yen"},{"l":"D","h":"S&P500"}],"a":"B","e":"<p>The Nikkei 225 trades on both CME and SGX. The link to allow cross settlement between the two is called the mutual offset trading link.<\/p>"},{"s":4,"n":22,"id":"1017018","q":"<p>Which of the following is a difference between FLEX options and OTC options?<\/p>","o":[{"l":"A","h":"All terms are standardised for FLEX contracts"},{"l":"B","h":"OTC are centrally cleared"},{"l":"C","h":"FLEX contracts have lower credit risk"},{"l":"D","h":"The market maker dictates the contract specifications for a FLEX option"}],"a":"C","e":"<p>FLEX options are hybrid exchange-traded products which introduce some over-the-counter (OTC) features. Some of the terms such as maturity or strike price are agreed between the two counterparties (hence 'the market maker dictates the contract specifications for a FLEX option' is not correct). FLEX options have the added benefit of reducing credit risk normally associated with OTC contracts. The credit risk is substantially reduced due to the exchange's use of a central clearing house.<\/p>"},{"s":4,"n":23,"id":"1052251","q":"<p>Which of the following is the most frequent use of synthetics?<\/p>","o":[{"l":"A","h":"Speculation"},{"l":"B","h":"Arbitrage"},{"l":"C","h":"Hedging"},{"l":"D","h":"Regulatory purposes"}],"a":"B","e":"<p>The reason for using synthetics might be to create positions that may not be available on the underlying asset. However, the main reason for the use of synthetics is arbitrage.<\/p>"},{"s":4,"n":24,"id":"1017035","q":"<p>Which of the following best describes an accreting swap?<\/p>","o":[{"l":"A","h":"A swap based on a notional principal which will increase over the life of the contract"},{"l":"B","h":"A swap based on a notional principal which is linked to a withholding tax liability and the purchase of a cash bond"},{"l":"C","h":"A swap based on a notional principal which will increase or decrease in line with seasonal borrowing requirements"},{"l":"D","h":"A swap based on a notional principal which will decrease over the life of the contract"}],"a":"A","e":"<p>Answer A is the best description of an accreting swap. Answer C is a rollercoaster swap and Answer D an amortising swap.<\/p>"},{"s":4,"n":25,"id":"1037022","q":"<p>In June, a farmer is concerned about falling wheat prices and takes out a hedge trade by selling a December wheat contract. His wheat is ready for sale in November and he lifts the hedge by selling the wheat in the cash market and closing out his futures contract. <br/> The farmer is at risk of the following:<\/p>","o":[{"l":"A","h":"A change in the futures price from June to November"},{"l":"B","h":"A change in the price of wheat from June to November"},{"l":"C","h":"A change in basis from June to November"},{"l":"D","h":"A change in the futures price from November to December"}],"a":"C","e":"<p>As the farmer has lifted his hedge early he is susceptible to 'basis risk'. Basis risk can arise because the relationship between the cash price and futures price is unpredictable and can change between setting up the hedge and lifting it early. If basis has weakened, the farmer's profits in the futures market will not be sufficient to offset the loss in the cash market.<br/> This is discussed in detail in Chapter 3: Futures Pricing.<\/p>"},{"s":4,"n":26,"id":"1065075","q":"<p>Which of the following market participants are most likely to trade as principal?<\/p>","o":[{"l":"A","h":"Market makers"},{"l":"B","h":"Brokers"},{"l":"C","h":"Prime brokers"},{"l":"D","h":"Clearing firms"}],"a":"A","e":"<p>Market makers ensure liquidity in quote driv
