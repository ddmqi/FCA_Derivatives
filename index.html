ent of £2. However, if that investor bought a call option x £2 for 12p and exercises when the share is £2.20, she makes an 8p profit on an outlay of 12p - a 66.7% profit.<\/p>"},{"s":8,"n":78,"id":"1038837","q":"<p>A portfolio with a value of US $23.5m has a Beta relative to the S&amp;P 500 of 1.13. How many S&amp;P 500 contracts, quoted at 850 points, are required to fully hedge this position? <br/> The CME S&amp;P 500 contract is valued at US $250 multiplied by the index points.<\/p>","o":[{"l":"A","h":"98 contracts"},{"l":"B","h":"111 contracts"},{"l":"C","h":"125 contracts"},{"l":"D","h":"212 contracts"}],"a":"C","e":"<p>The basic hedge would be calculated as follows:<br/> 23.5m / (850 x 250) = 110.59<br/> However, our portfolio has a Beta of 1.13, which is more sensitive that the S&amp;P 500 (13% more sensitive). This means we need to take the basic hedge and multiply it by Beta:<br/> 110.59 x 1.13 = 124.97, rounded to 125 contracts.<\/p>"},{"s":8,"n":79,"id":"1002887","q":"<p>You expect Japanese interest rates to rise faster than European rates. Which of the following would be the most appropriate spread trade?<\/p>","o":[{"l":"A","h":"Sell JGB futures and sell bund futures"},{"l":"B","h":"Sell JGB futures and buy bund futures"},{"l":"C","h":"Buy JGB futures and sell bund futures"},{"l":"D","h":"Buy JGB futures and buy bund futures"}],"a":"B","e":"<p>A spread involves buying and selling, therefore we can discount answers A and D. If interest rates rise then bond prices will fall, therefore we would look to sell those that we expect to fall fastest. 'Sell JGB futures and buy bund futures' is the correct answer.<\/p>"},{"s":9,"n":1,"id":"4211298","q":"<p>In the context of derivatives regulation, how do the regulatory approaches of the European Union (EU) and the United States differ, and what is a key consequence of this difference?<\/p>","o":[{"l":"A","h":"The EU's principles-based regulation allows for more flexibility, whereas the US's rules-based approach can lead to a more rigid compliance environment."},{"l":"B","h":"The EU's rules-based approach requires strict adherence to specific regulations, while the US's principles-based approach results in more frequent regulatory changes."},{"l":"C","h":"The EU mandates centralized derivatives trading through a single exchange, unlike the US, which allows decentralized trading."},{"l":"D","h":"The EU prohibits all forms of high-frequency trading, whereas the US permits it under strict guidelines."}],"a":"A","e":"<p>The EU generally adopts a principles-based regulatory approach, as seen with MiFID, which provides broad guidelines and flexibility. In contrast, the US employs a rules-based approach, epitomized by legislation like the Sarbanes-Oxley Act, resulting in more prescriptive and fixed rules. This difference can lead to varying compliance experiences for firms operating in both regions.<\/p>"},{"s":9,"n":2,"id":"1055070","q":"<p>What is the purpose of MiFID?<\/p>","o":[{"l":"A","h":"To ensure everyone in the financial industry has the same qualifications."},{"l":"B","h":"To increase regulation outside Europe."},{"l":"C","h":"To cover passporting and outline the difference between home and host state regulations."},{"l":"D","h":"To improve shareholder transparency."}],"a":"C","e":"<p>MiFID is an attempt to harmonise the financial regulations throughout the EEA in order to bring all European markets and participants under one regulatory process.<br/> The Transparency Directive establishes minimum financial reporting requirements and disclosure of major shareholders, if they wish to be admitted on an EU-regulated market.<\/p>"},{"s":9,"n":3,"id":"1037113","q":"<p>Which of the following is the main US regulator for the futures markets?<\/p>","o":[{"l":"A","h":"NFA"},{"l":"B","h":"SEC"},{"l":"C","h":"NASD"},{"l":"D","h":"CFTC"}],"a":"D","e":"<p>Overall responsibility for the futures markets lies with the CFTC. Responsibility for regulating firms but not exchanges is delegated to the NFA.<\/p>"},{"s":9,"n":4,"id":"1066370","q":"<p>Which of the below is not a major role or aim of regulation?<\/p>","o":[{"l":"A","h":"Maintain orderly markets"},{"l":"B","h":"Provide protection for members of the public"},{"l":"C","h":"Ensuring a financial firm is stable and does not go into liquidation"},{"l":"D","h":"Reduction of crime"}],"a":"C","e":"<p>The regulation should make sure the markets are stable and perhaps firms keep adequate capital so the effect of a collapse is minimised. Regulations do not ensure that firms never fail but that if they do, the effects are minimised through imposing the right level of capital requirements.<\/p>"},{"s":9,"n":5,"id":"4211286","q":"<p>What is the primary benefit of using a segregated account for client trades in the context of potential firm defaults?<\/p>","o":[{"l":"A","h":"Higher returns due to pooled investments"},{"l":"B","h":"Simplified tax reporting for the client"},{"l":"C","h":"Reduced transaction fees for trades"},{"l":"D","h":"Protection of client assets from the firm's liabilities"}],"a":"D","e":"<p>Segregated accounts are used to protect client assets from the financial issues of the firm holding those assets. In the event of the firm’s default, segregated client assets are safeguarded and not used to settle the firm’s liabilities.<\/p>"},{"s":9,"n":6,"id":"1017043","q":"<p>What is the objective of the EU transparency directive?<\/p>","o":[{"l":"A","h":"To ensure the market is aware of the prices of all trades"},{"l":"B","h":"To promote and improve the reputation of financial services firms"},{"l":"C","h":"To establish minimum requirements on periodic financial reporting"},{"l":"D","h":"To promote and improve the reputation of the financial services industry"}],"a":"C","e":"<p>This is the main objective of the transparency directive.<\/p>"},{"s":9,"n":7,"id":"1065388","q":"<p>Which of the following describes the most important benefit of using a Trade Repository?<\/p>","o":[{"l":"A","h":"To agree the terms of a trade"},{"l":"B","h":"Speed up settlement of transaction"},{"l":"C","h":"To provide a transparent record"},{"l":"D","h":"Ensure central counterparties are used"}],"a":"C","e":"<p>This is seen as the most important as far as regulators are concerned.<\/p>"},{"s":9,"n":8,"id":"4051919","q":"<p>Which of the following best indicates the focus of the Financial Conduct Authority?<\/p>","o":[{"l":"A","h":"Client money, conduct and reducing market abuse"},{"l":"B","h":"Conduct, competition and reducing market abuse"},{"l":"C","h":"Conduct, competition and consumer protection"},{"l":"D","h":"Reducing market abuse, consumer protection and client money"}],"a":"B","e":"<p>This is how the FCA focus is described in the CISI Derivatives manual:<\/p><p>The FCA focuses on:<\/p><p>Conduct – for the market to thrive, firms must behave ethically, stick to the rules and meet regulatory standards<\/p><p>Competition – it encourages healthy competition between firms to keep the market buoyant and help the economy grow<\/p><p>Reducing market abuse – firms need to have procedures to help them identify and stop market abuse practices, such as insider dealing and share price manipulation.<\/p>"},{"s":9,"n":9,"id":"1066371","q":"<p>Which of the below bodies is responsible for the conduct of a deposit taking institution in the UK?<\/p>","o":[{"l":"A","h":"FCA and PRA"},{"l":"B","h":"FCA"},{"l":"C","h":"PRA"},{"l":"D","h":"BOE"}],"a":"B","e":"<p>In relation to deposit takers, insurance companies and significant investment firm, these are considered dual regulated. This means in relation to prudential regulation, PRA ensures regulation but in relation to conduct the FCA will ensure regulation is met.<\/p>"},{"s":9,"n":10,"id":"4211296","q":"<p>What is a primary purpose of the regulation of derivatives markets by entities such as the SEC and CFTC in the United States?<\/p>","o":[{"l":"A","h":"To ensure the orderly operation and transparency of derivatives markets"},{"l":"B","h":"To centralize all derivatives trading through a single global authority"},{"l":"C","h":"To provide direct financial support to derivatives traders"},{"l":"D","h":"To limit the number of participants in the derivatives market"}],"a":"A","e":"<p>The regulation of derivatives markets by bodies like the SEC and CFTC is focused on maintaining market orderliness, enhancing transparency, protecting consumers, and minimizing systemic risks. These efforts help stabilize the financial system and protect investors from misconduct.<\/p>"},{"s":9,"n":11,"id":"1014200","q":"<p>In order to assess the suitability of a service or an investment a firm should first assess all of the following except:<\/p>","o":[{"l":"A","h":"The client's knowledge and experience of the investment and service"},{"l":"B","h":"The client's success in previous trades"},{"l":"C","h":"The client's financial standing"},{"l":"D","h":"The client's investment objectives"}],"a":"B","e":"<p>Although a client's previous success in trades could be an indicator of knowledge and experience, it is not necessarily something a firm would consider when assessing suitability.<\/p>"},{"s":9,"n":12,"id":"1036702","q":"<p>Which of the following is NOT taken into account when assessing the suitability of an investment for a client?<\/p>","o":[{"l":"A","h":"Whether the client understands the risk"},{"l":"B","h":"Whether the client is able to bear the financial liability involved in the transaction"},{"l":"C","h":"Whether the client has been categorised as a retail or professional client"},{"l":"D","h":"Whether the investment strategy meets the objectives of the client"}],"a":"C","e":"<p>In assessing suitability a firm must consider knowledge and experience, the clients financial situation and their investment objectives.<br/> Although suitability is required for discretionary and advisory retail and professional clients, the categorisation itself is not part of suitability.<\/p>"},{"s":9,"n":13,"id":"1014199","q":"<p>Suitability needs to be applied in which of the following situations?<\/p>","o":[{"l":"A","h":"Advisory or discretionary management services"},{"l":"B","h":"Discretionary management services only"},{"l":"C","h":"Advisory services only"},{"l":"D","h":"Only deal where advice is not given"}],"a":"A","e":"<p>Suitability must be assessed for advisory and discretion services. A firm would do this by assessing the client's knowledge and experience, their financial situation and their investment objectives.<\/p>"},{"s":9,"n":14,"id":"1066373","q":"<p>Which act in the USA increased transparency and mandatory clearing of OTC transactions?<\/p>","o":[{"l":"A","h":"Financial Services Act"},{"l":"B","h":"Commodities Futures Modernisation Act"},{"l":"C","h":"Dodd Frank Act"},{"l":"D","h":"Commodities Exchange Act"}],"a":"C","e":"<p>Financial Services Act is UK based and created PRA and FCA. Commodities Futures modernisation act legalised single stock futures. Commodities exchange act places restrictions on Non US companies dealing with US clients through the part 30 restriction.<\/p>"},{"s":9,"n":15,"id":"4211288","q":"<p>What distinguishes a house account from customer accounts in the context of a clearing member firm?<\/p>","o":[{"l":"A","h":"House accounts pool multiple client positions for efficiency."},{"l":"B","h":"House accounts require client approval for all transactions."},{"l":"C","h":"House accounts offer higher protection against firm defaults than customer accounts."},{"l":"D","h":"House accounts manage proprietary trades for the clearing member firm itself."}],"a":"D","e":"<p>House accounts are designated for the proprietary trades of a clearing member firm, meaning they are for the firm's own benefit or risk, and do not include client positions. This is distinct from customer accounts, which hold client trades and assets.<\/p>"},{"s":9,"n":16,"id":"1066372","q":"<p>Which of the below is false? EMIR introduced:<\/p>","o":[{"l":"A","h":"Reporting obligation for OTC derivatives"},{"l":"B","h":"Clearing obligation for eligible exchange traded derivatives"},{"l":"C","h":"Common rules for central counterparties (CCPs) and for trade repositories"},{"l":"D","h":"Rules on the establishment of interoperability between CCPs"}],"a":"B","e":"<p>All exchange traded derivatives have to be cleared through a CCP but this was not introduced by EMIR. The new regulations have specifically targeted the OTC markets.<\/p>"},{"s":9,"n":17,"id":"4051920","q":"<p>Which of the following US bodies provides regulatory programmes that safeguard the integrity of the derivatives markets?<\/p>","o":[{"l":"A","h":"Securities Exchange Commission"},{"l":"B","h":"Federal Reserve"},{"l":"C","h":"National Futures Association"},{"l":"D","h":"Commodity Futures Trading Commission"}],"a":"C","e":"<p>The NFA provides regulatory programmes that safeguard the integrity of the derivatives markets. It is a not-for-profit organisation, financed exclusively from membership dues and fees and assessments paid by users of the futures markets.<\/p>"},{"s":9,"n":18,"id":"1044815","q":"<p>Under Part 30 of the Commodities Exchange Act, if a UK firm wishes to trade with a US client, it must:<\/p>","o":[{"l":"A","h":"Trade on a US exchange"},{"l":"B","h":"Be accompanied by an NFA registered firm"},{"l":"C","h":"Be registered with the SEC"},{"l":"D","h":"Sign an exclusion of liability policy"}],"a":"B","e":"<p>Part 30 prohibits direct contact between non-US firms and US clients.<\/p>"},{"s":9,"n":19,"id":"1015772","q":"<p>The SEC regulates which exchange?<\/p>","o":[{"l":"A","h":"CBOT"},{"l":"B","h":"CBOE"},{"l":"C","h":"NYMEX"},{"l":"D","h":"COMEX"}],"a":"B","e":"<p>The SEC is responsible for the CBOE. The CFTC regulates all the other derivative exchanges.<\/p>"},{"s":9,"n":20,"id":"1014196","q":"<p>The purpose of regulators around the world can be described by all of the following, except:<\/p>","o":[{"l":"A","h":"To maintain orderly markets"},{"l":"B","h":"To ensure consumers are appropriately informed of the benefits and risks"},{"l":"C","h":"To assist the authorities in the enforcement of financial law"},{"l":"D","h":"To impose high level standards on firms, but not prescriptive rules"}],"a":"D","e":"<p>The purpose of regulators is to provide an orderly market, consumer protection, education through appropriate information, and to assist in combating financial crime. <br/> Although the FCA wishes to move to a high-level, principle-based regulation, this is not the goal of all regulators, and even the FCA has to impose prescriptive rules.<\/p>"},{"s":9,"n":21,"id":"1014203","q":"<p>What is the main purpose of the markets in financial instruments directive (MiFID)?<\/p>","o":[{"l":"A","h":"To bring the FCA in line with a rules-based approach to regulation"},{"l":"B","h":"To allow firms to ignore host state rules when performing business in the EEA"},{"l":"C","h":"To bring EEA firms and markets under one regulatory process"},{"l":"D","h":"To restrict the scope of the previous investment services directive (ISD)"}],"a":"C","e":"<p>The main aim of MiFID is to harmonise the regulatory environment throughout the EEA. Rather than restrict the scope of the old ISD it broadens the scope, allowing more firms to more easily passport business throughout the community.<\/p>"},{"s":9,"n":22,"id":"1036690","q":"<p>Who regulates the CBOE?<\/p>","o":[{"l":"A","h":"FCA"},{"l":"B","h":"SEC"},{"l":"C","h":"CTFC"},{"l":"D","h":"NFA"}],"a":"B","e":"<p>The SEC has responsibility for FINRA (formally NASD) and a selection of exchanges (including the CBOE).<br/> The CFTC, which regulates most derivatives exchanges with the CBOE being a notable exception. They also have responsibility for the NFA<\/p>"},{"s":9,"n":23,"id":"1052255","q":"<p>A client moves into physically delivered OTC traded commodity derivatives. Which of the following statements is true in relation to the application of MiFID?<\/p>","o":[{"l":"A","h":"MiFID will always apply"},{"l":"B","h":"MiFID will apply if the client is an eligible counterparty"},{"l":"C","h":"MiFID will apply if the client is a professional client"},{"l":"D","h":"MiFID will never apply in this situation"}],"a":"A","e":"<p>MiFID does not cover derivatives used for commercial (risk management) purposes, but does cover the trading of commodity derivatives for non-commercial or speculative uses. This includes physically delivered OTC derivatives.<\/p>"},{"s":9,"n":24,"id":"1014198","q":"<p>Which of the following is not true of the FCA's fair treatment of customers (FTOC) initiative?<\/p>","o":[{"l":"A","h":"It aims to help consumers achieve a fair deal"},{"l":"B","h":"There are 11 outcomes that need to be achieved"},{"l":"C","h":"It forms part of the FCA's move to principles based regulation"},{"l":"D","h":"It aims to make fair treatment part of the corporate culture"}],"a":"B","e":"<p>There are six outcomes to the FTOC initiative. The first outcome is to make fair treatment of consumers part of the corporate culture.<\/p>"},{"s":9,"n":25,"id":"1037123","q":"<p>The regulator of US derivatives exchanges is:<\/p>","o":[{"l":"A","h":"NFA"},{"l":"B","h":"SEC"},{"l":"C","h":"CFTC"},{"l":"D","h":"CSCE"}],"a":"C","e":"<p>The CFTC provides government oversight for the futures industry in the US.<\/p>"},{"s":9,"n":26,"id":"1051974","q":"<p>Which statement about the National Futures Association is false?<\/p>","o":[{"l":"A","h":"They regulate US derivative trading"},{"l":"B","h":"They resolve disputes"},{"l":"C","h":"They are a self-regulatory organistation"},{"l":"D","h":"They regulate all US exchanges"}],"a":"D","e":"<p>For derivatives, the SEC regulates the CBOE.<\/p>"},{"s":9,"n":27,"id":"1014204","q":"<p>The transparency directive has been implemented to achieve all of the following, except:<\/p>","o":[{"l":"A","h":"To introduce half-yearly financial reporting."},{"l":"B","h":"To increase disclosures of periodic information of private companies"},{"l":"C","h":"To increase the frequency of disclosure of major shareholdings"},{"l":"D","h":"To improve annual financial reporting of issuers of securities"}],"a":"B","e":"<p>The transparency directive applies to issuers of share and debt, so would not apply to private companies.<\/p>"},{"s":9,"n":28,"id":"1014201","q":"<p>Which of the following is the purpose of assessing the suitability of an investment or service before doing business with a client?<\/p>","o":[{"l":"A","h":"To ensure that the client only enters into transactions that will lead to profit"},{"l":"B","h":"To ensure that the client understands the risks and is financially able to bear them"},{"l":"C","h":"To ensure that the client knows about the firm and its remuneration policies"},{"l":"D","h":"To ensure that no more than 25% of the client's net worth is tied-up in risky investments"}],"a":"B","e":"<p>Although it would be nice, there is no way to offer guaranteed profits on all investments. The rules on information about the firm would cover remuneration, and the FCA does not specify any proportion of net wealth.<\/p>"},{"s":9,"n":29,"id":"1036983","q":"<p>Which of the following would not be permitted under CFTC Part 30?<\/p>","o":[{"l":"A","h":"A US firm dealing for a US client on a US exchange"},{"l":"B","h":"A UK firm dealing for a UK client on a UK exchange"},{"l":"C","h":"A UK firm trading on behalf of a US client on a non-US exchange"},{"l":"D","h":"A US firm dealing with a UK client on a US exchange"}],"a":"C","e":"<p>This deal WOULD be allowed if the firm applies for a CFTC Part 30 exemption.<\/p>"},{"s":9,"n":30,"id":"1014197","q":"<p>How are principles-based regulation best defined?<\/p>","o":[{"l":"A","h":"Use of prescriptive rules that are binding on the firm"},{"l":"B","h":"Use of prescriptive rules that are not binding on the firm"},{"l":"C","h":"Use of high-level objectives that are binding on the firm"},{"l":"D","h":"Use of high-level objectives that are not binding on the firm"}],"a":"C","e":"<p>Principles-based regulation sets down high-level objectives for a firm to achieve, such as act in the clients' best interests: honestly, fairly and professionally. Although the process through which the firm achieves these objectives is not dictated by the FCA, the objectives themselves are binding on the firm.<\/p>"},{"s":9,"n":31,"id":"1037122","q":"<p>Who is the regulator of US stock indices?<\/p>","o":[{"l":"A","h":"CFTC"},{"l":"B","h":"NFA"},{"l":"C","h":"NYSE"},{"l":"D","h":"SEC"}],"a":"D","e":"<p>The SEC is responsible for overseeing securities in America.<\/p>"}]</script>
<script type="application/json" id="mdata">[{"s":1,"n":1,"id":"1036727","q":"<p>An investor gives the following order to her broker; 'Buy 15 wheat futures at 110.00 market-on-close'. For the remainder of the session the price remains at a constant bid/offer of 112.02 - 112.07. At what price, if any, will the order be executed at?<\/p>","o":[{"l":"A","h":"112.02"},{"l":"B","h":"112.07"},{"l":"C","h":"100.00"},{"l":"D","h":"No fill"}],"a":"B","e":"<p>The market-on-close order means: buy 15 wheat futures at 110.00, or whatever the market is on close. The market, at close, was 112.02 / 07, so the order to buy would be filled by paying the 112.07 offer price.<\/p>"},{"s":1,"n":2,"id":"1036656","q":"<p>Which of the following statements are true in respect of maintenance margin?<\/p><p class=\"rom\"><b>I<\/b> It is another name for variation margin<\/p><p class=\"rom\"><b>II<\/b> It is a system of margining operated by a number of derivative exchanges, particularly in the US<\/p><p class=\"rom\"><b>III<\/b> When an account falls to the maintenance margin level, it must be replenished by the client up to the original initial margin level<\/p><p class=\"rom\"><b>IV<\/b> Maintenance margin arrangements can be operated in the UK between brokers and their clients<\/p>","o":[{"l":"A","h":"II, III and IV"},{"l":"B","h":"II and IV"},{"l":"C","h":"II and III"},{"l":"D","h":"I, II and IV"}],"a":"A","e":"<p>Maintenance margin is often used on US exchanges, it is not used by LCH.Clearnet or ICE Clear Europe but may be used by a firm against its client.<\/p>"},{"s":1,"n":3,"id":"1016994","q":"<p>A share is trading at 150p. The premium of the 130 call is 50p. What is the time value of this option?<\/p>","o":[{"l":"A","h":"50p"},{"l":"B","h":"30p"},{"l":"C","h":"20p"},{"l":"D","h":"10p"}],"a":"B","e":"<p>Premium = Intrinsic value + Time value<br/> Intrinsic value of a call = Asset value - Strike = 150p - 130p = 20p<br/> Therefore time value = 50p - 20p = 30p.<\/p>"},{"s":1,"n":4,"id":"1051975","q":"<p>Which of the following best describes the difference between order-book trading and open outcry trading?<\/p>","o":[{"l":"A","h":"Order-book trading is gradually being replaced with open outcry trading"},{"l":"B","h":"Exchanges will use order book trading or open outcry trading but not both"},{"l":"C","h":"Open outcry trading has more scope for human error than order book trading"},{"l":"D","h":"Unlike order book trading, open outcry trading provides automatic processing of trades"}],"a":"C","e":"<p>Open outcry trading has more scope for human error than order book trading, so trade registration, input and matching processes need to be well managed. Exchanges can, and do, offer both order book and open outcry trading. Order books have been gradually replacing open outcry and this is mainly due the the automatic processing.<\/p>"},{"s":1,"n":5,"id":"1036687","q":"<p>The average of the bid and offer spot quotes is 150.00 for a foreign currency. What are the bid and offer quotes, if they both deviate from the average by 50 pips?<\/p>","o":[{"l":"A","h":"149.50-150.50"},{"l":"B","h":"149.9950-150.005"},{"l":"C","h":"100.00 - 200.00"},{"l":"D","h":"149.95-150.05"}],"a":"A","e":"<p>Start by looking at the spot quote. ‘150.00’. This has five significant figures. There are three before the decimal point, ‘150’. There are two after the decimal point, ‘.00’. One pip is the fifth significant figure, i.e. the second decimal place in this particular spot quote. <\/p><p>In this question the ‘deviation from the average’ is 50 pips, that means subtracting 0.50 to find the bid, and adding 0.50 to find the offer, which would give us ‘149.50-150.50’.<\/p>"},{"s":1,"n":6,"id":"1014235","q":"<p>When a metal producer enters into a fixed for floating commodity swap to protect themselves from uncertainty in prices (agreeing to receive a fixed price in return for paying a floating price), which of the following is NOT true?<\/p>","o":[{"l":"A","h":"The producer benefits from certainty in pricing"},{"l":"B","h":"The floating amount payable is equal to the price of the metal produced"},{"l":"C","h":"The amount payable by the producer is based on an agreed metal index"},{"l":"D","h":"The producer does not necessarily sell the metal to their counterparty in the swap"}],"a":"B","e":"<p>The floating amount payable by the producer will be based on a pre-agreed metal index, which will not necessarily be the price of the metal on the market.<\/p>"},{"s":1,"n":7,"id":"1036707","q":"<p>The FTSE 100 cash price is 3,000, and the 12-month future is quoted at 3,035. The dividend yield on FTSE 100 shares is 3% and the risk-free rate is 4%. What would be the best course of action?<\/p>","o":[{"l":"A","h":"Cash and carry"},{"l":"B","h":"Reverse cash and carry"},{"l":"C","h":"Conversion"},{"l":"D","h":"Nothing. Arbitrageurs will take care of it."}],"a":"A","e":"<p>The fair value of the future is found by multiplying the cash price with 1.01 (4% - 3% = 1% ), which gives us 3,030. We can take advantage of this using a 'cash and carry' strategy.<\/p>"},{"s":1,"n":8,"id":"1036750","q":"<p>An investor who considers short-dated call options to be trading at excessive implied volatilities would consider a:<\/p>","o":[{"l":"A","h":"Long straddle"},{"l":"B","h":"Horizontal spread"},{"l":"C","h":"Vertical spread"},{"l":"D","h":"Short straddle"}],"a":"B","e":"<p>A short straddle would be suitable if both call and put volatility was expected to fall. As only call volatility is expected to fall, the horizontal spread is the most appropriate.<\/p>"},{"s":1,"n":9,"id":"1036655","q":"<p>If short-term interest rates were expected to fall, what effect would this have on the spread between two delivery months on a futures contract with an underlying asset in good supply?<\/p>","o":[{"l":"A","h":"Widen"},{"l":"B","h":"Narrow"},{"l":"C","h":"Remain unchanged"},{"l":"D","h":"Indeterminate"}],"a":"B","e":"<p>The cost of carry would fall due to the lower interest rate, thus the difference between the two fair values would be narrower.<\/p>"},{"s":1,"n":10,"id":"1036666","q":"<p>Which of the following positions creates a synthetic short call option?<\/p>","o":[{"l":"A","h":"Short the underlying and short a put option"},{"l":"B","h":"Long the underlying and short a put option"},{"l":"C","h":"Long the underlying and long a call option"},{"l":"D","h":"Short the underlying and short a call option"}],"a":"A","e":"<p>A synthetic short call is created by combining the profiles of a short put and a short underlying/futures position.<\/p>"},{"s":1,"n":11,"id":"4211106","q":"<p>SwapClear is the market’s longest-serving and only truly global interest rate swap clearing service. With unparalleled liquidity provided by over 100 members. To be a member an organisation must:<\/p>","o":[{"l":"A","h":"be authorised by the Prudential Regulation Authority"},{"l":"B","h":"use Financial Information eXchange (FIX) protocols fully integrated"},{"l":"C","h":"contribute to LCH Group's default fund"},{"l":"D","h":"abide by the regulation of the International Organization of Securities Commissions (IOSCO)"}],"a":"C","e":"<p>To be a SwapClear clearing member (SCM), an organisation must: - be an LCH Group shareholder - contribute to LCH Group's default fund - meet minimum resource requirements - make regular financial reports to LCH Group, and - maintain adequate systems and records and employ operations staff with adequate expertise in swaps.<\/p>"},{"s":1,"n":12,"id":"1036671","q":"<p>When a clearing house is independent and a member defaults, whose resources are used to cover the default?<\/p>","o":[{"l":"A","h":"The clearing house"},{"l":"B","h":"Other members of the clearing house"},{"l":"C","h":"Other members of the clearing along with the clearing house"},{"l":"D","h":"The member's own client resources"}],"a":"A","e":"<p>If the clearing house was a mutual organisation then C would be the best available answer.<\/p>"},{"s":1,"n":13,"id":"1036675","q":"<p>Which one of the following is a credit derivative?<\/p>","o":[{"l":"A","h":"Commodity swap"},{"l":"B","h":"Credit spread option"},{"l":"C","h":"Cross-currency swap"},{"l":"D","h":"Interest rate swap"}],"a":"B","e":"<p>Credit spread options and credit default swaps are both examples of credit derivatives.<\/p>"},{"s":1,"n":14,"id":"4051921","q":"<p>Exchanges have different methods for assessing the closing range for settlement prices. Which of the following is true of these methods?<\/p>","o":[{"l":"A","h":"The time frame is generally longer for commodity contracts than for financial contracts"},{"l":"B","h":"The settlement price is always the closing price at the end of the trading day"},{"l":"C","h":"EMIR seeks to standardise the approach to settlement prices taken by exchanges"},{"l":"D","h":"Only those positions assigned to delivery had settlement prices assessed"}],"a":"A","e":"<p>Exchanges establish settlement prices every business day in order to provide the price yardsticks for calculation of mark-to-market variation margin and valuation of positions at the end of the day. This procedure is normally conducted at the end of the trading period, so the daily settlement price is also referred to as the closing price. However, some markets do not use the closing price, particularly those that have a global pricing influence (such as the LME), or markets that are in operation for most of the 24-hour day.<br/> The closing range is a measure of the range or spread of prices that are quoted during a specified time just before daily trading ends. Each exchange has its own criteria for determining the closing range; most have different time frames for different contracts and they are usually longer for commodity contracts compared to financial contracts.<\/p>"},{"s":1,"n":15,"id":"1036738","q":"<p>The main use of aluminium is:<\/p>","o":[{"l":"A","h":"Transport"},{"l":"B","h":"Batteries"},{"l":"C","h":"Solder"},{"l":"D","h":"Galvanization"}],"a":"A","e":"<p>Batteries - Lead<br/> Solder - Tin<br/> Galvanization - Zinc<\/p>"},{"s":1,"n":16,"id":"1072186","q":"<p>When does the premium of an option on an equity index need to be settled?<\/p>","o":[{"l":"A","h":"Upon the closing of the position"},{"l":"B","h":"Upon the expiry of the option"},{"l":"C","h":"At the choice of the holder"},{"l":"D","h":"By the next business day"}],"a":"D","e":"<p>Options that are on the underlying asset or an index will need premiums to be settled T+1. However, options on futures can be settled upon exercise or expiry.<\/p>"},{"s":1,"n":17,"id":"1036661","q":"<p>What is the time value of the September 101 call which is 87 days prior to expiry; its premium is 4.17 and the underlying is 103.50?<\/p>","o":[{"l":"A","h":"4.17"},{"l":"B","h":"3.50"},{"l":"C","h":"1.67"},{"l":"D","h":"0"}],"a":"C","e":"<p>Intrinsic value 103.50 - 101.00 = 2.50<br/> Therefore, time value = 4.17 - 2.50 = 1.67<br/> The number of days is a distracter.<\/p>"},{"s":1,"n":18,"id":"1036739","q":"<p>If basis is positive, a commodity market is said to be:<\/p>","o":[{"l":"A","h":"Free onboard"},{"l":"B","h":"In contango"},{"l":"C","h":"Cash settled"},{"l":"D","h":"In backwardation"}],"a":"D","e":"<p>Positive basis means that cash prices are higher than futures prices. This is known as backwardation. Usually, commodity markets are in contango, basis is negative, and cash prices are lower than futures prices.<\/p>"},{"s":1,"n":19,"id":"1065103","q":"<p>Which of the following exchanges using the electronic order book system called Select?<\/p>","o":[{"l":"A","h":"London Stock Exchange"},{"l":"B","h":"London Metal Exchange"},{"l":"C","h":"Eurex"},{"l":"D","h":"Chicago Board Options Exchange"}],"a":"B","e":"<p>The trading system used by the LME is called LME Select. Exchange members are connected to the system, which allows trading on all LME contracts. It operates between 01:00 and 19:00 (London time) alongside the open outcry and telephone markets and provides a straight-through processing route for matching and clearing trades through LCH.Clearnet Limited. The front end of the system allows traders a wide range of options, so that they can have trading screens which display their own particular preferences. There is in-depth analysis of the market available and information relating to executed trades, which can be used by members' back office operations. As well as viewing their own orders in the electronic market, traders can see the bids and offers that are being quoted, to know the depth of the market and price trends at all times.<\/p>"},{"s":1,"n":20,"id":"1036752","q":"<p>Which of the following best describes a position limit?<\/p>","o":[{"l":"A","h":"A limit placed by a firm on its individual traders as to the maximum amount of open contracts they can hold at any one time"},{"l":"B","h":"A limit set by an exchange as to the maximum amount of open contracts that a member firm may hold at any one time, and which is voluntarily complied with by that firm"},{"l":"C","h":"A limit set by an exchange as to the maximum amount of open contracts that a member firm may hold at any one time, and which must be complied with by that firm"},{"l":"D","h":"A limit set by a firm on the maximum amount of open trades that can be held in respect of each particular counterparty"}],"a":"C","e":"<p>Position limits are set by the exchange and must be complied by the firm.<\/p>"},{"s":1,"n":21,"id":"1036748","q":"<p>What is tick value?<\/p><p class=\"rom\"><b>I<\/b> The product of multiplying tick size by contract size<\/p><p class=\"rom\"><b>II<\/b> The profit or loss caused by a one tick movement in price on one futures contract<\/p><p class=\"rom\"><b>III<\/b> The smallest permitted price movement in a futures contract<\/p><p class=\"rom\"><b>IV<\/b> A value used to calculate profit or loss on option trades which is dependant on the strike price of the option<\/p>","o":[{"l":"A","h":"I only"},{"l":"B","h":"I and II"},{"l":"C","h":"III only"},{"l":"D","h":"I, II and IV"}],"a":"B","e":"<p>The tick size represents the minimum movement of a contract but we also need to consider the contract size to understand the overall profit or loss on the contract per a tick movement. So this can also be described as tick size x contract size.<\/p>"},{"s":1,"n":22,"id":"1036669","q":"<p>A trader buys five single stock futures contracts for a German company at €0.62 and sells at €0.38. What is the trader's profit or loss assuming a contract size of 100 shares?<\/p>","o":[{"l":"A","h":"Profit €120"},{"l":"B","h":"Loss €120"},{"l":"C","h":"Profit €1,200"},{"l":"D","h":"Loss €1,200"}],"a":"B","e":"<p>Single stock futures normally have a contract size of 100 (except UK and Italy, where the contract size is 1,000)<br/> Total loss = (€0.38 - €0.62) x 100 shares x 5 contracts = €120<\/p>"},{"s":1,"n":23,"id":"1052248","q":"<p>Which of the following BEST reflects the margin process on the theoretical inter-market margining system?<\/p>","o":[{"l":"A","h":"Premium margin (risk margin is ignored)"},{"l":"B","h":"Risk margin (premium margin is ignored)"},{"l":"C","h":"Premium margin minus risk margin"},{"l":"D","h":"Premium margin plus risk margin"}],"a":"D","e":"<p>TIMS bases its total margin calculation for each position on calculating two margin components: the premium margin and the risk margin. The sum of these is the total margin. The premium margin is the market value of a particular position at the close of trading. The risk margin uses an option pricing formula to measure the potential change in the position's value.<\/p>"},{"s":1,"n":24,"id":"1036698","q":"<p>A portfolio consists of a 2,400 strike long call, premium paid 55p, for January expiry and a 2,400 strike long put, premium paid 75p, for January expiry on the same underlying asset. The spot price of the asset today is 2,345. Calculate the prices of the asset beyond which the portfolio will profit.<\/p>","o":[{"l":"A","h":"2,215 and 2,530"},{"l":"B","h":"2,215 and 2,475"},{"l":"C","h":"2,270 and 2,530"},{"l":"D","h":"2,345 and 2,400"}],"a":"C","e":"<p>The portfolio represents a long straddle. The break even points are the strike price + both premiums and the strike - both premiums.<\/p>"},{"s":1,"n":25,"id":"1036664","q":"<p>Which ONE of the following represents the normal procedure for a derivatives transaction?<\/p>","o":[{"l":"A","h":"Broker A, Broker B, Client B, Matching, Clearing"},{"l":"B","h":"Client A, Broker A, Broker B, Matching, Clearing"},{"l":"C","h":"Client A, Client B, Broker B, Matching, Clearing"},{"l":"D","h":"Client A, Broker B, Client B, Matching, Clearing"}],"a":"B","e":"<p>Once a client places an order with their OWN broker the trade will be executed with another counterparty (Broker B) and then go to the clearing house for matching and clearing.<\/p>"},{"s":1,"n":26,"id":"1036681","q":"<p>A fund manager planning to increase his exposure to equity but still awaiting cash from a client could hedge this exposure using which ONE of the following?<\/p>","o":[{"l":"A","h":"Long call"},{"l":"B","h":"Long put"},{"l":"C","h":"Short call"},{"l":"D","h":"Short put"}],"a":"A","e":"<p>A long call would give the fund manager the right but not the obligation to buy shares at an agreed price if the equity market rose in the future.<\/p>"},{"s":1,"n":27,"id":"1036746","q":"<p>Gold, silver, copper and crude oil contracts are available in the US on which of the following exchanges?<\/p>","o":[{"l":"A","h":"CBOE"},{"l":"B","h":"NYMEX"},{"l":"C","h":"CME"},{"l":"D","h":"CBOT"}],"a":"C","e":"<p>The best answer is CME which allows trading of energy products including gas oil, crude oil and natural gas, as well as a range of precious metals, such as gold and silver along with base metal contracts for aluminium and copper, while ferrous metals including iron ore and hot-rolled steel are traded on the New York Mercantile Exchange (NYMEX). CBOT for agricultural and soft commodities, gold, metals and ethanol.<\/p>"},{"s":1,"n":28,"id":"1036731","q":"<p>You buy ten Brent crude futures on ICE at $19.25, then close the position later by selling ten contracts at $23.50. Given the following contract specifications what is the profit or loss?<br/> Contract size: 1,000 barrels<br/> Tick size: $0.01<br/> Tick value: $10.00<\/p>","o":[{"l":"A","h":"$4,250 loss"},{"l":"B","h":"$42,500 profit"},{"l":"C","h":"$4,250 profit"},{"l":"D","h":"$42,500 loss"}],"a":"B","e":"<p>Profit = ($23.50 - $19.25 = 425 ticks) x $10 x 10 contracts = $42,500<\/p>"},{"s":1,"n":29,"id":"1036735","q":"<p>Which of the following futures contracts, when held to delivery, may not be physically delivered?<\/p>","o":[{"l":"A","h":"Copper"},{"l":"B","h":"Brent crude"},{"l":"C","h":"Cocoa"},{"l":"D","h":"Wheat"}],"a":"B","e":"<p>All non-financial futures are physically delivered except Brent (either cash settled or delivered through an EFP).<\/p>"},{"s":1,"n":30,"id":"1055074","q":"<p>If a company is liquidated which of these scenarios is most accurate?<\/p>","o":[{"l":"A","h":"Shareholders will be entitled to all assets that are left after others have settled their claims."},{"l":"B","h":"Shareholders will be entitled to all prior paid up share capital after others have settled their claims."},{"l":"C","h":"Shareholders will be entitled to all subsequent paid up share capital after others have settled their claims."},{"l":"D","h":"Shareholders will be entitled to the nominal value of their shares after others have settled their claims."}],"a":"A","e":"<p>In the event of the winding up of a company, ordinary shareholders are entitled to a share of the remaining (i.e. surplus) assets of the company, but only after ALL other liabilities have been paid. This may result in ordinary shareholders receiving more than their nominal or face value.<\/p>"},{"s":1,"n":31,"id":"1036713","q":"<p>What is the benefit of trading OTC?<\/p>","o":[{"l":"A","h":"Increased liquidity"},{"l":"B","h":"Reduced risk"},{"l":"C","h":"Higher regulatory protection"},{"l":"D","h":"Flexibility"}],"a":"D","e":"<p>OTC trading allows bespoke contracts to be negotiated between buyers and sellers, giving more flexibility. However, this also reduces liquidity. OTC trades tend to be less protected by regulators, and the buyers and sellers are directly exposed to counterparty risk.<\/p>"},{"s":1,"n":32,"id":"1036743","q":"<p>A long put option position has potential for:<\/p>","o":[{"l":"A","h":"Unlimited profit and unlimited loss"},{"l":"B","h":"Limited profit and limited loss"},{"l":"C","h":"Unlimited profit and limited loss"},{"l":"D","h":"Losses limited to strike price plus premium"}],"a":"B","e":"<p>A put option is the right to sell. The owner of a put option will not exercise if the share price at maturity is higher than the strike price. If this is the case, the option will be abandoned and only the premium lost, i.e. limited losses. If the share price falls BELOW the exercise price, the holder will exercise and take a profit (the lower the share price the bigger the profit). There is a limit on the profit as the share price can fall no lower than zero.<\/p>"},{"s":1,"n":33,"id":"1036736","q":"<p>On which of the following exchanges are energy derivatives traded?<\/p><p class=\"rom\"><b>I<\/b> NYMEX<\/p><p class=\"rom\"><b>II<\/b> COMEX<\/p><p class=\"rom\"><b>III<\/b> MEFF<\/p><p class=\"rom\"><b>IV<\/b> ICE<\/p>","o":[{"l":"A","h":"I and II"},{"l":"B","h":"II and III"},{"l":"C","h":"I and IV"},{"l":"D","h":"III and IV"}],"a":"C","e":"<p>Metals are traded on COMEX. Financial derivatives are traded on MEFF.<\/p>"},{"s":1,"n":34,"id":"1036721","q":"<p>What would be the equivalent exposure to the UK stock market if an investor bought seven FTSE 100 futures? The contract is currently at 6,400 points and has a tick value of £5 per half point.<\/p>","o":[{"l":"A","h":"£32,000"},{"l":"B","h":"£64,000"},{"l":"C","h":"£224,000"},{"l":"D","h":"£448,000"}],"a":"D","e":"<p>Total exposure = 6,400 points x £10 per point x 7 contracts = £448,000.<\/p>"},{"s":1,"n":35,"id":"1036677","q":"<p>In the event of an abnormal yield curve, what is the impact on gilt prices?<\/p>","o":[{"l":"A","h":"Short-dated gilts have a higher price than long-dated gilts"},{"l":"B","h":"Long-dated gilts have a higher price than short-dated gilts"},{"l":"C","h":"Long- and short-dated gilts have the same price"},{"l":"D","h":"The yield curve has no impact on gilt prices"}],"a":"B","e":"<p>If the yield curve is abnormal then it is DOWNWARD sloping. This means that short-dated gilts yield more (and are therefore priced LOWER) than long-dated gilts. In other words, long-dated gilts are priced higher than short-dated gilts.<\/p>"},{"s":1,"n":36,"id":"1036742","q":"<p>Mallard Ltd pays no dividends and is currently trading at 75p. If a one year European 80 call is 10p and one year interest rates are 10%, the one year European 80 put has a theoretical value of:<\/p>","o":[{"l":"A","h":"77.3p"},{"l":"B","h":"7.73p"},{"l":"C","h":"15p"},{"l":"D","h":"150p"}],"a":"B","e":"<p>Put-call parity theory:<br/> C - P = S - K / (1 + r)^t<br/> Therefore:<br/> 10p - P = 75p - 80p / 1 + 0.1<br/> 10p - P = 75p - 72.73p<br/> 10p - P = 2.27p<br/> 10p - 2.27p = 7.73p<\/p>"},{"s":1,"n":37,"id":"1053745","q":"<p>An EDSP would not apply to which one of the following?<\/p>","o":[{"l":"A","h":"Grade A Copper future"},{"l":"B","h":"Long Gilt future"},{"l":"C","h":"Eurodollar future"},{"l":"D","h":"CBoT mini Dow put"}],"a":"D","e":"<p>A put has a strike price at which it can be exercised and does not need an EDSP.<br/> EDSPs are used with futures contracts.<\/p>"},{"s":1,"n":38,"id":"1036688","q":"<p>An investor goes long on a September 330 call option on ACME shares for 30p. At expiry, she exercises the option, when the underlying share is selling at 335p. What is her return/loss?<\/p>","o":[{"l":"A","h":"-25p"},{"l":"B","h":"35p"},{"l":"C","h":"5p"},{"l":"D","h":"-5p"}],"a":"A","e":"<p>By exercising the option, she has made 5p over the strike price, however the option cost 30p. The overall position is a loss of 25p.<\/p>"},{"s":1,"n":39,"id":"1036694","q":"<p>It is April. The June/December calendar spread on ICE's STIR future contract is trading at +30 ticks. If an investor BUYS the spread, which of the following is/are true?<\/p><p class=\"rom\"><b>I<\/b> The investor buys the June leg and sells the December leg<\/p><p class=\"rom\"><b>II<\/b> The investor buys the December leg and sells the June leg<\/p><p class=\"rom\"><b>III<\/b> The investor expects the yield curve to flatten<\/p><p class=\"rom\"><b>IV<\/b> The investor expects the yield curve to steepen<\/p>","o":[{"l":"A","h":"I and III"},{"l":"B","h":"II and III"},{"l":"C","h":"I and IV"},{"l":"D","h":"II and IV"}],"a":"C","e":"<p>When buying the spread, buy the near-dated contract and sell the far-dated contract.<\/p><p>As the investor is buying the June leg, they must expect prices to go up in the near month. Remember that the price of a STIR futures moves inversely with the interest rate, which means they expect interest rates to go down in the near month.<\/p><p>The investor is also selling the December leg, which means they must expect prices to go down (and rates to go up) in the far month.<\/p><p>If near-dates rates fall and far-dated rates rise, the yield curve will get steeper.<\/p>"},{"s":1,"n":40,"id":"1036734","q":"<p>Which of the following are characteristics of open outcry markets?<\/p><p class=\"rom\"><b>I<\/b> They are traded on a trading floor<\/p><p class=\"rom\"><b>II<\/b> They ensure a transparent market<\/p><p class=\"rom\"><b>III<\/b> Traders must shout their bid and offer prices<\/p><p class=\"rom\"><b>IV<\/b> They allow exchange traded products to be traded at any time<\/p>","o":[{"l":"A","h":"II and IV"},{"l":"B","h":"I, II and III"},{"l":"C","h":"I, III and IV"},{"l":"D","h":"I, II, III and IV"}],"a":"B","e":"<p>All descriptions correct but they can not be traded at all times but within some specified times.<\/p>"},{"s":1,"n":41,"id":"1036747","q":"<p>A fund manager wants to hedge a £10m holding of equities using FTSE 100 option contracts with a strike of 5,450. If spot is currently 5,400 and the contract value is £10 per point, how many contracts would be required?<\/p>","o":[{"l":"A","h":"183"},{"l":"B","h":"185"},{"l":"C","h":"1,834"},{"l":"D","h":"1,852"}],"a":"A","e":"<p>Value of portfolio / (strike x £10 / point)<br/> £10m / (5450 x £10) = 183<\/p>"},{"s":1,"n":42,"id":"1036709","q":"<p>The CFTC Part 30 exemption allows:<\/p>","o":[{"l":"A","h":"Non-US brokers to trade on US derivative exchanges"},{"l":"B","h":"US brokers to trade on non-US derivative exchanges"},{"l":"C","h":"Non-US brokers to trade on non-US exchanges on behalf of US client"},{"l":"D","h":"US brokers to trade on non-US exchanges on behalf of US clients"}],"a":"C","e":"<p>The Part 30 exemption rule allows non-US brokers, after they have complied with a number of requirements, to trade on non-US derivatives exchanges on behalf of US clients, without NFA registration.<\/p>"},{"s":1,"n":43,"id":"1072239","q":"<p>Which of the following describes a block trade?<\/p>","o":[{"l":"A","h":"A transaction involving a future and a corresponding cash instrument"},{"l":"B","h":"A facility to exchange an OTC position for a future's position"},{"l":"C","h":"A large deal conducted away from the previous market price"},{"l":"D","h":"A facility to correct an error in execution of a large trade"}],"a":"C","e":"<p>A block trade is a large transaction made between an exchange member and a wholesale client. Block trades are allowed to be negotiated away from the central order book as long as they are reported into the exchange once they are agreed.<\/p>"},{"s":1,"n":44,"id":"1036719","q":"<p>Put the following actions in order from first to last relating to a holder deciding to exercise an option:<\/p><p class=\"rom\"><b>I<\/b> The writer receives an assignment notice from the clearing house and must then honour their obligations<\/p><p class=\"rom\"><b>II<\/b> The broker receives an assignment notice from the clearing house and allocates it to a client who holds a position as a writer<\/p><p class=\"rom\"><b>III<\/b> The broker completes an exercise notice and forwards it to the clearing house<\/p><p class=\"rom\"><b>IV<\/b> Upon receipt of the exercise notice the clearing house assigns it to a member firm<\/p>","o":[{"l":"A","h":"III, IV, II, I"},{"l":"B","h":"II, III, IV, I"},{"l":"C","h":"I, II, III, IV"},{"l":"D","h":"IV, I, III, II"}],"a":"A","e":"<p>The holder informs their broker that they wish to deliver, which begins the whole process of exercising an option.<\/p>"},{"s":1,"n":45,"id":"1036693","q":"<p>Which of the following best describes a FRA: Forward Rate Agreement?<\/p>","o":[{"l":"A","h":"An exchange-traded forward contract that determines an interest rate to be paid or received on an obligation beginning at a start date sometime in the future"},{"l":"B","h":"An OTC forward contract that determines an interest rate to be paid or received on an obligation beginning at a start date sometime in the future"},{"l":"C","h":"An exchange-traded forward contract that determines a currency rate to be paid or received on an obligation beginning at a start date sometime in the future"},{"l":"D","h":"An OTC forward contract that determines a currency rate to be paid or received on an obligation beginning at a start date sometime in the future"}],"a":"B","e":"<p>FRAs permit the user to hedge or speculate on short term interest rates using an OTC product. They are similar to exchange traded short term interest rate futures.<\/p>"},{"s":1,"n":46,"id":"1052253","q":"<p>Many proponents of the principles-based approach feel that the key advantage over rules-based regulation is:<\/p>","o":[{"l":"A","h":"Cost effectiveness"},{"l":"B","h":"International acceptance"},{"l":"C","h":"Flexibility"},{"l":"D","h":"Standardisation of procedures"}],"a":"C","e":"<p>The flexibility to innovate, the accessibility to smaller firms and the focus on the purpose of regulation are stated to be the main benefits of principles-based regulation.<\/p>"},{"s":1,"n":47,"id":"1036717","q":"<p>You've sold ten single stock futures for a UK company for 800p. You closed out the position at 780p. What is your profit or loss assuming a contract size of 1,000 shares?<\/p>","o":[{"l":"A","h":"£200 profit"},{"l":"B","h":"£2,000 profit"},{"l":"C","h":"£200 loss"},{"l":"D","h":"£2,000 loss"}],"a":"B","e":"<p>Profit per contract is the difference between the buying and the selling price, which is £0.20. The contract size is 1,000 for UK shares and we have ten contracts, so 0.20 X 10 X 1,000 = £2,000 profit.<\/p>"},{"s":1,"n":48,"id":"1036751","q":"<p>If the futures contract were trading significantly below its fair value, an arbitrageur would execute a:<\/p>","o":[{"l":"A","h":"Box"},{"l":"B","h":"Cash and carry arbitrage"},{"l":"C","h":"Reverse cash and carry arbitrage"},{"l":"D","h":"Reversal"}],"a":"C","e":"<p>Buy the future as it is relatively cheap and sell the cash asset - a reverse cash and carry arbitrage.<\/p>"},{"s":1,"n":49,"id":"1036732","q":"<p>A short hedger of crude oil futures is all of the following except:<\/p>","o":[{"l":"A","h":"Long of cash crude oil and short of the future"},{"l":"B","h":"Protected against adverse price movements in crude oil"},{"l":"C","h":"Planning to sell crude oil in the future"},{"l":"D","h":"Long of the future and short cash crude oil"}],"a":"D","e":"<p>A short hedger holds the underlying and sells futures contracts.<\/p>"},{"s":1,"n":50,"id":"1052257","q":"<p>When is collateral for OTC traded options most likely to be called?<\/p>","o":[{"l":"A","h":"If the option moves out-of-the money"},{"l":"B","h":"If the option moves in-the-money"},{"l":"C","h":"If interest rates rise"},{"l":"D","h":"If volatility falls"}],"a":"B","e":"<p>We do not know what type of option is being referred to, so interest rates cannot be used as they affect calls and puts differently. If an option moves in-the-money, it exposes the holder to increased default risk of the writer. This would be covered by collateral. As option premiums are typically paid up front, the option moving out-of-the-money exposes the writer to no more risk than that already covered by the premium.<\/p>"},{"s":1,"n":51,"id":"1053751","q":"<p>Where a broker is extending a credit line, after how many days must the broker have a formal written agreement in place to be able to continue to offer it?<\/p>","o":[{"l":"A","h":"10"},{"l":"B","h":"5"},{"l":"C","h":"2"},{"l":"D","h":"1"}],"a":"B","e":"<p>A broker must have a formal written agreement in place to offer a credit line beyond 5 business days.<\/p>"},{"s":1,"n":52,"id":"1036716","q":"<p>How would you hedge your equity position?<\/p>","o":[{"l":"A","h":"Buy equity call options to increase exposure to the equity market"},{"l":"B","h":"Take the same position in your equity futures as the one you hold in the underlying asset"},{"l":"C","h":"Sell an equity future to benefit from an expected fall in the market"},{"l":"D","h":"Take the opposite position in your equity futures to the one you hold in equity itself"}],"a":"D","e":"<p>The futures position would need to offset the position you have in the equity, i.e. if you hold equity, sell futures. This is sometimes known as an equity hedge.<\/p>"},{"s":1,"n":53,"id":"1036684","q":"<p>Which of the following is a diagonal spread?<\/p>","o":[{"l":"A","h":"Long a Sept 110 call and short a Sept 120 call"},{"l":"B","h":"Short a June 120 call and long a June 130 call"},{"l":"C","h":"Short a June 120 put and long a Sept 120 put"},{"l":"D","h":"Short a June 120 call and long a Sept 130 call"}],"a":"D","e":"<p>A and B are vertical spreads while C is a horizontal spread. A diagonal spread has to be with different strike prices and different expiries.<\/p>"},{"s":1,"n":54,"id":"1036691","q":"<p>Which of the following is responsible for publishing the 'list of deliverables' for a bond futures contract?<\/p>","o":[{"l":"A","h":"The clearing house"},{"l":"B","h":"The exchange"},{"l":"C","h":"The debt issuer"},{"l":"D","h":"The central bank"}],"a":"B","e":"<p>The exchange will publish the list of deliverable items.<\/p>"},{"s":1,"n":55,"id":"1036733","q":"<p>Hedgers are MOST affected by:<\/p>","o":[{"l":"A","h":"Changes in the underlying price"},{"l":"B","h":"Changes in futures prices"},{"l":"C","h":"Changes in basis"},{"l":"D","h":"Changes in fair value"}],"a":"C","e":"<p>The risk of changes in basis ('basis risk') cannot be hedged.<\/p>"},{"s":1,"n":56,"id":"1036705","q":"<p>The market suddenly becomes more volatile causing the price of futures contracts to drop sharply. Which of the following types of margin will be required from a member with a large long futures position?<\/p>","o":[{"l":"A","h":"Variation"},{"l":"B","h":"Spot month"},{"l":"C","h":"Intra day"},{"l":"D","h":"Increased initial"}],"a":"C","e":"<p>Sudden increases in volatility are dealt with by the clearing house using intra day margin calls.<\/p>"},{"s":1,"n":57,"id":"1015796","q":"<p>The purchase of a futures contract at the same time as the sale of the underlying asset in the cash market is best described as:<\/p>","o":[{"l":"A","h":"Convertible arbitrage"},{"l":"B","h":"Conversion"},{"l":"C","h":"Basis trading"},{"l":"D","h":"Spread trading"}],"a":"C","e":"<p>This is an example of basis trading. The investor is selling basis, a trade associated with the expectation of basis weakening (the cash price weakening in relation to the future price). Spread trading involves the purchase and sale of futures contracts in different months.<\/p>"},{"s":1,"n":58,"id":"1036695","q":"<p>Which of the following best describes a closing purchase?<\/p>","o":[{"l":"A","h":"Long 250 December call to close out a short 250 December call"},{"l":"B","h":"Short 250 December put to offset a long 250 December call"},{"l":"C","h":"Long 250 September call and short 270 September call"},{"l":"D","h":"Long 230 June call and short 260 September put"}],"a":"A","e":"<p>A closing transaction describes one which closes out an open position.<\/p>"},{"s":1,"n":59,"id":"1079791","q":"<p>An investor performs an arbitrage trade to profit from a price discrepancy between a Brent crude oil future and a refined oil future. What type of arbitrage trade is this?<\/p>","o":[{"l":"A","h":"Geographic"},{"l":"B","h":"Intertemporal"},{"l":"C","h":"Calendar"},{"l":"D","h":"Value-chain"}],"a":"D","e":"<p>Value-chain arbitrage occurs where mispricing is identified between two futures on an asset at different stages in its production, e.g. crude oil and heating oil (a refined oil product) or soybean and soybean oil.<\/p>"},{"s":1,"n":60,"id":"1052122","q":"<p>A client receives a margin call after an adverse movement in the position of 10%. The initial margin was set at 5%. What will be the obligation of the client?<\/p>","o":[{"l":"A","h":"There is no obligation as the maintenance level has not been reached"},{"l":"B","h":"To deliver excess collateral to the value of 5%"},{"l":"C","h":"To deliver excess collateral to the value of 10%"},{"l":"D","h":"To deliver excess collateral to the value of 15%"}],"a":"C","e":"<p>It is the obligation to return the margin back to the original level.<\/p>"},{"s":1,"n":61,"id":"1036679","q":"<p>Which of the following would be considered one of the main purposes of a regulator?<\/p>","o":[{"l":"A","h":"Helping firms manage price risk"},{"l":"B","h":"Helping firms manage default risk"},{"l":"C","h":"Helping firms manage inflation risk"},{"l":"D","h":"Helping firms manage operational risk"}],"a":"D","e":"<p>Regulators introduce processes that allow firms to manage operational risk.<\/p>"},{"s":1,"n":62,"id":"1036692","q":"<p>Which of the following additional pieces of information is required for suitability assessment?<\/p>","o":[{"l":"A","h":"The unrealised profit or loss on open positions"},{"l":"B","h":"The client's investment objectives"},{"l":"C","h":"The resulting profit or loss on each position closed during the period"},{"l":"D","h":"The aggregate of money transferred into and out of the portfolio during the valuation period"}],"a":"B","e":"<p>A firm will asses the investor's objectives, their financial status and their knowledge and experience.<\/p>"},{"s":1,"n":63,"id":"1036704","q":"<p>Which of the following actions would a broker take if a client misses a variation margin call?<\/p>","o":[{"l":"A","h":"Close the position"},{"l":"B","h":"Cover the amount using other client accounts"},{"l":"C","h":"Cover the amount using the house account"},{"l":"D","h":"No action required"}],"a":"C","e":"<p>A broker may cover variation margin calls using their own funds provided the client reimburses within five business days. After that the position would be closed.<\/p>"},{"s":1,"n":64,"id":"1036729","q":"<p>Which of the following situations would result in backwardation in cocoa futures?<\/p>","o":[{"l":"A","h":"A weakening of basis"},{"l":"B","h":"A poor harvest reducing supply of cocoa"},{"l":"C","h":"High interest rates"},{"l":"D","h":"Strengthening of basis"}],"a":"B","e":"<p>Backwardation is when near prices are higher than future prices. A poor harvest in cocoa would result in demand today rising to such an extent that near prices may rise higher than future prices.<\/p>"},{"s":1,"n":65,"id":"1017023","q":"<p>The US dollar/Japanese exchange rate is 1 USD = 100 JPY. The interest rate in US is 2% pa and 0% pa in Japan. What will be the three-month forward rate?<\/p>","o":[{"l":"A","h":"98.039"},{"l":"B","h":"102"},{"l":"C","h":"99.5025"},{"l":"D","h":"100.50"}],"a":"C","e":"<p>The forward rate is calculated as: Spot rate x 1 + variable exchange rate (yen rate) / 1 + fixed exchange rate (US dollar rate). We assume that the rate quoted (2%) is an annual rate; therefore it needs to be pro-rated to get the three-month rate. 100 x 1 / 1.005 = 99.5025<\/p>"},{"s":1,"n":66,"id":"1036711","q":"<p>A trader wants to hedge £14m of FTSE 100 stocks using index options. The index is currently at 5,100 points and a put option with a strike of 5,000 is available. How many contracts are required if the contract is worth £5 per half index point?<\/p>","o":[{"l":"A","h":"275"},{"l":"B","h":"280"},{"l":"C","h":"2,750"},{"l":"D","h":"2,800"}],"a":"B","e":"<p>£14m/(5000 x £10) = 280<\/p>"},{"s":1,"n":67,"id":"1036745","q":"<p>What is the approximate fair value of a European style 150 call option on a physical asset given the following information?<\/p><ul> <li><p>Underlying price 200p<\/p><\/li> <li><p>Interest rate 10%<\/p><\/li> <li><p>Days to expiry 180<\/p><\/li> <li><p>No dividends/coupons payable<\/p><\/li> <li><p>Put price 16p<\/p><\/li> <li><p>Volatility 40%<\/p><\/li> <\/ul>","o":[{"l":"A","h":"16p"},{"l":"B","h":"150p"},{"l":"C","h":"73p"},{"l":"D","h":"75p"}],"a":"C","e":"<p>Using put-call parity: C - P = S - K / (1 + r)^t C - 16p = 200p - 150p / [(1 + 0.1) ^ (180 / 365)] C - 16p = 200p - 150p / 1.048 C - 16p = 200p - 143p C = 200p - 143p + 16p = 73p<\/p>"},{"s":1,"n":68,"id":"1072187","q":"<p>Which of the below describes the relationship between reward and risk?<\/p>","o":[{"l":"A","h":"Would expect a higher reward for higher risk"},{"l":"B","h":"Would expect a lower reward for higher risk"},{"l":"C","h":"Would expect a higher risk to achieve a lower possibility of loss"},{"l":"D","h":"Would expect a lower risk to achieve a higher possibility of loss"}],"a":"A","e":"<p>An investor would not be interested in a higher risk unless they are able to achieve a higher return but that also exposes them to a higher loss.<\/p>"},{"s":1,"n":69,"id":"1036660","q":"<p>You buy two FTSE futures at 6,150 at 10.00am. The closing price at the end of the day on the future is 6,097. If the initial margin is £3,000 per contract and the value of one index point is £10, what is the total margin payment due to be made to LCH Ltd by 9.00am the next business day?<\/p>","o":[{"l":"A","h":"£2,470"},{"l":"B","h":"£3,530"},{"l":"C","h":"£7,060"},{"l":"D","h":"£4,940"}],"a":"C","e":"<p>£<br/> Initial margin 2 x £3,000 6,000<br/> Variation margin<br/> (6,150-6,097) x £10 x 2 1,060<br/> Total margin due 7,060<\/p>"},{"s":1,"n":70,"id":"1051976","q":"<p>Which of the following is most likely to only act as a price taker?<\/p>","o":[{"l":"A","h":"Market maker"},{"l":"B","h":"Bank"},{"l":"C","h":"Broker"},{"l":"D","h":"Asset manager"}],"a":"D","e":"<p>Asset managers typically act as the clients of exchange members and, therefore, take prices that are offered.<\/p>"},{"s":1,"n":71,"id":"1015935","q":"<p>Which of the following is TRUE of an option premium over time if interest rates, volatility and other factors remain the same?<\/p>","o":[{"l":"A","h":"The premium increases"},{"l":"B","h":"The premium decreases"},{"l":"C","h":"The premium remains constant"},{"l":"D","h":"It is impossible to say"}],"a":"B","e":"<p>Assuming there is no movement in the underlying asset value, the time value in the premium will decline as the contract approaches expiry due to time decay.<\/p>"},{"s":1,"n":72,"id":"1036714","q":"<p>An investor buys a bond with a BBB- credit rating. Why would they take out a credit default swap on the bond?<\/p>","o":[{"l":"A","h":"To increase the credit rating of the bond to AAA"},{"l":"B","h":"To sell the bond on at a profit"},{"l":"C","h":"To protect the investor from a credit event"},{"l":"D","h":"To swap the bonds income with the income of another asset"}],"a":"C","e":"<p>An investor would buy a credit default swap to protect himself from a credit event. If the bond did not suffer a credit event they would lose the premium that they paid for the swap..<\/p>"},{"s":1,"n":73,"id":"1036668","q":"<p>Which of the following is used to notify an option writer of a requirement to deliver?<\/p>","o":[{"l":"A","h":"Assignment notice"},{"l":"B","h":"Delivery notice"},{"l":"C","h":"Contract note"},{"l":"D","h":"Allocation notice"}],"a":"A","e":"<p>Option writers are randomly chosen by LCH using assignment notices.<\/p>"},{"s":1,"n":74,"id":"1077988","q":"<p>What is making it increasingly difficult to differentiate the over-the-counter market in derivatives from the exchange-traded market?<\/p>","o":[{"l":"A","h":"Use of technology in straight through processing of trades"},{"l":"B","h":"Impact of regulation on pre-trade disclosures"},{"l":"C","h":"Increase in the number of retail client participants"},{"l":"D","h":"The ability to tailor your contract to meet your specific needs"}],"a":"A","e":"<p>The use of technology has had a significant impact on the OTC markets, and the use of straight through processing - end-to-end processing of trades - has brought the processing of many OTC contracts in line with those of exchange-traded.<br/> Although regulation of OTC markets has increased, there are still no obligation for pre-tradetransparency and retial clients are not common in these markets. Tailoring contracts is one of the key features that differentiate the OTC market from the exchange traded market.<\/p>"},{"s":1,"n":75,"id":"1040923","q":"<p>If the Bank of England lowers its base rate and the market rallies, which of the following portfolios will benefit most?<\/p>","o":[{"l":"A","h":"Positive Delta, positive Rho"},{"l":"B","h":"Positive Delta, negative Rho"},{"l":"C","h":"Negative Delta, positive Rho"},{"l":"D","h":"Negative Delta, negative Rho"}],"a":"B","e":"<p>We want a portfolio that has a negative correlation with interest rates - i.e. the portfolio goes up when interest rates go down - and has a positive correlation with market prices -  i.e. the portfolio goes up when market prices go up.<\/p><p>This indicates a negative rho and positive delta.<\/p>"},{"s":1,"n":76,"id":"1051980","q":"<p>What is the objective of client categorisation to ensure?<\/p>","o":[{"l":"A","h":"All clients are considered the same"},{"l":"B","h":"Clients are categorised based on the main instrument traded"},{"l":"C","h":"Clients are categorised based on their specific service requirements"},{"l":"D","h":"Categorisation is based on the financial resources of the client"}],"a":"C","e":"<p>This is the best available answer, since the level of service required and the client knowledge and experience will all be considered.<\/p>"},{"s":1,"n":77,"id":"1036689","q":"<p>The cash price of one lot of Aluminium is currently at $1,200/tonne. The cost of three month's storage is $15/tonne. Interest rates are currently 12% p.a. What contango for the three month over the cash is required to make it beneficial for a member to enter a contract to buy cash and sell forward three months?<\/p>","o":[{"l":"A","h":"$27/tonne"},{"l":"B","h":"$36/tonne"},{"l":"C","h":"$52/tonne"},{"l":"D","h":"$50/tonne"}],"a":"C","e":"<p>($1,200 x 12% x 3/12) + $15 = $51. To make a profit the actual futures price needs to be in excess of $51 above the cash price.<\/p>"},{"s":1,"n":78,"id":"1036659","q":"<p>In the context of futures and options exchanges, which of the following are characteristics of a liquid market?<\/p><p class=\"rom\"><b>I<\/b> Large volumes traded<\/p><p class=\"rom\"><b>II<\/b> Narrow bid/offer spreads<\/p><p class=\"rom\"><b>III<\/b> Large open interest<\/p><p class=\"rom\"><b>IV<\/b> Ease of trading in and out of positions<\/p>","o":[{"l":"A","h":"I, II, III and IV"},{"l":"B","h":"I and III"},{"l":"C","h":"I, III and IV"},{"l":"D","h":"II and IV"}],"a":"A","e":"<p>Large open interest is a sign of a liquid market. Liquid means that it is easy to open and close positions. You would also expect to find high volumes and narrow bid-offer spreads as a result.<\/p>"},{"s":1,"n":79,"id":"1036662","q":"<p>A currency trader anticipates yen will weaken against the dollar. Which of the following should he choose?<\/p>","o":[{"l":"A","h":"Buy a yen put"},{"l":"B","h":"Sell a yen put"},{"l":"C","h":"Buy a yen call"},{"l":"D","h":"Sell a yen call"}],"a":"A","e":"<p>If we expect the yen to weaken against the dollar then the yen is FALLING in value against the dollar. Investors should therefore buy a yen put option, which will make profits in a falling yen market: i.e. when the dollar is rising in value, investors should buy the right to sell the falling currency.<\/p>"},{"s":1,"n":80,"id":"1036718","q":"<p>When a clearing house calculates a net margin call after marking to market, which of the following best describes the effect on the clearing members?<\/p>","o":[{"l":"A","h":"Less margin will be called from both the client and the house accounts"},{"l":"B","h":"Trades from the same exchange are cancelled out"},{"l":"C","h":"Less margin will be called from the house account only"},{"l":"D","h":"House margin is netted off against client margin"}],"a":"C","e":"<p>Clearing houses offer a principal to principal guarantee. That is, they recognise the clearing member only, not the clearing member's clients. If two clients' margin payments net off, it is possible for the house (clearing member) to hold onto this margin and not pay it over to the clearing house.<\/p>"},{"s":1,"n":81,"id":"1036723","q":"<p>Which of the following is a single currency basis swap?<\/p>","o":[{"l":"A","h":"3m $ LIBOR for 6m £ LIBOR"},{"l":"B","h":"3m $ LIBOR for 6m $ LIBOR"},{"l":"C","h":"Fixed $ for floating $"},{"l":"D","h":"Fixed £ for floating £"}],"a":"B","e":"<p>A basis swap is where one floating rate is exchanged for a different floating rate. A single currency basis swap is where all payments are in the same currency.<\/p>"},{"s":1,"n":82,"id":"1036696","q":"<p>Which of the following is not an option spread trade?<\/p>","o":[{"l":"A","h":"Buy 120 September put and sell 130 September put"},{"l":"B","h":"Sell 100 June call and buy 110 June call"},{"l":"C","h":"Sell 120 December put and buy December 130 put"},{"l":"D","h":"Buying a 230 September call and selling a 230 December put"}],"a":"D","e":"<p>Option A: Bull put spread<br/> Option B: Bear call spread<br/> Option C: Bear put spread<br/> A spread trade involves two puts OR two calls<\/p>"},{"s":1,"n":83,"id":"1015937","q":"<p>Which of the following is TRUE of gamma?<\/p>","o":[{"l":"A","h":"Gamma decreases for at the money options as the option approaches expiry"},{"l":"B","h":"Gamma dictates the change in the value of an option premium"},{"l":"C","h":"Gamma moves in the same direction as delta"},{"l":"D","h":"A decrease in gamma would reflect more stability in option deltas."}],"a":"D","e":"<p>Gamma is the sensitivity of delta, i.e. it measures how quickly delta is changing. A decrease in gamma would mean that changes in delta were smaller.<\/p>"},{"s":1,"n":84,"id":"1053735","q":"<p>An asset is currently priced as €5.00 for which the call option with a strike of €6.00 has a premium of €0.70 If the asset increases in price by €0.75 and the option has a delta of 0.36 by how much will it increase in price?<\/p>","o":[{"l":"A","h":"€0.75"},{"l":"B","h":"€0.27"},{"l":"C","h":"€0.24"},{"l":"D","h":"€1.80"}],"a":"B","e":"<p>Delta is a measure of a change in price of the option premium relative to a change in the price of the underlying asset.<br/> If the asset increases by €0.75, the option price would increase by 0.36 x €0.75 = €0.27<\/p>"},{"s":1,"n":85,"id":"1036737","q":"<p>On which exchange are traded average price options (TAPOs) available?<\/p>","o":[{"l":"A","h":"COMEX"},{"l":"B","h":"ICE"},{"l":"C","h":"LME"},{"l":"D","h":"CSCE"}],"a":"C","e":"<p>Note: TAPOs are options where the price is calculated using the average price for the underlying over a period of time.<\/p>"},{"s":1,"n":86,"id":"1053736","q":"<p>An investor holds a short position in South American soybean futures. Which is the last day upon which the investor can close out their position?<\/p>","o":[{"l":"A","h":"The day before the first notice day"},{"l":"B","h":"The last notice day"},{"l":"C","h":"The last trading day"},{"l":"D","h":"The day before the last trading day"}],"a":"C","e":"<p>The last day to close out a future position is the last trading day. Any positions still open after the last trading day will go to actual delivery. The long must close out their position the day before the first notice day to guarantee that they will not be forced to take delivery.<\/p>"},{"s":1,"n":87,"id":"1052246","q":"<p>Which of the following is the best definition of an exchange delivery settlement price?<\/p>","o":[{"l":"A","h":"The marked-to-market price for the day on which variation margin is based"},{"l":"B","h":"The settlement price paid on a cash-settled future"},{"l":"C","h":"The guaranteed price at which open positions can close out their positions"},{"l":"D","h":"The price established on the last trading day on which a final variation margin will be paid"}],"a":"D","e":"<p>EDSP is the market's term for the official closing price of the contract on the last trading day. It is set by the exchange in order to prevent any possible manipulation of the actual closing price.<br/> For physically delivered futures, it represents the amount of money paid by the long on delivery based on one unit of trading (for example, per tonne). For cash settled contracts, it represents the price on which a final variation margin will be paid.<\/p>"},{"s":1,"n":88,"id":"1036701","q":"<p>Which of the following is not true of both initial and variation margin?<\/p>","o":[{"l":"A","h":"Protects the clearing house from default"},{"l":"B","h":"Based on changes in value of the underlying asset"},{"l":"C","h":"Can be paid as cash or collateral"},{"l":"D","h":"Amount determined by the clearing house"}],"a":"C","e":"<p>Variation margin must be settled in cash whereas initial margin can be cash or suitable collateral.<\/p>"},{"s":1,"n":89,"id":"1052256","q":"<p>Which of the following best represents the benefits of a covered short put position?<\/p>","o":[{"l":"A","h":"Extra return in a stable market and some protection from a rising market"},{"l":"B","h":"Extra return in a stable market and some protection from a falling market"},{"l":"C","h":"Protection from a falling market at the expense of limited profits in a rising market"},{"l":"D","h":"Protection from a rising market at the expense of limited profits in a falling market"}],"a":"A","e":"<p>A covered short put is a trade performed by an investor that requires an asset. They wish to buy the asset, but believe the return will be low, due to a static market. If the investor sells an OTM put on this, they generate extra income and defer the purchase of the asset. If the market remains static, this creates an extra income (premium on the option plus interest on what the investor would have spent on the asset). If the market rises a little, this strategy gives a little upside protection.<\/p>"},{"s":1,"n":90,"id":"1015819","q":"<p>Who is responsible for financing a clearing house's default fund?<\/p>","o":[{"l":"A","h":"A clearing house"},{"l":"B","h":"Clearing members"},{"l":"C","h":"Exchanges"},{"l":"D","h":"The regulator"}],"a":"B","e":"<p>If a clearing house operates a mutual guarantee system and the default fund is financed by levies imposed on the clearing members.<\/p>"},{"s":1,"n":91,"id":"1036673","q":"<p>You are long December coffee at 810.50 and place a stop limit order at 795. The stop order could be exercised at all of the following prices EXCEPT:<\/p>","o":[{"l":"A","h":"795"},{"l":"B","h":"795.50"},{"l":"C","h":"810.50"},{"l":"D","h":"789.50"}],"a":"D","e":"<p>If you have a long position then to cover possible losses a sell stop is often used, set at a price below the current price. Once activated, stop orders become market orders. A sell stop with a limit means that the investor wants to sell his position if the market falls to 795 but does not want to sell at a lower price. Hence if the market drops right through 795 without stopping, then this order will not be activated.<\/p>"},{"s":1,"n":92,"id":"1015798","q":"<p>A clearing house is likely to reduce the level of initial margin if which of the following occurs?<\/p>","o":[{"l":"A","h":"The contract volatility increases"},{"l":"B","h":"The risk-free rate of interest increases"},{"l":"C","h":"The risk-free rate of interest decreases"},{"l":"D","h":"The contract volatility decreases"}],"a":"D","e":"<p>Additional initial margin can be called for increased levels of volatility - therefore a fall in volatility may also reduce the initial margin requirement.<\/p>"},{"s":1,"n":93,"id":"1036678","q":"<p>Which of the following in relation to margin would not have to be disclosed to a retail client before conducting a transaction?<\/p>","o":[{"l":"A","h":"When the margin is to be paid"},{"l":"B","h":"The form in which the margin may be paid"},{"l":"C","h":"What the firm may do if the client defaults on their margin payment"},{"l":"D","h":"The amount of margin payable by the client"}],"a":"D","e":"<p>The firm would also need to disclose the other circumstances (apart from not paying margin) when it would close out the client's position without prior reference to them.<\/p>"},{"s":1,"n":94,"id":"1036720","q":"<p>Which of the following is operated by ICE Clear Europe?<\/p>","o":[{"l":"A","h":"Initial guarantee"},{"l":"B","h":"Mutual guarantee"},{"l":"C","h":"Independent guarantee"},{"l":"D","h":"No guarantee"}],"a":"B","e":"<p>ICE Clear Europe provides mutual guarantees to its clearing members. This involves guarantees not only from the clearing house but also from its members. An independent guarantee, as operated by other clearing houses, is one which is backed by the clearing house alone.<\/p>"},{"s":1,"n":95,"id":"1036686","q":"<p>If a member does not want the automatic exercise of in-the-money options on expiry, who needs to be notified?<\/p>","o":[{"l":"A","h":"Any NCM"},{"l":"B","h":"The exchange"},{"l":"C","h":"The clearing house"},{"l":"D","h":"The approved warehouse"}],"a":"C","e":"<p>ICE Clear Europe and CME Group operate an automatic exercise facility whereby it will automatically exercise any option that is sufficiently ITM at expiry.<\/p><p>There are exercise fees to be paid, so, if an investor does not want the option exerc
