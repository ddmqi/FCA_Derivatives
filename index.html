<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>CISI Derivatives Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky score header; question card + navigator grid (sidebar on wide screens, below on narrow) */
:root{
  --bg:#0A0D13; --surface:#11161F; --surface-2:#171E2A; --line:#232C3B; --line-2:#2F3A4D;
  --fg:#E9EDF4; --muted:#8B96AB; --accent:#D6B46C; --accent-ink:#1B1508; --accent-soft:rgba(214,180,108,.12);
  --good:#41C484; --good-bg:rgba(65,196,132,.13); --good-line:rgba(65,196,132,.55);
  --bad:#F06464; --bad-bg:rgba(240,100,100,.13); --bad-line:rgba(240,100,100,.55);
  --shadow:0 18px 50px -24px rgba(0,0,0,.7);
  --f-display:"Instrument Serif", "Iowan Old Style", Georgia, serif;
  --f-body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#F3F4F7; --surface:#FFFFFF; --surface-2:#EDF0F5; --line:#DCE1EA; --line-2:#C9D0DC;
  --fg:#111722; --muted:#5A6478; --accent:#8F6A1F; --accent-ink:#FFFFFF; --accent-soft:rgba(143,106,31,.10);
  --good:#178A51; --good-bg:rgba(23,138,81,.10); --good-line:rgba(23,138,81,.55);
  --bad:#C93434; --bad-bg:rgba(201,52,52,.09); --bad-line:rgba(201,52,52,.5);
  --shadow:0 14px 40px -22px rgba(20,30,50,.25); color-scheme:light; } }
:root[data-theme="light"]{
  --bg:#F3F4F7; --surface:#FFFFFF; --surface-2:#EDF0F5; --line:#DCE1EA; --line-2:#C9D0DC;
  --fg:#111722; --muted:#5A6478; --accent:#8F6A1F; --accent-ink:#FFFFFF; --accent-soft:rgba(143,106,31,.10);
  --good:#178A51; --good-bg:rgba(23,138,81,.10); --good-line:rgba(23,138,81,.55);
  --bad:#C93434; --bad-bg:rgba(201,52,52,.09); --bad-line:rgba(201,52,52,.5);
  --shadow:0 14px 40px -22px rgba(20,30,50,.25); color-scheme:light; }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:clamp(16px,3vw,32px)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;background:none;border:0;padding:0;text-align:left}
.brand b{font-family:var(--f-display);font-weight:400;font-size:26px;letter-spacing:.01em;line-height:1}
.brand span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tabs{display:flex;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;margin-left:clamp(0px,2vw,20px)}
.tab{border:0;background:transparent;border-radius:9px;padding:7px 14px;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab .sh{display:none}
@media(max-width:560px){.tab .lg{display:none}.tab .sh{display:inline}.tab{padding:7px 8px}}
.expl-body.book p strong{color:var(--accent)}
.expl-body.book p:first-child strong{color:var(--good)}
.expl-body.book em{color:var(--fg)}
.expl-body.book p+p{padding-top:.6em;border-top:1px solid var(--line)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--fg);box-shadow:inset 0 0 0 1px var(--accent)}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.sync{font-size:11px;color:var(--muted);letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--good)}
.icon-btn{border:1px solid var(--line-2);background:var(--surface);border-radius:10px;height:36px;padding:0 12px;display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.icon-btn:hover{border-color:var(--accent)}
.icon-btn svg{width:16px;height:16px}

.gauge{flex:1 1 100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;padding-bottom:12px}
.gauge .pct{font-family:var(--f-display);font-size:38px;line-height:.9;min-width:3.2ch;font-variant-numeric:tabular-nums}
.gauge .pct small{font-size:20px;color:var(--muted)}
.gauge .lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;gap:10px}
.track{height:10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;position:relative}
.track .fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:999px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 70%,var(--bad)),var(--accent) 45%,var(--good));background-size:var(--bgw,100%) 100%;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.track.progress{height:4px;margin-top:6px}
.track.progress .fill{background:var(--muted);opacity:.6}
.gauge .counts{font-size:12px;color:var(--muted);text-align:right;line-height:1.35}
.gauge .counts b{color:var(--fg);font-weight:700}
.gauge .counts .g{color:var(--good)} .gauge .counts .r{color:var(--bad)}

main.page{padding-block:28px 64px}

/* Generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.btn{border:1px solid var(--line-2);background:var(--surface-2);border-radius:12px;padding:11px 18px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover:not(:disabled){filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad-line);background:transparent}

/* Home */
.hero{display:grid;gap:6px;margin-bottom:26px}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(38px,6vw,64px);line-height:1;margin:0;text-wrap:balance}
.hero h1 em{color:var(--accent)}
.hero p{margin:0;color:var(--muted);max-width:60ch}
.home-grid{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media(min-width:980px){.home-grid{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}}
.resume{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:20px 22px;border-color:color-mix(in srgb,var(--accent) 50%,var(--line));background:linear-gradient(135deg,var(--accent-soft),transparent 60%),var(--surface);margin-bottom:20px}
.resume .txt{flex:1 1 260px;min-width:0}
.resume h3{margin:4px 0 2px;font-size:18px}
.resume p{margin:0;color:var(--muted);font-size:13px}
.resume .acts{display:flex;gap:8px;flex-wrap:wrap}
.setup{padding:24px}
.setup h2,.hist h2{font-family:var(--f-display);font-weight:400;font-size:30px;margin:4px 0 18px;line-height:1.05}
.field{display:grid;gap:10px;margin-bottom:24px}
.field-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.count-big{font-family:var(--f-display);font-size:52px;line-height:.9;font-variant-numeric:tabular-nums}
.count-big small{font-family:var(--f-body);font-size:13px;color:var(--muted);margin-left:6px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:999px;background:linear-gradient(90deg,var(--accent) var(--p,50%),var(--surface-2) var(--p,50%));border:1px solid var(--line)}
input[type=range]::-moz-range-track{height:8px;border-radius:999px;background:linear-gradient(90deg,var(--accent) var(--p,50%),var(--surface-2) var(--p,50%));border:1px solid var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--surface);border:3px solid var(--accent);margin-top:-10px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}
.presets,.chips,.seg{display:flex;flex-wrap:wrap;gap:8px}
.chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px}
.chap{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 10px;font-size:13px;color:var(--muted)}
.chap:hover{color:var(--fg);border-color:var(--line-2)}
.chap .cn{font-size:11px;color:var(--accent)}
.chap .ct{min-width:0;font-weight:600}
.chap .ex{display:flex;align-items:center;gap:8px;font-weight:600;font-size:11px;color:var(--accent);margin-top:3px}
.chap .ex i{display:block;height:4px;border-radius:999px;background:var(--accent);opacity:.75;flex:none;box-shadow:0 0 0 0 transparent}
.prog{padding:22px}
.prog h2{font-family:var(--f-display);font-weight:400;font-size:30px;margin:4px 0 6px;line-height:1.05}
.prog-row{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(80px,30%) 76px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.prog-row .rk{font:600 11px var(--f-mono);color:var(--muted)}
.prog-row .nm{min-width:0;font-weight:600;font-size:14px}
.prog-row .nm small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.prog-row .bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.prog-row .bar i{display:block;height:100%;background:var(--accent)}
.prog-row .q{text-align:right;font-variant-numeric:tabular-nums;font-weight:800}
.prog-row .q small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.pending{display:flex;gap:14px;align-items:center;padding:18px 22px;margin-bottom:20px;border-style:dashed;box-shadow:none}
.pending b{display:block;font-size:15px}
.pending span{color:var(--muted);font-size:13.5px}
@media(max-width:560px){.prog-row{grid-template-columns:22px minmax(0,1fr) 64px}.prog-row .bar{grid-column:2/4;grid-row:2}}
.chap .cq{font-size:11px;opacity:.75}
.chap[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.chap[aria-pressed="true"] .cn{background:var(--accent);color:var(--accent-ink);border-radius:6px;text-align:center;padding:3px 0}
.chip{border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--muted)}
.chip:hover{color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.chip .n{font-family:var(--f-mono);font-size:11px;opacity:.7;margin-left:4px}
.num-in{width:84px;border:1px solid var(--line-2);background:var(--surface-2);border-radius:10px;padding:7px 10px;font:600 14px var(--f-mono);color:var(--fg)}
.scale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);margin:0}

.hist{padding:24px}
.hist-empty{color:var(--muted);font-size:14px;border:1px dashed var(--line-2);border-radius:12px;padding:18px;text-align:center}
.hist-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.hist-stats div{background:var(--surface-2);border-radius:12px;padding:12px}
.hist-stats b{display:block;font-family:var(--f-display);font-size:28px;font-weight:400;line-height:1}
.hist-stats span{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.table-scroll{overflow-x:auto;max-height:420px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:700;padding:8px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
td{padding:10px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
td.sc{font-weight:800}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700}
.pill.g{background:var(--good-bg);color:var(--good)} .pill.m{background:var(--accent-soft);color:var(--accent)} .pill.r{background:var(--bad-bg);color:var(--bad)}

/* Quiz */
.quiz{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media(min-width:1000px){.quiz{grid-template-columns:minmax(0,1fr) 320px;align-items:start}
  .navp{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh,140px) + 16px);max-height:calc(100vh - var(--hh,140px) - 40px);display:flex;flex-direction:column}}
.qcard{padding:clamp(18px,3vw,32px);min-width:0;scroll-margin-top:calc(var(--hh,140px) + 12px)}
.qmeta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:14px}
.qnum{font-family:var(--f-display);font-size:22px;line-height:1}
.qnum small{color:var(--muted);font-size:16px}
.tag{font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.review-banner{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:4px 10px}
.stem{font-size:clamp(17px,2vw,20px);font-weight:600;line-height:1.5;margin-bottom:20px;max-width:72ch}
.stem p{margin:0 0 .6em}
.stem ul{margin:.2em 0 .7em;padding-left:1.3em}
.stem img{border-radius:10px;border:1px solid var(--line);background:#fff;margin:6px 0}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:36px minmax(0,1fr) 24px;gap:14px;align-items:center;text-align:left;border:1px solid var(--line-2);background:var(--surface-2);border-radius:14px;padding:12px 14px;transition:border-color .15s,background .15s,transform .15s}
.opt:hover:not(:disabled){border-color:var(--accent);transform:translateX(2px)}
.opt:disabled{cursor:default}
.opt .L{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font:700 14px var(--f-mono);background:var(--surface);border:1px solid var(--line-2)}
.opt .T{min-width:0;font-size:15px}
.opt .orig{display:block;font:600 10.5px var(--f-mono);color:var(--muted);margin-top:3px;letter-spacing:.04em}
.stem p.rom{margin:0 0 .35em;font-weight:500}
.stem p.rom b{font-family:var(--f-mono);font-size:.85em;color:var(--accent);margin-right:6px}
.opt .ico{font-weight:800;font-size:16px;text-align:center}
.opt.ok{border-color:var(--good-line);background:var(--good-bg)}
.opt.ok .L{background:var(--good);color:#fff;border-color:var(--good)}
.opt.ok .ico{color:var(--good)}
.opt.ko{border-color:var(--bad-line);background:var(--bad-bg)}
.opt.ko .L{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.ko .ico{color:var(--bad)}
.opt.dim{opacity:.55}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.opt.ko.anim{animation:shake .3s}
.expl{margin-top:22px;border-top:1px solid var(--line);padding-top:18px}
.verdict{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;margin-bottom:10px}
.verdict.g{color:var(--good)} .verdict.r{color:var(--bad)}
.ans-line{font-size:14px;margin:0 0 12px}
.ans-line strong{color:var(--good)}
.expl h4{margin:0 0 6px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.expl-body{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:14.5px;max-width:78ch}
.expl-body p{margin:0 0 .65em} .expl-body p:last-child{margin-bottom:0}
.expl-body .none{color:var(--muted);font-style:italic}
.qfoot{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap;align-items:center}
.qfoot .sp{flex:1}
.kbd{font-size:11.5px;color:var(--muted)}
@media(max-width:640px){.kbd{display:none}}

.navp{padding:18px;min-width:0}
.navp-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px}
.navp-head h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:24px}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--muted);margin-bottom:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line-2)}
.legend .g i{background:var(--good);border-color:var(--good)} .legend .r i{background:var(--bad);border-color:var(--bad)}
.navp .chips{margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;overflow-y:auto;padding:2px;min-height:0}
@media(max-width:999px){.grid{max-height:340px}}
.cell{height:36px;border-radius:9px;border:1px solid var(--line-2);background:transparent;font:600 12px var(--f-mono);color:var(--muted);padding:0}
.cell:hover{border-color:var(--accent);color:var(--fg)}
.cell.g{background:var(--good);border-color:var(--good);color:#fff}
.cell.r{background:var(--bad);border-color:var(--bad);color:#fff}
.cell.cur{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent);color:var(--fg)}
.cell.g.cur,.cell.r.cur{color:#fff}
.navp .finish{margin-top:14px;width:100%}
.empty-filter{font-size:13px;color:var(--muted);padding:10px 0}

/* Mocks */
.mock-opts{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:16px 20px;margin-bottom:14px;box-shadow:none}
.mock-opts .hint{margin:4px 0 0}
.mock-opts .chip[aria-pressed="true"]::before{content:"✓ ";color:var(--accent)}
.mocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:20px}
.mock{padding:20px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.mock.live{border-color:color-mix(in srgb,var(--accent) 60%,var(--line))}
.mock-n{font-family:var(--f-display);font-size:64px;line-height:.8;color:var(--accent)}
.mock-t{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.mock h3{margin:0;font-size:16px}
.mock .sub{font-size:12px;color:var(--muted)}
.mock dl{display:grid;gap:4px;margin:0}
.mock dl div{background:var(--surface-2);border-radius:8px;padding:6px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mock dt{font-size:10px;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;color:var(--muted)}
.mock dd{margin:0;font-weight:800;font-variant-numeric:tabular-nums}
.mock .btn{width:100%;margin-top:auto}
.mock .lock{font-size:11.5px;color:var(--muted);text-align:center;margin:-6px 0 0}
.status{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 9px;white-space:nowrap}
.status.live{background:var(--accent-soft);color:var(--accent)}
.status.done{background:var(--good-bg);color:var(--good)}
.status.new{background:var(--surface-2);color:var(--muted)}
.mock .mini{height:4px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.mock .mini i{display:block;height:100%;background:var(--accent)}

/* Results */
.results{padding:clamp(22px,4vw,40px);display:grid;gap:22px;max-width:880px;margin:0 auto}
.res-top{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.ring{width:150px;height:150px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:44px}
.res-top h2{font-family:var(--f-display);font-weight:400;font-size:clamp(32px,5vw,46px);margin:4px 0 6px;line-height:1}
.res-top p{margin:0;color:var(--muted)}
.res-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.res-stats div{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:14px}
.res-stats b{display:block;font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.05}
.res-stats span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.res-acts{display:flex;gap:10px;flex-wrap:wrap}
.saved{font-size:13px;color:var(--good);font-weight:700}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(5,8,14,.6);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:50;padding:16px}
.modal{max-width:440px;width:100%;padding:24px}
.modal h3{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0 0 8px;line-height:1.1}
.modal p{color:var(--muted);margin:0 0 20px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:760px){.tabs{order:3;flex:1 1 100%;margin-left:0}.tab{flex:1}.gauge{order:4}}

  .icon-btn span,.sync span{display:none}.icon-btn{padding:0 10px}.top-row{padding-block:10px;gap:10px}.brand b{font-size:22px}

<script type="application/json" id="qdata">[{"s":1,"n":1,"id":"1002693","q":"<p>Which of the following are choices for the buyer of a futures contract:<\/p><p class=\"rom\"><b>I<\/b> Hold the future to expiry and then take delivery of the underlying<\/p><p class=\"rom\"><b>II<\/b> Abandon the future<\/p><p class=\"rom\"><b>III<\/b> Sell the future before expiry<\/p><p class=\"rom\"><b>IV<\/b> Exercise the future against the seller<\/p>","o":[{"l":"A","h":"I and II"},{"l":"B","h":"III and IV"},{"l":"C","h":"I and III"},{"l":"D","h":"II and IV"}],"a":"C","e":"<p>The buyer of a future has two choices: hold to expiry or 'close-out' the contract.<\/p>"},{"s":1,"n":2,"id":"1015759","q":"<p>An investor buys 300 BP 430p call options at 15p. What will be the premium paid, assuming a contract size of 1,000 shares?<\/p>","o":[{"l":"A","h":"£45"},{"l":"B","h":"£4,500"},{"l":"C","h":"£45,000"},{"l":"D","h":"£64,500"}],"a":"C","e":"<p>Total premium paid = premium x contract size x no. of contracts:<br/> = 15p x 1,000 x 300 = £45,000<\/p>"},{"s":1,"n":3,"id":"1002715","q":"<p>Which of the following is true of a call option?<\/p>","o":[{"l":"A","h":"The buyer receives a premium"},{"l":"B","h":"It is used to hedge a short underlying position"},{"l":"C","h":"The holder expects the underlying value to fall"},{"l":"D","h":"There is no limit to the potential downside loss for the holder"}],"a":"B","e":"<p>A short underlying position is the need to buy something in the future. The risk here is that prices will rise. A call option (which gives the right to buy at a particular price) removes these risks.<\/p>"},{"s":1,"n":4,"id":"1017020","q":"<p>Which of the following best describes how easy it is for a trader to open or close a position without incurring excessive trading costs?<\/p>","o":[{"l":"A","h":"Liquidity"},{"l":"B","h":"Basis"},{"l":"C","h":"Trade/Cost profile"},{"l":"D","h":"Gearing"}],"a":"A","e":"<p>Liquidity is a term used to describe how easy it is to trade without incurring excessive trading costs.<\/p>"},{"s":1,"n":5,"id":"1002694","q":"<p>Which of the following is not true with regard to futures?<\/p>","o":[{"l":"A","h":"The choices for the seller of a future are to hold to delivery or close-out their position"},{"l":"B","h":"One participant's profit in a futures market must come from another participant's loss"},{"l":"C","h":"A short-futures position is closed-out by selling a future"},{"l":"D","h":"A person who is holding the underlying asset would use a short hedge to reduce risk of a fall in prices"}],"a":"C","e":"<p>A short-futures position is closed-out by buying a future.<\/p>"},{"s":1,"n":6,"id":"1036741","q":"<p>How would you describe the risk associated with buying a futures contract?<\/p>","o":[{"l":"A","h":"Unlimited"},{"l":"B","h":"Limited to initial margin"},{"l":"C","h":"Limited to the value of the underlying"},{"l":"D","h":"Limited to the futures price"}],"a":"D","e":"<p>When entering into a futures contract, the potential downside, although large, is limited to the futures price. You could take delivery of an underlying asset worth nothing, and still be contractually bound to pay the futures price.<\/p>"},{"s":1,"n":7,"id":"1036875","q":"<p>A currency trader anticipates yen will strengthen against the US dollar. Which of the following should he choose?<\/p>","o":[{"l":"A","h":"Buy a yen put"},{"l":"B","h":"Sell a yen put"},{"l":"C","h":"Buy a yen call"},{"l":"D","h":"Sell a yen call"}],"a":"C","e":"<p>If we expect the yen to strengthen against the dollar then the yen is RISING in value against the dollar. Investors should therefore buy a yen call option, which will make profits in a rising yen market.<\/p>"},{"s":1,"n":8,"id":"1055228","q":"<p>Which statement would be correct if current share price is 95?<\/p><p><img src=\"data:image/gif;base64,R0lGODdh4AHwAHcAACH+GlNvZnR3YXJlOiBNaWNyb3NvZnQgT2ZmaWNlACwAAAAA4AHwAIf///97e3vm7+Zzc3OMjJTW3t6EhHulpZzWztYQEFo6GVJaQnuElFpSY2OMjIzFY0JKGRBKSs5CKWMZ72OMKd4ZrWOMKZyU3r1SCN6MS 6.3in;height:3.14444in\"/><\/p>","o":[{"l":"A","h":"The put would be out-of-the-money"},{"l":"B","h":"The call would be in-the-money"},{"l":"C","h":"The put would be in-the-money"},{"l":"D","h":"The call would be out-of-the-money"}],"a":"B","e":"<p>This is the profit/loss of the writer of a call option. The writer's maximum gain is crystallised at 80 showing that this is the option strike. This means that the holder of the option would have the right to buy at 80 when the market is 95 meaning the call option is in-the-money.<\/p>"},{"s":1,"n":9,"id":"1017378","q":"<p>A Japanese investor has substantial Sterling assets and uses Sterling currency futures to offset his risk. This trade is known as:<\/p>","o":[{"l":"A","h":"Arbitrage"},{"l":"B","h":"Hedging"},{"l":"C","h":"Speculation"},{"l":"D","h":"Basis swap"}],"a":"B","e":"<p>This is a description of hedging where an investor takes an opposite position in the derivatives market to his position in the cash market.<\/p>"},{"s":1,"n":10,"id":"1002697","q":"<p>Which of the following represents the best hedge if a fund manager holds a portfolio of gilts?<\/p>","o":[{"l":"A","h":"Buy long gilt futures"},{"l":"B","h":"Sell long gilt futures"},{"l":"C","h":"Buy long gilt call options"},{"l":"D","h":"Sell long gilt put options"}],"a":"B","e":"<p>The manager needs a contract that protects them if prices fall. Selling long gilt futures will achieve this.<\/p>"},{"s":1,"n":11,"id":"1037052","q":"<p>Which profile best fits a short put position?<\/p>","o":[{"l":"A","h":"Bullish, maximum gain is unlimited, maximum loss is the premium"},{"l":"B","h":"Bearish, maximum gain is the premium, maximum loss is unlimited"},{"l":"C","h":"Bearish, maximum gain is strike minus premium, maximum loss is the premium"},{"l":"D","h":"Bullish, maximum gain is the premium, maximum loss is strike minus premium"}],"a":"D","e":"<p>Remember that:<br/> 1. The maximum gain for the short is always the premium.<br/> 2. A short put is bullish and a short call is bearish.<\/p>"},{"s":1,"n":12,"id":"1014208","q":"<p>If you bought a December gilt call option with a strike price of 103.75 for 10 pence, at which underlying price would you NOT exercise?<\/p>","o":[{"l":"A","h":"104.00"},{"l":"B","h":"103.90"},{"l":"C","h":"103.80"},{"l":"D","h":"103.70"}],"a":"D","e":"<p>At 103.70, the option has no intrinsic value, therefore you would not exercise it. At 103.80, even though you have not broken even, you would still exercise as you would lose less money than if you did not exercise (5 pence v the whole 10 pence premium).<\/p>"},{"s":1,"n":13,"id":"1014209","q":"<p>Which of the following is NOT a contingent liability transaction?<\/p>","o":[{"l":"A","h":"Buying an option"},{"l":"B","h":"Selling an option"},{"l":"C","h":"Buying a future"},{"l":"D","h":"Selling a future"}],"a":"A","e":"<p>Buying an option is not a contingent liability transaction as the holder of an option can lose no more than the premium.<\/p>"},{"s":1,"n":14,"id":"1036824","q":"<p>An agreement to buy a specified quantity of a specified asset on a specified future date best describes:<\/p>","o":[{"l":"A","h":"A long call"},{"l":"B","h":"A long futures position"},{"l":"C","h":"A short call"},{"l":"D","h":"A short futures position"}],"a":"B","e":"<p>A futures contract is an obligation, not a choice. The buyer in a futures contract holds a long position (and is described as 'the long').<\/p>"},{"s":1,"n":15,"id":"1002724","q":"<p>What position will the writer of a call on a future be in if the option is exercised?<\/p>","o":[{"l":"A","h":"Delivery of the underlying asset"},{"l":"B","h":"Long-future"},{"l":"C","h":"Short-future"},{"l":"D","h":"Short-put"}],"a":"C","e":"<p>This is not an option on an underlying asset, but an option on a future<\/p><p>Selling the right to buy a future will leave the writer of the option delivering the futures contract if the option is exercised against them.<\/p><p>If the option is exercised, then it will settle into a futures position. A bullish position in the options market (for example a long call) would settle into a bullish position in the futures market (long future), whereas a bearish position in the options market (for example a short call, as in this question) would settle into a bearish position in the futures market (short future)<\/p>"},{"s":1,"n":16,"id":"1065122","q":"<p>A UK fund manager wishes to hedge against adverse price movements in the assets held in her portfolio. Which of the following would she do?<\/p>","o":[{"l":"A","h":"Sell futures"},{"l":"B","h":"Buy calls"},{"l":"C","h":"Sell puts"},{"l":"D","h":"Sell calls"}],"a":"A","e":"<p>When holding assets, an adverse price movement would be a fall in the asset price. To hedge out this risk, short futures positions should be taken.<\/p>"},{"s":1,"n":17,"id":"1002871","q":"<p>A US exporter has made a sale of goods worth €1.5m to Germany. How could it hedge its exposure to exchange rate fluctuations before the money is received?<\/p><p class=\"rom\"><b>I<\/b> Buy euro futures<\/p><p class=\"rom\"><b>II<\/b> Sell euro futures<\/p><p class=\"rom\"><b>III<\/b> Buy euro calls<\/p><p class=\"rom\"><b>IV<\/b> Buy euro puts<\/p>","o":[{"l":"A","h":"I and II"},{"l":"B","h":"II and III"},{"l":"C","h":"III and IV"},{"l":"D","h":"II and IV"}],"a":"D","e":"<p>The exporter is long euros in the cash market; it needs, therefore, either to sell futures or buy puts.<\/p>"},{"s":1,"n":18,"id":"1002690","q":"<p>All futures transactions are:<\/p>","o":[{"l":"A","h":"Contingent bargains"},{"l":"B","h":"Exercised at the option of the long"},{"l":"C","h":"Contingent liability transactions"},{"l":"D","h":"Exercised at the option of the short"}],"a":"C","e":"<p>A contingent liability transaction is where the investor may lose money over and above the amount originally invested.<\/p>"},{"s":1,"n":19,"id":"1055227","q":"<p>Which statement would be correct if current share price is 85?<\/p><p><img src=\"data:image/gif;base64,R0lGODdh4AHwAHcAACH+GlNvZnR /KyHeOJIiqxaWswX9k7VXi4Sh47hZ17hZC7kDMrmWK7mY+7iXq7mZG7mS2rZjc2q8wbIJUAB+sgUKoLio+yqs27qu+7qwG7uyO7u0W7uzi7qmywT44I0ddrhrcUCLsB4mgA8mMLzGe7zEi7zFm7zMu7zOq7zQ27zR+7zSW73Ue70msAjJawK64I3geLNw/4FM4aFM4ytLhXS+92e+5nt/7Bty7tu+6Ru/6Hu+6gu/9Cu/9lu/8yu/5htyJpszgQqz0zGFAoxDiUOhBUwcOprAUZR+vsvAcNEuEMwceDPBDYwb4GvBEZw4BKTBCgysHpxEruFhIZxEq5LBJbwWrJrCtLHALLxCufrCs0HAMrxGjlrDNpymOJwaAmQoOzxJ1vfDoiFFSCrEhxE4RqwZffbASdwVNNzEkFHBUAwZLjzFhXEvCGzFe7F0CqvFdKF2nurFdZFFYmwYUlzGfFHFaHwXRBybazwWF4vCb0wVnMLEcwwVOXvHdxHAevzFQdzHdtFnRQzIbfHEhCwXdXzIfkZ8woo8F9zTyHIRD/0QAPjQD3IMyUkBA4EhGAaHyZ78yaAcyqI8yqRcyqZ8yqicyqqMqKvcyq78yrAcy7L8N/87y7ZMFAEBADs=\" style=\"width:6.3in;height:3.14444in\"/><\/p>","o":[{"l":"A","h":"A put would be out-of-the-money"},{"l":"B","h":"A call would be in-the-money"},{"l":"C","h":"A put would be in-the-money"},{"l":"D","h":"A call would be out-of-the-money"}],"a":"C","e":"<p>This is the profit/ loss of the holder of a put option. The holder's maximum loss is crystallised at 90 showing that this is the option strike. This means that the holder of the option would have the right to sell at 90 when the market is 85 meaning the holders option would be in-the-money.<\/p>"},{"s":1,"n":20,"id":"1002730","q":"<p>In a standardised option contract, which of the following is not fixed in advance?<\/p>","o":[{"l":"A","h":"Expiry"},{"l":"B","h":"Strike"},{"l":"C","h":"Premium"},{"l":"D","h":"Security"}],"a":"C","e":"<p>In a standardised options contract, it is the premium that is not fixed in advance.<\/p>"},{"s":1,"n":21,"id":"1002714","q":"<p>A long-put option position has potential for:<\/p>","o":[{"l":"A","h":"Unlimited profit and unlimited loss"},{"l":"B","h":"Limited profit and limited loss"},{"l":"C","h":"Unlimited profit and limited loss"},{"l":"D","h":"Losses limited to strike price plus premium"}],"a":"B","e":"<p>A put option is the right to sell. The owner of a put option will not exercise if the share price at maturity is higher than the strike price. If this is the case, the option will be abandoned and only the premium is lost: i.e. limited losses. If the share price falls BELOW the exercise price, the holder will exercise and take a profit (the lower the share price the bigger the profit). There is a limit on the profit as the share price can fall no lower than zero.<\/p>"},{"s":1,"n":22,"id":"1040401","q":"<p>Which ONE of the following is an example of speculative activity?<\/p>","o":[{"l":"A","h":"An investor who is long a tin futures contract and expects the price to fall going short a tin future"},{"l":"B","h":"A tin mining company which expects the price of tin to fall, selling futures"},{"l":"C","h":"An investor selling tin in the cash market and buying a future"},{"l":"D","h":"An investor who expects the price of tin to fall, writing naked call options"}],"a":"D","e":"<p>D is an example of speculative activity.<br/> All the other examples are either hedging or arbitrage.<\/p>"},{"s":1,"n":23,"id":"1069786","q":"<p>Which of the below represents a buy side firm?<\/p>","o":[{"l":"A","h":"Hedge funds"},{"l":"B","h":"Brokerage firms"},{"l":"C","h":"Investment banks"},{"l":"D","h":"Research Providers"}],"a":"A","e":"<p>Other major examples of buy side firms include Mutual funds, pension funds, private equity funds, trusts, insurance companies and propriety traders. <br/> The incorrect answers represent the sell side.<\/p>"},{"s":1,"n":24,"id":"1037357","q":"<p>What is a future?<\/p>","o":[{"l":"A","h":"An agreement to buy an asset at a certain time in the future for a certain price"},{"l":"B","h":"An agreement to sell an asset at a certain time in the future for a certain price"},{"l":"C","h":"An agreement to buy or sell an asset at a certain time in the future for a certain price"},{"l":"D","h":"An agreement to buy or sell an asset now for a certain price"}],"a":"C","e":"<p>A future is an agreement to buy or sell an asset at a certain time in the future for a certain price.<\/p>"},{"s":1,"n":25,"id":"1015794","q":"<p>Which of the following is NOT true of a put contract?<\/p>","o":[{"l":"A","h":"The holder has the right to sell a specified quantity of a specified asset at a given price"},{"l":"B","h":"If the option is exercised, the writer will buy a specified quantity of a specified asset at a given price"},{"l":"C","h":"The writer can choose not to buy the specified asset"},{"l":"D","h":"A put with a strike price below the price of the underlying has no intrinsic value"}],"a":"C","e":"<p>The holder of a put contract (long-put) has the right, but not the obligation, to sell the asset at the strike price. The writer must buy the asset if the contract is exercised - therefore 'the writer can choose not to buy the specified asset' is the correct answer.<\/p>"},{"s":1,"n":26,"id":"1036842","q":"<p>Which of the following is true of a call option?<\/p>","o":[{"l":"A","h":"The buyer receives a premium"},{"l":"B","h":"It is used to hedge a short underlying position"},{"l":"C","h":"The holder expects the underlying value to fall"},{"l":"D","h":"There is no limit to the potential downside loss for the holder"}],"a":"B","e":"<p>A short underlying position is the need to buy something in the future. The risk here is that prices will rise. A call option (which gives the right to buy at a particular price) removes these risks.<\/p>"},{"s":1,"n":27,"id":"1002732","q":"<p>An investor currently holds a 900 strike call option for which he paid 65p. The underlying stands at 950 and the current premium is 85p. What is the investor's maximum loss?<\/p>","o":[{"l":"A","h":"65p"},{"l":"B","h":"85p"},{"l":"C","h":"50p"},{"l":"D","h":"900p"}],"a":"A","e":"<p>The maximum loss is the premium paid for the option originally.<\/p>"},{"s":1,"n":28,"id":"1002718","q":"<p>Which profile best fits a short-put position?<\/p>","o":[{"l":"A","h":"Bullish: maximum gain is unlimited, maximum loss is the premium"},{"l":"B","h":"Bearish: maximum gain is the premium, maximum loss is unlimited"},{"l":"C","h":"Bearish: maximum gain is strike minus premium, maximum loss is the premium"},{"l":"D","h":"Bullish: maximum gain is the premium, maximum loss is strike minus premium"}],"a":"D","e":"<p>Remember that:<br/> 1. The maximum gain for the short is always the premium.<br/> 2. A short-put is bullish and a short-call is bearish.<\/p>"},{"s":1,"n":29,"id":"1002731","q":"<p>Which of the following features of an exchange traded option is negotiable?<\/p>","o":[{"l":"A","h":"Premium"},{"l":"B","h":"Exercise price"},{"l":"C","h":"Expiry"},{"l":"D","h":"Underlying instrument"}],"a":"A","e":"<p>The exercise price, expiry date and underlying instrument of an exchange-traded option are standardised by the exchange and will not change during the life of the contract. The premium or price of an option will change moment by moment and can be negotiated between the buyer and the seller of the option when an option is bought or sold.<\/p>"},{"s":1,"n":30,"id":"1015737","q":"<p>Which of the following best describes an equity hedge?<\/p>","o":[{"l":"A","h":"Buy equity call options to increase exposure to the equity market"},{"l":"B","h":"Take the same position in your equity futures as the one you hold in the underlying asset"},{"l":"C","h":"Sell an equity future to benefit from an expected fall in the market"},{"l":"D","h":"Take the opposite position in your equity futures to the one you hold in equity itself"}],"a":"D","e":"<p>The futures position would need to offset the position you have in the equity: i.e. if you hold equity, sell futures. This is sometimes known as an equity hedge.<\/p>"},{"s":1,"n":31,"id":"1067995","q":"<p>There are three market participants for a particular futures contract, Angie, John and Jake. At the end of the day of trading in the futures market, there are no more open positions, i.e. everyone has closed out. If Angie and John have a total loss of £3000, what profit/loss does Jake have?<\/p>","o":[{"l":"A","h":"Loss of £3000"},{"l":"B","h":"Loss of £2000"},{"l":"C","h":"Profit of £3000"},{"l":"D","h":"Profit of £2000"}],"a":"C","e":"<p>Derivatives are a zero sum game. This means all the profits being made should be equal to all the losses being made regardless of how many people involved.<\/p>"},{"s":1,"n":32,"id":"1037031","q":"<p>Which of the following is true of a European style call option?<\/p>","o":[{"l":"A","h":"The buyer has the right to buy the underlying up to the maturity date"},{"l":"B","h":"The seller may be obliged to sell the underlying only at maturity"},{"l":"C","h":"The seller is obliged to buy the underlying only at maturity"},{"l":"D","h":"The buyer will exercise the option as soon as it is in-the-money"}],"a":"B","e":"<p>The answer in A describes an American style option. European options may be exercised on their expiry dates only. Consequently, the seller will be obliged to deliver the underlying asset if the holder exercises their right to buy on that date.<\/p>"},{"s":1,"n":33,"id":"1002728","q":"<p>The exercise price of a traded option is:<\/p>","o":[{"l":"A","h":"The amount the buyer of the option must pay the seller"},{"l":"B","h":"The difference between the price of the option and the price of the underlying"},{"l":"C","h":"The price the holder will pay or receive for the underlying if the option is exercised"},{"l":"D","h":"The value of the option relating to its remaining life"}],"a":"C","e":"<p>The exercise price, or 'strike', is the price at which the holder of an option has the right to buy (call) or sell (put).<\/p>"},{"s":1,"n":34,"id":"1002717","q":"<p>The features of a long-call option are:<\/p>","o":[{"l":"A","h":"Unlimited profit and unlimited loss"},{"l":"B","h":"Limited losses with unlimited profits"},{"l":"C","h":"Unlimited losses and limited profits"},{"l":"D","h":"Limited losses and limited profits"}],"a":"B","e":"<p>The holder of a long-call can only lose the premium, but potential profits are unlimited.<\/p>"},{"s":1,"n":35,"id":"1002689","q":"<p>How would you describe the risk associated with buying a futures contract?<\/p>","o":[{"l":"A","h":"Unlimited"},{"l":"B","h":"Limited to initial margin"},{"l":"C","h":"Limited to the value of the underlying"},{"l":"D","h":"Limited to the future's price"}],"a":"D","e":"<p>When entering into a futures contract, the potential downside, although large, is limited to the futures price. You could take delivery of an underlying asset worth nothing and still be contractually bound to pay the future's price.<\/p>"},{"s":1,"n":36,"id":"1002723","q":"<p>Which of the following best describes an American option?<\/p>","o":[{"l":"A","h":"An option exercisable at any time up to its expiry date"},{"l":"B","h":"An option on a US stock or bond"},{"l":"C","h":"An option exercised only at expiry"},{"l":"D","h":"An option traded on US exchanges"}],"a":"A","e":"<p>There is no geographical significance given to American (style) options. It simply refers to the fact that they can be exercised at any time, up to and including the expiry date. European style options, on the other hand, can be exercised on their expiry dates only.<\/p>"},{"s":1,"n":37,"id":"1002695","q":"<p>Which of the following best describes hedging?<\/p>","o":[{"l":"A","h":"Taking an opposite position in futures to your position in the underlying asset"},{"l":"B","h":"Buying and selling futures or options"},{"l":"C","h":"Taking a matching position in futures to your position in the underlying asset"},{"l":"D","h":"Buying futures in anticipation of a rise in the value of the underlying asset"}],"a":"A","e":"<p>Hedging requires adopting a position in the derivatives market that will generate a profit if the underlying position makes a loss. If you own wheat (long underlying) and are worried about the price falling, a short-futures position would profit from a fall in the underlying price to compensate for your losses.<\/p>"},{"s":1,"n":38,"id":"1040405","q":"<p>An exchange-traded option with non-standardised terms, which is centrally-cleared, is which type of option?<\/p>","o":[{"l":"A","h":"A swap option"},{"l":"B","h":"A FLEX option"},{"l":"C","h":"An OTC option"},{"l":"D","h":"An OTM option"}],"a":"B","e":"<p>This describes a flex option where the terms, such as maturity etc… are not standardised<\/p>"},{"s":1,"n":39,"id":"1002692","q":"<p>An agreement to buy a specified quantity of a specified asset on a specified future date best describes:<\/p>","o":[{"l":"A","h":"A long-call"},{"l":"B","h":"A long-futures position"},{"l":"C","h":"A short-call"},{"l":"D","h":"A short-futures position"}],"a":"B","e":"<p>A futures contract is an obligation, not a choice. The buyer in a futures contract holds a long-position (and is described as 'the long').<\/p>"},{"s":1,"n":40,"id":"1002688","q":"<p>The maximum risk from a short futures position is:<\/p>","o":[{"l":"A","h":"Unlimited"},{"l":"B","h":"Limited to the initial margin"},{"l":"C","h":"Limited to the value of the future"},{"l":"D","h":"Limited as the market will not fall below zero"}],"a":"A","e":"<p>If a future is sold at $50.00, the seller is obliged to make delivery of the underlying at $50.00. If at delivery the price of the underlying was zero, the PROFIT would be the futures price: i.e. $50.00. However, because there is no limit to how high the underlying's price can rise, the maximum loss on a short-futures position is unlimited.<\/p>"},{"s":1,"n":41,"id":"1017381","q":"<p>An equity manager wishing to gain exposure to equity in advance of a cash inflow from a client would do which of the following?<\/p>","o":[{"l":"A","h":"Buy a FTSE100 index put option"},{"l":"B","h":"Sell a FTSE100 index call option"},{"l":"C","h":"Buy a FTSE100 index call option"},{"l":"D","h":"Sell a FTSE100 index future"}],"a":"C","e":"<p>An equity manager would be concerned about equity prices rising before they receive the cash inflow, therefore they would buy a call option to benefit from an increase in prices and to offset any higher equity prices.<\/p>"},{"s":1,"n":42,"id":"1037474","q":"<p>All of the following are determined by the exchange in relation to contract specifications on options, except:<\/p>","o":[{"l":"A","h":"Expiry date"},{"l":"B","h":"Strike price"},{"l":"C","h":"Size of contract"},{"l":"D","h":"Premium"}],"a":"D","e":"<p>The premium is determined by the market.<\/p>"},{"s":1,"n":43,"id":"1002691","q":"<p>Which of the following best describes a future?<\/p>","o":[{"l":"A","h":"An obligation to buy a given quantity of an asset at a range of prices on a pre-determined date"},{"l":"B","h":"The right to buy or sell a standard quantity of a specified asset on a fixed future date at a price agreed today"},{"l":"C","h":"An agreement to buy or sell a specified quantity of a specified asset on or before a fixed future date at a price agreed today"},{"l":"D","h":"An agreement to buy or sell a specified quantity of a specified asset on a fixed future date at a price agreed today"}],"a":"D","e":"<p>An agreement to buy or sell a specified quantity of a specified asset on a fixed future date at a price agreed today.<\/p>"},{"s":1,"n":44,"id":"1044986","q":"<p>Which of the following would describe liquid markets?<\/p>","o":[{"l":"A","h":"Low supply, low price elasticity"},{"l":"B","h":"Low supply, high price elasticity"},{"l":"C","h":"High supply, low price elasticity"},{"l":"D","h":"High supply, high price elasticity"}],"a":"C","e":"<p>In liquid markets, there is plenty of supply in the underlying and many buyers and sellers for the contracts. This will lead to low price elasticity; the price is not dramatically affected by relatively minor shifts in demand.<\/p>"},{"s":1,"n":45,"id":"1069787","q":"<p>Out of the examples listed below, indicate those firms that are considered sell side:<\/p><p class=\"rom\"><b>I<\/b> Mutual funds<\/p><p class=\"rom\"><b>II<\/b> Insurance companies<\/p><p class=\"rom\"><b>III<\/b> Investment Banks<\/p><p class=\"rom\"><b>IV<\/b> Brokerage<\/p>","o":[{"l":"A","h":"All of the above"},{"l":"B","h":"I and II"},{"l":"C","h":"III and IV"},{"l":"D","h":"None of the above"}],"a":"C","e":"<p>The sell side is made up of brokerage firms, investment banks and other entities that make buy/<br/> sell recommendations, upgrades, downgrades, target prices and research opinions investors can use to make investing decisions.<\/p>"},{"s":1,"n":46,"id":"1002716","q":"<p>Which of the following choices are available to the writer of a traded option?<\/p><p class=\"rom\"><b>I<\/b> Exercise the option when it is in the money<\/p><p class=\"rom\"><b>II<\/b> To trade out the option by closing their position<\/p><p class=\"rom\"><b>III<\/b> Let the option lapse when they do not wish to exercise<\/p><p class=\"rom\"><b>IV<\/b> Keep the premium if the option is not exercised<\/p>","o":[{"l":"A","h":"I and III"},{"l":"B","h":"II and IV"},{"l":"C","h":"I and II"},{"l":"D","h":"III and IV"}],"a":"B","e":"<p>The writer of an option has received a premium. It is the holder who has all the choices and the writer must honour the terms of the option if the holder exercises the option.<\/p>"},{"s":1,"n":47,"id":"1002727","q":"<p>Which of the following best describes a call option?<\/p>","o":[{"l":"A","h":"The right to sell an underlying asset at an agreed price on a future date"},{"l":"B","h":"The obligation to sell an underlying asset at an agreed price on a future date"},{"l":"C","h":"The right to buy an underlying asset at an agreed price on a future date"},{"l":"D","h":"The obligation to buy an underlying asset at an agreed price on a future date"}],"a":"C","e":"<p>An option is a right, not an obligation. A call is the right to buy.<\/p>"},{"s":1,"n":48,"id":"1002696","q":"<p>Which of the following are uses of futures?<\/p><p class=\"rom\"><b>I<\/b> Arbitrage<\/p><p class=\"rom\"><b>II<\/b> Speculation<\/p><p class=\"rom\"><b>III<\/b> Hedging<\/p><p class=\"rom\"><b>IV<\/b> Cash and carry<\/p>","o":[{"l":"A","h":"I and IV"},{"l":"B","h":"I and III"},{"l":"C","h":"I and II"},{"l":"D","h":"I, II, III, IV"}],"a":"D","e":"<p>Cash and carry is a way of using futures to take advantage of arbitrage opportunities.<\/p>"},{"s":1,"n":49,"id":"1036758","q":"<p>What is the maximum loss for the writer of a put option?<\/p>","o":[{"l":"A","h":"Unlimited"},{"l":"B","h":"Strike minus premium"},{"l":"C","h":"Strike plus premium"},{"l":"D","h":"Premium only"}],"a":"B","e":"<p>Note: the maximum loss a BUYER of an option can incur is the premium only.<\/p>"},{"s":1,"n":50,"id":"1036959","q":"<p>An investor wishes to speculate on the US dollar strengthening against the euro. Which of the following strategies would she adopt?<\/p>","o":[{"l":"A","h":"Go long Eurodollar calls"},{"l":"B","h":"Go long Euribor puts"},{"l":"C","h":"Go short Euro futures"},{"l":"D","h":"Go long Euro futures"}],"a":"C","e":"<p>If the USD were to strengthen, the euro would fall in value making the short euro futures position profitable. eurodollar options are options on eurodollar interest rates and euribor options are options on the euribor interest rate.<\/p>"},{"s":1,"n":51,"id":"1002722","q":"<p>Which of the following is true of a European call option?<\/p>","o":[{"l":"A","h":"The buyer has the right to buy the underlying up to the maturity date"},{"l":"B","h":"The seller is obliged to sell the underlying only at maturity if the buyer exercises"},{"l":"C","h":"The seller is obliged to buy the underlying only at maturity if the buyer exercises"},{"l":"D","h":"The buyer will exercise the option when it is in-the-money before expiry"}],"a":"B","e":"<p>'The buyer has the right to buy the underlying up to the maturity date' describes an American style option. European options may be exercised on their expiry dates only. Consequently the seller will be obliged to deliver the underlying asset if the holder exercises their right to buy on that date.<\/p>"},{"s":1,"n":52,"id":"1065114","q":"<p>In the event that the option is exercised which of the following would take delivery of the asset?<\/p>","o":[{"l":"A","h":"Holder of a put"},{"l":"B","h":"Writer of a put"},{"l":"C","h":"Writer of a call"},{"l":"D","h":"Granter of a call"}],"a":"B","e":"<p>The holder/buyer/taker of a call will take delivery of the asset if the option is exercised and the writer/seller/granter of a put will take delivery if the option is exercised.<\/p>"},{"s":1,"n":53,"id":"1002725","q":"<p>Which of the following options do not give you the right to exercise?<\/p><p class=\"rom\"><b>I<\/b> Short-put<\/p><p class=\"rom\"><b>II<\/b> Long-put<\/p><p class=\"rom\"><b>III<\/b> Short-call<\/p><p class=\"rom\"><b>IV<\/b> Long-call<\/p>","o":[{"l":"A","h":"I and II"},{"l":"B","h":"II and IV"},{"l":"C","h":"I and III"},{"l":"D","h":"III and IV"}],"a":"C","e":"<p>To have the right to exercise, you must have bought (be long) an option.<\/p>"},{"s":1,"n":54,"id":"1002720","q":"<p>The maximum potential loss which could be incurred by the holder of a put option is:<\/p>","o":[{"l":"A","h":"Unlimited"},{"l":"B","h":"The exercise price plus the premium"},{"l":"C","h":"The premium for the option"},{"l":"D","h":"The exercise price minus the premium"}],"a":"C","e":"<p>The holder is the buyer of the option; their maximum loss is the premium that they have paid in return for the right to sell the underlying security.<\/p>"},{"s":1,"n":55,"id":"1079784","q":"<p>Which of the following is NOT a common form of arbitrage?<\/p>","o":[{"l":"A","h":"Intertemporal"},{"l":"B","h":"Geographic"},{"l":"C","h":"Value-chain"},{"l":"D","h":"Value-added"}],"a":"D","e":"<p>The CISI workbook lists 3 common forms of arbitrage which are:<br/> Intertemporal - when the prices between the one-month and six-month LME zinc contracts are 'out-of-line'.<br/> Geographic - as between two identical contracts across multiple exchanges; when the prices of the<br/> Singapore Exchange's June Eurodollar future is different from the CME's June contract.<br/> Value-chain - as between the prices of crude oil and refined products.<\/p>"},{"s":1,"n":56,"id":"1002721","q":"<p>Which of the following is TRUE of a call option?<\/p>","o":[{"l":"A","h":"The writer pays a premium to the holder"},{"l":"B","h":"It can be used to hedge a short underlying position"},{"l":"C","h":"The holder of a call has unlimited downside potential"},{"l":"D","h":"The writer can only lose the premium"}],"a":"B","e":"<p>'The writer pays a premium to the holder' and 'the writer can only lose the premium' are incorrect as the writer of an option receives a premium. 'The holder of a call has unlimited downside potential' is incorrect, as it is the writer, not the holder, that has unlimited downside potential. Therefore, 'it can be used to hedge a short underlying position' is the correct answer.<\/p>"},{"s":1,"n":57,"id":"1015784","q":"<p>Which two of the following are true of the impact of liquidity on transaction costs (i.e. the spread between bid and offer prices) and elasticity of prices (in comparison to volume)?<\/p>","o":[{"l":"A","h":"Greater liquidity = lower transaction costs, higher elasticity"},{"l":"B","h":"Greater liquidity = lower transaction costs, lower elasticity"},{"l":"C","h":"Greater liquidity = higher transaction costs, higher elasticity"},{"l":"D","h":"Greater liquidity = higher transaction costs, lower elasticity"}],"a":"B","e":"<p>The terminology used here is unusual but B is the best answer, as more volume would lead to a lower bid-offer spread and, therefore, make the contract less volatile and less elastic (i.e. prices would move less).<\/p>"},{"s":1,"n":58,"id":"1002729","q":"<p>European options are:<\/p>","o":[{"l":"A","h":"Options on euro denominated equities"},{"l":"B","h":"Options traded outside the country of the currency in which they are denominated"},{"l":"C","h":"Options that may be exercised on their expiry date only"},{"l":"D","h":"Options which are exercisable at a range of expiry and exercise prices"}],"a":"C","e":"<p>European options are exercised on a particular date, and American options over a range of dates.<\/p>"},{"s":2,"n":1,"id":"1015838","q":"<p>Which of the following is most likely to drive oil prices up?<\/p>","o":[{"l":"A","h":"Global economic slowdown"},{"l":"B","h":"War in the Middle East"},{"l":"C","h":"The discovery of major oil reserves in Surrey"},{"l":"D","h":"A breakthrough in renewable energy technology"}],"a":"B","e":"<p>A war would constrict supply, creating a shortage of oil and therefore higher prices.<\/p>"},{"s":2,"n":2,"id":"1002817","q":"<p>Gilts are:<\/p>","o":[{"l":"A","h":"UK government bonds"},{"l":"B","h":"Local authority bonds"},{"l":"C","h":"Blue chip equities"},{"l":"D","h":"Eurobonds"}],"a":"A","e":"<p>Because they are issued by the UK government, they are often considered zero-risk in the UK.<\/p>"},{"s":2,"n":3,"id":"1037062","q":"<p>What is represented by the yield curve?<\/p>","o":[{"l":"A","h":"The maturity range of a bond series against their respective yields"},{"l":"B","h":"The credit rating of a bond series against their respective yields"},{"l":"C","h":"The flat yield of a bond series against their redemption yields"},{"l":"D","h":"The maturity range of a bond series against their respective credit rating"}],"a":"A","e":"<p>For example - the gilt yield curve plots maturity (x-axis) against gross redemption yield (y-axis). The normal shape of the yield curve is upwards sloping, i.e. longer dated gilts have a higher yield than shorter dated gilts.<\/p>"},{"s":2,"n":4,"id":"1026876","q":"<p>If an investor expects the Japanese interest rates to rise faster than the Euro rates which spread transaction should he undertake?<\/p>","o":[{"l":"A","h":"Buy the Japanese government bond future, sell the German government bond future"},{"l":"B","h":"Sell the Japanese government bond future, sell the German government bond future"},{"l":"C","h":"Buy the Japanese government bond future, buy the German government bond future"},{"l":"D","h":"Sell the Japanese government bond future, buy the German government bond future"}],"a":"D","e":"<p>If Japanese interest rates increase at a faster rate, the JGB future will fall in value and should be sold. To achieve a spread trade, the German government bond future should be purchased.<\/p>"},{"s":2,"n":5,"id":"1002884","q":"<p>The spot rate is $1.50: £1 and the six-month forward rate is minus 11 points. What is the six-month forward rate?<\/p>","o":[{"l":"A","h":"$1.39"},{"l":"B","h":"$1.489"},{"l":"C","h":"$1.4989"},{"l":"D","h":"$1.49989"}],"a":"C","e":"<p>The adjustment to the spot rate is quoted in ticks: i.e. 1/100th of 1 cent. The forward rate is therefore $1.50 - 0.0011 = $1.4989.<\/p>"},{"s":2,"n":6,"id":"1051530","q":"<p>How are T-bills usually issued?<\/p>","o":[{"l":"A","h":"To members of the public only"},{"l":"B","h":"By a placing"},{"l":"C","h":"By an intermediaries offer"},{"l":"D","h":"By tender offer"}],"a":"D","e":"<p>Tender offer is the usual method with which T-bills are issued.<\/p>"},{"s":2,"n":7,"id":"1017026","q":"<p>A report of supply problems for North Sea gas would result in which of the following for gas futures?<\/p>","o":[{"l":"A","h":"Prices would decrease"},{"l":"B","h":"Prices would increase"},{"l":"C","h":"Prices could increase or decrease"},{"l":"D","h":"Prices will be unaffected"}],"a":"B","e":"<p>Any decrease in supply would increase commodity contract prices.<\/p>"},{"s":2,"n":8,"id":"1002865","q":"<p>For which of the following is the Bank of England responsible?<\/p>","o":[{"l":"A","h":"Setting sterling interest rates"},{"l":"B","h":"Control of the Treasury"},{"l":"C","h":"The issue of gilts"},{"l":"D","h":"Supervision of the money markets"}],"a":"A","e":"<p>Issuing gilts is the responsibility of the UK Debt Management Office. The money markets are supervised by the Financial Conduct Authority.<\/p>"},{"s":2,"n":9,"id":"1036725","q":"<p>Which of the following is the largest user of silver?<\/p>","o":[{"l":"A","h":"Jewellery"},{"l":"B","h":"Photography"},{"l":"C","h":"Electronics"},{"l":"D","h":"Dentistry"}],"a":"A","e":"<p>Whilst the photographic industry used to be the largest user of silver, used in the development process, due to the increase in digital photography, jewellery would now be the BEST answer.<\/p>"},{"s":2,"n":10,"id":"1017027","q":"<p>Which of the following would cause an increase in the price of emission rights?<\/p>","o":[{"l":"A","h":"The invention of a new, 'greener' power station"},{"l":"B","h":"The announcement of a fall in the oil reserves of a company"},{"l":"C","h":"A reduction in the demand for oil"},{"l":"D","h":"The announcement by the government of the closure of nuclear power stations"}],"a":"D","e":"<p>An emission right is the right to produce certain types of emissions such as carbon dioxide and methane.<br/> This is a tough question. Closure of nuclear power stations is likely to result in more demand for conventional fuel sources such as oil and coal and is therefore likely to increase emissions, which in turn would make emission contracts more valuable.<\/p>"},{"s":2,"n":11,"id":"1015747","q":"<p>The US equivalent of SONIA is:<\/p>","o":[{"l":"A","h":"SOFR"},{"l":"B","h":"SARON"},{"l":"C","h":"TIBOR"},{"l":"D","h":"Repo rate"}],"a":"A","e":"<p>SOFR = secured overnight financing rate used on the US<\/p><p>TIBOR= Tokyo inter-bank offered rate<\/p><p>SARON = Swiss average rate overnight<\/p><p>Repo rate = the implied rate payable in a sale and repurchase agreement<\/p>"},{"s":2,"n":12,"id":"1002814","q":"<p>All of the following are true of JGBs except:<\/p>","o":[{"l":"A","h":"Settlement normally takes one business day"},{"l":"B","h":"They are issued by the government of Japan"},{"l":"C","h":"They have a common maturity of 15 years"},{"l":"D","h":"They are repayable on a specified date"}],"a":"C","e":"<p>JGBs normally have a maturity of ten years.<\/p>"},{"s":2,"n":13,"id":"4221264","q":"<p>Which of the following best describes a key characteristic of \"sweet\" crude oil?<\/p>","o":[{"l":"A","h":"It has a high sulphur content, typically above 0.5%"},{"l":"B","h":"It is always produced in the Middle East"},{"l":"C","h":"It has a sulphur content below 0.5% and is generally more desirable for refining"},{"l":"D","h":"It is always more expensive to transport than other types of crude oil"}],"a":"C","e":"<p>Sweet crude oil contains less than 0.5% sulphur, making it preferable for refineries due to lower processing costs and compliance with environmental standards.<\/p>"},{"s":2,"n":14,"id":"1015523","q":"<p>Which metal is used in the production of galvanisation brass?<\/p>","o":[{"l":"A","h":"Aluminium"},{"l":"B","h":"Polonium"},{"l":"C","h":"Tin"},{"l":"D","h":"Zinc"}],"a":"D","e":"<p>This is zinc-copper alloy.<\/p>"},{"s":2,"n":15,"id":"1075073","q":"<p>Which of the following is a soft commodity?<\/p>","o":[{"l":"A","h":"Tea"},{"l":"B","h":"Lead"},{"l":"C","h":"Coffee"},{"l":"D","h":"Wheat"}],"a":"C","e":"<p>Sugar, cocoa and coffee are the soft commodities.<\/p>"},{"s":2,"n":16,"id":"1036774","q":"<p>What rate is derived from a gilt sale and repurchase?<\/p>","o":[{"l":"A","h":"LIBOR"},{"l":"B","h":"Base rate"},{"l":"C","h":"Repo rate"},{"l":"D","h":"Fed rate"}],"a":"C","e":"<p>The repo rate is derived from a repo transaction.<\/p>"},{"s":2,"n":17,"id":"1016978","q":"<p>Japanese government bonds are issued with a normal maturity of how many years?<\/p>","o":[{"l":"A","h":"5"},{"l":"B","h":"10"},{"l":"C","h":"15"},{"l":"D","h":"20"}],"a":"B","e":"<p>Japanese government bonds are normally issued with a maturity of ten years.<br/> Superlong bonds have a maturity of 20 years.<\/p>"},{"s":2,"n":18,"id":"1002880","q":"<p>A five pip decrease in an FX rate of 140.00 would result in a new rate of:<\/p>","o":[{"l":"A","h":"135.00"},{"l":"B","h":"139.9995"},{"l":"C","h":"139.995"},{"l":"D","h":"139.95"}],"a":"D","e":"<p>FX quotes are typically quoted to 5 significant figures. A pip is the fifth significant figure. A decrease of five pips is therefore 139.95 from 140.00, but would be 1.3995 if the rate was 1.4000.<\/p>"},{"s":2,"n":19,"id":"1015678","q":"<p>What is the standard settlement for UK corporate bonds in CREST after the trade?<\/p>","o":[{"l":"A","h":"Two business days"},{"l":"B","h":"Three business days"},{"l":"C","h":"Four business days"},{"l":"D","h":"Five business days"}],"a":"A","e":"<p>UK Government bonds are T+1 but corporate bonds are T+2.<\/p>"},{"s":2,"n":20,"id":"1015655","q":"<p>When there is a normal yield curve, which of the following is TRUE?<\/p>","o":[{"l":"A","h":"A short-dated 5% coupon gilt will have a higher-yield than a long-dated 5% coupon gilt"},{"l":"B","h":"A short-dated 5% coupon gilt will have a lower-yield than a long-dated 5% coupon gilt"},{"l":"C","h":"Long- and short-dated gilts with 5% coupons will have the same yield"},{"l":"D","h":"The long-dated 5% bonds will have a yield in excess of 5%"}],"a":"B","e":"<p>A normal yield curve shows a lower-yield on short-dated gilts than long-dated gilts.<\/p>"},{"s":2,"n":21,"id":"1040370","q":"<p>Which of the following credit ratings is assigned to a bond in default by Fitch?<\/p>","o":[{"l":"A","h":"B"},{"l":"B","h":"C"},{"l":"C","h":"D"},{"l":"D","h":"E"}],"a":"C","e":"<p>A bond in default is given a credit rating of D. Please note in Moody's a default is C.<\/p>"},{"s":2,"n":22,"id":"1015531","q":"<p>Which ONE of the following best represents ten basis points?<\/p>","o":[{"l":"A","h":"10%"},{"l":"B","h":"0.1%"},{"l":"C","h":"1%"},{"l":"D","h":"0.01%"}],"a":"B","e":"<p>100 basis points represents 1% and, therefore, 10 basis points is 0.1%.<\/p>"},{"s":2,"n":23,"id":"1015581","q":"<p>Which is true regarding cumulative preference shares?<\/p><p class=\"rom\"><b>I<\/b> Dividends not paid in one year or longer should be ignored<\/p><p class=\"rom\"><b>II<\/b> Dividends are paid from undistributed profits<\/p><p class=\"rom\"><b>III<\/b> Shareholders' rights are governed by the issuing company's articles of association<\/p><p class=\"rom\"><b>IV<\/b> Upon liquidation, the repayment of the share at par has priority over unsecured loan stocks<\/p>","o":[{"l":"A","h":"II and III only"},{"l":"B","h":"I and II only"},{"l":"C","h":"III and IV only"},{"l":"D","h":"I and IV"}],"a":"A","e":"<p>Debt holders always have priority over shareholders in a liquidation situation.<\/p>"},{"s":2,"n":24,"id":"1002830","q":"<p>Which of the following best describes the repo rate?<\/p>","o":[{"l":"A","h":"The interest rate implied by the commission on the sale and repurchase of an asset"},{"l":"B","h":"The interest rate implied by the difference between the sale and repurchase price of an asset"},{"l":"C","h":"The difference between a bank's lending and borrowing rates in the money markets"},{"l":"D","h":"The difference between the spread on a government bond and that on a corporate bond"}],"a":"B","e":"<p>The repo rate is the interest rate implied by the difference between the sale (loan) value of the underlying shares or bonds and the price these are repurchased for later.<\/p>"},{"s":2,"n":25,"id":"1055086","q":"<p>UK government bonds are used to fund the:-<\/p>","o":[{"l":"A","h":"Budget deficit"},{"l":"B","h":"The PSDN"},{"l":"C","h":"The DMO"},{"l":"D","h":"The treasury"}],"a":"A","e":"<p>Bonds are used to fund the Public Sector Net Cash Requirement PSNCR which is the government incomings minus outgoings.<\/p>"},{"s":2,"n":26,"id":"1015758","q":"<p>An investor will receive a semi-annual interest payment of how much in the following situation?<br/> The investor purchases five 6% $1,000 par value bonds. They are selling at a discount and have a yield to maturity of 8%.<\/p>","o":[{"l":"A","h":"$150"},{"l":"B","h":"$225"},{"l":"C","h":"$300"},{"l":"D","h":"$60"}],"a":"A","e":"<p>The investor will receive semi-annual payments of $150. The bond pays 6% interest based on $1,000 par value. There are five bonds = $5,000 par value. 6% of $5,000 = $300 / year in interest. Since the interest is paid semi-annually, the payment would = $150.<\/p>"},{"s":2,"n":27,"id":"1000822","q":"<p>When the FCA grants an exchange with recognised status, it:<\/p>","o":[{"l":"A","h":"Confers authorisation to do investment business"},{"l":"B","h":"Requires cooperation from the exchange with overseas regulators"},{"l":"C","h":"Requires that the exchange must be fit and proper"},{"l":"D","h":"Implies that all transactions will be settled in a timely manner"}],"a":"C","e":"<p>In order to be recognised by the FCA, these exchanges and clearing houses need to be fit and proper for their purpose. Once recognised, the exchanges are referred to as recognised investment exchanges (RIEs), and the clearing houses are referred to as recognised clearing houses (RCHs). RIEs and RCHs are exempt persons in that they do not need to seek authorisation from the FCA to carry out regulated activities – they are, instead, recognised.<\/p>"},{"s":2,"n":28,"id":"1002878","q":"<p>If a foreign exchange quotation is given as 0.9000/10, what does the quotation mean?<\/p><p class=\"rom\"><b>I<\/b> .9000 bid<\/p><p class=\"rom\"><b>II<\/b> .9010 offer<\/p><p class=\"rom\"><b>III<\/b> .8900 bid<\/p><p class=\"rom\"><b>IV<\/b> .9000 offer<\/p>","o":[{"l":"A","h":"I and II"},{"l":"B","h":"I and III"},{"l":"C","h":"II and III"},{"l":"D","h":"III and IV"}],"a":"A","e":"<p>This is standard notation for describing a .9000 bid (always on the left) and a .9010 offer.<\/p>"},{"s":2,"n":29,"id":"1036907","q":"<p>Which yield curve reflects prices and yields being similar for different maturities?<\/p>","o":[{"l":"A","h":"Normal"},{"l":"B","h":"Inverted"},{"l":"C","h":"Both"},{"l":"D","h":"Neither"}],"a":"D","e":"<p>Only a flat yield curve would show prices and yields being constant across different maturities. For normal and inverted they move in opposite directions.<\/p>"},{"s":2,"n":30,"id":"1016979","q":"<p>A time deposit commonly offered to consumers by banks and other financial institutions for a period of 3 to 6 months is the best description of which of the following:<\/p>","o":[{"l":"A","h":"Certificate of Deposit"},{"l":"B","h":"Eurobond"},{"l":"C","h":"UK Government bond"},{"l":"D","h":"Treasury Bill"}],"a":"A","e":"<p>This best describes a Certificate of Deposit (CD). <br/> A CD is a promissory note issued by a bank or other financial institution.<\/p>"},{"s":2,"n":31,"id":"1069788","q":"<p>Which organisation has been given the responsibility for the administration of SONIA?<\/p>","o":[{"l":"A","h":"British Banking Association"},{"l":"B","h":"ICE Benchmark Administration"},{"l":"C","h":"Bank of England"},{"l":"D","h":"His Majesty's Treasury"}],"a":"C","e":"<p>The Bank of England is responsible for administering the sterling overnight index average (SONIA)<\/p>"},{"s":2,"n":32,"id":"1015595","q":"<p>Which of the following should happen when a credit rating on a bond goes down by a 'notch', assuming all other things being equal?<\/p><p class=\"rom\"><b>I<\/b> The bond's price increases<\/p><p class=\"rom\"><b>II<\/b> The bond's price drops<\/p><p class=\"rom\"><b>III<\/b> The bond's yield increases<\/p><p class=\"rom\"><b>IV<\/b> The bond's yield drops<\/p>","o":[{"l":"A","h":"I and III only"},{"l":"B","h":"II and III only"},{"l":"C","h":"I and IV only"},{"l":"D","h":"II and IV only"}],"a":"B","e":"<p>A credit downgrade will generally result in the bond's price falling and cause the yield to increase. Price and yield are inversely related.<\/p>"},{"s":2,"n":33,"id":"1002829","q":"<p>Which of the following ARE characteristics of US Treasury bonds?<\/p><p class=\"rom\"><b>I<\/b> They have a life in excess of ten years<\/p><p class=\"rom\"><b>II<\/b> They settle one business day after the trade<\/p><p class=\"rom\"><b>III<\/b> They pay a semi annual coupon<\/p><p class=\"rom\"><b>IV<\/b> They are the US equivalent of gilts<\/p>","o":[{"l":"A","h":"I and IV"},{"l":"B","h":"I, II and IV"},{"l":"C","h":"I, III and IV"},{"l":"D","h":"I, II, III and IV"}],"a":"D","e":"<p>US Government bonds are called Treasury Bonds. All the descriptions are correct.<\/p>"},{"s":2,"n":34,"id":"1015604","q":"<p>Investing in preference shares is similar to investing in bonds because:<\/p>","o":[{"l":"A","h":"Both have equal voting rights"},{"l":"B","h":"Both are required to give the same return"},{"l":"C","h":"They have equal security in the case of a winding-up"},{"l":"D","h":"Dividends on preference shares are usually fixed"}],"a":"D","e":"<p>Neither preference shares nor bonds generally have voting rights attached. The similarity between the two instruments is generally related to a fixed payment - for bonds it would be a coupon and for preference shares it would be a dividend.<\/p>"},{"s":2,"n":35,"id":"4221265","q":"<p>How might the introduction of stricter global sulphur emission limits on shipping fuel influence the market dynamics between \"sweet\" and \"sour\" crude oils?<\/p>","o":[{"l":"A","h":"It would decrease demand for both sweet and sour crude oils equally"},{"l":"B","h":"It would likely increase demand and prices for sweet crude oils while widening the discount on sour crude oils"},{"l":"C","h":"It would cause refineries to favour heavier crudes over lighter ones"},{"l":"D","h":"It would make sour crude oil more attractive due to its higher sulphur content"}],"a":"B","e":"<p>Stricter sulphur limits on shipping fuel increase demand for sweet (low-sulphur) crude, as refineries seek to comply with regulations, making sweet crude more valuable and sour crude less attractive.<\/p>"},{"s":2,"n":36,"id":"1017021","q":"<p>The graph of a yield curve is the representation of which of the following?<\/p>","o":[{"l":"A","h":"Interest rates and yields"},{"l":"B","h":"Yields and maturities"},{"l":"C","h":"Price and interest rates"},{"l":"D","h":"Price and maturities"}],"a":"B","e":"<p>A yield curve is a graph that shows the relationship between yields and maturities for a set of similar securities or deposits.<\/p>"},{"s":2,"n":37,"id":"1002833","q":"<p>Which of the following is true concerning US T-bonds?<\/p><p class=\"rom\"><b>I<\/b> They are issued with a life greater than 10 years<\/p><p class=\"rom\"><b>II<\/b> They are issued with a life of less than 10 years<\/p><p class=\"rom\"><b>III<\/b> They are not issued with a zero-coupon<\/p><p class=\"rom\"><b>IV<\/b> They are issued with a zero-coupon<\/p>","o":[{"l":"A","h":"I and II"},{"l":"B","h":"I and III"},{"l":"C","h":"II and III"},{"l":"D","h":"II and IV"}],"a":"B","e":"<p>They are not issued as zero-coupon bonds; although they may subsequently be stripped into zero-coupon bonds. They are issued with a life of greater than 10 years.<\/p>"},{"s":2,"n":38,"id":"1052119","q":"<p>Which of the following is the best description of a collateralised debt obligation (CDO) squared?<\/p>","o":[{"l":"A","h":"A derivative that creates an investment grade bond from a pool of junk bonds"},{"l":"B","h":"A CDO which exposes the holder to twice the risk, as opposed to an ordinary CDO"},{"l":"C","h":"A CDO that is created from a basket of CDOs"},{"l":"D","h":"A CDO that invests in credit default swaps (CDSs)"}],"a":"C","e":"<p>A CDO that is created from a basket of CDOs is a good definition of a CDO squared.<br/> A derivative that creates an investment grade bond from a pool of junk bonds is a definition of a collateralised debt obligation. <br/> A CDO that invests in credit default swaps (CDSs) is the definition of a synthetic CDO.<\/p>"},{"s":2,"n":39,"id":"1079787","q":"<p>Which of the following is NOT one of the cryptocurrencies?<\/p>","o":[{"l":"A","h":"Bitcoin"},{"l":"B","h":"Litecoin"},{"l":"C","h":"Ethereum"},{"l":"D","h":"Bitripple"}],"a":"D","e":"<p>In the CISI workbook examples of well known cryptocurrencies include Bitcoin, Litecoin, Ethereum, Ripple, Bitcoin cash, Ethereum classic.<\/p>"},{"s":2,"n":40,"id":"1002816","q":"<p>If a client suggested that he felt the yield curve was steepening, what would he most likely mean?<\/p>","o":[{"l":"A","h":"Longer-yields are falling"},{"l":"B","h":"Longer-yields are rising"},{"l":"C","h":"The yield curve is inverting"},{"l":"D","h":"Short-yields are rising"}],"a":"B","e":"<p>Normally the yield curve is upward-sloping (i.e. far-dated yields are higher than near-dated yields). If it was suggested that the yield curve was steepening, it would mean that the far-dated yields are getting higher.<\/p>"},{"s":2,"n":41,"id":"1002879","q":"<p>If a spot FX rate is 1.54 and the forward is quoted as minus 14, what is the forward outright rate?<\/p>","o":[{"l":"A","h":"1.4000"},{"l":"B","h":"1.5386"},{"l":"C","h":"1.5414"},{"l":"D","h":"1.6800"}],"a":"B","e":"<p>Forward adjustments are always expressed in pips (also known as FX points). A pip is usually the fifth significant figure of the rate: i.e. 1.5400 - 0.0014 = 1.5386.<\/p>"},{"s":2,"n":42,"id":"1017012","q":"<p>Which of the following might explain why sugar prices would be less affected by bad weather in a region than cocoa prices?<\/p>","o":[{"l":"A","h":"Sugar is easier to grow"},{"l":"B","h":"Sugar does not have any substitute products"},{"l":"C","h":"Sugar is not subject to any tariffs"},{"l":"D","h":"Sugar is produced in more than one region"}],"a":"D","e":"<p>If sugar is produced in more than one region relative to Cocoa (sugar cane and sugar beet) then bad weather in one region does not affect the price as much as it does with cocoa. You are not expected to have a lot of knowledge about sugar or cocoa, but based on factors that might affect its supply or demand, you are expected to answer these questions.<\/p>"},{"s":3,"n":1,"id":"4211279","q":"<p>Which of the following exchanges operates exclusively using electronic trading and does not employ open outcry style trading systems?<\/p>","o":[{"l":"A","h":"London Metal Exchange (LME)"},{"l":"B","h":"Chicago Board of Trade (CBOT)"},{"l":"C","h":"Chicago Mercantile Exchange (CME)"},{"l":"D","h":"Intercontinental Exchange (ICE)"}],"a":"D","e":"<p>The Intercontinental Exchange (ICE) operates entirely on electronic trading platforms and does not utilize open outcry, pit, or ring trading systems. This is in contrast to exchanges like the London Metal Exchange (LME) and CBOT, which still employ open outcry for specific trading sessions.<\/p>"},{"s":3,"n":2,"id":"1047189","q":"<p>Execution of trades on an exchange for a non-member can be achieved via:<\/p>","o":[{"l":"A","h":"A broker dealer"},{"l":"B","h":"The central counterparty service"},{"l":"C","h":"The exchange electronic platform"},{"l":"D","h":"A trade registration system"}],"a":"A","e":"<p>Broker-dealers have dual capacity and trade for themselves or their clients.<\/p>"},{"s":3,"n":3,"id":"1036962","q":"<p>A speculator seeks to go long at a level in the market below the prevailing level. Which of the following orders should she give her broker?<\/p>","o":[{"l":"A","h":"A buy MIT"},{"l":"B","h":"A buy stop"},{"l":"C","h":"A sell MIT"},{"l":"D","h":"A sell stop"}],"a":"A","e":"<p>Stop orders are orders used to close an existing position. MIT (market if touched) orders are orders that can be used to enter the market. The speculator here is only interested in opening a position if the market retraces down from its current level; an order to buy below the current level is required: a buy MIT.<\/p>"},{"s":3,"n":4,"id":"1036877","q":"<p>Which of the following is the best definition of exchange traded?<\/p>","o":[{"l":"A","h":"On an Recognised Investment Exchange (RIE)"},{"l":"B","h":"On a Designated Investment Exchange (DIE)"},{"l":"C","h":"On an Recognised Investment Exchange or Designated Investment Exchange"},{"l":"D","h":"On any exchange"}],"a":"D","e":"<p>A deal on any exchange would be exchange traded (as opposed to 'over the counter').<\/p>"},{"s":3,"n":5,"id":"1015805","q":"<p>In an open outcry trade, who starts the process?<\/p>","o":[{"l":"A","h":"Customer"},{"l":"B","h":"Clearing house"},{"l":"C","h":"Broker"},{"l":"D","h":"Counterparty"}],"a":"A","e":"<p>The customer would initiate the trade by contacting their broker to place the trade with the floor dealer or equivalent.<\/p>"},{"s":3,"n":6,"id":"1065112","q"
