premium curve) increases for a given change in the underlying price. The rate of change is also going to be greatest moving away from the strike (i.e. for an ATM option).<\/p>"},{"s":4,"n":81,"id":"1002840","q":"<p>An equity index future with a distant delivery date will have a higher fair value than that of a near-dated one if:<\/p>","o":[{"l":"A","h":"The equity market is currently enjoying a bull run"},{"l":"B","h":"The dividend yield exceeds present interest rates"},{"l":"C","h":"The equity market is currently in a bear run"},{"l":"D","h":"The dividend yield is lower than present interest rates"}],"a":"D","e":"<p>The fair value of the future is cash + cost-of-carry. The costs-of-carry for index futures is interest rates less dividends received (dividend yield). If the dividend yield was higher than prevailing interest rates, the distant-dated future would have a LOWER fair value than the near one.<\/p>"},{"s":4,"n":82,"id":"1002761","q":"<p>An option has a premium of 7, intrinsic value of 5 and the underlying is at 12. Which of the following is true?<\/p>","o":[{"l":"A","h":"It will breakeven if exercised"},{"l":"B","h":"It should be exercised"},{"l":"C","h":"It is in-the-money"},{"l":"D","h":"It is out-of-the-money"}],"a":"C","e":"<p>The option is in-the-money by five, shown by the intrinsic value. This is the best answer.<br/> We are not told what we paid for the option, so the breakeven point cannot be assessed. It will breakeven when it is in-the-money by seven - assuming we pay the premium of seven for the option today.<br/> Although the option has intrinsic value, it also has time value. Assuming you hold the option, it is better to sell the option and generate 7 by collecting the premium, than to exercise and generate 5 through the intrinsic value. Saying it should be exercised is not necessarily true.<\/p>"},{"s":4,"n":83,"id":"1016996","q":"<p>An underlying asset is trading at $31<br/> Interest rates are 10% p/a<br/> The three-month call and put options with strike prices of $30 are trading at $3 and $1.<br/> What trade should an arbitrageur undertake?<\/p>","o":[{"l":"A","h":"Sell the underlying, buy a call and sell a put with the same strike and same underlying asset"},{"l":"B","h":"Buy the underlying, sell a put and buy a call with the same strike and the same underlying asset"},{"l":"C","h":"Buy the underlying, buy a put and sell a call with the same strike and same underlying asset"},{"l":"D","h":"Sell the underlying and buy a put and sell a call with the same strike and same underlying asset"}],"a":"C","e":"<p>Using put-call parity the fair value of the underlying can be calculated as follows: C - P = S - K / (1 + r)^t , rearrange to C - P + K /(1 + r)^t = S<\/p><p>$3 - $1 + $30 / 1.1^0.25 = $31.29<\/p><p>Therefore the fair value of the underlying is $31.29, whereas it is trading at $31. So an arbitrageur would buy the underlying and sell the synthetic future (long put and short call).<\/p>"},{"s":4,"n":84,"id":"1002752","q":"<p>An option's Delta is best described as the ratio between:<\/p>","o":[{"l":"A","h":"The price of the option and the price of the underlying instrument"},{"l":"B","h":"The change in the option premium and the change in the price of the underlying instrument"},{"l":"C","h":"The time value and the intrinsic value"},{"l":"D","h":"The option premium and the underlying price"}],"a":"B","e":"<p>The Delta of an option quantifies how far a premium changes given a change in the price of the underlying asset. Note: Delta = change in premium / change in underlying.<\/p>"},{"s":4,"n":85,"id":"1017312","q":"<p>A wheat farmer fears falling prices will affect the return from her harvest, so she enters into a short futures contract on exchange to reduce her risk. At harvest, the farmer sells her wheat and closes out her futures position. What risk is she exposed to?<\/p>","o":[{"l":"A","h":"Counterparty risk"},{"l":"B","h":"Market risk"},{"l":"C","h":"Default risk"},{"l":"D","h":"Basis risk"}],"a":"D","e":"<p>In this question, we have to assume that the farmer is closing out her position and lifting her hedge early. In this case, she is exposed if the relationship between the cash and futures price has changed: i.e. if the basis has changed.<\/p>"},{"s":4,"n":86,"id":"1026866","q":"<p>Per put-call parity, which of the following combinations creates a synthetic short call?<\/p>","o":[{"l":"A","h":"Long asset and short put"},{"l":"B","h":"Short asset and short put"},{"l":"C","h":"Long asset and long put"},{"l":"D","h":"Short asset and long put"}],"a":"B","e":"<p>Rearrange put-call parity formula, C - P = S - K / (1 + r)^t to get C on its own using '- C' as a short call. <br/> - P - S + K / (1 + r)t = - C . Therefore, shorting the asset and selling the put gives you a synthetic short call.<\/p>"},{"s":4,"n":87,"id":"1037131","q":"<p>The option with the lowest gamma would be:<\/p>","o":[{"l":"A","h":"Deeply in-the-money put"},{"l":"B","h":"At-the-money put"},{"l":"C","h":"At-the-money call"},{"l":"D","h":"In-the-money call"}],"a":"A","e":"<p>In the case of a deeply in or out-of-the-money option, changes in the underlying asset have relatively little effect on the probability of the option being exercised. Gamma measures the sensitivity of an option's delta to change in the underlying asset.<\/p>"},{"s":4,"n":88,"id":"1002746","q":"<p>If the underlying asset is trading at 575, the intrinsic value of the 600 put is:<\/p>","o":[{"l":"A","h":"575"},{"l":"B","h":"25"},{"l":"C","h":"Nil"},{"l":"D","h":"-25"}],"a":"B","e":"<p>Intrinsic value for a put = exercise price - underlying share price:<br/> = 600 - 575<br/> = 25<\/p>"},{"s":4,"n":89,"id":"4211276","q":"<p>In the context of derivative pricing, which asset class most commonly uses cash-flow pricing due to predictable earnings such as EBITDA?<\/p>","o":[{"l":"A","h":"Equities"},{"l":"B","h":"Currencies"},{"l":"C","h":"Bonds"},{"l":"D","h":"Property"}],"a":"A","e":"<p>Equities often use cash-flow pricing models, like discounted cash flow, which consider future earnings such as EBITDA to value derivatives like equity options and swaps. These earnings are crucial for estimating the future cash flows of the company.<\/p>"},{"s":4,"n":90,"id":"1052121","q":"<p>When calculating the fair value of a Standard and Poor index future, you find the value to be 903. In comparison the future is trading at 900. Which one of the following trades would you perform to take advantage of the price difference?<\/p>","o":[{"l":"A","h":"Frictional costs would suggest that there is no arbitrage opportunity"},{"l":"B","h":"Reverse cash and carry"},{"l":"C","h":"Cash and carry"},{"l":"D","h":"Conversion"}],"a":"B","e":"<p>Where the fair value of the future is higher than the future, you would perform a reverse cash and carry trade: sell the cash asset and go long the future. <\/p><p>We cannot comment on frictional costs, as these are not given in the question. Conversions are linked to put-call parity arbitrage.<\/p>"},{"s":4,"n":91,"id":"1017369","q":"<p>In a backwardation market, which of the following occurs?<\/p>","o":[{"l":"A","h":"Nearby prices are higher than forward prices"},{"l":"B","h":"Forward prices are higher than nearby prices"},{"l":"C","h":"Nearby and forward prices are the same"},{"l":"D","h":"Nearby contracts are more liquid than forward contracts"}],"a":"A","e":"<p>In a backwardation market, cash prices are higher than forward or future prices.<\/p>"},{"s":4,"n":92,"id":"1002701","q":"<p>If a future was trading BELOW its fair value, what would you expect a futures trader to do?<\/p>","o":[{"l":"A","h":"Cash and carry arbitrage"},{"l":"B","h":"A spread trade"},{"l":"C","h":"Reverse cash and carry arbitrage"},{"l":"D","h":"Reversal"}],"a":"C","e":"<p>Reverse cash and carry = BUY the future and SELL the cash asset. Note: If the future was trading ABOVE its fair value, cash and carry arbitrage would occur, i.e. the cash asset would be bought and the future sold.<\/p>"},{"s":4,"n":93,"id":"1015828","q":"<p>Time value is greatest for which of the following options if the underlying asset is priced at 115 in April?<\/p>","o":[{"l":"A","h":"May 140 call"},{"l":"B","h":"May 160 call"},{"l":"C","h":"August 160 call"},{"l":"D","h":"November 160 call"}],"a":"D","e":"<p>This is a difficult question. Time value is greatest for ATM options - however none of these options has a strike price very close to the share price. Therefore, the option with the greatest time value will be the one with the longest time until expiry.<\/p>"},{"s":4,"n":94,"id":"1002763","q":"<p>A put option has intrinsic value of 15p and time value of 20p. The premium will be:<\/p>","o":[{"l":"A","h":"5p"},{"l":"B","h":"35p"},{"l":"C","h":"20p"},{"l":"D","h":"15p"}],"a":"B","e":"<p>An option premium is made up of the intrinsic value (profit if exercised now) and the time value.<\/p>"},{"s":4,"n":95,"id":"1015697","q":"<p>In June, a farmer is concerned about falling wheat prices and takes out a hedge by selling a December wheat contract. His wheat is ready for sale in November and he lifts the hedge by selling the wheat in the cash market and closing-out his futures contract. <br/> From which of the following is the farmer at risk?<\/p>","o":[{"l":"A","h":"A change in the future's price from June to November"},{"l":"B","h":"A change in the price of wheat from June to November"},{"l":"C","h":"A change in basis from June to November"},{"l":"D","h":"A change in the future's price from November to December"}],"a":"C","e":"<p>As the farmer has lifted his hedge early he is susceptible to 'basis risk'. Basis risk can arise because the relationship between the cash price and future's price is unpredictable and can change between setting-up the hedge and lifting it early. If basis has weakened, the farmer's profits in the futures market will not be sufficient to offset the loss in the cash market.<\/p>"},{"s":4,"n":96,"id":"1002747","q":"<p>When is gearing highest for an option?<\/p>","o":[{"l":"A","h":"When it is at-the-money"},{"l":"B","h":"When it is in-the-money"},{"l":"C","h":"When it is out-of-the-money"},{"l":"D","h":"When the exercise price equals the cash price"}],"a":"C","e":"<p>An option's gearing refers to its profit/loss potential compared to that of owning the underlying asset. The smaller the premium, the higher the gearing. Out-of-the-money options have the lowest premiums due to the fact that there is no intrinsic value. They are therefore the most highly geared.<\/p>"},{"s":4,"n":97,"id":"1017389","q":"<p>Which of the following best describes convergence in a futures contract?<\/p>","o":[{"l":"A","h":"It is another term for gearing"},{"l":"B","h":"Where basis moves towards zero as the contract approaches delivery"},{"l":"C","h":"It is the point at which a buyer and seller come to an agreement on the price"},{"l":"D","h":"It is where a buyer and seller of a future perform a physical exchange of assets"}],"a":"B","e":"<p>Convergence is the process by which the cash and futures price move closer together as delivery approaches. At delivery the futures price of the asset equals the cash price of the asset as there are no further cost of carry.<\/p>"},{"s":4,"n":98,"id":"1015731","q":"<p>If interest rates increase, what is the effect on the cost of carry element of the fair value of a future?<\/p>","o":[{"l":"A","h":"The cost of carry decreases"},{"l":"B","h":"The cost of carry increases"},{"l":"C","h":"There is no impact on the cost of carry"},{"l":"D","h":"The cost of carry could be affected either way"}],"a":"B","e":"<p>Interest rates have to be taken into consideration when calculating cost of carry. If interest rates increase, then the costs involved in buying spot and carrying also increase.<\/p>"},{"s":4,"n":99,"id":"1002750","q":"<p>If everything else remained constant, increases in which of the following is likely to increase option premiums?<\/p><p class=\"rom\"><b>I<\/b> Volatility<\/p><p class=\"rom\"><b>II<\/b> Interest rates<\/p><p class=\"rom\"><b>III<\/b> Remaining life<\/p><p class=\"rom\"><b>IV<\/b> Price of the underlying instruments<\/p>","o":[{"l":"A","h":"I and II"},{"l":"B","h":"I and IV"},{"l":"C","h":"I and III"},{"l":"D","h":"III and IV"}],"a":"C","e":"<p>The more volatile/risky the underlying is, the more expensive all options will become. The remaining life is likely to increase an option's time value. An increase in interest rates or in the price of the underlying will increase calls, but decrease puts.<\/p>"},{"s":4,"n":100,"id":"1044809","q":"<p>If the fair value of a future is at a discount to the future's price, which of the following would generate profit?<\/p>","o":[{"l":"A","h":"Long future"},{"l":"B","h":"Short future"},{"l":"C","h":"Cash and carry"},{"l":"D","h":"Reverse cash and carry"}],"a":"C","e":"<p>Buy cheap (the underlying) and sell the expensive (future).<\/p>"},{"s":4,"n":101,"id":"1002748","q":"<p>Which of the following illustrates an out-of-the-money option?<\/p>","o":[{"l":"A","h":"A put option with a strike price below the current price of the underlying security"},{"l":"B","h":"A put option with a strike price above the current price of the underlying security"},{"l":"C","h":"A call option with a strike price below the current price of the underlying security"},{"l":"D","h":"An American style option traded on European exchanges"}],"a":"A","e":"<p>An out-the-money option is one without intrinsic value. Calls are out-of-the-money if the strike is ABOVE the cash price. Puts are out-of-the-money if the strike is BELOW the cash price.<\/p>"},{"s":4,"n":102,"id":"1036863","q":"<p>An investor is long two futures and short two ATM calls with deltas of 0.5. What is the investor's cumulative position?<\/p>","o":[{"l":"A","h":"Long one"},{"l":"B","h":"Long two"},{"l":"C","h":"Short one"},{"l":"D","h":"Short two"}],"a":"A","e":"<p>Long 2 futures = 2 x +1 = +2<br/> Short 2 ATM calls = 2 x -0.5 = -1<br/> Combined = +1<\/p>"},{"s":4,"n":103,"id":"1015770","q":"<p>What happens to the premium on an at-the-money put option if the price of the underlying rises?<\/p>","o":[{"l":"A","h":"No change"},{"l":"B","h":"Increase"},{"l":"C","h":"Decrease"},{"l":"D","h":"It depends on whether the premium is settled upfront or on exercise"}],"a":"C","e":"<p>As the price of the underlying rises, the right to sell at a fixed price becomes less attractive: i.e. the option goes even more out-of-the money and premiums fall.<\/p>"},{"s":4,"n":104,"id":"1002699","q":"<p>If a future is trading below fair value, which of the following trades will an arbitrageur enter into in order to make a profit?<\/p>","o":[{"l":"A","h":"Sell futures"},{"l":"B","h":"Buy the underlying and sell futures"},{"l":"C","h":"Buy futures"},{"l":"D","h":"Buy futures and sell the underlying"}],"a":"D","e":"<p>The potential profit from selling the underlying and buying back at the futures price, and saving the cost of carry, will leave the trader in a better position than holding the underlying.<\/p>"},{"s":5,"n":1,"id":"1026860","q":"<p>A credit derivative contract is based on a:<\/p>","o":[{"l":"A","h":"Reference obligation"},{"l":"B","h":"Reference asset"},{"l":"C","h":"Reference entity"},{"l":"D","h":"Nominated asset"}],"a":"B","e":"<p>Credit default swaps offer protection for credit event involving a reference asset. Although a reference obligation (such as debt) could be a reference asset, B is the best answer here.<\/p>"},{"s":5,"n":2,"id":"1055081","q":"<p>If an investor wishes to protect themselves from a rise in interest rates but does not want to take on excessive risk, they could:<\/p>","o":[{"l":"A","h":"Buy a cap"},{"l":"B","h":"Buy a future"},{"l":"C","h":"Buy a floor"},{"l":"D","h":"Sell a floor"}],"a":"A","e":"<p>Selling a future and a cap could be used to hedge against a rise in interest rates but a cap gives you a right rather than the obligation.<\/p>"},{"s":5,"n":3,"id":"4211280","q":"<p>In the context of the margin/collateral process for OTC derivatives, what is the primary purpose of conducting regular mark-to-market (MTM) valuations?<\/p>","o":[{"l":"A","h":"To determine the future value of the derivative contract"},{"l":"B","h":"To ensure the collateral provided is still sufficient relative to current exposure"},{"l":"C","h":"To predict market trends affecting the collateral"},{"l":"D","h":"To calculate the initial margin requirement"}],"a":"B","e":"<p>Regular mark-to-market (MTM) valuations are conducted to assess the current value of both the derivative transaction and the collateral held. This process ensures that the collateral remains adequate to cover the counterparty credit exposure, considering any changes in market conditions or the value of the collateral itself.<\/p>"},{"s":5,"n":4,"id":"1017037","q":"<p>Which of the following is TRUE regarding where a confirmation sits in the architecture of the ISDA documentation?<\/p>","o":[{"l":"A","h":"The confirmation is subordinate to the definitions and terms stipulated in the master agreement"},{"l":"B","h":"The specific terms of the confirmation override the details of the master agreement"},{"l":"C","h":"The confirmation is not affected by the credit support annex"},{"l":"D","h":"The confirmation is more detailed than the master agreement"}],"a":"B","e":"<p>If there is a conflict between something contained in the confirmation and the master agreement, the confirmation takes precedence for that deal.<\/p>"},{"s":5,"n":5,"id":"1014220","q":"<p>What could be considered a credit event?<\/p>","o":[{"l":"A","h":"Default on payment"},{"l":"B","h":"Restructuring"},{"l":"C","h":"Bankruptcy of issuing company"},{"l":"D","h":"All of the above"}],"a":"D","e":"<p>All could be considered credit events.<\/p>"},{"s":5,"n":6,"id":"4211281","q":"<p>Which of the following is considered the most secure form of collateral for OTC derivative transactions, ensuring minimal credit risk due to its stability and liquidity?<\/p>","o":[{"l":"A","h":"Any G7 issued issued Government bonds"},{"l":"B","h":"Cash in the currency of the risk"},{"l":"C","h":"Equity issued by major corporations"},{"l":"D","h":"Real estate properties in a developed country's cities"}],"a":"B","e":"<p>Cash in the currency of the risk is considered the most secure form of collateral due to its stability and liquidity. It does not fluctuate in value and can be easily liquidated, making it ideal for managing credit exposure in OTC derivative transactions.<\/p>"},{"s":5,"n":7,"id":"1014219","q":"<p>If you were a borrower and were concerned that interest rates will rise, which of the following contracts would you enter into?<\/p>","o":[{"l":"A","h":"Long FRA"},{"l":"B","h":"Short plain vanilla swap"},{"l":"C","h":"Long STIR future"},{"l":"D","h":"Short cap"}],"a":"A","e":"<p>If you were concerned that rates are going to rise, you would enter into a long FRA, as you would receive the difference between the floating rate and the fixed rate. To short a swap is to pay out the floating rate at reset dates. To go long a future would be beneficial if rates were going to fall. To sell or short a cap would cause you to pay out if rates rose.<\/p>"},{"s":5,"n":8,"id":"1014247","q":"<p>In managing a firm's collateral a bank can provide which of the following services?<\/p><p class=\"rom\"><b>I<\/b> Marking to market of contracts<\/p><p class=\"rom\"><b>II<\/b> Monitoring the value of collateral<\/p><p class=\"rom\"><b>III<\/b> Managing delivery and return amounts<\/p><p class=\"rom\"><b>IV<\/b> Paying interest on cash collateral<\/p>","o":[{"l":"A","h":"II only"},{"l":"B","h":"I and II"},{"l":"C","h":"I, II, IV"},{"l":"D","h":"All of the above"}],"a":"D","e":"<p>A bank holding the collateral of a firm can offer all of the above services. Remember, 'delivery and return' amounts refers to variation margin payments on the contracts.<\/p>"},{"s":5,"n":9,"id":"1014240","q":"<p>Which document is negotiated and signed by the buyer and seller of OTC contracts and can cover different contracts in different currencies?<\/p>","o":[{"l":"A","h":"Long-form confirmation"},{"l":"B","h":"Short-form confirmation"},{"l":"C","h":"Instrument of incorporation"},{"l":"D","h":"Master agreement"}],"a":"D","e":"<p>The master agreement allows all contracts covered to be treated equally should default occur by one of the parties involved.<br/> Confirmation cover information specific to a particular trade - we are not tested on the difference between long-form and short-form confirmations.<\/p>"},{"s":5,"n":10,"id":"1014207","q":"<p>Which of the following contracts are ALWAYS exchange-traded?<\/p>","o":[{"l":"A","h":"Bermudan options"},{"l":"B","h":"FX forwards"},{"l":"C","h":"Futures"},{"l":"D","h":"Asian options"}],"a":"C","e":"<p>Futures are, by definition, exchange-traded. Options can be either OTC or exchange-traded. Forwards are generally OTC.<\/p>"},{"s":5,"n":11,"id":"1026858","q":"<p>Which of the following is the best description of an equity swap?<\/p>","o":[{"l":"A","h":"A contract where one party pays a floating rate of interest and receives the return on an index or share"},{"l":"B","h":"A contract for the exchange of two different shares"},{"l":"C","h":"A contract where the return on a share or index passes, while the capital in the transaction is protected"},{"l":"D","h":"A physically delivered contract involving the return on a share or index"}],"a":"A","e":"<p>A represents the best description of an equity swap. Equity swaps are cash-settled.<\/p>"},{"s":5,"n":12,"id":"1055079","q":"<p>Which of these would protect against price rises but limit gains from price falls?<\/p>","o":[{"l":"A","h":"Being a receiver in a FRA."},{"l":"B","h":"Buying a cap."},{"l":"C","h":"Selling a floor."},{"l":"D","h":"Buying a collar."}],"a":"D","e":"<p>Buying a cap and a collar would protect you from rises but only a collar would limit gains from price falls.<\/p>"},{"s":5,"n":13,"id":"1026857","q":"<p>Which of the following best describes the characteristics and uses of an amortising swap?<\/p>","o":[{"l":"A","h":"The principal increases over the life of the contract to net off against a matching liability"},{"l":"B","h":"The principal increases and decreases over the life of the swap to net off against a matching liability"},{"l":"C","h":"The fixed interest rate is reduced to stepped amounts over the life of the swap to net off against a matching liability"},{"l":"D","h":"The principal is reduced over the life of the swap to net off against a matching liability"}],"a":"D","e":"<p>A and B are accreting and rollercoaster swaps respectively. D is an amortising swap, where the principal is reduced over the life of the swap.<\/p>"},{"s":5,"n":14,"id":"1051978","q":"<p>Spot FX is at 1.6. Forward points are -14. The forward quote would be:<\/p>","o":[{"l":"A","h":"1.46"},{"l":"B","h":"-10.6"},{"l":"C","h":"1.5986"},{"l":"D","h":"1.612"}],"a":"C","e":"<p>The forward points are quoted in pips. In this case, 0.0014. Hence 1.6000 - 0.0014 gives 1.5986.<\/p>"},{"s":5,"n":15,"id":"1017034","q":"<p>A fund manager believes the FTSE 100 will increase in value and enters into a receiver total return swap, where equity returns are swapped for a floating rate. During this period of time the index falls in value.<br/> Which of the following will the fund manager have to do?<\/p>","o":[{"l":"A","h":"Make floating rate interest payments to the swap dealer and receive payments in compensation for the decrease in the index"},{"l":"B","h":"Make floating rate interest payments and payments to the swap dealer for the decrease in the value of the index"},{"l":"C","h":"Make increased interest payments to the swap dealer until the index increases in value beyond the net value point"},{"l":"D","h":"Make payments to the swap dealer based on the value of the index in return for the floating rate of interest"}],"a":"B","e":"<p>Normally the fund manager would pay a floating rate of interest to a swap dealer and in return receive the return on the index. As the index has fallen he will have to make his interest payments plus pay an amount to the swap dealer.<\/p>"},{"s":5,"n":16,"id":"1015529","q":"<p>Which ONE of the following is NOT an example of a basis swap?<\/p>","o":[{"l":"A","h":"3m LIBOR v 6m LIBOR"},{"l":"B","h":"3m LIBOR v 3m T-bill rate"},{"l":"C","h":"6m LIBOR v 6m Fed Funds rate"},{"l":"D","h":"Fixed rate v 3m LIBOR"}],"a":"D","e":"<p>A basis swap is a particular type of interest rate swap where a floating rate is swapped for a different floating rate.<\/p>"},{"s":5,"n":17,"id":"1014232","q":"<p>Borrowers with a variable rate of interest might use which of the following to protect themselves from rising interest rates?<\/p>","o":[{"l":"A","h":"Short FRA"},{"l":"B","h":"Long STIR"},{"l":"C","h":"Cap"},{"l":"D","h":"Floor"}],"a":"C","e":"<p>All the others would be used to protect against a falling interest rate.<\/p>"},{"s":5,"n":18,"id":"1015822","q":"<p>An investor holds a receiver swaption on a vanilla interest rate swap. For what reason would they exercise it?<\/p>","o":[{"l":"A","h":"Because interest rates have risen so the option is in-the-money"},{"l":"B","h":"Because interest rates have risen so the option is out-of-the-money"},{"l":"C","h":"Because interest rates have dropped so the option is in-the-money"},{"l":"D","h":"Because interest rates have dropped so the option is out-of-the-money"}],"a":"C","e":"<p>A receiver of a swaption has the right to receive a fixed amount in return for paying floating. If interest rates drop them the option will become more in-the-money and it should be exercised on expiry.<\/p>"},{"s":5,"n":19,"id":"1055517","q":"<p>Which of the below is TRUE of forward contracts traded away from an exchange?<\/p>","o":[{"l":"A","h":"Contracts must be novated by a central counterparty"},{"l":"B","h":"All components of the contracts are negotiated fully by the counterparties"},{"l":"C","h":"All components of the contract are negotiated except the asset and the quantity which is set by the exchange"},{"l":"D","h":"All participants are free from counterparty/credit risk"}],"a":"B","e":"<p>Forwards are OTC contracts and therefore there is no exchange involved and terms will be fully negotiated bilaterally between the parties involved. Whilst OTC contracts can be novated by a clearing house it is not a must and so there will be exposure to counterparty risk where clearing houses are not used.<\/p>"},{"s":5,"n":20,"id":"1014226","q":"<p>Which of the following is the best definition of being long a FRA?<\/p>","o":[{"l":"A","h":"Agreeing to pay a fixed rate of interest and receive a variable rate"},{"l":"B","h":"Agreeing to pay a variable rate of interest and receive a fixed rate"},{"l":"C","h":"Agreeing to pay a variable rate of interest and receive another type of variable rate"},{"l":"D","h":"The right to pay a fixed rate of interest and receive a variable rate"}],"a":"A","e":"<p>Being long a FRA is the agreement to pay a fixed rate of interest and receive a variable rate. If interest rate rise the FRA will pay out to the buyer.<\/p>"},{"s":5,"n":21,"id":"1014230","q":"<p>A FLEX option gives the investor all of the following benefits over a standard exchange-traded option, except:<\/p>","o":[{"l":"A","h":"An exchange-traded product with OTC features"},{"l":"B","h":"Flexibility for the long as to whether the option will be exercised or not"},{"l":"C","h":"Flexibility as to what the strike price will be"},{"l":"D","h":"Flexibility as to when the expiry date will be"}],"a":"B","e":"<p>FLEX options are exchange-traded options that give investors the chance to benefit from certain characteristics of the OTC market, such as negotiating the strike price and expiry date, as well as expiry style. Whether it is a FLEX option or a standard exchange-traded option, the long always has the flexibility to choose whether to exercise or not.<\/p>"},{"s":5,"n":22,"id":"1047185","q":"<p>Which of the following trading methods offers the best possibility for market users to have straight through processing (STP) of their trades?<\/p>","o":[{"l":"A","h":"Quote driven trading"},{"l":"B","h":"Open outcry trading"},{"l":"C","h":"Inter-office trading"},{"l":"D","h":"Electronic trading"}],"a":"D","e":"<p>Electronic trading will automatically execute, match and assign trades ready for clearing; thereby enabling the straight through processing of trades.<\/p>"},{"s":5,"n":23,"id":"1069791","q":"<p>The best description of a zero coupon inflation swap is:<\/p>","o":[{"l":"A","h":"Multiple exchange of cash flows up to the maturity of the swap based on the movement of the consumer price index"},{"l":"B","h":"A single exchange of cash flow at maturity based on the movement of the consumer price index"},{"l":"C","h":"Multiple exchange of cash flows up to the maturity of the swap based on the movement of LIBOR"},{"l":"D","h":"A single exchange of cash flow at maturity based on the movement of LIBOR"}],"a":"B","e":"<p>Unlike many other swaps, this only involves a single exchange of cash flow upon maturity based on an inflation index such as the CPI. Motivation might to be to hedge or speculate upon future inflation fluctuations.<\/p>"},{"s":5,"n":24,"id":"1014222","q":"<p>Which one of the following options embedded in a bond can be exercised by the issuer of the bond, under certain circumstances defined for that particular bond?<\/p>","o":[{"l":"A","h":"Putable"},{"l":"B","h":"Callable"},{"l":"C","h":"Convertible"},{"l":"D","h":"Warrant"}],"a":"B","e":"<p>A callable bond is a bond with a call option embedded in it. The call can be exercised by the issuer of the bond which allows, under certain circumstances defined for that particular bond, for example on certain dates (such as coupon dates) and at a certain strike price (often higher than par), the user to buy back the bond. Putable bonds and convertible bonds are bonds with embedded options that can be exercised by the holder. Warrants are not bonds themselves, but options attached to bonds that can be exercised by the holder.<\/p>"},{"s":5,"n":25,"id":"1014231","q":"<p>What type of option gives the holder the right to buy (or sell) an asset at the lowest (or highest) price over a period of time?<\/p>","o":[{"l":"A","h":"Barrier option"},{"l":"B","h":"Lookback option"},{"l":"C","h":"American option"},{"l":"D","h":"Ratchet option"}],"a":"B","e":"<p>A lookback option is a path dependent option and gives the holder this right.<\/p>"},{"s":5,"n":26,"id":"1037586","q":"<p>Which of the following BEST describes a disadvantage facing firms that choose the OTC market over the exchange-traded market?<\/p>","o":[{"l":"A","h":"Too much paperwork"},{"l":"B","h":"Too long a process"},{"l":"C","h":"Too much credit exposure"},{"l":"D","h":"Too many restrictions"}],"a":"C","e":"<p>The best answer to this is the credit exposure, due to the lack of a formalised central counterparty in most trades.<br/> Paperwork is not so much of a problem anymore, as increasingly electronic affirmation and confirmation systems are used. The adoption of FpML, a standardised electronic language for the OTC markets, by ISDA has added to this movement.<\/p>"},{"s":5,"n":27,"id":"1002835","q":"<p>Which of the following best describes a convertible bond?<\/p>","o":[{"l":"A","h":"A fixed rate bond and a call option on equity"},{"l":"B","h":"A floating rate bond and a call option on equity"},{"l":"C","h":"A fixed rate bond and a put option on equity"},{"l":"D","h":"A floating rate bond and a put option on equity"}],"a":"A","e":"<p>A convertible bond can be thought of as a 'straight' bond plus an option giving the right to buy the underlying equity. As such, a premium (inherent in the price of the convertible) will be paid for the call option.<\/p>"},{"s":5,"n":28,"id":"1036872","q":"<p>What is the purpose behind a firm maintaining adequate records of collateral?<\/p>","o":[{"l":"A","h":"To enable the return of identical assets when a client fulfils their obligations"},{"l":"B","h":"To enable the return of equivalent assets when a client fulfils their obligations"},{"l":"C","h":"To enable the return of identical assets when a client fails to fulfil their obligations"},{"l":"D","h":"To enable the return of equivalent assets when a client fails to fulfil their obligations"}],"a":"B","e":"<p>A firm only has to return equivalent, not identical assets.<\/p>"},{"s":5,"n":29,"id":"1037146","q":"<p>Which of the following is a single currency basis swap?<\/p>","o":[{"l":"A","h":"3m $ LIBOR for 6m £ LIBOR"},{"l":"B","h":"3m $ LIBOR for 6m $ LIBOR"},{"l":"C","h":"Fixed $ for floating $"},{"l":"D","h":"Fixed £ for floating £"}],"a":"B","e":"<p>A basis swap is where one floating rate is exchanged for a different floating rate. A single currency basis swap is where all payments are in the same currency.<\/p>"},{"s":5,"n":30,"id":"1014236","q":"<p>A bank believes that a  single debtor has become too risky for them to continue to take on the risk of their debt. What could the bank do to transfer the risk of the debtor to a third party?<\/p>","o":[{"l":"A","h":"Enter into a vanilla swap"},{"l":"B","h":"Sell a credit default swap"},{"l":"C","h":"Issue a credit linked note"},{"l":"D","h":"Issue a mortgage backed security"}],"a":"C","e":"<p>A credit linked note represents the amount borrowed by the debtor. The institution buying the note will benefit from any payments from the debtor, but is, however, taking on the risk of the debtor defaulting.<\/p>"},{"s":5,"n":31,"id":"1017341","q":"<p>The payout from which of the following products relies on the difference between the yield on a particular asset and a benchmark yield?<\/p>","o":[{"l":"A","h":"Overnight index swap"},{"l":"B","h":"Credit spread option"},{"l":"C","h":"Credit linked note"},{"l":"D","h":"Mark to market swap"}],"a":"B","e":"<p>A credit spread option offers the investor an opportunity to buy or sell the spread between two yields.<\/p>"},{"s":5,"n":32,"id":"1015733","q":"<p>An investor buys a bond with a BBB- credit rating. <br/> Why would they take out a credit default swap on the bond?<\/p>","o":[{"l":"A","h":"To increase the credit rating of the bond to AAA"},{"l":"B","h":"To sell the bond on at a profit"},{"l":"C","h":"To protect the investor from a credit event"},{"l":"D","h":"To swap the bonds income with the income of another asset"}],"a":"C","e":"<p>An investor would buy a credit default swap to protect himself from a credit event. If the bond did not suffer a credit event they would lose the premium that they paid for the swap.<\/p>"},{"s":5,"n":33,"id":"1014243","q":"<p>As identified by the ISDA credit support documentation, what is the main difference between UK and US law?<\/p>","o":[{"l":"A","h":"UK may use cash or collateral as margin whereas the US can use cash only"},{"l":"B","h":"UK may use cash only as margin whereas the US may use cash and collateral"},{"l":"C","h":"Any collateral deposited in the UK remains the legal property of the depositor whereas in the US title transfers to the holder"},{"l":"D","h":"Any collateral deposited in the US remains the legal property of the depositor whereas in the UK title transfers to the holder"}],"a":"D","e":"<p>US law dictates that a security interest of any collateral deposited as margin can be created instead of legal transfer of title. In the UK title transfers immediately.<\/p>"},{"s":5,"n":34,"id":"1037486","q":"<p>Which ONE of the following is a benefit of the over-the-counter derivatives market over the exchange-traded market?<\/p>","o":[{"l":"A","h":"Liquidity"},{"l":"B","h":"Reduced default risk"},{"l":"C","h":"Speed up trading"},{"l":"D","h":"Confidentiality"}],"a":"D","e":"<p>The others represent benefits of exchange traded derivatives.<\/p>"},{"s":5,"n":35,"id":"1015714","q":"<p>The current spot rate for sterling/euro is 1:1.6. If interest rates in the Eurozone are 4% pa and UK interest rates for the same period are 5% pa, the six-month forward rate would be quoted as:<\/p>","o":[{"l":"A","h":"1.6150"},{"l":"B","h":"1.6088"},{"l":"C","h":"1.5922"},{"l":"D","h":"1.5850"}],"a":"C","e":"<p>Forward rate = (1+r var) / (1+r base) x spot rate<br/> F = (1.02) / (1.025) x 1.6 <br/> F = 0.99512 x 1.6 = 1.5922<br/> Or<br/> UK: £1 x 1.025 = £1.025.<br/> Euro: €1.6 x €1.02 = €1.632.<br/> Therefore forward rate = 1.632/1.025 = 1.5922.<\/p>"},{"s":5,"n":36,"id":"1014239","q":"<p>Which of the following bodies sets out processes and documentation for the OTC derivatives markets?<\/p>","o":[{"l":"A","h":"International Capital Markets Association"},{"l":"B","h":"International Accounting Standards Board"},{"l":"C","h":"International Swaps and Derivatives Association"},{"l":"D","h":"Financial Conduct Authority"}],"a":"C","e":"<p>ISDA set-out the processes and documentation required for the OTC derivatives markets.<\/p>"},{"s":5,"n":37,"id":"1014221","q":"<p>Which one of the following is not a type of credit default swap (CDS)?<\/p>","o":[{"l":"A","h":"Currency"},{"l":"B","h":"Basic"},{"l":"C","h":"Index"},{"l":"D","h":"Basket"}],"a":"A","e":"<p>A currency swap is not a type of CDS. A basic CDS would target one type of asset to reference, a basket CDS would target a collection of assets to reference and an index CDS would target an index to reference.<\/p>"},{"s":5,"n":38,"id":"1014244","q":"<p>Which document sets out the relationship between two institutions when one party executes a trade but another party becomes the ultimate counterparty of the trade?<\/p>","o":[{"l":"A","h":"Master agreement"},{"l":"B","h":"Protocols"},{"l":"C","h":"Confirmations"},{"l":"D","h":"Master give up agreement"}],"a":"D","e":"<p>What is described in the question is a give up. The master give up agreement sets out the relationship between the broker performing the trade and the third party who becomes the ultimate counterparty to the trade.<\/p>"},{"s":5,"n":39,"id":"1014233","q":"<p>When an investor takes out an interest rate swap where the notional principal decreases over time the swap is said to be:<\/p>","o":[{"l":"A","h":"Amortising"},{"l":"B","h":"Compound"},{"l":"C","h":"Accreting"},{"l":"D","h":"Constant maturity"}],"a":"A","e":"<p>Most loans taken out amortise (decrease) over time as the investor pays off the principal. This type of swap gives protection for that type of loan.<\/p>"},{"s":5,"n":40,"id":"1014229","q":"<p>Which of the following is false concerning Bermudan options?<\/p>","o":[{"l":"A","h":"They can only be exercised on specified dates"},{"l":"B","h":"They can be exercised before expiry"},{"l":"C","h":"They are also called pseudo-American options"},{"l":"D","h":"They are generally traded on exchange"}],"a":"D","e":"<p>A Bermudan option can be exercised on expiry or on specified dates before expiry. They typically trade OTC. <\/p>"},{"s":5,"n":41,"id":"1015732","q":"<p>What is the benefit of trading derivatives over the counter (OTC)?<\/p>","o":[{"l":"A","h":"Increased liquidity"},{"l":"B","h":"Reduced counterparty risk"},{"l":"C","h":"Higher regulatory protection"},{"l":"D","h":"Flexibile contract terms"}],"a":"D","e":"<p>OTC trading allows bespoke contracts to be negotiated between buyers and sellers, giving more flexibility. However, this also reduces liquidity. OTC trades tend to be less protected by regulators, and the buyers and sellers are directly exposed to counterparty risk.<\/p>"},{"s":5,"n":42,"id":"1026859","q":"<p>Which of the following is a characteristic of a forward FX contract?<\/p>","o":[{"l":"A","h":"It is centrally cleared"},{"l":"B","h":"It is exchange-traded"},{"l":"C","h":"It is physically delivered"},{"l":"D","h":"It settles T + 2"}],"a":"C","e":"<p>Forward FX contracts are physically settled over-the-counter foreign exchange contracts.<\/p>"},{"s":5,"n":43,"id":"1052124","q":"<p>The EUR/GBP spot rate is 0.85. What is the three-month forward rate if interest rates in UK are at 3.5% p.a., and in the euro zone rates are 4% p.a.?<\/p>","o":[{"l":"A","h":"0.85495"},{"l":"B","h":"0.85195"},{"l":"C","h":"0.84895"},{"l":"D","h":"0.84695"}],"a":"C","e":"<p>As GBP is variable and the rate is less than the rate in the Eurozone, we must have a figure which is going to be lower than 0.85.<\/p><p>The equation is 1 + (0.035 x 3 / 12) divided by 1 + (0.04 x 3 / 12); the product is then multiplied by the spot, 0.85, giving the answer 0.849.<\/p><p>Fwd = (1.00875/1.01) x 0.85 = 0.84895<\/p>"},{"s":5,"n":44,"id":"1015527","q":"<p>An option where the holder has the right to buy or sell an asset at the lowest or highest price over a particular period of time is called?<\/p>","o":[{"l":"A","h":"A knock-out option"},{"l":"B","h":"A lookback option"},{"l":"C","h":"A ratchet"},{"l":"D","h":"A collar"}],"a":"B","e":"<p>This describes a lookback option<\/p>"},{"s":5,"n":45,"id":"1017385","q":"<p>When would the agreed amount be paid on a forward foreign exchange contract agreed over the counter?<\/p>","o":[{"l":"A","h":"On the date of the agreement"},{"l":"B","h":"On a daily basis"},{"l":"C","h":"On the fixing date"},{"l":"D","h":"On the settlement date"}],"a":"D","e":"<p>The agreed amount would be paid on the agreed settlement date.<\/p>"},{"s":5,"n":46,"id":"1017023","q":"<p>The US dollar/Japanese exchange rate is 1 USD = 100 JPY. The interest rate in US is 2% pa and 0% pa in Japan. What will be the three-month forward rate?<\/p>","o":[{"l":"A","h":"98.039"},{"l":"B","h":"102"},{"l":"C","h":"99.5025"},{"l":"D","h":"100.50"}],"a":"C","e":"<p>The forward rate is calculated as: Spot rate x 1 + variable exchange rate (yen rate) / 1 + fixed exchange rate (US dollar rate). We assume that the rate quoted (2%) is an annual rate; therefore it needs to be pro-rated to get the three-month rate. 100 x 1 / 1.005 = 99.5025<\/p>"},{"s":5,"n":47,"id":"1014234","q":"<p>How might an investor gain exposure to the returns on a portfolio of shares without incurring the cost of buying the shares and paying stamp duty?<\/p>","o":[{"l":"A","h":"Arrears swap"},{"l":"B","h":"Commodity swap"},{"l":"C","h":"Credit default swap"},{"l":"D","h":"Equity swap"}],"a":"D","e":"<p>The equity swap would involve the investor paying a rate of return on a deposit for the rate of change in the value of a share or basket of shares.<\/p>"},{"s":5,"n":48,"id":"1017033","q":"<p>Which of the following is the best description of a swaption?<\/p>","o":[{"l":"A","h":"The holder has the right to enter into an option"},{"l":"B","h":"The holder can exercise the option and enter into a swap"},{"l":"C","h":"The holder has the obligation to enter into a swap agreement"},{"l":"D","h":"The writer has the obligation to enter into an option"}],"a":"B","e":"<p>A swaption is an arrangement where the buyer of the swaption pays an upfront sum for the right to enter into a swap agreement by a pre-agreed date in the future.<\/p>"},{"s":5,"n":49,"id":"1014241","q":"<p>Which of the following is FALSE of an ISDA master agreement?<\/p>","o":[{"l":"A","h":"It allows for netting-off of payments"},{"l":"B","h":"It identifies events that could cause default"},{"l":"C","h":"It replaces confirmations"},{"l":"D","h":"It identifies events that could lead to termination of contracts"}],"a":"C","e":"<p>Although the master agreement does not replace confirmations, certain elements will be covered which will allow quicker confirmations to be processed.<\/p>"},{"s":5,"n":50,"id":"1052258","q":"<p>A firm that has a master agreement benefits in which of the following ways?<\/p>","o":[{"l":"A","h":"It allows confirmations to be considerably shorter"},{"l":"B","h":"It eliminates the need for confirmations"},{"l":"C","h":"It permits the firm to trade electronically"},{"l":"D","h":"It promotes the use of a central counterparty"}],"a":"A","e":"<p>A master agreement sets out the general terms of business between two counterparties. It is referred to in confirmations, allowing them to be shorter. Confirmations also make use of ISDA definitions, again to reduce the length of these documents.<\/p>"},{"s":6,"n":1,"id":"1014223","q":"<p>When a bank maintains a slightly higher level of collateral at all times than the risk as currently measured, this is due to:<\/p>","o":[{"l":"A","h":"Initial margin"},{"l":"B","h":"A down payment"},{"l":"C","h":"A haircut"},{"l":"D","h":"Variation margin"}],"a":"C","e":"<p>A haircut is where assets are valued for collateral purposes at less than their current market value.<\/p>"},{"s":6,"n":2,"id":"1015810","q":"<p>If there is a short-term highly volatile market, a clearing house will most likely take which of the following actions?<\/p>","o":[{"l":"A","h":"Increase variation margin payments"},{"l":"B","h":"Decrease initial margin payments"},{"l":"C","h":"Make intra-day margin calls"},{"l":"D","h":"Do nothing"}],"a":"C","e":"<p>If the volatility was short-term, a clearing house would require intra-day margin calls. If the market displayed long-term volatility, then it would increase initial margin.<\/p>"},{"s":6,"n":3,"id":"1017013","q":"<p>A client provides initial margin to their broker of £10,000 and the customer agreement has a margin call level of £8,000. Variation margin payments reduce the balance down to £7,750. Which of the following is TRUE?<\/p>","o":[{"l":"A","h":"The client will be required to make a payment of £250"},{"l":"B","h":"The client will be required to make a payment of £2,250"},{"l":"C","h":"The client will be required to make a payment of 10% of the initial margin"},{"l":"D","h":"The client will be required to close-out the position"}],"a":"B","e":"<p>If a margin call is triggered, the client is required to make a payment to restore the margin to the original initial margin level.<\/p>"},{"s":6,"n":4,"id":"1015807","q":"<p>Who is only able to clear trades on behalf of themselves and their clients?<\/p>","o":[{"l":"A","h":"Trade members"},{"l":"B","h":"General clearing member"},{"l":"C","h":"Non-clearing member"},{"l":"D","h":"Individual clearing member"}],"a":"D","e":"<p>This refers to the rights of individual clearing members. GCMs can clear on behalf of non-clearing members as well.<\/p>"},{"s":6,"n":5,"id":"1015785","q":"<p>Which statement best describes SPAN margin?<\/p>","o":[{"l":"A","h":"Maximum close-out cost of a defaulting member's positions"},{"l":"B","h":"Maximum close-out cost of any individual position of a defaulting member"},{"l":"C","h":"Minimum close-out cost of a defaulting member's position"},{"l":"D","h":"Minimum close-out cost of any individual position of a defaulting member"}],"a":"A","e":"<p>The margin requirements relate to the overall risk of a member defaulting, and may be reduced if the member has offsetting positions.<\/p>"},{"s":6,"n":6,"id":"1002803","q":"<p>Which of the following acts as central counterparty during novation?<\/p>","o":[{"l":"A","h":"A clearing house"},{"l":"B","h":"An exchange"},{"l":"C","h":"Universal Clearing Platform"},{"l":"D","h":"Member firms"}],"a":"A","e":"<p>The clearing house acts as central counterparty (CCP) in what is known as a PRINCIPAL-TO-PRINCIPAL arrangement.<\/p>"},{"s":6,"n":7,"id":"1014213","q":"<p>The process by which a clearing house becomes the central counterparty to all transactions on derivatives exchanges is called:<\/p>","o":[{"l":"A","h":"Registration"},{"l":"B","h":"Clearance"},{"l":"C","h":"Novation"},{"l":"D","h":"Margin"}],"a":"C","e":"<p>Novation is the process by which the clearing house becomes the central counterparty to exchange-traded transactions.<\/p>"},{"s":6,"n":8,"id":"4211290","q":"<p>What is the primary purpose of the Uncleared Margin Rules (UMR) introduced by the Basel Committee on Banking Supervision (BCBS)?<\/p>","o":[{"l":"A","h":"To eliminate the need for collateral in OTC derivatives trading"},{"l":"B","h":"To reduce systemic risks and enhance transparency in the uncleared OTC derivatives market"},{"l":"C","h":"To centralize all OTC derivatives through a single clearinghouse"},{"l":"D","h":"To minimize transaction costs in the OTC derivatives market"}],"a":"B","e":"<p>The UMR were introduced to address counterparty credit and default risks in the OTC derivatives market, which was seen as contributing to the severity of the 2007-08 global financial crisis. The rules aim to reduce systemic risk and improve transparency by implementing margin requirements for uncleared derivatives.<\/p>"},{"s":6,"n":9,"id":"1036900","q":"<p>What type of guarantee is offered by clearing houses that novate trades?<\/p>","o":[{"l":"A","h":"Agent to principal"},{"l":"B","h":"Principal to agent"},{"l":"C","h":"Agent to selling agent"},{"l":"D","h":"Principal to principal"}],"a":"D","e":"<p>Clearing houses offer principal to principal guarantee, which means that if the broker of a client defaults, the clearing house will guarantee performance only to the broker of the counterparty, not the client of the defaulting broker.<\/p>"},{"s":6,"n":10,"id":"1017317","q":"<p>Which of the following could a UK clearing house accept from a clearing member as collateral?<\/p>","o":[{"l":"A","h":"Warrants which traded over the counter"},{"l":"B","h":"German shares of companies listed within the DAX"},{"l":"C","h":"Euro denominated Swiss government bonds"},{"l":"D","h":"Euro denominated Spanish government bonds"}],"a":"D","e":"<p>Swiss government bonds which are in a foreign currency are not on the list of acceptable collateral.<\/p>"},{"s":6,"n":11,"id":"1002805","q":"<p>What actions are a non-clearing dealer member of an exchange permitted to do?<\/p>","o":[{"l":"A","h":"Trade and clear for themselves and their clients"},{"l":"B","h":"Trade and clear for themselves only"},{"l":"C","h":"Trade for themselves and their clients"},{"l":"D","h":"Trade for themselves only"}],"a":"D","e":"<p>A dealer is permitted to deal in principal only - brokers can act as agent for their clients.<\/p>"},{"s":6,"n":12,"id":"4211294","q":"<p>Which of the following derivatives are included in the scope of the Uncleared Margin Rules (UMR)?<\/p>","o":[{"l":"A","h":"Cleared interest rate swaps"},{"l":"B","h":"Non-deliverable forwards (NDFs)"},{"l":"C","h":"Physically settled commodity futures"},{"l":"D","h":"Cash settled exchange-traded futures contracts"}],"a":"B","e":"<p>Under the UMR, non-deliverable forwards (NDFs) are included in the scope of derivatives subject to margin requirements. In contrast, exchange-traded and cleared derivatives are generally out of scope for UMR, as they are typically subject to different regulatory requirements.<\/p>"},{"s":6,"n":13,"id":"1037588","q":"<p>What is the main reason for an exchange declaring in the contract specifications the mechanism through which it will calculate EDSP?<\/p>","o":[{"l":"A","h":"To allow the investor to know the EDSP before opening a position"},{"l":"B","h":"To ensure that the future's closing price is not affected by the cash price"},{"l":"C","h":"To allow the investors to hedge against default"},{"l":"D","h":"To ensure that price manipulation is avoided"}],"a":"D","e":"<p>The EDSP must be a fair representation of the underlying asset price on expiry, and to do this EDSP is disclosed to all in the contract specifications. This transparency is the best way to avoid any price manipulation of the contract up to expiry.<\/p>"},{"s":6,"n":14,"id":"1051528","q":"<p>Why is it important to capture a trade as soon as it has been struck?<\/p>","o":[{"l":"A","h":"Risk management purposes"},{"l":"B","h":"To comply with BIS regulatory requirements"},{"l":"C","h":"Exchange traded deals only must be manually captured, as they are not captured automatically"},{"l":"D","h":"OTC derivative trades do not need to be captured"}],"a":"A","e":"<p>A trade must be captured in order for risk management can take place. BIS is a regulatory body that is not mentioned in the CISI derivatives material.<\/p>"},{"s":6,"n":15,"id":"1016985","q":"<p>Which of the following types of margin would allow future margin payments to be deducted from initial margin?<\/p>","o":[{"l":"A","h":"Intra-day margin"},{"l":"B","h":"Maintenance margin"},{"l":"C","h":"Variation margin"},{"l":"D","h":"Net margin"}],"a":"B","e":"<p>This is a description of a maintenance margin system where variation margin payments are netted-off against initial margin.<\/p>"},{"s":6,"n":16,"id":"1036814","q":"<p>Which of the following is an unacceptable form of collateral for initial margin of a FTSE 100 contract for differences?<\/p>","o":[{"l":"A","h":"FTSE 100 equities"},{"l":"B","h":"A dollar denominated T-bond"},{"l":"C","h":"A sterling denominated gilt-edged security"},{"l":"D","h":"A euro denominated bund"}],"a":"A","e":"<p>Please note that this question is asking for an incorrect statement.<br/> Government bonds are permitted providing they are denominated in the currency of the issuing government. A euro denominated gilt would therefore NOT be acceptable. Equities can no longer be held as collateral with UK clearing houses.<\/p>"},{"s":6,"n":17,"id":"1017328","q":"<p>Once a trade has been allocated or given up to the global clearer, which of the following occurs?<\/p>","o":[{"l":"A","h":"Executing broker's exposure to counterparty risk ceases"},{"l":"B","h":"Global clearer assumes 50% of the exposure to counterparty risk"},{"l":"C","h":"Exposure to counterparty risk remains entirely with the executing broker"},{"l":"D","h":"Exposure to counterparty risk remains entirely with the client"}],"a":"A","e":"<p>Once the trade has been allocated the executing broker's exposure to counterparty risk ceases.<\/p>"},{"s":6,"n":18,"id":"1002796","q":"<p>What are the daily movements paid on a futures position on an exchange called?<\/p>","o":[{"l":"A","h":"Initial margin"},{"l":"B","h":"Intrinsic value"},{"l":"C","h":"Variation margin"},{"l":"D","h":"Time value"}],"a":"C","e":"<p>Initial margin - an initial security deposit with the clearing house.<br/> Variation margin - additional deposits on a DAILY basis as the value of the position moves.<\/p>"},{"s":6,"n":19,"id":"1040403","q":"<p>Spot month margin is best described as?<\/p>","o":[{"l":"A","h":"Additional variation margin in the delivery month"},{"l":"B","h":"An intra-day margin call"},{"l":"C","h":"Additional initial margin in the delivery month"},{"l":"D","h":"Buffer margin"}],"a":"C","e":"<p>Spot month margins occur in the delivery month and are charged in addition to initial margin. Therefore C is the best answer.<\/p>"},{"s":6,"n":20,"id":"1047184","q":"<p>The Singapore Exchange (SGX) has pioneered a mutual offset system (MOS) for Japanese Government bond (JGB) futures since 1984 with which other exchange?<\/p>","o":[{"l":"A","h":"Chicago Board of Trade (CBOT)"},{"l":"B","h":"Chicago Board Options Exchange (CBOE)"},{"l":"C","h":"ICE futures"},{"l":"D","h":"Chicago Mercantile Exchange (CME)"}],"a":"D","e":"<p>This system is also available for Nikkei 225, Eurodollar and Euroyen futures.<\/p>"},{"s":6,"n":21,"id":"1002789","q":"<p>For which of the following option positions is it possible for the clearing house to require variation margin payments?<\/p>","o":[{"l":"A","h":"Option buyers only"},{"l":"B","h":"Option sellers only"},{"l":"C","h":"Both option buyers and sellers"},{"l":"D","h":"Neither the option seller nor buyer"}],"a":"C","e":"<p>It is possible for both buyers and seller of options to be charged variation margin. Buyers and sellers of options on futures pay variation margin.<\/p>"},{"s":6,"n":22,"id":"1026881","q":"<p>In relation to the order process, which is the correct order?<\/p>","o":[{"l":"A","h":"Trade verification, settlement and reconciliation"},{"l":"B","h":"Reconciliation, trade verification and settlement"},{"l":"C","h":"Settlement, trade verification and reconciliation"},{"l":"D","h":"Trade verification, reconciliation and settlement"}],"a":"A","e":"<p>This is an obscure question and the answer reflects the sequence in the CISI manual.<br/> Correct order is: Trade verification Settlement Reconciliation<\/p>"},{"s":6,"n":23,"id":"1015809","q":"<p>Which of the following is the best description of the principal-to-principal guarantee structure?<\/p>","o":[{"l":"A","h":"The guarantee extends from the customer to the clearing house"},{"l":"B","h":"The guarantee operates between the customer and broker"},{"l":"C","h":"The guarantee operates between the broker and the clearing member"},{"l":"D","h":"The guarantee operates between the clearing member and the clearing house"}],"a":"D","e":"<p>The clearing house guarantees trades between itself and the clearing member only.<\/p>"},{"s":6,"n":24,"id":"1015699","q":"<p>Which of the following best describes the purpose of price limits?<\/p>","o":[{"l":"A","h":"Ensure good liquidity across major contracts"},{"l":"B","h":"Prevent a build-up of dominant positions which lead to potential abusive squeezes"},{"l":"C","h":"Ensure that longs and shorts are able to honour commitments to make or take delivery of a physical asset"},{"l":"D","h":"Prevent the market moving too far too fast during a trading session"}],"a":"D","e":"<p>Price limits are circuit breakers imposed by the exchange that place limits on absolute price movements on the contract on any day. If the limit is breached (limit up/limit down), trading in the contract halts for a few minutes. The idea is that, at a time when markets are subject to extreme price movements, a trading halt gives participants time to calm down and take a more reasoned view about trading conditions.<\/p>"},{"s":6,"n":25,"id":"1037141","q":"<p>Which of the following best describes the main role of TIMs?<\/p>","o":[{"l":"A","h":"Credit and counterparty risk management"},{"l":"B","h":"To provide a portfolio-based margining methodology for measuring the risk of mixed portfolios"},{"l":"C","h":"Providing guaranteed settlement for derivatives positions"},{"l":"D","h":"Facilitating hedging positions for fund managers"}],"a":"B","e":"<p>TIMS uses a portfolio-based margining methodology and is particularly well suited for measuring the risk of mixed portfolios (those containing physicals, futures and options). TIMS uses an option pricing model to identify the risks of options on a specific underlying asset which have different strike prices and maturities, and provides for offsets between positions in different, but highly correlated, underlying assets.<\/p>"},{"s":6,"n":26,"id":"1017361","q":"<p>What is the difference between the margin called by the clearing house and the margin arrangements between a private customer and their broker?<\/p>","o":[{"l":"A","h":"Variation margin is calculated on a daily basis"},{"l":"B","h":"Single currency margining is used by the clearing house"},{"l":"C","h":"The clearing house only uses a single system for payments and margin"},{"l":"D","h":"The clearing house only uses a risk based approach"}],"a":"C","e":"<p>Answer C is the best answer. To facilitate variation margin credits/debits all clearing members will be linked by a single payment system with the clearing house whereas brokers will use different systems with their clients.<\/p>"},{"s":6,"n":27,"id":"1051973","q":"<p>When the Delta of an option increases, which of the following is most likely?<\/p>","o":[{"l":"A","h":"Variation margin paid by the short will increase"},{"l":"B","h":"Variation margin paid by the long will decrease"},{"l":"C","h":"Variation margin paid by the short will decrease"},{"l":"D","h":"Variation margin paid by the long will increase"}],"a":"A","e":"<p>The risk of exercise against the short will rise, hence their variation margin payments are likely to be greater since the option is moving further in-to-the-money.<\/p>"},{"s":6,"n":28,"id":"1015830","q":"<p>At what stage does a clearing house become the central counterparty to a trade?<\/p>","o":[{"l":"A","h":"When the trade is struck"},{"l":"B","h":"When the trade is reported"},{"l":"C","h":"When the trade is settled"},{"l":"D","h":"When the trade is registered"}],"a":"D","e":"<p>Once the trade has been allocated and assigned in the Universal Clearing Platform, it is then passed onto the clearing house.<\/p>"},{"s":6,"n":29,"id":"1015754","q":"<p>A 'give-up' occurs when:<\/p>","o":[{"l":"A","h":"The investor of a deeply out-of-the-money option abandons the option"},{"l":"B","h":"The investor of a call option sells a call option at a higher strike to give-up the potential for profit beyond a certain level on a mildly bullish position"},{"l":"C","h":"A non-clearing member of the exchange allocates a trade to a general clearing member in order for the trade to be novated through ICE Clear Europe"},{"l":"D","h":"The writer of a call option buys a call option at a higher strike to limit downside above a certain underlying price"}],"a":"C","e":"<p>A give-up is when a trade is allocated to a clearing member because the trader is a non-clearing member.<\/p>"},{"s":6,"n":30,"id":"1002787","q":"<p>The role of counterparty to the buyer of an exchange-traded futures contract is taken over from the seller by:<\/p>","o":[{"l":"A","h":"A consortium of member firms"},{"l":"B","h":"The clearing member through which the contract was sold"},{"l":"C","h":"A clearing house"},{"l":"D","h":"An exchange"}],"a":"C","e":"<p>All exchange trades are settled via a clearing house acting as central counterparty. As central counterparty, a clearing house is the buyer against every short-trade, and the seller against every long-trade.<\/p>"},{"s":6,"n":31,"id":"1026883","q":"<p>A small broker is owned by a large bank. The broker, as a clearing member, has a loss-making position in a derivatives contract, which has been cleared by a central counterparty (clearing house). Initially the parent bank funds the variation margin payments. The broker eventually stops being able to meet its variation margin payments.<br/> Who DIRECTLY bears the risk of the broker's default?<\/p>","o":[{"l":"A","h":"The parent bank"},{"l":"B","h":"The clearing house"},{"l":"C","h":"The exchange"},{"l":"D","h":"The exchange members"}],"a":"B","e":"<p>Having had the trade novated, the clearing house is the best answer. Will bear the risk of default.<\/p>"},{"s":6,"n":32,"id":"1015709","q":"<p>What is the name of the system that calculates margin payments of options and futures portfolios?<\/p>","o":[{"l":"A","h":"Universal Clearing Platform"},{"l":"B","h":"Clearing processing system"},{"l":"C","h":"Theoretical inter-market clearing system"},{"l":"D","h":"Standard portfolio analysis of risk"}],"a":"D","e":"<p>SPAN is the only system given that calculates margin payments. Other systems include TIMS (Theoretical inter-market margining system) and STANS.<\/p>"},{"s":6,"n":33,"id":"1037117","q":"<p>Which system connects CME and SGX to allow the transfer of positions?<\/p>","o":[{"l":"A","h":"Book entry transfer system"},{"l":"B","h":"Mutual offset trading link"},{"l":"C","h":"Connect"},{"l":"D","h":"Net futures trading system"}],"a":"B","e":"<p>The mutual offset trading link allows cross settlement between CME and SGX for Nikkei 225 futures.<\/p>"},{"s":6,"n":34,"id":"1036700","q":"<p>Which of the following will a broker normally do if a client has used up their credit line?<\/p>","o":[{"l":"A","h":"Close the position"},{"l":"B","h":"Inform the FCA"},{"l":"C","h":"Increase charges"},{"l":"D","h":"Call additional collateral from the client"}],"a":"D","e":"<p>The broker will extend the credit available to the client provided they can supply the appropriate additional collateral to the broker.<\/p>"},{"s":6,"n":35,"id":"1051977","q":"<p>Collateral for initial margin payments deposited with a UK clearing house cannot be in which of the following forms?<\/p>","o":[{"l":"A","h":"Corporate bonds"},{"l":"B","h":"Certificates of deposit"},{"l":"C","h":"German Bobls"},{"l":"D","h":"Treasury bills"}],"a":"A","e":"<p>Only major government bonds and bills and cash based securities are permitted.<\/p>"},{"s":6,"n":36,"id":"1015788","q":"<p>Which of the following is the best definition of the closing range?<\/p>","o":[{"l":"A","h":"The weighted-average of the traded prices during the closing period"},{"l":"B","h":"The average of the traded prices during the closing period"},{"l":"C","h":"The settlement price"},{"l":"D","h":"The highest and lowest price during the closing period"}],"a":"D","e":"<p>The closing range is the highest and lowest prices, or bids and offers, recorded during the period designated as the official close by the exchange.<br/> The settlement price is normally determined using an average of the contract values in a set period of time prior to delivery.<\/p>"},{"s":6,"n":37,"id":"4211295","q":"<p>Under the Uncleared Margin Rules (UMR), what is the significance of the €50 million collateral threshold for initial margin?<\/p>","o":[{"l":"A","h":"It sets the maximum allowable collateral for any single transaction."},{"l":"B","h":"It exempts firms from posting initial margin if their total exceeds this threshold."},{"l":"C","h":"It requires firms to post collateral only if their AANA is below this level."},{"l":"D","h":"It indicates the minimum level of initial margin required before it becomes mandatory to collect."}],"a":"D","e":"<p>The €50 million threshold under UMR is the point at which initial margin becomes obligatory. If the calculated initial margin for uncleared derivatives is below this threshold, it is not mandatory to post initial margin, but any amount above this threshold must be collected.<\/p>"},{"s":6,"n":38,"id":"4211291","q":"<p>Which of the following derivatives are included in the scope of the Uncleared Margin Rules (UMR), and what is the significance of the Aggregate Average Notional Amount (AANA) calculation for these derivatives?<\/p>","o":[{"l":"A","h":"Non-deliverable forwards (NDFs) and swaptions; AANA determines eligibility for mandatory margin exchange"},{"l":"B","h":"Exchange-traded derivatives; AANA determines daily trading volume limits"},{"l":"C","h":"Interest rate products only; AANA defines the regulatory reporting frequency"},{"l":"D","h":"Physical FX forwards and swaps; AANA is used to calculate collateral haircuts"}],"a":"A","e":"<p>Non-deliverable forwards (NDFs) and swaptions are among the derivatives in scope for UMR. The AANA calculation is used to determine whether an entity is above the threshold for mandatory margin exchange, specifically assessing if their notional amount in uncleared derivatives requires them to post initial and variation margins under UMR.<\/p>"},{"s":6,"n":39,"id":"1016983","q":"<p>Which system is used by ICE Clear Europe to calculate initial margin on an interest rate futures contract?<\/p>","o":[{"l":"A","h":"PAIRS"},{"l":"B","h":"CPS"},{"l":"C","h":"UCP"},{"l":"D","h":"SPAN"}],"a":"D","e":"<p>The SPAN system is used by LCH and ICE Clear Europe to calculate initial margin.<\/p>"},{"s":6,"n":40,"id":"4211292","q":"<p>What is the Aggregate Average Notional Amount (AANA) calculation used for in the context of the Uncleared Margin Rules (UMR)?<\/p>","o":[{"l":"A","h":"To determine the daily trading limits for OTC derivatives"},{"l":"B","h":"To establish the regulatory reporting frequency for derivative trades"},{"l":"C","h":"To determine the eligibility for tax exemptions on derivative transactions"},{"l":"D","h":"To assess whether an entity exceeds the threshold for mandatory initial margin under UMR"}],"a":"D","e":"<p>The AANA calculation is used to determine if an entity's uncleared derivative positions exceed the threshold for being subject to the initial margin requirements under UMR. It involves calculating the total notional value of all outstanding uncleared derivatives over a specific period.<\/p>"},{"s":6,"n":41,"id":"1002918","q":"<p>Which of the following is a reason for position limits?<\/p>","o":[{"l":"A","h":"Limit costs"},{"l":"B","h":"Limit gains"},{"l":"C","h":"Limit losses"},{"l":"D","h":"Limit exposure"}],"a":"D","e":"<p>Positions limits are used to prevent investors gaining dominant positions in a particular market.<br/> There are none in the UK.<\/p>"},{"s":6,"n":42,"id":"1040404","q":"<p>A bank requests a 'haircut' on a deal. What are they requesting?<\/p>","o":[{"l":"A","h":"A tighter spread on the deal"},{"l":"B","h":"Higher collateral"},{"l":"C","h":"A lower interest rate"},{"l":"D","h":"Lower commission"}],"a":"B","e":"<p>A haircut occurs when collateral is discounted. So if a bank applies a haircut, more collateral will be required.<\/p>"},{"s":6,"n":43,"id":"1037585","q":"<p>ICE Clear Europe offers a mutual guarantee that includes default protection through the use of a default fund. How are each member's contributions to this default fund calculated for their exchange traded contracts?<\/p>","o":[{"l":"A","h":"A sum equal to the total average daily value of their derivative positions over a three month period"},{"l":"B","h":"A sum equal to the total average daily value of initial margin held with ICE Clear Europe over a three month period"},{"l":"C","h":"A proportion of the member's daily average value of margin held with ICE Clear Europe over a three month period"},{"l":"D","h":"A proportion of the notional value of the default fund based on the average daily volume and value of trades conducted over a three month period"}],"a":"D","e":"<p>This is a very technical question, and not really covered in the syllabus. This question has appeared in the exam, however, so is worth discussing here.<br/> The default fund has a notional value that needs to be contributed.<br/> When calculating a member's contributions to this, the clearing house will look at the volume and value of trades conducted by a member over a three month period as a proportion of the total volume and value of trades cleared by all members. The members then contribute funds that will cover this proportion of activity.<br/> Although you will never be asked to calculate this, it is worth looking at an example:<br/> If a firm's average daily volume of contracts was 5% of the total average daily volume cleared by the clearing house, and the firm's average daily initial margin contribution was 8% of the total average daily initial margin contribution, then the clearing house would halve each (2.5% and 4% respectively) and add both to get a proportion of 6.5%.<\/p>"},{"s":6,"n":44,"id":"1017348","q":"<p>Which types of transaction may an exchange member deduct margin payments from its house account?<\/p>","o":[{"l":"A","h":"Principal trades only"},{"l":"B","h":"Client trades only"},{"l":"C","h":"Principal and client trades"},{"l":"D","h":"Internal transfers only"}],"a":"C","e":"<p>Members may deduct margin payments from its house account for principal and client trades.<\/p>"},{"s":6,"n":45,"id":"1036912","q":"<p>Which of the following best describes the process of clearing in financial markets?<\/p>","o":[{"l":"A","h":"Recording and matching trades to confirm obligations between counterparties"},{"l":"B","h":"Ensure legal obligations resulting from a trade are met"},{"l":"C","h":"Transferring ownership of securities and funds between buyer and seller"},{"l":"D","h":"Facilitating continuous trading activity throughout the day"}],"a":"A","e":"<p>Clearing is the process that occurs after a trade is executed and before settlement. It involves recording and matching trades, and ensuring that the obligations of each party are accurately confirmed before the final transfer of securities and funds takes place.<\/p>"},{"s":6,"n":46,"id":"1037008","q":"<p>The process of substituting a new contract for an old contract or a new counterparty for the original counterparty is known as:<\/p>","o":[{"l":"A","h":"Registration"},{"l":"B","h":"Novation"},{"l":"C","h":"Allocation"},{"l":"D","h":"Dematerialisation"}],"a":"B","e":"<p>This is the definition of the process of novation which occurs when a clearing house becomes a counterparty to the contract.<\/p>"},{"s":6,"n":47,"id":"1015821","q":"<p>Which of the following risks does novation remove entirely?<\/p>","o":[{"l":"A","h":"Settlement risk"},{"l":"B","h":"Principal risk"},{"l":"C","h":"Member counterparty risk"},{"l":"D","h":"Trading risk"}],"a":"C","e":"<p>Counterparty risk is removed by the clearing house becoming the central counterparty on trades.<\/p>"},{"s":6,"n":48,"id":"1002794","q":"<p>Between the clearing house and a general clearing member, which of the following are true regarding exchange options on futures?<\/p><p class=\"rom\"><b>I<\/b> Premiums are paid upfront<\/p><p class=\"rom\"><b>II<\/b> Long-option positions are margined daily<\/p><p class=\"rom\"><b>III<\/b> Option positions are margined any time up to expiry<\/p><p class=\"rom\"><b>IV<\/b> Only short-option positions are margined<\/p>","o":[{"l":"A","h":"I and II"},{"l":"B","h":"II and III"},{"l":"C","h":"III and IV"},{"l":"D","h":"I and IV"}],"a":"B","e":"<p>Options on futures (buy or sell) are margined in the same way as futures contracts. Premiums are paid at exercise or expiry, whichever occurs earlier.<\/p>"},{"s":6,"n":49,"id":"1037026","q":"<p>When a exchange member passes a trade to another member this is called:<\/p>","o":[{"l":"A","h":"Assignment"},{"l":"B","h":"Novation"},{"l":"C","h":"Matching"},{"l":"D","h":"A give-up"}],"a":"D","e":"<p>This is the process of allocation or 'give-ups'. Usually this is separating the process of trade execution and then passing the trade to a clearing member to clear.<\/p>"},{"s":6,"n":50,"id":"1015708","q":"<p>In the case of a member defaulting on the delivery or payment of a contract, which of the following would the UK clearing house access after the defaulting member's margin and the member’s contribution to the default fund?<\/p>","o":[{"l":"A","h":"The clearing house's insurance"},{"l":"B","h":"The clearing house's own funds"},{"l":"C","h":"Short-term loans from a BCD approved bank"},{"l":"D","h":"Other members' contributions to the default fund"}],"a":"D","e":"<p>After the defaulting member's resources have been exhausted, other members' contributions to the default fund are used. If the default fund is used-up, the clearing house needs to cover any remaining losses, but this time the liability is unlimited.<\/p>"},{"s":6,"n":51,"id":"1015744","q":"<p>A clearing house would use a protected payment system for:<\/p>","o":[{"l":"A","h":"A registration system"},{"l":"B","h":"A trading system"},{"l":"C","h":"A margin system"},{"l":"D","h":"A payment collection system"}],"a":"D","e":"<p>Clearing houses use protected payment systems to collect margin owed via an automatic debit from bank accounts of members.<\/p>"},{"s":6,"n":52,"id":"1017329","q":"<p>A clearing member is concerned about being exposed to credit risk from their clients activities, as a result will use a position limit. Which of the follow combinations of trades is MOST likely incur a position limit?<\/p>","o":[{"l":"A","h":"Long call, long put on same underlying"},{"l":"B","h":"Short future, long call on same underlying"},{"l":"C","h":"Long future, short call on same underlying"},{"l":"D","h":"Short call, long put on same underlying"}],"a":"D","e":"<p>This will result in a synthetic short future and will expose the clearing member to the most risk.<br/> LC and LP gives a long straddle or strangle.<br/> SF and LC give a synthetic LP<br/> LF and SC give a synthetic SP<\/p>"},{"s":6,"n":53,"id":"1026836","q":"<p>Once a clearing house has performed novation, which of the following best describes the relationship between the parties involved?<\/p>","o":[{"l":"A","h":"The buyer remains contractually bound to the seller"},{"l":"B","h":"The buyer remains contractually bound to the seller, but the clearing house guarantees that each will meet their obligations"},{"l":"C","h":"The contracts of the buyer and seller are closed out, crystallising any profit or loss"},{"l":"D","h":"The buyer and the seller each become contractually bound to the clearing house"}],"a":"D","e":"<p>Novation is where the clearing house acts as central counterparty to the trade, dealing as principal to both sides.<\/p>"},{"s":6,"n":54,"id":"1026833","q":"<p>If a member of a clearing house operating an independent guarantee defaults on payment of their obligations, which of the following is true?<\/p>","o":[{"l":"A","h":"The clearing house will use any funds of the other members only to pay the default"},{"l":"B","h":"The clearing house will use any funds of the defaulting member to pay the default, then use other members' funds if there is any shortfall"},{"l":"C","h":"The clearing house will use any funds of the defaulting member to pay the default amount, then cover the difference itself before making a claim on the member firm"},{"l":"D","h":"The clearing house will use any funds of the defaulting member to pay the default amount, then cover the difference by making a claim on the member firm"}],"a":"C","e":"<p>An independent guarantee is one where the clearing house will first use the funds of the clearing member and then be obliged to cover the difference themselves. Nevertheless, the clearing house will try to recover the shortfall from the defaulting member.<\/p>"},{"s":6,"n":55,"id":"1002798","q":"<p>Which of the following best describes variation margin?<\/p>","o":[{"l":"A","h":"It is a cash deposit with a clearing house to cover adverse daily movements in futures positions beyond the previous day's closing price"},{"l":"B","h":"It is cash deposited with a clearing house to cover the maximum likely daily loss arising from the futures contract"},{"l":"C","h":"It is cash deposited with an exchange to cover the maximum likely daily loss arising from the futures contract"},{"l":"D","h":"It is cash deposited with an exchange to cover the adverse movements in futures positions beyond a specified point"}],"a":"A","e":"<p>The BEST description of variation margin (VM) out of these choices is 'it is a cash deposit with a clearing house to cover adverse daily movements in futures positions beyond the previous day's closing price'. Variation margin would be a payment TO a clearing house if the futures position moves against its opening price. However, it would be paid FROM a clearing house if the price moved in the investor's favour. Initial margin is the margin taken by a clearing house to cover against the maximum daily adverse movement of the contract.<\/p>"},{"s":6,"n":56,"id":"1026871","q":"<p>A mutual offset system allows an investor to open and close out positions in the same contract on different exchanges. Which exchanges offer a mutual offset for their Japanese Government Bond (JGB) products?<\/p>","o":[{"l":"A","h":"SGX and CME Group"},{"l":"B","h":"Osaka and CME Group"},{"l":"C","h":"Tokyo Stock Exchange and CME Group"},{"l":"D","h":"Euronext and CME Group"}],"a":"A","e":"<p>This facility is offered by SGX and CME Group.<\/p>"},{"s":6,"n":57,"id":"1002913","q":"<p>What do some exchanges have in place to avoid excessive volatility in prices?<\/p>","o":[{"l":"A","h":"Delayed price disclosure"},{"l":"B","h":"Price limits"},{"l":"C","h":"Position limits"},{"l":"D","h":"Official prices"}],"a":"B","e":"<p>A price limit is the maximum amount a contract can trade away from its previous price before the exchange calls a temporary halt to trading.<\/p>"},{"s":6,"n":58,"id":"1015777","q":"<p>The maximum movement in price during the trading day would be known as:<\/p>","o":[{"l":"A","h":"The spread"},{"l":"B","h":"The intra-day range"},{"l":"C","h":"The premium"},{"l":"D","h":"Basis"}],"a":"B","e":"<p>A common sense answer.<\/p>"},{"s":6,"n":59,"id":"1037081","q":"<p>What adjustment is made to the calculated SPAN scanning risk to adjust for offsetting futures positions?<\/p>","o":[{"l":"A","h":"Spot month charges"},{"l":"B","h":"Variation margin"},{"l":"C","h":"Inter-commodity spread margin"},{"l":"D","h":"Short option minimum charge"}],"a":"C","e":"<p>When calculating scanning risk an adjustment is made to take account of inter-commodity spreads, e.g. long gilt future, short bund future. Because these two positions offset each others risk, at least to a certain extent, the adjustment is subtracted from scanning risk. Note that inter-commodity spread margin is also called inter-commodity credits.<\/p>"},{"s":6,"n":60,"id":"1002
