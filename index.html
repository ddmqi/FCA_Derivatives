:"<p>Which of the following would be the best definition of a block trade?<\/p>","o":[{"l":"A","h":"It is the simultaneous exchange of a financial asset, together with an appropriate offsetting number of futures contracts, in a privately negotiated transaction between two parties"},{"l":"B","h":"It gives any exchange member the freedom to customise the trades with respect to the strike/exercise price and expiration date"},{"l":"C","h":"It allows members and their wholesale clients to transact business as bilaterally agreed transactions without delay and with certainty of price and execution"},{"l":"D","h":"It is an off-market transaction that involves the swapping (or exchanging) of an OTC position for a futures position"}],"a":"C","e":"<p>A block trade is a large transaction made between an exchange member and a wholesale client. The exchange specifies the size of the transaction that is required before it becomes a block trade. Block trades are allowed to be negotiated away from the central order book as long as they are reported into the exchange once they are agreed. The block trade facility allows members and their wholesale clients (those with sufficient knowledge, expertise and understanding) to transact business as bilaterally agreed transactions without delay and with certainty of price and execution. The block trade facility complements the central markets, which continue to be the primary method for trading.<\/p>"},{"s":3,"n":7,"id":"1026882","q":"<p>A cross trade occurs when:<\/p>","o":[{"l":"A","h":"A member conducts a trade with a client and takes an offsetting position in the same security in his book"},{"l":"B","h":"A member conducts a trade and takes a position in his book in a different security"},{"l":"C","h":"A member conducts a trade for two clients in two different securities"},{"l":"D","h":"A member conducts offsetting trades in the same security for two different clients"}],"a":"D","e":"<p>The member buys from one client, and simultaneously sells to the other client, thereby 'crossing' the clients. <\/p>"},{"s":3,"n":8,"id":"1015776","q":"<p>The exchange disseminates the trade reporting information through a price feed to its members. Which of the following information is most likely to be available?<\/p>","o":[{"l":"A","h":"Buying and selling prices only shown by delivery month"},{"l":"B","h":"Volume, open interest, a range of price information all shown by delivery month"},{"l":"C","h":"Volume, open interest and buying and selling prices only shown by delivery month"},{"l":"D","h":"Volume, open interest, a range of price information shown by the nearest delivery month only"}],"a":"B","e":"<p>The screens are designed to report all data that traders and investors wish to know. This will include volume traded and open interest (as at the close of the previous business day), plus price information showing the opening price, the closing price (again, as at the close of the previous business day), the price of the last trade, and the day’s high and low prices, all shown by delivery month. This data is made available both via real-time price feeds and on a delayed basis.<\/p>"},{"s":3,"n":9,"id":"4211287","q":"<p>In what situation might a client decide to use a non-segregated account, despite the potential risks associated with firm default?<\/p>","o":[{"l":"A","h":"To gain flexibility in choosing their broker's investment strategies"},{"l":"B","h":"To benefit from a potentially higher cash flow efficiency for the broker"},{"l":"C","h":"To guarantee lower fees due to reduced regulatory requirements"},{"l":"D","h":"To ensure their assets are protected from the firm's creditors"}],"a":"B","e":"<p>A client might choose a non-segregated account because it can provide cash flow benefits to the clearing firm, as credit positions offset any debit positions. However, this comes with the risk that the client's assets are not protected in case of the firm’s default.<\/p>"},{"s":3,"n":10,"id":"1015840","q":"<p>If an investor is long 80 lead contracts and the contract price moves by 35 ticks, what is the profit or loss? The tick value on the contract is $12.50.<\/p>","o":[{"l":"A","h":"£35,000"},{"l":"B","h":"$35,000"},{"l":"C","h":"£70,000"},{"l":"D","h":"$70,000"}],"a":"B","e":"<p>Profit / loss = ticks moved x tick value x no. of contracts:<br/> = 35 x $12.50 x 80<br/> = $35,000<\/p>"},{"s":3,"n":11,"id":"1017009","q":"<p>Which of the following best describes what happens if there is an error in the trade-matching process?<\/p>","o":[{"l":"A","h":"The trade is reported to the regulator"},{"l":"B","h":"The legality of the transaction is in question"},{"l":"C","h":"Nothing happens as all trades are automatically matched"},{"l":"D","h":"There will be a delay in the settlement"}],"a":"D","e":"<p>If there is an error in the trade-matching process, which can happen on open outcry markets, the trade will be returned to the firms and there is likely to be a delay in the settlement process while the trade is verified.<\/p>"},{"s":3,"n":12,"id":"1002806","q":"<p>Clearing house clearing members who wish to act for themselves and their direct clients only are classified as:<\/p>","o":[{"l":"A","h":"Non-clearing members"},{"l":"B","h":"Individual clearing members"},{"l":"C","h":"Exchange members"},{"l":"D","h":"General clearing members"}],"a":"B","e":"<p>Individual clearing members can clear for themselves and direct clients, but not other exchange members.<\/p>"},{"s":3,"n":13,"id":"1002893","q":"<p>If a customer were to give her broker a limit order to buy at $20.00, which of the following prices would be an acceptable fill?<\/p><p class=\"rom\"><b>I<\/b> $19.98<\/p><p class=\"rom\"><b>II<\/b> $20.00<\/p><p class=\"rom\"><b>III<\/b> $20.05<\/p><p class=\"rom\"><b>IV<\/b> Any prevailing price<\/p>","o":[{"l":"A","h":"I and II"},{"l":"B","h":"II and IV"},{"l":"C","h":"II and III"},{"l":"D","h":"I, II, III, IV"}],"a":"A","e":"<p>A limit order must be filled at its limit price or better. A limit order to buy at $20 must therefore be filled at $20.00 or lower.<\/p>"},{"s":3,"n":14,"id":"1037587","q":"<p>What is the principal reason for a firm opting out of segregated accounts managed by their clearer?<\/p>","o":[{"l":"A","h":"It provides them with more protection should the clearer go into liquidation"},{"l":"B","h":"It allows them to net off their positions with those of the clearer, thus potentially reducing margin"},{"l":"C","h":"It allows them to deal in principal with the clearing house giving them added protection"},{"l":"D","h":"It provides the firm, if a hedger, to eliminate basis risk"}],"a":"B","e":"<p>The principal advantage of non-segregated accounts is the ability to net off positions with those of the clearer, potentially reducing margin. It does, however, expose the firm to more risk: for example if the clearer becomes insolvent, their positions will be liquidated along with the clearer's.<br/> Clearing houses only act as principal with clearers, not with the clients of clearers - regardless of whether the positions are held in a segregated or non-segregated account.<\/p>"},{"s":3,"n":15,"id":"1026835","q":"<p>Which of the following is TRUE of a block trade on ICE Futures Europe?<\/p>","o":[{"l":"A","h":"The trade must not be executed at the market price"},{"l":"B","h":"The volume of the trade need not be published"},{"l":"C","h":"The counterparties are required to ensure the price represents fair value"},{"l":"D","h":"The price of the trade need not be published"}],"a":"C","e":"<p>There are no explicit price limits attached to block trades, other than that they should satisfy \"fair value\" criteria (this criteria is not tested in the exam). The exchange reserves the right not to authorise the trade if it is deemed to fall outside agreed tolerance levels.<\/p>"},{"s":3,"n":16,"id":"1017376","q":"<p>What is a cross trade?<\/p>","o":[{"l":"A","h":"Dealer executes a trade with a client with a security on her own book"},{"l":"B","h":"Trades done on an exchange system"},{"l":"C","h":"A security purchased by one client from another client who both use the same broker"},{"l":"D","h":"A type of spread trade"}],"a":"C","e":"<p>This is the best description of a cross trade that occurs between two clients of the same broker.<\/p>"},{"s":3,"n":17,"id":"1077962","q":"<p>Which of the following is known as the trading system for ICE Futures Europe?<\/p>","o":[{"l":"A","h":"Select"},{"l":"B","h":"Connect"},{"l":"C","h":"Globex"},{"l":"D","h":"Direct"}],"a":"B","e":"<p>Select belongs to the LME and both Globex and Direct are CME systems.<\/p>"},{"s":3,"n":18,"id":"1036726","q":"<p>On which of the following US exchanges would you find oil derivatives?<\/p>","o":[{"l":"A","h":"COMEX"},{"l":"B","h":"CBOT"},{"l":"C","h":"PHLX"},{"l":"D","h":"NYMEX"}],"a":"D","e":"<p>Both crude and heating oil futures (no options) are available on the New York Mercantile Exchange (NYMEX).<br/> CBOT trades agriculturals and financial contracts.<br/> COMEX trades metals.<br/> PHLX trades financial contracts.<\/p>"},{"s":3,"n":19,"id":"4211289","q":"<p>In a brokerage firm, what is a significant advantage of placing trades in customer segregated accounts instead of house accounts?<\/p>","o":[{"l":"A","h":"It permits the commingling of client funds with firm resources to optimize liquidity."},{"l":"B","h":"It provides clients with higher potential returns due to pooled investments."},{"l":"C","h":"It ensures client assets are protected from the firm's liabilities in case of default."},{"l":"D","h":"It simplifies the administration and reduces costs for the brokerage firm."}],"a":"C","e":"<p>Segregated accounts provide security for client assets by keeping them separate from the firm's own funds. This protection ensures that, in the event of the firm's financial difficulties, client assets are not used to cover the firm's liabilities, thus safeguarding client investments.<\/p>"},{"s":3,"n":20,"id":"1002951","q":"<p>The price at which an exchange of futures for physical (EFP) is agreed is:<\/p>","o":[{"l":"A","h":"The currently traded futures price"},{"l":"B","h":"The price determined by the exchange"},{"l":"C","h":"The price agreed by the counterparties"},{"l":"D","h":"The settlement price at the end of the day"}],"a":"C","e":"<p>An EFP (exchange future for physical) is between two members, but ex-pit (off exchange). Members agree between themselves what price the EFP is to be done at.<\/p>"},{"s":3,"n":21,"id":"4211288","q":"<p>What distinguishes a house account from customer accounts in the context of a clearing member firm?<\/p>","o":[{"l":"A","h":"House accounts pool multiple client positions for efficiency."},{"l":"B","h":"House accounts require client approval for all transactions."},{"l":"C","h":"House accounts offer higher protection against firm defaults than customer accounts."},{"l":"D","h":"House accounts manage proprietary trades for the clearing member firm itself."}],"a":"D","e":"<p>House accounts are designated for the proprietary trades of a clearing member firm, meaning they are for the firm's own benefit or risk, and do not include client positions. This is distinct from customer accounts, which hold client trades and assets.<\/p>"},{"s":3,"n":22,"id":"1002910","q":"<p>All of the following are taken into account when prioritising orders on an exchange order book system, except:<\/p>","o":[{"l":"A","h":"Price"},{"l":"B","h":"Order type"},{"l":"C","h":"Underlying asset"},{"l":"D","h":"Time of order"}],"a":"C","e":"<p>The underlying asset is irrelevant for order priority.<\/p>"},{"s":3,"n":23,"id":"1051529","q":"<p>What would not be taken into consideration when deciding the order of execution on the exchange?<\/p>","o":[{"l":"A","h":"The security"},{"l":"B","h":"The time of entry"},{"l":"C","h":"The price"},{"l":"D","h":"Whether the order is limit or market"}],"a":"A","e":"<p>The security will be the same on the one trading screen; only the time of entry, price (best price at top) and type of order will need to be considered.<\/p>"},{"s":3,"n":24,"id":"1036680","q":"<p>A floor broker working on an open outcry exchange carries out trades on behalf of another brokerage house. Once the trade is done, the floor broker passes the trade back to the originating firm. This is called:<\/p>","o":[{"l":"A","h":"An assignment"},{"l":"B","h":"A give-up"},{"l":"C","h":"Dual brokerage"},{"l":"D","h":"Cross trading"}],"a":"B","e":"<p>Note: 'giving-up' trades is also called 'allocating'. Small brokerage houses that do not have floor brokers themselves often employ floor brokers to execute their business. Once the trade is completed, the floor broker gives up the trade to the originating firm.<\/p>"},{"s":3,"n":25,"id":"1002898","q":"<p>When trading on an order driven system, MIT stands for which of the following?<\/p>","o":[{"l":"A","h":"Market-inside-touch"},{"l":"B","h":"Market-if-touched"},{"l":"C","h":"Minimum integral tranche"},{"l":"D","h":"Mandatory imminent takeover"}],"a":"B","e":"<p>A market-if-touched (MIT) order specifies that the order is executed at the best prevailing price once price hits a certain level.<\/p>"},{"s":3,"n":26,"id":"1002909","q":"<p>An exchange's trade registration system has all of the following functions, except:<\/p>","o":[{"l":"A","h":"Trade allocation"},{"l":"B","h":"Trade matching"},{"l":"C","h":"Trade assignments"},{"l":"D","h":"Trade settlement"}],"a":"D","e":"<p>Trade registration systems are NOT settlement systems.<br/> ICE Futures Europe uses a registration system called Universal Clearing Platform (UCP).<\/p>"},{"s":3,"n":27,"id":"1037118","q":"<p>A broker opens a position in the Nikkei 225 futures market on the CME and closes it on SGX. How is this described?<\/p>","o":[{"l":"A","h":"Exchanging futures for physical"},{"l":"B","h":"Mutual offset"},{"l":"C","h":"Payment versus payment"},{"l":"D","h":"Intramarket spread"}],"a":"B","e":"<p>A mutual offset system exists between these two exchanges allowing extended trading hours for their members.<\/p>"},{"s":3,"n":28,"id":"1075068","q":"<p>What is the definition of a stop limit order?<\/p>","o":[{"l":"A","h":"An order that is execution is dependent on another order being executed"},{"l":"B","h":"An order that is executed to close out a position often to realise a predetermined loss"},{"l":"C","h":"An order with two prices given, the first activates the order and the second giving a specified price or better"},{"l":"D","h":"An order stating that it must be executed fully or not at all"}],"a":"C","e":"<p>The other definitions are for a spread order, a stop loss, and fill or kill.<\/p>"},{"s":3,"n":29,"id":"1016981","q":"<p>Which of the following is the best description of a STOP LIMIT order?<\/p>","o":[{"l":"A","h":"An instruction to cancel a limit order"},{"l":"B","h":"A buy or sell order at a specified price"},{"l":"C","h":"An order to close-out a client's position at any price"},{"l":"D","h":"An order which will close-out a client's position within a specified price range"}],"a":"D","e":"<p>A stop limit order is a buy or sell order which is designed to close-out a position provided that the price is within a certain range. For example, \"Buy stop 230, 232 limit\", will begin to close out short positions at 230, but will stop closing them out if the price rises above 232.<br/> 'An order designed to close-out a client's position at any price' - describes a stop (loss) order.<\/p>"},{"s":3,"n":30,"id":"1017007","q":"<p>Once a deal has taken place, the position needs to be allocated to the relevant account. If the trade was executed for the firm itself, to which account will it be allocated?<\/p>","o":[{"l":"A","h":"Designated account"},{"l":"B","h":"Nominee account"},{"l":"C","h":"Segregated account"},{"l":"D","h":"House account"}],"a":"D","e":"<p>Once a deal has taken place, the position needs to be allocated to the relevant account. The trade may have been executed for the firm itself and may be allocated to the firm’s house or principal account. If the trade has been executed on behalf of a client, it will be allocated to a client or segregated account.<\/p>"},{"s":3,"n":31,"id":"1017307","q":"<p>A firm who is a member of an exchange which can only trade on behalf of its clients is called:<\/p>","o":[{"l":"A","h":"Broker"},{"l":"B","h":"Broker-dealer"},{"l":"C","h":"Dealer"},{"l":"D","h":"Individual clearing member"}],"a":"A","e":"<p>This is a description of a broker.<\/p>"},{"s":3,"n":32,"id":"4211286","q":"<p>What is the primary benefit of using a segregated account for client trades in the context of potential firm defaults?<\/p>","o":[{"l":"A","h":"Higher returns due to pooled investments"},{"l":"B","h":"Simplified tax reporting for the client"},{"l":"C","h":"Reduced transaction fees for trades"},{"l":"D","h":"Protection of client assets from the firm's liabilities"}],"a":"D","e":"<p>Segregated accounts are used to protect client assets from the financial issues of the firm holding those assets. In the event of the firm’s default, segregated client assets are safeguarded and not used to settle the firm’s liabilities.<\/p>"},{"s":3,"n":33,"id":"1017003","q":"<p>In a screen-based market, the exchange has a responsibility to provide prices to which of the following people?<\/p>","o":[{"l":"A","h":"Quote vendors"},{"l":"B","h":"Exchange members"},{"l":"C","h":"The public"},{"l":"D","h":"The clearing house"}],"a":"C","e":"<p>Exchanges must publish trading information giving everyone access to price and volume information. This publication of trade details is a requirement for all 'on exchange' transactions, whether they occur through screen trading or not.<\/p>"},{"s":3,"n":34,"id":"1002901","q":"<p>Which of the following contracts is physically delivered?<\/p>","o":[{"l":"A","h":"Euro future"},{"l":"B","h":"STIR future"},{"l":"C","h":"FTSE 100 index future"},{"l":"D","h":"FTSE 100 index option"}],"a":"A","e":"<p>A euro future to buy 125,000 euros at a fixed price on a fixed date will result in 125,000 euros actually being delivered. This is a physically delivered future. The others are all settled by paying or receiving the difference between the price at which the position was opened and the price that it was closed at, i.e. a contract for difference.<\/p>"},{"s":3,"n":35,"id":"1072202","q":"<p>Why might a broker give up a client trade to another clearing member?<\/p>","o":[{"l":"A","h":"The broker is not an exchange member"},{"l":"B","h":"The client has their own clearing membership"},{"l":"C","h":"Client has an agreement with another firm to clear all their trades"},{"l":"D","h":"The broker is a general clearing member and can not clear for their clients"}],"a":"C","e":"<p>Give-up trades are mainly performed in order to separate the execution and the clearing function.<br/> Hence, a customer might wish to trade (execute) through one exchange member but state that the trade should be given up to the customer's usual clearing broker.<\/p>"},{"s":3,"n":36,"id":"1002902","q":"<p>Which type of exchange membership would only allow the member to trade for third parties, including clients and other members?<\/p>","o":[{"l":"A","h":"Dealer"},{"l":"B","h":"Broker-Dealer"},{"l":"C","h":"Dealer-Broker"},{"l":"D","h":"Broker"}],"a":"D","e":"<p>The typical types of exchange membership are:<\/p><p>Brokers – may only trade for third parties (including clients and other members).<\/p><p>Dealers – may trade for their own account. They can also trade for other members providing that they are authorised by the appropriate regulatory body.<\/p><p>Broker-dealers – are entitled to trade both for third parties and their own account.<\/p><p> <\/p><p>as the question states 'ONLY' Broker is the best answer.<\/p>"},{"s":3,"n":37,"id":"1044784","q":"<p>Which of the following is the best definition of dual trading on exchange?<\/p>","o":[{"l":"A","h":"A member firm trades for its own account and that of a client at the same time"},{"l":"B","h":"A member firm trades for its own account and that of a client irrespective of time"},{"l":"C","h":"A member firm deals for two clients in the same contract"},{"l":"D","h":"A member firm allows two clients to deal with each other in the same contract"}],"a":"B","e":"<p>A member firm trades for its own account and that of a client, irrespective of time, is the best answer. Dual trading, or dual capacity, allows the firm to deal in principal and act as agent for clients.<\/p>"},{"s":3,"n":38,"id":"1065080","q":"<p>Which of the following is false regarding the London Metal Exchange? It offers:<\/p>","o":[{"l":"A","h":"Open outcry only"},{"l":"B","h":"Inter office trading"},{"l":"C","h":"Electronic trading on LME Select"},{"l":"D","h":"24 hour market"}],"a":"A","e":"<p>Open outcry trading is possible alongside all of the other methods listed here.<\/p>"},{"s":3,"n":39,"id":"1075069","q":"<p>What type of clearing house member can clear for themselves and their clients only?<\/p>","o":[{"l":"A","h":"Individual"},{"l":"B","h":"Self"},{"l":"C","h":"General"},{"l":"D","h":"Non clearing"}],"a":"A","e":"<p>An individual member can clear for their own account and their clients. A general clearing member can also clear for non-clearing members.<\/p>"},{"s":3,"n":40,"id":"1052268","q":"<p>Which of the following is the best definition of an order-driven market?<\/p>","o":[{"l":"A","h":"The orders of both buyers and sellers of commodities will be placed displaying the price of the commodity and the quality or grade of the commodity"},{"l":"B","h":"Market makers will display two-way prices at which they are willing to buy or sell with limits on the volumes they are willing to trade at"},{"l":"C","h":"The orders of both buyers and sellers of securities will be placed displaying the price at which they are willing to buy or sell"},{"l":"D","h":"Two-way prices are placed on the book by market makers who will trade at those prices"}],"a":"C","e":"<p>For efficient order driven markets, the quality of the asset will need to be standardised, so this would not be entered by the buyers and sellers with their orders. Order-driven markets can work for both securities and derivatives markets.<\/p>"},{"s":3,"n":41,"id":"1037237","q":"<p>On which of the following systems do ICE energy products, such as gas oil, trade?<\/p>","o":[{"l":"A","h":"UCP"},{"l":"B","h":"Central order book"},{"l":"C","h":"Select"},{"l":"D","h":"SETS"}],"a":"B","e":"<p>ICE Futures Europe uses a platform called Connect which allows the member to access the central order book. ICE Connect also links the exchange to the clearing house to facilitate straight through processing<\/p><p>UCP is the trade registration system for registering a trade with the clearing house. Select is the order book used by LME. SETS is an automated share dealing system used on the LSE.<\/p>"},{"s":3,"n":42,"id":"1015742","q":"<p>Exchange clearing members who wish to clear for themselves and their direct clients only are classified as:<\/p>","o":[{"l":"A","h":"Non-clearing members"},{"l":"B","h":"Individual clearing members"},{"l":"C","h":"Exchange members"},{"l":"D","h":"General clearing members"}],"a":"B","e":"<p>Individual clearing members can clear for themselves and direct clients, but not other exchange members.<\/p>"},{"s":3,"n":43,"id":"1015698","q":"<p>A floor broker working on an open outcry exchange carries out trades on behalf of another brokerage house. Once the trade is done, the floor broker passes the trade back to the originating firm. This is called:<\/p>","o":[{"l":"A","h":"Assignment"},{"l":"B","h":"Give-up"},{"l":"C","h":"Dual brokerage"},{"l":"D","h":"Cross trading"}],"a":"B","e":"<p>Note: 'giving-up' trades is also called 'allocating'. Small brokerage houses that do not have floor brokers themselves often employ floor brokers to execute their business. Once the trade is completed, the floor broker gives up the trade to the originating firm.<\/p>"},{"s":3,"n":44,"id":"1017373","q":"<p>Order book markets use which order priority for the majority of its contracts?<\/p>","o":[{"l":"A","h":"Price"},{"l":"B","h":"Price and time"},{"l":"C","h":"Price, time and volume"},{"l":"D","h":"Price and volume"}],"a":"B","e":"<p>Price and time for order priority on most order book markets.<\/p>"},{"s":3,"n":45,"id":"4211278","q":"<p>Which of the following statements best describes the current status of open outcry trading systems in the context of global exchanges?<\/p>","o":[{"l":"A","h":"All major exchanges have completely transitioned to electronic trading platforms."},{"l":"B","h":"Open outcry systems are primarily used in developing markets globally"},{"l":"C","h":"Some major exchanges globally still use open outcry for specific sessions or complex trades."},{"l":"D","h":"Open outcry trading is mostly used for currency and bond markets in Asia."}],"a":"C","e":"<p>While most exchanges have shifted towards electronic trading systems, the London Metal Exchange (LME) continues to utilize open outcry, known as ring trading, for metal contracts. Similarly, the CBOT in the US uses open outcry for complex trades, particularly spreads and combinations of options, demonstrating the continued relevance of this traditional trading method in certain contexts.<\/p>"},{"s":3,"n":46,"id":"1017006","q":"<p>Which of the following is TRUE concerning block trades on ICE Futures Europe?<\/p>","o":[{"l":"A","h":"The trade does not have to be executed at the prevailing market price"},{"l":"B","h":"The price of the trade does not need to be disclosed to the market"},{"l":"C","h":"The size of the trade does not need to be disclosed to the market"},{"l":"D","h":"The trade does not need to be reported to the exchange"}],"a":"A","e":"<p>A block trade is a large trade agreed between an exchange member and their wholesale clients. The trade has to exceed a pre-defined volume (which varies depending on the contract). The price does not have to be done at the current market price; however, both the volume and the price need to be reported within a set time period.<\/p>"},{"s":3,"n":47,"id":"1026868","q":"<p>An investor has a long position in an asset and is concerned about the market falling. They would like to enter an order to close out their position if the market reaches a certain point, but they are willing to sell above a specified price, but not below. Which order is best for the investor?<\/p>","o":[{"l":"A","h":"Stop order"},{"l":"B","h":"Stop limit order"},{"l":"C","h":"Market order"},{"l":"D","h":"Fill order"}],"a":"B","e":"<p>An order which is triggered at a certain price, but only trades at or above a certain level, is a stop limit order. If the investor wanted his position to be closed out at a specific point, but did not request a price guarantee, they would use a stop order only.<\/p>"},{"s":3,"n":48,"id":"1015766","q":"<p>What needs to be reported on an execution of a block trade?<\/p><p class=\"rom\"><b>I<\/b> Time<\/p><p class=\"rom\"><b>II<\/b> Price<\/p><p class=\"rom\"><b>III<\/b> Volume<\/p><p class=\"rom\"><b>IV<\/b> Client details<\/p>","o":[{"l":"A","h":"I and II"},{"l":"B","h":"II and III"},{"l":"C","h":"I, II and III"},{"l":"D","h":"I, II, III and IV"}],"a":"C","e":"<p>Client details are not required in a trade report for a block trade.<\/p>"},{"s":3,"n":49,"id":"1065113","q":"<p>Which of the following would be the best definition of a Flex trade?<\/p>","o":[{"l":"A","h":"It is the simultaneous exchange of a financial asset, together with an appropriate offsetting number of futures contracts, in a privately negotiated transaction between two parties"},{"l":"B","h":"It gives any exchange member the freedom to customise the trades with respect to the strike/exercise price and expiration date"},{"l":"C","h":"It allows members and their wholesale clients to transact business as bilaterally agreed transactions without delay and with certainty of price and execution"},{"l":"D","h":"It is an off-market transaction that involves the swapping (or exchanging) of an OTC position for a futures position"}],"a":"B","e":"<p>FLEX facility, such as the one offered by ICE Futures Europe for FTSE 100 index options, gives any exchange member the freedom to customise the trades with respect to the strike/exercise price and expiration date. The FLEX facility is one that combines the flexibility of the OTC market with the clearing and other advantages of exchange trading.<\/p>"},{"s":3,"n":50,"id":"1065104","q":"<p>Which of the following is a system that matches and carries registered trades between an exchange and a clearing house?<\/p>","o":[{"l":"A","h":"Custodial processing service"},{"l":"B","h":"Standard portfolio analysis of risk"},{"l":"C","h":"Universal clearing platform"},{"l":"D","h":"Stock exchange trading system"}],"a":"C","e":"<p>The details of the trade will be reported into the administration system that is used by the exchange, such as the Universal Clearing Platform (UCP) for ICE Futures Europe. These systems will ensure that the trade inputs are matched - in other words, that both a purchase and a sale exist on the same terms. This process is particularly important when the exchange uses open outcry, where there is more scope for human error than in an electronic order-matching system.<\/p><p>Standard portfolio analysis of risk (SPAN) in used by many clearing houses to calculate initial margin. Stock exchange trading system (SETS) is a trading system used by the London Stock Exchange. Custodial processing service is a fictional term.<\/p>"},{"s":3,"n":51,"id":"1017305","q":"<p>In a trade registration system, when is a trade considered to be registered?<\/p>","o":[{"l":"A","h":"When the trade has been allocated"},{"l":"B","h":"When the trade has been removed from the default account"},{"l":"C","h":"When it is ready for clearing"},{"l":"D","h":"When the trade has been matched"}],"a":"C","e":"<p>This is a difficult question; the best answer is C, as a trade will be considered registered when it is ready to be passed into the clearing system.<\/p>"},{"s":3,"n":52,"id":"1040382","q":"<p>Which of the following commodities is traded on ICE futures Europe?<\/p>","o":[{"l":"A","h":"Precious metals"},{"l":"B","h":"Base metals"},{"l":"C","h":"Hard commodities"},{"l":"D","h":"Energy"}],"a":"D","e":"<p>ICE futures trades energy products, Softs and financials.<br/> Metal and hard commodities are the same thing and trade on LME in the UK.<\/p>"},{"s":3,"n":53,"id":"1015765","q":"<p>What is shown in the touch strip on electronic/screen-based trading systems?<\/p>","o":[{"l":"A","h":"Last bid/offer prices"},{"l":"B","h":"Best bid/offer price"},{"l":"C","h":"Details of the day's trades"},{"l":"D","h":"Best three bid/offer prices"}],"a":"B","e":"<p>The touch strip shows the best bid and offer currently available. The touch strip is sometimes referred to as Level 1.<br/> Level 2 shows all the available buy and sell orders currently available - sometimes referred to as the market in depth.<\/p>"},{"s":3,"n":54,"id":"1002895","q":"<p>The minimum price movement on a futures contract is:<\/p>","o":[{"l":"A","h":"A pip"},{"l":"B","h":"Basis"},{"l":"C","h":"A tick"},{"l":"D","h":"A point"}],"a":"C","e":"<p>Pips relate to exchange rate movements, and points to index movements. Basis is the difference between the cash price and the futures price.<\/p>"},{"s":3,"n":55,"id":"1065086","q":"<p>When one exchange member gives up a trade to another exchange member, how do the counterparties manage the risk that one may default?<\/p>","o":[{"l":"A","h":"There is no risk of default"},{"l":"B","h":"The CCP guarantees this relationship"},{"l":"C","h":"Using a master give-up agreement"},{"l":"D","h":"By ensuring an exchange of future for physical"}],"a":"C","e":"<p>Both of the parties to an allocated transaction run the risk that the other will not fulfil its obligations. This is mitigated to some extent by Master Give-Up Agreements, which set the legally-binding framework that governs the relationship between members involved in give ups.<\/p>"},{"s":3,"n":56,"id":"1015779","q":"<p>If a trade is entered into the automated trading system without a specified expiry, for how long will the order be valid?<\/p>","o":[{"l":"A","h":"Until the end of the trading day"},{"l":"B","h":"Until the order is cancelled"},{"l":"C","h":"Until the price is achieved"},{"l":"D","h":"Until the contract expires"}],"a":"A","e":"<p>Unless the trade is specified as GTC (good until cancelled) it is assumed to be good for the trading day only.<\/p>"},{"s":3,"n":57,"id":"1047191","q":"<p>Which of the following is a benefit of a block trade?<\/p>","o":[{"l":"A","h":"They can be executed for any size"},{"l":"B","h":"Prices can be agreed away from the order book"},{"l":"C","h":"There is no need for trades to be reported"},{"l":"D","h":"There is never any publication of block trades"}],"a":"B","e":"<p>The exchange sets the size requirements; they must be reported and publication may be delayed. The block trade facility allows members of ICE Futures and their wholesale clients to transact business of significant size as bilaterally agreed transactions on-exchange, without delay and with certainty of price and execution.<\/p>"},{"s":3,"n":58,"id":"1065124","q":"<p>Which of the following market participants is most likely to offer their clients research information?<\/p>","o":[{"l":"A","h":"Brokers"},{"l":"B","h":"Inter-dealer brokers"},{"l":"C","h":"Dealers"},{"l":"D","h":"Market makers"}],"a":"A","e":"<p>Investors often obtain research reports from their brokers, who purchase research reports (or produce them internally in their research departments) to distribute to their clients. Brokers give research to their clients to better serve them, to attract new clients, and to encourage their clients to trade. Investors also may purchase reports directly from independent research companies, or they may obtain reports from research companies that issuers pay to produce investment reports about their securities.<\/p>"},{"s":3,"n":59,"id":"1026870","q":"<p>Which of the following is a characteristic of an Exchange for Physicals (EFP) contract?<\/p>","o":[{"l":"A","h":"All the transactions are done on exchange"},{"l":"B","h":"It allows all cash settled contracts to be physically settled"},{"l":"C","h":"The price is set at a later date"},{"l":"D","h":"It allows firms to trade in a physical market place"}],"a":"D","e":"<p>EFP is not available for all cash settled contracts. An EFP allows certain cash settled contracts to be physically settled off exchange in a physical market place at a price agreed at the time of the trade. Therefore, this permits face to face trading or trading with physical counterparties.<\/p>"},{"s":3,"n":60,"id":"1017358","q":"<p>Exchange price feeds provide:<\/p>","o":[{"l":"A","h":"Delayed prices"},{"l":"B","h":"Real-time prices"},{"l":"C","h":"Settlement prices"},{"l":"D","h":"Pricing models"}],"a":"B","e":"<p>Exchange price feed provide real-time prices throughout the day.<\/p>"},{"s":3,"n":61,"id":"1002908","q":"<p>Which of the following best indicates functions of Universal Clearing Platform?<\/p>","o":[{"l":"A","h":"Registration and allocation"},{"l":"B","h":"Registration and risk management"},{"l":"C","h":"Allocation and risk management"},{"l":"D","h":"Registration and margining"}],"a":"A","e":"<p>The UCP is a trade registration system. It registers trades and allocates them to a clearing account.<\/p><p>Risk management and margining are part of the clearing house function.<\/p>"},{"s":3,"n":62,"id":"1002905","q":"<p>An order to buy 25 long gilt contracts at £103.00, or lower, if the market was currently at £103.10 would be called:<\/p>","o":[{"l":"A","h":"A market-if-touched"},{"l":"B","h":"A stop order"},{"l":"C","h":"A limit order"},{"l":"D","h":"A contingent order"}],"a":"C","e":"<p>The order is to buy below the current market level, at £103.00 or better: i.e. a limit order. This cannot be a stop order as it would have to buy ABOVE the current market level: i.e. to limit the loss on your current short-position. Market-if-touched orders work on the principle that, if a given level is reached, a market order (i.e. 'at best') is activated.<\/p>"},{"s":4,"n":1,"id":"1026880","q":"<p>Gamma:<\/p>","o":[{"l":"A","h":"Decreases as an option approaches expiry"},{"l":"B","h":"Measures the volatility in an option"},{"l":"C","h":"Always moves in the same direction as Delta"},{"l":"D","h":"Is negative for short options"}],"a":"D","e":"<p>Gamma is the sensitivity of delta relative to a change in the price of the underlying asset. It increases for ATM options as time to expiry falls. It is positive for long options and negative for short options.<\/p>"},{"s":4,"n":2,"id":"1014217","q":"<p>If an investor is long a deeply in-the-money call option, the Delta and Gamma are respectively closest to:<\/p>","o":[{"l":"A","h":"+1 and 0"},{"l":"B","h":"-1 and -0.5"},{"l":"C","h":"-1 and 0"},{"l":"D","h":"+1 and -0.5"}],"a":"A","e":"<p>To be long a deeply in-the-money call option is to be bullish, so the Delta is positive. For deeply in-the-money options, the value is close to 1. The Gamma of a deeply in-the-money option is close to 0.<\/p>"},{"s":4,"n":3,"id":"1002733","q":"<p>An option position containing an at-the-money long-put and an at-the-money long-call on the same underlying instrument would have a Delta that is most likely:<\/p>","o":[{"l":"A","h":"Roughly zero"},{"l":"B","h":"Positive, greater than 0.5"},{"l":"C","h":"Intermediate"},{"l":"D","h":"Negative, greater than 0.5"}],"a":"A","e":"<p>The Delta of a long ATM call position is approx +0.5. The Delta of a long ATM put position is - 0.5. Overall (cumulative) Delta is zero.<\/p>"},{"s":4,"n":4,"id":"1002836","q":"<p>What would be the equivalent exposure to the UK stock market if an investor bought 7 FTSE 100 futures? The contract is currently at 6,400 points and has a tick value of £5 per half point.<\/p>","o":[{"l":"A","h":"£32,000"},{"l":"B","h":"£64,000"},{"l":"C","h":"£224,000"},{"l":"D","h":"£448,000"}],"a":"D","e":"<p>Total exposure = 6,400 points x £10 per point x 7 contracts = £448,000.<\/p>"},{"s":4,"n":5,"id":"1002739","q":"<p>Which of the following investors would benefit most from the passing of time?<\/p>","o":[{"l":"A","h":"Option writers"},{"l":"B","h":"Options holders"},{"l":"C","h":"Futures sellers"},{"l":"D","h":"Futures buyers"}],"a":"A","e":"<p>The erosion of time value benefits <strong>writers <\/strong>of options. The passing of time erodes an option's time value and therefore decreases its premium. Therefore (all other factors remaining equal), a writer can sell an option today and buy it back later at a cheaper price, thus making a profit when closing the position out.<\/p>"},{"s":4,"n":6,"id":"1015800","q":"<p>According to put-call parity theory, if you are long a call and short a put with the same strike this is equivalent to a:<\/p>","o":[{"l":"A","h":"Long-futures position"},{"l":"B","h":"Short-futures position"},{"l":"C","h":"Covered short call"},{"l":"D","h":"Straddle"}],"a":"A","e":"<p>If you are long a call and short a put with the same strike, if the underlying asset increases in value, then the long-call will exercise resulting in a purchase of the asset. Alternatively, if the underlying asset falls in value, the long-put will exercise against the strike, resulting in the short-put buying the asset. Either way you will end up long the asset - hence answer 'long-futures position' is correct.<br/> Or being long a call and short a put = C-P.<br/> According to put-call, C-P+ K / 1 + rt = S . Therefore it is equivalent to S, which is the underlying asset. So answer 'long-futures position' is correct.<\/p>"},{"s":4,"n":7,"id":"1014218","q":"<p>Which of the following is not an option 'Greek'?<\/p>","o":[{"l":"A","h":"Delta"},{"l":"B","h":"Gamma"},{"l":"C","h":"Beta"},{"l":"D","h":"Theta"}],"a":"C","e":"<p>Beta is the sensitivity of a portfolio's value to the movement of its underlying shares. Delta is the sensitivity of an option price with respect to its underlying. Gamma is the sensitivity of an option's Delta with respect to its underlying. Theta is the sensitivity of an option's price with respect to time. It is also known as time decay.<\/p>"},{"s":4,"n":8,"id":"1002755","q":"<p>Mallard Ltd pays no dividends and is currently trading at 75p. If a one year European 80 call is 10p and one year interest rates are 10%, the one year European 80 put has a theoretical value of:<\/p>","o":[{"l":"A","h":"77.3p"},{"l":"B","h":"7.73p"},{"l":"C","h":"15p"},{"l":"D","h":"150p"}],"a":"B","e":"<p>Put-call parity theory: C - P = S - K / (1+r)^t<br/> Therefore:<br/> 10p - P = 75p - 80p / (1+0.1)<br/> 10p - P = 75p - 72.73p<br/> 10p - P = 2.27p<br/> 10p - 2.27p = 7.73p<\/p>"},{"s":4,"n":9,"id":"1002702","q":"<p>If the future's price is trading above its fair value, which of the following trades is most likely to take advantage of this discrepancy?<\/p>","o":[{"l":"A","h":"Sell the underlying asset"},{"l":"B","h":"Sell futures"},{"l":"C","h":"Cash and carry"},{"l":"D","h":"Reverse cash and carry"}],"a":"C","e":"<p>Buying the underlying asset in the cash market and simultaneously selling the futures contract would exploit the difference between the two. This is known as cash and carry arbitrage. If the futures price was trading BELOW fair value then reverse cash and carry arbitrage would exploit the price differential.<\/p>"},{"s":4,"n":10,"id":"1036895","q":"<p>The rate of change of delta (assuming long positions) for a given change in the underlying is:<\/p>","o":[{"l":"A","h":"Positive for calls, negative for puts"},{"l":"B","h":"Positive for calls, positive for puts"},{"l":"C","h":"Negative for calls, negative for puts"},{"l":"D","h":"Negative for calls, positive for puts"}],"a":"B","e":"<p>The rate of change of delta - gamma - is positive for both long calls and long puts.<\/p>"},{"s":4,"n":11,"id":"1002762","q":"<p>Which of the following is the change of the premium of an option with respect to changes in the underlying?<\/p>","o":[{"l":"A","h":"Theta"},{"l":"B","h":"Delta"},{"l":"C","h":"Gamma"},{"l":"D","h":"Vega"}],"a":"B","e":"<p>Delta is a measure of the sensitivity of the premium of an option to changes in the price of the underlying.<\/p>"},{"s":4,"n":12,"id":"1015837","q":"<p>What is the overall Delta of a portfolio which contains four long futures and four at-the-money short-calls?<\/p>","o":[{"l":"A","h":"2"},{"l":"B","h":"3"},{"l":"C","h":"4"},{"l":"D","h":"6"}],"a":"A","e":"<p>The overall Delta is calculated as follows: Four long-future : 4 x 1 = 4. Four ATM short-calls = 4 x -0.5 = -2.<br/> Total = 2.<\/p>"},{"s":4,"n":13,"id":"1002705","q":"<p>The value of a futures contract is driven by:<\/p>","o":[{"l":"A","h":"The holder of a long-position"},{"l":"B","h":"The holder of a short-position"},{"l":"C","h":"The exchange"},{"l":"D","h":"The cash price of the underlying"}],"a":"D","e":"<p>The value of a futures contract is 'derived' from the value of the underlying asset. Hence, the name 'derivative'.<\/p>"},{"s":4,"n":14,"id":"4211273","q":"<p>An investor observes that the cash price of a commodity is £1,200, while the current futures price is £1,250. The annual interest rate is 4%, and storage costs amount to 1% per annum. Assuming the contract expires in 90 days, what should be the arbitrage-free futures price for this commodity, using actual/365 day count convention?<\/p>","o":[{"l":"A","h":"£1,214.79"},{"l":"B","h":"£1,220.00"},{"l":"C","h":"£1,225.07"},{"l":"D","h":"£1,204.93"}],"a":"A","e":"<p>The arbitrage-free futures price is calculated using the formula: Fair value = cash price + cost of carry. The cost of carry for 90 days includes interest and storage costs. Calculating this gives £1,200 + (£1,200 × 0.04 × 90/365) + (£1,200 × 0.01 × 90/365) = £1,214.79, which should be the futures price to ensure no arbitrage opportunities.<\/p>"},{"s":4,"n":15,"id":"1002704","q":"<p>Which of the following best describes cash and carry?<\/p>","o":[{"l":"A","h":"Sell cash and buy forward"},{"l":"B","h":"Buy cash and sell forward"},{"l":"C","h":"Buy the near-dated future and sell the far-dated future"},{"l":"D","h":"Sell the near-dated future and buy the far-dated future"}],"a":"B","e":"<p>Buy cash and sell forward is cash and carry. 'Sell cash and buy forward' is reverse cash and carry. 'Buy the near-dated future and sell the far-dated future' and 'sell the near-dated future and buy the far-dated future' relate to spread trades. Therefore, 'buy cash and sell forward' is the correct answer.<\/p>"},{"s":4,"n":16,"id":"1002736","q":"<p>The Delta of a deeply in-the-money short-call is:<\/p>","o":[{"l":"A","h":"Zero"},{"l":"B","h":"Close to 1"},{"l":"C","h":"Close to -1"},{"l":"D","h":"0.5"}],"a":"C","e":"<p>Delta measures the relationship between option premiums and the price of the underlying. <br/> Deeply ITM long-calls / short-puts have Deltas of close to 1.<br/> Deeply ITM short-calls / long-puts have Deltas of close to -1.<\/p>"},{"s":4,"n":17,"id":"4211272","q":"<p>What is the primary condition that must be met for a market to exhibit arbitrage-free pricing?<\/p>","o":[{"l":"A","h":"The future price must always be greater than the cash price."},{"l":"B","h":"The cost of carry must equal the difference between the cash and futures prices."},{"l":"C","h":"The futures price must always be above the cost of carry."},{"l":"D","h":"The futures price must be stable irrespective of market conditions."}],"a":"B","e":"<p>Arbitrage-free pricing requires that the futures price reflect the cash price plus the cost of carry, which includes financing and storage costs. This ensures no arbitrage opportunities, as the prices align with the cost of maintaining the position until delivery.<\/p>"},{"s":4,"n":18,"id":"1002863","q":"<p>The S&amp;P 500 currently stands at 800. The dividend yield is 2.5% p.a. and the cost of borrowing is 2% p.a. Calculate the value of the 183 day future.<\/p>","o":[{"l":"A","h":"804"},{"l":"B","h":"802"},{"l":"C","h":"798"},{"l":"D","h":"796"}],"a":"C","e":"<p>The future is a 183 day future, so we will need to deannualise the interest rates and dividend yields.<\/p><p>Fair value = cash/spot price + net cost-of-carry = 800 + ((0.02-0.025) x 0.5 x 800)<br/> = 798<\/p>"},{"s":4,"n":19,"id":"1015764","q":"<p>What should be included in the calculation of an index future's fair value?<\/p><p class=\"rom\"><b>I<\/b> Interest payments<\/p><p class=\"rom\"><b>II<\/b> Margin payments<\/p><p class=\"rom\"><b>III<\/b> Market sentiment<\/p><p class=\"rom\"><b>IV<\/b> Brokers fees<\/p>","o":[{"l":"A","h":"I only"},{"l":"B","h":"I and II"},{"l":"C","h":"I and III"},{"l":"D","h":"All of the above"}],"a":"A","e":"<p>The index future fair value will equal the cash price plus the cost of carry. The cost of the carry will be a factor of the market yield and interest payments.<\/p>"},{"s":4,"n":20,"id":"1002703","q":"<p>The significance of the arbitrage channel is:<\/p>","o":[{"l":"A","h":"That the future's price is supposed to trade within this range"},{"l":"B","h":"That transaction costs outweigh the profit from an arbitrage transaction within this range"},{"l":"C","h":"That the future's price and the price of the underlying are outside this range"},{"l":"D","h":"That arbitrage will only take place within this range"}],"a":"B","e":"<p>The arbitrage channel is a range of values around the fair value of a future for which arbitrage is possible, but not economically viable. Arbitrage can only take place profitably if the futures price is trading outside the arbitrage channel.<\/p>"},{"s":4,"n":21,"id":"1036788","q":"<p>A trader sells a futures contract. In order to complete a basis trade, which of the following actions is required?<\/p>","o":[{"l":"A","h":"Sell the underlying"},{"l":"B","h":"Buy the underlying"},{"l":"C","h":"Nothing"},{"l":"D","h":"Buy a future with a different expiry"}],"a":"B","e":"<p>Basis trades combine a position in the underlying with a position in the future. Either long the underlying and short a future (answer here) or short the underlying and long a future.<\/p>"},{"s":4,"n":22,"id":"1026872","q":"<p>You have calculated the fair value of a future contract to be 803. The contract is currently trading at 800. What should a risk-averse investor do to make money?<\/p>","o":[{"l":"A","h":"Buy the future"},{"l":"B","h":"Buy the cash asset and sell the future"},{"l":"C","h":"Sell the cash and buy the future"},{"l":"D","h":"Do nothing"}],"a":"C","e":"<p>As the future is currently UNDERVALUED, an investor should buy it and take an offsetting position in the cash market. This would be referred to as reverse cash and carry arbitrage.<\/p>"},{"s":4,"n":23,"id":"1002737","q":"<p>Deeply out-of-the-money options do not:<\/p>","o":[{"l":"A","h":"Offer the buyer a chance of profit"},{"l":"B","h":"Offer the writer small premiums"},{"l":"C","h":"Offer limited liquidity"},{"l":"D","h":"Have intrinsic value"}],"a":"D","e":"<p>Only in-the-money options have intrinsic value.<\/p>"},{"s":4,"n":24,"id":"1026839","q":"<p>A strike £7 call with a Delta of 0.34 on an underlying asset is worth £6. If the option is currently trading at 70p, by how much will the premium change be if the underlying increases in price by 50p?<\/p>","o":[{"l":"A","h":"+17.0p"},{"l":"B","h":"+23.8p"},{"l":"C","h":"-17p"},{"l":"D","h":"-23.8p"}],"a":"A","e":"<p>Delta = change in the option's premium / change in the underlying price<br/> 0.34 = change in the option's premium / 50p<br/> 50p x 0.34 = change in the option's premium<br/> Change in the option's premium = 17p.<\/p>"},{"s":4,"n":25,"id":"1017372","q":"<p>Which of the following should be included when calculating the cost of carry on a future for a share?<\/p>","o":[{"l":"A","h":"Broker's fees"},{"l":"B","h":"Dividend entitlement"},{"l":"C","h":"Tax implications"},{"l":"D","h":"Exchange dealing costs"}],"a":"B","e":"<p>Dividend yield or dividend entitlement will reduce the cost of carry.<\/p>"},{"s":4,"n":26,"id":"1002742","q":"<p>If an investor thinks the market price of an asset is going to rise, the most aggressive action would be:<\/p>","o":[{"l":"A","h":"To buy an in-the-money call"},{"l":"B","h":"To buy an out-of-the-money call"},{"l":"C","h":"To sell an in-the-money call"},{"l":"D","h":"To sell an out-of-the-money call"}],"a":"B","e":"<p>The holder of a call makes money as prices increase. Gearing is highest for out-of-the-money options.<\/p>"},{"s":4,"n":27,"id":"1002738","q":"<p>If the underlying price is 234, what is the intrinsic value of the September 330 put, which has 180 days to expiry and is trading at 123?<\/p>","o":[{"l":"A","h":"96"},{"l":"B","h":"150"},{"l":"C","h":"92"},{"l":"D","h":"70"}],"a":"A","e":"<p>Intrinsic value = 330 - 234 = 96.<br/> Note: time value of the option is therefore 123 - 96 = 27.<\/p>"},{"s":4,"n":28,"id":"1002837","q":"<p>If interest rates exceed dividend receipts, one would expect FTSE 100 futures prices to be:<\/p>","o":[{"l":"A","h":"Higher than the current FTSE 100 index"},{"l":"B","h":"Lower than the current FTSE 100 index"},{"l":"C","h":"The same as the FTSE 100 index"},{"l":"D","h":"It is impossible to say whether it would be higher or lower"}],"a":"A","e":"<p>The fair value of the future equals cash price plus costs of carry (financing costs less dividends). If interest rates are higher than dividends, then costs of carry are positive, and the fair value of the future will be higher than the cash value. This situation is called a contango market.<\/p>"},{"s":4,"n":29,"id":"1002698","q":"<p>If an investor wanted to arbitrage a future's price, which of the following would have to be taken into account?<\/p><p class=\"rom\"><b>I<\/b> The time to delivery of the future<\/p><p class=\"rom\"><b>II<\/b> Interest rates (financing costs)<\/p><p class=\"rom\"><b>III<\/b> The future's price<\/p><p class=\"rom\"><b>IV<\/b> The price of the underlying asset today (the cash price)<\/p>","o":[{"l":"A","h":"III and IV"},{"l":"B","h":"I, III, IV"},{"l":"C","h":"II and III"},{"l":"D","h":"I, II, III, IV"}],"a":"D","e":"<p>Arbitrage is possible when a future is not trading at its fair value. The fair value of a future is cash price plus costs-of-carry, such as financing costs.<\/p>"},{"s":4,"n":30,"id":"1002745","q":"<p>A put option, where the exercise price is lower than the underlying's current value, is said to be:<\/p>","o":[{"l":"A","h":"On-the-money"},{"l":"B","h":"At-the-money"},{"l":"C","h":"In-the-money"},{"l":"D","h":"Out-of-the-money"}],"a":"D","e":"<p>Put options move in-the-money when the price of the underlying falls below the exercise price.<\/p>"},{"s":4,"n":31,"id":"1036672","q":"<p>If the underlying is at 85, calculate the time value for a call option with a strike of 80 and a premium of 12.<\/p>","o":[{"l":"A","h":"5"},{"l":"B","h":"7"},{"l":"C","h":"12"},{"l":"D","h":"0"}],"a":"B","e":"<p>The premium equals the intrinsic value plus the time value. The intrinsic value for a call option is calculated as 'Underlying - Strike' i.e. 85 - 80 = 5. Therefore since the premium is 12, the time value must be 7.<\/p>"},{"s":4,"n":32,"id":"1002712","q":"<p>When considering the relationship between the price of an underlying asset and the price of the future on that asset, which of the following best describes how basis changes?<\/p>","o":[{"l":"A","h":"Linear"},{"l":"B","h":"Non-linear"},{"l":"C","h":"Static"},{"l":"D","h":"Predictable"}],"a":"B","e":"<p>Changes to basis (difference between the cash price and the futures price) are non-linear.<\/p>"},{"s":4,"n":33,"id":"1017384","q":"<p>You hold a call option with a strike of £6, the underlying is currently trading at £5. The premium on the option is 70p and the delta is 0.34.<br/> By how much will the premium change if the underlying increases in price by 50p?<\/p>","o":[{"l":"A","h":"17p"},{"l":"B","h":"24p"},{"l":"C","h":"50p"},{"l":"D","h":"60p"}],"a":"A","e":"<p>Delta is the change in the value of the premium / change in the value of the underlying.<br/> As we know delta is 0.34, a change in the underlying of 50p would result in a 17p change in the premium (0.34 x 50p).<\/p>"},{"s":4,"n":34,"id":"4211275","q":"<p>Which asset class is most commonly associated with cash-flow pricing in the context of derivative pricing due to its predictable income streams from interest payments?<\/p>","o":[{"l":"A","h":"Equities"},{"l":"B","h":"Commodities"},{"l":"C","h":"Bonds"},{"l":"D","h":"Currencies"}],"a":"C","e":"<p>Bonds are typically priced based on the present value of expected future cash flows, such as coupon payments and the principal repayment. This predictability and reliance on cash flows make bonds a prominent asset class for cash-flow pricing in derivative markets.<\/p>"},{"s":4,"n":35,"id":"1037034","q":"<p>Which of the following statements about deltas is TRUE?<\/p>","o":[{"l":"A","h":"At-the-money call options have the lowest deltas and out-of-money call options have the highest deltas"},{"l":"B","h":"At-the-money call options have lower deltas than out-of-the-money calls"},{"l":"C","h":"Deeply in- and out-of-the-money calls have very low deltas"},{"l":"D","h":"In-the-money calls have higher deltas than at-the-money calls"}],"a":"D","e":"<p>Deeply in-the-money calls have deltas close to 1, whereas at-the-money calls have deltas closer to 0.5.<\/p>"},{"s":4,"n":36,"id":"1016980","q":"<p>Which of the following would not influence the cost-of-carry?<\/p>","o":[{"l":"A","h":"Interest rates"},{"l":"B","h":"Dividend yield"},{"l":"C","h":"Time to delivery"},{"l":"D","h":"Market sentiment"}],"a":"D","e":"<p>Market sentiment would not affect the cost-of-carry.<br/> Cost of carry is made up of storage, insurance and forgone interest over the time to delivery. For equity futures we would also need to consider the impact of dividends.<\/p>"},{"s":4,"n":37,"id":"1015799","q":"<p>What is the time value for a put option with a strike of £1.20 and a premium of 20p when the underlying is trading at £1.02?<\/p>","o":[{"l":"A","h":"20p"},{"l":"B","h":"18p"},{"l":"C","h":"2p"},{"l":"D","h":"Nil"}],"a":"C","e":"<p>Time value = premium - intrinsic value.<br/> Intrinsic value for a put = strike - underlying asset value = 1.20 - 1.02 = 18p.<br/> Therefore time value = 2p.<\/p>"},{"s":4,"n":38,"id":"1037589","q":"<p>Which of the following reasons BEST explains why a management company would monitor the delta of its portfolio?<\/p>","o":[{"l":"A","h":"To assess interest rate changes"},{"l":"B","h":"To track the price change in the underlying asset"},{"l":"C","h":"To predict the changes in implied volatility"},{"l":"D","h":"To maintain a delta neutral position"}],"a":"D","e":"<p>The best answer here is to maintain a delta neutral position.<\/p>"},{"s":4,"n":39,"id":"1002749","q":"<p>An investor is long 15 futures contracts and also has five call options, each with a Delta of 0.7. What is the cumulative Delta of the position?<\/p>","o":[{"l":"A","h":"5.7"},{"l":"B","h":"20"},{"l":"C","h":"3.5"},{"l":"D","h":"18.5"}],"a":"D","e":"<p>15 long-futures = 15 x 1 = 15<br/> 5 long-calls = 5 x 0.7 = 3.5<br/> -----<br/> Cumulative Delta 18.5<\/p>"},{"s":4,"n":40,"id":"1002706","q":"<p>Which of the following best describes the fair value of a future?<\/p>","o":[{"l":"A","h":"The difference between the cash price and the future's price of the underlying asset"},{"l":"B","h":"The price at which both parties agree to do the transaction in the underlying asset on the delivery date"},{"l":"C","h":"The mid-market price of the future"},{"l":"D","h":"The cost of buying the asset in the cash markets and holding it to the delivery date of the future"}],"a":"D","e":"<p>Cash and carry arbitrage implies that the fair value of a future is equal to the cash price PLUS the costs-of-carry.<\/p>"},{"s":4,"n":41,"id":"1002743","q":"<p>Which of the following would impact upon the price of an option?<\/p><p class=\"rom\"><b>I<\/b> Time to expiry<\/p><p class=\"rom\"><b>II<\/b> Market sentiment<\/p><p class=\"rom\"><b>III<\/b> Market depth<\/p><p class=\"rom\"><b>IV<\/b> Volatility of the underlying security<\/p>","o":[{"l":"A","h":"I only"},{"l":"B","h":"I and II"},{"l":"C","h":"I, II, III"},{"l":"D","h":"I, II, III, IV"}],"a":"D","e":"<p>All these factors would impact on the current market price of an option contract.<\/p>"},{"s":4,"n":42,"id":"1036703","q":"<p>A three-month call option with a strike price of $30 is trading at $3. A three-month put option with a strike of $30 is trading at $2.75. The underlying stock is priced at $31 and interest rates are 12%. What is the net profit available to an arbitrageur according to put/call parity theory?<\/p>","o":[{"l":"A","h":"$0.75"},{"l":"B","h":"$1.59"},{"l":"C","h":"$1.74"},{"l":"D","h":"$2.25"}],"a":"B","e":"<p>This requires an application of put-call parity theorem.<\/p><p>C - P = S - K/(1+r)^t<\/p><p>In theory:<\/p><p>3 - 2.75 = 31- 30/(1+0.12)^0.25<\/p><p>0.25 = 1.84<\/p><p>But it clearly doesn't, meaning there is an arbitrage opportunity.<\/p><p>Profit available therefore 1.84 - 0.25 = $1.59.<\/p>"},{"s":4,"n":43,"id":"1002751","q":"<p>Which of the following would you normally expect to be negative?<\/p>","o":[{"l":"A","h":"Intrinsic value"},{"l":"B","h":"Time value"},{"l":"C","h":"Call option Deltas"},{"l":"D","h":"Put option Deltas"}],"a":"D","e":"<p>Intrinsic and time value in an option's premium can only go down as far as zero (they can never be negative). Call option Deltas are positive as the premium moves in the same direction as the underlying asset. Put options, on the other hand, increase in value when the underlying falls. The Delta is therefore negative.<\/p>"},{"s":4,"n":44,"id":"1002758","q":"<p>The rate of change of Delta for a given change in the price of the underlying is called:<\/p>","o":[{"l":"A","h":"Vega"},{"l":"B","h":"Theta"},{"l":"C","h":"Gamma"},{"l":"D","h":"Rho"}],"a":"C","e":"<p>Gamma measures the rate of change of Delta, given a change in the underlying.<\/p>"},{"s":4,"n":45,"id":"1014215","q":"<p>If an investor expects the basis to strengthen, he thinks that:<\/p>","o":[{"l":"A","h":"Basis will become more positive: buy the cash and sell the future"},{"l":"B","h":"Basis will become more positive: buy the future and sell the cash"},{"l":"C","h":"Basis will become more negative: buy the cash and sell the future"},{"l":"D","h":"Basis will become more negative: buy the future and sell the cash"}],"a":"A","e":"<p>When basis strengthens, the cash price is rising relative to the futures price, so basis becomes more positive. Therefore, the investor will want to buy the cash and sell the future.<\/p>"},{"s":4,"n":46,"id":"1002760","q":"<p>A speculator is short four futures on an asset. In addition, he is long three deeply in-the-money put options on the same underlying. What is the net position?<\/p>","o":[{"l":"A","h":"Long one"},{"l":"B","h":"Short one"},{"l":"C","h":"Long seven"},{"l":"D","h":"Short seven"}],"a":"D","e":"<p>Deeply in-the-money options will have a delta of 1. Bearish positions have a negative Delta. The cumulative delta here would therefore be:<br/> Short futures : -4 Long puts : -3<br/> Total :-7<\/p>"},{"s":4,"n":47,"id":"1036903","q":"<p>What is the delta of a position combining six short futures and eight long at the money calls?<\/p>","o":[{"l":"A","h":"2"},{"l":"B","h":"(2)"},{"l":"C","h":"4"},{"l":"D","h":"(4)"}],"a":"B","e":"<p>6 x (1) = (6). 8 x 0.5 = 4. Overall (6) + 4 = (2)<\/p>"},{"s":4,"n":48,"id":"1002740","q":"<p>If interest rates rise, what is the likely affect on equity option premiums?<\/p>","o":[{"l":"A","h":"Call prices rise and put prices remain unchanged"},{"l":"B","h":"Call prices rise and put prices fall"},{"l":"C","h":"Put prices rise and call prices remain unchanged"},{"l":"D","h":"Put prices rise and call prices fall"}],"a":"B","e":"<p>If interest rates rise, investors will gain exposure to share prices through buying call options rather than buying the underlying share. As a result, the demand for call options increases and premiums rise. The opposite is true for puts.<\/p>"},{"s":4,"n":49,"id":"1036757","q":"<p>Which of the following best describes a backwardation market?<\/p>","o":[{"l":"A","h":"A market where the cash price is greater than the far price"},{"l":"B","h":"A market where the far price is greater than the near price"},{"l":"C","h":"A market with more sellers than buyers"},{"l":"D","h":"A market where far prices exceed near prices"}],"a":"A","e":"<p>Note: A contango market means that far-dated prices are greater than near-dated prices. This is a normal market because of the costs of carry increasing far-dated prices. Option A, therefore, describes a backwardation market.<\/p>"},{"s":4,"n":50,"id":"1002765","q":"<p>The net cumulative Delta of being long eight futures and long six calls with a Delta of 0.4 is:<\/p>","o":[{"l":"A","h":"6.4"},{"l":"B","h":"10.4"},{"l":"C","h":"12.4"},{"l":"D","h":"9.4"}],"a":"B","e":"<p>Long eight futures = 8 x +1 = +8.<br/> Long six calls = 6 x +0.4 = +2.4.<br/> Total Delta = 10.4.<\/p>"},{"s":4,"n":51,"id":"1037014","q":"<p>The FTSE 100 is currently at 6,200pts. Which of the following is the closest to the fair value of a 29 day FTSE 100 future if financing costs are 6% and dividend yields are 4%?<\/p>","o":[{"l":"A","h":"6,190pts"},{"l":"B","h":"6,200pts"},{"l":"C","h":"6,210pts"},{"l":"D","h":"6,229pts"}],"a":"C","e":"<p>Fair value = Cash + costs of carry<br/> Fair value = 6,200+ [6,200 x (.06 -.04) x 29/365] = 6,210<\/p>"},{"s":4,"n":52,"id":"1002734","q":"<p>If the price of the underlying security is 190, what is the time value of the December 200 call, which has 60 days to expiry and is trading at 25?<\/p>","o":[{"l":"A","h":"Zero"},{"l":"B","h":"10"},{"l":"C","h":"15"},{"l":"D","h":"25"}],"a":"D","e":"<p>The call option is out-the-money. This means it has no intrinsic value. Therefore, the entire premium is time value.<\/p>"},{"s":4,"n":53,"id":"1002735","q":"<p>What might you use to determine implied volatility?<\/p>","o":[{"l":"A","h":"Statistical analysis"},{"l":"B","h":"Pricing models"},{"l":"C","h":"Regression studies"},{"l":"D","h":"Trading estimates"}],"a":"B","e":"<p>Implied volatility refers to the volatility implied in a premium quoted by the market. In order to extract this you would need a pricing formula such as Black-Scholes.<\/p>"},{"s":4,"n":54,"id":"1036955","q":"<p>Which of the following options would have the greatest time value if the underlying is trading at 71?<\/p>","o":[{"l":"A","h":"June 90 call"},{"l":"B","h":"June 70 call"},{"l":"C","h":"June 110 call"},{"l":"D","h":"June 50 call"}],"a":"B","e":"<p>If everything else is constant the time value of an option is greatest when it is at-the-money.<\/p>"},{"s":4,"n":55,"id":"1036841","q":"<p>Which of the following best describes a contango market?<\/p>","o":[{"l":"A","h":"Near and far months priced the same"},{"l":"B","h":"Far month priced below near month"},{"l":"C","h":"Near month priced below far month"},{"l":"D","h":"Market close to backwardation"}],"a":"C","e":"<p>A contango market is where near month futures are priced below far month. This is a consequence of costs of carry.<\/p>"},{"s":4,"n":56,"id":"1014216","q":"<p>A future is priced at 110, the 100 strike call option on the future is trading at 12, and the 100 strike put option on the future is trading at 9. What would be the best trade to execute to take advantage of this mispricing?<\/p>","o":[{"l":"A","h":"Nothing, the pricing is correct"},{"l":"B","h":"Reversal"},{"l":"C","h":"Combination"},{"l":"D","h":"Straddle"}],"a":"B","e":"<p>Using put-call parity theorem C - P=S - K.<br/> Here, C - P (i.e. 12 - 9) should equal S - K. 12 - 9 = 3. So, S should be 3 greater than K. If K is 100, then S should be 103. If the futures price were 103, there would be no arbitrage opportunity. However, the future is at 110. Since the future is priced higher than it ought to be, sell the future, and create a synthetic long (by buying the call and selling the put). The name of this trade is a 'reversal'. <\/p>"},{"s":4,"n":57,"id":"1026877","q":"<p>The index is currently at 3,800 points. The dividend yield is 2% and interest rates are 5%. What is the fair value of the 29 day future?<\/p>","o":[{"l":"A","h":"3,791"},{"l":"B","h":"3,800"},{"l":"C","h":"3,914"},{"l":"D","h":"3,809"}],"a":"D","e":"<p>This is calculated as:<br/> Index value + index value(Interest rate - dividend yield pro-rated for 29 days)<br/> 3,800 + 3,800 x ((5% - 2%) x 29 / 365) = 3,809<\/p>"},{"s":4,"n":58,"id":"4211277","q":"<p>When considering cash-flow pricing for a property derivative, which component is least likely to directly influence the valuation compared to other asset classes like equities or bonds?<\/p>","o":[{"l":"A","h":"Expected rental income"},{"l":"B","h":"Property appreciation rates"},{"l":"C","h":"Interest rate changes"},{"l":"D","h":"EBITDA margins"}],"a":"D","e":"<p>EBITDA margins are primarily relevant for corporate financial performance and equity valuation rather than property. Property derivatives are more directly influenced by factors like rental income, appreciation rates, and interest rates, making EBITDA margins less relevant in this context.<\/p>"},{"s":4,"n":59,"id":"1036901","q":"<p>Which of the following options would have the highest delta?<\/p>","o":[{"l":"A","h":"A far-dated deeply out-of-the-money call"},{"l":"B","h":"A near-dated deeply out-of-the-money put"},{"l":"C","h":"A near dated at-the-money call"},{"l":"D","h":"A far-dated deeply in the money put"}],"a":"D","e":"<p>In the money options have the highest delta.<br/> It is the convention to ignore the sign - therefore -1 and +1 are treated in the same way.<\/p>"},{"s":4,"n":60,"id":"1016990","q":"<p>An investor who sells the expensive contract and takes an offsetting position in the cash market is undertaking which of the following trades?<\/p>","o":[{"l":"A","h":"Selling basis"},{"l":"B","h":"Cost-of-carry"},{"l":"C","h":"Reverse cash and carry"},{"l":"D","h":"Cash/Futures arbitrage"}],"a":"D","e":"<p>The best answer would be Cash and Carry arbitrage but this is not available.<br/> Given the choice the correct answer is Cash/Futures arbitrage. Cash/Future arbitrage is a generic term that can be used to describe a Cash and Carry arbitrage OR a Reverse Cash and Carry arbitrage.<br/> Cash and carry: buy cash, sell future. Reverse cash and carry: sell cash and buy the future.<\/p>"},{"s":4,"n":61,"id":"1002708","q":"<p>In what state would the market be if there was adequate supply and storage?<\/p>","o":[{"l":"A","h":"Contango"},{"l":"B","h":"Backwardation"},{"l":"C","h":"Flat-yield curve"},{"l":"D","h":"Inverted-yield curve"}],"a":"A","e":"<p>Adequate supply and adequate storage all point to normal market conditions. Normally markets are in contango.<\/p>"},{"s":4,"n":62,"id":"1051524","q":"<p>According put-call parity, what would be the best course of action if the put was over valued in comparison to the call?<\/p>","o":[{"l":"A","h":"Sell the call, buy the put and sell the cash"},{"l":"B","h":"Sell the call, buy the put and buy the cash"},{"l":"C","h":"Buy the call, sell the put and sell the cash"},{"l":"D","h":"Buy the call, sell the put and buy the cash"}],"a":"C","e":"<p>We buy the call because it is cheap, and sell the put because it is expensive. This leaves us with a synthetic long. Therefore, to eliminate risk, we sell the cash and are left with a flat overall position.<\/p>"},{"s":4,"n":63,"id":"4211274","q":"<p>Which of the following statements best describes the concept of cash-flow pricing in financial derivatives?<\/p>","o":[{"l":"A","h":"Cash-flow pricing uses a discount rate to convert expected future cash flows into present value."},{"l":"B","h":"Cash-flow pricing involves setting derivative prices based on future earnings projections."},{"l":"C","h":"Cash-flow pricing determines the value of derivatives solely based on historical cash flows."},{"l":"D","h":"Cash-flow pricing reflects the intrinsic value of a derivative independent of market conditions."}],"a":"A","e":"<p>Cash-flow pricing involves calculating the present value of expected future cash flows using a discount rate. This method is commonly used to determine the fair value of financial instruments, including derivatives, by considering the time value of money.<\/p>"},{"s":4,"n":64,"id":"1065120","q":"<p>According to put/call theorem if the premium of the call is considered cheaper relative to the put, which of the following strategies would benefit most?<\/p>","o":[{"l":"A","h":"Buy the call, sell the put and sell the future"},{"l":"B","h":"Sell the call, buy the put and sell the future"},{"l":"C","h":"Buy the call, sell the put and buy the future"},{"l":"D","h":"Sell the call, buy the put and buy the future"}],"a":"A","e":"<p>If the call is relatively cheap, then buy the call, sell the put and sell the future. This creates an offsetting position to lock-in an arbitrage profit.<\/p>"},{"s":4,"n":65,"id":"1002710","q":"<p>A market where near-dated prices are lower than far-dated prices is called:<\/p>","o":[{"l":"A","h":"Backwardation"},{"l":"B","h":"Synthetic"},{"l":"C","h":"Contango"},{"l":"D","h":"Basis"}],"a":"C","e":"<p>A backwardation or 'back' market is when far-dated prices are lower than near-dated prices.<\/p>"},{"s":4,"n":66,"id":"1002759","q":"<p>Provided with the following information, which of the following is true? <br/> - Share price = 500p - Time value = 25p - Intrinsic value = 10p<\/p>","o":[{"l":"A","h":"The option is out-of-the-money by 25p"},{"l":"B","h":"The option is out-the-money by 10p"},{"l":"C","h":"The option is in-the-money by 25p"},{"l":"D","h":"The option is in-the-money by 10p"}],"a":"D","e":"<p>If an option has intrinsic value (calls and puts) then it must be in-the-money.<\/p>"},{"s":4,"n":67,"id":"1002709","q":"<p>If interest rates increase, what is the effect on the cost-of-carry element of the fair value of a future?<\/p>","o":[{"l":"A","h":"The cost-of-carry decreases"},{"l":"B","h":"The cost-of-carry increases"},{"l":"C","h":"There is no impact on the cost-of-carry"},{"l":"D","h":"The cost-of-carry could be affected either way"}],"a":"B","e":"<p>Interest rates have to be taken into consideration when calculating cost-of-carry. If interest rates increase, then the costs involved in buying spot and carrying also increase.<\/p>"},{"s":4,"n":68,"id":"1065102","q":"<p>The S&amp;P 500 currently stands at 1640. The dividend yield is 2.5% and the cost of borrowing is 2%. Calculate the value of the 6 month future?<\/p>","o":[{"l":"A","h":"1631.8"},{"l":"B","h":"1635.9"},{"l":"C","h":"1644.1"},{"l":"D","h":"1648.2"}],"a":"B","e":"<p>Fair Value = cash/spot price + net cost of carry<br/> Fair Value = 1640 + ( (0.02-0.025) x 0.5 x 1640)<br/> Fair Value = 1635.9<\/p>"},{"s":4,"n":69,"id":"1017337","q":"<p>Which of the following would be out-of-the money options?<\/p><p class=\"rom\"><b>I<\/b> A call option where the price of the underlying is above the exercise price<\/p><p class=\"rom\"><b>II<\/b> A call option where the price of the underlying is below the exercise price<\/p><p class=\"rom\"><b>III<\/b> A put option where the price of the underlying is above the exercise price<\/p><p class=\"rom\"><b>IV<\/b> A put option where the price of the underlying is below the exercise price<\/p>","o":[{"l":"A","h":"I and II"},{"l":"B","h":"II and IV"},{"l":"C","h":"II and III"},{"l":"D","h":"I and IV"}],"a":"C","e":"<p>A call option is out-of-the-money if the strike is higher than the value of the underlying.<br/> A put option is out-of-the-money if the strike is lower than the value of the underlying.<\/p>"},{"s":4,"n":70,"id":"1002754","q":"<p>The shares of a company are currently at 400p. The date is January 2025. Which of the following call options has the highest time value?<\/p>","o":[{"l":"A","h":"April 2025 and strike 380p"},{"l":"B","h":"October 2025 and strike 380p"},{"l":"C","h":"April 2025 and strike 360p"},{"l":"D","h":"October 2025 and strike 360p"}],"a":"B","e":"<p>Options with the longest remaining life (in this question, the Octobers) have the greatest time value. Of these, the option which is closest to being at-the-money will have the greatest time value.<\/p>"},{"s":4,"n":71,"id":"1014214","q":"<p>All of the following are the main components of cost-of-carry, except:<\/p>","o":[{"l":"A","h":"Financing costs"},{"l":"B","h":"Storage costs"},{"l":"C","h":"Insurance costs"},{"l":"D","h":"Supply and demand"}],"a":"D","e":"<p>Supply and demand determines the cash price of the underlying.<\/p>"},{"s":4,"n":72,"id":"1015775","q":"<p>Which is true of a contango market?<\/p>","o":[{"l":"A","h":"Nearby prices are at a premium to forward prices"},{"l":"B","h":"Nearby prices are at a discount to forward prices"},{"l":"C","h":"Nearby and forward prices are equal"},{"l":"D","h":"Bid prices are higher than ask prices"}],"a":"B","e":"<p>In a contango market, near-dated contracts have a lower cost-of-carry, so are a lower price than far-dated contracts. Do not be put off by the unusual terminology here (nearby and forward).<\/p>"},{"s":4,"n":73,"id":"1026879","q":"<p>With respect to time value, which of the following is true?<\/p>","o":[{"l":"A","h":"Time value decreases at a slower rate for shorter dated options"},{"l":"B","h":"Time value is nil at expiration"},{"l":"C","h":"Time value is greatest for options deeply in the money"},{"l":"D","h":"European options have more time value than American options"}],"a":"B","e":"<p>Time value is nil at expiry and time decay increases as the option nears expiry.<\/p>"},{"s":4,"n":74,"id":"1002744","q":"<p>If the Delta of a long-put option is -0.65, what would the Delta of the corresponding long-call position be?<\/p>","o":[{"l":"A","h":"-0.65"},{"l":"B","h":"-0.35"},{"l":"C","h":"+0.65"},{"l":"D","h":"+0.35"}],"a":"D","e":"<p>The combined Delta of a put and a call with the same underlying, strikes and expiries equals 1 (ignoring positive or negative signs). Therefore, if the Delta of the long put is -0.65, the Delta of the corresponding long call must be +0.35.<\/p>"},{"s":4,"n":75,"id":"4211271","q":"<p>Which of the following best describes the concept of arbitrage-free pricing in relation to derivatives?<\/p>","o":[{"l":"A","h":"It involves determining the fair value of options based on historical volatility."},{"l":"B","h":"It is the practice of exploiting price discrepancies for a risk-free profit."},{"l":"C","h":"It ensures that futures prices reflect the cost of carry from the cash market."},{"l":"D","h":"It requires futures prices to be set above cash prices to prevent arbitrage."}],"a":"C","e":"<p>Arbitrage-free pricing involves setting the futures price so that it reflects the cash price of the asset plus the cost of carry, which includes factors like interest and storage costs. This prevents arbitrage opportunities by aligning the futures price with the cost of holding the asset until delivery.<\/p><p> <\/p><p> <\/p><p> <\/p>"},{"s":4,"n":76,"id":"1015876","q":"<p>An option has a premium of 9, intrinsic value of 7 and the underlying is at 20. Which of the following is true?<\/p>","o":[{"l":"A","h":"Will breakeven if exercised"},{"l":"B","h":"It is not worth exercising"},{"l":"C","h":"It is in the money"},{"l":"D","h":"It is out of the money"}],"a":"C","e":"<p>Intrinsic value measures the 'moneyness' of an option. If intrinsic value is positive, then the option would be exercised by the holder (the writer is then obliged to perform their obligations). If intrinsic value is zero, then the option would be abandoned. Intrinsic value can never be negative<\/p><p>The option is in-the-money by seven. It will not breakeven until in-the-money by at least nine. It is better to exercise to recover intrinsic value than abandon and sacrifice entire premium.<\/p>"},{"s":4,"n":77,"id":"1002857","q":"<p>An investor is long four index futures. The cash price is 5,250 and the future is at 5,260. Calculate the value of this position if the tick size is £5 per half index point?<\/p>","o":[{"l":"A","h":"£21,000"},{"l":"B","h":"£21,040"},{"l":"C","h":"£210,000"},{"l":"D","h":"£210,400"}],"a":"D","e":"<p>5260 x £10 x 4 = £210,400<br/> Even though the tick size is £5 per half index point it is easier to multiply the number of points by £10, as the contract is worth £10 per index point.<\/p>"},{"s":4,"n":78,"id":"1002700","q":"<p>Which of the following is TRUE of basis?<\/p>","o":[{"l":"A","h":"Basis always equals the cost of carry"},{"l":"B","h":"Basis is calculated by deducting the future's price from the cash price"},{"l":"C","h":"When the future's price increases relative to cash, the basis is said to strengthen"},{"l":"D","h":"Basis risk can be avoided by hedging"}],"a":"B","e":"<p>Basis is not always the cost-of-carry, as the future may trade away from its fair value. Choice 'When the future's price increases relative to cash, the basis is said to strengthen' describes basis weakening and basis risk cannot be hedged against.<br/> 'Basis is calculated by deducting the future's price from the cash price' is the correct answer.<\/p>"},{"s":4,"n":79,"id":"1037583","q":"<p>How would a hedger attempt to eliminate basis risk?<\/p>","o":[{"l":"A","h":"Hold the derivative investment to expiry"},{"l":"B","h":"Structure the hedge using OTC derivatives"},{"l":"C","h":"Structure the hedge using exchange traded derivatives"},{"l":"D","h":"Create synthetic positions using futures and options"}],"a":"A","e":"<p>The best answer here is to hold the derivative until delivery where basis will be zero.<\/p>"},{"s":4,"n":80,"id":"1015820","q":"<p>In which of the following would Gamma be greatest?<\/p>","o":[{"l":"A","h":"An OTM option with three months to expiry"},{"l":"B","h":"An ATM option with three months to expiry"},{"l":"C","h":"An OTM option with six months to expiry"},{"l":"D","h":"An ATM option with six months to expiry"}],"a":"B","e":"<p>As time to expiry decreases, Gamma (the rate of change in the gradient of the
